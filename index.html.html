自由","深夜は拡声器を使用してはいけない"],["政教分離","最高裁判所","外部的行為","一定の目的"]],"mode":"constitution"}],"18":[{"text":"国家の行為が、\n宗教との関係で違憲になるか\nを判断するときは、\n•\t行為の目的\n•\t行為の効果\n•\t宗教との関係\n•\t社会的・文化的背景\n•\t宗教への援助・助長・圧迫の程度\nなどを考える。\n\n⸻","blanks":["国家の行為","行為の目的"],"options":[["国家の行為","行為の目的","宗教上の信念","宗教団体"],["行為の目的","政教分離","国民主権","特定の宗教"]],"mode":"constitution"}],"19":[{"text":"政教分離の判例では、\n目的・効果\nが重要な判断要素となる。\n大まかには、\n目的\nその行為は何のために行われたのか。\n効果\nその行為によって宗教を援助・助長・圧迫する効果があるか。\nという観点。\nただし、\n目的と効果だけを機械的に当てはめれば終わり\nではなく、行為の具体的な性質や社会的背景も考慮する。\n\n⸻","blanks":["政教分離","社会的背景"],"options":[["政教分離","恣意的","デモ行進","宗教的行為"],["社会的背景","集会の自由","国家の行為","表現の内容"]],"mode":"constitution"}],"20":[{"text":"宗教上の信念から、\n一定の行為を拒否したい\nという問題が生じる場合がある。\nここでは、\n信教の自由\nと\n法律上の義務\nとの衝突が問題となる。\nしたがって、\n宗教上の信念があるから必ず法律上の義務を免除される\nとは限らない。\n\n⸻","blanks":["信教の自由","宗教上の信念"],"options":[["信教の自由","学問の自由","政治的表現","宗教上の信念"],["宗教上の信念","明確性の原則","一定の目的","政教分離の目的"]],"mode":"constitution"}],"21":[{"text":"憲法21条は、\n集会、結社及び言論、出版その他一切の表現の自由\nを保障する。\n表現の自由とは、\n自分の思想・意見・情報などを外部に表明する自由\nである。\n\n⸻","blanks":["表現の自由","憲法","思想"],"options":[["表現の自由","良心の自由","二重の基準論","宗教上の信念"],["憲法","政教分離","結成","国家の行為"],["思想","国民主権","内心の自由","合法的"]],"mode":"constitution"}],"22":[{"text":"表現の自由には、\n自己実現\n自分の人格・思想を外部に表現する。\n自己統治\n国民が政治について情報を得て、意見を形成し、政治に参加する。\nという二つの重要な価値がある。\n特に、\n政治的表現\nは民主主義にとって極めて重要。\n\n⸻","blanks":["政治的表現","表現の自由","思想"],"options":[["政治的表現","国家の行為","デモ行進","学問の自由"],["表現の自由","プライバシ","行為の目的","政治的表現"],["思想","宗教団体","民主主義","取材の自由"]],"mode":"constitution"}],"23":[{"text":"表現には、\n•\t言論\n•\t出版\n•\t新聞\n•\t放送\n•\t映画\n•\t芸術\n•\t音楽\n•\tインターネット\n•\tSNS\n•\tビラ\n•\tデモ\nなどが含まれ得る。\nつまり、\n表現＝言葉だけ\nではない。\n\n⸻","blanks":["インタ","表現"],"options":[["インタ","憲法","内心の自由","良心"],["表現","検閲","内心の自由","インタ"]],"mode":"constitution"}],"24":[{"text":"現代では、\nSNS\nも重要な表現手段となっている。\n例えば、\n•\tX\n•\tInstagram\n•\tYouTube\n•\tTikTok\n•\tブログ\nなど。\nしたがって、\nインターネット上の表現\nについても憲法21条の問題が生じる。\n\n⸻","blanks":["インターネット上の表現","憲法"],"options":[["インターネット上の表現","政教分離の目的","信仰しない自由","宗教を信じる自由"],["憲法","一定の目的","国家の行為","思想"]],"mode":"constitution"}],"25":[{"text":"表現の中でも特に重要なのが、\n政治的表現\nである。\n例えば、\n•\t政府批判\n•\t政策への反対\n•\t選挙運動\n•\t政治的意見\n•\t社会問題への批判\nなど。\n政治的表現は、\n民主主義そのものに関係する。\nそのため、特に強く保障されるべき領域とされる。\n\n⸻","blanks":["政治的表現","選挙"],"options":[["政治的表現","報道の自由","学問の自由","一定の目的"],["選挙","宗教団体","受け手","国民主権"]],"mode":"constitution"}],"26":[{"text":"国民が、\n政府や社会について情報を知ること\nも民主主義にとって重要。\nそこで、\n知る権利\nという考え方がある。\n知る権利は、\n表現の自由の「受け手」の側面\nとの関係で理解される。\n\n⸻","blanks":["受け手","知る権利","表現の自由"],"options":[["受け手","検閲","国家の行為","知る権利"],["知る権利","デモ行進","宗教的行為","大学の自治"],["表現の自由","デモ行進","宗教団体","刑法上の犯罪"]],"mode":"constitution"}],"27":[{"text":"表現の自由は、\n「発信する自由」\nだけではない。\n情報を、\n受け取る\n集める\n利用する\nことも重要。\nしたがって、\n情報\n↓\n発信\n↓\n受信\n↓\n国民が判断\n↓\n民主主義\nという関係がある。\n\n⸻","blanks":["発信する自由","表現の自由"],"options":[["発信する自由","社会的背景","外部的行為","内心と外部行為"],["表現の自由","政教分離","社会的背景","一定の目的"]],"mode":"constitution"}],"28":[{"text":"新聞・テレビ・インターネットなどによる、\n報道活動\nも表現の自由によって保障される。\n報道には、\n国民に情報を提供する役割\nがある。\n\n⸻","blanks":["表現の自由","インタ"],"options":[["表現の自由","一定の目的","デモ行進","表現の内容"],["インタ","複数人","信教の自由","受け手"]],"mode":"constitution"}],"29":[{"text":"報道のために、\n情報を集める取材活動\nも重要。\nただし、\n「取材の自由＝何をしても許される」\nではない。\n他人の権利や法的利益との調整が必要になる。\n\n⸻","blanks":["取材の自由＝何をしても許される","取材の自由"],"options":[["取材の自由＝何をしても許される","政府批判は禁止","信仰しない自由","集会・結社の自由"],["取材の自由","報道の自由","デモ行進","政教分離"]],"mode":"constitution"}],"30":[{"text":"報道機関による表現活動は、\n国民の知る権利\nにも関係する。\nそのため、\n報道の自由は民主政治の基盤の一つ\nとして重要。\n\n⸻","blanks":["報道の自由","知る権利"],"options":[["報道の自由","信教の自由","プライバシ","他人の名誉"],["知る権利","恣意的","受け手","良心の自由"]],"mode":"constitution"}],"31":[{"text":"国家が、\n「この意見は政府にとって不都合だから禁止する」\nというように、\n表現の内容そのものを理由として規制する\n場合には、重大な憲法問題となる。\n\n⸻","blanks":["憲法","表現の内容"],"options":[["憲法","刑罰","宗教団体","知る権利"],["表現の内容","宗教団体","国家の行為","刑法上の犯罪"]],"mode":"constitution"}],"32":[{"text":"表現規制には、\n内容規制\n表現の内容を理由として規制する。\n例：\n「政府批判は禁止」\n内容中立規制\n内容ではなく、場所・時間・方法などを規制する。\n例：\n「深夜は拡声器を使用してはいけない」\nというような区別。\n一般に、\n内容規制の方が表現の自由への危険が大きい。\n\n⸻","blanks":["政府批判は禁止","深夜は拡声器を使用してはいけない","表現の自由","表現規制"],"options":[["政府批判は禁止","内心の自由","思想・良心の自由","信教の自由"],["深夜は拡声器を使用してはいけない","政府に批判的だから研究を禁止する","宗教と国家を完全に無関係にする","怖いからやめておこう"],["表現の自由","結社の自由","報道の自由","国民主権"],["表現規制","政教分離","合法的","特定の宗教"]],"mode":"constitution"}],"33":[{"text":"表現を規制する法律が、\n何が禁止されているのか分からない\nほど曖昧だと、\n国民が何をしてよいのか分からなくなる。\nまた、\n行政・警察などによる恣意的な運用\nの危険もある。\nそこで、\n明確性の原則\nが問題となる。\n\n⸻","blanks":["明確性の原則","恣意的"],"options":[["明確性の原則","信教の自由","特定の宗教","二重の基準論"],["恣意的","結成","宗教団体","憲法"]],"mode":"constitution"}],"34":[{"text":"法律が、\n禁止する必要のない表現まで広く禁止してしまう\n場合、\n過度に広汎な規制\nとして問題になる。\n特に表現の自由では、\n違法な表現だけでなく、合法的な表現まで萎縮させる\n危険がある。\n\n⸻","blanks":["表現の自由","合法的"],"options":[["表現の自由","国家の行為","集会の自由","国民主権"],["合法的","教育","他人の名誉","思想"]],"mode":"constitution"}],"35":[{"text":"国家による規制が厳しすぎると、\n本来なら合法な表現まで、人々が「怖いからやめておこう」と考えてしまう。\nこれを、\n萎縮効果\nという。\n表現の自由では非常に重要な考え方。\n\n⸻","blanks":["怖いからやめておこう","萎縮効果","表現の自由"],"options":[["怖いからやめておこう","宗教を信じる自由","政府批判だから禁止する","精神的自由と経済的自由"],["萎縮効果","内心の自由","一定の目的","最高裁判所"],["表現の自由","信教の自由","国家の行為","政教分離"]],"mode":"constitution"}],"36":[{"text":"国家が、\n表現が行われる前に禁止する\nことを、\n事前抑制\nという。\n例えば、\n出版前に内容を審査して出版を禁止する\nなど。\n表現の自由に対する事前抑制は、\n特に慎重に扱われる。\n最高裁の北方ジャーナル事件でも、人格権に基づく出版物の事前差止めについて、例外的な要件が示されている。(最高裁判所)\n\n⸻","blanks":["事前抑制","最高裁判所","表現の自由"],"options":[["事前抑制","大学の自治","特定の宗教","学問の自由"],["最高裁判所","内心の自由","大学の自治","宗教団体"],["表現の自由","国民主権","報道の自由","明確性の原則"]],"mode":"constitution"}],"37":[{"text":"憲法21条2項は、\n検閲は、これをしてはならない\nと定める。\n検閲は、\n国家が主体となり、思想内容等の表現物を対象として、発表前に内容を審査し、不適当と認めるものの発表を禁止する\nというようなものを指す。\n\n⸻","blanks":["検閲","憲法","思想"],"options":[["検閲","恣意的","取材の自由","選挙"],["憲法","信教の自由","萎縮効果","刑罰"],["思想","選挙","報道の自由","複数人"]],"mode":"constitution"}],"38":[{"text":"この二つは同じではない。\n検閲\n憲法21条2項が明文で禁止する。\n事前抑制\n表現前に規制する仕組み一般。\n検閲は事前抑制の一種だが、\n事前抑制＝すべて憲法21条2項の「検閲」\nではない。\nただし、\n検閲に該当しない事前差止めも、表現の自由との関係で厳格に問題となる。\n\n⸻","blanks":["検閲","表現の自由","事前抑制","憲法"],"options":[["検閲","刑罰","結成","国民主権"],["表現の自由","刑法上の犯罪","プライバシ","集会の自由"],["事前抑制","インタ","デモ行進","表現規制"],["憲法","良心","信教の自由","思想"]],"mode":"constitution"}],"39":[{"text":"出版する自由も、\n表現の自由\nとして保障される。\n新聞・雑誌・書籍などについて、\n国家が内容を理由に出版を制限する\n場合には強い憲法上の問題が生じる。\n\n⸻","blanks":["表現の自由","憲法"],"options":[["表現の自由","大学の自治","良心の自由","宗教上の信念"],["憲法","選挙","萎縮効果","取材の自由"]],"mode":"constitution"}],"40":[{"text":"集会の自由とは、\n複数の人が一定の目的のために集まる自由\nである。\n例えば、\n•\t政治集会\n•\t講演会\n•\tデモ\n•\t市民集会\nなど。\n\n⸻","blanks":["集会の自由","一定の目的"],"options":[["集会の自由","他人の名誉","宗教団体","宗教上の信念"],["一定の目的","学問の自由","良心の自由","刑法上の犯罪"]],"mode":"constitution"}],"41":[{"text":"集会は、\n複数人が意見を形成・交換するための重要な手段。\n特に、\n政治的集会\nは民主主義において重要。\n\n⸻","blanks":["民主主義","複数人"],"options":[["民主主義","インタ","恣意的","宗教的行為"],["複数人","恣意的","宗教団体","検閲"]],"mode":"constitution"}],"42":[{"text":"自治体などが、\n公共施設の利用を制限する\n場合には、\n集会の自由\nとの関係が問題になる。\n規制については、\n•\t危険の程度\n•\t規制目的\n•\t施設の性質\n•\t代替手段\nなどを考える。\n\n⸻","blanks":["集会の自由","公共施設の利用"],"options":[["集会の自由","政教分離","国民主権","二重の基準論"],["公共施設の利用","居住・移転の自由","信仰しない自由","取材の自由"]],"mode":"constitution"}],"43":[{"text":"デモ行進も、\n表現活動の一種\nとして保障される。\nしかし、\n道路を使用する\nなど、他者や公共空間との調整が必要。\nしたがって、\n一定の合理的な規制\nが認められる場合がある。\n\n⸻","blanks":["デモ行進","表現活動の一種"],"options":[["デモ行進","報道の自由","国家の行為","取材の自由"],["表現活動の一種","宗教上の信念","個人の人格的利益","一定の目的"]],"mode":"constitution"}],"44":[{"text":"結社とは、\n複数人が一定の目的のために継続的に結合すること。\n結社の自由には、\n結社を作る自由\n結社に加入する自由\n結社から離脱する自由\nなどが含まれる。\n\n⸻","blanks":["結社の自由","一定の目的"],"options":[["結社の自由","報道の自由","政教分離","最高裁判所"],["一定の目的","外部的行為","結社の自由","良心の自由"]],"mode":"constitution"}],"45":[{"text":"政党などの政治的結社は、\n国民が政治的意思を形成・表明するために重要。\nそのため、\n結社の自由\nだけでなく、\n国民主権・民主主義\nとも深く関係する。\n\n⸻","blanks":["結社の自由","国民主権"],"options":[["結社の自由","集会の自由","外部的行為","国民主権"],["国民主権","インタ","学問の自由","プライバシ"]],"mode":"constitution"}],"46":[{"text":"表現であっても、\n他人の権利を侵害したり、刑法上の犯罪を構成したりする場合\nがある。\n例えば、\n•\t名誉毀損\n•\t脅迫\n•\t業務妨害\nなど。\nしたがって、\n表現の自由＝何を言っても法的責任を負わない\nではない。\n\n⸻","blanks":["表現の自由","刑法上の犯罪"],"options":[["表現の自由","宗教上の信念","行為の目的","国民主権"],["刑法上の犯罪","良心の自由","社会的背景","一定の目的"]],"mode":"constitution"}],"47":[{"text":"表現の自由と、\n他人の名誉\nが衝突することがある。\nA\n↓\n表現の自由\n\nVS\n\nB\n↓\n名誉・人格権\nこの場合、\n表現の内容・目的・公共性・真実性など\nを考慮して調整する。\n\n⸻","blanks":["表現の自由","他人の名誉"],"options":[["表現の自由","プライバシ","宗教的行為","結社の自由"],["他人の名誉","刑法上の犯罪","明確性の原則","国民主権"]],"mode":"constitution"}],"48":[{"text":"表現によって、\n他人の私生活上の情報\nが公開される場合、\nプライバシーとの衝突\nが生じる。\nここでも、\n表現の価値\nと\n個人の人格的利益\nを比較する。\n\n⸻","blanks":["プライバシ","個人の人格的利益"],"options":[["プライバシ","宗教的行為","宗教上の信念","良心の自由"],["個人の人格的利益","表現の自由があります","発信する自由","内心と外部行為"]],"mode":"constitution"}],"49":[{"text":"インターネットは、\n誰でも低コストで大量の情報を発信できる\nという特徴がある。\n一方で、\n•\t誹謗中傷\n•\t名誉毀損\n•\tプライバシー侵害\n•\t虚偽情報\nなどの問題もある。\nしたがって、\n表現の自由と他人の権利との調整\nが重要になる。\n\n⸻","blanks":["プライバシ","表現の自由","インタ"],"options":[["プライバシ","刑法上の犯罪","表現の内容","取材の自由"],["表現の自由","国家の行為","明確性の原則","結社の自由"],["インタ","良心","表現","取材の自由"]],"mode":"constitution"}],"50":[{"text":"憲法23条は、\n学問の自由は、これを保障する\nと定める。\n学問の自由とは、\n真理を探究し、研究し、その成果を発表する自由\nなどを保障するもの。\n\n⸻","blanks":["学問の自由","憲法"],"options":[["学問の自由","政教分離","刑法上の犯罪","明確性の原則"],["憲法","刑罰","複数人","選挙"]],"mode":"constitution"}],"51":[{"text":"学問の自由には、\n•\t研究の自由\n•\t研究発表の自由\n•\t教授の自由\nなどが関係する。\n\n⸻","blanks":["学問の自由","研究発表の自由"],"options":[["学問の自由","国家の行為","宗教的行為","結社の自由"],["研究発表の自由","宗教を信じる自由","一定の目的","外部的行為"]],"mode":"constitution"}],"52":[{"text":"大学では、\n研究・教育を国家から不当に干渉されないこと\nが重要。\nそこで、\n大学の自治\nが問題になる。\n\n⸻","blanks":["大学の自治","教育"],"options":[["大学の自治","一定の目的","他人の名誉","事前抑制"],["教育","検閲","良心","宗教団体"]],"mode":"constitution"}],"53":[{"text":"大学の自治とは、\n大学における研究・教育について、大学の構成員が一定の自主性を持つこと。\nただし、\n大学だから国家法の外にある\nという意味ではない。\n\n⸻","blanks":["大学の自治","教育"],"options":[["大学の自治","二重の基準論","宗教上の信念","最高裁判所"],["教育","事前抑制","宗教団体","表現規制"]],"mode":"constitution"}],"54":[{"text":"学問の自由は、\n教授だけの自由\nではない。\n学生の学習・研究活動とも関係する。\nただし、\n大学の制度・教育目的との関係で一定のルール\nが認められる場合がある。\n\n⸻","blanks":["学問の自由","教育"],"options":[["学問の自由","内心の自由","他人の名誉","大学の自治"],["教育","内心の自由","選挙","知る権利"]],"mode":"constitution"}],"55":[{"text":"権利\t中心となる自由\n思想・良心の自由\t何を考えるか\n信教の自由\t何を信じるか\n表現の自由\t何を外部に表現するか\n集会の自由\t他人と集まって活動する\n結社の自由\t団体を形成・参加する\n学問の自由\t研究・発表・教育を行う\n\n⸻","blanks":["思想・良心の自由","集会の自由","信教の自由","結社の自由","学問の自由"],"options":[["思想・良心の自由","明確性の原則","発信する自由","ある政治思想を持つ"],["集会の自由","取材の自由","学問の自由","表現の自由"],["信教の自由","結社の自由","刑法上の犯罪","最高裁判所"],["結社の自由","宗教的行為","国家の行為","他人の名誉"],["学問の自由","行為の目的","事前抑制","国民主権"]],"mode":"constitution"}],"56":[{"text":"これらは独立しているだけではない。\n例えば、\n思想・良心\n↓\n政治的意見\n↓\n表現\n↓\n集会\n↓\n結社\n↓\n民主主義\nというつながりがある。\nまた、\n思想\n↓\n信仰\n↓\n宗教活動\n↓\n宗教団体\nというつながりもある。\n\n⸻","blanks":["思想","良心"],"options":[["思想","事前抑制","プライバシ","他人の名誉"],["良心","取材の自由","検閲","プライバシ"]],"mode":"constitution"}],"57":[{"text":"第2編で学んだ、\n二重の基準論\nがここで重要になる。\n精神的自由は、\n民主主義や個人の人格形成に直結する\nため、国家による制約について、\nより厳格な審査\nが求められることが多い。\n\n⸻","blanks":["二重の基準論","個人の人格形成"],"options":[["二重の基準論","政府批判は禁止","学問の自由","大学の自治"],["個人の人格形成","宗教上の信念","精神的自由の体系","個人の人格的利益"]],"mode":"constitution"}],"58":[{"text":"精神的自由が制約された場合、\n① 何の自由か\n思想？\n信教？\n表現？\n集会？\n学問？\n↓\n② どのような制約か\n禁止？\n許可制？\n刑罰？\n事前審査？\n↓\n③ 内容規制か\n表現内容を理由としているか？\n↓\n④ 制約の程度\n直接禁止？\n間接的負担？\n↓\n⑤ 規制目的\n何を守るためか？\n↓\n⑥ 代替手段\nもっと制約の少ない方法はないか？\n↓\n⑦ 合憲性\nを判断する。\n\n⸻","blanks":["思想","刑罰"],"options":[["思想","検閲","他人の名誉","萎縮効果"],["刑罰","宗教団体","取材の自由","結成"]],"mode":"constitution"}],"59":[{"text":"Aが政府の政策を激しく批判した。\n政府が、\n「政府批判だから禁止する」\nとした。\nこの場合、\n表現の自由\n特に、\n政治的表現\nが問題となる。\n政治的表現は民主主義にとって重要なので、\n国家による内容規制は特に慎重に審査する必要がある。\n\n⸻","blanks":["政府批判だから禁止する","政治的表現","表現の自由"],"options":[["政府批判だから禁止する","思想・良心の自由","この思想を持ちなさい","怖いからやめておこう"],["政治的表現","集会の自由","国民主権","表現の自由"],["表現の自由","内心の自由","他人の名誉","宗教的行為"]],"mode":"constitution"}],"60":[{"text":"Aが宗教上の理由から、\n法律上要求されている一定の行為を拒否した。\nこの場合、\n信教の自由\nVS\n法律上の義務\nという問題になる。\n単に、\n「宗教だから絶対に自由」\nとはならない。\n宗教上の自由の重要性と、\n制約の目的・必要性・程度\nを検討する。\n\n⸻","blanks":["宗教だから絶対に自由","信教の自由"],"options":[["宗教だから絶対に自由","インターネット上の表現","精神的自由と経済的自由","表現の自由があります"],["信教の自由","宗教的行為","報道の自由","内心の自由"]],"mode":"constitution"}],"61":[{"text":"出版社Aが、\n政治家Bについて批判的な記事を出版しようとしている。\nBが、\n出版前に差し止めたい\nと請求。\nここでは、\n表現の自由\nと\n名誉権\nの衝突が問題となる。\nさらに、\n事前抑制\nという重大な問題がある。\nそのため、通常の事後的な損害賠償よりも、\nより慎重な判断\nが必要になる。最高裁の北方ジャーナル事件はこの点の重要判例。(最高裁判所)\n\n⸻","blanks":["最高裁判所","表現の自由","事前抑制"],"options":[["最高裁判所","取材の自由","表現の自由","結社の自由"],["表現の自由","宗教的行為","デモ行進","一定の目的"],["事前抑制","学問の自由","一定の目的","外部的行為"]],"mode":"constitution"}],"62":[{"text":"大学教授Aが、\n政府に批判的な研究\nを行った。\n政府が、\n「政府に批判的だから研究を禁止する」\nとした。\nここでは、\n学問の自由\nが中心となる。\nさらに、\n思想・良心の自由\n表現の自由\nとも関係する。\n\n⸻","blanks":["政府に批判的だから研究を禁止する","思想・良心の自由","学問の自由","表現の自由"],"options":[["政府に批判的だから研究を禁止する","個人の人格的利益","集会・結社の自由","ある政治思想を持つ"],["思想・良心の自由","宗教だから絶対に自由","刑法上の犯罪","怖いからやめておこう"],["学問の自由","表現の内容","集会の自由","プライバシ"],["表現の自由","明確性の原則","学問の自由","宗教上の信念"]],"mode":"constitution"}],"63":[{"text":"精神的自由\n│\n┌───────────────┼───────────────┐\n│               │               │\n思想・良心          信教            表現\n│               │               │\n内心の自由      信仰・宗教活動     言論・出版\n│\n┌──────┼──────┐\n│      │      │\n集会    結社   報道\n│\n知る権利\n\n│\n学問の自由\n│\n研究・発表\n│\n大学の自治\n\n⸻","blanks":["内心の自由","大学の自治","学問の自由","知る権利","思想"],"options":[["内心の自由","国家の行為","国民主権","外部的行為"],["大学の自治","政治的表現","集会の自由","報道の自由"],["学問の自由","結社の自由","行為の目的","集会の自由"],["知る権利","国家の行為","一定の目的","プライバシ"],["思想","刑罰","検閲","プライバシ"]],"mode":"constitution"}],"64":[{"text":"精神的自由を理解するとき、\n「人間の内面から外部への自由」\nとして考えると分かりやすい。\n内心\n↓\n思想・良心\n↓\n信仰\n↓\n意見形成\n↓\n表現\n↓\n集会・結社\n↓\n社会・政治への参加\nつまり、\n精神的自由は、個人の人格形成だけでなく民主主義そのものを支えている。\nそのため、\n国家による精神的自由への介入は特に慎重に扱われる。\n\n⸻","blanks":["人間の内面から外部への自由","思想","良心"],"options":[["人間の内面から外部への自由","思想・良心の自由","インターネット上の表現","宗教と国家を完全に無関係にする"],["思想","報道の自由","知る権利","憲法"],["良心","信教の自由","デモ行進","教育"]],"mode":"constitution"}],"65":[{"text":"思想・良心\n1.\t思想・良心の自由とは何か。\n2.\t内心の自由が特に強く保障されるのはなぜか。\n3.\t内心と外部行為の違いは何か。\n4.\t思想・良心と日の丸・君が代の問題はどう関係するか。\n信教\n5.\t信教の自由とは何か。\n6.\t信仰しない自由とは何か。\n7.\t宗教的行為の自由とは何か。\n8.\t政教分離とは何か。\n9.\t政教分離の目的は何か。\n10.\t目的・効果を考えるのはなぜか。\n11.\t宗教上の理由があれば法律上の義務をすべて拒否できるか。\n表現\n12.\t表現の自由とは何か。\n13.\t表現の自由が重要なのはなぜか。\n14.\t自己実現と自己統治とは何か。\n15.\t政治的表現が特に重要なのはなぜか。\n16.\t知る権利とは何か。\n17.\t報道の自由とは何か。\n18.\t取材の自由とは何か。\n19.\t内容規制と内容中立規制の違いは何か。\n20.\t明確性の原則とは何か。\n21.\t過度の広汎性とは何か。\n22.\t萎縮効果とは何か。\n23.\t事前抑制とは何か。\n24.\t検閲とは何か。\n25.\t検閲と事前抑制は同じか。\n26.\tなぜ出版差止めは慎重に判断されるのか。\n集会・結社\n27.\t集会の自由とは何か。\n28.\tデモ行進はなぜ表現の自由と関係するか。\n29.\t結社の自由とは何か。\n30.\t政治的結社が重要なのはなぜか。\n学問\n31.\t学問の自由とは何か。\n32.\t研究の自由とは何か。\n33.\t教授の自由とは何か。\n34.\t大学の自治とは何か。\n総合\n35.\tなぜ精神的自由は二重の基準論で特に重要なのか。\n36.\t表現の自由と名誉権が衝突したらどう考えるか。\n37.\t信教の自由と法律上の義務が衝突したらどう考えるか。\n38.\t精神的自由が行政によって制約された場合、行政法とどうつながるか。\n39.\t精神的自由の問題を見たとき、どの順番で分析するか。\n\n⸻","blanks":["内容規制と内容中立規制","宗教的行為の自由","思想・良心の自由","内心と外部行為","信仰しない自由"],"options":[["内容規制と内容中立規制","政教分離の目的","居住・移転の自由","集会・結社の自由"],["宗教的行為の自由","集会・結社の自由","明確性の原則","宗教を信じる自由"],["思想・良心の自由","ある政治思想を持つ","この思想を持ちなさい","宗教的行為の自由"],["内心と外部行為","政教分離の目的","居住・移転の自由","他人の名誉"],["信仰しない自由","刑法上の犯罪","精神的自由の体系","内心と外部行為"]],"mode":"constitution"}],"66":[{"text":"精神的自由は、\n「人間が自分の内面を形成し、それを社会に表現し、他者と共同して活動する自由」\nとして理解する。\nその体系は、\n精神的自由\n│\n┌──────┴──────┐\n│             │\n内面           外部\n│             │\n思想・良心        表現\n信教              集会\n結社\n│\n学問・研究\n│             │\n└──────┬──────┘\n│\n個人の人格\n│\n＋\n民主主義\n│\n国家による制約\n│\n厳格な審査\n\n⸻\n\n第3編の到達点\n第3編を終えた段階では、\n「表現の自由があります」\nだけではなく、\n「なぜ表現の自由が保障され、どのような場合に制約が許され、その制約をどのように憲法上審査するのか」\nまで説明できることが目標。\n特に、\n思想・良心 → 信教 → 表現 → 集会・結社 → 学問\nがそれぞれ独立した制度ではなく、\n個人の人格形成・自己実現・民主主義を支える一つの精神的自由の体系\nとして理解する。\n次の第4編では、\n経済的自由・人身の自由\nを扱う。\nここでは、\n居住・移転の自由 → 職業選択の自由 → 財産権 → 奴隷的拘束・苦役からの自由 → 適正手続 → 令状主義 → 被疑者・被告人の権利\nへ進む。\nそして第2編で学んだ二重の基準論が、\n「精神的自由と経済的自由では、なぜ違憲審査の厳しさが違うのか」\nという形で具体的につながってくる。","blanks":["表現の自由があります","奴隷的拘束・苦役からの自由","精神的自由と経済的自由","精神的自由の体系","居住・移転の自由"],"options":[["表現の自由があります","宗教を信じる自由","政府批判だから禁止する","人間の内面から外部への自由"],["奴隷的拘束・苦役からの自由","宗教を信じる自由","表現の自由があります","政教分離の目的"],["精神的自由と経済的自由","居住・移転の自由","内心と外部行為","研究発表の自由"],["精神的自由の体系","個人の人格形成","表現活動の一種","政教分離の目的"],["居住・移転の自由","宗教だから絶対に自由","政府批判は禁止","表現の自由があります"]],"mode":"constitution"}]},"4":{"1":[{"text":"経済的自由とは、\n個人が経済生活を自分の意思で行う自由\nである。\n代表的には、\n•\t居住・移転の自由\n•\t職業選択の自由\n•\t財産権\nなどがある。\n\n⸻","blanks":["居住・移転の自由","職業選択の自由","経済的自由","財産権"],"options":[["居住・移転の自由","自己負罪拒否特権","拷問・残虐な刑罰","外国への移住"],["職業選択の自由","経済政策上の規制","国民の予測可能性","人身の自由"],["経済的自由","一事不再理","奴隷的拘束","公開裁判"],["財産権","苦役","公開裁判","職業規制"]],"mode":"constitution"}],"2":[{"text":"経済的自由\n│\n┌────────┼────────┐\n│        │        │\n居住・移転  職業選択   財産権\n│        │        │\nどこに      どんな     財産を\n住むか      仕事を     持つか\n│        │        │\n└────────┼────────┘\n│\n経済活動\n\n⸻","blanks":["経済的自由","財産権","居住"],"options":[["経済的自由","一事不再理","弁護権保障","刑事補償"],["財産権","職業規制","捜索","刑事事件"],["居住","所持品","令状主義","刑事事件"]],"mode":"constitution"}],"3":[{"text":"憲法22条1項は、\n何人も、公共の福祉に反しない限り、居住、移転及び職業選択の自由を有する\nと定める。\n居住・移転の自由とは、\nどこに住むか、どこへ移動するかを自分で決める自由\nである。\n\n⸻","blanks":["居住・移転の自由","居住","移転の自由","職業選択の自由","公共の福祉"],"options":[["居住・移転の自由","外国への移住","遡及処罰の禁止","自白の証拠能力"],["居住","適正手続","所持品","財産権"],["移転の自由","消費者保護","国家賠償","刑事事件"],["職業選択の自由","罪刑法定主義","どのような規制か","一定の公益上"],["公共の福祉","消費者保護","外国への移住","基本的人権"]],"mode":"constitution"}],"4":[{"text":"個人は、\nどこに住むか\nを原則として自由に決めることができる。\n例えば、\n東京に住む\n↓\n山梨に移る\n↓\n大阪に引っ越す\nなど。\n国家が合理的な理由なく、\n「ここに住んではいけない」\nとすることには憲法上の問題が生じる。\n\n⸻","blanks":["ここに住んではいけない","憲法"],"options":[["ここに住んではいけない","規制手段は合理的か","自己負罪拒否特権","居住・移転の自由"],["憲法","職業規制","公開裁判","拷問"]],"mode":"constitution"}],"5":[{"text":"移転の自由とは、\n国内を自由に移動する自由\nである。\nただし、\n感染症対策・災害対策・刑事司法など\n一定の公益上の理由から制約が問題となる場合がある。\n\n⸻","blanks":["移転の自由","一定の公益上"],"options":[["移転の自由","防御の機会","残虐な刑罰","弁護権保障"],["一定の公益上","罪刑法定主義","人身の自由","周辺住民の安全"]],"mode":"constitution"}],"6":[{"text":"憲法22条2項は、\n外国に移住し、又は国籍を離脱する自由\nを保障する。\n外国への移住・渡航についても、\n個人の自由\nとして保障される。\nただし、\n国際関係や出入国管理との関係\nで一定の法律上の規制が問題となる。\n\n⸻","blanks":["外国への移住","憲法"],"options":[["外国への移住","公共の安全","弁護権保障","公共の福祉"],["憲法","財産権","逮捕","刑罰"]],"mode":"constitution"}],"7":[{"text":"職業選択の自由とは、\nどのような職業に就くかを自分で決める自由\nである。\n例えば、\n•\t医師\n•\t弁護士\n•\t会社員\n•\tタクシー運転者\n•\t飲食店経営\n•\t自営業\nなど。\n\n⸻","blanks":["職業選択の自由","飲食店経営"],"options":[["職業選択の自由","規制目的は何か","人身の自由","一事不再理"],["飲食店経営","刑事裁判","外国への移住","公共の福祉"]],"mode":"constitution"}],"8":[{"text":"職業選択の自由は、\n「職業を選ぶこと」\nだけではない。\n選択した職業を、\nどのように営むか\nという職業活動の自由とも関係する。\n\n⸻","blanks":["職業を選ぶこと","職業活動の自由","職業選択の自由"],"options":[["職業を選ぶこと","裁判の対審及","職業活動の自由","財産権の保障"],["職業活動の自由","犯罪の構成要件","一定の条件","規制目的は何か"],["職業選択の自由","犯罪の構成要件","拷問・残虐な刑罰","どのような規制か"]],"mode":"constitution"}],"9":[{"text":"国家は、\n公共の安全・衛生・消費者保護など\nのために職業を規制することがある。\n例えば、\n•\t免許制\n•\t許可制\n•\t資格制度\n•\t営業時間規制\n•\t営業場所規制\nなど。\n\n⸻","blanks":["公共の安全","消費者保護"],"options":[["公共の安全","飲食店経営","公開裁判","一定の公益上"],["消費者保護","飲食店経営","令状主義","移転の自由"]],"mode":"constitution"}],"10":[{"text":"職業選択の自由は重要な権利だが、\n絶対無制限ではない。\n問題は、\nどの程度の規制なら許されるのか\nである。\nここでは、\n•\t規制目的\n•\t規制の必要性\n•\t規制手段\n•\t職業自由への影響\nなどを検討する。\n\n⸻","blanks":["職業選択の自由","規制の必要性"],"options":[["職業選択の自由","規制の必要性","居住・移転の自由","犯罪を認めろ"],["規制の必要性","移転の自由","弁護人依頼権","二重の基準論"]],"mode":"constitution"}],"11":[{"text":"職業規制の目的が、\n国民の生命・身体・健康・安全などへの危険を防止すること\nにある場合を、\n消極目的規制\nとして考える。\n例えば、\n危険な営業を規制する\nなど。\n\n⸻","blanks":["消極目的規制","職業規制"],"options":[["消極目的規制","公共施設建設","外国への移住","残虐な刑罰"],["職業規制","自白しろ","令状主義","刑事事件"]],"mode":"constitution"}],"12":[{"text":"職業規制の目的が、\n社会政策・経済政策などを実現すること\nにある場合、\n積極目的規制\nと呼ばれる。\n例えば、\n過当競争の防止や一定の産業政策\nなど。\n\n⸻","blanks":["積極目的規制","職業規制"],"options":[["積極目的規制","一定の条件","私有財産制","基本的人権"],["職業規制","違憲審査","残虐な刑罰","公平な裁判"]],"mode":"constitution"}],"13":[{"text":"職業規制については、\n規制の目的・手段・職業への影響\nを考慮する。\n一般に、\n生命・健康・安全を守るための規制\nと、\n単なる経済政策上の規制\nでは、審査のあり方が異なる。\n\n⸻","blanks":["職業規制","経済政策上の規制"],"options":[["職業規制","弁護権保障","公共の福祉","刑事事件"],["経済政策上の規制","人身の自由とは何か","その行為は犯罪だった","どのような規制か"]],"mode":"constitution"}],"14":[{"text":"憲法29条は、\n財産権は、これを侵してはならない\nと定める。\n財産権とは、\n財産を所有・利用・処分する権利\nなどをいう。\n\n⸻","blanks":["財産権","憲法"],"options":[["財産権","違憲審査","逮捕","拷問"],["憲法","居住","違憲審査","所持品"]],"mode":"constitution"}],"15":[{"text":"財産権の保障は、\n国家が個人の財産を勝手に奪うことを防ぐ\nことに意味がある。\n例えば、\n土地\n預金\n株式\n建物\nその他財産\n↓\n憲法29条\n↓\n財産権を保障\n\n⸻","blanks":["財産権の保障","憲法"],"options":[["財産権の保障","罪刑法定主義","規制の必要性","犯罪を認めろ"],["憲法","裁判所","職業規制","自白"]],"mode":"constitution"}],"16":[{"text":"憲法29条2項は、\n財産権の内容は、公共の福祉に適合するように法律で定める\nとしている。\nつまり、\n財産権は社会生活の中で法律によって一定のルールが設定される。\n例えば、\n•\t建築規制\n•\t土地利用規制\n•\t都市計画\n•\t環境規制\nなど。\n\n⸻","blanks":["公共の福祉","財産権","憲法"],"options":[["公共の福祉","内容の法律","刑事補償","人身の自由"],["財産権","刑事事件","捜索","公開裁判"],["憲法","刑事補償","拷問","公開裁判"]],"mode":"constitution"}],"17":[{"text":"財産権も、\n絶対無制限ではない。\n例えば、\n土地所有者だから何をしてもよい\nとはならない。\n周辺住民の安全・環境・都市計画などとの調整が必要。\n\n⸻","blanks":["財産権","周辺住民の安全"],"options":[["財産権","適正手続","捜索","公開裁判"],["周辺住民の安全","弁護人依頼権","自己負罪拒否特権","消極目的規制"]],"mode":"constitution"}],"18":[{"text":"財産権についても、\n公共の福祉\nによる制約が認められる。\nしかし、\n「公共の福祉」と言えばどんな制約も許される\nわけではない。\n制約の目的・必要性・程度などを検討する。\n\n⸻","blanks":["公共の福祉","財産権"],"options":[["公共の福祉","移転の自由","二重の基準論","身体拘束等"],["財産権","拷問","国会","道路建設"]],"mode":"constitution"}],"19":[{"text":"憲法29条は、\n私有財産制\nを保障する。\n個人が財産を所有し、\nそれを利用・処分できる制度\nを基本的に保障している。\n\n⸻","blanks":["私有財産制","憲法"],"options":[["私有財産制","裁判の公開","弁護権保障","刑事裁判"],["憲法","一定の条件","令状主義","職業規制"]],"mode":"constitution"}],"20":[{"text":"財産権には、\n社会の中で他人や公共との関係を調整する側面\nもある。\nそのため、\n財産権は絶対的な権利ではなく、社会的な制約を受ける。\n\n⸻","blanks":["財産権","絶対的"],"options":[["財産権","損失補償","違憲審査","憲法"],["絶対的","苦役","国家賠償","拷問"]],"mode":"constitution"}],"21":[{"text":"憲法29条3項は、\n私有財産を公共のために用いる場合には、正当な補償\nを要求している。\n例えば、\n公共施設を建設するため土地を取得する\nなど。\n\n⸻","blanks":["正当な補償","公共のために用いる場合","憲法"],"options":[["正当な補償","法律専門家","刑事事件","公開裁判"],["公共のために用いる場合","裁判を受ける権利","その行為は犯罪だった","自由だから何でもできる"],["憲法","捜査機関","自白しろ","一事不再理"]],"mode":"constitution"}],"22":[{"text":"典型的なのは、\n•\t道路建設\n•\t鉄道建設\n•\tダム建設\n•\t公園整備\n•\t公共施設建設\nなど。\n国家が公共目的のため、\n私有財産を取得・制限する\n場合に問題となる。\n\n⸻","blanks":["公共施設建設","道路建設"],"options":[["公共施設建設","外国への移住","内容の法律","周辺住民の安全"],["道路建設","所持品","弁護権保障","残虐な刑罰"]],"mode":"constitution"}],"23":[{"text":"行政法でも学んだ、\n損失補償\nと憲法29条3項がつながる。\n公共のため\n↓\n私有財産に特別な負担\n↓\n憲法29条3項\n↓\n正当な補償\n↓\n損失補償\n\n⸻","blanks":["損失補償","正当な補償","憲法"],"options":[["損失補償","一定の条件","法律専門家","国家賠償"],["正当な補償","外国への移住","私有財産制","公平な裁判"],["憲法","不利益","苦役","裁判所"]],"mode":"constitution"}],"24":[{"text":"財産に関する国家の行為が、\n違法な侵害\nである場合には、\n国家賠償\nの問題になる。\n一方、\n適法な公共負担\nによって特別な損失が生じた場合には、\n損失補償\nが問題になる。\n\n⸻","blanks":["損失補償","国家賠償"],"options":[["損失補償","奴隷的拘束","消費者保護","国家賠償"],["国家賠償","職業規制","捜査機関","弁護権保障"]],"mode":"constitution"}],"25":[{"text":"制度\t原因\t基本的な考え方\n国家賠償\t違法な公権力行使\t違法行為による損害を賠償\n損失補償\t適法な公権力行使による特別な犠牲\t公平のため補償\n\n⸻","blanks":["損失補償","国家賠償"],"options":[["損失補償","基本的人権","公共の安全","違憲審査"],["国家賠償","刑事補償","内容の法律","人身の自由"]],"mode":"constitution"}],"26":[{"text":"人身の自由とは、\n国家から身体を不当に拘束されたり、刑罰などによって自由を奪われたりしない自由\nである。\n精神的自由・経済的自由と並ぶ、\n基本的人権の重要な領域。\n\n⸻","blanks":["経済的自由","基本的人権","人身の自由","刑罰"],"options":[["経済的自由","令状主義","移転の自由","一定の公益上"],["基本的人権","正当な補償","一定の公益上","公開裁判"],["人身の自由","経済的自由","正当な補償","公開裁判"],["刑罰","国家賠償","拷問","所持品"]],"mode":"constitution"}],"27":[{"text":"憲法18条は、\n何人も、いかなる奴隷的拘束も受けない\nと定める。\nさらに、\n犯罪による処罰の場合を除き、意に反する苦役に服させられない\nとしている。\n\n⸻","blanks":["奴隷的拘束","憲法","苦役"],"options":[["奴隷的拘束","基本的人権","飲食店経営","経済的自由"],["憲法","道路建設","捜査機関","所持品"],["苦役","公開裁判","行為","自白しろ"]],"mode":"constitution"}],"28":[{"text":"奴隷的拘束とは、\n人格を無視して身体を拘束し、人を支配するような状態\nをいう。\n現代社会では、\n人間を物のように扱うこと\nを憲法上許さないという意味で重要。\n\n⸻","blanks":["奴隷的拘束","憲法"],"options":[["奴隷的拘束","一定の条件","一事不再理","刑事補償"],["憲法","後法律","裁判所","刑罰"]],"mode":"constitution"}],"29":[{"text":"苦役とは、\n本人の意思に反して、過酷な労働などを強制されること。\nただし、\n刑罰としての労働\nなど、憲法18条が例外として認めるものがある。\n\n⸻","blanks":["苦役","憲法","刑罰"],"options":[["苦役","刑事補償","一事不再理","自白しろ"],["憲法","逮捕","自白","刑事事件"],["刑罰","裁判所","国会","損失補償"]],"mode":"constitution"}],"30":[{"text":"憲法31条は、\n何人も、法律の定める手続によらなければ、その生命若しくは自由を奪われ、又はその他の刑罰を科せられない\nと定める。\nこれを、\n適正手続の保障\nという。\n\n⸻","blanks":["適正手続","憲法","刑罰"],"options":[["適正手続","違憲審査","公開裁判","公共の福祉"],["憲法","捜索","国会","居住"],["刑罰","国家賠償","後法律","逮捕"]],"mode":"constitution"}],"31":[{"text":"適正手続とは、\n国家が人の生命・自由を奪う場合に、適正な法的手続を保障する\nという原則。\n単に、\n「法律に手続が書いてあればいい」\nというだけではなく、\nその手続自体が適正であること\nも重要となる。\n\n⸻","blanks":["法律に手続が書いてあればいい","適正手続"],"options":[["法律に手続が書いてあればいい","どの程度の審査が必要か","職業を選ぶこと","人身の自由とは何か"],["適正手続","人身の自由","刑事補償","法律専門家"]],"mode":"constitution"}],"32":[{"text":"国家が個人に不利益を与える場合、\n事前に告知する\n弁解・防御の機会を与える\n公正な判断者によって判断する\nなど、\n適正な手続\nが必要となる場合がある。\n\n⸻","blanks":["防御の機会","不利益"],"options":[["防御の機会","飲食店経営","残虐な刑罰","正当な補償"],["不利益","財産権","刑事補償","行為"]],"mode":"constitution"}],"33":[{"text":"31条については、\n手続だけでなく、刑罰の内容など実体面にも適正性が要求される\nという考え方がある。\nつまり、\n「手続だけ適正なら、どんな内容の法律でもいい」\nというわけではない。\n\n⸻","blanks":["刑罰","内容の法律"],"options":[["刑罰","道路建設","国家賠償","令状主義"],["内容の法律","奴隷的拘束","残虐な刑罰","人身の自由"]],"mode":"constitution"}],"34":[{"text":"刑事法の重要原則の一つが、\n罪刑法定主義\nである。\n基本的には、\n犯罪と刑罰は、あらかじめ法律で定められていなければならない\nという原則。\n\n⸻","blanks":["罪刑法定主義","刑罰"],"options":[["罪刑法定主義","経済的自由","二重の基準論","移転の自由"],["刑罰","裁判所","一定の条件","刑事裁判"]],"mode":"constitution"}],"35":[{"text":"国家が、\n「昨日までは合法だった行為を、今日になって犯罪として処罰する」\nことを防ぐ。\nつまり、\n国民の予測可能性\nと\n国家による刑罰権の濫用防止\nが重要。\n\n⸻","blanks":["刑罰","国民の予測可能性"],"options":[["刑罰","損失補償","行為","所持品"],["国民の予測可能性","一定の公益上","居住・移転の自由","周辺住民の安全"]],"mode":"constitution"}],"36":[{"text":"ある行為をした後に法律を作って、\n「その行為は犯罪だった」\nとして処罰することは許されない。\nこれを、\n遡及処罰の禁止\nという。\n\n⸻","blanks":["その行為は犯罪だった","遡及処罰の禁止"],"options":[["その行為は犯罪だった","自由だから何でもできる","自白の証拠能力","公共のために用いる場合"],["遡及処罰の禁止","裁判の対審及","規制目的は何か","周辺住民の安全"]],"mode":"constitution"}],"37":[{"text":"犯罪と刑罰について、\n国会が制定する法律\nによって定めることが必要。\nこれは、\n国民代表機関による刑罰権の統制\nという意味も持つ。\n\n⸻","blanks":["国会","刑罰"],"options":[["国会","刑事事件","裁判所","苦役"],["刑罰","捜索","裁判所","刑事裁判"]],"mode":"constitution"}],"38":[{"text":"刑罰法規は、\n何が犯罪なのか\nを国民が理解できる程度に明確でなければならない。\n曖昧すぎる法律は、\n•\t国民の予測可能性を害する\n•\t捜査機関等の恣意的運用を招く\n危険がある。\n\n⸻","blanks":["刑罰","捜査機関等の恣意的運用"],"options":[["刑罰","刑事補償","自白しろ","刑事事件"],["捜査機関等の恣意的運用","人身の自由とは何か","裁判を受ける権利","国家に一定の行為を求める権利"]],"mode":"constitution"}],"39":[{"text":"刑罰法規では、\n犯罪の構成要件\n刑罰\nなどが適切に定められている必要がある。\nしたがって、\n法律\n↓\n何が犯罪か明確\n↓\n国民が予測可能\n↓\n国家の刑罰権を制限\nという構造になる。\n\n⸻","blanks":["刑罰","犯罪の構成要件"],"options":[["刑罰","国会","刑事裁判","憲法"],["犯罪の構成要件","職業選択の自由","罪刑法定主義","裁判を受ける権利"]],"mode":"constitution"}],"40":[{"text":"憲法39条は、\n同じ犯罪について重ねて刑事上の責任を問われない\nという原則を保障する。\nこれを、\n一事不再理\nという。\n\n⸻","blanks":["一事不再理","憲法"],"options":[["一事不再理","身体拘束等","消費者保護","一定の条件"],["憲法","自白","損失補償","違憲審査"]],"mode":"constitution"}],"41":[{"text":"憲法33条・35条などでは、\n身体拘束や住居・所持品等への侵入・捜索・押収\nについて、\n令状\nを要求する仕組みがある。\nこれを、\n令状主義\nという。\n\n⸻","blanks":["令状主義","捜索","憲法"],"options":[["令状主義","適正手続","内容の法律","消費者保護"],["捜索","違憲審査","捜査機関","一事不再理"],["憲法","一定の条件","国家賠償","財産権"]],"mode":"constitution"}],"42":[{"text":"原則として、\n人を逮捕するには裁判官が発する令状が必要。\nこれは、\n捜査機関が自由に人を拘束すること\nを防ぐため。\n\n⸻","blanks":["逮捕","捜査機関"],"options":[["逮捕","違憲審査","後法律","裁判所"],["捜査機関","弁護権保障","奴隷的拘束","後法律"]],"mode":"constitution"}],"43":[{"text":"現行犯逮捕など、\n一定の場合には令状なしの逮捕\nが認められる。\nしかし、\n例外があるから令状主義が否定される\nわけではない。\nむしろ、\n原則として令状を要求し、例外を限定する\nという構造。\n\n⸻","blanks":["令状主義","逮捕"],"options":[["令状主義","消費者保護","適正手続","所持品"],["逮捕","刑罰","国会","自白しろ"]],"mode":"constitution"}],"44":[{"text":"国家が、\n住居・書類・所持品など\nを捜索・押収する場合にも、\n原則として令状\nが必要。\n\n⸻","blanks":["捜索","所持品"],"options":[["捜索","一定の条件","損失補償","刑事事件"],["所持品","拷問","自白","損失補償"]],"mode":"constitution"}],"45":[{"text":"令状は、\n何を捜索するのか\n何を押収するのか\nなどを特定する必要がある。\nこれは、\n捜査機関が何でも自由に探せる状態\nを防ぐため。\n\n⸻","blanks":["捜索","捜査機関"],"options":[["捜索","憲法","後法律","令状主義"],["捜査機関","国家賠償","内容の法律","基本的人権"]],"mode":"constitution"}],"46":[{"text":"憲法36条は、\n公務員による拷問及び残虐な刑罰\nを絶対に禁止している。\nここでは、\n国家が人間の身体・人格を尊厳ある存在として扱うこと\nが要求される。\n\n⸻","blanks":["拷問","残虐な刑罰","憲法"],"options":[["拷問","苦役","自白","国会"],["残虐な刑罰","外国への移住","裁判の公開","一事不再理"],["憲法","国家賠償","一定の条件","後法律"]],"mode":"constitution"}],"47":[{"text":"憲法38条1項は、\n何人も、自己に不利益な供述を強要されない\nと定める。\nこれが、\n自己負罪拒否特権\nである。\n\n⸻","blanks":["自己負罪拒否特権","憲法"],"options":[["自己負罪拒否特権","犯罪を認めろ","外国への移住","規制の必要性"],["憲法","刑事事件","道路建設","拷問"]],"mode":"constitution"}],"48":[{"text":"国家が、\n「自分が犯罪をしたと認めろ」\nと強制することを防ぐ。\nつまり、\n国家\n↓\n「自白しろ」\n↓\n本人\n↓\n拒否できる\nという自由。\n\n⸻","blanks":["自分が犯罪をしたと認めろ","自白しろ"],"options":[["自分が犯罪をしたと認めろ","犯罪の構成要件","その行為は犯罪だった","裁判を受ける権利"],["自白しろ","公開裁判","損失補償","令状主義"]],"mode":"constitution"}],"49":[{"text":"憲法38条2項は、\n強制・拷問・脅迫による自白\nなどについて、\n証拠として認められない\n旨を定めている。\n\n⸻","blanks":["自白","憲法","拷問"],"options":[["自白","一事不再理","刑罰","憲法"],["憲法","居住","刑事裁判","財産権"],["拷問","苦役","不利益","自白しろ"]],"mode":"constitution"}],"50":[{"text":"憲法38条3項は、\n本人の自白だけを唯一の証拠として有罪にすること\nを認めない。\nつまり、\n自白があればそれだけで有罪\nとはならない。\n\n⸻","blanks":["自白","憲法"],"options":[["自白","憲法","職業規制","刑事事件"],["憲法","違憲審査","刑事事件","苦役"]],"mode":"constitution"}],"51":[{"text":"刑事裁判では、\n被告人にも憲法上の権利が保障される。\n代表的には、\n•\t公平な裁判\n•\t弁護人依頼権\n•\t公開裁判\n•\t迅速な裁判\n•\t証人尋問権\n•\t証拠調べに関する権利\nなど。\n\n⸻","blanks":["弁護人依頼権","公平な裁判","刑事裁判","公開裁判","憲法"],"options":[["弁護人依頼権","経済的自由","私有財産制","積極目的規制"],["公平な裁判","令状主義","公共の安全","消費者保護"],["刑事裁判","奴隷的拘束","令状主義","正当な補償"],["公開裁判","損失補償","違憲審査","職業規制"],["憲法","後法律","逮捕","公開裁判"]],"mode":"constitution"}],"52":[{"text":"憲法32条は、\n何人も、裁判所において裁判を受ける権利を奪われない\nと定める。\n国家が、\n「この人は裁判を受けさせない」\nとすることは許されない。\n\n⸻","blanks":["この人は裁判を受けさせない","裁判を受ける権利","裁判所","憲法"],"options":[["この人は裁判を受けさせない","どの程度の審査が必要か","経済的自由とは何か","拷問・残虐な刑罰"],["裁判を受ける権利","積極目的規制","弁護人依頼権","職業を選ぶこと"],["裁判所","財産権","後法律","刑罰"],["憲法","自白しろ","道路建設","一定の条件"]],"mode":"constitution"}],"53":[{"text":"裁判は、\n公正な裁判所\nによって行われる必要がある。\nこれは、\n国家による恣意的な刑罰\nを防ぐために重要。\n\n⸻","blanks":["裁判所","刑罰"],"options":[["裁判所","道路建設","刑罰","不利益"],["刑罰","自白しろ","財産権","刑事補償"]],"mode":"constitution"}],"54":[{"text":"憲法82条では、\n裁判の対審及び判決は公開法廷で行う\nことを原則としている。\n公開によって、\n裁判の公正を社会から監視できるようにする。\n\n⸻","blanks":["憲法","裁判の対審及"],"options":[["憲法","令状主義","裁判所","損失補償"],["裁判の対審及","周辺住民の安全","人身の自由","弁護権保障"]],"mode":"constitution"}],"55":[{"text":"刑事事件では、\n被告人が弁護人を依頼する権利\nが保障される。\n特に、\n国家と個人の間には、捜査機関・検察という強大な権力差\nがある。\nそこで、\n法律専門家による防御\nが重要になる。\n\n⸻","blanks":["法律専門家","刑事事件"],"options":[["法律専門家","裁判の公開","弁護権保障","消費者保護"],["刑事事件","一定の条件","公共の福祉","違憲審査"]],"mode":"constitution"}],"56":[{"text":"資力など一定の条件のもとで、\n自分で弁護人を依頼できない場合\nに国が弁護人を付する制度がある。\nこれは、\n実質的な弁護権保障\nのために重要。\n\n⸻","blanks":["一定の条件","弁護権保障"],"options":[["一定の条件","刑事補償","令状主義","私有財産制"],["弁護権保障","経済的自由","令状主義","移転の自由"]],"mode":"constitution"}],"57":[{"text":"刑事被告人には、\n迅速な公開裁判を受ける権利\nが保障される。\n裁判が不当に長期化すると、\n•\t精神的負担\n•\t身体拘束\n•\t社会生活への影響\nなどが生じる。\n\n⸻","blanks":["裁判を受ける権利","公開裁判"],"options":[["裁判を受ける権利","経済政策上の規制","経済的自由とは何か","自白の証拠能力"],["公開裁判","違憲審査","公共の福祉","消費者保護"]],"mode":"constitution"}],"58":[{"text":"無罪判決を受けた者などが、\n刑事手続によって身体拘束等を受けた場合\nに、法律の定めるところにより、\n刑事補償\nが認められることがある。\n\n⸻","blanks":["刑事補償","身体拘束等"],"options":[["刑事補償","国家賠償","残虐な刑罰","刑事裁判"],["身体拘束等","内容の法律","弁護権保障","刑事事件"]],"mode":"constitution"}],"59":[{"text":"刑事手続を憲法の視点から見ると、\n犯罪の疑い\n↓\n捜査\n↓\n逮捕\n↓\n令状主義\n↓\n勾留\n↓\n起訴\n↓\n公判\n↓\n弁護人\n↓\n証拠調べ\n↓\n公平・公開の裁判\n↓\n判決\nそれぞれの段階で、\n被疑者・被告人の人権\nが保障される。\n\n⸻","blanks":["令状主義","憲法","逮捕"],"options":[["令状主義","人身の自由","道路建設","内容の法律"],["憲法","適正手続","職業規制","違憲審査"],["逮捕","苦役","拷問","捜索"]],"mode":"constitution"}],"60":[{"text":"第3編で学んだ精神的自由と、\n第4編の経済的自由では、\n違憲審査の考え方\nに違いがある。\n\n⸻\n\n基本的な考え方\n精神的自由\n↓\n民主主義・人格形成に直結\n↓\n厳格な審査\n\n経済的自由\n↓\n社会・経済政策との関係が強い\n↓\n立法府の裁量を比較的尊重\nこれが、\n二重の基準論\nにつながる。\n\n⸻","blanks":["二重の基準論","経済的自由","違憲審査"],"options":[["二重の基準論","一事不再理","経済的自由","犯罪を認めろ"],["経済的自由","一定の条件","基本的人権","裁判の公開"],["違憲審査","内容の法律","不利益","人身の自由"]],"mode":"constitution"}],"61":[{"text":"経済的自由は、\n社会的・経済的政策との調整\nが重要。\n一方、人身の自由は、\n国家による身体拘束・刑罰\nと直接関係する。\nしたがって、人身の自由では、\n国家権力を厳格に法で拘束する\nことが特に重要。\n\n⸻","blanks":["経済的自由","人身の自由","刑罰"],"options":[["経済的自由","外国への移住","防御の機会","二重の基準論"],["人身の自由","飲食店経営","裁判の公開","刑事裁判"],["刑罰","逮捕","違憲審査","職業規制"]],"mode":"constitution"}],"62":[{"text":"人身の自由\n│\n┌───────────┴───────────┐\n│                       │\n身体への直接介入          刑事手続\n│                       │\n奴隷的拘束禁止             適正手続\n苦役禁止                   令状主義\n黙秘権\n弁護人\n公開裁判\n一事不再理\n│\n↓\n刑罰権を制限\n\n⸻","blanks":["奴隷的拘束","一事不再理","人身の自由","令状主義","適正手続"],"options":[["奴隷的拘束","身体拘束等","飲食店経営","消費者保護"],["一事不再理","残虐な刑罰","経済的自由","弁護権保障"],["人身の自由","刑事裁判","刑事事件","公共の安全"],["令状主義","後法律","正当な補償","人身の自由"],["適正手続","刑事裁判","人身の自由","所持品"]],"mode":"constitution"}],"63":[{"text":"Aが新しい事業を始めようとした。\n法律が、\n「この事業を行うには行政の許可が必要」\nと定めている。\nここでは、\n職業選択の自由\nが制約される。\nしたがって、\n職業選択の自由\n↓\n許可制\n↓\n規制目的は？\n↓\n必要性は？\n↓\n規制手段は合理的？\n↓\n職業への負担は？\n↓\n合憲／違憲\nと分析する。\n\n⸻","blanks":["この事業を行うには行政の許可が必要","職業選択の自由"],"options":[["この事業を行うには行政の許可が必要","法律に手続が書いてあればいい","何の経済的自由が制約されたか","どの程度の審査が必要か"],["職業選択の自由","一事不再理","職業活動の自由","規制目的は何か"]],"mode":"constitution"}],"64":[{"text":"Aが土地を所有している。\n↓\n公共道路を建設するため、\n国・自治体が土地を取得する。\n↓\n財産権が制約される。\n↓\n憲法29条\n↓\n公共のために用いる場合、\n正当な補償\nが問題となる。\n\n⸻","blanks":["公共のために用いる場合","正当な補償","財産権","憲法"],"options":[["公共のために用いる場合","国家に一定の行為を求める権利","国家から干渉されない権利","拷問・残虐な刑罰"],["正当な補償","奴隷的拘束","公共の福祉","弁護権保障"],["財産権","違憲審査","捜索","苦役"],["憲法","後法律","財産権","不利益"]],"mode":"constitution"}],"65":[{"text":"Aに犯罪の疑いがある。\n警察が、\n令状なしに逮捕\nしようとしている。\nここでは、\n令状主義\nが問題。\nただし、\n現行犯などの例外\nがないかも確認する。\n\n⸻","blanks":["令状主義","逮捕"],"options":[["令状主義","人身の自由","国家賠償","刑事補償"],["逮捕","違憲審査","自白","国会"]],"mode":"constitution"}],"66":[{"text":"警察がAを長時間取り調べ、\n「犯罪を認めろ」\nと強く迫った。\nAが自白した。\nここでは、\n•\t自己負罪拒否特権\n•\t強制による自白\n•\t自白の証拠能力\nなどが問題になる。\n\n⸻","blanks":["犯罪を認めろ","自己負罪拒否特権","自白の証拠能力"],"options":[["犯罪を認めろ","消費者保護","裁判の対審及","一定の公益上"],["自己負罪拒否特権","教育を受ける権利","消極目的規制","一定の公益上"],["自白の証拠能力","犯罪の構成要件","居住・移転の自由","規制目的は何か"]],"mode":"constitution"}],"67":[{"text":"Aが行為をした。\n↓\nその時点では犯罪ではなかった。\n↓\nその後法律が改正され、\nその行為を犯罪とする規定ができた。\n↓\nAを処罰できるか。\n原則として、\n遡及処罰は禁止\nされる。\n\n⸻","blanks":["後法律","行為"],"options":[["後法律","拷問","違憲審査","職業規制"],["行為","損失補償","絶対的","憲法"]],"mode":"constitution"}],"68":[{"text":"分野\t中心となる権利\t主な問題\n居住・移転\t22条\t移動・居住への規制\n職業選択\t22条\t許可・免許・営業規制\n財産権\t29条\t財産制約・収用・補償\n奴隷的拘束禁止\t18条\t身体・人格の拘束\n適正手続\t31条\t国家手続の適正\n令状主義\t33・35条等\t逮捕・捜索・押収\n拷問等禁止\t36条\t国家による残虐な扱い\n黙秘権\t38条\t自己負罪の強制禁止\n一事不再理\t39条\t二重の刑事責任追及禁止\n裁判を受ける権利\t32条\t裁判へのアクセス\n弁護人依頼権\t37条\t刑事防御権\n公開裁判\t37・82条\t裁判の公開\n刑事補償\t40条\t無罪等の場合の補償\n\n⸻","blanks":["裁判を受ける権利","弁護人依頼権","裁判の公開","奴隷的拘束","一事不再理"],"options":[["裁判を受ける権利","国民の予測可能性","規制手段は合理的か","公共施設建設"],["弁護人依頼権","公共施設建設","消費者保護","私有財産制"],["裁判の公開","公共の福祉","公共の安全","弁護権保障"],["奴隷的拘束","身体拘束等","刑事裁判","刑事補償"],["一事不再理","公共の安全","経済的自由","法律専門家"]],"mode":"constitution"}],"69":[{"text":"経済的自由の場合、\n「何の経済的自由が制約されたか」\n↓\n「どのような規制か」\n↓\n「規制目的は何か」\n↓\n「規制手段は合理的か」\n↓\n「どの程度の審査が必要か」\n↓\n「合憲か違憲か」\nと考える。\n\n⸻\n\n人身の自由の場合、\n「国家が何をしたか」\n↓\n逮捕？\n勾留？\n捜索？\n押収？\n刑罰？\n↓\n「どの憲法上の保障が問題か」\n↓\n適正手続？\n令状主義？\n黙秘権？\n弁護人依頼権？\n↓\n「手続は適正か」\n↓\n合憲か違憲か\nと考える。\n\n⸻","blanks":["何の経済的自由が制約されたか","どのような規制か","規制目的は何か","規制手段は合理的か","どの程度の審査が必要か"],"options":[["何の経済的自由が制約されたか","その行為は犯罪だった","職業選択の自由","どの程度の審査が必要か"],["どのような規制か","罪刑法定主義","教育を受ける権利","拷問・残虐な刑罰"],["規制目的は何か","外国への移住","犯罪を認めろ","どのような規制か"],["規制手段は合理的か","自白の証拠能力","国家から干渉されない権利","どのような規制か"],["どの程度の審査が必要か","裁判を受ける権利","どのような規制か","犯罪の構成要件"]],"mode":"constitution"}],"70":[{"text":"経済的自由では、\n個人の経済活動を国家がどこまで規制できるのか\nが核心。\n人身の自由では、\n国家が個人の身体・生命・自由に介入するとき、どこまで許されるのか\nが核心。\nしたがって、\n経済的自由\n↓\n国家による規制\n↓\n公共の利益\n↓\n必要性・合理性\n↓\n違憲審査\n\n人身の自由\n↓\n国家による身体・刑事介入\n↓\n法律\n↓\n適正手続\n↓\n令状・裁判・弁護\n↓\n人権保障\nという二つの流れを理解する。\n\n⸻","blanks":["経済的自由","人身の自由","違憲審査","適正手続"],"options":[["経済的自由","飲食店経営","弁護権保障","消費者保護"],["人身の自由","奴隷的拘束","公平な裁判","公共施設建設"],["違憲審査","私有財産制","正当な補償","所持品"],["適正手続","私有財産制","正当な補償","一事不再理"]],"mode":"constitution"}],"71":[{"text":"経済的自由\n1.\t経済的自由とは何か。\n2.\t居住・移転の自由とは何か。\n3.\t外国への移住・渡航の自由とは何か。\n4.\t職業選択の自由とは何か。\n5.\t職業活動の自由とは何か。\n6.\t職業規制が認められるのはなぜか。\n7.\t消極目的規制とは何か。\n8.\t積極目的規制とは何か。\n9.\t財産権とは何か。\n10.\t財産権はなぜ制約されるのか。\n11.\t私有財産制とは何か。\n12.\t正当な補償とは何か。\n13.\t国家賠償と損失補償の違いは何か。\n人身の自由\n14.\t人身の自由とは何か。\n15.\t奴隷的拘束とは何か。\n16.\t苦役とは何か。\n17.\t適正手続とは何か。\n18.\t実体的適正とは何か。\n19.\t罪刑法定主義とは何か。\n20.\t遡及処罰が禁止されるのはなぜか。\n21.\t明確性の原則とは何か。\n22.\t令状主義とは何か。\n23.\t逮捕と令状の関係はどうなっているか。\n24.\t捜索・押収に令状が必要なのはなぜか。\n25.\t拷問・残虐な刑罰が禁止されるのはなぜか。\n26.\t自己負罪拒否特権とは何か。\n27.\tなぜ自白だけで有罪にできないのか。\n28.\t一事不再理とは何か。\n29.\t裁判を受ける権利とは何か。\n30.\t弁護人依頼権とは何か。\n31.\t公開裁判にはどのような意味があるか。\n32.\t刑事補償とは何か。\n総合\n33.\t精神的自由と経済的自由で審査の考え方が異なるのはなぜか。\n34.\t職業規制の合憲性をどのように判断するか。\n35.\t財産権の制約と損失補償はどう関係するか。\n36.\t逮捕について憲法上何を確認するか。\n37.\t強制された自白について何が問題となるか。\n38.\t刑罰法規が曖昧な場合、なぜ問題になるか。\n39.\t人身の自由が刑事訴訟法とどうつながるか。\n40.\t経済的自由が行政法とどうつながるか。\n\n⸻","blanks":["精神的自由と経済的自由","経済的自由とは何か","人身の自由とは何か","拷問・残虐な刑罰","裁判を受ける権利"],"options":[["精神的自由と経済的自由","職業選択の自由","どの程度の審査が必要か","何の経済的自由が制約されたか"],["経済的自由とは何か","職業選択の自由","二重の基準論","国家から干渉されない権利"],["人身の自由とは何か","教育を受ける権利","遡及処罰の禁止","その行為は犯罪だった"],["拷問・残虐な刑罰","外国への移住","どのような規制か","公共施設建設"],["裁判を受ける権利","犯罪の構成要件","規制の必要性","拷問・残虐な刑罰"]],"mode":"constitution"}],"72":[{"text":"経済的自由\n│\n┌────────────┼────────────┐\n│            │            │\n居住・移転    職業選択      財産権\n│            │            │\n移動・居住    営業・資格    所有・利用\n│            │\n国家による規制\n│\n公共の福祉\n│\n合理性・必要性\n│\n違憲審査\n\n\n人身の自由\n│\n┌────────────┼────────────┐\n│            │            │\n身体拘束       刑事手続      刑罰\n│            │            │\n逮捕・勾留    適正手続     罪刑法定主義\n│          令状主義     遡及処罰禁止\n│          黙秘権       明確性\n│          弁護人\n│          公開裁判\n│\n└────────────┬────────────┘\n│\n国家権力を制限\n│\n個人の自由保障\n\n⸻\n\n第4編の到達点\n第4編で重要なのは、\n「自由だから何でもできる」\nでも、\n「公共の福祉だから国家が何でも規制できる」\nでもない。\n重要なのは、\n国家による制約が、憲法上許される範囲に収まっているか\nを判断すること。\n特に、\n経済的自由\n規制目的・規制手段・立法府の裁量\nを考える。\n人身の自由\n法律・適正手続・令状・裁判・弁護などによって国家権力を拘束する。\nという違いを押さえる。\nそして第3編と合わせると、\n第3編\n精神的自由\n↓\n人格・思想・表現・民主主義\n↓\n特に強い保障\n\n第4編\n経済的自由\n↓\n職業・財産・移動\n↓\n社会経済政策との調整\n\n第4編\n人身の自由\n↓\n身体・刑事手続\n↓\n国家権力からの厳格な保障\nという関係になる。\n次の**第5編「社会権・参政権・受益権」**では、これまでの自由権とは性質の異なる、\n生存権・教育を受ける権利・労働基本権・選挙権・請願権・国家賠償請求権など\nを扱う。\nここで、\n「国家から干渉されない権利」\nだけでなく、\n「国家に一定の行為を求める権利」\nという憲法上の権利保障まで体系が広がる。","blanks":["自由だから何でもできる","社会権・参政権・受益権","国家から干渉されない権利","国家に一定の行為を求める権利","教育を受ける権利"],"options":[["自由だから何でもできる","その行為は犯罪だった","国家から干渉されない権利","精神的自由と経済的自由"],["社会権・参政権・受益権","国家に一定の行為を求める権利","周辺住民の安全","犯罪の構成要件"],["国家から干渉されない権利","社会権・参政権・受益権","国家に一定の行為を求める権利","どのような規制か"],["国家に一定の行為を求める権利","裁判を受ける権利","拷問・残虐な刑罰","人身の自由とは何か"],["教育を受ける権利","周辺住民の安全","裁判の対審及","自己負罪拒否特権"]],"mode":"constitution"}]},"5":{"1":[{"text":"第3編・第4編で学んだ自由権は、\n国家から不当に干渉されない自由\nが中心だった。\nこれに対して社会権は、\n人間らしい生活を保障するために、国家に一定の積極的な役割を求める権利\nである。\n自由権\n↓\n国家に干渉されない\n↓\n「国家は邪魔をするな」\n\n社会権\n↓\n国家に一定の保障を求める\n↓\n「国家は一定のことをしてほしい」\n\n⸻","blanks":["国家は邪魔をするな","国家は一定のことをしてほしい","社会権","自由権"],"options":[["国家は邪魔をするな","個人の尊重","基本的人権","教育を受けさせる義務"],["国家は一定のことをしてほしい","人権保障の","一定の要件","生きていればいい"],["社会権","義務教育","経済状況","被選挙権"],["自由権","刑事裁判","行政事件","生存権"]],"mode":"constitution"}],"2":[{"text":"日本国憲法では、主に次の権利が社会権として位置づけられる。\n社会権\n│\n├─ 生存権（25条）\n│\n├─ 教育を受ける権利（26条）\n│\n└─ 労働基本権\n├─ 勤労の権利（27条）\n├─ 労働者の団結権\n├─ 団体交渉権\n└─ 団体行動権（28条）\n\n⸻","blanks":["教育を受ける権利","団体行動権","労働基本権","団体交渉権","勤労の権利"],"options":[["教育を受ける権利","国家意思の形成","投票の秘密","教育を受けさせる義務"],["団体行動権","法の支配","経済状況","国民主権"],["労働基本権","一票の価値","基本的人権","人身の自由"],["団体交渉権","基本的人権","人権保障の","地方公共団体"],["勤労の権利","生活保障","人身の自由","全員自由です"]],"mode":"constitution"}],"3":[{"text":"形式的に、\n「全員自由です」\nとするだけでは、現実には自由を十分に行使できない場合がある。\n例えば、\n貧困によって教育を受けられない\n最低限度の生活を維持できない\n労働者が使用者と圧倒的な力の差を持つ\nなど。\nそこで憲法は、\n実質的な人間の尊厳を保障する\nために社会権を認めている。\n\n⸻","blanks":["全員自由です","最低限度の生活","労働者","社会権","憲法"],"options":[["全員自由です","刑事手続","刑事補償","国家賠償請求権"],["最低限度の生活","人身の自由","経済的自由","勤労の権利"],["労働者","義務教育","行政事件","平等"],["社会権","国家賠償","選挙権","財政"],["憲法","経済状況","教育","平等"]],"mode":"constitution"}],"4":[{"text":"憲法25条1項は、\nすべて国民は、健康で文化的な最低限度の生活を営む権利を有する\nと定める。\nこれが、\n生存権\nである。\n\n⸻","blanks":["生存権","最低限度の生活","憲法"],"options":[["生存権","法の支配","被選挙権","国家賠償"],["最低限度の生活","刑事手続","一定の事項","25条2項"],["憲法","教育","労働者","受益権"]],"mode":"constitution"}],"5":[{"text":"生存権の核心は、\n人間として最低限度の生活を保障すること\nにある。\n単に、\n「生きていればいい」\nという意味ではない。\n健康・文化的な生活を含めて、\n人間の尊厳にふさわしい最低限度の生活\nを保障する考え方である。\n\n⸻","blanks":["生きていればいい","最低限度の生活","生存権"],"options":[["生きていればいい","25条2項","勤労の権利","民主主義社会"],["最低限度の生活","国家賠償請求権","国家は邪魔をするな","プログラム規定"],["生存権","請願権","法の支配","国会"]],"mode":"constitution"}],"6":[{"text":"憲法25条2項は、\n国は、すべての生活部面について、社会福祉・社会保障・公衆衛生の向上及び増進に努めなければならない\nとしている。\nつまり25条には、\n25条\n│\n├─ 1項\n│   ↓\n│  国民の権利\n│  「健康で文化的な最低限度の生活」\n│\n└─ 2項\n↓\n国の責務\n「社会保障等の向上・増進」\nという構造がある。\n\n⸻","blanks":["健康で文化的な最低限度の生活","社会保障等の向上・増進","25条2項","憲法"],"options":[["健康で文化的な最低限度の生活","地方公共団体","全員自由です","25条には法的意味が全くない"],["社会保障等の向上・増進","最低限度の生活","25条には法的意味が全くない","プログラム規定"],["25条2項","刑事補償","勤労の権利","人権保障の"],["憲法","逮捕","労働者","受益権"]],"mode":"constitution"}],"7":[{"text":"生存権を具体化するためには、\n•\t生活保護\n•\t社会保険\n•\t医療制度\n•\t社会福祉制度\n•\t公衆衛生制度\nなどの制度が必要になる。\nしたがって、\n国会による立法・政策形成との関係が非常に強い権利\nである。\n\n⸻","blanks":["生存権","国会"],"options":[["生存権","国家権力","平等","選挙権"],["国会","刑事裁判","国民主権","請願権"]],"mode":"constitution"}],"8":[{"text":"生存権について重要なのが、\nプログラム規定説\nという考え方。\nこれは、\n憲法25条は国に社会保障政策などを行うことを求める基本的な指針を示したものであり、具体的な給付内容については立法府の裁量が大きい\nという考え方。\nただし、\n「25条には法的意味が全くない」\nという意味ではない。\n\n⸻","blanks":["25条には法的意味が全くない","プログラム規定","生存権","憲法"],"options":[["25条には法的意味が全くない","国家は邪魔をするな","民主主義社会","自由権と社会権の違い"],["プログラム規定","基本的人権","刑事補償請求権","人権保障の"],["生存権","国家権力","義務教育","普通選挙"],["憲法","裁判所","生活保障","義務教育"]],"mode":"constitution"}],"9":[{"text":"生存権に関する具体的な制度設計では、\n国の財政\n社会状況\n政策判断\nなどが関係する。\nそのため、\n裁判所が立法府・行政の判断をどこまで審査するか\nが問題になる。\n\n⸻","blanks":["裁判所","生存権","財政"],"options":[["裁判所","生活保障","国民主権","自由権"],["生存権","労働者","国民主権","裁判所"],["財政","生存権","社会権","平等"]],"mode":"constitution"}],"10":[{"text":"「健康で文化的な最低限度」とは、\n時代・社会・経済状況などによって変化し得る概念\nである。\nしたがって、\n昔の最低限度\nと\n現代の最低限度\nが必ず同じとは限らない。\n\n⸻","blanks":["健康で文化的な最低限度","経済状況"],"options":[["健康で文化的な最低限度","25条には法的意味が全くない","自由権・社会権・参政権・受益権","国家から放っておいてもらう自由"],["経済状況","国家権力","基本的人権","労働者"]],"mode":"constitution"}],"11":[{"text":"憲法26条1項は、\nすべて国民は、法律の定めるところにより、その能力に応じて、ひとしく教育を受ける権利を有する\nと定める。\nこれが、\n教育を受ける権利\nである。\n\n⸻","blanks":["教育を受ける権利","憲法"],"options":[["教育を受ける権利","参政権と国民主権","個人の尊重","生きていればいい"],["憲法","社会権","普通選挙","法の支配"]],"mode":"constitution"}],"12":[{"text":"教育については、\n能力に応じて\nひとしく\n教育を受けることが重要。\nつまり、\n不合理な教育格差\nを防ぐことも憲法26条と関係する。\n\n⸻","blanks":["憲法","教育"],"options":[["憲法","受益権","自由権","裁判所"],["教育","刑事手続","自由権","児童"]],"mode":"constitution"}],"13":[{"text":"憲法26条2項は、\n保護する子女に普通教育を受けさせる義務\nを定める。\nさらに、\n義務教育は無償\nとされている。\nここでは、\n子ども\n↓\n教育を受ける権利\n\n保護者\n↓\n普通教育を受けさせる義務\n\n国家\n↓\n教育制度を整備\nという関係がある。\n\n⸻","blanks":["義務教育","教育を受けさせる義務","教育を受ける権利","憲法"],"options":[["義務教育","25条2項","一定の要件","経済状況"],["教育を受けさせる義務","国家は一定のことをしてほしい","一定のことをせよ","自由権と社会権の違い"],["教育を受ける権利","投票の秘密","自由権と社会権の違い","民主主義社会"],["憲法","普通選挙","自由権","刑事補償"]],"mode":"constitution"}],"14":[{"text":"教育には、\n学力・人格形成\nだけでなく、\n民主主義社会を支える市民の育成\nという側面もある。\nしたがって、\n教育の自由\nと\n国家による教育制度・教育内容への関与\nとの調整が問題になる。\n\n⸻","blanks":["教育","民主主義社会"],"options":[["教育","罷免","社会権","逮捕"],["民主主義社会","投票の秘密","人権保障の","経済的自由"]],"mode":"constitution"}],"15":[{"text":"憲法27条1項は、\nすべて国民は、勤労の権利を有し、義務を負う\nと定める。\n勤労の権利は、\n働く機会を得ることに関する権利\nとして理解される。\n\n⸻","blanks":["勤労の権利","憲法"],"options":[["勤労の権利","生活保障","団体交渉権","労働基本権"],["憲法","刑事補償","財政","義務教育"]],"mode":"constitution"}],"16":[{"text":"憲法27条2項は、\n賃金・就業時間・休息その他の勤労条件に関する基準\nを法律で定めるとしている。\nつまり、\n労働者を保護するための最低基準\nを国家が法律によって設定する。\n\n⸻","blanks":["労働者","憲法"],"options":[["労働者","義務教育","国家権力","生活保障"],["憲法","社会権","普通選挙","生存権"]],"mode":"constitution"}],"17":[{"text":"憲法27条3項は、\n児童は、これを酷使してはならない\nと定める。\nこれは、\n子どもの人格・健康・成長\nを労働による過度な負担から守る規定である。\n\n⸻","blanks":["憲法","児童"],"options":[["憲法","団結権","経済状況","裁判所"],["児童","国会","自由権","労働者"]],"mode":"constitution"}],"18":[{"text":"憲法28条は、\n勤労者の団結する権利及び団体交渉その他の団体行動をする権利\nを保障する。\nこれを、\n労働基本権\nという。\n\n⸻","blanks":["労働基本権","憲法"],"options":[["労働基本権","一定の事項","地方公共団体","人身の自由"],["憲法","生活保障","生存権","請願権"]],"mode":"constitution"}],"19":[{"text":"労働基本権\n│\n├─ 団結権\n│   ↓\n│  労働組合を結成・加入する\n│\n├─ 団体交渉権\n│   ↓\n│  使用者と交渉する\n│\n└─ 団体行動権\n↓\nストライキ等\n\n⸻","blanks":["団体行動権","労働基本権","団体交渉権","団結権"],"options":[["団体行動権","経済的自由","個人の尊重","地方公共団体"],["労働基本権","刑事裁判","25条2項","人身の自由"],["団体交渉権","全員自由です","個人の尊重","人権保障の"],["団結権","裁判所","憲法","社会権"]],"mode":"constitution"}],"20":[{"text":"団結権とは、\n労働者が団体を結成し、団結して使用者と対抗する権利\nである。\nなぜ団結が必要なのか。\n個々の労働者\n↓\n使用者との力の差が大きい\n↓\n一人では交渉力が弱い\n↓\n労働者が団結\n↓\n交渉力を確保\nという構造である。\n\n⸻","blanks":["団結権","労働者"],"options":[["団結権","国家賠償","参政権","裁判所"],["労働者","被選挙権","社会権","教育"]],"mode":"constitution"}],"21":[{"text":"団体交渉権とは、\n労働者側が使用者と労働条件などについて交渉する権利\nである。\n例えば、\n•\t賃金\n•\t労働時間\n•\t休暇\n•\t労働環境\nなど。\n\n⸻","blanks":["団体交渉権","労働者"],"options":[["団体交渉権","労働基本権","経済状況","人権保障の"],["労働者","被選挙権","平等","生活保障"]],"mode":"constitution"}],"22":[{"text":"団体行動権とは、\n労働者が団体として行動する権利\nである。\n代表例が、\nストライキ\nである。\nただし、\nすべての公務員に一般労働者と同じように団体行動権が認められているわけではない。\n\n⸻","blanks":["団体行動権","労働者"],"options":[["団体行動権","刑事手続","生活保障","民主主義社会"],["労働者","生活保障","国会","法の支配"]],"mode":"constitution"}],"23":[{"text":"労働基本権は重要だが、\n公共性の高い業務\nでは制約が問題になる。\n例えば、\n国民生活に重大な影響を与える公務\nなど。\nここでは、\n労働者の権利\nと\n公共の利益\nを調整する必要がある。\n\n⸻","blanks":["労働基本権","労働者"],"options":[["労働基本権","一票の価値","するな","投票の秘密"],["労働者","生活保障","団結権","罷免"]],"mode":"constitution"}],"24":[{"text":"社会権\n│\n├─ 25条\n│   生存権\n│   ↓\n│   最低限度の生活\n│\n├─ 26条\n│   教育を受ける権利\n│   ↓\n│   教育の機会\n│\n├─ 27条\n│   勤労の権利・勤労条件\n│   ↓\n│   労働者保護\n│\n└─ 28条\n労働基本権\n↓\n労働者の団結・交渉・行動\n\n⸻","blanks":["教育を受ける権利","最低限度の生活","労働基本権","勤労の権利","労働者"],"options":[["教育を受ける権利","団体交渉権","生きていればいい","健康で文化的な最低限度"],["最低限度の生活","投票の秘密","団体交渉権","刑事手続"],["労働基本権","25条2項","人権保障の","刑事裁判"],["勤労の権利","人身の自由","基本的人権","民主主義社会"],["労働者","児童","財政","義務教育"]],"mode":"constitution"}],"25":[{"text":"参政権とは、\n国民が政治に参加する権利\nである。\n民主主義国家では、\n国民が国家意思の形成に参加できること\nが重要。\n\n⸻","blanks":["参政権","国家意思の形成"],"options":[["参政権","財政","児童","生存権"],["国家意思の形成","一定の事項","地方公共団体","一定の要件"]],"mode":"constitution"}],"26":[{"text":"憲法15条は、\n公務員を選定し、及びこれを罷免することは、国民固有の権利\nとしている。\nさらに、\n成年者による普通選挙\nを保障する。\n\n⸻","blanks":["普通選挙","憲法","罷免"],"options":[["普通選挙","国民主権","人身の自由","刑事裁判"],["憲法","刑事補償","刑事手続","国会"],["罷免","選挙","生活保障","法の支配"]],"mode":"constitution"}],"27":[{"text":"選挙権は、\n単なる「投票できる権利」\nではない。\n国民主権の下で、\n国民が政治意思を形成・表明するための重要な権利\nである。\n\n⸻","blanks":["投票できる権利","国民主権","選挙権"],"options":[["投票できる権利","一定の要件","国家賠償請求権","25条2項"],["国民主権","普通選挙","人身の自由","勤労の権利"],["選挙権","刑事手続","刑事補償","するな"]],"mode":"constitution"}],"28":[{"text":"普通選挙とは、\n一定の合理的な要件を除き、広く国民に選挙権を認める制度\nである。\n昔は、\n財産・性別など\nによって選挙権が制限されていた。\n現代の日本では、\n成年者による普通選挙\nが憲法上保障されている。\n\n⸻","blanks":["普通選挙","選挙権","憲法"],"options":[["普通選挙","刑事補償","行政事件","法の支配"],["選挙権","教育","刑事補償","請願権"],["憲法","生活保障","生存権","平等"]],"mode":"constitution"}],"29":[{"text":"選挙では、\n一人一票\nという考え方が基本となる。\nただし、実際には、\n選挙区ごとの人口差\nによって、\n一票の価値\nの問題が生じる。\n\n⸻","blanks":["一票の価値","選挙"],"options":[["一票の価値","普通選挙","民主主義社会","人権保障の"],["選挙","選挙権","刑事裁判","生存権"]],"mode":"constitution"}],"30":[{"text":"例えば、\nA選挙区\n人口100万人\n↓\n議員1人\n\nB選挙区\n人口20万人\n↓\n議員1人\nなら、\nBの有権者1人の票がAより相対的に大きな影響力を持つ。\nここから、\n投票価値の平等\nという憲法問題が生じる。\n\n⸻","blanks":["憲法","平等","選挙"],"options":[["憲法","国家権力","国民主権","生活保障"],["平等","社会権","請願権","受益権"],["選挙","社会権","生活保障","国会"]],"mode":"constitution"}],"31":[{"text":"国民主権とは、\n国家の政治を最終的に国民が基礎づける\nという原理。\n選挙はその具体的な仕組みの一つ。\n国民主権\n↓\n国民が政治意思を形成\n↓\n選挙\n↓\n代表者を選ぶ\n↓\n国会等で政治\n\n⸻","blanks":["国民主権","国会","選挙"],"options":[["国民主権","国家権力","刑事裁判","経済状況"],["国会","団結権","逮捕","国家権力"],["選挙","刑事裁判","逮捕","憲法"]],"mode":"constitution"}],"32":[{"text":"参政権には、\n自分が選挙で選ばれる側になること\nも含まれる。\nこれを、\n被選挙権\nという。\n選挙権と被選挙権は、\n民主政治への参加\nという点で密接に関係する。\n\n⸻","blanks":["被選挙権","参政権"],"options":[["被選挙権","投票の秘密","受益権","刑事裁判"],["参政権","財政","国会","団結権"]],"mode":"constitution"}],"33":[{"text":"憲法15条は、\n公務員を選定・罷免することは国民固有の権利\nとする。\nここでいう公務員には、\n国会議員などの政治的代表者\nが重要に関係する。\n\n⸻","blanks":["罷免","国会","憲法"],"options":[["罷免","児童","刑事補償","参政権"],["国会","国家賠償","国家権力","社会権"],["憲法","法の支配","参政権","選挙権"]],"mode":"constitution"}],"34":[{"text":"憲法15条4項は、\nすべて選挙における投票の秘密を侵してはならない\nと定める。\nさらに、\n選挙人は、その選択について公的にも私的にも責任を問われない\nとする。\nつまり、\n誰に投票したかを国家や他人から強制的に明らかにされない\nことが重要。\n\n⸻","blanks":["投票の秘密","憲法","選挙"],"options":[["投票の秘密","全員自由です","地方公共団体","経済状況"],["憲法","社会権","生活保障","経済状況"],["選挙","財政","団結権","国会"]],"mode":"constitution"}],"35":[{"text":"憲法16条は、\n何人も、損害の救済、公務員の罷免、法律・命令・規則の制定・廃止・改正その他の事項について請願する権利\nを保障する。\nこれが、\n請願権\nである。\n\n⸻","blanks":["請願権","憲法","罷免"],"options":[["請願権","労働者","選挙権","するな"],["憲法","するな","刑事手続","労働者"],["罷免","逮捕","国家権力","請願権"]],"mode":"constitution"}],"36":[{"text":"請願とは、\n国や地方公共団体などに対して、一定の事項を求めること\nである。\n例えば、\n法律を改正してほしい\n行政について改善してほしい\nなど。\n\n⸻","blanks":["地方公共団体","一定の事項"],"options":[["地方公共団体","国家権力","勤労の権利","国民主権"],["一定の事項","生活保障","地方公共団体","刑事補償"]],"mode":"constitution"}],"37":[{"text":"請願権は、\n選挙とは異なる政治参加の方法\nである。\n政治参加\n│\n├─ 選挙\n│   ↓\n│  代表者を選ぶ\n│\n└─ 請願\n↓\n政策・制度等について意見を伝える\n\n⸻","blanks":["請願権","選挙"],"options":[["請願権","自由権","国民主権","国会"],["選挙","刑事手続","法の支配","国家権力"]],"mode":"constitution"}],"38":[{"text":"受益権とは、\n国家に対して一定の救済・裁判・補償などを求める権利\nをいう。\n代表的には、\n•\t請願権\n•\t裁判を受ける権利\n•\t国家賠償請求権\n•\t刑事補償請求権\nなどがある。\n※分類の仕方には学説上の違いがある。\n\n⸻","blanks":["裁判を受ける権利","国家賠償請求権","刑事補償請求権","受益権","請願権"],"options":[["裁判を受ける権利","全員自由です","民主主義社会","教育を受けさせる義務"],["国家賠償請求権","刑事補償請求権","一定の事項","個人の尊重"],["刑事補償請求権","一定のことをせよ","地方公共団体","教育を受ける権利"],["受益権","平等","義務教育","団結権"],["請願権","行政事件","生活保障","経済状況"]],"mode":"constitution"}],"39":[{"text":"憲法32条は、\n何人も、裁判所において裁判を受ける権利を奪われない\nと定める。\nこれは、\n国家によって権利を侵害された場合に、裁判所による救済を求めるための重要な保障\nである。\n\n⸻","blanks":["裁判を受ける権利","裁判所","憲法"],"options":[["裁判を受ける権利","参政権と国民主権","全員自由です","人権保障の"],["裁判所","被選挙権","自由権","生存権"],["憲法","裁判所","罷免","請願権"]],"mode":"constitution"}],"40":[{"text":"憲法17条は、\n何人も、公務員の不法行為により損害を受けたときは、法律の定めるところにより、国又は公共団体に、その賠償を求めることができる\nと定める。\nこれが、\n国家賠償請求権\nである。\n\n⸻","blanks":["国家賠償請求権","憲法"],"options":[["国家賠償請求権","経済的自由","一票の価値","裁判を受ける権利"],["憲法","刑事裁判","普通選挙","国家賠償"]],"mode":"constitution"}],"41":[{"text":"国家権力が、\n個人に違法な損害を与えた\n場合に、\n国家側に責任を負わせる。\nこれは、\n法の支配\nと\n人権救済\nを具体化する制度でもある。\n\n⸻","blanks":["法の支配","国家権力"],"options":[["法の支配","義務教育","刑事裁判","刑事補償"],["国家権力","25条2項","労働者","一定の事項"]],"mode":"constitution"}],"42":[{"text":"行政法で学んだ、\n国家賠償法\nと直接つながる。\n憲法17条\n↓\n国家賠償請求権を保障\n↓\n国家賠償法\n↓\n具体的な要件・手続\n↓\n裁判による救済\n\n⸻","blanks":["国家賠償請求権","憲法"],"options":[["国家賠償請求権","投票できる権利","教育を受ける権利","人身の自由"],["憲法","請願権","参政権","するな"]],"mode":"constitution"}],"43":[{"text":"憲法40条は、\n何人も、抑留又は拘禁された後、無罪の裁判を受けたときは、法律の定めるところにより、国にその補償を求めることができる\nと定める。\nこれが、\n刑事補償請求権\nである。\n\n⸻","blanks":["刑事補償請求権","憲法"],"options":[["刑事補償請求権","全員自由です","団体交渉権","民主主義社会"],["憲法","普通選挙","生存権","裁判所"]],"mode":"constitution"}],"44":[{"text":"国家による刑事手続で、\n身体を拘束された\n↓\nその後、\n無罪になった。\n↓\n一定の要件のもと、\n国に補償を求めることができる。\n\n⸻","blanks":["一定の要件","刑事手続"],"options":[["一定の要件","人権保障の","一票の価値","投票の秘密"],["刑事手続","法の支配","国民主権","25条2項"]],"mode":"constitution"}],"45":[{"text":"ここまでの体系をまとめる。\n権利\t基本的性格\t国家との関係\n自由権\t国家から干渉されない\t国家に「するな」\n社会権\t人間らしい生活を保障\t国家に「一定のことをせよ」\n参政権\t政治に参加\t国家意思形成に参加\n受益権\t救済・補償等を求める\t国家に救済を求める\n\n⸻","blanks":["するな","一定のことをせよ","自由権","社会権","参政権"],"options":[["するな","財政","行政事件","刑事裁判"],["一定のことをせよ","一定の要件","生きていればいい","最低限度の生活"],["自由権","選挙権","被選挙権","児童"],["社会権","義務教育","裁判所","するな"],["参政権","憲法","行政事件","生活保障"]],"mode":"constitution"}],"46":[{"text":"最も重要な違いは、\n国家に何を要求する権利なのか\nである。\n自由権\n国家\n↓\n干渉するな\n↓\n個人の自由を尊重\n社会権\n国家\n↓\n一定の制度・保障を整備せよ\n↓\n実質的な生活保障\n\n⸻","blanks":["生活保障","社会権","自由権"],"options":[["生活保障","参政権","するな","刑事手続"],["社会権","国家賠償","団結権","行政事件"],["自由権","団結権","刑事裁判","普通選挙"]],"mode":"constitution"}],"47":[{"text":"社会権では、\n国家の財政・政策・社会状況\nなどが強く関係する。\nそのため、\n具体的な制度設計について立法府の裁量が認められる場面が多い。\nただし、\n立法府が何をしてもよい\nという意味ではない。\n\n⸻","blanks":["社会権","財政"],"options":[["社会権","平等","憲法","国家賠償"],["財政","選挙権","経済状況","選挙"]],"mode":"constitution"}],"48":[{"text":"社会権を実現する制度でも、\n不合理な差別\nがあれば、\n14条の平等原則\nとの関係が問題となる。\n例えば、\n社会保障制度\n↓\n給付条件を設定\n↓\nAは対象\nBは対象外\n↓\nなぜ？\n↓\n合理的な区別か？\nと考える。\n\n⸻","blanks":["社会権","平等"],"options":[["社会権","被選挙権","義務教育","経済状況"],["平等","生存権","児童","刑事手続"]],"mode":"constitution"}],"49":[{"text":"社会権は、\n単なる経済政策\nではない。\nその根底には、\n個人の尊重・人格・人間の尊厳\nという憲法13条とのつながりがある。\n13条\n個人の尊重\n↓\n人間の尊厳\n↓\n25条\n生存権\n↓\n26条\n教育\n↓\n27・28条\n労働\n\n⸻","blanks":["個人の尊重","社会権","生存権","憲法","教育"],"options":[["個人の尊重","一定の要件","刑事補償","地方公共団体"],["社会権","被選挙権","刑事補償","平等"],["生存権","自由権","選挙権","刑事裁判"],["憲法","自由権","刑事補償","団結権"],["教育","罷免","経済状況","労働者"]],"mode":"constitution"}],"50":[{"text":"参政権は、\n第1編で学んだ国民主権\nと直接つながる。\n国民主権\n↓\n政治の最終的基礎は国民\n↓\n国民の政治参加\n↓\n選挙権\n被選挙権\n請願等\n\n⸻","blanks":["国民主権","被選挙権","参政権"],"options":[["国民主権","一票の価値","基本的人権","刑事補償"],["被選挙権","個人の尊重","刑事裁判","国家賠償"],["参政権","自由権","義務教育","経済状況"]],"mode":"constitution"}],"51":[{"text":"受益権は、\n国家による権利侵害から救済される仕組み\nと考えることができる。\n例えば、\n行政が違法な処分をした\n↓\n行政事件訴訟\n公務員の違法行為で損害を受けた\n↓\n国家賠償\n刑事手続で拘禁された後に無罪\n↓\n刑事補償\nというようにつながる。\n\n⸻","blanks":["刑事補償","国家賠償","行政事件","受益権"],"options":[["刑事補償","個人の尊重","労働者","一票の価値"],["国家賠償","人権保障の","団体行動権","基本的人権"],["行政事件","生活保障","刑事裁判","労働基本権"],["受益権","国民主権","平等","選挙権"]],"mode":"constitution"}],"52":[{"text":"基本的人権\n│\n┌────────────┼────────────┐\n│            │            │\n自由権        社会権       参政権\n│            │            │\n国家から      国家に       政治に\n干渉されない   一定の保障    参加\n│            │            │\n└────────────┼────────────┘\n│\n受益権\n│\n国家による\n救済・補償\n\n⸻","blanks":["基本的人権","参政権","社会権","受益権","自由権"],"options":[["基本的人権","行政事件","生活保障","地方公共団体"],["参政権","義務教育","国家権力","刑事裁判"],["社会権","義務教育","経済状況","選挙権"],["受益権","社会権","自由権","国会"],["自由権","受益権","請願権","生存権"]],"mode":"constitution"}],"53":[{"text":"Aが生活に困窮している。\n↓\n最低限度の生活を維持できない。\n↓\n憲法25条の生存権が問題となる。\n↓\nさらに、\n具体的な給付制度・要件\nについては、\n法律・制度との関係\nを検討する。\n\n⸻","blanks":["最低限度の生活","生存権","憲法"],"options":[["最低限度の生活","民主主義社会","地方公共団体","教育を受ける権利"],["生存権","国家賠償","自由権","憲法"],["憲法","生活保障","経済状況","逮捕"]],"mode":"constitution"}],"54":[{"text":"Aは教育を受ける機会を不合理に奪われた。\n↓\n憲法26条\n↓\n教育を受ける権利\n↓\nさらに、\n14条の平等\nとの関係も問題となる可能性がある。\n\n⸻","blanks":["教育を受ける権利","憲法","平等"],"options":[["教育を受ける権利","教育を受けさせる義務","一定の事項","勤労の権利"],["憲法","受益権","自由権","するな"],["平等","生活保障","国会","国家権力"]],"mode":"constitution"}],"55":[{"text":"Aは会社員。\n使用者との間で、\n賃金・労働時間\nについて対立している。\n↓\n27条\n勤労の権利・勤労条件\n↓\n28条\n団結権・団体交渉権・団体行動権\n↓\n労働法による具体化\nという流れになる。\n\n⸻","blanks":["団体行動権","団体交渉権","勤労の権利","団結権"],"options":[["団体行動権","国家権力","刑事手続","経済的自由"],["団体交渉権","勤労の権利","国民主権","個人の尊重"],["勤労の権利","人権保障の","刑事手続","個人の尊重"],["団結権","教育","経済状況","普通選挙"]],"mode":"constitution"}],"56":[{"text":"Aは選挙で投票した。\nしかし、\n選挙区間の人口差が非常に大きい。\n↓\n投票価値の平等\n↓\n憲法14条・15条・43条等との関係\n↓\n選挙制度の合憲性\nを検討する。\n\n⸻","blanks":["憲法","平等","選挙"],"options":[["憲法","国家賠償","経済状況","普通選挙"],["平等","請願権","逮捕","自由権"],["選挙","児童","刑事裁判","自由権"]],"mode":"constitution"}],"57":[{"text":"公務員Aが職務中に違法行為を行い、\nBに損害を与えた。\n↓\n憲法17条\n↓\n国家賠償請求権\n↓\n国家賠償法\n↓\n損害賠償請求\nという流れになる。\n\n⸻","blanks":["国家賠償請求権","憲法"],"options":[["国家賠償請求権","参政権と国民主権","人権保障の","団体行動権"],["憲法","生活保障","生存権","参政権"]],"mode":"constitution"}],"58":[{"text":"Aが逮捕・勾留された。\n↓\n刑事裁判\n↓\n無罪判決\n↓\n一定の要件を満たす\n↓\n憲法40条\n↓\n刑事補償請求権\n\n⸻","blanks":["刑事補償請求権","刑事裁判","憲法","逮捕"],"options":[["刑事補償請求権","投票できる権利","参政権と国民主権","一定のことをせよ"],["刑事裁判","国民主権","参政権","刑事補償"],["憲法","法の支配","刑事補償","国会"],["逮捕","平等","刑事手続","罷免"]],"mode":"constitution"}],"59":[{"text":"① どの社会権か？\n↓\n② 憲法上何が保障されているか？\n↓\n③ 具体的な制度・法律は何か？\n↓\n④ 立法府の裁量がどこまで認められるか？\n↓\n⑤ 平等・個人の尊重などとの関係は？\n↓\n⑥ 憲法上許されるか？\n\n⸻","blanks":["個人の尊重","社会権","憲法","平等"],"options":[["個人の尊重","経済状況","25条2項","一定の事項"],["社会権","自由権","請願権","参政権"],["憲法","国民主権","社会権","選挙"],["平等","受益権","財政","刑事裁判"]],"mode":"constitution"}],"60":[{"text":"① 政治参加のどの権利か？\n↓\n② 選挙権？被選挙権？請願？\n↓\n③ どのような制約があるか？\n↓\n④ 国民主権・平等との関係は？\n↓\n⑤ 合理的な制約か？\n\n⸻","blanks":["国民主権","被選挙権","平等"],"options":[["国民主権","団結権","一票の価値","人身の自由"],["被選挙権","団体交渉権","勤労の権利","刑事裁判"],["平等","財政","義務教育","生活保障"]],"mode":"constitution"}],"61":[{"text":"① 何による権利侵害か？\n↓\n② どの救済制度が使えるか？\n↓\n③ 裁判を受ける権利\n↓\n④ 国家賠償？\n↓\n⑤ 刑事補償？\n↓\n⑥ 行政救済？\n\n⸻","blanks":["裁判を受ける権利","刑事補償","国家賠償"],"options":[["裁判を受ける権利","最低限度の生活","国家意思の形成","勤労の権利"],["刑事補償","労働者","するな","法の支配"],["国家賠償","労働基本権","刑事裁判","労働者"]],"mode":"constitution"}],"62":[{"text":"社会権の核心は、\n自由を現実に行使するための生活基盤を保障すること。\n参政権の核心は、\n国民主権を具体化し、国民が政治意思の形成に参加すること。\n受益権の核心は、\n国家による権利侵害に対して、裁判・賠償・補償などの救済を受けること。\n\n⸻","blanks":["国民主権","参政権","社会権","受益権"],"options":[["国民主権","義務教育","労働者","行政事件"],["参政権","選挙権","平等","裁判所"],["社会権","法の支配","生活保障","義務教育"],["受益権","生活保障","憲法","平等"]],"mode":"constitution"}],"63":[{"text":"ここまでの第1編～第5編をつなげる。\n第1編 憲法総論\n↓\n国家権力を制限する\n↓\n第2編 基本的人権総論\n↓\n人権保障の基本構造\n↓\n第3編 精神的自由\n↓\n思想・信教・表現・学問\n↓\n第4編 経済的自由・人身の自由\n↓\n職業・財産・身体・刑事手続\n↓\n第5編 社会権・参政権・受益権\n↓\n生活保障・政治参加・救済\n\n⸻","blanks":["経済的自由","人権保障の","基本的人権","人身の自由","生活保障"],"options":[["経済的自由","被選挙権","国家賠償","一定の事項"],["人権保障の","個人の尊重","普通選挙","投票の秘密"],["基本的人権","一票の価値","民主主義社会","刑事手続"],["人身の自由","地方公共団体","投票の秘密","生活保障"],["生活保障","人権保障の","するな","受益権"]],"mode":"constitution"}],"64":[{"text":"社会権\n1.\t社会権とは何か。\n2.\t自由権と社会権の違いは何か。\n3.\t生存権とは何か。\n4.\t憲法25条1項と2項はどう違うか。\n5.\tプログラム規定とは何か。\n6.\t生存権と立法府の関係は？\n7.\t教育を受ける権利とは何か。\n8.\t義務教育について憲法26条は何を定めるか。\n9.\t勤労の権利とは何か。\n10.\t労働条件の法定とは何か。\n11.\t団結権とは何か。\n12.\t団体交渉権とは何か。\n13.\t団体行動権とは何か。\n14.\tなぜ労働者に労働基本権が必要なのか。\n参政権\n15.\t参政権とは何か。\n16.\t選挙権とは何か。\n17.\t選挙権と国民主権はどうつながるか。\n18.\t普通選挙とは何か。\n19.\t投票価値の平等とは何か。\n20.\t一票の格差とは何か。\n21.\t被選挙権とは何か。\n22.\t投票の秘密にはどんな意味があるか。\n23.\t請願権とは何か。\n受益権\n24.\t受益権とは何か。\n25.\t裁判を受ける権利とは何か。\n26.\t国家賠償請求権とは何か。\n27.\t憲法17条と国家賠償法はどうつながるか。\n28.\t刑事補償請求権とは何か。\n29.\t国家賠償と刑事補償はどう違うか。\n総合\n30.\t自由権・社会権・参政権・受益権を比較せよ。\n31.\t社会権が「国家に一定のことを求める権利」と言われる理由は？\n32.\t社会権と個人の尊重はどうつながるか。\n33.\t社会権と14条の平等はどうつながるか。\n34.\t参政権と国民主権はどうつながるか。\n35.\t受益権と法の支配はどうつながるか。\n36.\t憲法17条と行政法・国家賠償法の関係を説明せよ。\n37.\t憲法32条と行政事件訴訟の関係を説明せよ。\n38.\t第2編から第5編までの人権保障を一つの体系として説明せよ。\n\n⸻","blanks":["国家に一定のことを求める権利","自由権・社会権・参政権・受益権","自由権と社会権の違い","裁判を受ける権利","参政権と国民主権"],"options":[["国家に一定のことを求める権利","国家は一定のことをしてほしい","教育を受ける権利","プログラム規定"],["自由権・社会権・参政権・受益権","国家意思の形成","一定の事項","国家に一定のことを求める権利"],["自由権と社会権の違い","参政権と国民主権","健康で文化的な最低限度","刑事補償請求権"],["裁判を受ける権利","一定の要件","一票の価値","刑事補償請求権"],["参政権と国民主権","25条2項","国家意思の形成","団体行動権"]],"mode":"constitution"}],"65":[{"text":"基本的人権\n│\n┌────────────────┼────────────────┐\n│                │                │\n自由権            社会権            参政権\n│                │                │\n国家から          国家に           政治に\n干渉されない      一定の保障       参加\n│                │                │\n│            ┌───┼───┐            │\n│            │   │   │            │\n│           生存 教育 労働       選挙\n│            │   │   │            │\n└────────────┴───┴───┴────────────┘\n│\n受益権\n│\n裁判・賠償・補償\n│\n↓\n人権の実効的保障\n\n⸻\n\n第5編の到達点\nここで理解すべきなのは、\n基本的人権は「国家から放っておいてもらう自由」だけではない\nということ。\n憲法は、\n自由権\n国家に不当に干渉されない。\n社会権\n人間らしく生きるための基盤を国家に保障させる。\n参政権\n国民自身が国家の政治に参加する。\n受益権\n権利を侵害されたとき、国家に救済・補償を求める。\nという複数の側面から人権を保障している。\nそして、\n個人の尊重\n↓\n基本的人権\n↓\n自由を保障\n↓\n生活基盤を保障\n↓\n政治参加を保障\n↓\n侵害された場合の救済を保障\n↓\n実効的な人権保障\nというところまでが、第5編の全体像である。","blanks":["国家から放っておいてもらう自由","個人の尊重","基本的人権","参政権","社会権"],"options":[["国家から放っておいてもらう自由","25条2項","健康で文化的な最低限度の生活","民主主義社会"],["個人の尊重","被選挙権","団体交渉権","生活保障"],["基本的人権","刑事補償","労働基本権","人身の自由"],["参政権","国家権力","裁判所","財政"],["社会権","平等","普通選挙","義務教育"]],"mode":"constitution"}]},"6":{"1":[{"text":"日本国憲法は、基本的人権を保障するだけではない。\n国民について、\n憲法上の義務\nも定めている。\n代表的なものは、\n•\t教育を受けさせる義務\n•\t勤労の義務\n•\t納税の義務\nである。\n\n⸻","blanks":["教育を受けさせる義務","納税の義務","勤労の義務","基本的人権","憲法"],"options":[["教育を受けさせる義務","国家賠償請求権","日本の人権保障","私人間の問題"],["納税の義務","私人間効力","人権制約","人権の性質上"],["勤労の義務","表現の自由","勤労の権利","人身の自由"],["基本的人権","代表民主制","国民主権","公共の福祉"],["憲法","自由権","国家賠償","人権制約"]],"mode":"constitution"}],"2":[{"text":"憲法上の代表的な義務は次の3つ。\n国民の義務\n│\n├─ 教育を受けさせる義務\n│   ↓\n│  26条\n│\n├─ 勤労の義務\n│   ↓\n│  27条\n│\n└─ 納税の義務\n↓\n30条\n\n⸻","blanks":["教育を受けさせる義務","納税の義務","勤労の義務","憲法"],"options":[["教育を受けさせる義務","憲法と行政法","一定の制約","日本の人権保障"],["納税の義務","法の支配","基本的人権","プライバシ"],["勤労の義務","令状主義","個人の尊重","人身の自由"],["憲法","参政権","逮捕","国民主権"]],"mode":"constitution"}],"3":[{"text":"憲法26条2項は、\nすべて国民は、法律の定めるところにより、その保護する子女に普通教育を受けさせる義務を負う。\nと定める。\n重要なのは、\n子ども自身に教育を受ける義務を課しているわけではない\nということ。\n基本的には、\n保護者に教育を受けさせる義務\nを課している。\n\n⸻","blanks":["教育を受けさせる義務","憲法"],"options":[["教育を受けさせる義務","法律の定めるところにより","公共の福祉","国家賠償請求権"],["憲法","裁判所","人権制約","国民主権"]],"mode":"constitution"}],"4":[{"text":"教育については、\n子ども\n↓\n教育を受ける権利\n\n保護者\n↓\n教育を受けさせる義務\n\n国家\n↓\n教育制度を整備する責務\nという三者関係で考える。\n\n⸻","blanks":["教育を受けさせる義務","教育を受ける権利"],"options":[["教育を受けさせる義務","憲法と行政法","一定の人権制約","人権制約の審査"],["教育を受ける権利","教育を受けさせる義務","個人の尊重","プライバシ"]],"mode":"constitution"}],"5":[{"text":"憲法26条2項は、\n義務教育は、これを無償とする。\nと定める。\nここで重要なのは、\n憲法が義務教育を無償とすることを要求している\nという点。\n\n⸻","blanks":["義務教育","憲法"],"options":[["義務教育","適正手続","勤労の権利","個人の尊重"],["憲法","逮捕","参政権","内閣"]],"mode":"constitution"}],"6":[{"text":"憲法27条1項は、\nすべて国民は、勤労の権利を有し、義務を負う。\nと定める。\nつまり、\n勤労\n├─ 権利\n└─ 義務\nという二面性を持つ。\n\n⸻","blanks":["勤労の権利","憲法"],"options":[["勤労の権利","個人の尊重","勤労の義務","一定の制約"],["憲法","人権保障","侵害","課税"]],"mode":"constitution"}],"7":[{"text":"勤労の義務は、\n国家が国民に対して、強制労働を自由に命じることができる\nという意味ではない。\nむしろ、\n社会の構成員として勤労に努めることについての憲法上の規定\nとして理解する。\n\n⸻","blanks":["勤労の義務","憲法"],"options":[["勤労の義務","勤労の権利","精神的自由","代表民主制"],["憲法","内閣","生存権","逮捕"]],"mode":"constitution"}],"8":[{"text":"憲法30条は、\n国民は、法律の定めるところにより、納税の義務を負う。\nと定める。\nここで非常に重要なのが、\n「法律の定めるところにより」\nという部分。\n\n⸻","blanks":["法律の定めるところにより","納税の義務","憲法"],"options":[["法律の定めるところにより","手段の相当性","二重の基準論","権利があります"],["納税の義務","精神的自由","政治的表現","人権の性質上"],["憲法","黙秘権","立憲主義","人権"]],"mode":"constitution"}],"9":[{"text":"納税義務と深く関係するのが、\n租税法律主義\nである。\n国家が国民から税金を徴収するには、\n法律による根拠が必要\nという原則。\n国家\n↓\n税を取りたい\n↓\n法律上の根拠が必要\n↓\n国民に課税\n\n⸻","blanks":["租税法律主義","課税"],"options":[["租税法律主義","手段の相当性","罪刑法定主義","二重の基準論"],["課税","法の支配","憲法","社会権"]],"mode":"constitution"}],"10":[{"text":"税金は、\n国民の財産を国家に移転させる仕組み\nである。\nそのため、\n行政が自由に税金を決める\nことを許すと、\n国民の財産権が危険にさらされる。\nそこで、\n国会による法律\nを通じて課税を決める。\nこれは、\n国民主権・代表民主制・財産権保障\nともつながる。\n\n⸻","blanks":["代表民主制","国民主権","財産権","国会","課税"],"options":[["代表民主制","勤労の義務","令状主義","表現の自由"],["国民主権","合理的理由","公共の福祉","義務教育"],["財産権","比例性","刑事補償","内閣"],["国会","審査基準","選挙","法の支配"],["課税","社会権","審査基準","平等"]],"mode":"constitution"}],"11":[{"text":"義務と権利は対立するだけではない。\n基本的人権\n↓\n個人の自由・尊厳\n↓\n社会全体の制度\n↓\nその制度を維持するための義務\nという関係もある。\n\n⸻","blanks":["基本的人権","社会全体の制度"],"options":[["基本的人権","国家賠償","代表民主制","刑事補償"],["社会全体の制度","私人間の紛争","公共の福祉","人権の性質上"]],"mode":"constitution"}],"12":[{"text":"ただし、\n「義務だから何でも国家が強制できる」\nわけではない。\n国家による義務の具体化も、\n憲法の人権保障\nによって制約される。\n\n⸻","blanks":["義務だから何でも国家が強制できる","憲法"],"options":[["義務だから何でも国家が強制できる","社会全体の制度","日本の人権保障","必要以上の制約"],["憲法","義務教育","自由権","逮捕"]],"mode":"constitution"}],"13":[{"text":"基本的人権には、\n公共の福祉による制約\nが問題になる。\nしかし、\n公共の福祉＝国家が好きなように人権を制限できる\nではない。\n\n⸻","blanks":["公共の福祉","基本的人権"],"options":[["公共の福祉","二重の基準論","人権の性質上","刑事補償"],["基本的人権","私人間効力","個人の尊重","手段の相当性"]],"mode":"constitution"}],"14":[{"text":"人権制約は、\n人権がある\n↓\n国家による制約\n↓\n目的は正当か？\n↓\n手段は適切か？\n↓\n必要以上の制約ではないか？\n↓\n人権侵害が許されるか？\nという流れで考える。\n\n⸻","blanks":["必要以上の制約","人権制約"],"options":[["必要以上の制約","人権の性質上","権利があります","勤労の権利"],["人権制約","人権保障","審査基準","立法裁量"]],"mode":"constitution"}],"15":[{"text":"人権制約では、\n比例性\nという考え方が重要。\nつまり、\n目的を達成するために必要な範囲を超えて人権を制限していないか\nを考える。\n目的\n↓\n必要性\n↓\n手段の相当性\n↓\n人権への負担\n\n⸻","blanks":["比例性","手段の相当性"],"options":[["比例性","内閣","適正手続","裁判所"],["手段の相当性","公共の福祉","社会全体の制度","二重の基準論"]],"mode":"constitution"}],"16":[{"text":"これまで学んだ人権を比較する。\n類型\t代表例\t重要性\n精神的自由\t思想・信教・表現\t民主主義・人格形成\n経済的自由\t職業・財産\t経済活動・生活\n人身の自由\t逮捕・刑事手続\t身体・刑事手続\n社会権\t生存・教育・労働\t人間らしい生活\n参政権\t選挙\t国民主権\n受益権\t裁判・国家賠償\t権利救済\n\n⸻","blanks":["経済的自由","人身の自由","国民主権","国家賠償","参政権"],"options":[["経済的自由","審査基準","手段の相当性","二重の基準論"],["人身の自由","経済的自由","刑事補償","法の支配"],["国民主権","勤労の権利","社会権","義務教育"],["国家賠償","令状主義","人権制約","勤労の義務"],["参政権","内閣","義務教育","自由権"]],"mode":"constitution"}],"17":[{"text":"人権制約の審査では、\n精神的自由\nと\n経済的自由\nを同じ強さで審査するとは限らない。\n一般に、\n精神的自由への規制については、より厳格な審査が必要\nと考えられる。\n\n⸻","blanks":["経済的自由","人権制約の審査"],"options":[["経済的自由","令状主義","公共の福祉","国民主権"],["人権制約の審査","一定の制約","権利があります","手段の相当性"]],"mode":"constitution"}],"18":[{"text":"精神的自由は、\n民主主義そのもの\nと深く関係する。\n例えば、\n政府を批判する自由\nが制限されると、\n政府を批判できない\n↓\n国民が情報を得られない\n↓\n政治的意思形成が困難\n↓\n民主主義が弱くなる\nしたがって、精神的自由への制約には慎重な審査が必要になる。\n\n⸻","blanks":["政治的意思形成","精神的自由"],"options":[["政治的意思形成","労働基本権","憲法の基本構造","代表民主制"],["精神的自由","経済的自由","一定の制約","プライバシ"]],"mode":"constitution"}],"19":[{"text":"表現の自由は、\n自己実現\nと\n自己統治\nの両面から重要である。\n表現\n↓\n意見を伝える\n↓\n他人が知る\n↓\n議論が生まれる\n↓\n政治的意思形成\n↓\n民主主義\n\n⸻","blanks":["表現の自由","政治的意思形成"],"options":[["表現の自由","人権の性質上","法の支配","代表民主制"],["政治的意思形成","憲法と行政法","一定の人権制約","労働基本権"]],"mode":"constitution"}],"20":[{"text":"人権保障では、\nその人にどの権利があるか\nだけではなく、\n他の人と不合理に差別されていないか\nも確認する。\n憲法14条が重要になる。\n\n⸻","blanks":["憲法","人権保障"],"options":[["憲法","法の支配","審査基準","令状主義"],["人権保障","立法裁量","代表民主制","政治的表現"]],"mode":"constitution"}],"21":[{"text":"平等とは、\n全員を常に完全に同じに扱う\nという意味ではない。\n重要なのは、\n合理的理由のない差別をしないこと\nである。\nAとBを区別\n↓\n違いがある\n↓\n区別する目的は正当か？\n↓\n区別に合理性があるか？\n↓\n不合理な差別ではないか？\n\n⸻","blanks":["平等","合理的理由"],"options":[["平等","裁判所","義務教育","侵害"],["合理的理由","刑事補償","基本的人権","精神的自由"]],"mode":"constitution"}],"22":[{"text":"人権は、\n常に一人だけの問題になるとは限らない。\n例えば、\nAの表現の自由\nと\nBのプライバシー\nが衝突することがある。\n\n⸻","blanks":["プライバシ","表現の自由"],"options":[["プライバシ","刑事補償","国民主権","一定の制約"],["表現の自由","一定の制約","経済的自由","人権の性質上"]],"mode":"constitution"}],"23":[{"text":"Aの人権\n↓\n表現の自由\n\nVS\n\nBの人権\n↓\nプライバシー\n↓\nどちらか一方を無条件に優先するのではなく、\n双方の権利をできる限り調整する\nことが必要。\n\n⸻","blanks":["プライバシ","表現の自由"],"options":[["プライバシ","国民主権","私人間の問題","人権の性質上"],["表現の自由","令状主義","精神的自由","私人間の問題"]],"mode":"constitution"}],"24":[{"text":"憲法の人権規定は、\n基本的には国家権力を拘束するもの\nである。\nしかし、\n民間企業・私人同士\nの関係でも人権問題が生じる。\nそこで、\n私人間効力\nが問題になる。\n\n⸻","blanks":["私人間効力","憲法"],"options":[["私人間効力","国民主権","手段の相当性","精神的自由"],["憲法","選挙","令状主義","黙秘権"]],"mode":"constitution"}],"25":[{"text":"私人間の問題では、\n憲法の人権保障を直接そのまま私人に適用する\nのではなく、\n民法90条の公序良俗などの一般条項を通じて人権の価値を考慮する\nという考え方が重要になる。\n\n⸻","blanks":["憲法","私人間の問題"],"options":[["憲法","違憲審査","審査基準","財産権"],["私人間の問題","国家賠償請求権","人権制約の審査","社会全体の利益"]],"mode":"constitution"}],"26":[{"text":"行政機関も、\n憲法に従わなければならない。\n例えば、\n行政が許可を拒否した\n↓\n職業の自由との関係\n行政が表現活動を制限した\n↓\n表現の自由との関係\nというように考える。\n\n⸻","blanks":["表現の自由","憲法"],"options":[["表現の自由","人権の性質上","勤労の権利","納税の義務"],["憲法","財産権","法の支配","違憲審査"]],"mode":"constitution"}],"27":[{"text":"憲法と行政法は、\n別々の科目\nではあるが、\n現実の事件では一体となって働く。\n憲法\n↓\n人権保障\n↓\n行政法\n↓\n行政活動を具体的に規律\n↓\n違法な行政活動\n↓\n取消訴訟・国家賠償等\n\n⸻","blanks":["憲法と行政法","国家賠償"],"options":[["憲法と行政法","勤労の義務","個人の尊重","罪刑法定主義"],["国家賠償","比例性","参政権","勤労の義務"]],"mode":"constitution"}],"28":[{"text":"私人間の紛争では、\n民法\nが中心になる。\n例えば、\n契約\n不法行為\n不当利得\nなど。\nただし、その解釈・適用の背景に、\n憲法上の人権価値\nが関係する場合がある。\n\n⸻","blanks":["憲法","私人間の紛争"],"options":[["憲法","刑事補償","課税","内閣"],["私人間の紛争","私人間の問題","必要以上の制約","プライバシ"]],"mode":"constitution"}],"29":[{"text":"刑法では、\n人身の自由\nと強く関係する。\n国家が刑罰を科す以上、\n罪刑法定主義\n適正手続\n令状主義\n黙秘権\n自白法則\nなどが重要になる。\n\n⸻","blanks":["罪刑法定主義","人身の自由","令状主義","適正手続","黙秘権"],"options":[["罪刑法定主義","二重の基準論","権利があります","私人間効力"],["人身の自由","経済的自由","代表民主制","令状主義"],["令状主義","人身の自由","勤労の権利","立憲主義"],["適正手続","参政権","一定の制約","労働基本権"],["黙秘権","違憲審査","内閣","侵害"]],"mode":"constitution"}],"30":[{"text":"日本の人権保障は、\n日本国憲法だけ\nで完結するわけではない。\n国際人権規約など、\n国際的な人権保障\nも関係する。\n\n⸻","blanks":["憲法","日本の人権保障"],"options":[["憲法","黙秘権","内閣","法の支配"],["日本の人権保障","人身の自由","罪刑法定主義","人権制約の審査"]],"mode":"constitution"}],"31":[{"text":"基本的人権は、\n「国民」に保障されるもの\nだけではない。\n権利の性質によって、\n外国人\n法人\nなどについても保障される場合がある。\n\n⸻","blanks":["国民","基本的人権","外国人"],"options":[["国民","内閣","権力分立","人権"],["基本的人権","精神的自由","代表民主制","国家賠償"],["外国人","違憲審査","国民主権","生存権"]],"mode":"constitution"}],"32":[{"text":"外国人についても、\n人権の性質上、日本国民だけに限定されないもの\nについては保障され得る。\n一方、\n日本国民の政治参加など\n性質上日本国民に限られるものもある。\n\n⸻","blanks":["外国人","人権の性質上"],"options":[["外国人","立法裁量","権力分立","令状主義"],["人権の性質上","憲法の基本構造","社会全体の制度","合理的理由"]],"mode":"constitution"}],"33":[{"text":"法人も、\n権利の性質上可能な範囲で\n憲法上の人権保障を受け得る。\n例えば、\n財産権\n表現活動に関する利益\nなど。\nただし、\n一身専属的な権利\nなどは法人にはそのまま当てはまらない。\n\n⸻","blanks":["財産権","憲法"],"options":[["財産権","比例性","黙秘権","裁判所"],["憲法","人権保障","令状主義","財産権"]],"mode":"constitution"}],"34":[{"text":"未成年者も、\n基本的人権の主体\nである。\nただし、\n年齢・発達段階\nを考慮して一定の制約が認められる場合がある。\n\n⸻","blanks":["基本的人権","一定の制約"],"options":[["基本的人権","人権の性質上","憲法と行政法","刑事補償"],["一定の制約","審査基準","憲法と行政法","合理的理由"]],"mode":"constitution"}],"35":[{"text":"公務員も、\n人権の主体\nである。\nしかし、\n公務の性質\nなどから、\n一定の人権制約\nが問題になる。\n特に、\n労働基本権\n政治活動\nなどが重要。\n\n⸻","blanks":["労働基本権","一定の人権制約"],"options":[["労働基本権","審査基準","代表民主制","刑事補償"],["一定の人権制約","一定の制約","必要以上の制約","プライバシ"]],"mode":"constitution"}],"36":[{"text":"基本的人権は重要だが、\n絶対無制限ではない\n場合が多い。\nただし、\nどんな制約でも許される\nわけではない。\n重要なのは、\n憲法上正当化できる制約か\nである。\n\n⸻","blanks":["基本的人権","憲法"],"options":[["基本的人権","二重の基準論","公共の福祉","法の支配"],["憲法","内閣","人権","国会"]],"mode":"constitution"}],"37":[{"text":"憲法問題では、次の順序を意識する。\n① 誰の問題か\n↓\n② 何の権利か\n↓\n③ 憲法上どの条文か\n↓\n④ 国家が何を制約したか\n↓\n⑤ 制約目的は何か\n↓\n⑥ 手段は適切か\n↓\n⑦ 審査基準はどの程度厳しいか\n↓\n⑧ 比例性・合理性\n↓\n⑨ 合憲か違憲か\n\n⸻","blanks":["比例性","憲法"],"options":[["比例性","課税","義務教育","権力分立"],["憲法","社会権","外国人","審査基準"]],"mode":"constitution"}],"38":[{"text":"政府が、\n政府批判のSNS投稿を禁止する法律\nを制定した。\nまず、\n表現の自由\nが問題。\n↓\n憲法21条\n↓\n精神的自由\n↓\n政治的表現\n↓\n民主主義との関係\n↓\n厳格な審査が必要となる可能性が高い。\n\n⸻","blanks":["政治的表現","表現の自由","憲法"],"options":[["政治的表現","表現の自由","一定の制約","プライバシ"],["表現の自由","プライバシ","審査基準","人権制約"],["憲法","選挙","国会","裁判所"]],"mode":"constitution"}],"39":[{"text":"法律が、\n一定の職業について厳しい資格制限\nを設けた。\n↓\n職業選択の自由\n↓\n憲法22条\n↓\n経済的自由\n↓\n規制目的を確認\n↓\n規制手段を確認\n↓\n合理性・必要性を検討。\n\n⸻","blanks":["職業選択の自由","経済的自由","憲法"],"options":[["職業選択の自由","必要以上の制約","憲法の基本構造","権利があります"],["経済的自由","表現の自由","私人間の問題","合理的理由"],["憲法","平等","裁判所","人権制約"]],"mode":"constitution"}],"40":[{"text":"生活に困窮したAが、\n社会保障給付を受けられない\nと主張した。\n↓\n25条\n↓\n生存権\n↓\n具体的制度を確認\n↓\n法律の内容\n↓\n立法裁量\n↓\n平等との関係\n↓\n憲法上問題がないか検討。\n\n⸻","blanks":["立法裁量","生存権","憲法","平等"],"options":[["立法裁量","社会権","国家賠償","労働基本権"],["生存権","財産権","社会権","国会"],["憲法","内閣","審査基準","比例性"],["平等","違憲審査","国会","外国人"]],"mode":"constitution"}],"41":[{"text":"選挙区によって、\n有権者数に大きな差\nがある。\n↓\n15条\n↓\n14条\n↓\n43条等\n↓\n投票価値の平等\n↓\n選挙制度の合理性\n↓\n違憲性を検討。\n\n⸻","blanks":["平等","選挙"],"options":[["平等","令状主義","生存権","黙秘権"],["選挙","立憲主義","国家賠償","比例性"]],"mode":"constitution"}],"42":[{"text":"Aが逮捕された。\n↓\n人身の自由\n↓\n憲法33条\n↓\n原則として令状が必要\n↓\n現行犯逮捕などの例外\n↓\nその逮捕が憲法上許されるか検討。\n\n⸻","blanks":["人身の自由","憲法","逮捕"],"options":[["人身の自由","令状主義","二重の基準論","経済的自由"],["憲法","刑事補償","義務教育","内閣"],["逮捕","参政権","選挙","立憲主義"]],"mode":"constitution"}],"43":[{"text":"公務員の違法行為により、\nAが損害を受けた。\n↓\n憲法17条\n↓\n国家賠償請求権\n↓\n国家賠償法\n↓\n具体的要件を検討。\n\n⸻","blanks":["国家賠償請求権","憲法"],"options":[["国家賠償請求権","基本的人権","罪刑法定主義","一定の制約"],["憲法","生存権","自由権","逮捕"]],"mode":"constitution"}],"44":[{"text":"最終的に、\n国家の行為が憲法に適合するか\nを判断する必要がある。\nこれが、\n違憲審査\nである。\n\n⸻","blanks":["違憲審査","憲法"],"options":[["違憲審査","勤労の義務","人権制約","適正手続"],["憲法","裁判所","国家賠償","国民主権"]],"mode":"constitution"}],"45":[{"text":"国家の行為\n↓\n法律・行政・その他の国家作用\n↓\n基本的人権を制約？\n↓\n憲法上の根拠\n↓\n正当な目的？\n↓\n合理的・必要な手段？\n↓\n憲法に適合？\n\n⸻","blanks":["基本的人権","憲法"],"options":[["基本的人権","労働基本権","勤労の権利","公共の福祉"],["憲法","権力分立","人権保障","課税"]],"mode":"constitution"}],"46":[{"text":"人権保障は、\n裁判所だけ\nの仕事ではない。\n国会\n↓\n憲法に適合する法律を制定\n\n内閣・行政\n↓\n憲法・法律に従って行政\n\n裁判所\n↓\n具体的事件で憲法適合性を審査\n\n⸻","blanks":["裁判所","国会","憲法","内閣"],"options":[["裁判所","審査基準","違憲審査","外国人"],["国会","選挙","審査基準","人権保障"],["憲法","平等","権力分立","財産権"],["内閣","審査基準","立憲主義","人権制約"]],"mode":"constitution"}],"47":[{"text":"基本的人権\n│\n├─ 精神的自由\n│   ├─ 思想・良心\n│   ├─ 信教\n│   ├─ 表現\n│   ├─ 集会・結社\n│   └─ 学問\n│\n├─ 経済的自由\n│   ├─ 居住・移転\n│   ├─ 職業\n│   └─ 財産\n│\n├─ 人身の自由\n│   ├─ 適正手続\n│   ├─ 令状\n│   ├─ 黙秘\n│   └─ 刑事手続保障\n│\n├─ 社会権\n│   ├─ 生存\n│   ├─ 教育\n│   └─ 労働\n│\n├─ 参政権\n│   ├─ 選挙\n│   └─ 政治参加\n│\n└─ 受益権\n├─ 裁判\n├─ 国家賠償\n└─ 刑事補償\n\n⸻","blanks":["経済的自由","基本的人権","人身の自由","刑事補償","国家賠償"],"options":[["経済的自由","法の支配","国民主権","二重の基準論"],["基本的人権","私人間の問題","人権制約","納税の義務"],["人身の自由","私人間効力","憲法と行政法","権力分立"],["刑事補償","個人の尊重","労働基本権","人権保障"],["国家賠償","個人の尊重","プライバシ","法の支配"]],"mode":"constitution"}],"48":[{"text":"人権保障には大きく二つの方向がある。\n国家から守る\n国家\n↓\n干渉するな\n↓\n自由権\n国家に保障を求める\n国家\n↓\n一定の制度・保障を整備せよ\n↓\n社会権等\n\n⸻","blanks":["社会権","自由権"],"options":[["社会権","侵害","権力分立","人権制約"],["自由権","法の支配","比例性","権力分立"]],"mode":"constitution"}],"49":[{"text":"さらに、\n① 人権を認める\n↓\n② 人権を侵害しない\n↓\n③ 侵害されたら救済する\nという構造で理解できる。\n\n⸻","blanks":["人権","侵害"],"options":[["人権","侵害","国会","国家賠償"],["侵害","審査基準","権力分立","自由権"]],"mode":"constitution"}],"50":[{"text":"「権利があります」と憲法に書いてあるだけでは、\n実際に権利が守られるとは限らない。\nそこで、\n裁判\n国家賠償\n行政救済\n刑事補償\nなどの仕組みが必要になる。\n\n⸻","blanks":["権利があります","刑事補償","国家賠償","憲法"],"options":[["権利があります","人身の自由","合理的理由","社会全体の利益"],["刑事補償","人権保障","権力分立","個人の尊重"],["国家賠償","個人の尊重","権力分立","一定の制約"],["憲法","国会","選挙","権力分立"]],"mode":"constitution"}],"51":[{"text":"法の支配とは、\n国家権力も法に従わなければならない\nという原理。\nしたがって、\n国家権力\n↓\n憲法\n↓\n法律\n↓\n行政・立法・司法\nという形で、\n国家権力を法によってコントロールする。\n\n⸻","blanks":["法の支配","憲法"],"options":[["法の支配","個人の尊重","公共の福祉","労働基本権"],["憲法","立憲主義","選挙","義務教育"]],"mode":"constitution"}],"52":[{"text":"立憲主義は、\n憲法によって国家権力を制限する考え方。\nその中心的な目的の一つが、\n基本的人権の保障\nである。\n\n⸻","blanks":["基本的人権","立憲主義","憲法"],"options":[["基本的人権","精神的自由","憲法と行政法","代表民主制"],["立憲主義","審査基準","外国人","違憲審査"],["憲法","立法裁量","刑事補償","黙秘権"]],"mode":"constitution"}],"53":[{"text":"国民主権は、\n国家の政治の基礎を国民に置く。\n基本的人権は、\n国家によって国民の自由・尊厳を保障する。\nしたがって、\n国民主権\n＋\n基本的人権\n＋\n権力分立\n＋\n法の支配\n↓\n立憲民主主義\nという関係になる。\n\n⸻","blanks":["基本的人権","国民主権","権力分立","法の支配"],"options":[["基本的人権","代表民主制","法の支配","権力分立"],["国民主権","審査基準","生存権","刑事補償"],["権力分立","違憲審査","比例性","外国人"],["法の支配","労働基本権","令状主義","政治的表現"]],"mode":"constitution"}],"54":[{"text":"人権は、\n他人の人権\nや\n社会全体の利益\nとの調整が必要になる。\nただし、\n公共の福祉\nは、\n国家の都合\nを意味しない。\n\n⸻","blanks":["公共の福祉","社会全体の利益"],"options":[["公共の福祉","政治的表現","国家賠償","個人の尊重"],["社会全体の利益","日本の人権保障","プライバシ","憲法の基本構造"]],"mode":"constitution"}],"55":[{"text":"問題を見たら、\n「誰の、どの人権が、国家によって、どのように制約されたのか」\nを最初に考える。\nその後、\n権利\n↓\n制約\n↓\n目的\n↓\n手段\n↓\n審査基準\n↓\n比例性\n↓\n合憲性\nと進める。\n\n⸻","blanks":["比例性","審査基準"],"options":[["比例性","侵害","自由権","国家賠償"],["審査基準","個人の尊重","国家賠償","代表民主制"]],"mode":"constitution"}],"56":[{"text":"第6編で最も重要なのは、\n人権を個別に暗記するのではなく、相互関係を理解すること。\n憲法の基本構造は、\n個人の尊重\n↓\n基本的人権\n↓\n自由を保障\n↓\n生活を保障\n↓\n政治参加を保障\n↓\n国家権力を制限\n↓\n侵害された場合に救済\nである。\n\n⸻","blanks":["憲法の基本構造","個人の尊重","基本的人権"],"options":[["憲法の基本構造","プライバシ","憲法と行政法","一定の制約"],["個人の尊重","納税の義務","私人間効力","一定の制約"],["基本的人権","人権制約","審査基準","勤労の義務"]],"mode":"constitution"}],"57":[{"text":"義務\n1.\t日本国憲法上の代表的な三つの義務は？\n2.\t教育を受けさせる義務とは？\n3.\t勤労の義務とは？\n4.\t勤労の義務から強制労働が当然に認められるか？\n5.\t納税の義務とは？\n6.\t租税法律主義とは？\n7.\tなぜ租税法律主義が必要なのか？\n人権\n8.\t自由権と社会権の違いは？\n9.\t精神的自由が重要な理由は？\n10.\t二重の基準論とは？\n11.\t比例性とは？\n12.\t公共の福祉とは？\n13.\t人権衝突とは？\n14.\t私人間効力とは？\n15.\t外国人にも人権は保障されるか？\n16.\t法人にも人権は保障されるか？\n総合\n17.\t人権制約を判断する手順を説明せよ。\n18.\t表現の自由とプライバシーが衝突したらどう考えるか。\n19.\t職業規制では何を検討するか。\n20.\t生存権ではなぜ立法裁量が問題になるか。\n21.\t選挙権と国民主権の関係は？\n22.\t国家賠償請求権と行政法の関係は？\n23.\t人権保障と法の支配はどうつながるか。\n24.\t人権保障と立憲主義はどうつながるか。\n25.\t第1編から第6編までを一本の体系として説明せよ。\n\n⸻","blanks":["なぜ租税法律主義が必要なのか","自由権と社会権の違い","教育を受けさせる義務","国家賠償請求権","二重の基準論"],"options":[["なぜ租税法律主義が必要なのか","一定の制約","日本の人権保障","自由権と社会権の違い"],["自由権と社会権の違い","人権制約の審査","なぜ租税法律主義が必要なのか","憲法の基本構造"],["教育を受けさせる義務","なぜ租税法律主義が必要なのか","私人間の紛争","一定の制約"],["国家賠償請求権","社会全体の制度","二重の基準論","罪刑法定主義"],["二重の基準論","手段の相当性","勤労の義務","人権制約の審査"]],"mode":"constitution"}],"58":[{"text":"日本国憲法\n│\n┌────────────┴────────────┐\n│                         │\n国家権力の制限              人権保障\n│                         │\n立憲主義                    個人の尊重\n権力分立                      │\n法の支配                      ↓\n│                  ┌─────┴─────┐\n│                  │           │\n│                自由        保障\n│                  │           │\n│          ┌───────┼───────┐   │\n│          │       │       │   │\n│        精神的   経済的   人身 社会権\n│          │       │       │   │\n│          └───────┼───────┘   │\n│                  │           │\n│               参政権        │\n│                  │           │\n│               受益権────────┘\n│                  │\n└───────────→ 実効的保障\n\n⸻\n\n第6編の最終到達点\nここまで学んだことで、\n「憲法上、人権がある」\nというところから一歩進んで、\n「国家がその人権を制約したとき、その制約が憲法上許されるのかを分析する」\nところまで到達する。\n憲法の人権問題は、\n① 誰の権利か\n\n↓\n\n② どの人権か\n\n↓\n\n③ 国家が何をしたか\n\n↓\n\n④ どのような制約か\n\n↓\n\n⑤ 目的は正当か\n\n↓\n\n⑥ 手段は合理的・必要か\n\n↓\n\n⑦ 人権への負担は過大ではないか\n\n↓\n\n⑧ 憲法に適合するか\nという一本の流れで考える。\nこれが、基本的人権分野を理解するための最重要思考回路である。","blanks":["憲法上、人権がある","個人の尊重","基本的人権","権力分立","立憲主義"],"options":[["憲法上、人権がある","社会全体の制度","必要以上の制約","人権制約の審査"],["個人の尊重","一定の制約","二重の基準論","私人間の問題"],["基本的人権","人身の自由","一定の制約","労働基本権"],["権力分立","プライバシ","義務教育","立法裁量"],["立憲主義","権力分立","代表民主制","政治的表現"]],"mode":"constitution"}]},"7":{"1":[{"text":"国会は、\n国の唯一の立法機関\nである。\nこれは憲法41条に定められている。\nつまり国会は、\n国民の代表者によって構成され、法律を制定する国家機関\nである。\n\n⸻","blanks":["唯一の立法機関","国会","憲法"],"options":[["唯一の立法機関","国会の会期","免責特権","内閣不信任決議"],["国会","法律制定","歳費","任期"],["憲法","法律案","内閣","国民主権"]],"mode":"constitution"}],"2":[{"text":"国会を理解するには、\n国民主権\nから考える。\n日本では国民が主権者だが、国民全員が毎回直接法律を作るわけではない。\nそこで、\n国民\n↓\n選挙\n↓\n国民の代表者\n↓\n国会\n↓\n法律の制定\nという代表民主制を採用している。\n\n⸻","blanks":["代表民主制","国民主権","国会","選挙"],"options":[["代表民主制","定足数","二院制","違憲審査"],["国民主権","免責特権","参議院","自分の議員"],["国会","憲法","常会","裁判所"],["選挙","常会","立法裁量","国政調査"]],"mode":"constitution"}],"3":[{"text":"憲法41条は、\n国会は、国権の最高機関であって、国の唯一の立法機関である。\nと定める。\nここには3つの重要な言葉がある。\n国会\n│\n├─ 国権の最高機関\n│\n├─ 唯一の立法機関\n│\n└─ 国民の代表機関\n\n⸻","blanks":["唯一の立法機関","国権の最高機関","国会","憲法"],"options":[["唯一の立法機関","国政調査","内閣総理大臣の指名","プライバシ"],["国権の最高機関","プライバシ","会期不継続の原則","内閣不信任決議"],["国会","議会","選挙","国民主権"],["憲法","最高機関","議決","予算"]],"mode":"constitution"}],"4":[{"text":"「最高機関」という言葉だけを見ると、\n国会が国家機関の中で法律上最も上位にある\nように見える。\nしかし、三権分立のもとでは、\n国会が内閣や裁判所を上下関係で直接支配する\nという意味ではない。\nむしろ、\n国民の代表機関として政治的に重要な地位にある\nという意味で理解する。\n\n⸻","blanks":["最高機関","裁判所","国会","内閣"],"options":[["最高機関","代表民主制","裁判所","国民主権"],["裁判所","立法裁量","逮捕","常会"],["国会","裁判所","議会","予算"],["内閣","解散","国政調査","国会"]],"mode":"constitution"}],"5":[{"text":"「唯一の立法機関」とは、\n原則として国会が法律を制定する\nということ。\nただし、\n行政が命令を制定する\nこともある。\nここで、\n法律\nと\n命令\nを区別する必要がある。\n\n⸻","blanks":["唯一の立法機関","国会"],"options":[["唯一の立法機関","基本的人権","衆議院の優越","国権の最高機関"],["国会","立法裁量","裁判所","国政調査"]],"mode":"constitution"}],"6":[{"text":"法律\n↓\n国会\n↓\n国民代表による立法\n\n命令\n↓\n内閣など\n↓\n法律を執行・具体化するための規範\nしたがって、\n行政が勝手に法律と同じものを作れる\nわけではない。\n\n⸻","blanks":["国会","内閣"],"options":[["国会","権力分立","常会","立法裁量"],["内閣","国政調査","逮捕","立法裁量"]],"mode":"constitution"}],"7":[{"text":"日本国憲法では、\n国民の権利・義務に重大な影響を与える事項\nについて、\n国会が法律によって定める\nことが重要になる。\nこれが、\n国会中心立法の原則\nである。\n\n⸻","blanks":["国会中心立法の原則","憲法"],"options":[["国会中心立法の原則","出席議員の過半数","国会の会期","議員の任期"],["憲法","裁判所","衆議院","議決"]],"mode":"constitution"}],"8":[{"text":"日本の国会は、\n二院制\nを採用している。\n国会\n│\n├─ 衆議院\n│\n└─ 参議院\nこれを、\n両院制・二院制\nという。\n\n⸻","blanks":["二院制","衆議院","参議院","国会"],"options":[["二院制","予算","解散","国会"],["衆議院","常会","最高機関","権力分立"],["参議院","立法裁量","内閣","国民主権"],["国会","憲法","予算","免責特権"]],"mode":"constitution"}],"9":[{"text":"一つの議院だけではなく、\n二つの議院\nによって審議することで、\n法律制定を慎重にする\nことができる。\nまた、\n衆議院と参議院で異なる視点\nを取り入れることもできる。\n\n⸻","blanks":["法律制定","衆議院","参議院"],"options":[["法律制定","議院内閣制","権力分立","議員の任期"],["衆議院","違憲審査","参議院","歳費"],["参議院","二院制","権力分立","国政調査"]],"mode":"constitution"}],"10":[{"text":"衆議院は、\n任期4年\nである。\nただし、\n解散\nがある。\nしたがって、\n原則\n↓\n任期4年\n\nただし\n↓\n解散\n↓\n任期途中で終了\nとなる。\n\n⸻","blanks":["衆議院","解散","任期"],"options":[["衆議院","天皇","免責特権","定足数"],["解散","特別会","内閣","参議院"],["任期","参議院","国会","常会"]],"mode":"constitution"}],"11":[{"text":"参議院の任期は、\n6年\nである。\nそして、\n3年ごとに議員の半数を改選\nする。\n参議院には、\n解散がない\nという重要な特徴がある。\n\n⸻","blanks":["参議院","解散","任期"],"options":[["参議院","国政調査","逮捕","国民主権"],["解散","逮捕","参議院","国政調査"],["任期","選挙","内閣","法律制定"]],"mode":"constitution"}],"12":[{"text":"項目\t衆議院\t参議院\n任期\t4年\t6年\n解散\tあり\tなし\n半数改選\tなし\t3年ごと\n民意の反映\tより直接的\t長期的・安定的\n内閣との関係\t強い\t衆議院より弱い\n\n⸻","blanks":["衆議院","参議院","解散","内閣","任期"],"options":[["衆議院","国会","権力分立","懲罰"],["参議院","国政調査","解散","逮捕"],["解散","権力分立","議決","衆議院"],["内閣","懲罰","二院制","参議院"],["任期","法律案","国会","常会"]],"mode":"constitution"}],"13":[{"text":"国会議員は、\n選挙\nによって選ばれる。\nこれは、\n国民主権\nを具体化する制度である。\n国民が、\n国会議員を選ぶ\n↓\n議員が、\n国会で法律を制定する。\n\n⸻","blanks":["選挙","国民主権","国会"],"options":[["選挙","法律案","天皇","逮捕"],["国民主権","権力分立","違憲審査","特別会"],["国会","憲法","条約","法律制定"]],"mode":"constitution"}],"14":[{"text":"国会議員については、\n憲法が議員の資格を法律で定めることを予定している。\n具体的な選挙資格・被選挙資格等は、\n公職選挙法\nなどによって定められる。\n\n⸻","blanks":["国会","憲法","選挙"],"options":[["国会","二院制","参議院","特別会"],["憲法","国政調査","解散","最高機関"],["選挙","立法裁量","定足数","法律制定"]],"mode":"constitution"}],"15":[{"text":"議員の任期は、\n民意を政治に反映させる\nという意味を持つ。\n選挙\n↓\n議員\n↓\n任期\n↓\n政治活動\n↓\n次の選挙\n↓\n国民による評価\nこの循環によって、\n国民による政治的コントロール\nが働く。\n\n⸻","blanks":["議員の任期","選挙"],"options":[["議員の任期","不逮捕特権","財政民主主義","内閣不信任決議"],["選挙","権力分立","二院制","特別会"]],"mode":"constitution"}],"16":[{"text":"憲法は、\n国会議員の活動を保障するための特別な制度\nを定めている。\n代表的なものは、\n•\t不逮捕特権\n•\t免責特権\n•\t歳費\nである。\n\n⸻","blanks":["不逮捕特権","免責特権","国会","憲法","歳費"],"options":[["不逮捕特権","二院制","財政民主主義","定足数"],["免責特権","法律制定","一定の自主性","国会の活動"],["国会","国民主権","歳費","最高機関"],["憲法","歳費","天皇","選挙"],["歳費","逮捕","予算","解散"]],"mode":"constitution"}],"17":[{"text":"憲法50条は、\n国会議員は、法律の定める場合を除いて、国会の会期中逮捕されない\nと定める。\nこれは、\n議員個人を特別扱いして守る\nことだけが目的ではない。\n重要なのは、\n国会の活動を国家権力によって不当に妨害されないようにすること\nである。\n\n⸻","blanks":["国会の活動","国会の会期","憲法","逮捕"],"options":[["国会の活動","国権の最高機関","代表民主制","法律制定"],["国会の会期","議院内閣制","基本的人権","免責特権"],["憲法","予算","特別会","免責特権"],["逮捕","任期","定足数","予算"]],"mode":"constitution"}],"18":[{"text":"憲法51条は、\n両議院の議員は、議院で行った演説、討論又は表決について、院外で責任を問われない\nと定める。\nつまり、\n国会内で自由に議論できる環境\nを保障している。\n\n⸻","blanks":["国会","憲法"],"options":[["国会","選挙","天皇","裁判所"],["憲法","立法裁量","法律案","予算"]],"mode":"constitution"}],"19":[{"text":"国会議員が、\n政府を批判した\n法律案を批判した\n他の議員を批判した\nというだけで、\n国会外で簡単に責任を追及される\nと、自由な議論ができなくなる。\nそこで、\n国会における議論の自由\nを保障する。\n\n⸻","blanks":["法律案","国会"],"options":[["法律案","国政調査","衆議院","特別会"],["国会","内閣","最高機関","常会"]],"mode":"constitution"}],"20":[{"text":"憲法49条は、\n両議院の議員は、法律の定めるところにより、国庫から相当額の歳費を受ける\nと定める。\n議員が、\n経済的に国家に従属してしま
