る","○年が経過したとき"]],"mode":"civil"},"22":{"text":"民法の問題を見たら、いきなり条文を探すのではなく、まず次の順番で考える。\n① 誰と誰の問題か\nA ↓ B\n⸻\n② 何が起きたのか\n契約？\n損害？\n代理？\n相続？\n所有権？\n⸻\n③ どんな法律関係か\n契約関係なのか。\n不法行為なのか。\n物権関係なのか。\n親族関係なのか。\n⸻\n④ 法律行為に問題はないか\n•\t意思能力\n•\t行為能力\n•\t意思表示\n•\t錯誤\n•\t詐欺\n•\t強迫\n•\t公序良俗\n⸻\n⑤ 代理が関係するか\n本人 ↓ 代理人 ↓ 相手方\n⸻\n⑥ 時間の問題はないか\n期間\n↓\n時効\n⸻","blanks":["意思能力","行為能力","意思表示","錯誤"],"options":[["意思能力","権利能力","買います","法律行為"],["行為能力","権利能力","買います","意思能力"],["意思表示","権利能力","買います","意思能力"],["錯誤","民法","総則","胎児"]],"mode":"civil"},"23":{"text":"POINT 1\n権利能力・意思能力・行為能力は別物。\n⸻\nPOINT 2\n法律行為の中心は意思表示。\n⸻\nPOINT 3\n意思表示には「本人の意思」と「外部への表示」の問題がある。\n⸻\nPOINT 4\n無効と取消しは同じではない。\n⸻\nPOINT 5\n代理では法律効果を本人に帰属させることが核心。\n⸻\nPOINT 6\n無権代理と表見代理を区別する。\n⸻\nPOINT 7\n条件＝不確実、期限＝確実。\n⸻\nPOINT 8\n取得時効と消滅時効を区別する。\n⸻\nPOINT 9\n時効は「期間が経過した＝すべて終了」ではない。\n⸻\nPOINT 10\n民法総則はバラバラの制度ではなく、\n人 → 意思 → 法律行為 → 効果 → 代理 → 無効・取消し → 時間\nという一つの体系として理解する。\n⸻","blanks":["条件","不確実","確実","期限"],"options":[["条件","民法","総則","胎児"],["不確実","取消し","所有権","第三者"],["確実","民法","総則","胎児"],["期限","民法","総則","胎児"]],"mode":"civil"},"24":{"text":"以下を、テキストを見ずに自分の言葉で説明できれば、第1編の基礎がかなり固まっている。\n基礎\n1.\t民法とは何を規律する法律か。\n2.\t私的自治とは何か。\n3.\t契約自由の原則とは何か。\n4.\t権利能力とは何か。\n5.\t意思能力とは何か。\n6.\t行為能力とは何か。\n7.\t未成年者の法律行為はどのように扱われるか。\n法律行為\n8.\t法律行為とは何か。\n9.\t意思表示とは何か。\n10.\t心裡留保とは何か。\n11.\t通謀虚偽表示とは何か。\n12.\t錯誤とは何か。\n13.\t詐欺と強迫の違いは何か。\n14.\t公序良俗とは何か。\n15.\t強行規定と任意規定の違いは何か。\n効力\n16.\t無効と取消しの違いは何か。\n17.\t取消しをすると法律行為はどうなるか。\n代理\n18.\t代理とは何か。\n19.\t代理の法律効果は誰に帰属するか。\n20.\t無権代理とは何か。\n21.\t追認とは何か。\n22.\t表見代理はなぜ必要なのか。\n時間\n23.\t条件と期限の違いは何か。\n24.\t取得時効と消滅時効の違いは何か。\n25.\t時効の援用とは何か。\n26.\t完成猶予と更新の違いは何か。\n⸻\n第1編 最終整理\n民法総則の一本の地図\n民法\n│\n┌──────┴──────┐\n│             │\n総則        その他の分野\n│\n┌────────┼────────┐\n│        │        │\n人      法律行為    時間\n│        │        │\n│    ┌───┼───┐    │\n│    │   │   │    │\n権利能力 意思表示 代理  時効\n意思能力   │      │    │\n行為能力   │   無権代理  │\n│      │   表見代理  │\n│   ┌──┼──┐       │\n│   │  │  │       │\n│ 錯誤 詐欺 強迫    │\n│        │          │\n└───────┼──────────┘\n│\n無効・取消し\n│\n法律関係の確定\n最も重要な考え方\n民法総則は、\n「人が意思に基づいて法律行為を行い、その法律効果が誰にどのように帰属するのか。そして、その法律関係に問題がある場合や時間が経過した場合にどう処理するのか」\nを学ぶ分野である。\nこの一本の流れを理解したうえで、各制度を条文・判例と結びつけていく。\nこれが、次の「物権」「債権総論」「債権各論」を理解するための土台になる。","blanks":["次の「物権","物権","債権総論","債権各論"],"options":[["次の「物権","権利の主体","土地を買う","Aの所有権"],["物権","民法","総則","胎児"],["債権総論","権利能力","買います","意思能力"],["債権各論","権利能力","買います","意思能力"]],"mode":"civil"}},"2":{"1":{"text":"1　物権の意味\n物権とは、簡単にいうと、\n物を直接支配する権利\nである。\n代表的なものが、\n•\t所有権\n•\t占有権\n•\t地上権\n•\t地役権\n•\t抵当権\n•\t質権\n•\t留置権\n•\t先取特権\nなどである。\n⸻\n2　債権との違い\nここは非常に重要。\n物権\n「この物を支配できる」\nという権利。\n債権\n「この人に○○をしてもらえる」\nという権利。\n例えば、\nAが土地を所有している。\n↓\nAの所有権＝物権\n一方、\nAがBに100万円を貸した。\n↓\nAがBに返済を請求する権利\n↓\n貸金返還請求権＝債権\n⸻\n3　物権と債権のイメージ\n物権\n↓\n物を直接支配\n↓\n所有権・抵当権など\n債権\n↓\n特定の人に請求\n↓\n貸金返還請求権・代金請求権など\n⸻","blanks":["物権","債権","Aの所有権","貸金返還請求権"],"options":[["物権","民法","総則","胎児"],["債権","民法","総則","胎児"],["Aの所有権","権利の主体","土地を買う","次の「物権"],["貸金返還請求権","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"2":{"text":"1　物権法定主義\n民法175条。\n原則として、\n法律で定められた種類・内容以外の物権を、当事者が自由に作ることはできない。\nこれを物権法定主義という。\nなぜなら、\n「この物には私だけが使える特殊な権利があります」\nという権利を当事者が自由に大量に作れると、第三者から見て非常に分かりにくくなるからである。\n⸻\n2　物権の公示\n物権は、\n誰がどのような権利を持っているのか\nを第三者から分かるようにする必要がある。\nこれが公示である。\n代表例：\n•\t不動産 → 登記\n•\t動産 → 占有・引渡し\n⸻\n3　物権変動\n例えば、\nAが所有する土地をBに売却した。\n↓\n所有権が\nA → B\nへ移る。\nこれが物権変動。\nここでは、\n「いつ所有権が移るのか」\n「第三者に対しても所有権を主張できるのか」\nという問題が生じる。\n⸻","blanks":["物権法定主義","物権変動","いつ所有権が移るのか"],"options":[["物権法定主義","お金を借りる","従業員を雇う","典型的には、"],["物権変動","権利能力","買います","意思能力"],["いつ所有権が移るのか","この車、1円で売るよ","時効の利益を受けます","その土地がBのものだ"]],"mode":"civil"},"3":{"text":"1　所有権とは\n所有権は、\n法令の制限内において、所有物を自由に使用・収益・処分する権利\nである。\nつまり、\n使用\n自分で使う。\n収益\n他人に貸して賃料を得る。\n処分\n売却する、贈与するなど。\nこの3つが所有権を理解する基本となる。\n⸻\n2　所有権の強さ\n例えばAが自分の車を所有している。\nAは原則として、\n•\t自分で乗る\n•\t他人に貸す\n•\t売る\n•\t譲る\n•\t廃棄する\nなどができる。\nただし、所有権も絶対無制限ではない。\n⸻\n3　所有権の制限\n所有権には、\n•\t法律による制限\n•\t他人の権利による制限\n•\t相隣関係による制限\n•\t公法上の規制\nなどがある。\nしたがって、\n所有権＝何をしてもいい権利\nではない。\n⸻","blanks":["所有権","自分で乗る","他人に貸す","何をしてもいい権利"],"options":[["所有権","取消し","不確実","第三者"],["自分で乗る","権利の主体","土地を買う","次の「物権"],["他人に貸す","権利の主体","土地を買う","次の「物権"],["何をしてもいい権利","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"4":{"text":"1　物とは\n民法上の「物」は、基本的に有体物を指す。\nつまり、\n空間の一部を占め、排他的に支配できるもの\nが基本となる。\n例えば、\n•\t土地\n•\t建物\n•\t車\n•\t時計\n•\t本\nなど。\n⸻\n2　不動産と動産\n民法では物を、\n不動産\nと\n動産\nに分ける。\n不動産\n土地およびその定着物。\n代表：\n•\t土地\n•\t建物\n動産\n不動産以外の物。\n代表：\n•\t車\n•\t家具\n•\t時計\n•\tパソコン\n⸻\n3　なぜ区別するのか\n不動産と動産では、\n物権変動の公示方法\nが異なるからである。\n不動産\n↓\n登記\n動産\n↓\n引渡し\n⸻","blanks":["土地","建物","時計","家具"],"options":[["土地","民法","総則","胎児"],["建物","民法","総則","胎児"],["時計","民法","総則","胎児"],["家具","民法","総則","胎児"]],"mode":"civil"},"5":{"text":"1　意思主義\n日本民法では、当事者間では、原則として\n契約などの意思表示だけで物権が移転する\nという考え方を採用している。\n例えば、\nA「この土地をBに売る」\nB「買います」\n↓\n売買契約\n↓\n原則として所有権がBに移転。\n⸻\n2　しかし第三者との関係では別\nここが非常に重要。\nAとBとの間では所有権が移ったとしても、\n「その土地がBのものだ」\nと第三者に主張できるかは別問題。\n不動産の場合、\n登記\nが重要になる。\n⸻","blanks":["この土地をBに売る","買います","その土地がBのものだ"],"options":[["この土地をBに売る","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["買います","権利能力","意思能力","法律行為"],["その土地がBのものだ","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"6":{"text":"1　対抗要件とは\n対抗要件とは、\nその権利を第三者に対して主張するために必要となる要件\nである。\n不動産物権変動については、原則として、\n登記\nが対抗要件となる。\n⸻\n2　基本構造\nA → B\n土地売買\nAとBの間\n↓\n原則として所有権移転\nしかし\nB → 第三者C\n↓\n「この土地は自分のもの」\n↓\n登記が問題\nつまり、\n「権利が発生すること」と「第三者に主張できること」は区別する。\n⸻","blanks":["対抗要件","この土地は自分のもの","第三者に主張できること"],"options":[["対抗要件","権利能力","買います","意思能力"],["この土地は自分のもの","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["第三者に主張できること","民法に書いてあるルール","取引行為による占有取得","債務を履行することが、"]],"mode":"civil"},"7":{"text":"不動産物権変動では、民法177条の「第三者」が重要になる。\n単純に、\n「契約当事者以外なら全員第三者」\nではない。\n第三者として保護されるためには、基本的に、\n登記の欠缺を主張する正当な利益を有する者\nであることが必要になる。\nしたがって、\n•\t無関係な者\n•\t権利を主張する正当な利益のない者\nまで無条件に177条で保護されるわけではない。\n⸻","blanks":["第三者","契約当事者以外なら全員第三者","無関係な者"],"options":[["第三者","取消し","不確実","所有権"],["契約当事者以外なら全員第三者","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"],["無関係な者","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"8":{"text":"1　動産の公示\n動産の場合は、\n引渡し\nが物権変動の公示方法となる。\n例えば、\nAが自分の時計をBに売った。\n↓\nBに引き渡す。\n↓\nBが所有者であることを外部から判断する一つの基準となる。\n⸻\n2　引渡しの種類\n引渡しには、\n•\t現実の引渡し\n•\t簡易の引渡し\n•\t占有改定\n•\t指図による占有移転\nなどがある。\n基礎段階では、\n「動産は引渡しによって公示する」\nという基本構造をまず理解する。\n⸻","blanks":["現実の引渡し","簡易の引渡し","占有改定","動産は引渡しによって公示する"],"options":[["現実の引渡し","お金を借りる","従業員を雇う","典型的には、"],["簡易の引渡し","お金を借りる","従業員を雇う","典型的には、"],["占有改定","権利能力","買います","意思能力"],["動産は引渡しによって公示する","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"]],"mode":"civil"},"9":{"text":"所有権を取得する方法には、\n•\t売買\n•\t贈与\n•\t相続\n•\t即時取得\n•\t取得時効\n•\t添付\nなどがある。\n⸻","blanks":["売買","贈与","相続","即時取得"],"options":[["売買","民法","総則","胎児"],["贈与","民法","総則","胎児"],["相続","民法","総則","胎児"],["即時取得","権利能力","買います","意思能力"]],"mode":"civil"},"10":{"text":"1　即時取得とは\n動産について、\n取引相手が所有者だと信頼して取引した者を保護する制度\nである。\n典型例：\nAが所有者ではないのに、Bに時計を売った。\nCが、\n「Bが所有者だ」\nと信じてBから時計を買った。\n一定の要件を満たせば、Cが所有権を取得できる場合がある。\n⸻\n2　なぜ必要なのか\n動産について毎回、\n「本当にこの人が所有者なのか」\nを完全に調査しなければ取引できないと、取引の安全が大きく損なわれる。\nそこで、\n外観を信頼して取引した者を一定の場合に保護する。\n⸻\n3　基本要件\n即時取得では、一般に、\n•\t動産であること\n•\t取引行為による占有取得\n•\t平穏・公然\n•\t善意\n•\t無過失\n•\t前主が無権利者であること\nなどが問題となる。\n⸻","blanks":["本当にこの人が所有者なのか","取引行為による占有取得","平穏・公然","善意"],"options":[["本当にこの人が所有者なのか","誰が実際に意思表示をしたか","Aの代理人として契約します","自分の土地の便益のために、"],["取引行為による占有取得","民法に書いてあるルール","第三者に主張できること","債務を履行することが、"],["平穏・公然","権利の主体","土地を買う","次の「物権"],["善意","民法","総則","胎児"]],"mode":"civil"},"11":{"text":"1　共有とは\n一つの物を、\n複数人が共同で所有すること\nである。\n例えば、\nAとBが土地を共同購入した。\n↓\nA・Bが共有者。\n⸻\n2　共有持分\n共有では、\n「所有権を何％持っているか」\nという持分が問題となる。\n例えば、\nA＝2分の1 B＝2分の1\nなら、\nそれぞれ2分の1の持分を持つ。\n⸻\n3　共有物の使用\n共有者は、共有物について一定の範囲で使用・管理・変更などを行う。\nここで重要なのが、\n変更・管理・保存\nの区別。\n⸻\n4　共有物の変更\n共有物そのものを大きく変更する行為。\n原則として、共有者の一定の同意が必要となる。\n⸻\n5　共有物の管理\n変更には至らない通常の管理。\n例えば、\n•\t賃貸\n•\t管理方法の決定\nなど。\n法律上、共有物の管理については持分を基準としたルールが置かれている。\n⸻\n6　保存行為\n共有物の現状を維持する行為。\n保存行為については、各共有者が単独でできる場合がある。\n⸻\n7　共有物の分割\n共有関係は、原則として永続させなければならないものではない。\n共有者は一定の場合、\n共有物の分割を請求できる。\nしたがって、\n共有\n↓\nA・Bが共同所有\n↓\n分割請求\n↓\n共有関係を解消\nという流れがある。\n⸻","blanks":["所有権を何％持っているか","変更・管理・保存","賃貸","管理方法の決定"],"options":[["所有権を何％持っているか","この車を100万円で売る","どのような法律行為をして","他人の土地を利用する権利"],["変更・管理・保存","どのような意思で","保険金が発生した","① 誰が権利者か"],["賃貸","民法","総則","胎児"],["管理方法の決定","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"12":{"text":"1　相隣関係とは\n隣り合う土地の所有者など、\n隣接する不動産所有者同士の法律関係\nである。\n土地は独立していても、実際には隣地と密接に関係する。\nそこで民法は、\n•\t通行\n•\t境界\n•\t水\n•\t根・枝\n•\t越境\n•\t目隠し\nなどについて一定のルールを設けている。\n⸻\n2　重要な考え方\n所有権は強力だが、\n「自分の土地だから何をしてもいい」\nではない。\n隣地所有者との調整が必要になる。\nこれが相隣関係の基本的な発想である。\n⸻","blanks":["通行","境界","根・枝","自分の土地だから何をしてもいい"],"options":[["通行","民法","総則","胎児"],["境界","民法","総則","胎児"],["根・枝","取消し","不確実","所有権"],["自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継","土地を買ったが登記をしていない"]],"mode":"civil"},"13":{"text":"所有権を侵害された場合、所有者は一定の請求をすることができる。\n代表的には、\n返還請求\n「自分の物を返せ」\n妨害排除請求\n「所有権を邪魔している状態をやめろ」\n妨害予防請求\n「これから侵害されるおそれがあるから防げ」\nという考え方がある。\n⸻\n3つの整理\nすでに物を奪われた\n↓\n返還請求\n現在、所有権が妨害されている\n↓\n妨害排除請求\nこれから妨害される危険\n↓\n妨害予防請求\n⸻","blanks":["返還請求","自分の物を返せ","所有権を邪魔している状態をやめろ"],"options":[["返還請求","権利能力","買います","意思能力"],["自分の物を返せ","結婚・離婚する","必ず絶対に従う","というケース。"],["所有権を邪魔している状態をやめろ","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"]],"mode":"civil"},"14":{"text":"所有権とは別に、\n他人の土地などを一定の目的のために使用・収益する物権\nがある。\nこれを用益物権という。\n代表的なのが、\n•\t地上権\n•\t永小作権\n•\t地役権\n•\t入会権\nである。\n⸻","blanks":["用益物権","地上権","永小作権","地役権"],"options":[["用益物権","権利能力","買います","意思能力"],["地上権","取消し","不確実","所有権"],["永小作権","権利能力","買います","意思能力"],["地役権","取消し","不確実","所有権"]],"mode":"civil"},"15":{"text":"1　地上権とは\n他人の土地において、\n工作物または竹木を所有するために、その土地を使用する権利\nである。\n例えば、\nAが土地を所有。\nBがその土地に建物を所有する。\n↓\nBが地上権を持つことができる。\n⸻\n2　地上権のポイント\n地上権は物権なので、\n土地所有者に対する単なる契約上の権利ではない。\nここが賃借権などの債権との重要な違い。\n⸻","blanks":["他人の土地において、","地上権は物権なので、"],"options":[["他人の土地において、","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["地上権は物権なので、","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"16":{"text":"1　永小作権とは\n小作料を支払って、\n他人の土地で耕作または牧畜をする権利\nである。\n現代では実務上の重要性は相対的に低いが、物権の種類として理解しておく。\n⸻","blanks":["小作料を支払って、"],"options":[["小作料を支払って、","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"17":{"text":"1　地役権とは\n自分の土地の便益のために、\n他人の土地を利用する権利\nである。\n例えば、\nAの土地が道路に直接接していない。\nBの土地を通らなければ道路に出られない。\n↓\nAの土地を要役地\nBの土地を承役地\nとして、通行のための地役権を設定することがある。\n⸻\n2　地役権の構造\nA土地\n要役地\n↓\n便益を受ける\nB土地\n承役地\n↓\n利用される\n⸻","blanks":["自分の土地の便益のために、","他人の土地を利用する権利"],"options":[["自分の土地の便益のために、","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["他人の土地を利用する権利","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"]],"mode":"civil"},"18":{"text":"ここから物権の重要分野である担保物権に入る。\n1　担保とは\n例えばAがBから1,000万円を借りた。\nBとしては、\n「本当に返してもらえるのか？」\nという不安がある。\nそこで、\n「返済されなかった場合には、この財産から優先的に回収できる」\nという仕組みを作る。\nこれが担保である。\n⸻\n2　担保物権\n代表的な担保物権は、\n•\t留置権\n•\t先取特権\n•\t質権\n•\t抵当権\nである。\n⸻","blanks":["本当に返してもらえるのか？","留置権","先取特権","質権"],"options":[["本当に返してもらえるのか？","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["留置権","取消し","不確実","所有権"],["先取特権","権利能力","買います","意思能力"],["質権","民法","総則","胎児"]],"mode":"civil"},"19":{"text":"担保物権を理解するときは、\n① 優先弁済\n他の債権者より優先して弁済を受ける。\n② 目的物との結びつき\n担保の目的となる物を中心に権利が構成される。\n③ 被担保債権との関係\n担保物権は通常、\n「何の債権を担保しているのか」\nという債権と結びついている。\nこの債権を被担保債権という。\n⸻","blanks":["何の債権を担保しているのか","担保物権を理解するときは、"],"options":[["何の債権を担保しているのか","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["担保物権を理解するときは、","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"]],"mode":"civil"},"20":{"text":"1　留置権とは\n他人の物を適法に占有している者が、その物に関して生じた債権について弁済を受けるまで、\nその物を留置することができる権利\nである。\n⸻\n2　例\nAがBの車を修理した。\nBが修理代を払わない。\n↓\nAは一定の要件の下で、\n「修理代を払うまで車を返さない」\nとすることができる。\nこれが留置権。\n⸻\n3　ポイント\n留置権は、\n占有していること\nが重要。\n⸻","blanks":["留置権","修理代を払うまで車を返さない"],"options":[["留置権","取消し","不確実","所有権"],["修理代を払うまで車を返さない","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"]],"mode":"civil"},"21":{"text":"1　先取特権とは\n法律が、\n特定の債権について、他の債権者に優先して弁済を受けることができる\nと認めた担保物権。\n例えば、一定の賃金債権などについて、法律が特別な優先権を認める。\n⸻\n2　先取特権の特徴\n留置権や質権などと異なり、\n法律が一定の債権について直接優先権を認める\nという点が重要。\n⸻","blanks":["法律が、","と認めた担保物権。"],"options":[["法律が、","権利能力","買います","意思能力"],["と認めた担保物権。","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"22":{"text":"1　質権とは\n債権者が目的物を占有し、\n債務の弁済を受けるまでその物を留置し、一定の場合に優先弁済を受ける権利\nである。\n⸻\n2　留置権との違い\n留置権\n→ 法律の要件を満たせば成立する法定担保物権。\n質権\n→ 当事者の設定によって成立する約定担保物権。\n⸻","blanks":["債権者が目的物を占有し、"],"options":[["債権者が目的物を占有し、","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"]],"mode":"civil"},"23":{"text":"1　抵当権とは\n民法上、最も重要な担保物権の一つ。\n抵当権とは、\n債務者または第三者が占有を移さずに提供した不動産について、債権者が他の債権者に優先して弁済を受けることができる権利\nである。\n⸻\n2　典型例\nAが銀行から3,000万円を借りる。\n↓\nAの土地・建物に銀行が抵当権を設定。\n↓\nAが返済できない。\n↓\n銀行が抵当権を実行。\n↓\n不動産を競売。\n↓\nその代金から優先的に弁済を受ける。\n⸻\n3　抵当権の最大の特徴\n目的物を債権者に引き渡さなくていい。\nつまり、\nA\n↓\n土地・建物を使用し続ける\n銀行\n↓\n抵当権を持つ\nという状態が可能。\nこれが質権との大きな違い。\n⸻","blanks":["抵当権","質権との大きな違い"],"options":[["抵当権","取消し","不確実","所有権"],["質権との大きな違い","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"24":{"text":"一つの不動産に複数の抵当権を設定することができる。\n例えば、\n第1順位抵当権 ↓ 銀行A\n第2順位抵当権 ↓ 銀行B\nという状態。\n競売代金からは、原則として順位に従って弁済される。\n⸻","blanks":["第1順位抵当権","第2順位抵当権"],"options":[["第1順位抵当権","結婚・離婚する","必ず絶対に従う","というケース。"],["第2順位抵当権","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"25":{"text":"抵当権の目的物が、\n•\t売却された\n•\t滅失した\n•\t保険金が発生した\nなどの場合に、\nその目的物の代わりとなる金銭等に抵当権の効力を及ぼす\nという制度が問題となる。\nこれが物上代位。\n担保物権の重要な特徴である。\n⸻","blanks":["売却された","滅失した","保険金が発生した","物上代位"],"options":[["売却された","権利の主体","土地を買う","次の「物権"],["滅失した","権利能力","買います","意思能力"],["保険金が発生した","どのような意思で","変更・管理・保存","① 誰が権利者か"],["物上代位","権利能力","買います","意思能力"]],"mode":"civil"},"26":{"text":"1　物上保証人\nAがBから借金する。\nCが、\n「Aの借金の担保として、私の土地に抵当権を設定していい」\nとする。\nこのCを物上保証人という。\n⸻\n2　重要な違い\nCは、\nAの借金そのものを負担する債務者\nではない。\nしかし、\nCの土地が担保として提供されている。\nしたがって、\nA\n↓\n借金を負う\nC\n↓\n土地を担保提供\nB\n↓\n抵当権者\nという関係になる。\n⸻","blanks":["とする。","このCを物上保証人という。"],"options":[["とする。","権利能力","買います","意思能力"],["このCを物上保証人という。","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"]],"mode":"civil"},"27":{"text":"債務者が返済しない。\n↓\n担保権者が担保権を実行。\n↓\n目的物を換価する。\n↓\nその代金から弁済を受ける。\n基本的にはこの流れである。\n⸻","blanks":["債務者が返済しない。","担保権者が担保権を実行。"],"options":[["債務者が返済しない。","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["担保権者が担保権を実行。","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"]],"mode":"civil"},"28":{"text":"ここまでをまとめる。\n物権\n① 本権的な物権\n所有権\n↓\n物を全面的に支配する基本的な物権。\n⸻\n② 占有に関する権利\n占有権\n↓\n物を事実上支配している状態を法律上保護。\n⸻\n③ 用益物権\n•\t地上権\n•\t永小作権\n•\t地役権\n•\t入会権\n↓\n他人の物を一定の目的で利用。\n⸻\n④ 担保物権\n•\t留置権\n•\t先取特権\n•\t質権\n•\t抵当権\n↓\n債権を担保。\n⸻","blanks":["地上権","永小作権","地役権","入会権"],"options":[["地上権","取消し","不確実","所有権"],["永小作権","権利能力","買います","意思能力"],["地役権","取消し","不確実","所有権"],["入会権","取消し","不確実","所有権"]],"mode":"civil"},"29":{"text":"1　占有とは\n占有とは、\n物を事実上支配している状態\nである。\n例えば、\nAが自分のスマートフォンを持っている。\n↓\nAがそのスマートフォンを占有している。\n⸻\n2　所有と占有は違う\nここは非常に重要。\n所有\n＝法律上の権利\n占有\n＝事実上の支配\n例えば、\nAの時計をBが盗んだ。\n↓\n所有者＝A\n占有者＝B\nとなる。\nつまり、\n所有者と占有者は一致するとは限らない。\n⸻","blanks":["占有","物を事実上支配している状態"],"options":[["占有","民法","総則","胎児"],["物を事実上支配している状態","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"]],"mode":"civil"},"30":{"text":"占有には、\n「事実上支配している状態そのもの」\nを保護する意味がある。\n例えば、\nAが土地を平穏に占有している。\nBが突然実力でAを追い出した。\n↓\n所有権の問題とは別に、\n占有を侵害されたこと自体\nが問題となる。\nそこで占有訴権などの制度が設けられている。\n⸻","blanks":["事実上支配している状態そのもの","占有には、"],"options":[["事実上支配している状態そのもの","自分の土地だから何をしてもいい","前の占有者から次の占有者へ承継","土地を買ったが登記をしていない"],["占有には、","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"31":{"text":"占有は一定の場合に、\n前の占有者から次の占有者へ承継\nされる。\n例えば、\nAが土地を占有。\n↓\nAからBへ土地を譲渡。\n↓\nBが占有を取得。\nこのように占有にも法律上の承継が問題となる。\n⸻","blanks":["前の占有者から次の占有者へ承継","される。"],"options":[["前の占有者から次の占有者へ承継","自分の土地だから何をしてもいい","事実上支配している状態そのもの","土地を買ったが登記をしていない"],["される。","権利能力","買います","意思能力"]],"mode":"civil"},"32":{"text":"この2つは区別する。\n物権的請求権\n所有権などの物権そのものを根拠とする。\n例：\n「自分の土地だから返してくれ」\n占有訴権\n占有という事実状態を保護する。\n例：\n「平穏に占有していたのに、実力で奪われた」\n⸻","blanks":["自分の土地だから返してくれ","この2つは区別する。"],"options":[["自分の土地だから返してくれ","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["この2つは区別する。","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"33":{"text":"物権には、\n排他的支配\nという性質がある。\n例えば土地の所有者がAなら、\n同じ土地についてAとまったく同じ内容の所有権をBが持つことはできない。\nだからこそ、\n誰が物権を持っているのかを外部から分かるようにすること\nが重要になる。\nこれが公示制度につながる。\n⸻","blanks":["公示制度につながる","物権には、"],"options":[["公示制度につながる","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["物権には、","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"34":{"text":"物権変動を一本につなげる。\n売買契約\n↓\n物権変動\n↓\n所有権移転\n↓\n第三者に主張できるか？\n↓\n公示\n├── 不動産 → 登記\n└── 動産 → 引渡し\nこの流れは物権法の中心となる。\n⸻","blanks":["物権変動を一本につなげる。","売買契約"],"options":[["物権変動を一本につなげる。","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["売買契約","権利能力","買います","意思能力"]],"mode":"civil"},"35":{"text":"実際の法律関係では、\n物権だけ\n債権だけ\nと分けて考えるのではなく、両者が連動する。\n例えば土地売買。\n売買契約\n↓\n債権関係\n「土地を引き渡せ」\n「代金を払え」\n↓\n物権関係\n「所有権が移転」\n↓\n登記\n↓\n第三者への対抗\nつまり、\n債権法と物権法は別々の世界ではない。\n⸻","blanks":["土地を引き渡せ","代金を払え","所有権が移転"],"options":[["土地を引き渡せ","結婚・離婚する","必ず絶対に従う","というケース。"],["代金を払え","権利の主体","土地を買う","次の「物権"],["所有権が移転","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"36":{"text":"物権法では、次の5つを意識する。\n① 誰が権利者か\nA？\nB？\nC？\n⸻\n② 何の物についての権利か\n土地？\n建物？\n車？\n⸻\n③ どんな物権か\n所有権？\n地上権？\n抵当権？\n⸻\n④ 第三者に主張できるか\n不動産なら登記。\n動産なら引渡し。\n⸻\n⑤ その権利をどう実現するか\n所有権侵害？\n占有侵害？\n担保権実行？\n⸻","blanks":["物権法では、次の5つを意識する。","① 誰が権利者か"],"options":[["物権法では、次の5つを意識する。","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"],["① 誰が権利者か","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"37":{"text":"種類\t内容\t典型例\n所有権\t物を全面的に支配\t土地所有\n占有権\t事実上の支配を保護\t時計を所持\n地上権\t他人の土地を利用\t建物所有\n永小作権\t他人の土地で耕作等\t小作\n地役権\t他人の土地を自己の土地の便益に利用\t通行\n留置権\t弁済まで物を留置\t修理代未払い\n先取特権\t法律上の優先弁済\t特定債権\n質権\t目的物を占有して担保\t動産担保\n抵当権\t目的物を占有せず担保\t住宅ローン\n⸻","blanks":["種類\t内容\t典型例"],"options":[["種類\t内容\t典型例","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"38":{"text":"物権\n│\n┌───────────────┼───────────────┐\n│               │               │\n所有権           占有権           他物権\n│                               │\n│                     ┌─────────┴─────────┐\n│                     │                   │\n物権変動              用益物権             担保物権\n│                     │                   │\n┌───┴───┐          ┌──────┼──────┐      ┌────┼────┐\n│       │          │      │      │      │    │    │\n不動産   動産       地上権  地役権  等    留置  質  抵当\n│       │\n登記     引渡し\n│       │\n第三者への対抗\n⸻","blanks":["登記     引渡し","第三者への対抗"],"options":[["登記     引渡し","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["第三者への対抗","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"39":{"text":"以下を、自分の言葉で説明できるようにする。\n基礎\n1.\t物権とは何か。\n2.\t物権と債権の違いは何か。\n3.\t物権法定主義とは何か。\n4.\t公示とは何か。\n5.\t不動産と動産の違いは何か。\n所有権\n6.\t所有権とは何か。\n7.\t使用・収益・処分とは何か。\n8.\t所有権はなぜ無制限ではないのか。\n9.\t所有権に基づく返還請求・妨害排除・妨害予防とは何か。\n物権変動\n10.\t物権変動とは何か。\n11.\t当事者間の所有権移転と第三者への対抗の違いは何か。\n12.\t不動産物権変動の対抗要件は何か。\n13.\t動産物権変動の公示方法は何か。\n14.\t即時取得とは何か。\n共有・用益\n15.\t共有とは何か。\n16.\t共有持分とは何か。\n17.\t共有物の変更・管理・保存をどう区別するか。\n18.\t地上権とは何か。\n19.\t地役権とは何か。\n20.\t要役地と承役地とは何か。\n担保\n21.\t担保とは何か。\n22.\t担保物権には何があるか。\n23.\t留置権とは何か。\n24.\t先取特権とは何か。\n25.\t質権とは何か。\n26.\t抵当権とは何か。\n27.\t抵当権はなぜ目的物を引き渡さなくてもいいのか。\n28.\t物上保証人とは何か。\n29.\t物上代位とは何か。\n占有\n30.\t所有と占有の違いは何か。\n31.\t所有者と占有者が一致しない例を挙げられるか。\n32.\t占有がなぜ法律上保護されるのか。\n33.\t物権的請求権と占有訴権の違いは何か。\n⸻","blanks":["物権変動","共有・用益"],"options":[["物権変動","権利能力","買います","意思能力"],["共有・用益","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"40":{"text":"物権法の核心\n物権法は、\n「物を誰が支配しているのか」\nを中心に考える。\nそこから、\n物\n↓\n誰が支配している？\n↓\nどんな権利？\n↓\n所有権？\n占有？\n利用権？\n担保？\n↓\nその権利を第三者に主張できる？\n↓\n公示されている？\n↓\n侵害された場合どうする？\nという思考につながる。\nそして、物権法全体をさらに大きく見ると、\n所有権\n↓\n物権変動\n↓\n第三者との関係\n↓\n占有\n↓\n他人の物の利用\n↓\n担保\nという構造になる。\n⸻\n第2編終了時点での到達目標\nこの段階では、細かい判例や学説をすべて暗記する必要はない。\nまず、\n「この問題は物権のどの部分の問題なのか」\nを判断できることが重要である。\n例えば、\n「土地を買ったが登記をしていない」\n↓\n物権変動・対抗要件\n「他人の時計を自分のものだと思って買った」\n↓\n即時取得\n「隣の土地に勝手に通路を作りたい」\n↓\n相隣関係・地役権等\n「住宅ローンを返済できない」\n↓\n抵当権\n「修理代を払ってもらえないので車を返したくない」\n↓\n留置権\nというように、\n事実 → 法律関係 → 物権制度\nへ結びつけられるようになることが、第2編の大きな目標である。","blanks":["物を誰が支配しているのか","この問題は物権のどの部分の問題なのか","土地を買ったが登記をしていない","隣の土地に勝手に通路を作りたい"],"options":[["物を誰が支配しているのか","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["この問題は物権のどの部分の問題なのか","私の代理人としてCから車を買ってきて","売買で債務不履行が起きたらどうなる？","請負で完成した仕事に問題があったら？"],["土地を買ったが登記をしていない","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"],["隣の土地に勝手に通路を作りたい","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"]],"mode":"civil"}},"3":{"1":{"text":"1　債権の意味\n債権とは、\n特定の人に対して、一定の行為をするよう請求できる権利\nである。\n例えば、\nAがBに100万円を貸した。\n↓\nAはBに、\n「100万円を返してください」\nと請求できる。\nこのAの権利が債権。\n一方、Bは、\n「100万円を返す義務」\nを負う。\nこの義務を債務という。\n⸻\n2　債権者と債務者\n債権関係には基本的に、\n•\t債権者\n•\t債務者\nがいる。\n債権者\n請求する側。\n債務者\n請求される側。\n債権者\n↓ 請求\n債務者\n↓ 履行\n債権者\n⸻","blanks":["債権","100万円を返してください","100万円を返す義務","債権者"],"options":[["債権","民法","総則","胎児"],["100万円を返してください","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["100万円を返す義務","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["債権者","取消し","不確実","所有権"]],"mode":"civil"},"2":{"text":"債権は様々な原因によって発生する。\n代表的には、\n1.\t契約\n2.\t事務管理\n3.\t不当利得\n4.\t不法行為\nである。\n例\n契約\n→ 売買代金請求権\n不法行為\n→ 損害賠償請求権\n不当利得\n→ 不当利得返還請求権\n⸻\n債権法の全体像\n債権\n│\n├─ 発生\n│    ├ 契約\n│    ├ 事務管理\n│    ├ 不当利得\n│    └ 不法行為\n│\n├─ 内容\n│    └ 何を請求できる？\n│\n├─ 履行\n│    └ きちんと実行された？\n│\n├─ 不履行\n│    ├ 履行遅滞\n│    ├ 履行不能\n│    └ 不完全履行\n│\n├─ 保全\n│    ├ 債権者代位権\n│    └ 詐害行為取消権\n│\n├─ 移転\n│    ├ 債権譲渡\n│    └ 債務引受\n│\n└─ 消滅\n├ 弁済\n├ 相殺\n├ 更改\n├ 免除\n└ 混同\nこの流れを最初に理解する。\n⸻","blanks":["代表的には、","不法行為"],"options":[["代表的には、","お金を借りる","従業員を雇う","典型的には、"],["不法行為","権利能力","買います","意思能力"]],"mode":"civil"},"3":{"text":"1　債権者は何を請求するのか\n債権の目的は、債務者の一定の行為である。\n例えば、\n「100万円を支払え」\n→ 金銭給付\n「車を引き渡せ」\n→ 物の引渡し\n「建物を修理しろ」\n→ 行為\nなど。\n⸻\n2　給付\n債務者が債権者に対して行う行為を、一般に給付という。\n例えば、\n•\t金銭を支払う\n•\t物を引き渡す\n•\t仕事をする\n•\t一定の行為をしない\nなど。\n⸻","blanks":["100万円を支払え","車を引き渡せ","建物を修理しろ","金銭を支払う"],"options":[["100万円を支払え","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["車を引き渡せ","お金を借りる","従業員を雇う","典型的には、"],["建物を修理しろ","結婚・離婚する","必ず絶対に従う","というケース。"],["金銭を支払う","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"4":{"text":"1　特定物\n特定された一個の物。\n例えば、\n「この車を引き渡す」\n車が特定されている。\n⸻\n2　種類物\n種類・数量によって指定された物。\n例えば、\n「米10kgを引き渡す」\nという場合。\nどの米袋かは最初には特定されていない。\n⸻\n3　違い\n特定物\n↓\n「この物」\n種類物\n↓\n「この種類の中から○個」\nこの区別は、後の履行不能や危険負担などを理解するうえで重要。\n⸻","blanks":["この車を引き渡す","米10kgを引き渡す","この物","この種類の中から○個"],"options":[["この車を引き渡す","どのような意思で","変更・管理・保存","保険金が発生した"],["米10kgを引き渡す","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["この物","取消し","不確実","所有権"],["この種類の中から○個","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"5":{"text":"1　金銭債権とは\n一定額の金銭を支払うことを目的とする債権。\n代表例：\n•\t貸金返還請求権\n•\t売買代金請求権\n•\t賃料請求権\n•\t損害賠償請求権\n⸻\n2　金銭債務の特徴\n金銭は、\n「そのお札そのもの」\nを返す必要があるとは限らない。\n原則として、\n同額の金銭を支払えばよい\nという性質を持つ。\n⸻","blanks":["貸金返還請求権","売買代金請求権","賃料請求権","そのお札そのもの"],"options":[["貸金返還請求権","結婚・離婚する","必ず絶対に従う","というケース。"],["売買代金請求権","結婚・離婚する","必ず絶対に従う","というケース。"],["賃料請求権","権利の主体","土地を買う","次の「物権"],["そのお札そのもの","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"6":{"text":"1　履行とは\n債務者が債務の内容を実現すること。\n例えば、\nAがBから100万円借りた。\n↓\n返済する。\n↓\n債務の履行。\n⸻\n2　履行の基本\n債務者は、\n債務の本旨に従って履行する\n必要がある。\nつまり、\n「一応何かした」\nでは足りない。\n契約・法律関係に応じて、\n本来要求される内容\nを実現する必要がある。\n⸻","blanks":["一応何かした","返済する。"],"options":[["一応何かした","お金を借りる","従業員を雇う","典型的には、"],["返済する。","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"7":{"text":"1　履行提供\n債務者が、\n債務を履行するために必要な行為をして、債権者が受け取れる状態にすること\nをいう。\n例えば、\nAがBに100万円を返す。\nBが受け取ろうとしない。\nAが支払いの準備をして、\n「いつでも受け取れます」\nという状態にする。\n↓\n履行提供が問題となる。\n⸻","blanks":["いつでも受け取れます","債務者が、"],"options":[["いつでも受け取れます","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["債務者が、","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"8":{"text":"1　債務不履行とは\n債務者が、\n債務をきちんと履行しないこと\nである。\n大きく、\n•\t履行遅滞\n•\t履行不能\n•\t不完全履行\nという形で考える。\n⸻","blanks":["履行遅滞","履行不能","不完全履行"],"options":[["履行遅滞","権利能力","買います","意思能力"],["履行不能","権利能力","買います","意思能力"],["不完全履行","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"9":{"text":"1　意味\n履行が可能なのに、\n履行すべき時期に履行しない\nこと。\n例えば、\n「4月1日に100万円を支払う」\nという約束なのに、\n4月1日を過ぎても払わない。\n↓\n履行遅滞。\n⸻\n2　イメージ\n履行できる\n↓\n履行期限が来る\n↓\n履行しない\n↓\n履行遅滞\n⸻","blanks":["4月1日に100万円を支払う","履行が可能なのに、"],"options":[["4月1日に100万円を支払う","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"],["履行が可能なのに、","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"10":{"text":"1　意味\n債務を履行することが、\nできなくなった\n場合。\n例えば、\nAがBに、\n「この特定の絵を売る」\nと約束した。\nところが、その絵が火災で完全に焼失。\n↓\nその絵を引き渡すことはできない。\n↓\n履行不能。\n⸻\n2　履行遅滞との違い\n履行遅滞\t履行不能\n履行\t可能\t不可能\n問題\t遅れている\tできなくなった\n例\t期限後も未払い\t目的物が消滅\n⸻","blanks":["この特定の絵を売る","債務を履行することが、"],"options":[["この特定の絵を売る","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["債務を履行することが、","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"11":{"text":"1　意味\n履行自体はされたが、\n内容が完全ではない\n場合。\n例えば、\nAがBに新品のパソコンを売った。\n↓\n届いたパソコンが壊れている。\n↓\n引渡し自体はされた。\nしかし、\n契約内容に適合していない。\n↓\n契約不適合などの問題につながる。\n⸻","blanks":["履行自体はされたが、","内容が完全ではない"],"options":[["履行自体はされたが、","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["内容が完全ではない","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"12":{"text":"1　基本\n債務不履行によって債権者に損害が発生した場合、一定の要件の下で債務者に損害賠償責任が生じる。\n基本構造は、\n債務\n↓\n不履行\n↓\n損害\n↓\n因果関係\n↓\n損害賠償\n⸻\n2　損害\n損害には、\n•\t積極的損害\n•\t消極的損害\nなどがある。\n例えば、\n商品が届かなかったため追加費用が発生した。\n↓\n積極的損害。\n本来得られるはずだった利益を失った。\n↓\n消極的損害。\n⸻","blanks":["積極的損害","消極的損害"],"options":[["積極的損害","権利の主体","土地を買う","次の「物権"],["消極的損害","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"13":{"text":"1　通常損害\nその債務不履行から通常発生すると考えられる損害。\n⸻\n2　特別損害\n特殊な事情によって発生した損害。\n特別損害については、\nその特殊事情を債務者が予見すべきであったか\nなどが問題となる。\n⸻","blanks":["特殊な事情によって発生した損害。","特別損害については、"],"options":[["特殊な事情によって発生した損害。","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"],["特別損害については、","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"14":{"text":"債務不履行があれば、\n「発生した損害は全部請求できる」\nというわけではない。\n法律上、\nどこまでの損害を賠償させるべきか\nという問題がある。\nここでは、\n•\t相当因果関係\n•\t予見可能性\n•\t損益相殺\n•\t過失相殺\nなどが関係する。\n⸻","blanks":["発生した損害は全部請求できる","相当因果関係","予見可能性","損益相殺"],"options":[["発生した損害は全部請求できる","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"],["相当因果関係","お金を借りる","従業員を雇う","典型的には、"],["予見可能性","権利の主体","土地を買う","次の「物権"],["損益相殺","権利能力","買います","意思能力"]],"mode":"civil"},"15":{"text":"1　意味\n債権者側にも損害の発生・拡大について落ち度がある場合、\n損害賠償額を減額する\nことがある。\n例えば、\nAの不履行によって損害が発生した。\nしかしBも適切な対応をしなかったため損害が大きくなった。\n↓\nB側の事情も考慮して賠償額を調整する。\n⸻","blanks":["損害賠償額を減額する","ことがある。"],"options":[["損害賠償額を減額する","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["ことがある。","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"16":{"text":"債務者が履行しない場合、債権者には複数の手段がある。\n① 履行請求\n「約束どおり履行してください」\n② 損害賠償請求\n「履行しなかったことで生じた損害を賠償してください」\n③ 契約解除\n一定の要件の下で、\n「契約を解消します」\nということができる。\n⸻","blanks":["約束どおり履行してください","契約を解消します"],"options":[["約束どおり履行してください","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["契約を解消します","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"17":{"text":"1　意味\n債務者が自発的に履行しない場合に、\n国家の強制力によって債権の実現を図る\n制度。\n⸻\n2　基本的な種類\n•\t直接強制\n•\t代替執行\n•\t間接強制\nなどがある。\n行政法の「行政上の強制執行」と似た言葉が出てくるが、こちらは私人間の債権の実現が中心。\n⸻","blanks":["直接強制","代替執行","間接強制","行政上の強制執行"],"options":[["直接強制","権利能力","買います","意思能力"],["代替執行","権利能力","買います","意思能力"],["間接強制","権利能力","買います","意思能力"],["行政上の強制執行","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"18":{"text":"1　解除とは\n契約を解除することで、\n契約関係を解消し、原状回復などを問題とする制度\nである。\n債務不履行があった場合に、一定の要件を満たせば解除できる。\n⸻\n2　解除と損害賠償\n解除したら損害賠償できなくなるわけではない。\n一定の場合、\n解除\n＋\n損害賠償\nが問題となる。\n⸻","blanks":["契約を解除することで、","損害賠償"],"options":[["契約を解除することで、","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"],["損害賠償","権利能力","買います","意思能力"]],"mode":"civil"},"19":{"text":"1　なぜ必要なのか\nAがBに100万円を貸している。\nしかしBは、\nCに対して持っている100万円の請求権\nを行使しない。\nBに財産がない。\n↓\nこのままだとAが回収できない。\nそこで、一定の要件の下で、\nAがBに代わってBの権利を行使する\n制度がある。\nこれが債権者代位権。\n⸻\n2　基本構造\nA（債権者）\n↓\nB（債務者）\n↓\nC（第三債務者）\nBがCに対する権利を行使しない。\n↓\n一定の場合\nAがBの権利を代位行使。\n⸻","blanks":["債権者代位権","しかしBは、"],"options":[["債権者代位権","お金を借りる","従業員を雇う","典型的には、"],["しかしBは、","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"20":{"text":"1　意味\nBがAに借金をしている。\nところがBが、\n「財産を全部Cに贈与してしまおう」\nとする。\n↓\nBの財産が減る。\n↓\nAが回収できなくなる。\nこのように債権者を害する行為をした場合に、\n一定の要件の下で、その行為を取り消して責任財産を回復させる\n制度が詐害行為取消権。\n⸻\n2　代位権との違い\n債権者代位権\n債務者が、\n権利を行使しない\n場合。\n詐害行為取消権\n債務者が、\n財産を減らす行為をする\n場合。\n⸻","blanks":["財産を全部Cに贈与してしまおう","ところがBが、"],"options":[["財産を全部Cに贈与してしまおう","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"],["ところがBが、","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"21":{"text":"1　債権譲渡とは\nAがBに対して持っている債権を、\nCに譲渡する\nこと。\n例えば、\nAがBに100万円を貸している。\nAがその貸金債権をCに譲渡。\n↓\nCがBに返済を請求する。\n⸻\n2　基本構造\n譲渡前\nA → B\n債権\n譲渡後\nC → B\n債権\nAからCへ債権者が変わる。\n⸻","blanks":["Cに譲渡する","AからCへ債権者が変わる。"],"options":[["Cに譲渡する","お金を借りる","従業員を雇う","典型的には、"],["AからCへ債権者が変わる。","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"]],"mode":"civil"},"22":{"text":"債権譲渡があったことを、\n債務者や第三者に主張するための要件\nが問題となる。\n基本的には、\n譲渡人から債務者への通知\nまたは\n債務者の承諾\nなどが重要になる。\n第三者との関係では、さらに確定日付のある証書による通知・承諾が問題となる。\n⸻","blanks":["譲渡人から債務者への通知","債権譲渡があったことを、"],"options":[["譲渡人から債務者への通知","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["債権譲渡があったことを、","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"]],"mode":"civil"},"23":{"text":"債権が移るのではなく、\n債務者が変わる\n場合がある。\nこれが債務引受。\n例えば、\nAがBに100万円を借りている。\nCが、\n「Aに代わって私がBに100万円を返します」\nという形。\n債務引受には、\n•\t免責的債務引受\n•\t併存的債務引受\nなどがある。\n⸻","blanks":["債務引受","免責的債務引受","併存的債務引受"],"options":[["債務引受","権利能力","買います","意思能力"],["免責的債務引受","結婚・離婚する","必ず絶対に従う","というケース。"],["併存的債務引受","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"24":{"text":"債権は永久に存在するわけではない。\n代表的な消滅原因は、\n•\t弁済\n•\t相殺\n•\t更改\n•\t免除\n•\t混同\nである。\n⸻","blanks":["弁済","相殺","更改","免除"],"options":[["弁済","民法","総則","胎児"],["相殺","民法","総則","胎児"],["更改","民法","総則","胎児"],["免除","民法","総則","胎児"]],"mode":"civil"},"25":{"text":"1　弁済とは\n債務の内容を実現すること。\n例えば、\nAがBに100万円を返す。\n↓\n弁済。\n通常、弁済によって債権は消滅する。\n⸻\n2　第三者による弁済\n一定の場合、\n債務者本人ではない第三者\nが弁済することもできる。\nただし、債務の性質や当事者の意思などによって制限される場合がある。\n⸻","blanks":["債務の内容を実現すること。","債務者本人ではない第三者"],"options":[["債務の内容を実現すること。","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["債務者本人ではない第三者","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"]],"mode":"civil"},"26":{"text":"1　相殺とは\nAがBに100万円を貸している。\n一方、\nBもAに60万円を貸している。\n↓\nお互いに債権を持っている。\nそこで、\n100万円 − 60万円\nとして、\nAの残りの債権を40万円とする。\nこれが相殺。\n⸻\n2　相殺の基本構造\nA → B\n100万円\nB → A\n60万円\n↓ 相殺\nA → B\n40万円\n⸻","blanks":["相殺","BもAに60万円を貸している。"],"options":[["相殺","民法","総則","胎児"],["BもAに60万円を貸している。","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"]],"mode":"civil"},"27":{"text":"相殺には一定の要件がある。\n代表的には、\n•\t対立する債権がある\n•\t同種の目的を持つ\n•\t弁済期にあること\n•\t相殺禁止に該当しない\nなど。\n⸻","blanks":["対立する債権がある","同種の目的を持つ","弁済期にあること","相殺禁止に該当しない"],"options":[["対立する債権がある","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["同種の目的を持つ","どのような意思で","変更・管理・保存","保険金が発生した"],["弁済期にあること","どのような意思で","変更・管理・保存","保険金が発生した"],["相殺禁止に該当しない","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"28":{"text":"相殺は単なる計算上の処理ではない。\n例えば、\nAがBに100万円貸している。\nBが倒産しそう。\nしかしAもBに対して別の債務を負っている。\n↓\n相殺することによって、\n実質的に優先して回収するような効果\nが生じる。\nそのため相殺には、\n担保的機能\nがあると理解される。\n⸻","blanks":["相殺することによって、","が生じる。"],"options":[["相殺することによって、","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"],["が生じる。","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"29":{"text":"債権者が、\n「もう返さなくていい」\nと債務を免除する。\n↓\n債権が消滅する。\n例えば、\nAがBに100万円を貸している。\nAが、\n「100万円はもう返さなくていい」\nとする。\n↓\n免除。\n⸻","blanks":["もう返さなくていい","100万円はもう返さなくていい"],"options":[["もう返さなくていい","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["100万円はもう返さなくていい","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"]],"mode":"civil"},"30":{"text":"債権者と債務者が、\n同一人になる\nことによって、債権が消滅する場合がある。\n例えば、\nAがBに対する債権を持っている。\nその後、一定の事情によって、\n債権者A＝債務者A\nという状態になる。\n↓\n混同。\n⸻","blanks":["債権者A","債務者A"],"options":[["債権者A","権利能力","買います","意思能力"],["債務者A","権利能力","買います","意思能力"]],"mode":"civil"},"31":{"text":"債権者・債務者が1人ずつとは限らない。\n例えば、\nA・BがCに100万円を貸す。\n↓\n複数の債権者。\nまた、\nAがB・Cに100万円を負担させる。\n↓\n複数の債務者。\nここで、\n•\t分割債権\n•\t分割債務\n•\t不可分債権\n•\t不可分債務\n•\t連帯債務\nなどが問題となる。\n⸻","blanks":["分割債権","分割債務","不可分債権","不可分債務"],"options":[["分割債権","権利能力","買います","意思能力"],["分割債務","権利能力","買います","意思能力"],["不可分債権","権利の主体","土地を買う","次の「物権"],["不可分債務","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"32":{"text":"1　基本\nAとBがCに対して、\nそれぞれ100万円全額について責任を負う\nという関係。\nCは、\nAに100万円全額請求する\nこともできる。\n⸻\n2　基本構造\nC（債権者）\n↙        ↘\nA（債務者） B（債務者）\nA・Bが連帯債務\n↓\nCは一定の範囲で\n各人に全額請求できる\n⸻","blanks":["AとBがCに対して、","という関係。"],"options":[["AとBがCに対して、","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["という関係。","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"33":{"text":"AがCに100万円全額を支払った。\n↓\nBの負担部分までAが負担する必要があるわけではない。\nAは一定の範囲でBに対して、\n求償\nすることができる。\n⸻","blanks":["Aは一定の範囲でBに対して、"],"options":[["Aは一定の範囲でBに対して、","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"]],"mode":"civil"},"34":{"text":"1　保証とは\nAがBから100万円を借りる。\nCが、\n「Aが返済しなければ、私が返します」\nと保証する。\n↓\nC＝保証人。\n⸻\n2　保証の基本構造\nA\n↓ 主債務\nB\nC\n↓ 保証\nB\nつまり、\nA＝主たる債務者\nC＝保証人\nB＝債権者\nという関係。\n⸻","blanks":["と保証する。","つまり、"],"options":[["と保証する。","お金を借りる","従業員を雇う","典型的には、"],["つまり、","権利能力","買います","意思能力"]],"mode":"civil"},"35":{"text":"保証債務は、\n主たる債務を担保するための債務\nである。\nそのため、\n主たる債務がどうなっているか\nが保証債務に大きく影響する。\nこれを付従性という。\n⸻","blanks":["付従性","保証債務は、"],"options":[["付従性","取消し","不確実","所有権"],["保証債務は、","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"36":{"text":"通常の保証よりも保証人の責任が重い。\n連帯保証では、保証人は原則として、\n「まず主債務者に請求してください」\nという抗弁を主張できない。\nそのため、\n通常保証\nと\n連帯保証\nは区別する必要がある。\n⸻","blanks":["まず主債務者に請求してください","という抗弁を主張できない。"],"options":[["まず主債務者に請求してください","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"],["という抗弁を主張できない。","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"]],"mode":"civil"},"37":{"text":"債権者は、\n「本当に回収できるのか」\nという問題を抱える。\nそこで、\n•\t保証\n•\t担保物権\n•\t債権者代位権\n•\t詐害行為取消権\nなどによって債権を保全する。\n⸻","blanks":["本当に回収できるのか","保証","担保物権","債権者代位権"],"options":[["本当に回収できるのか","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["保証","民法","総則","胎児"],["担保物権","権利能力","買います","意思能力"],["債権者代位権","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"38":{"text":"人的担保\n第三者などが責任を負う。\n代表：\n保証\n⸻\n物的担保\n特定の財産を担保にする。\n代表：\n•\t抵当権\n•\t質権\n•\t留置権\n•\t先取特権\n⸻\n比較\n人的担保\t物的担保\n基本\t人の財産を責任財産とする\t特定の物を担保\n代表\t保証\t抵当権\n回収の仕組み\t保証人等への請求\t担保物から優先弁済\n⸻","blanks":["抵当権","質権","留置権","先取特権"],"options":[["抵当権","取消し","不確実","所有権"],["質権","民法","総則","胎児"],["留置権","取消し","不確実","所有権"],["先取特権","権利能力","買います","意思能力"]],"mode":"civil"},"39":{"text":"ここまでを一つにつなげる。\n債権\n│\n┌────────┴────────┐\n│                 │\n発生               保全\n│                 │\n契約・不法行為       代位・詐害行為取消し\n不当利得・事務管理\n│\n↓\n履行\n│\n┌───┴───┐\n│       │\n正常履行  不履行\n│\n┌──────┼──────┐\n│      │      │\n遅滞   不能   不完全\n│      │      │\n└──────┼──────┘\n↓\n損害賠償\n解除など\n│\n↓\n債権の移転\n┌────┴────┐\n債権譲渡   債務引受\n│\n↓\n消滅\n│\n┌───────┼────────┐\n│       │        │\n弁済    相殺     免除\n│       │        │\n└───────┼────────┘\n│\n混同\n⸻","blanks":["ここまでを一つにつなげる。","不当利得・事務管理"],"options":[["ここまでを一つにつなげる。","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["不当利得・事務管理","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"40":{"text":"制度\t一言でいうと\n債権\t特定人への請求権\n債務\t債権に対応する義務\n履行遅滞\tできるのに期限どおり履行しない\n履行不能\t履行そのものができない\n不完全履行\t履行したが内容が不完全\n損害賠償\t不履行による損害を金銭等で填補\n解除\t契約関係を解消\n債権者代位権\t債務者の権利を代わりに行使\n詐害行為取消権\t債務者の責任財産を害する行為を取り消す\n債権譲渡\t債権者が変わる\n債務引受\t債務者が変わる\n弁済\t債務を実現する\n相殺\t対立する債権を差し引く\n免除\t債権者が債務を免除\n混同\t債権者と債務者が同一になる\n保証\t第三者が債務を担保\n連帯債務\t複数の債務者が各自全額について責任\n⸻","blanks":["制度\t一言でいうと","債権\t特定人への請求権"],"options":[["制度\t一言でいうと","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["債権\t特定人への請求権","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"41":{"text":"債権問題を見たら、次の順番で考える。\n① 誰が誰に請求しているか\nA → B\n⸻\n② 何を請求しているか\n金銭？\n物の引渡し？\n行為？\n⸻\n③ その債権は何から発生したか\n契約？\n不法行為？\n不当利得？\n⸻\n④ 債務は履行されたか\n履行済み？\n未履行？\n不完全？\n⸻\n⑤ 不履行なら何型か\n履行可能＋期限経過\n↓\n履行遅滞\n履行不可能\n↓\n履行不能\n履行したが不完全\n↓\n不完全履行\n⸻\n⑥ 債権者は何を求められるか\n•\t履行請求\n•\t損害賠償\n•\t解除\n•\t強制履行\n⸻\n⑦ 債権を保全する必要があるか\n•\t債権者代位権\n•\t詐害行為取消権\n•\t担保\n•\t保証\n⸻\n⑧ 債権者・債務者が変わっているか\n債権譲渡？\n債務引受？\n⸻\n⑨ 債権は消滅していないか\n弁済？\n相殺？\n免除？\n混同？\n時効？\n⸻","blanks":["履行請求","損害賠償","解除","強制履行"],"options":[["履行請求","権利能力","買います","意思能力"],["損害賠償","権利能力","買います","意思能力"],["解除","民法","総則","胎児"],["強制履行","権利能力","買います","意思能力"]],"mode":"civil"},"42":{"text":"第2編の物権と債権総論は密接につながっている。\n例えば土地売買。\nAがBに土地を売る\n↓\n契約\n↓\n債権関係\nA → B\n代金を請求\nB → A\n土地の引渡し等を請求\n↓\n物権変動\n↓\n所有権がA→B\n↓\n登記\n↓\n第三者への対抗\nつまり、\n契約によって債権が発生する\n↓\nその履行によって\n物権が移転する\nという形で両者が連動する。\n⸻","blanks":["債権関係","代金を請求"],"options":[["債権関係","権利能力","買います","意思能力"],["代金を請求","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"43":{"text":"AはBに100万円を貸した。\n返済期限は6月1日。\nしかしBは6月1日を過ぎても返済しない。\n↓\nまず、\n貸金返還請求権\nが存在する。\n↓\n返済期限が到来。\n↓\nBが返済しない。\n↓\n履行遅滞\nが問題となる。\n↓\nAに損害が発生。\n↓\n一定の要件を満たせば、\n損害賠償請求\nが問題となる。\n⸻\nさらにBが、\n「財産を全部Cに贈与してしまおう」\nとする。\n↓\nBの責任財産が減少。\n↓\nAの債権回収が困難になる。\n↓\n詐害行為取消権\nが問題となる。\n⸻\nBがCに対する100万円の債権を持っているのに行使しない。\n↓\nAが一定の要件の下でBに代わって権利を行使。\n↓\n債権者代位権\nが問題となる。\n⸻\nさらにCが、\n「Bの借金について保証します」\nとした。\n↓\n保証債務\nが成立。\n⸻\nこのように、一つの事件の中に、\n履行遅滞 ↓ 損害賠償 ↓ 債権保全 ↓ 保証\nという複数の制度が同時に登場することがある。\n⸻","blanks":["財産を全部Cに贈与してしまおう","Bの借金について保証します"],"options":[["財産を全部Cに贈与してしまおう","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"],["Bの借金について保証します","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"]],"mode":"civil"},"44":{"text":"債権の基本\n1.\t債権とは何か。\n2.\t債権者と債務者の違いは何か。\n3.\t債権はどのような原因から発生するか。\n4.\t債権の目的とは何か。\n5.\t特定物と種類物の違いは何か。\n債務不履行\n6.\t履行とは何か。\n7.\t履行遅滞とは何か。\n8.\t履行不能とは何か。\n9.\t不完全履行とは何か。\n10.\t3つをどう区別するか。\n11.\t債務不履行による損害賠償の基本構造を説明できるか。\n12.\t過失相殺とは何か。\n13.\t解除と損害賠償の関係を説明できるか。\n債権保全\n14.\t債権者代位権とは何か。\n15.\t詐害行為取消権とは何か。\n16.\t両者の違いは何か。\n債権の移転\n17.\t債権譲渡とは何か。\n18.\t債権譲渡の対抗要件とは何か。\n19.\t債務引受とは何か。\n20.\t債権譲渡と債務引受の違いは何か。\n債権の消滅\n21.\t弁済とは何か。\n22.\t相殺とは何か。\n23.\t相殺にどのような意味があるか。\n24.\t免除とは何か。\n25.\t混同とは何か。\n担保\n26.\t保証とは何か。\n27.\t連帯保証とは何か。\n28.\t連帯債務と保証の違いは何か。\n29.\t人的担保と物的担保の違いは何か。\n⸻","blanks":["債権の基本","債務不履行"],"options":[["債権の基本","権利の主体","土地を買う","次の「物権"],["債務不履行","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"45":{"text":"債権総論を一言でまとめると、\n「人と人との間に発生した請求権を、どのように実現し、守り、移転させ、最終的に消滅させるか」\nを学ぶ分野である。\n最重要の一本の流れは、\n債権発生\n↓\n債務内容の確定\n↓\n履行\n↓\n正常履行 ─────────→ 債権消滅\n│\n↓\n債務不履行\n↓\n┌──┼──────────┐\n│  │          │\n遅滞 不能     不完全\n│  │          │\n└──┼──────────┘\n↓\n履行請求\n損害賠償\n解除\n↓\n必要なら債権保全\n↓\n代位・詐害行為取消し\n↓\n債権譲渡・債務引受\n↓\n弁済・相殺・免除・混同\n↓\n債権消滅\nこの流れを頭の中に作っておく。\n⸻\n第3編終了時点での到達目標\n第3編では、細かい条文番号を先に暗記することよりも、\n「この事例では、債権がどこで発生し、現在どの段階にあり、何が問題になっているのか」\nを判断できることを目標とする。\n例えば、\n「期限を過ぎても金を払わない」\n→ 履行遅滞\n「目的物そのものが消滅した」\n→ 履行不能\n「一応履行したが契約内容と違う」\n→ 不完全履行・契約不適合\n「債務者が財産を処分して逃げようとしている」\n→ 詐害行為取消権\n「債務者が持っている権利を行使しない」\n→ 債権者代位権\n「債権者を別人に変える」\n→ 債権譲渡\n「債務者を別人に変える」\n→ 債務引受\n「お互いに金を払う関係」\n→ 相殺\n「第三者が借金の責任を負う」\n→ 保証\nというように、\n事実 → 法律関係 → 制度\nへ変換できることが重要である。","blanks":["期限を過ぎても金を払わない","目的物そのものが消滅した","一応履行したが契約内容と違う","債務者が持っている権利を行使しない"],"options":[["期限を過ぎても金を払わない","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["目的物そのものが消滅した","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["一応履行したが契約内容と違う","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"],["債務者が持っている権利を行使しない","試験に合格したら100万円をあげる","死亡した人の権利は全部相続人へ移る","人――権利能力・意思能力・行為能力"]],"mode":"civil"}},"4":{"1":{"text":"1　契約の意味\n契約とは、\n複数の当事者の意思表示の合致によって成立する法律行為\nである。\n最も典型的なのが売買契約。\nA「この車を100万円で売ります」\nB「買います」\n↓\n意思の合致\n↓\n売買契約成立。\n⸻\n2　契約の基本構造\n申込み\n↓\n承諾\n↓\n意思の合致\n↓\n契約成立\n↓\n当事者に権利・義務が発生\n契約が成立すると、\n•\t誰が\n•\t誰に\n•\t何を\n•\tいつまでに\n•\tどのように\n履行するのかが問題になる。\n⸻","blanks":["契約","この車を100万円で売ります","買います","誰が"],"options":[["契約","民法","総則","胎児"],["この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情","契約当事者以外なら全員第三者"],["買います","権利能力","意思能力","法律行為"],["誰が","民法","総則","胎児"]],"mode":"civil"},"2":{"text":"契約法の基本原則は契約自由である。\n原則として、\n① 契約締結の自由\n契約するかしないかを自由に決められる。\n② 相手方選択の自由\n誰と契約するかを自由に決められる。\n③ 内容決定の自由\nどのような内容にするかを自由に決められる。\n④ 方式の自由\n原則として、どのような方式で契約するかも自由。\nただし、法律による制限や公序良俗、強行規定などがある。\n⸻","blanks":["① 契約締結の自由","② 相手方選択の自由"],"options":[["① 契約締結の自由","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["② 相手方選択の自由","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"3":{"text":"1　申込みと承諾\n契約の基本は、\n申込み＋承諾\nである。\n例えば、\nA「100万円で車を売ります」\nB「買います」\n↓\n契約成立。\n⸻\n2　契約は必ず書面が必要なのか\n原則として、契約は当事者の合意で成立する。\nしたがって、\n「契約書を書いていない＝契約がない」\nとは限らない。\nただし、法律上一定の方式が要求される契約もある。\nまた、実務では証拠を残すために契約書を作成することが重要になる。\n⸻","blanks":["100万円で車を売ります","買います","契約書を書いていない","契約がない"],"options":[["100万円で車を売ります","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["買います","権利能力","意思能力","法律行為"],["契約書を書いていない","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["契約がない","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"4":{"text":"契約が成立すると、\n契約当事者を拘束する\nという効果が生じる。\nこれを契約の拘束力として理解する。\n例えば売買契約なら、\n売主\n→ 目的物を引き渡す義務\n買主\n→ 代金を支払う義務\nが発生する。\n⸻","blanks":["契約が成立すると、","契約当事者を拘束する"],"options":[["契約が成立すると、","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["契約当事者を拘束する","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"5":{"text":"1　意味\n双務契約では、\nお互いが義務を負う\nことが多い。\n例えば売買。\n売主 → 車を引き渡す\n買主 → 代金を支払う\nこの場合、一方が履行しないのに、\n「自分だけ先に履行しろ」\nと言われても、一定の要件の下で拒むことができる。\nこれが同時履行の抗弁権。\n⸻\n2　イメージ\n売主\n車を渡す\n↕\n買主\n代金を払う\n原則として、\nお互いの履行を同時に実現する\nという関係。\n⸻","blanks":["自分だけ先に履行しろ","同時履行の抗弁権"],"options":[["自分だけ先に履行しろ","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["同時履行の抗弁権","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"6":{"text":"1　危険負担とは\n双務契約が成立した後、\n当事者の責任ではない事情によって債務の履行ができなくなった場合、反対側の債務をどうするか\nという問題。\n⸻\n2　現在の基本構造\n例えば、\nAがBに特定の物を売る契約をした。\nしかし、AにもBにも責任のない事情で、その物が滅失した。\n↓\nAは引き渡せない。\n↓\nではBは代金を払わなければならないのか？\nこれが危険負担の問題。\n現在の民法では、契約解除などと関連して整理する必要がある。\n⸻","blanks":["危険負担の問題","双務契約が成立した後、"],"options":[["危険負担の問題","結婚・離婚する","必ず絶対に従う","というケース。"],["双務契約が成立した後、","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"7":{"text":"1　解除とは\n解除とは、\n一定の要件の下で契約を解消する制度\nである。\n典型例は債務不履行。\n⸻\n2　基本構造\n契約成立\n↓\n一方が重大な債務不履行\n↓\n一定の要件\n↓\n解除\n↓\n契約関係の解消\n⸻\n3　解除と損害賠償\n解除したからといって、\n損害賠償が必ずできなくなる\nわけではない。\n一定の要件の下で、\n解除＋損害賠償\nが成立し得る。\n⸻","blanks":["解除","典型例は債務不履行。"],"options":[["解除","民法","総則","胎児"],["典型例は債務不履行。","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"8":{"text":"1　定型約款とは\n大量の取引を画一的に処理するため、\nあらかじめ定められた契約条項\nを用いる場合がある。\n例えば、\n•\t通信サービス\n•\t保険\n•\t銀行サービス\n•\tインターネットサービス\n•\t運送サービス\nなど。\n⸻\n2　なぜ特別なルールが必要なのか\n通常の契約では、\n当事者が個々の条項を交渉する\nことを想定できる。\nしかし大量取引では、\n一人ひとりと全条項を交渉する\nことは現実的ではない。\nそこで定型約款について特別なルールが設けられている。\n⸻\n3　定型約款の核心\n重要なのは、\n「約款に書いてあるだけで、何でも契約内容になるわけではない」\nということ。\n定型約款の組入れや不当な条項について、民法上のルールが存在する。\n⸻","blanks":["通信サービス","保険","銀行サービス","インターネットサービス"],"options":[["通信サービス","お金を借りる","従業員を雇う","典型的には、"],["保険","民法","総則","胎児"],["銀行サービス","お金を借りる","従業員を雇う","典型的には、"],["インターネットサービス","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"9":{"text":"1　意味\n契約当事者ではない第三者に、\n直接利益を与える契約\nがある。\n例えば、\nAとBが契約。\nその契約によって、\nCが代金を受け取る。\n↓\nC＝第三者。\n⸻\n2　基本構造\nA ───契約─── B\n\\             /\n\\           /\n→ Cに利益\nここでは、\n•\t要約者\n•\t諾約者\n•\t受益者\nという関係を理解する。\n⸻","blanks":["要約者","諾約者","受益者"],"options":[["要約者","取消し","不確実","所有権"],["諾約者","取消し","不確実","所有権"],["受益者","取消し","不確実","所有権"]],"mode":"civil"},"10":{"text":"1　贈与とは\n贈与は、\n一方が無償で財産を与える意思を示し、相手方が受諾することによって成立する契約\nである。\n例えば、\nA「この車をあなたにあげます」\nB「ありがとう。もらいます」\n↓\n贈与。\n⸻\n2　贈与の特徴\n売買と違い、\n対価がない\nことが大きな特徴。\n⸻\n3　書面によらない贈与\n書面によらない贈与については、民法上、一定の場合に撤回が認められる。\nただし、履行が終わった部分などについては扱いが異なる。\nしたがって、\n「贈与したら絶対に撤回できない」\nでも、\n「いつでも撤回できる」\nでもない。\n⸻","blanks":["この車をあなたにあげます","ありがとう。もらいます","贈与したら絶対に撤回できない","いつでも撤回できる"],"options":[["この車をあなたにあげます","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["ありがとう。もらいます","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"],["贈与したら絶対に撤回できない","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"],["いつでも撤回できる","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"11":{"text":"1　売買とは\n売買とは、\n財産権を移転することと、その代金を支払うことを約する契約\nである。\n最も基本的な有償契約。\n⸻\n2　売主の義務\n代表的には、\n目的物・権利を買主に移転すること\nなど。\n⸻\n3　買主の義務\n基本は、\n代金を支払うこと\nである。\n⸻","blanks":["売買","目的物・権利を買主に移転すること"],"options":[["売買","民法","総則","胎児"],["目的物・権利を買主に移転すること","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"]],"mode":"civil"},"12":{"text":"売主\n│\n├─ 目的物・権利を移転\n│\n↓\n買主\n│\n└─ 代金を支払う\n↓\n売主\nつまり、\n目的物の移転\nと\n代金の支払い\nが対価関係にある。\n⸻","blanks":["つまり、","目的物の移転"],"options":[["つまり、","権利能力","買います","意思能力"],["目的物の移転","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"13":{"text":"1　意味\n売買の目的物が、\n契約の内容に適合していない\n場合に問題となる。\n例えば、\n「新品のパソコン」\nとして購入したのに、\n実際には重大な故障がある。\n↓\n契約内容との不適合。\n⸻\n2　買主の救済\n一定の要件の下で、\n•\t追完請求\n•\t代金減額請求\n•\t損害賠償\n•\t解除\nなどが問題となる。\n⸻\n3　旧「瑕疵担保責任」との違い\n現在の民法では、従来の「瑕疵担保責任」という考え方を、\n契約不適合責任\nとして整理している。\n債権法改正で重要な変更がされた部分である。(法務省)\n⸻","blanks":["新品のパソコン","追完請求","代金減額請求","瑕疵担保責任"],"options":[["新品のパソコン","結婚・離婚する","必ず絶対に従う","というケース。"],["追完請求","権利能力","買います","意思能力"],["代金減額請求","お金を借りる","従業員を雇う","典型的には、"],["瑕疵担保責任","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"14":{"text":"売買契約が成立すると、\n当事者間でどのように所有権が移転するか\nが問題となる。\n第2編で学んだ、\n物権変動\nとここでつながる。\n売買契約\n↓\n債権関係\n↓\n所有権移転\n↓\n登記\n↓\n第三者への対抗\nしたがって、\n債権法と物権法は実際の取引で一体となって働く。\n⸻","blanks":["売買契約が成立すると、","第2編で学んだ、"],"options":[["売買契約が成立すると、","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"],["第2編で学んだ、","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"15":{"text":"1　手付とは\n売買契約などにおいて、\n契約時に交付される金銭等\nを手付という。\n手付には複数の種類があるが、特に重要なのが解約手付。\n⸻\n2　解約手付\n一定の条件の下で、\n買主\n→ 手付を放棄\n売主\n→ 手付の倍額を償還\nすることで、契約を解除できる仕組み。\nただし、相手方が履行に着手した後は、一定の場合に解除できなくなる。\n⸻","blanks":["解約手付","契約時に交付される金銭等"],"options":[["解約手付","権利能力","買います","意思能力"],["契約時に交付される金銭等","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"]],"mode":"civil"},"16":{"text":"交換とは、\n当事者が互いに財産権を移転する契約\nである。\n売買との違いは、\n金銭を対価とするのではなく、財産権同士を交換する\nこと。\n例えば、\nAの土地\n↕\nBの土地\nを交換する。\n⸻","blanks":["交換","売買との違いは、"],"options":[["交換","民法","総則","胎児"],["売買との違いは、","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"17":{"text":"1　意味\n消費貸借とは、\n金銭その他の物を受け取り、同種・同品質・同数量の物を返還する契約\nである。\n代表例：\n金銭の貸し借り\n⸻\n2　なぜ「消費」なのか\n借りたお金をそのまま返す必要はない。\n例えば、\nAから10万円を借りる。\n↓\nその10万円を使う。\n↓\n後で10万円を返す。\nこのように、\n目的物そのものを消費して、同種・同数量の物を返す\nため消費貸借という。\n⸻","blanks":["消費貸借","消費"],"options":[["消費貸借","権利能力","買います","意思能力"],["消費","民法","総則","胎児"]],"mode":"civil"},"18":{"text":"1　意味\n使用貸借は、\n無償で物を借りて使用し、返還する契約\nである。\n例えば、\nAがBに自転車を無料で貸す。\n↓\nBが使用。\n↓\n後で返す。\n⸻\n2　消費貸借との違い\n消費貸借\t使用貸借\n対象\t消費する物等\t使用する物\n返すもの\t同種・同品質・同数量\t原則として同じ物\n典型\tお金\t車・自転車\n⸻","blanks":["使用貸借は、","後で返す。"],"options":[["使用貸借は、","お金を借りる","従業員を雇う","典型的には、"],["後で返す。","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"19":{"text":"1　意味\n賃貸借とは、\n当事者の一方が物を使用・収益させ、相手方が賃料を支払う契約\nである。\n代表例：\n•\tアパート\n•\tマンション\n•\t店舗\n•\t土地\n•\t駐車場\nなど。\n⸻","blanks":["賃貸借","アパート","マンション","店舗"],"options":[["賃貸借","取消し","不確実","所有権"],["アパート","権利能力","買います","意思能力"],["マンション","権利の主体","土地を買う","次の「物権"],["店舗","民法","総則","胎児"]],"mode":"civil"},"20":{"text":"賃貸人\n↓\n物を使用・収益させる\n↓\n賃借人\n↓\n賃料を支払う\n↓\n賃貸人\n賃貸人には、\n使用・収益させる義務\n賃借人には、\n賃料支払義務\nがある。\n⸻","blanks":["物を使用・収益させる","賃料を支払う"],"options":[["物を使用・収益させる","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["賃料を支払う","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"21":{"text":"賃貸物について一定の修繕が必要となった場合、\n原則として賃貸人が修繕義務を負う\nことが基本となる。\nただし、\n•\t契約内容\n•\t原因\n•\t修繕の内容\nなどによって扱いが異なる。\n⸻","blanks":["契約内容","原因","修繕の内容"],"options":[["契約内容","権利能力","買います","意思能力"],["原因","民法","総則","胎児"],["修繕の内容","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"22":{"text":"賃借人には、\n•\t賃料支払い\n•\t善良な管理者としての注意\n•\t用法遵守\n•\t契約終了時の返還\nなどの義務がある。\n⸻","blanks":["賃料支払い","善良な管理者としての注意","用法遵守","契約終了時の返還"],"options":[["賃料支払い","権利の主体","土地を買う","次の「物権"],["善良な管理者としての注意","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["用法遵守","権利能力","買います","意思能力"],["契約終了時の返還","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"23":{"text":"1　敷金とは\n賃貸借において、\n賃料その他の債務を担保するために交付される金銭\nである。\n⸻\n2　賃貸借終了時\n賃借人に未払い賃料等がなければ、\n原則として敷金は返還される。\n法務省も債権法改正によって敷金返還ルールが明文化されたことを説明している。(法務省)\n⸻","blanks":["賃貸借において、","賃借人に未払い賃料等がなければ、"],"options":[["賃貸借において、","どのような意思で","変更・管理・保存","保険金が発生した"],["賃借人に未払い賃料等がなければ、","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"]],"mode":"civil"},"24":{"text":"賃借人が退去するとき、\n「借りたときの状態に完全に戻せ」\nという意味ではない。\n通常の使用による経年変化や通常損耗については、原則として賃借人の負担とはならない。\n一方、\n故意・過失による損傷\nなどについては賃借人の責任が問題となる。\n⸻","blanks":["借りたときの状態に完全に戻せ","賃借人が退去するとき、"],"options":[["借りたときの状態に完全に戻せ","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"],["賃借人が退去するとき、","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"25":{"text":"賃貸借は、\n•\t期間満了\n•\t解除\n•\t解約\n•\tその他の終了原因\nなどによって終了する。\n終了後は、\n目的物の返還\nや\n敷金の精算\nなどが問題となる。\n⸻","blanks":["期間満了","解除","解約","その他の終了原因"],"options":[["期間満了","権利能力","買います","意思能力"],["解除","民法","総則","胎児"],["解約","民法","総則","胎児"],["その他の終了原因","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"26":{"text":"土地や建物の賃貸借には、\n借地借家法\nという特別法が関係する。\nしたがって、\n民法の賃貸借だけ覚えれば、実際の不動産賃貸借を全部理解できる\nわけではない。\n行政書士として実務に進む場合には、民法と借地借家法をセットで理解する必要がある。\n⸻","blanks":["土地や建物の賃貸借には、","借地借家法"],"options":[["土地や建物の賃貸借には、","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["借地借家法","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"27":{"text":"1　意味\n雇用とは、\n一方が労働に従事し、相手方がその報酬を支払う契約\nである。\n⸻\n2　基本構造\n労働者\n↓ 労働\n使用者\n↓ 賃金\n労働者\n⸻\n3　民法と労働法\n雇用契約の基本は民法にある。\nしかし実際の労働関係では、\n•\t労働基準法\n•\t労働契約法\n•\t最低賃金法\n•\t労働組合法\nなど、多くの特別法が関係する。\nしたがって、\n民法上の雇用＋労働法\nという形で理解する。\n⸻","blanks":["雇用","労働基準法","労働契約法","最低賃金法"],"options":[["雇用","民法","総則","胎児"],["労働基準法","権利の主体","土地を買う","次の「物権"],["労働契約法","権利の主体","土地を買う","次の「物権"],["最低賃金法","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"28":{"text":"1　意味\n請負とは、\n仕事を完成することを約し、その結果に対して報酬を支払う契約\nである。\n例えば、\n•\t建物建築\n•\tリフォーム\n•\tシステム開発\n•\t修理\n•\t製造\nなど。\n⸻\n2　請負の核心\n請負では、\n仕事の完成\nが重要。\n請負人\n↓\n仕事を完成\n↓\n注文者\n↓\n報酬支払い\n⸻","blanks":["請負","建物建築","リフォーム","システム開発"],"options":[["請負","民法","総則","胎児"],["建物建築","権利能力","買います","意思能力"],["リフォーム","権利の主体","土地を買う","次の「物権"],["システム開発","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"29":{"text":"ここは重要。\n雇用\t請負\n中心\t労務提供\t仕事の完成\n報酬\t労働への対価\t完成した仕事への対価\n例\t会社員\t建築業者\nただし、実際の契約では区別が難しい場合がある。\n契約書の名称だけではなく、\n実際の法律関係\nを見ることが重要。\n⸻","blanks":["ここは重要。","雇用\t請負"],"options":[["ここは重要。","お金を借りる","従業員を雇う","典型的には、"],["雇用\t請負","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"30":{"text":"完成した仕事が契約内容に適合しない場合、\n契約不適合\nが問題となる。\n一定の要件の下で、\n•\t追完\n•\t報酬減額\n•\t損害賠償\n•\t解除\nなどが問題となる。\n⸻","blanks":["追完","報酬減額","損害賠償","解除"],"options":[["追完","民法","総則","胎児"],["報酬減額","権利能力","買います","意思能力"],["損害賠償","権利能力","買います","意思能力"],["解除","民法","総則","胎児"]],"mode":"civil"},"31":{"text":"1　意味\n委任とは、\n法律行為をすることを相手方に委託し、相手方がこれを承諾する契約\nである。\n代表例：\n他人に法律行為を任せる。\n⸻\n2　委任と代理は違う\nここは非常に重要。\n委任＝契約\n代理＝法律効果を本人に帰属させる制度\nである。\nしたがって、\n委任した＝必ず代理権が発生する\nとは限らない。\n⸻","blanks":["委任","契約","代理","法律効果を本人に帰属させる制度"],"options":[["委任","民法","総則","胎児"],["契約","民法","総則","胎児"],["代理","民法","総則","胎児"],["法律効果を本人に帰属させる制度","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"]],"mode":"civil"},"32":{"text":"法律行為ではない事務を委託する場合、\n準委任\nが問題となる。\n例えば、\n•\tコンサルティング\n•\t専門的サービス\n•\t各種事務処理\nなど。\n⸻","blanks":["コンサルティング","専門的サービス","各種事務処理"],"options":[["コンサルティング","どのような意思で","変更・管理・保存","保険金が発生した"],["専門的サービス","結婚・離婚する","必ず絶対に従う","というケース。"],["各種事務処理","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"33":{"text":"受任者には、\n•\t善管注意義務\n•\t報告義務\n•\t受取物引渡義務\n•\t取得した権利の移転\n•\t事務処理に関する義務\nなどがある。\n委任は、\n他人の事務を任せる関係\nなので、信頼関係が重要となる。\n⸻","blanks":["善管注意義務","報告義務","受取物引渡義務","取得した権利の移転"],"options":[["善管注意義務","お金を借りる","従業員を雇う","典型的には、"],["報告義務","権利能力","買います","意思能力"],["受取物引渡義務","結婚・離婚する","必ず絶対に従う","というケース。"],["取得した権利の移転","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"34":{"text":"委任は、\n•\t解除\n•\t当事者の死亡\n•\t破産\n•\tその他の法定終了事由\nなどによって終了する場合がある。\nただし、当事者の関係や契約内容によって例外もある。\n⸻","blanks":["解除","当事者の死亡","破産","その他の法定終了事由"],"options":[["解除","民法","総則","胎児"],["当事者の死亡","お金を借りる","従業員を雇う","典型的には、"],["破産","民法","総則","胎児"],["その他の法定終了事由","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"35":{"text":"1　意味\n寄託とは、\n物を預け、相手方がそれを保管する契約\nである。\n例えば、\nAがBに荷物を預ける。\n↓\nBが保管する。\n⸻\n2　寄託の特徴\n中心となるのは、\n保管\nである。\n賃貸借が、\n使用・収益\nを中心とするのに対し、\n寄託は、\n保管\nを中心とする。\n⸻","blanks":["寄託","保管"],"options":[["寄託","民法","総則","胎児"],["保管","民法","総則","胎児"]],"mode":"civil"},"36":{"text":"1　意味\n組合とは、\n各当事者が出資をして共同の事業を営むことを約する契約\nである。\n例えば、\nA・B・Cが共同で事業を行うため、\nそれぞれ出資する。\n↓\n組合。\n⸻\n2　組合の特徴\n単なる共同契約ではなく、\n共同目的の実現\nが重要。\n⸻","blanks":["組合","それぞれ出資する。"],"options":[["組合","民法","総則","胎児"],["それぞれ出資する。","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"37":{"text":"終身定期金は、\n当事者の一方が、自己・相手方・第三者の死亡まで、定期的に金銭等を給付する契約\nである。\n現代の実務では重要性は比較的小さいが、民法上の典型契約として位置付けられている。\n⸻","blanks":["終身定期金は、"],"options":[["終身定期金は、","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"38":{"text":"1　意味\n和解とは、\n当事者が互いに譲歩して争いをやめる契約\nである。\n例えば、\nA「損害は100万円だ」\nB「50万円しか払わない」\n↓\n双方が、\n「75万円で解決しましょう」\nと合意。\n↓\n和解。\n⸻\n2　和解の目的\n重要なのは、\n紛争を終わらせること\nである。\n裁判を続けるのではなく、\n当事者の譲歩\n↓\n紛争終了\nという機能を持つ。\n⸻","blanks":["和解","損害は100万円だ","50万円しか払わない","75万円で解決しましょう"],"options":[["和解","民法","総則","胎児"],["損害は100万円だ","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["50万円しか払わない","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["75万円で解決しましょう","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"]],"mode":"civil"},"39":{"text":"契約\t中心となる内容\n贈与\t無償で財産を与える\n売買\t財産権と代金を交換\n交換\t財産権同士を交換\n消費貸借\t同種・同品質・同数量を返す\n使用貸借\t無償で使用して返す\n賃貸借\t使用・収益させ、賃料を払う\n雇用\t労働して報酬を受ける\n請負\t仕事を完成して報酬を受ける\n委任\t法律行為を委託\n寄託\t物を保管する\n組合\t共同事業を行う\n終身定期金\t終身の定期給付\n和解\t互いに譲歩して紛争終了\n⸻","blanks":["贈与\t無償で財産を与える","売買\t財産権と代金を交換"],"options":[["贈与\t無償で財産を与える","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["売買\t財産権と代金を交換","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"]],"mode":"civil"},"40":{"text":"実際の事例では、契約書に「請負契約」「委任契約」と書いてあるとは限らない。\nそこで、\n契約の実質\nを見る。\n物を使わせる\n↓\n賃貸借\n無料で物を使わせる\n↓\n使用貸借\n仕事を完成させる\n↓\n請負\n事務を任せる\n↓\n委任・準委任\n保管させる\n↓\n寄託\n労働そのものを提供する\n↓\n雇用\n⸻","blanks":["請負契約","委任契約"],"options":[["請負契約","権利能力","買います","意思能力"],["委任契約","権利能力","買います","意思能力"]],"mode":"civil"},"41":{"text":"どの契約でも、基本的な思考方法は共通する。\n契約成立\n↓\n契約内容を確定\n↓\n履行\n↓\n正常？\n│\n└→ NO\n↓\n契約不適合？\n履行遅滞？\n履行不能？\n↓\nどんな救済？\n├ 履行請求\n├ 追完\n├ 代金減額\n├ 損害賠償\n└ 解除\n⸻","blanks":["契約成立","契約内容を確定"],"options":[["契約成立","権利能力","買います","意思能力"],["契約内容を確定","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"42":{"text":"第3編では、\n「債務不履行とは何か」\nを一般論として学んだ。\n第4編では、\n「売買で債務不履行が起きたらどうなる？」\n「賃貸借で問題が起きたら？」\n「請負で完成した仕事に問題があったら？」\nというように具体化する。\nつまり、\n第3編\n債権総論\n↓\n一般ルール\n↓\n第4編\n契約各論\n↓\n具体的な契約への適用\nという関係。\n⸻","blanks":["売買で債務不履行が起きたらどうなる？","賃貸借で問題が起きたら？","請負で完成した仕事に問題があったら？"],"options":[["売買で債務不履行が起きたらどうなる？","私の代理人としてCから車を買ってきて","この問題は物権のどの部分の問題なのか","請負で完成した仕事に問題があったら？"],["賃貸借で問題が起きたら？","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["請負で完成した仕事に問題があったら？","私の代理人としてCから車を買ってきて","この問題は物権のどの部分の問題なのか","売買で債務不履行が起きたらどうなる？"]],"mode":"civil"},"43":{"text":"契約問題では、次の順番で考える。\n① 何の契約か\n売買？\n賃貸借？\n請負？\n委任？\n⸻\n② 契約は成立しているか\n申込み？\n承諾？\n意思の合致？\n⸻\n③ 契約内容は何か\n何を約束したのか。\n⸻\n④ どちらが何を履行するのか\n売買なら、\n売主→目的物\n買主→代金\n⸻\n⑤ 問題が起きているか\n履行遅滞？\n履行不能？\n契約不適合？\n⸻\n⑥ どんな救済があるか\n•\t履行請求\n•\t追完\n•\t代金減額\n•\t損害賠償\n•\t解除\n⸻\n⑦ 特別法がないか\n例えば賃貸借なら、\n借地借家法\n雇用なら、\n労働法\n消費者取引なら、\n消費者契約法\nなど。\n⸻","blanks":["履行請求","追完","代金減額","損害賠償"],"options":[["履行請求","権利能力","買います","意思能力"],["追完","民法","総則","胎児"],["代金減額","権利能力","買います","意思能力"],["損害賠償","権利能力","買います","意思能力"]],"mode":"civil"},"44":{"text":"AはBに、\n「この車を100万円で売る」\nと契約した。\nBは100万円を支払った。\nところがAは車を引き渡さない。\n↓\nまず、\n売買契約\nが成立。\n↓\nAには、\n車を引き渡す義務\nがある。\n↓\nAが履行しない。\n↓\n債務不履行。\n↓\nBは、\n履行請求\nを検討できる。\n一定の要件を満たせば、\n解除\nや\n損害賠償\nも問題となる。\n⸻\n一方、車を引き渡したものの、\n「完全に新品の車」\nという契約だったのに重大な故障があった。\n↓\n単純な未履行ではない。\n↓\n契約不適合\n↓\nBは一定の要件の下で、\n•\t追完\n•\t代金減額\n•\t損害賠償\n•\t解除\nなどを検討する。\n⸻","blanks":["この車を100万円で売る","完全に新品の車","追完","代金減額"],"options":[["この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか","他人の土地を利用する権利"],["完全に新品の車","結婚・離婚する","必ず絶対に従う","というケース。"],["追完","民法","総則","胎児"],["代金減額","権利能力","買います","意思能力"]],"mode":"civil"},"45":{"text":"物を「売る」\n↓\n売買\n物を「交換する」\n↓\n交換\n物を「無料であげる」\n↓\n贈与\nお金等を「借りて同種物を返す」\n↓\n消費貸借\n物を「無料で使わせる」\n↓\n使用貸借\n物を「使わせて賃料を取る」\n↓\n賃貸借\n「労働」を提供\n↓\n雇用\n「仕事の完成」\n↓\n請負\n「事務を任せる」\n↓\n委任・準委任\n「保管する」\n↓\n寄託\n「共同事業」\n↓\n組合\n「紛争を終わらせる」\n↓\n和解\n⸻","blanks":["売る","交換する","無料であげる","借りて同種物を返す"],"options":[["売る","民法","総則","胎児"],["交換する","権利能力","買います","意思能力"],["無料であげる","お金を借りる","従業員を雇う","典型的には、"],["借りて同種物を返す","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"46":{"text":"契約法で重要なのは、\n契約の名前を暗記することではない。\n重要なのは、\n当事者が何を約束したのか\nを見ること。\nそして、\n契約成立\n↓\n契約内容\n↓\n双方の義務\n↓\n履行\n↓\n不履行・不適合\n↓\n救済\nという流れで考える。\n⸻","blanks":["契約法で重要なのは、","重要なのは、"],"options":[["契約法で重要なのは、","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["重要なのは、","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"47":{"text":"契約総論\n1.\t契約とは何か。\n2.\t契約自由の原則とは何か。\n3.\t申込みと承諾とは何か。\n4.\t契約書がなければ契約は成立しないのか。\n5.\t同時履行の抗弁権とは何か。\n6.\t危険負担とは何か。\n7.\t解除とは何か。\n8.\t定型約款とは何か。\n9.\t第三者のためにする契約とは何か。\n贈与・売買\n10.\t贈与とは何か。\n11.\t売買とは何か。\n12.\t売主と買主の基本的な義務は何か。\n13.\t契約不適合責任とは何か。\n14.\t契約不適合の場合、買主にはどのような救済があるか。\n15.\t手付とは何か。\n16.\t解約手付とは何か。\n17.\t売買契約と所有権移転の関係を説明できるか。\n使用・賃貸\n18.\t消費貸借とは何か。\n19.\t使用貸借とは何か。\n20.\t両者の違いは何か。\n21.\t賃貸借とは何か。\n22.\t賃貸人の基本的義務は何か。\n23.\t賃借人の基本的義務は何か。\n24.\t敷金とは何か。\n25.\t原状回復とは何か。\n26.\t借地借家法がなぜ重要なのか。\n役務提供型契約\n27.\t雇用とは何か。\n28.\t請負とは何か。\n29.\t雇用と請負の違いは何か。\n30.\t委任とは何か。\n31.\t委任と代理の違いは何か。\n32.\t準委任とは何か。\n33.\t寄託とは何か。\n34.\t組合とは何か。\n35.\t和解とは何か。\n⸻","blanks":["契約総論","贈与・売買"],"options":[["契約総論","権利能力","買います","意思能力"],["贈与・売買","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"48":{"text":"契約・債権各論の全体地図\n契約\n│\n┌──────────┴──────────┐\n│                     │\n契約総論              典型契約\n│                     │\n┌─────┼─────┐        ┌────┼────┐\n│     │     │        │    │    │\n成立   効力   解除     贈与  売買  交換\n│     │     │\n│   約款   危険負担\n│\n└──────────────┐\n│\n各契約の履行\n│\n┌────────┴────────┐\n│                 │\n正常履行            問題発生\n│\n┌──────────┼──────────┐\n│          │          │\n遅滞        不履行      不適合\n│          │          │\n└──────────┼──────────┘\n↓\n履行・追完\n代金減額\n損害賠償\n解除\nその他の典型契約\n│\n┌────┬────┬────┬────┬────┐\n│    │    │    │    │\n消費貸借 使用貸借 賃貸借 雇用 請負\n│\n委任・準委任\n│\n寄託\n│\n組合\n│\n終身定期金\n│\n和解\n⸻","blanks":["契約・債権各論の全体地図","各契約の履行"],"options":[["契約・債権各論の全体地図","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["各契約の履行","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"49":{"text":"第4編を一言でいうと、\n「契約にはどのような種類があり、それぞれ当事者にどのような権利・義務が生じ、契約がうまく履行されなかった場合にどう処理するか」\nを学ぶ編である。\nそして、第3編との関係は、\n第3編＝債権の一般理論\n第4編＝その一般理論を具体的な契約に適用\nと考える。\n⸻\n第4編終了時点での到達目標\n事例を見たとき、\n「これは何の契約なのか？」\nを判断できる。\nさらに、\n「その契約では誰が何をする義務を負っているのか？」\nを判断できる。\nそして、\n「その義務が履行されなかった場合、どの救済を使うのか？」\nまで考えられるようになる。\nつまり、\n事実\n↓\n契約類型\n↓\n契約内容\n↓\n当事者の義務\n↓\n履行・不履行\n↓\n救済\nという法的思考ができれば、第4編の基礎は身についている。\n⸻\n第1編～第4編のつながり\nここまでの民法を一本につなげると、\n第1編 総則\n「人・意思・法律行為」\n↓\n第2編 物権\n「物を誰が支配するか」\n↓\n第3編 債権総論\n「誰が誰に何を請求できるか」\n↓\n第4編 契約・債権各論\n「具体的な契約で何が起こるか」\nとなる。\nこの4編で、民法財産法の基本的な骨格が完成する。","blanks":["第4編","第3編","債権の一般理論","その一般理論を具体的な契約に適用"],"options":[["第4編","取消し","不確実","所有権"],["第3編","取消し","不確実","所有権"],["債権の一般理論","結婚・離婚する","必ず絶対に従う","というケース。"],["その一般理論を具体的な契約に適用","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"]],"mode":"civil"}},"5":{"1":{"text":"第3編では、債権とは、\n特定の人に対して、一定の行為を請求できる権利\nだと学んだ。\n債権は契約だけから発生するわけではない。\n代表的な発生原因は、\n•\t契約\n•\t事務管理\n•\t不当利得\n•\t不法行為\nである。\n今回扱う第5編では、このうち、\n事務管理\n不当利得\n不法行為\nを学ぶ。\n⸻","blanks":["債権","契約","事務管理","不当利得"],"options":[["債権","民法","総則","胎児"],["契約","民法","総則","胎児"],["事務管理","権利能力","買います","意思能力"],["不当利得","権利能力","買います","意思能力"]],"mode":"civil"},"2":{"text":"1　意味\n事務管理とは、\n法律上の義務がないのに、他人のためにその事務を処理すること\nである。\n例えば、\nAが旅行中。\n↓\nAの家の水道管が破裂。\n↓\n近所のBがAに頼まれていないのに、緊急で業者を呼んで修理した。\n↓\nBはAのために事務を処理している。\nこれが事務管理。\n⸻","blanks":["事務管理","Aの家の水道管が破裂。"],"options":[["事務管理","権利能力","買います","意思能力"],["Aの家の水道管が破裂。","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"3":{"text":"A\n本人\n│\n│ 本人から頼まれていない\n│\n↓\nB\n管理者\n│\n│ Aのために事務を処理\n↓\n事務管理\n重要なのは、\n契約がない\nという点。\nしかし、他人のために事務を処理した以上、法律上一定の権利・義務が発生する。\n⸻","blanks":["事務管理","重要なのは、"],"options":[["事務管理","権利能力","買います","意思能力"],["重要なのは、","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"4":{"text":"事務管理では、基本的に次の点を確認する。\n① 他人の事務であること\n自分自身の事務ではなく、\n他人のための事務\nである必要がある。\n② 法律上の義務なく行うこと\n契約などによって、もともと処理する義務がある場合は、通常の事務管理とは異なる。\n③ 他人のためにする意思\n本人のために処理する意思が必要。\n④ 本人の意思・利益に適合すること\n本人の意思や利益に反しないように管理する必要がある。\n⸻","blanks":["自分自身の事務ではなく、","他人のための事務"],"options":[["自分自身の事務ではなく、","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["他人のための事務","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"5":{"text":"事務管理を始めた者には、一定の義務が生じる。\n代表的には、\n•\t適切に事務を処理する義務\n•\t本人への通知\n•\t経過・結果の報告\n•\t取得した物などの引渡し\n•\t本人のために取得した権利の移転\nなど。\n⸻","blanks":["適切に事務を処理する義務","本人への通知","経過・結果の報告"],"options":[["適切に事務を処理する義務","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["本人への通知","お金を借りる","従業員を雇う","典型的には、"],["経過・結果の報告","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"6":{"text":"事務管理者が、\n本人のために必要な費用\nを支出した場合、一定の要件の下で本人に対して費用の償還を請求できる。\n例えば、\nAの家の水道管修理のためにBが10万円を支払った。\n↓\nBが自分のために使ったわけではない。\n↓\nAのために必要な費用だった。\n↓\n一定の要件の下でBはAに費用を請求できる。\n⸻","blanks":["事務管理者が、","本人のために必要な費用"],"options":[["事務管理者が、","結婚・離婚する","必ず絶対に従う","というケース。"],["本人のために必要な費用","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"7":{"text":"本人の生命・身体・財産などに急迫した危険がある場合には、\n通常の事務管理よりも管理者の責任を軽減する\nなど、一定の特別な扱いがある。\n例えば、\n交通事故で負傷した人を救助するため、緊急に必要な行為をした場合など。\n⸻","blanks":[],"options":[],"mode":"civil"},"8":{"text":"事務管理を一言でいうと、\n「頼まれていないけれど、他人のために事務を処理した場合の法律関係」\nである。\nポイントは、\n契約なし\n↓\n他人のために事務を処理\n↓\n法律上の一定の権利・義務が発生\nという構造。\n⸻","blanks":["契約なし","事務管理を一言でいうと、"],"options":[["契約なし","権利能力","買います","意思能力"],["事務管理を一言でいうと、","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"]],"mode":"civil"},"9":{"text":"1　意味\n不当利得とは、\n法律上の原因なく他人の財産・労務によって利益を受け、そのために他人に損失を及ぼした場合に、その利益を返還させる制度\nである。\n⸻","blanks":["不当利得"],"options":[["不当利得","権利能力","買います","意思能力"]],"mode":"civil"},"10":{"text":"AがBの銀行口座に、\n間違えて100万円を振り込んだ。\nBには、\n100万円を受け取る法律上の原因\nがない。\n↓\nB＝利益を得た。\nA＝損失を受けた。\n↓\n法律上の原因がない。\n↓\n不当利得が問題となる。\n⸻","blanks":["間違えて100万円を振り込んだ。","Bには、"],"options":[["間違えて100万円を振り込んだ。","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"],["Bには、","権利能力","買います","意思能力"]],"mode":"civil"},"11":{"text":"A\n↓ 100万円を誤振込\nB\nB\n↓\n100万円の利益\nA\n↓\n100万円の損失\n法律上の原因なし\n↓\n不当利得\n↓\n返還請求\n⸻","blanks":["100万円の利益","100万円の損失"],"options":[["100万円の利益","どのような意思で","変更・管理・保存","保険金が発生した"],["100万円の損失","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"12":{"text":"基本的には、\n① 利得\n相手方が利益を得た。\n② 損失\nこちらに損失が発生した。\n③ 因果関係\nその利得と損失に関連性がある。\n④ 法律上の原因がない\nその利益を保持する法律上の根拠がない。\nという点が問題となる。\n⸻","blanks":["① 利得","基本的には、"],"options":[["① 利得","権利能力","買います","意思能力"],["基本的には、","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"13":{"text":"ここが不当利得の核心。\n例えば、\nAがBに100万円を支払った。\nしかし、\n売買契約に基づく代金支払い\nだった。\n↓\n法律上の原因がある。\n↓\n原則として不当利得ではない。\n一方、\nAがBに間違えて100万円を振り込んだ。\n↓\n法律上の原因がない。\n↓\n不当利得が問題となる。\n⸻","blanks":["ここが不当利得の核心。","しかし、"],"options":[["ここが不当利得の核心。","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"],["しかし、","権利能力","買います","意思能力"]],"mode":"civil"},"14":{"text":"不当利得が成立すると、\n受益者は利益を返還する義務\nを負う。\nただし、受益者が善意か悪意かなどによって、返還範囲が異なる場合がある。\n⸻","blanks":["不当利得が成立すると、","受益者は利益を返還する義務"],"options":[["不当利得が成立すると、","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"],["受益者は利益を返還する義務","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"]],"mode":"civil"},"15":{"text":"不当利得は単純な二者関係だけとは限らない。\n例えば、\nA → B → C\nと財産が移転した場合、\n誰に対して返還請求できるのか\nが問題になる。\nしたがって、実際の事件では、\n•\t受益者\n•\t損失者\n•\t転得者\n•\t善意・悪意\nなどを確認する必要がある。\n⸻","blanks":["受益者","損失者","転得者","善意・悪意"],"options":[["受益者","取消し","不確実","所有権"],["損失者","取消し","不確実","所有権"],["転得者","取消し","不確実","所有権"],["善意・悪意","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"16":{"text":"不当利得には、一般的な不当利得だけでなく、特殊な問題もある。\n代表的には、\n•\t給付利得\n•\t侵害利得\n•\t支出利得\nなどの類型として整理される。\n基礎段階では、\n「法律上の原因がない利益をどう調整するか」\nという共通の考え方をまず理解する。\n⸻","blanks":["給付利得","侵害利得","支出利得"],"options":[["給付利得","権利能力","買います","意思能力"],["侵害利得","権利能力","買います","意思能力"],["支出利得","権利能力","買います","意思能力"]],"mode":"civil"},"17":{"text":"1　意味\n不法行為とは、\n他人の権利・利益を違法に侵害し、それによって損害を与えた場合に、損害賠償責任を発生させる制度\nである。\n例えば、\nAが不注意でBの車に衝突した。\n↓\nBの車が壊れる。\n↓\nBに損害。\n↓\nAの行為が不法行為となる可能性。\n⸻","blanks":["不法行為","Bの車が壊れる。"],"options":[["不法行為","権利能力","買います","意思能力"],["Bの車が壊れる。","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"18":{"text":"加害者\n↓\n一定の行為\n↓\n権利・利益の侵害\n↓\n違法性\n↓\n故意・過失\n↓\n損害\n↓\n因果関係\n↓\n損害賠償\nこれが不法行為法の基本的な思考順序。\n⸻","blanks":["不法行為法の基本的な思考順序","一定の行為"],"options":[["不法行為法の基本的な思考順序","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"],["一定の行為","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"19":{"text":"民法709条を中心に、基本的には次の要素を検討する。\n① 故意・過失\nわざと、または不注意があったか。\n② 権利・利益の侵害\n他人の権利・法律上保護される利益を侵害したか。\n③ 損害\n被害者に損害が発生したか。\n④ 因果関係\n行為と損害との間に因果関係があるか。\n⑤ 責任能力等\n行為者について責任を負わせるための能力などがあるか。\n⸻","blanks":["次の要素を検討する","① 故意・過失"],"options":[["次の要素を検討する","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["① 故意・過失","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"20":{"text":"1　意味\n結果が発生することを認識・認容して行為すること。\n例えば、\nAがBを殴る。\n↓\nBが負傷する可能性を認識しながら殴る。\n↓\n故意が問題となる。\n⸻","blanks":[],"options":[],"mode":"civil"},"21":{"text":"1　意味\n結果を予見でき、回避できたのに、\n必要な注意を怠った\n場合などに過失が問題となる。\n例えば、\nスマートフォンを見ながら運転する。\n↓\n前方への注意を怠る。\n↓\n人に衝突。\n↓\n過失が問題となる。\n⸻","blanks":["結果を予見でき、回避できたのに、","必要な注意を怠った"],"options":[["結果を予見でき、回避できたのに、","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"],["必要な注意を怠った","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"22":{"text":"過失では、\n「普通ならどの程度の注意を払うべきだったか」\nという観点が重要。\nつまり、\n具体的状況\n↓\n予見可能性\n↓\n結果回避可能性\n↓\n必要な注意を怠ったか\n↓\n過失\nという考え方につながる。\n⸻","blanks":["過失では、","という観点が重要。"],"options":[["過失では、","権利の主体","土地を買う","次の「物権"],["という観点が重要。","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"23":{"text":"不法行為は、\n「物を壊した」\n場合だけではない。\n例えば、\n•\t身体\n•\t生命\n•\t名誉\n•\tプライバシー\n•\t財産\n•\tその他法律上保護される利益\nなどが問題となる。\nしたがって、\n権利だけではなく、法律上保護される利益も重要\nである。\n⸻","blanks":["物を壊した","身体","生命","名誉"],"options":[["物を壊した","権利の主体","土地を買う","次の「物権"],["身体","民法","総則","胎児"],["生命","民法","総則","胎児"],["名誉","民法","総則","胎児"]],"mode":"civil"},"24":{"text":"行為によって利益が侵害されたからといって、\n必ず不法行為になる\nわけではない。\n例えば、\n正当防衛\n正当な権利行使\nなど、違法性が否定・阻却される場合がある。\nしたがって、\n侵害がある\n↓\n違法な侵害か？\nという検討が必要。\n⸻","blanks":["わけではない。","正当防衛"],"options":[["わけではない。","結婚・離婚する","必ず絶対に従う","というケース。"],["正当防衛","権利能力","買います","意思能力"]],"mode":"civil"},"25":{"text":"1　財産的損害\n金銭的に評価できる損害。\n例えば、\n•\t車の修理費\n•\t治療費\n•\t休業損害\n•\t逸失利益\nなど。\n⸻\n2　精神的損害\n精神的苦痛。\nこれについては、\n慰謝料\nによって賠償されることがある。\n⸻","blanks":["車の修理費","治療費","休業損害","逸失利益"],"options":[["車の修理費","権利の主体","土地を買う","次の「物権"],["治療費","取消し","不確実","所有権"],["休業損害","権利能力","買います","意思能力"],["逸失利益","権利能力","買います","意思能力"]],"mode":"civil"},"26":{"text":"不法行為では、\nその行為によって、その損害が発生したのか\nが重要。\n例えば、\nAがBに軽い接触事故を起こした。\nその後Bに極端に大きな損害が発生した。\n↓\nそのすべてをAの行為によるものとしてよいのか？\n↓\n因果関係を検討する。\n⸻","blanks":["不法行為では、","が重要。"],"options":[["不法行為では、","結婚・離婚する","必ず絶対に従う","というケース。"],["が重要。","権利能力","買います","意思能力"]],"mode":"civil"},"27":{"text":"被害者側にも過失がある場合、\n損害賠償額を減額する\nことがある。\n例えば、\nAがBに衝突した。\nしかしBも危険な行動をしていた。\n↓\nB側の過失も考慮。\n↓\n賠償額を調整。\n⸻","blanks":["損害賠償額を減額する","ことがある。"],"options":[["損害賠償額を減額する","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["ことがある。","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"28":{"text":"損害賠償を計算するとき、\n同じ原因によって被害者が得た利益\nを考慮する場合がある。\nつまり、\n損害\n－\n一定の利益\n↓\n実際に賠償すべき額\nという調整が問題となる。\n⸻","blanks":["損害賠償を計算するとき、","同じ原因によって被害者が得た利益"],"options":[["損害賠償を計算するとき、","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["同じ原因によって被害者が得た利益","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"]],"mode":"civil"},"29":{"text":"不法行為では、\n「発生した損害なら全部賠償」\nというわけではない。\n行為と損害との因果関係などを考慮して、\nどこまでを賠償させるべきか\nを判断する。\n⸻","blanks":["発生した損害なら全部賠償","不法行為では、"],"options":[["発生した損害なら全部賠償","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["不法行為では、","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"30":{"text":"生命・身体を侵害する不法行為では、\n•\t治療費\n•\t入院費\n•\t通院費\n•\t休業損害\n•\t逸失利益\n•\t慰謝料\nなど、様々な損害が問題となる。\n⸻","blanks":["治療費","入院費","通院費","休業損害"],"options":[["治療費","取消し","不確実","所有権"],["入院費","取消し","不確実","所有権"],["通院費","取消し","不確実","所有権"],["休業損害","権利能力","買います","意思能力"]],"mode":"civil"},"31":{"text":"人が死亡した場合には、\n誰が損害賠償を請求できるのか\nという問題が生じる。\nまた、\n•\t葬儀費用\n•\t逸失利益\n•\t慰謝料\nなどが問題となる。\n⸻","blanks":["葬儀費用","逸失利益","慰謝料"],"options":[["葬儀費用","権利能力","買います","意思能力"],["逸失利益","権利能力","買います","意思能力"],["慰謝料","取消し","不確実","所有権"]],"mode":"civil"},"32":{"text":"未成年者であっても、\n責任能力\nが認められる場合には、不法行為責任を負う可能性がある。\n一方、責任能力を欠く場合には本人の責任が否定されることがあり、\n監督義務者の責任\nが問題となる。\n⸻","blanks":["未成年者であっても、","責任能力"],"options":[["未成年者であっても、","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["責任能力","権利能力","買います","意思能力"]],"mode":"civil"},"33":{"text":"責任能力を欠く者が他人に損害を与えた場合、\nその者を監督する義務を負う者\nについて責任が問題となる。\n典型的には、\n未成年者と親\nなどが想定される。\nただし、\n「親なら必ず責任を負う」\nという単純な制度ではない。\n法律上の要件を検討する必要がある。\n⸻","blanks":["親なら必ず責任を負う","その者を監督する義務を負う者"],"options":[["親なら必ず責任を負う","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["その者を監督する義務を負う者","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"]],"mode":"civil"},"34":{"text":"1　意味\n従業員が仕事中に他人へ損害を与えた場合、\n使用者についても損害賠償責任が問題となる\nことがある。\n例えば、\n会社員Aが業務中に自動車事故を起こした。\n↓\nAの不法行為責任。\nさらに、\n↓\n会社Bの使用者責任。\n⸻","blanks":["ことがある。","Aの不法行為責任。"],"options":[["ことがある。","お金を借りる","従業員を雇う","典型的には、"],["Aの不法行為責任。","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"35":{"text":"会社\n↓\n従業員を使用\n↓\n従業員A\n↓\n業務中に不法行為\n↓\n被害者B\n↓\nAの責任\n＋\n一定の要件の下で\n↓\n会社の使用者責任\n⸻","blanks":["従業員を使用","従業員A"],"options":[["従業員を使用","お金を借りる","従業員を雇う","典型的には、"],["従業員A","権利能力","買います","意思能力"]],"mode":"civil"},"36":{"text":"使用者責任には、\n被害者救済\nという重要な意味がある。\n従業員本人だけでは損害を十分に賠償できない場合でも、\n事業活動によって利益を得る使用者\nに責任を負わせることで、被害者の救済を図る。\n⸻","blanks":["使用者責任には、","被害者救済"],"options":[["使用者責任には、","どのような意思で","変更・管理・保存","保険金が発生した"],["被害者救済","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"37":{"text":"建物やその他の工作物に設置・保存上の問題があり、\n他人に損害を与えた\n場合には、\n土地工作物責任\nが問題となる。\n例えば、\n建物の外壁が落下。\n↓\n通行人が負傷。\n↓\n工作物の設置・保存に瑕疵がないか。\n⸻","blanks":["他人に損害を与えた","土地工作物責任"],"options":[["他人に損害を与えた","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["土地工作物責任","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"38":{"text":"飼っている犬が他人を噛んだ。\n↓\n犬の占有者について、\n動物の種類・性質に応じた相当の注意をしたか\nなどが問題となる。\n⸻","blanks":["飼っている犬が他人を噛んだ。","犬の占有者について、"],"options":[["飼っている犬が他人を噛んだ。","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"],["犬の占有者について、","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"39":{"text":"複数人が共同して他人に損害を与える場合がある。\n例えば、\nAとBが共同してCの車を破壊した。\n↓\n共同不法行為。\n被害者保護の観点から、\n複数の加害者に対して責任を追及できる\n仕組みが設けられている。\n⸻","blanks":["共同不法行為。","被害者保護の観点から、"],"options":[["共同不法行為。","結婚・離婚する","必ず絶対に従う","というケース。"],["被害者保護の観点から、","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"40":{"text":"A ──┐\n│\n├→ Cに損害\n│\nB ──┘\nA・B\n↓\n共同不法行為\n↓\nCが損害賠償請求\n⸻","blanks":["A ──┐","B ──┘"],"options":[["A ──┐","権利の主体","土地を買う","次の「物権"],["B ──┘","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"41":{"text":"不法行為には、一般原則以外にも、\n•\t責任無能力者\n•\t監督義務者\n•\t使用者\n•\t工作物\n•\t動物\n•\t共同不法行為\n•\t自動車事故\n•\t医療事故\n•\t製造物責任\nなど、様々な特殊問題がある。\n基礎段階では、\n一般不法行為を基本にして、特殊類型がその修正版・具体化として存在する\nと理解すると整理しやすい。\n⸻","blanks":["責任無能力者","監督義務者","使用者","工作物"],"options":[["責任無能力者","お金を借りる","従業員を雇う","典型的には、"],["監督義務者","権利の主体","土地を買う","次の「物権"],["使用者","取消し","不確実","所有権"],["工作物","取消し","不確実","所有権"]],"mode":"civil"},"42":{"text":"ここは非常に重要。\n同じ「損害賠償」でも、\n契約関係があるのか\nによって根拠が変わる。\n⸻\n債務不履行\nAとBの間に契約がある。\n↓\nBが契約上の義務を履行しない。\n↓\n債務不履行責任。\n⸻\n不法行為\nAとBの間に契約がなくても、\n↓\nAがBの権利・利益を違法に侵害。\n↓\n不法行為責任。\n⸻","blanks":["損害賠償","ここは非常に重要。"],"options":[["損害賠償","権利能力","買います","意思能力"],["ここは非常に重要。","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"43":{"text":"債務不履行\t不法行為\n前提\t債務が存在\t必ずしも契約不要\n原因\t債務を履行しない\t権利・利益を侵害\n典型\t売買代金・契約不履行\t交通事故\n根拠\t債権関係\t法律上の一般義務\n損害賠償\tあり\tあり\n⸻","blanks":["債務不履行\t不法行為","根拠\t債権関係\t法律上の一般義務"],"options":[["債務不履行\t不法行為","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["根拠\t債権関係\t法律上の一般義務","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"]],"mode":"civil"},"44":{"text":"一つの事件で、\n債務不履行\nと\n不法行為\nの両方が問題になる場合がある。\n例えば、\n医師と患者など一定の契約関係にある者について、\n契約上の義務違反\n＋\n生命・身体への侵害\nが問題となる場合。\nこのような場合には、\nどの法的構成を採るか\nを検討する。\n⸻","blanks":["一つの事件で、","債務不履行"],"options":[["一つの事件で、","結婚・離婚する","必ず絶対に従う","というケース。"],["債務不履行","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"45":{"text":"不法行為が成立しても、\n当然に全額の損害賠償となる\nとは限らない。\n例えば、\n•\t正当防衛\n•\t緊急避難\n•\t被害者側の過失\n•\t損益相殺\n•\t責任能力\n•\t因果関係\nなどを検討する。\n⸻","blanks":["正当防衛","緊急避難","被害者側の過失","損益相殺"],"options":[["正当防衛","権利能力","買います","意思能力"],["緊急避難","権利能力","買います","意思能力"],["被害者側の過失","結婚・離婚する","必ず絶対に従う","というケース。"],["損益相殺","権利能力","買います","意思能力"]],"mode":"civil"},"46":{"text":"不法行為による損害賠償請求権にも、\n消滅時効\nがある。\n現在の民法では、人の生命・身体を害する不法行為について特別の期間が設けられるなど、一般の不法行為とは異なる扱いがある。\nしたがって、\n「不法行為は全部同じ時効」\nとは考えない。\n⸻","blanks":["不法行為は全部同じ時効","消滅時効"],"options":[["不法行為は全部同じ時効","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"],["消滅時効","権利能力","買います","意思能力"]],"mode":"civil"},"47":{"text":"制度\t基本構造\t典型例\n事務管理\t頼まれていない他人の事務を処理\t留守中の水漏れ修理\n不当利得\t法律上の原因なく利益を得る\t誤振込\n不法行為\t違法に他人の権利・利益を侵害\t交通事故\n⸻","blanks":["制度\t基本構造\t典型例"],"options":[["制度\t基本構造\t典型例","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"48":{"text":"契約なし\n│\n├─────────────┐\n│             │\n他人のため       他人との財産関係\nに行動           に問題\n│             │\n事務管理       不当利得\n│\n│\n他人の権利・利益を\n違法に侵害\n│\n不法行為\nただし、\n「契約がない＝必ずこの3つ」\nではない。\n具体的な事実から法律関係を判断する。\n⸻","blanks":["契約がない","必ずこの3つ"],"options":[["契約がない","権利の主体","土地を買う","次の「物権"],["必ずこの3つ","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"49":{"text":"不法行為の事例では、次の順番で考える。\n① 誰が行為をしたか\n加害者は誰か。\n② 何をしたか\n作為？\n不作為？\n事故？\n契約違反？\n③ 誰の何を侵害したか\n身体？\n生命？\n財産？\n名誉？\nプライバシー？\n④ 故意・過失があるか\nわざとか。\n不注意か。\n⑤ 違法性があるか\n正当防衛などではないか。\n⑥ 損害は何か\n財産的損害？\n精神的損害？\n⑦ 因果関係があるか\nその行為によって発生した損害なのか。\n⑧ 減額要素があるか\n被害者側の過失など。\n⑨ 特殊な責任がないか\n使用者？\n監督義務者？\n工作物？\n動物？\n共同不法行為？\n⸻","blanks":["① 誰が行為をしたか","加害者は誰か。"],"options":[["① 誰が行為をしたか","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["加害者は誰か。","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"50":{"text":"Aが自動車を運転中、\nスマートフォンを操作していた。\n↓\n前方のBに衝突。\n↓\nBが負傷。\n⸻\nSTEP 1\nAの行為\n↓\n運転中のスマートフォン操作。\nSTEP 2\nBの身体を侵害。\nSTEP 3\nAに過失。\nSTEP 4\nBに損害。\n•\t治療費\n•\t休業損害\n•\t慰謝料\n•\t逸失利益など\nSTEP 5\nAの行為とBの損害に因果関係。\n↓\n不法行為責任\nが問題となる。\n⸻","blanks":["治療費","休業損害","慰謝料"],"options":[["治療費","取消し","不確実","所有権"],["休業損害","権利能力","買います","意思能力"],["慰謝料","取消し","不確実","所有権"]],"mode":"civil"},"51":{"text":"AがBに100万円を振り込む。\nしかし、\n振込先を間違えていた。\nBはAから100万円を受け取る法律上の原因がない。\n↓\nBに利益。\nAに損失。\n法律上の原因なし。\n↓\n不当利得返還請求\nが問題となる。\n⸻","blanks":["しかし、","振込先を間違えていた。"],"options":[["しかし、","権利能力","買います","意思能力"],["振込先を間違えていた。","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"52":{"text":"Aが旅行中。\n↓\nA宅で水道管が破裂。\n↓\n近所のBが緊急で修理業者を手配。\n↓\nBが10万円を立替えた。\nBはAから依頼されていない。\nしかし、\nAの財産を守るために事務を処理した。\n↓\n事務管理\nが問題となる。\n↓\n一定の要件の下で費用償還請求が問題となる。\n⸻","blanks":["A宅で水道管が破裂。","近所のBが緊急で修理業者を手配。"],"options":[["A宅で水道管が破裂。","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["近所のBが緊急で修理業者を手配。","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"]],"mode":"civil"},"53":{"text":"第3編で学んだ債務不履行と、第5編の不法行為をまとめる。\n損害発生\n↓\nなぜ損害が発生した？\n│\n├── 契約上の義務違反\n│       ↓\n│    債務不履行\n│\n└── 権利・利益の侵害\n↓\n不法行為\nつまり、\n損害が発生したら、まず「どの法律関係から責任が生じるのか」を考える。\n⸻","blanks":["どの法律関係から責任が生じるのか","損害発生"],"options":[["どの法律関係から責任が生じるのか","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"],["損害発生","権利能力","買います","意思能力"]],"mode":"civil"},"54":{"text":"項目\t債務不履行\t不法行為\n契約\t原則あり\t不要\n義務\t契約等による債務\t一般的な法的義務\n典型\t商品を届けない\t交通事故\n損害賠償\t○\t○\n解除\t契約なら問題になる\t原則として解除ではない\n過失相殺\t問題になる\t問題になる\n時効\t債権の種類による\t不法行為の特則あり\n⸻","blanks":["項目\t債務不履行\t不法行為","契約\t原則あり\t不要"],"options":[["項目\t債務不履行\t不法行為","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["契約\t原則あり\t不要","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"55":{"text":"第5編を一言でまとめると、\n「契約がない場合でも、法律が一定の理由から人と人との間に債権・債務を発生させる仕組み」\nを学ぶ編である。\n⸻\n事務管理\n頼まれていないが、他人のために事務を処理した。\n↓\n一定の法律関係が発生。\n⸻\n不当利得\n法律上の原因なく利益を得た。\n↓\n返還する。\n⸻\n不法行為\n違法に他人の権利・利益を侵害した。\n↓\n損害を賠償する。\n⸻","blanks":["第5編を一言でまとめると、","事務管理"],"options":[["第5編を一言でまとめると、","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["事務管理","権利能力","買います","意思能力"]],"mode":"civil"},"56":{"text":"事務管理\n1.\t事務管理とは何か。\n2.\tなぜ契約がないのに法律関係が発生するのか。\n3.\t事務管理の成立要件を説明できるか。\n4.\t管理者にはどのような義務があるか。\n5.\t費用償還請求とは何か。\n6.\t緊急事務管理とは何か。\n不当利得\n7.\t不当利得とは何か。\n8.\t利得・損失・因果関係・法律上の原因とは何か。\n9.\t誤振込がなぜ不当利得になるのか。\n10.\t「法律上の原因」がなぜ重要なのか。\n11.\t不当利得返還義務とは何か。\n不法行為\n12.\t不法行為とは何か。\n13.\t故意と過失の違いは何か。\n14.\t権利・利益の侵害とは何か。\n15.\t違法性とは何か。\n16.\t損害とは何か。\n17.\t因果関係とは何か。\n18.\t過失相殺とは何か。\n19.\t損益相殺とは何か。\n20.\t使用者責任とは何か。\n21.\t監督義務者責任とは何か。\n22.\t工作物責任とは何か。\n23.\t動物占有者責任とは何か。\n24.\t共同不法行為とは何か。\n総合\n25.\t債務不履行と不法行為の違いは何か。\n26.\t契約がない場合、どのような債権発生原因があるか。\n27.\t事務管理・不当利得・不法行為を区別できるか。\n28.\t一つの事件で複数の責任原因が問題になることを説明できるか。\n⸻","blanks":["法律上の原因","事務管理"],"options":[["法律上の原因","お金を借りる","従業員を雇う","典型的には、"],["事務管理","権利能力","買います","意思能力"]],"mode":"civil"},"57":{"text":"ここまでの民法を一つにつなげる。\n民法\n│\n┌──────────┴──────────┐\n│                     │\n総則                   財産法\n│                     │\n人・意思・法律行為          │\n│                     │\n├────────┬────────┤\n│        │        │\n物権     債権      契約\n│        │        │\n第2編     第3編     第4編\n│\n┌───────┴───────┐\n│               │\n契約          契約以外\n│               │\n│       ┌───────┼───────┐\n│       │       │       │\n│      事務    不当    不法\n│      管理    利得    行為\n│       └───────┴───────┘\n│\n└──────────┐\n│\n第5編\n⸻","blanks":["ここまでの民法を一つにつなげる。","契約          契約以外"],"options":[["ここまでの民法を一つにつなげる。","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"],["契約          契約以外","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"]],"mode":"civil"},"58":{"text":"債権が発生する原因を整理すると、\n債権\n│\n┌──────────┼──────────┐\n│          │          │\n契約       法律       その他\n│          │\n│     ┌────┴────┐\n│     │         │\n│   事務管理   不当利得\n│\n└──────────────┐\n│\n不法行為\nこの4つは、民法を理解するうえで非常に重要。\n⸻","blanks":["不法行為"],"options":[["不法行為","権利能力","買います","意思能力"]],"mode":"civil"},"59":{"text":"人が他人にお金を払わなければならない理由は、一つではない。\n契約したから\n↓\n契約上の債務。\n他人のために費用を支出したから\n↓\n事務管理。\n法律上の原因なく利益を得たから\n↓\n不当利得。\n他人に損害を与えたから\n↓\n不法行為。\nこの違いを理解すると、\n「お金を払え」という請求の法律上の根拠\nを見つけやすくなる。\n⸻","blanks":["お金を払え","契約したから"],"options":[["お金を払え","権利の主体","土地を買う","次の「物権"],["契約したから","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"60":{"text":"事実から法律構成へ\n誰かにお金を請求したい\n↓\nなぜ請求できる？\n↓\n契約がある？\n│\n┌─┴─────────────┐\n│                   │\nYES                  NO\n│                   │\n債務不履行？       事務管理？\n契約内容は？       不当利得？\n不履行は？         不法行為？\n│                   │\n└─────────┬─────────┘\n↓\n法的根拠\n↓\n請求内容\n↓\n損害・返還\n↓\n時効・抗弁\n⸻\n第5編終了時点での到達目標\n第5編では、\n「誰かが損害を受けた・利益を得た」という事実だけを見るのではなく、その法律上の原因を特定する\nことが重要。\n例えば、\n交通事故\n→ 不法行為\n誤振込\n→ 不当利得\n頼まれていない他人の家の修理\n→ 事務管理\n契約した商品が届かない\n→ 債務不履行\nというように、\n事実\n↓\n法律関係\n↓\n債権発生原因\n↓\n請求権\nへ変換できるようになることを目標とする。\nこれができるようになると、第1編～第5編が一つの体系としてつながる。","blanks":["誰かが損害を受けた・利益を得た","事実から法律構成へ"],"options":[["誰かが損害を受けた・利益を得た","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"],["事実から法律構成へ","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"}},"6":{"1":{"text":"民法は大きく、\n•\t財産関係\n•\t身分関係\nを規律している。\nこれまで学んできた、\n•\t物権\n•\t債権\n•\t契約\n•\t不法行為\nなどは主として財産関係を扱う。\nこれに対して親族法は、\n人と人との身分的な関係\nを扱う。\n例えば、\n•\t結婚\n•\t離婚\n•\t親子\n•\t養子\n•\t親権\n•\t扶養\nなどである。\n⸻","blanks":["財産関係","身分関係","物権","債権"],"options":[["財産関係","権利能力","買います","意思能力"],["身分関係","権利能力","買います","意思能力"],["物権","民法","総則","胎児"],["債権","民法","総則","胎児"]],"mode":"civil"},"2":{"text":"民法上の親族には、一定の範囲がある。\n基本的には、\n① 六親等内の血族\n血のつながりによる親族。\n② 配偶者\n夫・妻。\n③ 三親等内の姻族\n婚姻によって生じる一定の親族関係。\n⸻\n親族関係のイメージ\n祖父母\n│\n父・母\n│\n本人 ─── 配偶者\n│\n兄弟姉妹\n│\n甥・姪\n親族法では、\n「この人とこの人との間に法律上どのような身分関係があるのか」\nを最初に確認する。\n⸻","blanks":["① 六親等内の血族","基本的には、"],"options":[["① 六親等内の血族","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["基本的には、","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"3":{"text":"親族関係は私人間の関係ではあるが、\n財産契約とまったく同じように自由に決められるわけではない。\n婚姻・離婚・親子などについては、\n身分関係の安定・本人の尊重・子の利益\nなどが重要となる。\n⸻","blanks":[],"options":[],"mode":"civil"},"4":{"text":"婚姻とは、\n法律上の夫婦関係を成立させる身分行為\nである。\n日本の民法では、\n婚姻届を提出し、一定の要件を満たすこと\nによって法律上の婚姻が成立する。\n⸻","blanks":["婚姻","日本の民法では、"],"options":[["婚姻","民法","総則","胎児"],["日本の民法では、","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"5":{"text":"婚姻には、\n•\t婚姻意思\n•\t婚姻障害がないこと\n•\t婚姻届\nなどの要件がある。\n現在の民法では成年年齢が18歳であることにも注意する。\n⸻","blanks":["婚姻意思","婚姻障害がないこと","婚姻届"],"options":[["婚姻意思","権利能力","買います","意思能力"],["婚姻障害がないこと","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["婚姻届","取消し","不確実","所有権"]],"mode":"civil"},"6":{"text":"婚姻には一定の制限がある。\n代表的には、\n•\t近親者間の婚姻禁止\n•\t重婚の禁止\n•\t女性の再婚禁止期間に関する制度変更後のルール\n•\t一定の親族関係にある者同士の婚姻制限\nなど。\nしたがって、\n「男女が合意すれば誰とでも自由に婚姻できる」\nわけではない。\n⸻","blanks":["近親者間の婚姻禁止","重婚の禁止"],"options":[["近親者間の婚姻禁止","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["重婚の禁止","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"7":{"text":"婚姻についても、\n無効\nと\n取消し\nを区別する必要がある。\n第1編で学んだ法律行為の無効・取消しと同様、\n「最初から婚姻の効力がないのか」\n「一定の手続によって婚姻を取り消すのか」\nを区別する。\n⸻","blanks":["最初から婚姻の効力がないのか","一定の手続によって婚姻を取り消すのか"],"options":[["最初から婚姻の効力がないのか","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"],["一定の手続によって婚姻を取り消すのか","私の代理人としてCから車を買ってきて","この問題は物権のどの部分の問題なのか","売買で債務不履行が起きたらどうなる？"]],"mode":"civil"},"8":{"text":"婚姻すると、\n単なる恋人関係とは異なる法律上の身分関係\nが発生する。\n代表的には、\n•\t同居・協力・扶助\n•\t貞操に関する義務\n•\t夫婦間の財産関係\n•\t氏\n•\t婚姻費用\nなどが問題となる。\n⸻","blanks":["同居・協力・扶助","貞操に関する義務","夫婦間の財産関係","婚姻費用"],"options":[["同居・協力・扶助","どのような意思で","変更・管理・保存","保険金が発生した"],["貞操に関する義務","どのような意思で","変更・管理・保存","保険金が発生した"],["夫婦間の財産関係","どのような意思で","変更・管理・保存","保険金が発生した"],["婚姻費用","権利能力","買います","意思能力"]],"mode":"civil"},"9":{"text":"夫婦は、\n同居し、互いに協力し扶助する義務\nを負う。\nこれは単なる道徳的な約束ではなく、\n民法上の法律関係\nである。\n⸻","blanks":["夫婦は、","同居し、互いに協力し扶助する義務"],"options":[["夫婦は、","権利能力","買います","意思能力"],["同居し、互いに協力し扶助する義務","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"]],"mode":"civil"},"10":{"text":"夫婦には、\n資産・収入その他一切の事情を考慮して、婚姻から生ずる費用を分担する義務\nがある。\n例えば、\n•\t生活費\n•\t子どもの生活費\n•\t教育費\nなど。\n⸻","blanks":["生活費","子どもの生活費","教育費"],"options":[["生活費","取消し","不確実","所有権"],["子どもの生活費","結婚・離婚する","必ず絶対に従う","というケース。"],["教育費","取消し","不確実","所有権"]],"mode":"civil"},"11":{"text":"婚姻すると、\n「夫婦の財産は全部共有になる」\nというわけではない。\n原則として、夫婦それぞれの財産は区別される。\n⸻\n基本構造\n夫の財産\n↓\n原則として夫の財産\n妻の財産\n↓\n原則として妻の財産\nただし、夫婦の財産関係には法律上のルールがある。\n⸻","blanks":["婚姻すると、","というわけではない。"],"options":[["婚姻すると、","お金を借りる","従業員を雇う","典型的には、"],["というわけではない。","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"12":{"text":"夫婦は、\n婚姻前・婚姻中の財産関係\nについて、法律上一定のルールに従う。\nまた、夫婦財産契約を締結することによって、\n法定財産制とは異なる財産関係\nを定めることもできる。\nただし、第三者との関係では一定の方式・対抗要件が問題となる。\n⸻","blanks":["夫婦は、","婚姻前・婚姻中の財産関係"],"options":[["夫婦は、","権利能力","買います","意思能力"],["婚姻前・婚姻中の財産関係","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"]],"mode":"civil"},"13":{"text":"夫婦の一方が、\n日常の家庭生活に必要な取引\nをした場合には、一定の範囲で他方も責任を負うことがある。\n例えば、\n•\t日用品の購入\n•\t家庭生活に必要な契約\nなど。\n⸻","blanks":["日用品の購入","家庭生活に必要な契約"],"options":[["日用品の購入","お金を借りる","従業員を雇う","典型的には、"],["家庭生活に必要な契約","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"14":{"text":"夫婦間でも契約を締結することはできる。\nしかし、夫婦関係の特殊性を考慮して、\n婚姻中に締結した契約について特別な扱い\nが問題となる場合
