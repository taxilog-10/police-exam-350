かりやすい。","blanks":["商人","営業","商取引"],"options":[["商人","他人","代理","会社"],["営業","他人","代理","会社"],["商取引","事務所","債権者","商慣習"]],"explanations":["本文：商人・企業・商取引を規律する私法","本文：民法が私人間の法律関係を一般的に規律するのに対し、商法は特に「営業」「商人」「商取引」など、企業活動に関する法律関係を規律する。","本文：商人・企業・商取引を規律する私法"],"mode":"commercial"},"2":{"text":"商法が企業活動について特別なルールを設けるのは、企業取引には一般的な私人間取引とは異なる特徴があるからである。\n商法の主要な目的\n① 取引の安全 ② 取引の迅速 ③ 企業活動の円滑化 ④ 取引関係者の利益調整\n特に重要なのが、\n取引安全と取引迅速\nである。\n企業は大量・反復的に取引を行う。\nそのため、一つ一つの取引について民法上の一般原則だけを厳格に適用すると、取引が遅くなり、企業活動が停滞する場合がある。\nそこで商法では、企業取引に適した特別なルールを設けている。","blanks":["商法","取引安全","利益"],"options":[["商法","他人","代理","会社"],["取引安全","バランス","事業目的","商業帳簿"],["利益","他人","代理","会社"]],"explanations":["本文：商法が企業活動について特別なルールを設けるのは、企業取引には一般的な私人間取引とは異なる特徴があるからである。","本文：取引安全と取引迅速","本文：① 取引の安全 ② 取引の迅速 ③ 企業活動の円滑化 ④ 取引関係者の利益調整"],"mode":"commercial"},"3":{"text":"民法と商法は対立する法律ではない。\n民法は私法の一般法であり、商法は商取引についての特別法として機能する。\n基本構造\n民法 ↓ 一般的な私人間の法律関係\n商法 ↓ 商人・商取引についての特別ルール\nしたがって、\n商法に特別な規定がなければ、民法の一般原則が問題となる。\n例\nA商店がBから商品を購入した。\nこれは売買契約なので、まず民法上の売買が基本になる。\nしかし、商人間の売買について商法に特別なルールがあれば、その特別ルールが優先して問題となる。","blanks":["商法","売買","商人"],"options":[["商法","他人","代理","会社"],["売買","他人","代理","会社"],["商人","他人","代理","会社"]],"explanations":["本文：民法と商法は対立する法律ではない。","本文：これは売買契約なので、まず民法上の売買が基本になる。","本文：商法 ↓ 商人・商取引についての特別ルール"],"mode":"commercial"},"4":{"text":"商法を学ぶ際には、どのような法規範が商法上のルールになるのかを理解する必要がある。\n主なものは、\n① 商法その他の法律 ② 商慣習 ③ 民法などの一般法\nである。\n特に商取引では、長年の取引慣行が重要な意味を持つ場合がある。\nただし、\n商慣習だから何でも法律になる\nわけではない。\n法律との関係を考えながら適用する必要がある。","blanks":["商法","民法などの一般法","法律"],"options":[["商法","他人","代理","会社"],["民法などの一般法","いくら売れたか","それを業として行う","元Aラーメン店"],["法律","他人","代理","会社"]],"explanations":["本文：商法を学ぶ際には、どのような法規範が商法上のルールになるのかを理解する必要がある。","本文：① 商法その他の法律 ② 商慣習 ③ 民法などの一般法","本文：① 商法その他の法律 ② 商慣習 ③ 民法などの一般法"],"mode":"commercial"},"5":{"text":"商法総論で最も重要な概念の一つが「商人」である。\n基本的には、\n自己の名をもって商行為をすることを業とする者\nを商人という。\nここでは3つのポイントを押さえる。\n① 自己の名をもって ② 商行為をする ③ それを業として行う\nイメージ\n自己の名 ↓ 商行為 ↓ 継続・反復して事業として行う ↓ 商人","blanks":["商行為","商人","商法"],"options":[["商行為","事務所","債権者","商取引"],["商人","他人","代理","会社"],["商法","他人","代理","会社"]],"explanations":["本文：自己の名をもって商行為をすることを業とする者","本文：商法総論で最も重要な概念の一つが「商人」である。","本文：商法総論で最も重要な概念の一つが「商人」である。"],"mode":"commercial"},"6":{"text":"「自己の名」とは、\n法律上、自分自身が権利義務の主体となる立場で取引する\nという意味である。\n例えばAが自分の店を経営し、商品を販売している場合、\nA ↓ 自分の名前で契約 ↓ 売買契約の当事者 ↓ A自身が権利・義務を負う\nという構造になる。\n単に他人のために事務を処理しているだけなら、「自己の名」で商行為をしているとは限らない。","blanks":["契約","商行為","売買"],"options":[["契約","他人","代理","会社"],["商行為","事務所","債権者","商取引"],["売買","他人","代理","会社"]],"explanations":["本文：A ↓ 自分の名前で契約 ↓ 売買契約の当事者 ↓ A自身が権利・義務を負う","本文：単に他人のために事務を処理しているだけなら、「自己の名」で商行為をしているとは限らない。","本文：A ↓ 自分の名前で契約 ↓ 売買契約の当事者 ↓ A自身が権利・義務を負う"],"mode":"commercial"},"7":{"text":"商法上の「業」とは、一般的には、\n営利目的で、一定の事業を継続・反復して行うこと\nというイメージで理解するとよい。\n例えば、\n自宅の家具を一度だけ売った ↓ 通常、営業とはいえない。\n商品を仕入れて繰り返し販売する ↓ 事業として行っている ↓ 営業\nとなる。\n重要\n「一回だけ行ったか」「継続的・反復的に行っているか」は、商人性を考えるうえで重要なポイントとなる。","blanks":["営業","商法","商人"],"options":[["営業","他人","代理","会社"],["商法","他人","代理","会社"],["商人","他人","代理","会社"]],"explanations":["本文：自宅の家具を一度だけ売った ↓ 通常、営業とはいえない。","本文：商法上の「業」とは、一般的には、","本文：「一回だけ行ったか」「継続的・反復的に行っているか」は、商人性を考えるうえで重要なポイントとなる。"],"mode":"commercial"},"8":{"text":"商人には大きく、\n① 固有の商人 ② 擬制商人\nという区別がある。\n固有の商人\n自己の名をもって商行為を業として行う者。\n擬制商人\n商行為を業として行う者ではなくても、一定の営業を行う者について、商法上商人として扱うもの。\nこれは、\n実質的に企業活動を行っている者について、取引上の必要性から商人として扱う\nという考え方である。","blanks":["商人","商行為","商法"],"options":[["商人","他人","代理","会社"],["商行為","事務所","債権者","商取引"],["商法","他人","代理","会社"]],"explanations":["本文：商人には大きく、","本文：自己の名をもって商行為を業として行う者。","本文：商行為を業として行う者ではなくても、一定の営業を行う者について、商法上商人として扱うもの。"],"mode":"commercial"},"9":{"text":"商行為とは、\n商法が商取引として認める行為\nである。\n代表的なものとして、\n・売買 ・運送 ・倉庫 ・仲立 ・問屋 ・商事寄託\nなどがある。\n商人が行う活動を理解するには、\n「誰が行うのか」 ↓ 商人\n「何を行うのか」 ↓ 商行為\nと整理するとよい。","blanks":["商行為","商人","商法"],"options":[["商行為","事務所","債権者","商取引"],["商人","他人","代理","会社"],["商法","他人","代理","会社"]],"explanations":["本文：商行為とは、","本文：商人が行う活動を理解するには、","本文：商法が商取引として認める行為"],"mode":"commercial"},"10":{"text":"商行為は大きく、\n① 絶対的商行為 ② 営業的商行為 ③ 付属的商行為\nに分けて理解する。\n絶対的商行為\n行為の性質そのものから商行為となるもの。\n営業的商行為\n営業として行うことによって商行為となるもの。\n付属的商行為\n商人が営業のために行う行為。","blanks":["商行為","営業","商人"],"options":[["商行為","事務所","債権者","商取引"],["営業","他人","代理","会社"],["商人","他人","代理","会社"]],"explanations":["本文：商行為は大きく、","本文：① 絶対的商行為 ② 営業的商行為 ③ 付属的商行為","本文：商人が営業のために行う行為。"],"mode":"commercial"},"11":{"text":"絶対的商行為は、\n行為そのものの性質によって商行為となるもの\nである。\nしたがって、\n「その人が商人かどうか」\nとは別に、行為自体の性質が重要となる。\nポイント\n行為の性質 ↓ 商行為\nという構造。","blanks":["商行為","商人","性質"],"options":[["商行為","事務所","債権者","商取引"],["商人","他人","代理","会社"],["性質","他人","代理","会社"]],"explanations":["本文：絶対的商行為は、","本文：「その人が商人かどうか」","本文：行為そのものの性質によって商行為となるもの"],"mode":"commercial"},"12":{"text":"営業的商行為は、\n営業として行うことによって商行為となるもの\nである。\n代表的な企業活動として、\n・運送業 ・倉庫業 ・仲立業 ・問屋業\nなどがある。\n絶対的商行為との違い\n絶対的商行為 ↓ 行為そのものが基準\n営業的商行為 ↓ 営業として行っていることが基準","blanks":["商行為","営業","問屋"],"options":[["商行為","事務所","債権者","商取引"],["営業","他人","代理","会社"],["問屋","他人","代理","会社"]],"explanations":["本文：営業的商行為は、","本文：営業的商行為は、","本文：・運送業 ・倉庫業 ・仲立業 ・問屋業"],"mode":"commercial"},"13":{"text":"商人が営業のために行う行為を、付属的商行為という。\n例えば飲食店が、\n・食材を仕入れる ・厨房設備を購入する ・営業用の車両を購入する ・店舗を借りる\nなどの行為をする場合である。\nこれらは飲食物の販売そのものではない。\nしかし、\n営業のために行われている\nため、商法上重要になる。\nイメージ\n営業 ↓ その営業を維持するための行為 ↓ 付属的商行為","blanks":["営業","商行為","商法"],"options":[["営業","他人","代理","会社"],["商行為","事務所","債権者","商取引"],["商法","他人","代理","会社"]],"explanations":["本文：商人が営業のために行う行為を、付属的商行為という。","本文：商人が営業のために行う行為を、付属的商行為という。","本文：ため、商法上重要になる。"],"mode":"commercial"},"14":{"text":"ここまでを整理すると、\n商行為 ↓ 商人性との関係 ↓ 営業 ↓ 営業のための行為 ↓ 付属的商行為\nという構造になる。\n重要なのは、\n商人＝主体 商行為＝行為\nと区別することである。","blanks":["商行為","商人","営業"],"options":[["商行為","事務所","債権者","商取引"],["商人","他人","代理","会社"],["営業","他人","代理","会社"]],"explanations":["本文：商行為 ↓ 商人性との関係 ↓ 営業 ↓ 営業のための行為 ↓ 付属的商行為","本文：商行為 ↓ 商人性との関係 ↓ 営業 ↓ 営業のための行為 ↓ 付属的商行為","本文：商行為 ↓ 商人性との関係 ↓ 営業 ↓ 営業のための行為 ↓ 付属的商行為"],"mode":"commercial"},"15":{"text":"商号とは、\n商人が営業上自己を表示するために使用する名称\nである。\n例えば、\n「山梨商事」 「甲府運送」 「○○商店」\nなどが商号となり得る。\n商号には、\n・営業上の信用 ・顧客との関係 ・企業イメージ\nなどが結びつく。\nそのため、商号は単なる名前ではなく、営業上重要な意味を持つ。","blanks":["商号","営業","商人"],"options":[["商号","他人","代理","会社"],["営業","他人","代理","会社"],["商人","他人","代理","会社"]],"explanations":["本文：商号とは、","本文：商人が営業上自己を表示するために使用する名称","本文：商人が営業上自己を表示するために使用する名称"],"mode":"commercial"},"16":{"text":"「商号」と「会社」は同じではない。\n会社 ↓ 法人としての法律上の主体\n商号 ↓ 営業上使用する名称\n例えば、\n「株式会社甲府商事」\nという会社が存在する場合、その名称が会社の商号となる。\nつまり、\n会社＝法律上の主体 商号＝その会社を営業上表示する名称\nである。","blanks":["会社","商号","営業"],"options":[["会社","他人","代理","債務"],["商号","他人","代理","会社"],["営業","他人","代理","会社"]],"explanations":["本文：「商号」と「会社」は同じではない。","本文：「商号」と「会社」は同じではない。","本文：商号 ↓ 営業上使用する名称"],"mode":"commercial"},"17":{"text":"商人は原則として自由に商号を選ぶことができる。\nしかし、\n・他人の営業と誤認させる ・不正な目的で他人の商号を利用する ・営業上の信用を不当に利用する\nといった行為については、法的な問題が生じる。\n商号は営業上の信用と結びつくため、\n他人の信用にただ乗りすること\nを無制限に認めるわけにはいかない。","blanks":["商号","営業","商人"],"options":[["商号","他人","代理","会社"],["営業","他人","代理","会社"],["商人","他人","代理","会社"]],"explanations":["本文：商人は原則として自由に商号を選ぶことができる。","本文：・他人の営業と誤認させる ・不正な目的で他人の商号を利用する ・営業上の信用を不当に利用する","本文：商人は原則として自由に商号を選ぶことができる。"],"mode":"commercial"},"18":{"text":"商号には営業上の信用が蓄積する。\n例えば、\nA社が長年「ABC商店」という名称で営業していた。\nその近くでBが、\n「ABC商店」\nという名称を使用して営業を開始した。\n顧客が、\n「A社の支店なのではないか」\nと誤認する可能性がある。\nこのような場合、\n商号を利用した不正競争・営業上の混同\nが問題となる。\n商法では、商号に関する一定の保護が設けられている。","blanks":["営業","商号","商法"],"options":[["営業","他人","代理","会社"],["商号","他人","代理","会社"],["商法","他人","代理","会社"]],"explanations":["本文：商号には営業上の信用が蓄積する。","本文：商号には営業上の信用が蓄積する。","本文：商法では、商号に関する一定の保護が設けられている。"],"mode":"commercial"},"19":{"text":"商業登記とは、\n商人や会社について、法律上重要な事項を公示する制度\nである。\n例えば会社について、\n・商号 ・本店所在地 ・代表者 などの重要事項を登記する。\n目的\n取引相手 ↓ 会社情報を確認 ↓ 安心して取引 ↓ 取引安全","blanks":["会社","登記","取引安全"],"options":[["会社","他人","代理","債務"],["登記","他人","代理","会社"],["取引安全","バランス","事業目的","商業帳簿"]],"explanations":["本文：商人や会社について、法律上重要な事項を公示する制度","本文：商業登記とは、","本文：取引相手 ↓ 会社情報を確認 ↓ 安心して取引 ↓ 取引安全"],"mode":"commercial"},"20":{"text":"商業登記の最大のポイントは、\n公示\nである。\n企業内部の重要事項を社会に公表することで、第三者がその情報を確認できるようにする。\n例えば、\n「この会社の代表者は誰なのか」\nという情報を、第三者が確認できる。\nこれによって、\n取引相手が企業の内部事情を毎回一から調査する負担を減らす\nことができる。","blanks":["第三者","商業登記","会社"],"options":[["第三者","事務所","債権者","商取引"],["商業登記","バランス","事業目的","取引安全"],["会社","他人","代理","債務"]],"explanations":["本文：企業内部の重要事項を社会に公表することで、第三者がその情報を確認できるようにする。","本文：商業登記の最大のポイントは、","本文：「この会社の代表者は誰なのか」"],"mode":"commercial"},"21":{"text":"商業登記では、\n登記された事項と第三者との関係\nが重要になる。\n企業活動では、\n「実際にはこうなっている」\nだけではなく、\n「社会からどう見える状態になっているか」\nも取引安全に関係する。\nそのため商法では、登記の公示力・対抗力などが重要な論点となる。","blanks":["登記","取引安全","第三者"],"options":[["登記","他人","代理","会社"],["取引安全","バランス","事業目的","商業帳簿"],["第三者","事務所","債権者","商取引"]],"explanations":["本文：商業登記では、","本文：も取引安全に関係する。","本文：登記された事項と第三者との関係"],"mode":"commercial"},"22":{"text":"実際の法律関係と異なる登記が存在すると、第三者がそれを信頼する可能性がある。\n例えば、\n実際には代表者ではない人物が代表者として登記されている ↓ 第三者が登記を信頼 ↓ 取引 ↓ 第三者をどこまで保護するか\nという問題が生じる。\nここでも商法の重要な理念である、\n取引安全\nが登場する。","blanks":["第三者","登記","取引安全"],"options":[["第三者","事務所","債権者","商取引"],["登記","他人","代理","会社"],["取引安全","バランス","事業目的","商業帳簿"]],"explanations":["本文：実際の法律関係と異なる登記が存在すると、第三者がそれを信頼する可能性がある。","本文：実際の法律関係と異なる登記が存在すると、第三者がそれを信頼する可能性がある。","本文：取引安全"],"mode":"commercial"},"23":{"text":"営業所とは、\n商人が営業活動を行うための拠点\nである。\n単なる住所というより、\n営業上の機能を持つ場所\nとして理解する。\n例えば、\n・店舗 ・事務所 ・営業拠点\nなど。","blanks":["営業","商人","事務所"],"options":[["営業","他人","代理","会社"],["商人","他人","代理","会社"],["事務所","債権者","商取引","商慣習"]],"explanations":["本文：営業所とは、","本文：商人が営業活動を行うための拠点","本文：・店舗 ・事務所 ・営業拠点"],"mode":"commercial"},"24":{"text":"企業には、\n本店 ↓ 企業活動の中心\n支店 ↓ 本店とは別に営業活動を行う拠点\nという構造がある。\n例えば、\n株式会社A ├─ 本店 ├─ 甲府支店 └─ 東京支店\nという形である。\n支店についても、営業上の独立性や代理権などが問題となる。","blanks":["営業","株式会社","代理"],"options":[["営業","他人","代理","会社"],["株式会社","バランス","事業目的","取引安全"],["代理","他人","会社","債務"]],"explanations":["本文：支店 ↓ 本店とは別に営業活動を行う拠点","本文：株式会社A ├─ 本店 ├─ 甲府支店 └─ 東京支店","本文：支店についても、営業上の独立性や代理権などが問題となる。"],"mode":"commercial"},"25":{"text":"商人が大規模な営業を行う場合、本人だけですべての取引をすることはできない。\nそこで、\n商人の営業を補助する者\nが必要になる。\nこれを商業使用人という。\nその中でも特に重要なのが、\n支配人\nである。","blanks":["商人","営業","支配人"],"options":[["商人","他人","代理","会社"],["営業","他人","代理","会社"],["支配人","事務所","債権者","商取引"]],"explanations":["本文：商人が大規模な営業を行う場合、本人だけですべての取引をすることはできない。","本文：商人が大規模な営業を行う場合、本人だけですべての取引をすることはできない。","本文：支配人"],"mode":"commercial"},"26":{"text":"支配人とは、\n商人に代わって、その営業に関する広範な代理権を持つ者\nである。\n一般の従業員と比べて非常に強い権限を持つ。\nイメージ\n商人 ↓ 支配人 ↓ 営業に関する広範な代理権 ↓ 第三者と取引","blanks":["支配人","商人","営業"],"options":[["支配人","事務所","債権者","商取引"],["商人","他人","代理","会社"],["営業","他人","代理","会社"]],"explanations":["本文：支配人とは、","本文：商人に代わって、その営業に関する広範な代理権を持つ者","本文：商人に代わって、その営業に関する広範な代理権を持つ者"],"mode":"commercial"},"27":{"text":"支配人は、\n営業に関する一切の裁判上・裁判外の行為をする権限\nを持つ。\nしたがって、\n「この取引は支配人の権限内なのか」\nという問題を細かく毎回判断する必要がないよう、広い代理権が認められている。\nこれは、\n企業取引を迅速に行う\nという商法の目的とも関係する。","blanks":["支配人","商法","営業"],"options":[["支配人","事務所","債権者","商取引"],["商法","他人","代理","会社"],["営業","他人","代理","会社"]],"explanations":["本文：支配人は、","本文：という商法の目的とも関係する。","本文：営業に関する一切の裁判上・裁判外の行為をする権限"],"mode":"commercial"},"28":{"text":"項目\t支配人\t一般従業員\n権限\t非常に広い\t原則として担当業務の範囲\n代理権\t営業について広範\t個別に付与された範囲\n商法上の重要性\t高い\t比較的低い\n取引安全との関係\t非常に強い\t個別判断\nつまり、\n支配人＝営業全体に関わる強力な代理権を持つ者\nと理解する。","blanks":["支配人","営業","代理"],"options":[["支配人","事務所","債権者","商取引"],["営業","他人","代理","会社"],["代理","他人","会社","債務"]],"explanations":["本文：項目\t支配人\t一般従業員","本文：代理権\t営業について広範\t個別に付与された範囲","本文：代理権\t営業について広範\t個別に付与された範囲"],"mode":"commercial"},"29":{"text":"商取引では、\n外から見て支配人のように見える\nという外観が、第三者の信頼につながる場合がある。\n例えば、\n会社がある人物を支店の責任者として表示している ↓ 第三者 ↓ 「この人には営業上の権限がある」と信頼 ↓ 取引\nという場合である。\n一定の場合には、第三者の信頼を保護する必要が生じる。\nこのような考え方を、\n外観保護\nという。","blanks":["第三者","支配人","会社"],"options":[["第三者","事務所","債権者","商取引"],["支配人","事務所","債権者","商取引"],["会社","他人","代理","債務"]],"explanations":["本文：という外観が、第三者の信頼につながる場合がある。","本文：外から見て支配人のように見える","本文：会社がある人物を支店の責任者として表示している ↓ 第三者 ↓ 「この人には営業上の権限がある」と信頼 ↓ 取引"],"mode":"commercial"},"30":{"text":"商法では、\n実際の法律関係だけでなく、第三者から見える外観を重視する\n場面が多い。\nこれは商取引が、\n・大量 ・反復 ・迅速\nに行われるからである。\n毎回、\n「本当にこの人に権限があるのか」 「会社内部ではどうなっているのか」\nを徹底的に調査していたら、取引が進まない。\nそこで、\n一定の要件の下で、合理的に信頼した第三者を保護する\nという発想が重要になる。","blanks":["第三者","商法","会社"],"options":[["第三者","事務所","債権者","商取引"],["商法","他人","代理","会社"],["会社","他人","代理","債務"]],"explanations":["本文：実際の法律関係だけでなく、第三者から見える外観を重視する","本文：商法では、","本文：「本当にこの人に権限があるのか」 「会社内部ではどうなっているのか」"],"mode":"commercial"},"31":{"text":"営業譲渡とは、\n営業を構成する組織的・有機的一体としての機能を他人に移転すること\nと理解する。\n単に財産を一つ売ることとは違う。\n例えば飲食店について、\n・店舗 ・設備 ・商品 ・営業上の組織 ・顧客関係 などを一体として譲渡し、営業そのものを引き継がせる場合がある。","blanks":["営業","譲渡","有機的一体"],"options":[["営業","他人","代理","会社"],["譲渡","他人","代理","会社"],["有機的一体","商業使用人","基本的に、","バランス"]],"explanations":["本文：営業譲渡とは、","本文：営業譲渡とは、","本文：営業を構成する組織的・有機的一体としての機能を他人に移転すること"],"mode":"commercial"},"32":{"text":"営業譲渡\t単純な財産売買\n対象\t営業組織・営業機能\t個々の財産\n事業継続\t想定される\t必ずしもない\n顧客・信用\t重要\t原則として別問題\n商法上の問題\t多い\t一般の売買が中心\n例えば、\n店舗の建物だけを売る ↓ 財産売買\n店舗・設備・商品・営業上の組織などを一体として譲渡 ↓ 営業譲渡\nとなる。","blanks":["営業","譲渡","売買"],"options":[["営業","他人","代理","会社"],["譲渡","他人","代理","会社"],["売買","他人","代理","会社"]],"explanations":["本文：営業譲渡\t単純な財産売買","本文：営業譲渡\t単純な財産売買","本文：営業譲渡\t単純な財産売買"],"mode":"commercial"},"33":{"text":"営業を買った人にとって重要なのは、\n譲渡した人がすぐ近くで同じ営業を始める\nという問題である。\n例えば、\nAが「Aラーメン店」をBに営業譲渡した。\nその直後にAが隣で、\n「元Aラーメン店」\nとして同じ顧客を奪うような営業を開始したら、Bが営業を買った意味が失われる。\nそこで、営業譲渡に伴って、\n譲渡人の競業を一定範囲で制限する\nという制度が問題となる。","blanks":["営業","譲渡","競業"],"options":[["営業","他人","代理","会社"],["譲渡","他人","代理","会社"],["競業","他人","代理","会社"]],"explanations":["本文：営業を買った人にとって重要なのは、","本文：譲渡した人がすぐ近くで同じ営業を始める","本文：譲渡人の競業を一定範囲で制限する"],"mode":"commercial"},"34":{"text":"商人は営業を行うため、\n・財産 ・売上 ・費用 ・債務 ・取引\nなどを記録する必要がある。\nこれに関係するのが商業帳簿である。\n商業帳簿には、\n商人の財産・営業状態を明らかにする\nという役割がある。","blanks":["商人","営業","債務"],"options":[["商人","他人","代理","会社"],["営業","他人","代理","会社"],["債務","他人","代理","会社"]],"explanations":["本文：商人は営業を行うため、","本文：商人は営業を行うため、","本文：・財産 ・売上 ・費用 ・債務 ・取引"],"mode":"commercial"},"35":{"text":"商業帳簿には主に、\n① 経営管理 ② 財産状態の把握 ③ 取引関係の明確化 ④ 債権者などの利害関係との関係\nという意味がある。\n企業活動では、\n「いくら売れたか」 「どれだけ借金があるか」 「どれだけ財産があるか」\nを正確に把握する必要がある。","blanks":["債権者","どれだけ借金があるか","どれだけ財産があるか"],"options":[["債権者","事務所","商取引","商慣習"],["どれだけ借金があるか","どれだけ財産があるか","それを業として行う","反復的に取引を行う"],["どれだけ財産があるか","どれだけ借金があるか","それを業として行う","反復的に取引を行う"]],"explanations":["本文：① 経営管理 ② 財産状態の把握 ③ 取引関係の明確化 ④ 債権者などの利害関係との関係","本文：「いくら売れたか」 「どれだけ借金があるか」 「どれだけ財産があるか」","本文：「いくら売れたか」 「どれだけ借金があるか」 「どれだけ財産があるか」"],"mode":"commercial"},"36":{"text":"ここまでの制度を一つにつなげる。\n商人 ↓ 営業 ↓ 商行為 ↓ 企業取引 ↓ 取引相手が必要 ↓ 取引安全が必要 ↓ 商号・商業登記・支配人などの制度 ↓ 第三者の信頼を保護\nこれが商法総論の大きな流れである。","blanks":["商業登記","取引安全","商行為"],"options":[["商業登記","バランス","事業目的","取引安全"],["取引安全","バランス","事業目的","商業帳簿"],["商行為","事務所","債権者","商取引"]],"explanations":["本文：商人 ↓ 営業 ↓ 商行為 ↓ 企業取引 ↓ 取引相手が必要 ↓ 取引安全が必要 ↓ 商号・商業登記・支配人などの制度 ↓ 第三者の信頼を保護","本文：商人 ↓ 営業 ↓ 商行為 ↓ 企業取引 ↓ 取引相手が必要 ↓ 取引安全が必要 ↓ 商号・商業登記・支配人などの制度 ↓ 第三者の信頼を保護","本文：商人 ↓ 営業 ↓ 商行為 ↓ 企業取引 ↓ 取引相手が必要 ↓ 取引安全が必要 ↓ 商号・商業登記・支配人などの制度 ↓ 第三者の信頼を保護"],"mode":"commercial"},"37":{"text":"商法では、\n取引を迅速に処理すること\nも重要である。\n企業は、\n・大量の商品を仕入れる ・大量の商品を販売する ・多数の顧客と契約する ・継続的に金融取引を行う\nなど、非常に多くの法律関係を処理する。\nそのため、\n一般私人間の取引よりも迅速な処理が求められる。","blanks":["商法","契約","継続的に金融取引を行う"],"options":[["商法","他人","代理","会社"],["契約","他人","代理","会社"],["継続的に金融取引を行う","A社の支店なのではないか","どれだけ借金があるか","どれだけ財産があるか"]],"explanations":["本文：商法では、","本文：・大量の商品を仕入れる ・大量の商品を販売する ・多数の顧客と契約する ・継続的に金融取引を行う","本文：・大量の商品を仕入れる ・大量の商品を販売する ・多数の顧客と契約する ・継続的に金融取引を行う"],"mode":"commercial"},"38":{"text":"一方、迅速に取引するだけでは危険である。\nそこで、\n迅速性と安全性のバランス\nが必要になる。\n迅速すぎる\n↓\n確認不足\n↓\n取引危険\n安全性を重視しすぎる\n↓\n確認に時間がかかる\n↓\n取引停滞\nしたがって\n↓\n迅速性 × 安全性\n↓\n商法","blanks":["商法","安全性","迅速性"],"options":[["商法","他人","代理","会社"],["安全性","事務所","債権者","商取引"],["迅速性","事務所","債権者","商取引"]],"explanations":["本文：商法","本文：迅速性と安全性のバランス","本文：迅速性と安全性のバランス"],"mode":"commercial"},"39":{"text":"商法総論を理解したら、次に会社法へ進む。\n会社法は、\n会社という企業組織そのものを規律する法律\nである。\n商法総論 ↓ 商人・営業・商行為\n会社法 ↓ 会社という組織\nという違いがある。","blanks":["会社","商法","商行為"],"options":[["会社","他人","代理","債務"],["商法","他人","代理","会社"],["商行為","事務所","債権者","商取引"]],"explanations":["本文：商法総論を理解したら、次に会社法へ進む。","本文：商法総論を理解したら、次に会社法へ進む。","本文：商法総論 ↓ 商人・営業・商行為"],"mode":"commercial"},"40":{"text":"会社は、一定の事業目的を実現するために組織された法人である。\n会社法上の会社には、\n① 株式会社 ② 合名会社 ③ 合資会社 ④ 合同会社\nがある。\n次の第3編以降で詳しく扱う。","blanks":["会社","株式","事業目的"],"options":[["会社","他人","代理","債務"],["株式","他人","代理","会社"],["事業目的","バランス","取引安全","商業帳簿"]],"explanations":["本文：会社は、一定の事業目的を実現するために組織された法人である。","本文：① 株式会社 ② 合名会社 ③ 合資会社 ④ 合同会社","本文：会社は、一定の事業目的を実現するために組織された法人である。"],"mode":"commercial"},"41":{"text":"会社法を理解するうえで、\n法人格\nは極めて重要。\n会社は法人として成立すると、\n会社自身が権利義務の主体\nになる。\n例えば、\nAが株式会社を設立した。\nA ↓ 出資 株式会社A ↓ 会社自身が 契約する 財産を持つ 債務を負う\nという構造になる。","blanks":["会社","株式","法人格"],"options":[["会社","他人","代理","債務"],["株式","他人","代理","会社"],["法人格","事務所","債権者","商取引"]],"explanations":["本文：会社法を理解するうえで、","本文：Aが株式会社を設立した。","本文：法人格"],"mode":"commercial"},"42":{"text":"株式会社では、\n会社と株主は別の法律上の主体\nである。\n会社財産 ≠ 株主個人の財産\n会社の債務 ≠ 当然に株主個人の債務\nである。\nこれを理解することが会社法の出発点になる。","blanks":["会社","株主","債務"],"options":[["会社","他人","代理","債務"],["株主","他人","代理","会社"],["債務","他人","代理","会社"]],"explanations":["本文：株式会社では、","本文：会社と株主は別の法律上の主体","本文：会社の債務 ≠ 当然に株主個人の債務"],"mode":"commercial"},"43":{"text":"株式会社の株主は、原則として、\nその引受けた株式について出資した額を超えて会社債権者に直接責任を負わない\nという仕組みになっている。\n例えば、\nAが100万円を出資して株主になった。\nその後、会社が1,000万円の債務を負った。\n原則として、\nAが自分の財産から1,000万円を支払う義務を負うわけではない。\nこれが株主の有限責任である。","blanks":["会社","株主","株式"],"options":[["会社","他人","代理","債務"],["株主","他人","代理","会社"],["株式","他人","代理","会社"]],"explanations":["本文：株式会社の株主は、原則として、","本文：株式会社の株主は、原則として、","本文：株式会社の株主は、原則として、"],"mode":"commercial"},"44":{"text":"ここは必ず区別する。\n会社財産\n↓\n会社のもの\n株主財産\n↓\n株主のもの\n株主が会社の株式を100％持っていたとしても、\n会社の財産がそのまま株主個人の財産になるわけではない。\n逆に、株主個人の財産が当然に会社財産になるわけでもない。","blanks":["会社","株主","株式"],"options":[["会社","他人","代理","債務"],["株主","他人","代理","会社"],["株式","他人","代理","会社"]],"explanations":["本文：会社財産","本文：株主財産","本文：株主が会社の株式を100％持っていたとしても、"],"mode":"commercial"},"45":{"text":"ただし、\n会社と個人が別人格だから、どんな場合でも会社の独立性を主張できる\nというわけではない。\n例えば、\n・会社を単なる責任逃れの道具として利用する ・会社制度を悪用する ・法人格を濫用して不当な結果を生じさせる\nなどの場合には、\n法人格を形式的に主張することを許さない\nという法理が問題となる。\nこれを、\n法人格否認の法理\nという。\nただし、これは法人格の独立を否定する一般原則ではなく、例外的な場面で問題となる。","blanks":["法人格","会社","責任"],"options":[["法人格","事務所","債権者","商取引"],["会社","他人","代理","債務"],["責任","他人","代理","会社"]],"explanations":["本文：・会社を単なる責任逃れの道具として利用する ・会社制度を悪用する ・法人格を濫用して不当な結果を生じさせる","本文：会社と個人が別人格だから、どんな場合でも会社の独立性を主張できる","本文：・会社を単なる責任逃れの道具として利用する ・会社制度を悪用する ・法人格を濫用して不当な結果を生じさせる"],"mode":"commercial"},"46":{"text":"ここまでを一つの図にすると、\n商法\n│\n├─ 商人\n│    └─ 営業を行う主体\n│\n├─ 商行為\n│    └─ 商取引\n│\n├─ 商号\n│    └─ 営業上の名称\n│\n├─ 商業登記\n│    └─ 重要事項の公示\n│\n├─ 営業所\n│    └─ 営業活動の拠点\n│\n├─ 商業使用人\n│    └─ 支配人など\n│\n├─ 営業譲渡\n│    └─ 営業組織の移転\n│\n└─ 商業帳簿\n└─ 営業・財産状態の記録\nそして会社法へ、\n商人・営業\n↓\n企業活動\n↓\n企業組織\n↓\n会社\n↓\n会社法\nとつながる。","blanks":["営業","会社","商人"],"options":[["営業","他人","代理","会社"],["会社","他人","代理","債務"],["商人","他人","代理","会社"]],"explanations":["本文：│    └─ 営業を行う主体","本文：そして会社法へ、","本文：├─ 商人"],"mode":"commercial"},"47":{"text":"概念\t意味\n商人\t商法上の主体\n営業\t継続・反復して行う事業\n商行為\t商法上の商取引\n商号\t営業上の名称\n商業登記\t重要事項を公示する制度\n営業所\t営業活動の拠点\n商業使用人\t商人の営業を補助する者\n支配人\t営業について広範な代理権を持つ者\n営業譲渡\t営業を一体として移転すること\n商業帳簿\t営業・財産状態を記録するもの\n法人格\t会社自身が権利義務の主体となること\n有限責任\t株主の責任が出資額を基本的限度とすること","blanks":["営業","商法","商人"],"options":[["営業","他人","代理","会社"],["商法","他人","代理","会社"],["商人","他人","代理","会社"]],"explanations":["本文：営業\t継続・反復して行う事業","本文：商人\t商法上の主体","本文：商人\t商法上の主体"],"mode":"commercial"},"48":{"text":"これまで学んだ民法と比較すると理解しやすい。\n民法\n人 ↓ 権利能力 ↓ 法律行為 ↓ 契約 ↓ 債権・物権\n商法\n商人 ↓ 営業 ↓ 商行為 ↓ 企業取引 ↓ 会社法\nつまり、\n民法＝私人間の法律関係の一般法 商法＝企業・商取引についての特別なルール\nと考える。","blanks":["商法","商行為","商人"],"options":[["商法","他人","代理","会社"],["商行為","事務所","債権者","商取引"],["商人","他人","代理","会社"]],"explanations":["本文：商法","本文：商人 ↓ 営業 ↓ 商行為 ↓ 企業取引 ↓ 会社法","本文：商人 ↓ 営業 ↓ 商行為 ↓ 企業取引 ↓ 会社法"],"mode":"commercial"},"49":{"text":"Aは「A商店」という飲食店を経営している。\nAは継続的に飲食物を販売している。\n↓\n営業\n↓\n商人としての地位\n↓\n「A商店」という名称を使用\n↓\n商号\n↓\n店舗で営業\n↓\n営業所\n↓\n従業員を雇用\n↓\n商業使用人\n↓\n営業について広い代理権を与えた人物\n↓\n支配人\n↓\n支配人が第三者と契約\n↓\n代理権・取引安全の問題\nさらにAが事業を株式会社化すると、\nA ↓ 株式会社設立 ↓ 法人格 ↓ 会社自身が営業主体 ↓ 会社法\nとなる。","blanks":["営業","会社","支配人"],"options":[["営業","他人","代理","会社"],["会社","他人","代理","債務"],["支配人","事務所","債権者","商取引"]],"explanations":["本文：営業","本文：さらにAが事業を株式会社化すると、","本文：支配人"],"mode":"commercial"},"50":{"text":"商法総論は次の公式で整理するとよい。\n誰が？\n↓\n商人\n何を？\n↓\n商行為\nどのように事業を行う？\n↓\n営業\nどんな名称？\n↓\n商号\n重要事項をどう公示？\n↓\n商業登記\n誰が営業を代理？\n↓\n商業使用人・支配人\n事業そのものを移す？\n↓\n営業譲渡\n企業を法人として組織する？\n↓\n会社法","blanks":["営業","商業登記","支配人"],"options":[["営業","他人","代理","会社"],["商業登記","バランス","事業目的","取引安全"],["支配人","事務所","債権者","商取引"]],"explanations":["本文：営業","本文：商業登記","本文：商業使用人・支配人"],"mode":"commercial"},"51":{"text":"行政書士試験では、商法・会社法について細かな条文知識が問われることがある。\nしかし、最初の段階では、\n最重要\n・商人 ・商行為 ・商号 ・商業登記 ・支配人 ・営業譲渡 ・会社と株主の分離 ・有限責任\nを優先する。\n特に、\n「商人＝主体」 「商行為＝行為」 「商号＝名称」 「登記＝公示」 「支配人＝広い代理権」 「会社＝株主とは別人格」\nという整理が重要。","blanks":["会社","商行為","支配人"],"options":[["会社","他人","代理","債務"],["商行為","事務所","債権者","商取引"],["支配人","事務所","債権者","商取引"]],"explanations":["本文：行政書士試験では、商法・会社法について細かな条文知識が問われることがある。","本文：・商人 ・商行為 ・商号 ・商業登記 ・支配人 ・営業譲渡 ・会社と株主の分離 ・有限責任","本文：・商人 ・商行為 ・商号 ・商業登記 ・支配人 ・営業譲渡 ・会社と株主の分離 ・有限責任"],"mode":"commercial"},"52":{"text":"商法総論の核心は、\n商法は、企業活動を安全・迅速・円滑に行わせるための私法である。\nということである。\nそのため、\n商人 ↓ 営業 ↓ 商行為 ↓ 商号 ↓ 商業登記 ↓ 商業使用人・支配人 ↓ 営業譲渡 ↓ 企業活動\nという制度が存在する。\nさらに企業を組織化すると、\n企業活動 ↓ 会社 ↓ 法人格 ↓ 会社法\nへ進む。","blanks":["商法","会社","営業"],"options":[["商法","他人","代理","会社"],["会社","他人","代理","債務"],["営業","他人","代理","会社"]],"explanations":["本文：商法総論の核心は、","本文：企業活動 ↓ 会社 ↓ 法人格 ↓ 会社法","本文：商人 ↓ 営業 ↓ 商行為 ↓ 商号 ↓ 商業登記 ↓ 商業使用人・支配人 ↓ 営業譲渡 ↓ 企業活動"],"mode":"commercial"},"53":{"text":"以下を何も見ずに説明できるか確認する。\nQ1\n商法とは何か。\nQ2\n商法と民法はどのような関係にあるか。\nQ3\n商法が取引の迅速性を重視するのはなぜか。\nQ4\n商人とは何か。\nQ5\n「自己の名」とはどういう意味か。\nQ6\n営業とは何か。\nQ7\n商行為とは何か。\nQ8\n絶対的商行為と営業的商行為の違いは何か。\nQ9\n付属的商行為とは何か。\nQ10\n商号とは何か。\nQ11\n商業登記はなぜ必要なのか。\nQ12\n支配人とは何か。\nQ13\n支配人と一般従業員はどう違うか。\nQ14\n外観保護が商法で重要なのはなぜか。\nQ15\n営業譲渡と単なる財産売買の違いは何か。\nQ16\n会社と株主が別人格なのはなぜか。\nQ17\n有限責任とは何か。\nQ18\n法人格否認の法理とは何か。\nQ19\n商法と会社法はどうつながっているか。","blanks":["商法","商行為","営業"],"options":[["商法","他人","代理","会社"],["商行為","事務所","債権者","商取引"],["営業","他人","代理","会社"]],"explanations":["本文：商法とは何か。","本文：商行為とは何か。","本文：営業とは何か。"],"mode":"commercial"},"54":{"text":"① 商法の基本\n商法 ↓ 企業・商人・商取引を規律する私法\n② 商法の目的\n取引安全\n＋\n取引迅速\n＋\n企業活動の円滑化\n↓\n商法\n③ 商人\n自己の名\n＋\n商行為\n＋\n業として行う\n↓\n商人\n④ 商行為\n絶対的商行為\n営業的商行為\n付属的商行為\n⑤ 商号・登記\n商号\n↓\n営業上の名称\n商業登記\n↓\n重要事項の公示\n↓\n取引安全\n⑥ 支配人\n商人\n↓\n支配人\n↓\n営業について広範な代理権\n↓\n第三者との取引\n⑦ 会社法への接続\n企業活動\n↓\n会社\n↓\n法人格\n↓\n会社自身が権利義務の主体\n↓\n株主とは別人格\n↓\n株式会社では有限責任\n★ 第1編の最重要5点\n① 商人＝商法上の主体\n② 商行為＝商法上の取引\n③ 商業登記＝取引安全のための公示制度\n④ 支配人＝営業について広範な代理権を持つ者\n⑤ 会社＝株主とは別の法人格を持つ\nこの5つを土台にして、次の第2編では、\n「商人が実際に行う商取引には、どのような特殊なルールがあるのか」\nを学ぶ。\n第1編 完成\n第1編 商法総論 → 商法の意味 → 商法と民法 → 商人 → 営業 → 商行為 → 商号 → 商業登記 → 営業所 → 商業使用人 → 支配人 → 外観保護 → 営業譲渡 → 商業帳簿 → 会社法への接続 → 法人格 → 有限責任 → 法人格否認\nという順番で、商法・会社法を学ぶための土台を完成させる。","blanks":["商行為","商人","商法"],"options":[["商行為","事務所","債権者","商取引"],["商人","他人","代理","会社"],["商法","他人","代理","会社"]],"explanations":["本文：商行為","本文：商法 ↓ 企業・商人・商取引を規律する私法","本文：① 商法の基本"],"mode":"commercial"}},"2":{"1":{"text":"商行為とは、商法上「商取引」として扱われる行為である。\n商法では、企業が継続的・大量に取引することを前提として、民法とは異なる特別なルールを設けている。\n基本構造は、\n商人 ↓ 営業 ↓ 商行為 ↓ 企業取引 ↓ 商法上の特別ルール\nである。","blanks":["商法","商行為","商人"],"options":[["商法","両者","他人","代理"],["商行為","C自身","代理商","仲立人"],["商人","両者","他人","代理"]],"explanations":["本文：商行為とは、商法上「商取引」として扱われる行為である。","本文：商行為とは、商法上「商取引」として扱われる行為である。","本文：商人 ↓ 営業 ↓ 商行為 ↓ 企業取引 ↓ 商法上の特別ルール"],"mode":"commercial"},"2":{"text":"商行為は大きく、\n1.\t絶対的商行為\n2.\t営業的商行為\n3.\t付属的商行為\nに分類される。\n絶対的商行為\n行為の性質そのものから商行為となるもの。\n営業的商行為\n営業として行うことで商行為となるもの。\n付属的商行為\n商人が営業のために行う行為。","blanks":["商行為","営業","商人"],"options":[["商行為","C自身","代理商","仲立人"],["営業","両者","他人","代理"],["商人","両者","他人","代理"]],"explanations":["本文：商行為は大きく、","本文：2.\t営業的商行為","本文：商人が営業のために行う行為。"],"mode":"commercial"},"3":{"text":"商人同士の取引では、\n・大量 ・継続 ・反復 ・迅速\nという特徴がある。\nそのため、\n一般私人間の取引よりも迅速に処理する必要がある。\nこれが商法上の特則が存在する理由の一つである。","blanks":["商法","商人","迅速"],"options":[["商法","両者","他人","代理"],["商人","両者","他人","代理"],["迅速","両者","他人","代理"]],"explanations":["本文：これが商法上の特則が存在する理由の一つである。","本文：商人同士の取引では、","本文：・大量 ・継続 ・反復 ・迅速"],"mode":"commercial"},"4":{"text":"商人同士が契約をするときも、基本的には民法上の契約ルールが適用される。\nただし、\n商法に特別な規定がある場合には商法が優先する。\nしたがって、\n民法 ＝一般法\n商法 ＝商取引についての特別法\nという関係を忘れない。","blanks":["商法","契約","商人"],"options":[["商法","両者","他人","代理"],["契約","両者","他人","代理"],["商人","両者","他人","代理"]],"explanations":["本文：商法に特別な規定がある場合には商法が優先する。","本文：商人同士が契約をするときも、基本的には民法上の契約ルールが適用される。","本文：商人同士が契約をするときも、基本的には民法上の契約ルールが適用される。"],"mode":"commercial"},"5":{"text":"商人同士の売買では、商品の検査・通知などについて特別なルールが存在する。\n企業間では、\n商品を受け取った後に長期間放置して、\n「実は不良品だった」\nと主張されると、売主側の取引上の地位が不安定になる。\nそこで、\n買主に一定の検査・通知を求める\nという考え方が採用されている。","blanks":["商人","売買","実は不良品だった"],"options":[["商人","両者","他人","代理"],["売買","両者","他人","代理"],["実は不良品だった","買主に一定の検査","商事法定利率","旅客の生命"]],"explanations":["本文：商人同士の売買では、商品の検査・通知などについて特別なルールが存在する。","本文：商人同士の売買では、商品の検査・通知などについて特別なルールが存在する。","本文：「実は不良品だった」"],"mode":"commercial"},"6":{"text":"商人間の売買では、買主は受け取った商品について、\n遅滞なく検査する\nことが求められる。\nそして、種類・品質・数量などに関する契約不適合を発見した場合には、\n速やかに売主へ通知する\n必要がある。\n目的\n商品受領 ↓ 検査 ↓ 問題発見 ↓ 通知 ↓ 売主が状況確認 ↓ 取引安全\nという流れを作るためである。","blanks":["取引安全","商人","契約"],"options":[["取引安全","イメージ","タクシー","ポイント"],["商人","両者","他人","代理"],["契約","両者","他人","代理"]],"explanations":["本文：商品受領 ↓ 検査 ↓ 問題発見 ↓ 通知 ↓ 売主が状況確認 ↓ 取引安全","本文：商人間の売買では、買主は受け取った商品について、","本文：そして、種類・品質・数量などに関する契約不適合を発見した場合には、"],"mode":"commercial"},"7":{"text":"買主が必要な検査・通知を怠ると、\n契約不適合を理由とする権利行使が制限される\nことがある。\nこれは、\n「売主を永久に不安定な状態に置かない」\nためである。\n重要\n商人間売買では、\n「商品を受け取った後、問題がないかを確認する」\nという買主側の行動が重要になる。","blanks":["商人","契約","売買"],"options":[["商人","両者","他人","代理"],["契約","両者","他人","代理"],["売買","両者","他人","代理"]],"explanations":["本文：商人間売買では、","本文：契約不適合を理由とする権利行使が制限される","本文：商人間売買では、"],"mode":"commercial"},"8":{"text":"ここは民法との接続が重要。\n民法 ↓ 売買契約 ↓ 契約不適合責任\n商法 ↓ 商人間売買 ↓ 検査・通知などの特則\nつまり、\n民法の売買を土台に、商法が商人間取引に特別ルールを加える。","blanks":["売買","商法","商人"],"options":[["売買","両者","他人","代理"],["商法","両者","他人","代理"],["商人","両者","他人","代理"]],"explanations":["本文：民法 ↓ 売買契約 ↓ 契約不適合責任","本文：商法 ↓ 商人間売買 ↓ 検査・通知などの特則","本文：商法 ↓ 商人間売買 ↓ 検査・通知などの特則"],"mode":"commercial"},"9":{"text":"商人同士では、金銭の貸し借りも頻繁に行われる。\n商法では、\n商人がその営業の範囲内で金銭を貸し付ける・借りる\n場合について、民法とは異なる商事法上の規律が問題となる。\nここでは、\n「営業との関連性」\nが重要になる。","blanks":["商人","営業","商法"],"options":[["商人","両者","他人","代理"],["営業","両者","他人","代理"],["商法","両者","他人","代理"]],"explanations":["本文：商人同士では、金銭の貸し借りも頻繁に行われる。","本文：商人がその営業の範囲内で金銭を貸し付ける・借りる","本文：商法では、"],"mode":"commercial"},"10":{"text":"商取引では、利息についても特別な規律が存在する。\nただし現在の法制度では、商法上の旧来の「商事法定利率」をそのまま暗記するのではなく、\n民法の法定利率と、商取引に関する個別の特則\nを区別して理解することが重要である。","blanks":["商法","商事法定利率","商取引"],"options":[["商法","両者","他人","代理"],["商事法定利率","旅客の生命","流通させる","イメージ"],["商取引","C自身","代理商","仲立人"]],"explanations":["本文：ただし現在の法制度では、商法上の旧来の「商事法定利率」をそのまま暗記するのではなく、","本文：ただし現在の法制度では、商法上の旧来の「商事法定利率」をそのまま暗記するのではなく、","本文：商取引では、利息についても特別な規律が存在する。"],"mode":"commercial"},"11":{"text":"商人間の取引では、\nAがBに対して債権を持っている ↓ Bの所有物をAが適法に占有 ↓ Bが債務を履行しない ↓ その物を留置できるか\nという問題が生じる。\n商法には、\n商人間の取引に適した商人間の留置権\nが存在する。","blanks":["商人","商法","債務"],"options":[["商人","両者","他人","代理"],["商法","両者","他人","代理"],["債務","両者","他人","代理"]],"explanations":["本文：商人間の取引では、","本文：商法には、","本文：AがBに対して債権を持っている ↓ Bの所有物をAが適法に占有 ↓ Bが債務を履行しない ↓ その物を留置できるか"],"mode":"commercial"},"12":{"text":"商人間では、債権と物の関係が一般の留置権より広く認められる場面がある。\nこれは、\n継続的な企業取引において、債権回収を確保する\nという意味を持つ。\nただし、\n商人間だから何でも留置できる\nわけではない。\n商法上の要件を満たす必要がある。","blanks":["商人","商法","企業取引"],"options":[["商人","両者","他人","代理"],["商法","両者","他人","代理"],["企業取引","イメージ","タクシー","ポイント"]],"explanations":["本文：商人間では、債権と物の関係が一般の留置権より広く認められる場面がある。","本文：商法上の要件を満たす必要がある。","本文：継続的な企業取引において、債権回収を確保する"],"mode":"commercial"},"13":{"text":"企業活動では、本人がすべての取引を直接行うことはできない。\nそこで、\n本人 ↓ 代理人 ↓ 第三者\nという形で取引する。\n民法にも代理制度があるが、商法では企業取引の迅速性を考慮した特則が存在する。","blanks":["代理","第三者","商法"],"options":[["代理","両者","他人","会社"],["第三者","C自身","代理商","仲立人"],["商法","両者","他人","代理"]],"explanations":["本文：本人 ↓ 代理人 ↓ 第三者","本文：本人 ↓ 代理人 ↓ 第三者","本文：民法にも代理制度があるが、商法では企業取引の迅速性を考慮した特則が存在する。"],"mode":"commercial"},"14":{"text":"代理商とは、\n商人のために、その平常の営業の部類に属する取引の代理または媒介をする者\nである。\nポイントは、\n商人そのものではなく、商人の営業を継続的に補助する独立した存在\nであること。","blanks":["商人","営業","代理"],"options":[["商人","両者","他人","代理"],["営業","両者","他人","代理"],["代理","両者","他人","会社"]],"explanations":["本文：商人のために、その平常の営業の部類に属する取引の代理または媒介をする者","本文：商人のために、その平常の営業の部類に属する取引の代理または媒介をする者","本文：代理商とは、"],"mode":"commercial"},"15":{"text":"両者を区別する。\n代理商\t商業使用人\n立場\t独立した補助者\t商人の内部的な補助者\n雇用関係\t必ずしもない\t通常、商人との雇用関係等\n役割\t取引の代理・媒介\t営業を内部から補助\n代表例\t代理商\t支配人","blanks":["代理","商人","支配人"],"options":[["代理","両者","他人","会社"],["商人","両者","他人","代理"],["支配人","C自身","代理商","仲立人"]],"explanations":["本文：代理商\t商業使用人","本文：立場\t独立した補助者\t商人の内部的な補助者","本文：代表例\t代理商\t支配人"],"mode":"commercial"},"16":{"text":"支配人は、\n商人の営業について広範な代理権を持つ者\nである。\n一方、代理商は、\n独立した立場で商人の営業を補助する者\nである。\nしたがって、\n支配人 ↓ 商人内部の強力な代理権者\n代理商 ↓ 独立した営業補助者\nと整理する。","blanks":["代理","商人","営業"],"options":[["代理","両者","他人","会社"],["商人","両者","他人","代理"],["営業","両者","他人","代理"]],"explanations":["本文：商人の営業について広範な代理権を持つ者","本文：商人の営業について広範な代理権を持つ者","本文：商人の営業について広範な代理権を持つ者"],"mode":"commercial"},"17":{"text":"仲立人とは、\n他人間の商行為の媒介をすることを業とする者\nである。\n仲立人自身が契約の当事者になるわけではない。\nイメージ\nA ↓ 仲立人 ↓ B\n仲立人 ＝AとBを結びつける。","blanks":["仲立人","商行為","契約"],"options":[["仲立人","C自身","代理商","借りる"],["商行為","C自身","代理商","仲立人"],["契約","両者","他人","代理"]],"explanations":["本文：仲立人とは、","本文：他人間の商行為の媒介をすることを業とする者","本文：仲立人自身が契約の当事者になるわけではない。"],"mode":"commercial"},"18":{"text":"問屋とは、\n自己の名をもって、他人のために物品の販売または買入れをすることを業とする者\nである。\nここが重要。\n問屋は、\n他人のために行動するが、自己の名で取引する。","blanks":["問屋","自己","他人"],"options":[["問屋","両者","他人","代理"],["自己","両者","他人","代理"],["他人","両者","代理","会社"]],"explanations":["本文：問屋とは、","本文：自己の名をもって、他人のために物品の販売または買入れをすることを業とする者","本文：自己の名をもって、他人のために物品の販売または買入れをすることを業とする者"],"mode":"commercial"},"19":{"text":"代理人 ↓ 本人の名で契約 ↓ 本人が契約当事者\n問屋 ↓ 自己の名で契約 ↓ 問屋自身が契約当事者 ↓ その経済的利益は他人のため\nこの違いは重要。","blanks":["契約","問屋","利益"],"options":[["契約","両者","他人","代理"],["問屋","両者","他人","代理"],["利益","両者","他人","代理"]],"explanations":["本文：代理人 ↓ 本人の名で契約 ↓ 本人が契約当事者","本文：問屋 ↓ 自己の名で契約 ↓ 問屋自身が契約当事者 ↓ その経済的利益は他人のため","本文：問屋 ↓ 自己の名で契約 ↓ 問屋自身が契約当事者 ↓ その経済的利益は他人のため"],"mode":"commercial"},"20":{"text":"仲立人\t問屋\n自己の名で契約\t原則しない\tする\n契約当事者\t原則ならない\t問屋自身\n役割\t当事者を媒介\t他人のために自己名義で売買\nイメージ\tAとBをつなぐ\t自分が売買する形で他人のために取引","blanks":["問屋","契約","売買"],"options":[["問屋","両者","他人","代理"],["契約","両者","他人","代理"],["売買","両者","他人","代理"]],"explanations":["本文：仲立人\t問屋","本文：自己の名で契約\t原則しない\tする","本文：役割\t当事者を媒介\t他人のために自己名義で売買"],"mode":"commercial"},"21":{"text":"企業活動では、\n商品を運ぶ\nという取引が非常に重要。\n商法では運送について特別な規律がある。\n運送には大きく、\n・物品運送 ・旅客運送\nがある。","blanks":["運送","商法","企業活動"],"options":[["運送","両者","他人","代理"],["商法","両者","他人","代理"],["企業活動","イメージ","タクシー","ポイント"]],"explanations":["本文：商法では運送について特別な規律がある。","本文：商法では運送について特別な規律がある。","本文：企業活動では、"],"mode":"commercial"},"22":{"text":"物品運送とは、\n運送人が荷送人から物品を受け取り、ある場所から別の場所へ運送すること\nである。\n基本構造\n荷送人 ↓ 運送契約 ↓ 運送人 ↓ 物品を運送 ↓ 荷受人","blanks":["運送","契約","荷送人"],"options":[["運送","両者","他人","代理"],["契約","両者","他人","代理"],["荷送人","C自身","代理商","仲立人"]],"explanations":["本文：物品運送とは、","本文：荷送人 ↓ 運送契約 ↓ 運送人 ↓ 物品を運送 ↓ 荷受人","本文：運送人が荷送人から物品を受け取り、ある場所から別の場所へ運送すること"],"mode":"commercial"},"23":{"text":"運送中に、\n・物品が破損する ・紛失する ・到着が遅れる\nなどの問題が起きることがある。\nそこで、\n運送人がどのような責任を負うのか\nが問題となる。\nここでも民法上の債務不履行責任などと、商法上の特則を組み合わせて考える。","blanks":["運送","責任","商法"],"options":[["運送","両者","他人","代理"],["責任","両者","他人","代理"],["商法","両者","他人","代理"]],"explanations":["本文：運送中に、","本文：運送人がどのような責任を負うのか","本文：ここでも民法上の債務不履行責任などと、商法上の特則を組み合わせて考える。"],"mode":"commercial"},"24":{"text":"旅客運送は、\n人をある場所から別の場所へ運ぶこと\nである。\n例えば、\n・鉄道 ・バス ・タクシー ・航空 など。\n旅客の生命・身体に関わるため、安全確保が特に重要となる。","blanks":["運送","旅客の生命","場所"],"options":[["運送","両者","他人","代理"],["旅客の生命","流通させる","イメージ","タクシー"],["場所","両者","他人","代理"]],"explanations":["本文：旅客運送は、","本文：旅客の生命・身体に関わるため、安全確保が特に重要となる。","本文：人をある場所から別の場所へ運ぶこと"],"mode":"commercial"},"25":{"text":"寄託とは、\n他人の物を預かる契約\nである。\n民法にも寄託がある。\n商法では、\n商人が営業として物を預かる場合\nについて、商事寄託として特別な問題が生じる。","blanks":["商法","商人","契約"],"options":[["商法","両者","他人","代理"],["商人","両者","他人","代理"],["契約","両者","他人","代理"]],"explanations":["本文：商法では、","本文：商人が営業として物を預かる場合","本文：他人の物を預かる契約"],"mode":"commercial"},"26":{"text":"倉庫営業とは、\n他人の物品を保管することを業とする営業\nである。\n例えば、\n商品 ↓ 倉庫業者 ↓ 保管 ↓ 必要な時に返還\nという仕組み。","blanks":["営業","保管","返還"],"options":[["営業","両者","他人","代理"],["保管","両者","他人","代理"],["返還","両者","他人","代理"]],"explanations":["本文：倉庫営業とは、","本文：他人の物品を保管することを業とする営業","本文：商品 ↓ 倉庫業者 ↓ 保管 ↓ 必要な時に返還"],"mode":"commercial"},"27":{"text":"倉庫営業では、\n預かった物品を表す証券\nが利用されることがある。\nこれは、\n保管されている商品を取引・流通させる\nために重要な制度となる。","blanks":["営業","保管","流通させる"],"options":[["営業","両者","他人","代理"],["保管","両者","他人","代理"],["流通させる","旅客の生命","イメージ","タクシー"]],"explanations":["本文：倉庫営業では、","本文：保管されている商品を取引・流通させる","本文：保管されている商品を取引・流通させる"],"mode":"commercial"},"28":{"text":"民法上の寄託\t商事寄託\n基本\t物を預ける\t営業として物を預かる\n主体\t一般私人\t商人等\n目的\t一般的保管\t企業活動として保管\n特則\t民法\t商法上の特則","blanks":["保管","商法","商人"],"options":[["保管","両者","他人","代理"],["商法","両者","他人","代理"],["商人","両者","他人","代理"]],"explanations":["本文：目的\t一般的保管\t企業活動として保管","本文：特則\t民法\t商法上の特則","本文：主体\t一般私人\t商人等"],"mode":"commercial"},"29":{"text":"商人間売買を全体で見る。\n売主\n↓\n商品を引き渡す\n↓\n買主\n↓\n検査\n↓\n問題があれば通知\n↓\n契約不適合等の処理\n企業間では、\n問題を早期に発見・通知して取引関係を安定させる\nことが重要になる。","blanks":["商人","契約","売買"],"options":[["商人","両者","他人","代理"],["契約","両者","他人","代理"],["売買","両者","他人","代理"]],"explanations":["本文：商人間売買を全体で見る。","本文：契約不適合等の処理","本文：商人間売買を全体で見る。"],"mode":"commercial"},"30":{"text":"商取引では、\n本人 ↓ 代理人 ↓ 第三者\nという取引が頻繁に発生する。\nそこで、\n・支配人 ・代理商 ・問屋 ・仲立人\nなどの制度が存在する。\nそれぞれ、\n「誰のために、誰の名で、どのような権限で行動するのか」\nを確認する。","blanks":["代理","仲立人","支配人"],"options":[["代理","両者","他人","会社"],["仲立人","C自身","代理商","借りる"],["支配人","C自身","代理商","仲立人"]],"explanations":["本文：本人 ↓ 代理人 ↓ 第三者","本文：・支配人 ・代理商 ・問屋 ・仲立人","本文：・支配人 ・代理商 ・問屋 ・仲立人"],"mode":"commercial"},"31":{"text":"商人が相手方に対して債権を持っている場合、\n相手方の物を留置して債権回収を確保する\nことが重要になる場合がある。\nしたがって商法では、\n商取引の信用を確保するための担保的制度\nとして商人間留置権が重要になる。","blanks":["商人","商法","留置"],"options":[["商人","両者","他人","代理"],["商法","両者","他人","代理"],["留置","両者","他人","代理"]],"explanations":["本文：商人が相手方に対して債権を持っている場合、","本文：したがって商法では、","本文：相手方の物を留置して債権回収を確保する"],"mode":"commercial"},"32":{"text":"ここまでの制度をまとめると、\n企業取引\n↓\n大量・反復\n↓\n迅速な処理が必要\n↓\n商法上の特則\n│\n├─ 商人間売買\n├─ 商人間留置権\n├─ 代理商\n├─ 仲立人\n├─ 問屋\n├─ 運送\n└─ 倉庫・寄託\nとなる。","blanks":["商人","代理商","仲立人"],"options":[["商人","両者","他人","代理"],["代理商","C自身","仲立人","借りる"],["仲立人","C自身","代理商","借りる"]],"explanations":["本文：├─ 商人間売買","本文：├─ 代理商","本文：├─ 仲立人"],"mode":"commercial"},"33":{"text":"商行為を理解するとき、\n商法だけを見る\nのではなく、\n民法＋商法\nとして見る。\n例えば売買なら、\n民法 ↓ 契約成立 ↓ 売買の基本ルール\n商法 ↓ 商人間売買の特則 ↓ 検査・通知等\nという関係になる。","blanks":["商法","売買","商行為"],"options":[["商法","両者","他人","代理"],["売買","両者","他人","代理"],["商行為","C自身","代理商","仲立人"]],"explanations":["本文：商法だけを見る","本文：例えば売買なら、","本文：商行為を理解するとき、"],"mode":"commercial"},"34":{"text":"A社がB社から商品1,000個を購入した。\n商品を受け取ったB社は、\n「とりあえず倉庫に入れておこう」\nと考え、長期間検査しなかった。\n後日、\n「100個が契約内容と違う」\nと主張した。\nこの場合、\n① 商人間の売買か ② 商品を受け取ったか ③ 検査をしたか ④ 契約不適合を発見したか ⑤ 必要な通知をしたか\nを順番に確認する。","blanks":["契約","商人","売買"],"options":[["契約","両者","他人","代理"],["商人","両者","他人","代理"],["売買","両者","他人","代理"]],"explanations":["本文：「100個が契約内容と違う」","本文：① 商人間の売買か ② 商品を受け取ったか ③ 検査をしたか ④ 契約不適合を発見したか ⑤ 必要な通知をしたか","本文：① 商人間の売買か ② 商品を受け取ったか ③ 検査をしたか ④ 契約不適合を発見したか ⑤ 必要な通知をしたか"],"mode":"commercial"},"35":{"text":"AがBに、\n「私のために商品を売ってほしい」\nと依頼した。\nBは自分の名前でCに商品を販売した。\nこの場合、\nBが自己の名で取引している点から、\n問屋\nの制度が問題となる。\n「他人のために行動している」だけで代理とは判断しない。\n重要なのは、\n誰の名義で契約したのか\nである。","blanks":["問屋","契約","代理"],"options":[["問屋","両者","他人","代理"],["契約","両者","他人","代理"],["代理","両者","他人","会社"]],"explanations":["本文：問屋","本文：誰の名義で契約したのか","本文：「他人のために行動している」だけで代理とは判断しない。"],"mode":"commercial"},"36":{"text":"AとBが直接知り合っていない。\nCが両者を紹介し、契約を成立させた。\nC自身は契約当事者になっていない。\nこの場合、\n仲立\nが問題となる。","blanks":["契約","直接知","C自身"],"options":[["契約","両者","他人","代理"],["直接知","C自身","代理商","仲立人"],["C自身","代理商","仲立人","借りる"]],"explanations":["本文：Cが両者を紹介し、契約を成立させた。","本文：AとBが直接知り合っていない。","本文：C自身は契約当事者になっていない。"],"mode":"commercial"},"37":{"text":"会社の支配人Aが、\n会社の営業について第三者Bと契約した。\n支配人には営業について広範な代理権があるため、\nAが会社を代理して契約した\nという構造になる。\nここでは、\n支配人 ↓ 会社のため ↓ 会社を代理 ↓ 第三者と契約\nという流れを理解する。","blanks":["会社","支配人","契約"],"options":[["会社","両者","他人","代理"],["支配人","C自身","代理商","仲立人"],["契約","両者","他人","代理"]],"explanations":["本文：会社の支配人Aが、","本文：会社の支配人Aが、","本文：会社の営業について第三者Bと契約した。"],"mode":"commercial"},"38":{"text":"第2編では、次の5本柱を押さえる。\n① 商人間取引 ② 商事代理・営業補助 ③ 仲立・問屋 ④ 運送・寄託・倉庫 ⑤ 取引安全のための特則","blanks":["取引安全","運送","商人"],"options":[["取引安全","イメージ","タクシー","ポイント"],["運送","両者","他人","代理"],["商人","両者","他人","代理"]],"explanations":["本文：① 商人間取引 ② 商事代理・営業補助 ③ 仲立・問屋 ④ 運送・寄託・倉庫 ⑤ 取引安全のための特則","本文：① 商人間取引 ② 商事代理・営業補助 ③ 仲立・問屋 ④ 運送・寄託・倉庫 ⑤ 取引安全のための特則","本文：① 商人間取引 ② 商事代理・営業補助 ③ 仲立・問屋 ④ 運送・寄託・倉庫 ⑤ 取引安全のための特則"],"mode":"commercial"},"39":{"text":"制度\t誰が？\t誰のため？\t誰の名で？\n支配人\t商業使用人\t商人\t商人を代理\n代理商\t独立した補助者\t商人\t原則、代理・媒介\n仲立人\t独立した媒介者\t当事者\t自分は当事者にならない\n問屋\t問屋\t委託者\t自己の名\n運送人\t運送業者\t荷送人等\t自己の営業\n倉庫業者\t倉庫業者\t寄託者\t自己の営業","blanks":["商人","代理","問屋"],"options":[["商人","両者","他人","代理"],["代理","両者","他人","会社"],["問屋","両者","他人","代理"]],"explanations":["本文：支配人\t商業使用人\t商人\t商人を代理","本文：支配人\t商業使用人\t商人\t商人を代理","本文：問屋\t問屋\t委託者\t自己の名"],"mode":"commercial"},"40":{"text":"商行為の問題が出たら、次の順番で考える。\n① 誰が？\n↓\n商人か？\n② 何を？\n↓\nどのような商行為か？\n③ 誰のため？\n↓\n自己のため？\n他人のため？\n④ 誰の名で？\n↓\n自己の名？\n本人の名？\n⑤ どのような特則？\n↓\n売買？\n代理？\n問屋？\n仲立？\n運送？\n寄託？\nこの順番で考えると混乱しにくい。","blanks":["商行為","商人","問屋"],"options":[["商行為","C自身","代理商","仲立人"],["商人","両者","他人","代理"],["問屋","両者","他人","代理"]],"explanations":["本文：商行為の問題が出たら、次の順番で考える。","本文：商人か？","本文：問屋？"],"mode":"commercial"},"41":{"text":"商行為の核心は、\n企業活動では、大量・反復・迅速な取引が行われるため、民法だけではなく商法上の特別ルールが必要になる\nということ。\nそのため、\n商人間売買 ↓ 検査・通知\n商人間取引 ↓ 留置\n営業補助 ↓ 支配人・代理商\n取引の媒介 ↓ 仲立人\n他人のための自己名義取引 ↓ 問屋\n物の移動 ↓ 運送\n物の保管 ↓ 寄託・倉庫\nという制度が存在する。","blanks":["商人","代理商","商行為"],"options":[["商人","両者","他人","代理"],["代理商","C自身","仲立人","借りる"],["商行為","C自身","代理商","仲立人"]],"explanations":["本文：商人間売買 ↓ 検査・通知","本文：営業補助 ↓ 支配人・代理商","本文：商行為の核心は、"],"mode":"commercial"},"42":{"text":"以下を何も見ずに説明する。\nQ1\n商行為とは何か。\nQ2\n絶対的商行為・営業的商行為・付属的商行為の違いは何か。\nQ3\n商人間売買で検査・通知が重要なのはなぜか。\nQ4\n商人間留置権とは何か。\nQ5\n代理商とは何か。\nQ6\n支配人と代理商の違いは何か。\nQ7\n仲立人とは何か。\nQ8\n問屋とは何か。\nQ9\n問屋と代理人は何が違うか。\nQ10\n仲立人と問屋は何が違うか。\nQ11\n物品運送とは何か。\nQ12\n倉庫営業とは何か。\nQ13\n商法上、取引安全が重視されるのはなぜか。\nQ14\n商行為を民法と商法の両方から考える必要があるのはなぜか。","blanks":["商行為","問屋","代理"],"options":[["商行為","C自身","代理商","仲立人"],["問屋","両者","他人","代理"],["代理","両者","他人","会社"]],"explanations":["本文：商行為とは何か。","本文：問屋とは何か。","本文：代理商とは何か。"],"mode":"commercial"},"43":{"text":"商行為 ↓ 商人が行う企業取引 ↓ 大量・反復・迅速 ↓ 特別なルールが必要 ↓ 商法\nその具体的制度として、\n商人間売買\n↓\n検査・通知\n商人間取引\n↓\n留置\n営業補助\n↓\n支配人・代理商\n媒介\n↓\n仲立人\n他人のために自己名義で取引\n↓\n問屋\n物の運送\n↓\n運送\n物の保管\n↓\n寄託・倉庫\nという体系になる。\n★ 第2編の最重要ポイント\n① 商人間売買\n商品を受け取った買主の検査・通知が重要。\n② 代理商\n独立した立場で商人の営業を補助する。\n③ 仲立人\n当事者間の商行為を媒介する。\n④ 問屋\n他人のために、自己の名で物品の販売・買入れをする。\n⑤ 運送・倉庫\n企業活動に不可欠な物の移動・保管を規律する。\n⑥ 商法の目的\n最終的には、\n企業取引を安全・迅速・円滑にすること\nにつながっている。\n第2編 完成\n第1編 商法総論 ↓ 商人・営業・商行為・商号・商業登記・支配人等\n第2編 商行為 ↓ 商人間売買・商事代理・代理商・仲立・問屋・運送・寄託・倉庫等\n↓\n第3編 会社法総論\n次からは「商人が行う取引」ではなく、いよいよ**「会社という組織そのもの」**を学ぶ。","blanks":["商人","商行為","運送"],"options":[["商人","両者","他人","代理"],["商行為","C自身","代理商","仲立人"],["運送","両者","他人","代理"]],"explanations":["本文：商行為 ↓ 商人が行う企業取引 ↓ 大量・反復・迅速 ↓ 特別なルールが必要 ↓ 商法","本文：商行為 ↓ 商人が行う企業取引 ↓ 大量・反復・迅速 ↓ 特別なルールが必要 ↓ 商法","本文：物の運送"],"mode":"commercial"}},"3":{"1":{"text":"会社法とは、\n会社という企業組織の設立・運営・管理・解散などを規律する法律\nである。\n商法総論・商行為では、\n「商人がどのように営業・取引をするか」\nを中心に学んだ。\n会社法では、\n「企業をどのような組織として運営するか」\nを中心に学ぶ。\n全体のつながり\n商法総論 ↓ 商人・営業\n第2編 ↓ 商取引\n第3編 ↓ 会社という組織\n第4編以降 ↓ 株式会社などの具体的制度","blanks":["会社","営業","商法"],"options":[["会社","両方","債務","出資"],["営業","両方","会社","債務"],["商法","両方","会社","債務"]],"explanations":["本文：会社法とは、","本文：「商人がどのように営業・取引をするか」","本文：商法総論・商行為では、"],"mode":"commercial"},"2":{"text":"会社とは、\n一定の事業目的を実現するために組織された法人\nである。\n会社には、\n•\t株式会社\n•\t合名会社\n•\t合資会社\n•\t合同会社\nがある。\n会社法では、それぞれについて異なるルールを定めている。","blanks":["会社","株式","事業目的"],"options":[["会社","両方","債務","出資"],["株式","両方","会社","債務"],["事業目的","人的関係","取締役会","合資会社"]],"explanations":["本文：会社とは、","本文：•\t株式会社","本文：一定の事業目的を実現するために組織された法人"],"mode":"commercial"},"3":{"text":"会社法を理解するうえで最も重要な概念の一つが、\n法人格\nである。\n会社は、法律上独立した人格を持つ。\nつまり、\n会社自身が、\n•\t財産を持つ\n•\t契約する\n•\t債務を負う\n•\t裁判の当事者になる\nことができる。\nイメージ\n出資者 ↓ 会社を設立 ↓ 会社 ↓ 独立した権利義務の主体","blanks":["会社","法人格","設立"],"options":[["会社","両方","債務","出資"],["法人格","ルール","債権者","剰余金"],["設立","両方","会社","債務"]],"explanations":["本文：会社法を理解するうえで最も重要な概念の一つが、","本文：法人格","本文：出資者 ↓ 会社を設立 ↓ 会社 ↓ 独立した権利義務の主体"],"mode":"commercial"},"4":{"text":"例えばAが株式会社に1,000万円を出資した。\nその場合、\nA ≠ 株式会社\nである。\n会社の財産は会社の財産であり、A個人の財産ではない。\n逆に、A個人の財産も会社の財産ではない。\n重要\n「会社に出資した＝会社の財産を自分が所有する」\nではない。\n出資によって得られるのは、会社の種類に応じた社員としての地位・株式などである。","blanks":["会社","株式","出資"],"options":[["会社","両方","債務","出資"],["株式","両方","会社","債務"],["出資","両方","会社","債務"]],"explanations":["本文：例えばAが株式会社に1,000万円を出資した。","本文：例えばAが株式会社に1,000万円を出資した。","本文：例えばAが株式会社に1,000万円を出資した。"],"mode":"commercial"},"5":{"text":"法人格があることで、\n企業活動の主体を「会社自身」にすることができる。\n例えば、\n株式会社A ↓ 土地を購入 ↓ 土地の所有者 ↓ 株式会社A\nとなる。\n株主個人が土地を所有するわけではない。","blanks":["会社","株式","法人格"],"options":[["会社","両方","債務","出資"],["株式","両方","会社","債務"],["法人格","ルール","債権者","剰余金"]],"explanations":["本文：企業活動の主体を「会社自身」にすることができる。","本文：株式会社A ↓ 土地を購入 ↓ 土地の所有者 ↓ 株式会社A","本文：法人格があることで、"],"mode":"commercial"},"6":{"text":"会社には独立した財産がある。\n会社財産\n≠\n株主・社員個人の財産\nこの財産の独立があることで、\n会社を一つの独立した経済主体として運営できる。\nこれが法人制度の重要な意味である。","blanks":["会社","株主","独立"],"options":[["会社","両方","債務","出資"],["株主","両方","会社","債務"],["独立","両方","会社","債務"]],"explanations":["本文：会社には独立した財産がある。","本文：株主・社員個人の財産","本文：会社には独立した財産がある。"],"mode":"commercial"},"7":{"text":"会社には、\n目的\nが必要である。\n目的とは、\n会社が行う事業活動の基本的範囲\nを示すもの。\n例えば、\n•\t飲食店経営\n•\t不動産業\n•\t運送業\n•\tソフトウェア開発\nなど。\n会社は定款に定められた目的を基礎として活動する。","blanks":["会社","運送","定款"],"options":[["会社","両方","債務","出資"],["運送","両方","会社","債務"],["定款","両方","会社","債務"]],"explanations":["本文：会社には、","本文：•\t運送業","本文：会社は定款に定められた目的を基礎として活動する。"],"mode":"commercial"},"8":{"text":"定款とは、\n会社の組織・運営に関する基本ルールを定めたもの\nである。\n会社にとって、\n「会社の憲法」\nのような役割を果たす。\n定款には、\n•\t目的\n•\t商号\n•\t本店所在地\n•\t機関\n•\t株式 など、会社に関する重要事項を定める。","blanks":["会社","定款","商号"],"options":[["会社","両方","債務","出資"],["定款","両方","会社","債務"],["商号","両方","会社","債務"]],"explanations":["本文：会社の組織・運営に関する基本ルールを定めたもの","本文：定款とは、","本文：•\t商号"],"mode":"commercial"},"9":{"text":"会社は、一定の手続きを経て成立する。\n特に株式会社では、\n発起人\n↓\n定款作成\n↓\n出資\n↓\n設立手続\n↓\n設立登記\n↓\n株式会社成立\nという流れを基本として理解する。","blanks":["会社","株式","設立"],"options":[["会社","両方","債務","出資"],["株式","両方","会社","債務"],["設立","両方","会社","債務"]],"explanations":["本文：会社は、一定の手続きを経て成立する。","本文：特に株式会社では、","本文：設立手続"],"mode":"commercial"},"10":{"text":"会社は、\n設立登記によって成立する\nというのが株式会社の重要なポイント。\nつまり、\n定款を作った ↓ まだ会社成立ではない\n出資した ↓ まだ会社成立ではない\n設立登記 ↓ 会社成立\nという構造である。","blanks":["会社","設立","登記"],"options":[["会社","両方","債務","出資"],["設立","両方","会社","債務"],["登記","両方","会社","債務"]],"explanations":["本文：会社は、","本文：設立登記によって成立する","本文：設立登記によって成立する"],"mode":"commercial"},"11":{"text":"会社法上の会社は4種類。\n会社\n│\n├─ 株式会社\n│\n├─ 合名会社\n│\n├─ 合資会社\n│\n└─ 合同会社\n後3者をまとめて、\n持分会社\nという。","blanks":["会社","株式","種類"],"options":[["会社","両方","債務","出資"],["株式","両方","会社","債務"],["種類","両方","会社","債務"]],"explanations":["本文：会社法上の会社は4種類。","本文：├─ 株式会社","本文：会社法上の会社は4種類。"],"mode":"commercial"},"12":{"text":"株式会社は、\n株式を発行して出資を集める会社\nである。\n株主は、\n株式を持つことによって会社への社員としての地位を持つ。\n株式会社では、\n所有と経営を分離しやすい\nという特徴がある。","blanks":["会社","株式","株主"],"options":[["会社","両方","債務","出資"],["株式","両方","会社","債務"],["株主","両方","会社","債務"]],"explanations":["本文：株式会社は、","本文：株式会社は、","本文：株主は、"],"mode":"commercial"},"13":{"text":"株式会社に出資して株式を取得した者を、\n株主\nという。\n株主は会社そのものを所有しているのではない。\n株主が持っているのは、\n株式という権利\nである。\n重要\n会社 ↓ 法人\n株主 ↓ 株式を持つ者\nしたがって、\n会社＝株主\nではない。","blanks":["株主","会社","株式"],"options":[["株主","両方","会社","債務"],["会社","両方","債務","出資"],["株式","両方","会社","債務"]],"explanations":["本文：株主","本文：株式会社に出資して株式を取得した者を、","本文：株式会社に出資して株式を取得した者を、"],"mode":"commercial"},"14":{"text":"株式とは、\n株式会社における社員としての地位を細分化したもの\nと理解する。\n例えば、\nAが100株保有 ↓ Aは株主 ↓ 100株分の株主としての権利\nとなる。\n株式を通じて、\n•\t配当を受ける権利\n•\t株主総会で議決する権利\n•\t残余財産の分配を受ける権利\nなどが問題になる。","blanks":["株式","株主","会社"],"options":[["株式","両方","会社","債務"],["株主","両方","会社","債務"],["会社","両方","債務","出資"]],"explanations":["本文：株式とは、","本文：Aが100株保有 ↓ Aは株主 ↓ 100株分の株主としての権利","本文：株式会社における社員としての地位を細分化したもの"],"mode":"commercial"},"15":{"text":"会社法上の「社員」は、\n一般的な意味の従業員ではない。\nここは非常に重要。\n会社法でいう社員とは、\n会社に出資し、その会社の構成員となる者\nという意味である。\n例えば\n株式会社 ↓ 株主\n合同会社 ↓ 社員\nという関係。","blanks":["会社","株式","株主"],"options":[["会社","両方","債務","出資"],["株式","両方","会社","債務"],["株主","両方","会社","債務"]],"explanations":["本文：会社法上の「社員」は、","本文：株式会社 ↓ 株主","本文：株式会社 ↓ 株主"],"mode":"commercial"},"16":{"text":"株式会社では、\n株主＝社員\nである。\nここでいう「社員」は従業員ではない。\nしたがって、\n「会社の社員です」\nという日常語と、\n「会社法上の社員」\nは区別する。","blanks":["会社","株式","株主"],"options":[["会社","両方","債務","出資"],["株式","両方","会社","債務"],["株主","両方","会社","債務"]],"explanations":["本文：株式会社では、","本文：株式会社では、","本文：株主＝社員"],"mode":"commercial"},"17":{"text":"合名会社・合資会社・合同会社を、\n持分会社\nという。\n持分会社では、\n社員と会社との人的関係\nが株式会社より強く表れる。","blanks":["会社","株式","人的関係"],"options":[["会社","両方","債務","出資"],["株式","両方","会社","債務"],["人的関係","事業目的","取締役会","合資会社"]],"explanations":["本文：合名会社・合資会社・合同会社を、","本文：が株式会社より強く表れる。","本文：社員と会社との人的関係"],"mode":"commercial"},"18":{"text":"合名会社は、\n社員全員が無限責任社員\nとなる会社。\nつまり、会社の債務について、\n社員が会社財産だけで足りない場合に、一定の範囲で直接責任を負う\nという構造を持つ。","blanks":["会社","責任","債務"],"options":[["会社","両方","債務","出資"],["責任","両方","会社","債務"],["債務","両方","会社","出資"]],"explanations":["本文：合名会社は、","本文：社員全員が無限責任社員","本文：つまり、会社の債務について、"],"mode":"commercial"},"19":{"text":"合資会社には、\n無限責任社員と有限責任社員\nの両方が存在する。\n合資会社\n│\n├─ 無限責任社員\n│\n└─ 有限責任社員","blanks":["責任","合資会社","両方"],"options":[["責任","両方","会社","債務"],["合資会社","事業目的","人的関係","取締役会"],["両方","会社","債務","出資"]],"explanations":["本文：無限責任社員と有限責任社員","本文：合資会社には、","本文：の両方が存在する。"],"mode":"commercial"},"20":{"text":"合同会社は、\n社員全員が有限責任社員\nとなる持分会社。\n株式会社と同じく、\n出資者の責任を限定する\nことができる。\n一方で、株式会社よりも柔軟な内部組織を構築できる。","blanks":["会社","株式","責任"],"options":[["会社","両方","債務","出資"],["株式","両方","会社","債務"],["責任","両方","会社","債務"]],"explanations":["本文：合同会社は、","本文：株式会社と同じく、","本文：社員全員が有限責任社員"],"mode":"commercial"},"21":{"text":"会社\t社員の責任\n株式会社\t株主は間接有限責任\n合名会社\t全員無限責任\n合資会社\t無限責任＋有限責任\n合同会社\t全員有限責任\nここは会社法の基本暗記事項。","blanks":["会社","責任","株式"],"options":[["会社","両方","債務","出資"],["責任","両方","会社","債務"],["株式","両方","会社","債務"]],"explanations":["本文：会社\t社員の責任","本文：会社\t社員の責任","本文：株式会社\t株主は間接有限責任"],"mode":"commercial"},"22":{"text":"会社法では、\n直接責任・間接責任\nという考え方がある。\n直接責任\n会社の債権者に対して、社員が直接責任を負う。\n間接責任\n社員は原則として会社に対して出資義務を負い、会社債権者に直接責任を負わない。\n株式会社の株主は、\n間接有限責任\nである。","blanks":["会社","責任","債権者"],"options":[["会社","両方","債務","出資"],["責任","両方","会社","債務"],["債権者","ルール","剰余金","取締役"]],"explanations":["本文：会社法では、","本文：直接責任・間接責任","本文：会社の債権者に対して、社員が直接責任を負う。"],"mode":"commercial"},"23":{"text":"有限責任とは、\n出資者の責任が一定範囲に限定されること\nである。\n例えば、\nAが株式会社に100万円出資 ↓ 会社が1,000万円の債務 ↓ 原則としてAが個人財産から900万円を追加で払うわけではない\nという仕組み。","blanks":["会社","責任","出資"],"options":[["会社","両方","債務","出資"],["責任","両方","会社","債務"],["出資","両方","会社","債務"]],"explanations":["本文：Aが株式会社に100万円出資 ↓ 会社が1,000万円の債務 ↓ 原則としてAが個人財産から900万円を追加で払うわけではない","本文：有限責任とは、","本文：出資者の責任が一定範囲に限定されること"],"mode":"commercial"},"24":{"text":"無限責任では、\n会社財産だけでは債務を弁済できない場合、社員が一定の範囲で追加的に責任を負う。\nそのため、\n合名会社 ↓ 社員全員が無限責任\nという点は重要。","blanks":["責任","会社","債務"],"options":[["責任","両方","会社","債務"],["会社","両方","債務","出資"],["債務","両方","会社","出資"]],"explanations":["本文：無限責任では、","本文：会社財産だけでは債務を弁済できない場合、社員が一定の範囲で追加的に責任を負う。","本文：会社財産だけでは債務を弁済できない場合、社員が一定の範囲で追加的に責任を負う。"],"mode":"commercial"},"25":{"text":"株式会社\t持分会社\n中心\t株式・資本\t社員・人的関係\n社員\t株主\t社員\n経営\t所有と経営を分離しやすい\t社員が経営する構造\n責任\t株主は有限責任\t会社によって異なる\n組織\t比較的制度化\t比較的柔軟","blanks":["会社","株式","株主"],"options":[["会社","両方","債務","出資"],["株式","両方","会社","債務"],["株主","両方","会社","債務"]],"explanations":["本文：株式会社\t持分会社","本文：株式会社\t持分会社","本文：社員\t株主\t社員"],"mode":"commercial"},"26":{"text":"株式会社では、\n株主 ↓ 資本を出す\n取締役 ↓ 会社を経営する\nという分離が可能である。\nこれを、\n所有と経営の分離\nという。\n例えば、\n1,000人の株主がいる会社を、1人の社長・取締役が経営することもできる。","blanks":["会社","取締役","株主"],"options":[["会社","両方","債務","出資"],["取締役","ルール","債権者","剰余金"],["株主","両方","会社","債務"]],"explanations":["本文：株式会社では、","本文：取締役 ↓ 会社を経営する","本文：株主 ↓ 資本を出す"],"mode":"commercial"},"27":{"text":"会社法でいう機関とは、\n会社の意思決定・業務執行・監督などを担う組織\nである。\n株式会社では、\n•\t株主総会\n•\t取締役\n•\t取締役会\n•\t代表取締役\n•\t監査役\nなどが重要になる。\n第4編で詳しく学ぶ。","blanks":["取締役","会社","株主総会"],"options":[["取締役","ルール","債権者","剰余金"],["会社","両方","債務","出資"],["株主総会","事業目的","人的関係","取締役会"]],"explanations":["本文：•\t取締役","本文：会社法でいう機関とは、","本文：•\t株主総会"],"mode":"commercial"},"28":{"text":"株主総会は、\n株主によって構成される株式会社の意思決定機関\nである。\n重要な事項について、\n株主が会社の意思決定に参加する\nための機関。","blanks":["株主","会社","機関"],"options":[["株主","両方","会社","債務"],["会社","両方","債務","出資"],["機関","両方","会社","債務"]],"explanations":["本文：株主総会は、","本文：株主によって構成される株式会社の意思決定機関","本文：株主によって構成される株式会社の意思決定機関"],"mode":"commercial"},"29":{"text":"取締役は、\n株式会社の業務執行を担う重要な機関\nである。\n会社の経営について意思決定を行い、業務を執行する。\nただし、取締役会設置会社では、取締役会と代表取締役との権限関係が問題となる。","blanks":["取締役","会社","株式"],"options":[["取締役","ルール","債権者","剰余金"],["会社","両方","債務","出資"],["株式","両方","会社","債務"]],"explanations":["本文：取締役は、","本文：株式会社の業務執行を担う重要な機関","本文：株式会社の業務執行を担う重要な機関"],"mode":"commercial"},"30":{"text":"代表取締役は、\n株式会社を代表して外部との法律関係を形成する者\nである。\nつまり、\n会社内部 ↓ 取締役会などによる意思決定\n会社外部 ↓ 代表取締役 ↓ 第三者と契約\nという構造になる。","blanks":["取締役","会社","第三者"],"options":[["取締役","ルール","債権者","剰余金"],["会社","両方","債務","出資"],["第三者","ルール","債権者","剰余金"]],"explanations":["本文：代表取締役は、","本文：株式会社を代表して外部との法律関係を形成する者","本文：会社外部 ↓ 代表取締役 ↓ 第三者と契約"],"mode":"commercial"},"31":{"text":"会社の経営が適正に行われているかを監督・監査する仕組みも必要。\n代表的なものとして、\n監査役\nなどがある。\n会社法では、会社の規模や機関設計によって監査体制が異なる。","blanks":["会社","監査役","機関"],"options":[["会社","両方","債務","出資"],["監査役","ルール","債権者","剰余金"],["機関","両方","会社","債務"]],"explanations":["本文：会社の経営が適正に行われているかを監督・監査する仕組みも必要。","本文：監査役","本文：会社法では、会社の規模や機関設計によって監査体制が異なる。"],"mode":"commercial"},"32":{"text":"株式会社では、すべての会社が同じ組織構造を持つわけではない。\n会社の規模や公開性などに応じて、\n•\t取締役会\n•\t監査役\n•\t会計参与\n•\t会計監査人\n•\t指名委員会等\n•\t監査等委員会\nなどの機関を組み合わせることができる。\nこの仕組みを、\n機関設計\nという。","blanks":["会社","機関","取締役会"],"options":[["会社","両方","債務","出資"],["機関","両方","会社","債務"],["取締役会","事業目的","人的関係","合資会社"]],"explanations":["本文：株式会社では、すべての会社が同じ組織構造を持つわけではない。","本文：などの機関を組み合わせることができる。","本文：•\t取締役会"],"mode":"commercial"},"33":{"text":"会社法では、\n誰が会社を経営し、誰が監督し、誰が最終的に意思決定するのか\nを明確にする必要がある。\n株主\n↓\n株主総会\n↓\n重要事項を決定\n取締役\n↓\n業務執行\n代表取締役\n↓\n会社を代表\n監査機関\n↓\n監督・監査\n会社法の中心テーマの一つが、\n会社の権限配分\nである。","blanks":["会社","取締役","株主"],"options":[["会社","両方","債務","出資"],["取締役","ルール","債権者","剰余金"],["株主","両方","会社","債務"]],"explanations":["本文：会社法では、","本文：取締役","本文：株主"],"mode":"commercial"},"34":{"text":"株主には大きく、\n自益権\n株主自身の経済的利益に関する権利。\n例： 配当を受ける権利\n共益権\n会社の経営に参加・監督する権利。\n例： 議決権\nという分類がある。","blanks":["株主","会社","配当"],"options":[["株主","両方","会社","債務"],["会社","両方","債務","出資"],["配当","両方","会社","債務"]],"explanations":["本文：株主には大きく、","本文：会社の経営に参加・監督する権利。","本文：例： 配当を受ける権利"],"mode":"commercial"},"35":{"text":"株式会社が利益を上げても、\nその利益が自動的に株主の個人財産になるわけではない。\n会社 ↓ 利益 ↓ 会社財産 ↓ 会社法上の手続 ↓ 剰余金の配当 ↓ 株主\nという流れになる。","blanks":["会社","利益","株主"],"options":[["会社","両方","債務","出資"],["利益","両方","会社","債務"],["株主","両方","会社","債務"]],"explanations":["本文：株式会社が利益を上げても、","本文：株式会社が利益を上げても、","本文：その利益が自動的に株主の個人財産になるわけではない。"],"mode":"commercial"},"36":{"text":"株主は会社財産を直接所有しているわけではない。\n株主が持っているのは、\n株式に基づく権利\nである。\nしたがって、\n会社財産 ↓ 会社のもの\n株式 ↓ 株主のもの\nと区別する。","blanks":["会社","株主","株式"],"options":[["会社","両方","債務","出資"],["株主","両方","会社","債務"],["株式","両方","会社","債務"]],"explanations":["本文：株主は会社財産を直接所有しているわけではない。","本文：株主は会社財産を直接所有しているわけではない。","本文：株式に基づく権利"],"mode":"commercial"},"37":{"text":"会社を設立・運営する際には、\n資本金\nという概念が登場する。\n資本金は単なる「会社が銀行に持っている現金」という意味ではない。\n会社の財産・資本関係を示す会社法上の重要な概念である。","blanks":["会社","設立","資本金"],"options":[["会社","両方","債務","出資"],["設立","両方","会社","債務"],["資本金","ルール","債権者","剰余金"]],"explanations":["本文：会社を設立・運営する際には、","本文：会社を設立・運営する際には、","本文：資本金"],"mode":"commercial"},"38":{"text":"会社の設立や資金調達では、\n出資\nが行われる。\n株式会社では、\n出資 ↓ 株式 ↓ 株主\nという関係になる。\n持分会社では、\n出資 ↓ 社員としての地位\nという形になる。","blanks":["会社","出資","株式"],"options":[["会社","両方","債務","出資"],["出資","両方","会社","債務"],["株式","両方","会社","債務"]],"explanations":["本文：会社の設立や資金調達では、","本文：出資","本文：株式会社では、"],"mode":"commercial"},"39":{"text":"会社には、\n会社に対して債権を持つ者\nがいる。\n例えば、\n•\t銀行\n•\t取引先\n•\t商品の売主\n•\t従業員\nなど。\n会社法では、\n株主の利益だけでなく、会社債権者の保護\nも重要になる。","blanks":["会社","債権者","株主"],"options":[["会社","両方","債務","出資"],["債権者","ルール","剰余金","取締役"],["株主","両方","会社","債務"]],"explanations":["本文：会社には、","本文：株主の利益だけでなく、会社債権者の保護","本文：株主の利益だけでなく、会社債権者の保護"],"mode":"commercial"},"40":{"text":"会社法の関係者を整理する。\n株主\n↓\n出資・経営参加\n↓\n会社\n↓\n事業活動\n↓\n債権者・取引先\n会社法では、\n株主・経営者・会社債権者などの利益をどのように調整するか\nが重要なテーマとなる。","blanks":["会社","債権者","株主"],"options":[["会社","両方","債務","出資"],["債権者","ルール","剰余金","取締役"],["株主","両方","会社","債務"]],"explanations":["本文：会社法の関係者を整理する。","本文：債権者・取引先","本文：株主"],"mode":"commercial"},"41":{"text":"会社の法人格には大きな意味がある。\n会社が債務を負う ↓ 原則として会社が責任を負う ↓ 株主個人は当然には責任を負わない\nこれが株式会社制度の基本構造である。\nただし、\n取締役などの役員が違法行為をした場合\nには、その役員自身の責任が問題となる。","blanks":["会社","責任","法人格"],"options":[["会社","両方","債務","出資"],["責任","両方","会社","債務"],["法人格","ルール","債権者","剰余金"]],"explanations":["本文：会社の法人格には大きな意味がある。","本文：会社が債務を負う ↓ 原則として会社が責任を負う ↓ 株主個人は当然には責任を負わない","本文：会社の法人格には大きな意味がある。"],"mode":"commercial"},"42":{"text":"例えば取締役が、\n•\t法令違反\n•\t定款違反\n•\t善管注意義務違反\n•\t忠実義務違反\nなどをした場合、\n会社に対する責任\nが問題となる。\nさらに一定の場合には、\n第三者に対する責任\nも問題になる。\n第4編で詳しく扱う。","blanks":["責任","取締役","第三者"],"options":[["責任","両方","会社","債務"],["取締役","ルール","債権者","剰余金"],["第三者","ルール","債権者","剰余金"]],"explanations":["本文：会社に対する責任","本文：例えば取締役が、","本文：第三者に対する責任"],"mode":"commercial"},"43":{"text":"会社と株主は別人格だが、\n法人格を悪用して不当な結果を実現しようとする場合\nまで会社の独立性を形式的に認めるとは限らない。\nそこで、\n法人格否認の法理\nが問題になる。\nただし、\n会社と株主を常に同一視する制度ではない。\nあくまで例外的な法理である。","blanks":["会社","法人格","株主"],"options":[["会社","両方","債務","出資"],["法人格","ルール","債権者","剰余金"],["株主","両方","会社","債務"]],"explanations":["本文：会社と株主は別人格だが、","本文：法人格を悪用して不当な結果を実現しようとする場合","本文：会社と株主は別人格だが、"],"mode":"commercial"},"44":{"text":"会社法では、\n株主\n↕\n経営者\n↕\n会社債権者\n↕\n少数株主\nなど、さまざまな利害関係が生じる。\n例えば、\n経営者が会社財産を私的に利用 ↓ 株主・会社債権者の利益が害される\nという問題がある。\nそのため会社法では、\n権限・監督・責任・情報開示\nなどの仕組みが必要になる。","blanks":["会社","株主","債権者"],"options":[["会社","両方","債務","出資"],["株主","両方","会社","債務"],["債権者","ルール","剰余金","取締役"]],"explanations":["本文：会社法では、","本文：株主","本文：会社債権者"],"mode":"commercial"},"45":{"text":"ここまでを整理する。\n会社法\n│\n├─ 会社の設立\n│\n├─ 会社の法人格\n│\n├─ 出資・資本\n│\n├─ 株式・社員\n│\n├─ 機関\n│\n├─ 業務執行\n│\n├─ 監督・監査\n│\n├─ 会社財産\n│\n├─ 役員責任\n│\n├─ 組織再編\n│\n└─ 解散・清算","blanks":["会社","組織再編","法人格"],"options":[["会社","両方","債務","出資"],["組織再編","事業目的","人的関係","取締役会"],["法人格","ルール","債権者","剰余金"]],"explanations":["本文：会社法","本文：├─ 組織再編","本文：├─ 会社の法人格"],"mode":"commercial"},"46":{"text":"会社法では、常に次の順番で考える。\n① 誰が？\n↓\n株主・社員・取締役など\n② 何を持つ？\n↓\n株式・社員の地位・権限\n③ 誰が決める？\n↓\n株主総会・取締役会など\n④ 誰が執行する？\n↓\n取締役・代表取締役など\n⑤ 誰が監督する？\n↓\n監査機関・株主など\n⑥ 誰が責任を負う？\n↓\n会社・役員・社員など","blanks":["取締役","株主","会社"],"options":[["取締役","ルール","債権者","剰余金"],["株主","両方","会社","債務"],["会社","両方","債務","出資"]],"explanations":["本文：株主・社員・取締役など","本文：株主・社員・取締役など","本文：会社法では、常に次の順番で考える。"],"mode":"commercial"},"47":{"text":"株式会社は、\n出資者\n↓\n株主\n↓\n株式\n↓\n株主総会\n↓\n取締役等\n↓\n業務執行\n↓\n会社が事業活動\n↓\n利益\n↓\n剰余金配当等\n↓\n株主\nという流れで理解する。","blanks":["株主","会社","株式"],"options":[["株主","両方","会社","債務"],["会社","両方","債務","出資"],["株式","両方","会社","債務"]],"explanations":["本文：株主","本文：株式会社は、","本文：株式会社は、"],"mode":"commercial"},"48":{"text":"持分会社では、\n社員\n↓\n出資\n↓\n社員としての地位\n↓\n社員による経営\n↓\n会社の事業活動\nという人的なつながりが強い。\nただし、合名・合資・合同では責任関係が異なる。","blanks":["会社","責任","出資"],"options
