う\nことがある。\nそこで、\n仮の差止め\n仮の義務付け\nなどの制度が問題になる。\n行政救済では、\n最終判決だけでは遅すぎる場合の救済\nも重要になる。\n⸻\n【核心】\n行政救済は、\n「処分された後に取り消す」\nだけではない。\n処分前 → 差止め\n処分後 → 取消し\n何もしない → 不作為違法確認\n行政に何かさせたい → 義務付け\nというように、\n行政活動の時間軸\nに応じて制度を選択する。\n⸻","blanks":["義務付け訴訟","差止訴訟","仮の義務付け","仮の差止め"],"options":[["義務付け訴訟","地方公共団体","内閣総理大臣","公権力の行使"],["差止訴訟","比例原則","行政主体","行政機関"],["仮の義務付け","地方公共団体","内閣総理大臣","公権力の行使"],["仮の差止め","法律の優位","法律の留保","行政組織法"]],"mode":"administrative"},"11":{"text":"1　当事者訴訟\n当事者訴訟とは、\n当事者間の公法上の法律関係に関する訴訟\nである。\n⸻\n2　抗告訴訟との違い\n抗告訴訟\n行政庁の公権力行使を争う。\n当事者訴訟\n公法上の法律関係そのものを争う。\n⸻\n3　イメージ\n抗告訴訟\n行政庁\n↓\n処分\n↓\n「その処分を取り消せ」\n当事者訴訟\n公法上の法律関係\n↓\n「自分にはこの権利がある」\n↓\n確認等を求める\n⸻\n4　形式的当事者訴訟\n法律の規定によって、\n実質的には行政処分を争う内容でも、当事者間の法律関係に関する形式で争う\nタイプ。\n基礎段階では、\n「法律が特別に当事者訴訟の形を指定している場合がある」\n程度から理解すればよい。\n⸻\n5　実質的当事者訴訟\n公法上の法律関係そのものを争う。\n例えば、\n公務員の身分関係\nなど、公法上の法律関係について確認を求める場合がある。\n⸻\n6　民衆訴訟\n民衆訴訟とは、\n自己の権利利益とは関係なく、法律上定められた資格に基づいて、公共の利益のために提起する訴訟\nである。\n⸻\n7　代表例\n住民訴訟\n地方公共団体の財務会計上の違法な行為等について、住民が一定の要件の下で提起する。\nここでは、\n「自分が直接損害を受けたから」\nではなく、\n住民として法律上認められた資格\nが基礎になる。\n⸻\n8　機関訴訟\n機関訴訟は、\n国または公共団体の機関相互間における権限の存否・行使に関する争い\nである。\nつまり、\n行政機関A\n↓\n「この権限は私にある」\n↕\n行政機関B\n↓\n「いや、私にある」\nというような争い。\n⸻\n9　私人の権利救済との違い\nここが重要。\n抗告訴訟\n私人の権利利益救済が中心。\n当事者訴訟\n公法上の法律関係の救済。\n民衆訴訟\n公共利益。\n機関訴訟\n行政機関相互の権限争い。\n⸻\n10　4類型比較\n類型\t何を争う？\t主な目的\n抗告訴訟\t行政庁の公権力行使\t権利利益救済\n当事者訴訟\t公法上の法律関係\t法律関係の確定\n民衆訴訟\t公共的事項\t公共利益\n機関訴訟\t機関間の権限\t行政内部の権限調整\n⸻\n【核心】\n行政事件訴訟法の4分類は、\n「誰と誰が、何について争っているのか」\nを見ると理解しやすい。\n⸻","blanks":["当事者訴訟","民衆訴訟","機関訴訟","抗告訴訟"],"options":[["当事者訴訟","法律の優位","法律の留保","行政組織法"],["民衆訴訟","比例原則","行政主体","行政機関"],["機関訴訟","比例原則","行政主体","行政機関"],["抗告訴訟","比例原則","行政主体","行政機関"]],"mode":"administrative"},"12":{"text":"1　国家賠償とは\n国家賠償とは、\n国または公共団体の違法な活動等によって損害を受けた者を、金銭賠償によって救済する制度\nである。\n国家賠償法1条は、公権力の行使に当たる公務員が、職務上、故意または過失によって違法に他人へ損害を加えた場合に、国または公共団体が賠償責任を負うことを定める。\n⸻\n2　国家賠償法の基本構造\n公務員の公権力行使\n↓\n故意・過失\n↓\n違法\n↓\n損害\n↓\n因果関係\n↓\n国家賠償\n⸻\n3　国家賠償法1条\n重要な要件を整理すると、\n① 公権力の行使\n公務員が公権力を行使する場面。\n② 公務員\n国・公共団体の公務員。\n③ 職務行為\n職務を行うについての行為。\n④ 故意または過失\n主観的要件。\n⑤ 違法\n法に反すること。\n⑥ 損害\n財産的・精神的損害等。\n⑦ 因果関係\n行為と損害との間に因果関係があること。\n⸻\n4　公権力の行使\n国家賠償法1条の「公権力の行使」は広く理解されている。\n典型的には、\n•\t許可\n•\t認可\n•\t課税\n•\t規制\n•\t強制\n•\t警察活動\nなど。\nただし、\n行政活動だから全部当然に国家賠償法1条\nと単純に考えるのではなく、\nどの責任類型に該当するのか\nを検討する。\n⸻\n5　違法性\n国家賠償では、\n行政活動が違法だったか\nが中心問題となる。\nここで第3編・第4編・第5編の知識が全部つながる。\n例えば、\n•\t法律違反\n•\t裁量権の逸脱・濫用\n•\t手続違反\n•\t違法な強制\n•\t違法な規制\nなど。\n⸻\n6　故意・過失\n国家賠償法1条は、\n故意または過失\nを要求する。\nしたがって、\n「行政が違法だった」\nだけで直ちに国家賠償が成立するわけではない。\n⸻\n7　損害\n損害には、\n•\t財産的損害\n•\t精神的損害\n•\tその他法律上認められる損害\nなどが問題になる。\n⸻\n8　因果関係\n例えば、\n行政庁の違法行為 ↓ 損害発生\nという関係が必要。\n単に、\n「行政の対応が嫌だった」\nだけでは足りない。\n⸻\n9　国家賠償法2条\n国家賠償法2条は、\n道路、河川その他の公の営造物の設置または管理の瑕疵\nによる損害について定める。\n⸻\n10　1条と2条\n1条\t2条\n中心\t公務員の公権力行使\t公の営造物\n典型\t違法な行政活動\t道路・河川等の瑕疵\nキーワード\t故意・過失・違法\t設置・管理の瑕疵\n⸻\n11　公の営造物\n典型的には、\n•\t道路\n•\t河川\n•\t公園\n•\t公共施設\nなど。\nただし、\nどのような施設が「公の営造物」に該当するか\nは個別に検討する。\n⸻\n12　設置・管理の瑕疵\n公の営造物が、\n通常備えるべき安全性を欠いている\nなどの場合に、設置・管理の瑕疵が問題になる。\n例えば、\n道路に重大な欠陥があり、通常予想される危険を防げない\nなど。\n⸻\n13　国家賠償と取消訴訟\nここは非常に重要。\n取消訴訟\n違法な行政処分をなくしたい。\n国家賠償\n違法な行政活動によって生じた損害を賠償してほしい。\nしたがって、\n違法処分\n↓\n処分を消したい\n→ 取消訴訟\n違法処分による損害を\n賠償してほしい\n→ 国家賠償\nという違いがある。\n⸻\n14　両方を求めることもある\n場合によっては、\n取消し＋国家賠償\nという複数の救済を考えることがある。\n例えば、\n違法な営業停止処分 ↓ 取消訴訟 ＋ 営業できなかった期間の損害について国家賠償\nという発想。\n⸻\n15　国家賠償と民法\n国家賠償法4条は、\n国家賠償法に定めるほか、民法の規定による\nとする。\nしたがって、\n行政法だけで完全に閉じた制度ではない。\n民法との接続も重要。\n⸻\n【核心】\n国家賠償は、\n「違法な行政活動によって生じた損害を、誰がどのように賠償するか」\nという制度。\n⸻","blanks":["国家賠償","公権力の行使","故意または過失","違法"],"options":[["国家賠償","比例原則","行政主体","行政機関"],["公権力の行使","地方公共団体","内閣総理大臣","公共工事契約"],["故意または過失","将来の行政活動","行政指導の限界","代替的作為義務"],["違法","行政","立法","司法"]],"mode":"administrative"},"13":{"text":"1　国家賠償との違い\n国家賠償と損失補償は似ている。\nしかし、根本的に違う。\n国家賠償\n違法\nな行政活動による損害。\n損失補償\n適法\nな公権力行使によって特定の者に特別な犠牲が生じた場合の補償。\n⸻\n2　イメージ\n行政活動\n↓\n違法\n↓\n国家賠償\n一方、\n行政活動\n↓\n適法\n↓\n特定人に特別な犠牲\n↓\n損失補償\n⸻\n3　なぜ適法なのに補償するのか\n例えば、\n公共事業のために、\n特定の土地を強制的に取得する\nとする。\n公共目的のための土地取得自体は、\n法律に基づいて適法に行われる\nことがある。\nしかし、\n特定の人だけが大きな財産的犠牲を負う\nことになる。\nそこで、\n公共のための負担を特定人だけに集中させない\nという公平の考え方から補償が問題になる。\n⸻\n4　憲法29条3項\n財産権について、\n正当な補償\nが問題となる。\nしたがって、\n財産権\n↓\n公共のための適法な制約・収用\n↓\n特別な犠牲\n↓\n正当な補償\nという構造を理解する。\n⸻\n5　国家賠償との比較\n国家賠償\t損失補償\n行政活動\t違法\t適法\n基本的問題\t違法行為による損害\t適法行為による特別な犠牲\n根拠\t国家賠償法等\t憲法29条3項・個別法等\n目的\t違法行為による損害の填補\t公共負担の公平化\n⸻\n6　「適法だから損害は我慢」ではない\nここが重要。\n行政が適法に活動していても、\n特定の者に通常受忍すべき範囲を超える特別な犠牲\nを負わせる場合がある。\nその場合に、\n損失補償\nという考え方が登場する。\n⸻\n7　損失補償の基本構造\n公共目的\n↓\n適法な公権力行使\n↓\n特定人に財産的負担\n↓\n特別の犠牲\n↓\n損失補償\n⸻\n8　国家賠償・損失補償・単なる損害\n行政によって不利益を受けたからといって、\nすべて国家賠償\nでも、\nすべて損失補償\nでもない。\nまず、\n行政活動は違法か、適法か\nを見る。\n⸻\n9　救済の基本分岐\n行政活動\n↓\n不利益・損害\n↓\n違法？\n┌─┴─┐\n↓     ↓\nYES    NO\n↓      ↓\n国家賠償   特別な犠牲？\n┌─┴─┐\nYES   NO\n↓     ↓\n損失補償  原則として\n補償問題なし\nもちろん実際には、個別法や具体的な権利関係をさらに検討する。\n⸻\n第6編　行政救済の統合体系\nここまでの全制度を一つにつなげる。\n⸻\n1　行政救済の全体マップ\n行政活動\n↓\n私人への影響\n↓\n┌──────────────┐\n│ 問題が発生             │\n└──────────────┘\n↓\n何を求める？\n↓\n────────────────────────\n│\n├─ 行政庁に見直してほしい\n│       ↓\n│   行政不服審査\n│       ↓\n│   審査請求\n│       ↓\n│   裁決\n│\n├─ 処分を取り消したい\n│       ↓\n│   取消訴訟\n│\n├─ 処分が無効だと確認したい\n│       ↓\n│   無効等確認訴訟\n│\n├─ 行政が何もしない\n│       ↓\n│   不作為の違法確認\n│\n├─ 行政に処分をさせたい\n│       ↓\n│   義務付け訴訟\n│\n├─ 行政に処分をさせたくない\n│       ↓\n│   差止訴訟\n│\n├─ 公法上の法律関係を争う\n│       ↓\n│   当事者訴訟\n│\n├─ 公共利益のため争う\n│       ↓\n│   民衆訴訟\n│\n├─ 行政機関同士の権限争い\n│       ↓\n│   機関訴訟\n│\n├─ 違法な行政活動で損害\n│       ↓\n│   国家賠償\n│\n└─ 適法な行政活動による特別の犠牲\n↓\n損失補償\n⸻\n2　「行政救済の時間軸」\n行政救済は、\nいつ行政活動が起きたのか\nで考えると分かりやすい。\n【処分前】\n↓\n差止訴訟\n↓\n【処分】\n↓\n取消訴訟\n無効等確認\n↓\n【行政が何もしない】\n↓\n不作為違法確認\n義務付け\n↓\n【損害発生】\n↓\n国家賠償\n⸻\n3　取消訴訟と義務付けの違い\n例えば、\n許可申請を不許可にされた。\n取消訴訟\n「不許可処分を取り消せ」\n義務付け\n「許可処分をしろ」\nこの違いを理解する。\n⸻\n4　差止めと取消し\n差止め\nまだ処分されていない\n取消し\nすでに処分された\n処分前 → 差止め\n処分後 → 取消し\n⸻\n5　国家賠償と取消し\n違法処分\n↓\n処分そのものをなくす\n→ 取消訴訟\n処分によって生じた損害を賠償\n→ 国家賠償\n両者は目的が違う。\n⸻\n6　行政不服審査と行政訴訟\n行政不服審査\t行政事件訴訟\n判断主体\t行政機関\t裁判所\n性質\t行政上の救済\t司法的救済\n対象\t処分等\t行政事件\n違法性\t○\t○\n不当性\t○\t原則として中心ではない\n手続\t比較的簡易・迅速\t訴訟手続\n目的\t行政の是正＋救済\t司法による救済\n⸻\n7　行政救済を「4つの目的」で整理\n行政救済を難しく感じたら、まずこの4つに分類する。\n① 行政をやり直させたい\n→ 行政不服審査\n② 行政処分をなくしたい\n→ 取消訴訟\n③ 行政に何かしてほしい／してほしくない\n→ 義務付け・差止め\n④ お金で救済してほしい\n→ 国家賠償・損失補償\n⸻\n第6編　行政事件の分析方法\n実際の事件を考える場合は、次の順番で整理する。\n⸻\nSTEP 1　行政は何をした？\n処分？\n行政指導？\n行政上の強制？\n事実行為？\n不作為？\n⸻\nSTEP 2　誰が影響を受けた？\n処分の相手方？\n第三者？\n住民？\n事業者？\n公務員？\n⸻\nSTEP 3　何を求める？\n見直してほしい\n↓\n行政不服審査\n取り消してほしい\n↓\n取消訴訟\n無効だと確認してほしい\n↓\n無効等確認\n処分してほしい\n↓\n義務付け\n処分されたくない\n↓\n差止め\n損害賠償してほしい\n↓\n国家賠償\n補償してほしい\n↓\n損失補償\n⸻\nSTEP 4　訴訟なら訴訟要件\n処分性\n↓\n原告適格\n↓\n訴えの利益\n↓\n被告適格\n↓\n出訴期間\n↓\nその他\n⸻\nSTEP 5　本案\nここで初めて、\n行政は違法だったのか\nを検討する。\n⸻\nSTEP 6　救済方法\n最後に、\nどの判決・裁決によって、どこまで権利利益を回復できるのか\nを考える。\n⸻\n第6編　行政救済の専門的思考法\n行政救済では、\n「違法だと思う」\nだけでは足りない。\n専門家は、\n① 行政活動を特定\n↓\n② 法的性質を特定\n↓\n③ 侵害された利益を特定\n↓\n④ 救済目的を特定\n↓\n⑤ 適切な救済制度を選択\n↓\n⑥ 手続・訴訟要件\n↓\n⑦ 違法性・不当性を検討\n↓\n⑧ 最終的な救済方法を検討\nという順序で考える。\n⸻\n第6編　自己確認問題\n問1\n行政不服審査と行政事件訴訟の最大の違いは？\n答え\n行政不服審査は行政機関による行政上の救済であり、行政事件訴訟は裁判所による司法的救済である。\n⸻\n問2\n行政不服審査では「不当」も問題になるか？\n答え\nなる。\n行政不服審査は、違法性だけでなく行政の不当性についても審査対象となり得る。\n⸻\n問3\n取消訴訟とは何か？\n答え\n行政庁の処分または裁決の取消しを求める訴訟。\n⸻\n問4\n取消訴訟の前に確認すべきものは？\n答え\n訴訟要件。特に処分性、原告適格、訴えの利益、被告適格、出訴期間など。\n⸻\n問5\n「却下」と「棄却」の違いは？\n答え\n却下は訴訟要件を満たさず本案判断に入らない場合。棄却は本案について判断した結果、請求を認めない場合。\n⸻\n問6\n行政庁が何もしない場合の代表的な訴訟は？\n答え\n不作為の違法確認訴訟。ただし、実際に処分をさせることまで求めるなら義務付け訴訟が問題になる。\n⸻\n問7\nまだ行政処分がされていない場合に、その処分を止めるための訴訟は？\n答え\n差止訴訟。\n⸻\n問8\n行政庁に一定の処分をさせるための訴訟は？\n答え\n義務付け訴訟。\n⸻\n問9\n国家賠償と損失補償の基本的な違いは？\n答え\n国家賠償は違法な行政活動による損害の賠償、損失補償は適法な公権力行使によって生じた特別の犠牲に対する補償。\n⸻\n問10\n取消訴訟をすれば、当然に損害賠償も認められるか？\n答え\n認められるわけではない。\n取消しと損害賠償は別の救済制度であり、国家賠償の要件を別途検討する。\n⸻\n第6編　最重要事項\nこの編で特に重要なのは、次の12個。\n① 行政救済\n違法・不当な行政から権利利益を守る仕組み。\n② 行政不服審査\n行政に行政を見直させる。\n③ 行政事件訴訟\n裁判所によって行政をコントロールする。\n④ 取消訴訟\n違法な処分を取り消す。\n⑤ 処分性\nそもそも取消訴訟の対象となる行政行為なのか。\n⑥ 原告適格\n誰が裁判を起こせるのか。\n⑦ 訴えの利益\n今、取り消す意味があるのか。\n⑧ 無効等確認\n処分に法的効力が存在するのかを確認する。\n⑨ 不作為違法確認\n行政が何もしないことの違法性を確認する。\n⑩ 義務付け・差止め\n行政に「しろ」／「するな」と求める。\n⑪ 国家賠償\n違法な行政活動による損害を賠償する。\n⑫ 損失補償\n適法な行政活動による特別の犠牲を補償する。\n⸻\n第6編　最終統合図\n行政活動\n↓\n私人への法的影響\n↓\n問題発生\n↓\n┌───────────┐\n│ 何を求める？        │\n└───────────┘\n↓\n【行政に見直させる】\n↓\n行政不服審査\n↓\n審査請求\n↓\n裁決\n【裁判所に争う】\n↓\n行政事件訴訟\n↓\n┌──────────────┐\n│ 抗告訴訟                 │\n│ ↓                        │\n│ 取消訴訟                 │\n│ 無効等確認               │\n│ 不作為違法確認           │\n│ 義務付け                 │\n│ 差止め                   │\n│                          │\n│ 当事者訴訟               │\n│ 民衆訴訟                 │\n│ 機関訴訟                 │\n└──────────────┘\n【損害が発生】\n↓\n違法な行政活動？\n↓　　　　　↓\nYES　　　　 NO\n↓　　　　　 ↓\n国家賠償　　特別な犠牲？\n↓\nYES\n↓\n損失補償\n⸻\n第6編の本質\n第6編を一言でまとめるなら、\n「行政に問題があったとき、誰が、何を、どの手段で、どこまで回復できるのか」\nを学ぶ編である。\nそして行政救済を本当に理解するためには、\n第3編 行政作用\n↓\n第4編 行政手続\n↓\n第5編 実効性確保\n↓\n第6編 行政救済\nという流れで理解する。\n行政は、\n行政行為をする\n↓ 手続を踏む\n↓ 必要なら実効性を確保する\n↓ しかし、その行政活動が違法なら救済が必要になる\n↓ 行政不服審査・行政訴訟・国家賠償・損失補償\nという一連のシステムになっている。\nつまり、第6編は単独で覚えるものではなく、\nこれまで学んだ行政法全体を「私人側から見直す編」\nとして理解する。\nそして次の第7編では、この第1編から第6編までを横断して、\n「実際の行政事件を、行政法の専門家としてどう分析するか」\nという統合的な思考方法に進む。","blanks":["損失補償","適法","特別の犠牲","憲法29条3項"],"options":[["損失補償","比例原則","行政主体","行政機関"],["適法","行政","立法","司法"],["特別の犠牲","法律の優位","法律の留保","行政組織法"],["憲法29条3項","将来の行政活動","行政指導の限界","代替的作為義務"]],"mode":"administrative"}},"7":{"1":{"text":"1　行政法はバラバラの制度の集合ではない\n行政法を勉強していると、\n•\t行政行為\n•\t行政裁量\n•\t行政手続\n•\t行政指導\n•\t行政代執行\n•\t取消訴訟\n•\t国家賠償\n•\t損失補償\nなど、非常に多くの制度が出てくる。\nしかし、これらは独立して存在しているわけではない。\nすべて、\n行政が公権力を使って公共目的を実現することと、それによって生じる私人との関係を法的に調整する\nという一つの問題につながっている。\n⸻\n2　行政法全体の基本構造\n行政法全体を最も大きく見ると、\n公共目的\n↓\n行政活動\n↓\n私人の権利・利益への影響\n↓\n法律によるコントロール\n↓\n必要な行政活動は実現\n↓\n違法・不当な行政活動は是正\n↓\n損害・特別の犠牲には救済\nという構造になる。\n⸻\n3　「法律による行政」が中心軸\n第1編で学んだ、\n法律による行政の原理\nは、第7編でも中心になる。\n行政は、\n「公益のためだから自由にできる」\nわけではない。\n行政が私人の権利・自由を制約する場合、\n法的根拠と法的限界\nが問題になる。\n⸻\n4　行政法の基本原理から制度を見る\n例えば、\n法律による行政\n↓\n行政行為には法的根拠が必要\n↓\n行政手続\n↓\n行政庁の判断過程を適正化\n↓\n行政救済\n↓\n違法な行政を是正\nというつながりになる。\n⸻\n5　比例原則との関係\n行政が適法な目的を持っていても、\n目的に対して手段が過剰\nなら問題になる。\n例えば、\n軽微な違反\nに対して、\n極端に重い行政上の不利益\nを課す場合。\nそこで、\n目的\n↓\n必要な手段\n↓\n必要性\n↓\n相当性\nという視点が必要になる。\n⸻\n6　平等原則との関係\n行政は、\n同じような状況にある者を合理的理由なく異なる扱い\nすることも許されない。\n例えば、\nAには許可する Bには同じ条件なのに理由なく不許可\nという場合、\n平等原則\nとの関係が問題になる。\n⸻\n7　信頼保護との関係\n私人が行政の行為を信頼して行動した場合、\n後から行政が一方的に態度を変える\nことが問題になる場合がある。\nしたがって、\n行政の行為\n↓\n私人の信頼\n↓\n私人が行動\n↓\n行政が変更\n↓\n信頼保護の問題\nとなる。\n⸻\n8　適正手続との関係\n行政が私人に不利益を与える場合、\n結論だけ正しければいい\nわけではない。\n場合によって、\n•\t事前通知\n•\t弁明\n•\t聴聞\n•\t理由提示\n•\t意見提出\nなどの手続が必要になる。\nつまり、\n行政法では「結果」と「過程」の両方をコントロールする。\n⸻\n9　裁量との関係\n行政庁には、\n法律の範囲内で一定の判断余地\nが認められる場合がある。\nしかし、\n裁量＝自由\nではない。\n裁量がある場合でも、\n•\t法律の目的\n•\t考慮すべき事情\n•\t考慮してはいけない事情\n•\t平等\n•\t比例\n•\t信頼保護\n•\t手続\nなどによってコントロールされる。\n⸻\n10　実効性確保との関係\n行政が命令を出しても、\n誰も従わなければ行政目的を達成できない。\nそこで、\n•\t代執行\n•\t直接強制\n•\t執行罰\n•\t強制徴収\n•\t即時強制\nなどが存在する。\nしかし、\n強制力があるから無制限に行使できる\nわけではない。\nここでも、\n法律の根拠・必要性・相当性・手続\nが問題になる。\n⸻\n11　救済との関係\nそして、行政が違法な活動をした場合、\n行政活動\n↓\n私人の権利利益侵害\n↓\n行政不服審査\nまたは\n行政事件訴訟\n↓\n必要に応じて\n国家賠償\nとなる。\n⸻\n12　行政法全体を一つの循環として見る\n公共目的\n↓\n行政活動\n↓\n┌─────────────┐\n│ 法律・憲法による制約 │\n└─────────────┘\n↓\n行政手続・裁量\n↓\n行政目的の実現\n↓\n実効性確保・強制\n↓\n┌─────────────┐\n│ 違法・不当ではないか │\n└─────────────┘\n↓\n┌──────────────┐\n│ 行政救済・国家補償 │\n└──────────────┘\n↓\n行政活動の適正化\n⸻\n【核心】\n行政法を理解する本当のポイントは、\n「行政法の各制度を覚えること」\nではなく、\n「一つの行政活動について、どの制度がどの順番で関係するのかを理解すること」\nである。\n⸻","blanks":["法律による行政","比例原則","平等原則","信頼保護"],"options":[["法律による行政","将来の行政活動","行政指導の限界","代替的作為義務"],["比例原則","行政主体","行政機関","行政行為"],["平等原則","行政主体","行政機関","行政行為"],["信頼保護","行政主体","行政機関","行政行為"]],"mode":"administrative"},"2":{"text":"1　「違法」とは何か\n行政活動について、\n「なんとなくおかしい」\nという感覚だけでは法的な違法性を判断できない。\nまず、\n何のルールに違反しているのか\nを特定する。\n⸻\n2　違法性判断の基本構造\n行政活動\n↓\n適用される法規範\n↓\n行政に何が要求されているか\n↓\n実際に何をしたか\n↓\n両者を比較\n↓\n違法性判断\n⸻\n3　STEP①　行政活動を特定する\nまず、\n行政は何をしたのか？\nを明確にする。\n例えば、\n•\t行政行為\n•\t行政立法\n•\t行政計画\n•\t行政契約\n•\t行政指導\n•\t行政調査\n•\t行政上の強制\n•\t事実行為\n•\t不作為\nなど。\n⸻\n4　なぜ最初に形式を特定するのか\n行政活動の種類によって、\n適用される法律\n必要な手続\n争い方\n違法性の判断方法\nが変わるからである。\n例えば、\n行政処分\nなら取消訴訟が問題になる可能性がある。\n一方、\n行政指導\nなら行政手続法上の行政指導のルールが問題になる。\n⸻\n5　STEP②　行政主体・行政機関を特定する\n次に、\n誰が行政活動を行ったのか\nを確認する。\n例えば、\n•\t国\n•\t都道府県\n•\t市町村\n•\t独立行政法人等\n•\t行政庁\n•\t委員会\nなど。\n⸻\n6　権限の問題\n行政機関が行った行為でも、\nその機関に権限があったのか\nが問題になる。\n例えば、\nA庁には権限がない ↓ A庁が処分 ↓ 権限違反\nという問題。\nしたがって、\n行政組織法上の権限\nも違法性判断につながる。\n⸻\n7　STEP③　根拠法令を特定する\n次に、\nその行政活動は何を根拠にしているのか\nを見る。\n例えば、\n行政庁\n↓\n「営業停止処分をする」\n↓\n根拠法律は？\n↓\n法律の要件は？\nというように調べる。\n⸻\n8　法律の根拠がない場合\n行政が私人の権利・自由を制約する場合、\n法律上の根拠\nが問題になる。\n特に、\n法律の留保\nとの関係を検討する。\n⸻\n9　STEP④　行政活動の要件を見る\n法律に、\n「○○の場合には、△△の処分をすることができる」\nと定められているとする。\nこの場合、\n○○\nに本当に該当するのかを見る。\n⸻\n10　要件裁量と効果裁量\n行政庁に裁量が認められる場合、\n要件裁量\n法律上の要件に該当するかについて判断余地がある。\n効果裁量\n要件に該当した後、どのような処分をするかについて判断余地がある。\nこの区別は、\nどこに行政庁の判断余地が存在するのか\nを見るために重要。\n⸻\n11　STEP⑤　手続を確認する\n実体的に正しくても、\n手続が違法\nとなることがある。\n例えば、\n•\t聴聞を行っていない\n•\t弁明の機会を与えていない\n•\t理由提示が不十分\n•\t意見公募を行っていない\n•\t行政指導の方式に問題がある\nなど。\n⸻\n12　実体と手続\n行政法では、\n実体法上の適法性\nと\n手続法上の適法性\nを分けて考える。\n行政活動\n↓\n┌─────────┬─────────┐\n↓                         ↓\n実体                         手続\n↓                            ↓\n要件を満たす？               手続を守った？\n↓                            ↓\n実体的適法性                 手続的適法性\n⸻\n13　STEP⑥　裁量を確認する\n行政庁に裁量がある場合、\n裁判所は行政庁と同じ立場で自由に再判断するわけではない。\nそこで、\n裁量権の逸脱・濫用\nがないかを見る。\n⸻\n14　裁量審査の基本\n例えば、\n法律 ↓ 「公益上必要な場合、許可を拒否できる」\nとする。\n行政庁が、\n「公益上必要だ」\nとして不許可にした。\nこの場合、\n① 公益上の判断として合理的か\n② 考慮すべき事情を考慮したか\n③ 考慮すべきでない事情を考慮していないか\n④ 他の者と不合理に異なる扱いをしていないか\n⑤ 目的と手段が著しく不均衡ではないか\nなどを見る。\n⸻\n15　STEP⑦　比例・平等・信頼保護\n行政活動が法律上可能でも、\n一般原則との関係\nを検討する。\n比例\n必要以上に重くないか。\n平等\n合理的理由なく差別していないか。\n信頼保護\n私人の正当な信頼を不当に裏切っていないか。\n⸻\n16　STEP⑧　違法性を総合判断\n最終的には、\n権限\n＋\n根拠法\n＋\n要件\n＋\n裁量\n＋\n手続\n＋\n一般原則\n＋\n比例・平等・信頼保護\nを総合して判断する。\n⸻\n17　行政活動の違法性チェックリスト\n□ 誰が行った？\n□ 権限はある？\n□ 根拠法は？\n□ 法律の要件を満たす？\n□ 裁量はある？\n□ 裁量の範囲内？\n□ 考慮事項は適切？\n□ 手続は適法？\n□ 理由提示は十分？\n□ 平等に反しない？\n□ 比例原則に反しない？\n□ 信頼保護に問題はない？\n□ 強制なら法的根拠は？\n□ 実力行使は必要・相当？\n⸻\n【核心】\n行政法上の「違法」は、\n一つの条文だけを見て判断するものではない。\n行政活動全体を、\n権限・根拠・要件・裁量・手続・一般原則\nから多面的に検討する。\n⸻","blanks":["違法性","法規範","行政活動","裁量"],"options":[["違法性","行政法","行政庁","法人格"],["法規範","行政法","行政庁","法人格"],["行政活動","比例原則","行政主体","行政機関"],["裁量","行政","立法","司法"]],"mode":"administrative"},"3":{"text":"1　行政事件の基本モデル\n実際の事件では、\n「市役所が○○した」\nという事実だけが与えられることが多い。\nそこから、\n法的問題を自分で発見する\n必要がある。\n⸻\n2　最初に「事実」を整理する\n法律を読む前に、\n何が起こったのか\nを整理する。\n⸻\n事実整理の5項目\n① 誰が\n② 誰に対して\n③ 何を\n④ いつ\n⑤ どの根拠で\n行ったのか。\n⸻\n3　事実関係を時系列にする\n例えば、\n4月1日\n↓\nAが許可申請\n4月20日\n↓\n行政庁が不許可\n5月1日\n↓\nAが不服申立て\n5月20日\n↓\n行政庁が処分を執行\n6月1日\n↓\nAに損害発生\nこのように整理する。\n⸻\n4　なぜ時系列が重要なのか\n行政救済では、\nいつ何が起きたか\nによって使える制度が変わる。\n例えば、\n処分前\nなら差止め。\n処分後\nなら取消訴訟。\n損害発生後\nなら国家賠償。\nというように、\n時間軸\nが重要になる。\n⸻\n5　法律関係を図にする\n例えば、\n行政庁\n│\n│ 許可・不許可\n↓\n申請者A\n│\n│ 不服\n↓\n審査請求\n│\n↓\n裁決\n│\n↓\n行政訴訟\nとする。\n⸻\n6　行政法では「関係者」が多い\n行政事件では、\n•\t行政庁\n•\t直接の処分相手\n•\t近隣住民\n•\t競争業者\n•\t利害関係人\n•\t国\n•\t地方公共団体\nなど、複数の当事者が存在することがある。\nしたがって、\n誰の利益が問題なのか\nを常に確認する。\n⸻\n7　「行政の目的」と「私人の利益」を分ける\n行政事件では、\n公益\nと\n私人の権利利益\nが衝突することが多い。\n例えば、\n営業規制\nでは、\n行政 → 安全・衛生・環境保護\n事業者 → 営業の自由・財産的利益\nという対立が生じる。\n⸻\n8　利益衡量\nしたがって、\n行政目的\n↕\n私人の権利・利益\nを比較する。\nただし、\n「公益のほうが大事」\nと単純に決めるのではない。\n法律が、\nどのような利益調整を予定しているか\nを確認する。\n⸻\n9　法的問題を抽出する\n事実を整理したら、\n何が法律問題なのか\nを抜き出す。\n例えば、\n問題①\n行政庁に処分権限があったか。\n問題②\n処分要件を満たしていたか。\n問題③\n裁量権の範囲内か。\n問題④\n手続は適法か。\n問題⑤\n原告適格があるか。\n問題⑥\n取消訴訟を提起できるか。\n問題⑦\n損害賠償請求できるか。\nというように分解する。\n⸻\n10　論点を一つずつ処理する\n複雑な事件でも、\n事実\n↓\n問題点①\n↓\n規範\n↓\n事実への適用\n↓\n結論\n↓\n問題点②\n↓\n規範\n↓\n適用\n↓\n結論\nと分解すればよい。\n⸻\n11　「規範」と「事実」を分ける\n専門的な法的分析では、\n法律上どうなるべきか\nと、\n実際に何が起きたか\nを混ぜない。\n⸻\n規範\n行政代執行には一定の要件が必要。\n事実\n本件では行政庁が戒告をしていない。\n適用\n原則として法定手続との関係が問題になる。\n結論\n代執行の適法性に疑義が生じる。\nという流れ。\n⸻\n12　行政法特有の「法的性質決定」\n行政事件では、\nその行為が何なのか\nを決めることが非常に重要。\n例えば、\n行政から「営業を控えてください」と言われた。\nこれだけでは、\n•\t行政指導\n•\t行政処分\n•\t事実上の要請\nなど、法的性質が分からない。\nそこで、\n名称ではなく実質を見る\n必要がある。\n⸻\n13　法的性質が変わると何が変わるか\n例えば、\n行政処分なら\n→ 取消訴訟等\n行政指導なら\n→ 行政手続法上の行政指導規制\n強制なら\n→ 法律上の強制権限の根拠\nなど。\nつまり、\n最初の法的性質決定が、その後の分析全体を左右する。\n⸻\n14　救済方法から逆算する\n実務では、\n「最終的に何を実現したいのか」\nから逆算することも重要。\n例えば、\n営業を続けたい\nなら、\n営業停止処分\n↓\n取消訴訟？\n↓\n執行停止？\nを考える。\n⸻\n許可を取得したい\nなら、\n不許可\n↓\n取消訴訟\n＋\n義務付け\nを考える。\n⸻\n将来の処分を防ぎたい\nなら、\n差止訴訟\n＋\n仮の救済\nを考える。\n⸻\n既に損害が発生した\nなら、\n国家賠償\nを検討する。\n⸻\n15　行政事件分析の完成形\n① 事実整理\n↓\n② 時系列\n↓\n③ 関係者\n↓\n④ 行政活動の法的性質\n↓\n⑤ 根拠法\n↓\n⑥ 権限\n↓\n⑦ 実体的要件\n↓\n⑧ 裁量\n↓\n⑨ 手続\n↓\n⑩ 一般原則\n↓\n⑪ 違法性\n↓\n⑫ 救済方法\n↓\n⑬ 訴訟要件\n↓\n⑭ 仮の救済\n↓\n⑮ 最終的な救済\n⸻","blanks":["法的問題を自分で発見する","事実整理","時間軸","法律関係を図にする"],"options":[["法的問題を自分で発見する","簡易迅速かつ公正な手続","法律による行政の原理","法律行為的な行政活動"],["事実整理","比例原則","行政主体","行政機関"],["時間軸","行政法","行政庁","法人格"],["法律関係を図にする","裁量権の逸脱・濫用","相手方の任意の協力","法律による行政の原理"]],"mode":"administrative"},"4":{"text":"1　行政法の全体像\nここまで学んだ行政法を、一つの体系としてまとめる。\n⸻\n第1編　行政法総論\n行政法とは何か。\n行政\n↓\n公共目的\n↓\n公権力\n↓\n私人との関係\n↓\n法律によるコントロール\n中心となる原理：\n•\t法律による行政\n•\t法律の優位\n•\t法律の留保\n•\t比例原則\n•\t平等原則\n•\t信頼保護\n•\t適正手続\n⸻\n第2編　行政組織\n誰が行政をするのか\n国\n↓\n行政主体\n↓\n行政機関\n↓\n行政庁\n↓\n権限行使\n地方公共団体については、\n地方公共団体\n↓\n議会\n＋\n長\n↓\n条例・規則\n↓\n行政活動\n⸻\n第3編　行政作用\n行政はどのような方法で活動するのか\n行政立法\n行政計画\n行政行為\n行政契約\n行政指導\n事実行為\n中心は、\n行政行為\nその周辺に、\n行政裁量・効力・瑕疵・取消し・撤回\nなどがある。\n⸻\n第4編　行政手続・情報\n行政はどのような過程で活動するのか\n申請\n↓\n審査\n↓\n処分\nまたは、\n不利益処分\n↓\n聴聞・弁明\n↓\n処分\nさらに、\n•\t行政指導\n•\t届出\n•\t意見公募\n•\t情報公開\n•\t個人情報保護\nなど。\n⸻\n第5編　実効性確保\n行政活動をどう現実化するか\n義務\n↓\n不履行\n↓\n強制執行\n•\t代執行\n•\t直接強制\n•\t執行罰\n•\t強制徴収\nまた、\n緊急\n↓\n即時強制\n違反に対して、\n違反\n↓\n行政罰\n⸻\n第6編　行政救済\n行政活動に問題があったらどうするか\n不服\n↓\n行政不服審査\n違法な処分\n↓\n行政事件訴訟\n違法な行政活動\n↓\n国家賠償\n適法な行政活動\n＋\n特別の犠牲\n↓\n損失補償\n⸻\n2　行政法全体を一本のストーリーにする\n例えば、\nAが営業許可を申請した。\nここから行政法全体が動き出す。\n⸻\nSTEP1　行政組織\n誰が許可する？\n↓\n行政主体・行政機関・行政庁\n⸻\nSTEP2　行政法総論\n許可の根拠は？\n↓\n法律による行政\n⸻\nSTEP3　行政作用\n許可・不許可は何か？\n↓\n行政行為\n⸻\nSTEP4　行政手続\nどう審査する？\n↓\n行政手続法・個別法\n⸻\nSTEP5　行政行為\n許可を拒否できる要件は？\n↓\n法律上の要件・裁量\n⸻\nSTEP6　行政救済\n不許可になったAが不服。\n↓\n行政不服審査\nまたは\n↓\n取消訴訟\n⸻\nSTEP7　義務付け\nAが、\n「許可を出してほしい」\nと考える。\n↓\n義務付け訴訟\n⸻\nSTEP8　国家賠償\n違法な不許可によってAに損害。\n↓\n国家賠償\n⸻\nこのように、\n一つの行政事件の中に行政法の各分野が全部登場する。\n⸻\n3　別のストーリー――違法建築物\nBが違法建築物を建築した。\n↓\n行政庁が除却命令。\n↓\nこれは、\n行政行為\n↓\nBが従わない。\n↓\n行政上の義務不履行。\n↓\n代執行の要件を検討。\n↓\n行政代執行。\n↓\nBが、\n「代執行は違法だ」\nと主張。\n↓\n行政救済。\n↓\n取消訴訟等の問題。\n↓\n違法な代執行によって損害。\n↓\n国家賠償の問題。\n⸻\n4　行政法は「行政の一生」を扱う\n行政活動を時間軸で見ると、\n行政目的\n↓\n権限・組織\n↓\n法的根拠\n↓\n行政活動\n↓\n手続\n↓\n処分・契約・指導等\n↓\n実効性確保\n↓\n行政活動の結果\n↓\n問題発生\n↓\n行政救済\n↓\n国家補償\nとなる。\nこれが、\n行政法の基本的なストーリー\nである。\n⸻\n5　行政法の3つの視点\n行政法を深く理解するために、\n行政側\n私人側\n裁判所側\nの3つの視点を持つ。\n⸻\n行政側\n何をする権限があるか？\n⸻\n私人側\n何を要求できるか？\n⸻\n裁判所側\n行政の判断をどこまで審査できるか？\n⸻\n6　行政法の本質的な対立\n行政法では常に、\n公共利益\n↕\n私人の権利・利益\nという関係が存在する。\n例えば、\n環境規制\n公益：\n環境保護\n私人：\n営業の自由・財産権\n⸻\n建築規制\n公益：\n安全\n私人：\n財産権・営業の自由\n⸻\n税\n公益：\n財政\n私人：\n財産権\n⸻\n警察活動\n公益：\n安全・秩序\n私人：\n身体・自由・プライバシー\n⸻\n7　行政法の役割\n行政法は、\n行政を止めるためだけの法律ではない。\nここは非常に重要。\n行政法には、\n行政を可能にする機能\n公共目的を実現する。\nそして、\n行政を制限する機能\n私人の権利・自由を守る。\nさらに、\n行政を適正化する機能\n適切な行政運営を実現する。\nそして、\n行政による被害を救済する機能\n行政救済・国家補償。\nという4つの側面がある。\n⸻\n8　行政法の四機能\n行政法\n│\n┌──────────┼──────────┐\n↓             ↓             ↓\n行政を可能に  行政を制限   行政を適正化\nする           する         する\n│             │             │\n行政作用      法律による    手続\n実効性        行政          情報公開\n人権保障      裁量統制\n│\n↓\n行政を救済\n│\n不服審査・行政訴訟\n国家賠償・損失補償\n⸻\n9　行政法を学ぶときの「5つの質問」\nどんな行政事件でも、まず次の5つを考える。\n① 誰が？\n行政主体・行政機関\n② 何を根拠に？\n法律・条例・法規範\n③ 何をした？\n行政行為・契約・指導・計画等\n④ どのように？\n手続・裁量・実効性確保\n⑤ 問題があればどうする？\n不服・訴訟・国家補償\n⸻\n10　専門家としての最終分析フロー\n行政事件を見たら、\n【事実】\n↓\n誰が？\n↓\n誰に？\n↓\n何を？\n↓\nいつ？\n↓\n何の根拠で？\n↓\n【法的性質】\n↓\n処分？\n指導？\n契約？\n計画？\n強制？\n不作為？\n↓\n【適法性】\n↓\n権限？\n根拠？\n要件？\n裁量？\n手続？\n比例？\n平等？\n信頼保護？\n↓\n【救済】\n↓\n不服審査？\n取消？\n無効確認？\n義務付け？\n差止め？\n当事者訴訟？\n国家賠償？\n損失補償？\n↓\n【最終結論】\n⸻\n11　行政法の「縦」と「横」\n行政法を深く理解するには、\n縦方向\nと\n横方向\nの両方を見る。\n⸻\n縦方向\n一つの制度を深く見る。\n例えば、\n取消訴訟\nについて、\n処分性 ↓ 原告適格 ↓ 訴えの利益 ↓ 被告 ↓ 出訴期間 ↓ 審理 ↓ 判決\nと深掘りする。\n⸻\n横方向\n複数の制度をつなげる。\n例えば、\n行政行為\n↓\n行政手続\n↓\n実効性確保\n↓\n取消訴訟\n↓\n国家賠償\nと見る。\n⸻\n12　今後の学習で必要になること\nこの基礎編が終わった後は、\n縦方向の深掘り\nが重要になる。\n例えば、\n行政行為\n↓\n行政行為論\n↓\n処分性\n↓\n行政行為の成立・効力\n↓\n瑕疵論\n↓\n取消し・撤回\n↓\n判例\n⸻\nまた、\n行政救済\n↓\n取消訴訟\n↓\n訴訟要件\n↓\n原告適格\n↓\n処分性\n↓\n訴えの利益\n↓\n裁量審査\n↓\n判例\nというように深く進む。\n⸻\n13　基礎編と次の段階の違い\n現在の第1～7編では、\n行政法全体の地図を完成させる\nことを目的としている。\nしたがって、\n学説上の細かい対立\n判例の詳細な射程\n高度な理論構成\nは必要最小限にしている。\nこれらは次の段階で、\n総合教科書・判例集・理論・論点\nへ進んだときに深掘りする。\n⸻\n第7編　最終確認問題\n問1\n行政法は行政を制限するためだけの法律か？\n答え\n違う。\n行政を可能にし、行政活動を適正化し、私人を救済する機能も持つ。\n⸻\n問2\n行政事件を分析するとき、最初に確認すべきことは？\n答え\n何が起きたのかという事実関係と、行政活動の法的性質。\n⸻\n問3\n行政庁が「許可をしない」と判断した場合、何を検討する？\n答え\n権限、根拠法、処分要件、裁量、手続、一般原則、そして救済方法など。\n⸻\n問4\n行政活動の違法性を判断するとき、実体だけ見ればよいか？\n答え\nいいえ。\n実体的適法性だけでなく、手続的適法性も検討する。\n⸻\n問5\n行政裁量があると裁判所は審査できないか？\n答え\n違う。\n裁量が認められる場合でも、裁量権の逸脱・濫用などについて司法審査が行われる。\n⸻\n問6\n行政事件で最初から「取消訴訟」と決めてよいか？\n答え\nいけない。\nまず行政活動の法的性質、求める救済、訴訟要件などを確認する。\n⸻\n問7\n違法な行政活動による損害については何を検討する？\n答え\n国家賠償。\nただし、国家賠償法上の要件を別途満たす必要がある。\n⸻\n問8\n適法な行政活動でも補償が問題になることがあるか？\n答え\nある。\n適法な公権力行使によって特定人に特別の犠牲が生じる場合、損失補償が問題になる。\n⸻\n第7編　全7編を一つにまとめる\n最後に、この基礎本全体を一枚にすると、\n━━━━━━━━━━━━━━━━━━━━\n行政法の全体体系\n━━━━━━━━━━━━━━━━━━━━\n【第1編】行政法総論\n↓\n行政とは？\n法律による行政\n基本原理\n法源\n行政法上の法律関係\n↓\n━━━━━━━━━━━━━━━━━━━━\n【第2編】行政組織\n↓\n誰が行政する？\n行政主体\n行政機関\n国\n地方公共団体\n↓\n━━━━━━━━━━━━━━━━━━━━\n【第3編】行政作用\n↓\nどういう形式で行政する？\n行政立法\n行政計画\n行政行為\n行政契約\n行政指導\n事実行為\n↓\n━━━━━━━━━━━━━━━━━━━━\n【第4編】行政手続・情報\n↓\nどういう手続で行政する？\n申請\n不利益処分\n聴聞\n行政指導\n届出\n意見公募\n情報公開\n個人情報保護\n↓\n━━━━━━━━━━━━━━━━━━━━\n【第5編】実効性確保\n↓\n従わない場合どうする？\n代執行\n直接強制\n執行罰\n強制徴収\n即時強制\n行政罰\n↓\n━━━━━━━━━━━━━━━━━━━━\n【第6編】行政救済\n↓\n行政に問題があったら？\n行政不服審査\n取消訴訟\n無効確認\n不作為違法確認\n義務付け\n差止め\n当事者訴訟\n民衆訴訟\n機関訴訟\n国家賠償\n損失補償\n↓\n━━━━━━━━━━━━━━━━━━━━\n【第7編】行政法の統合\n↓\n行政事件をどう分析する？\n↓\n① 事実整理\n↓\n② 行政活動の法的性質\n↓\n③ 根拠・権限\n↓\n④ 実体的適法性\n↓\n⑤ 手続的適法性\n↓\n⑥ 裁量\n↓\n⑦ 一般原則\n↓\n⑧ 救済方法\n↓\n⑨ 訴訟要件\n↓\n⑩ 最終的救済\n━━━━━━━━━━━━━━━━━━━━\n第7編の最重要ポイント\n第7編で最終的に身につけるべきなのは、制度名を全部言えることではない。\n最も重要なのは、\n行政事件を見たときに、自分で法律問題を発見できること。\nそのために、\n①事実\n↓\n②行政活動の法的性質\n↓\n③根拠・権限\n↓\n④実体\n↓\n⑤手続\n↓\n⑥裁量\n↓\n⑦一般原則\n↓\n⑧救済\nという思考順序を身につける。\n⸻\n第1～7編を通じた「行政法の一文」\n行政法全体を一文で表すなら、\n行政が公共目的を実現するために公権力を行使する一方、その権限行使を法律・手続・一般原則によって統制し、必要に応じて私人の権利利益を救済するための法体系\nと理解できる。\nそして、\n行政を動かす\n↓\n行政を法で縛る\n↓\n行政を適正に運営する\n↓\n行政目的を実現する\n↓\n私人の権利利益を守る\n↓\n問題があれば救済する\nという循環が行政法の全体像になる。\n⸻\n基礎編終了時点での到達目標\nこの第1～7編を読み終えた段階で、\n「行政法って何を勉強する法律なの？」\nと聞かれたときに答えられる。\nさらに、\n「行政庁がこういう処分をしたんだけど、何が問題？」\nと聞かれたとき、\n誰が？\n↓\n何を根拠に？\n↓\n何をした？\n↓\n法的性質は？\n↓\n要件を満たす？\n↓\n裁量は？\n↓\n手続は？\n↓\n一般原則は？\n↓\n違法？\n↓\nどう救済する？\nと、自分で分析を始められる。\nこれが、この基礎編の最終到達点である。\n⸻\n次の段階\nここまでで、\n① 基礎本\nとしての行政法全体の地図が完成した。\n次の段階では、この地図を使って、\n② 総合教科書・より深い教科書\nへ進む。\nそこで初めて、\n•\t各制度の理論的根拠\n•\t学説の対立\n•\t判例の詳細\n•\t判例がどこまで射程を持つか\n•\t裁量審査の具体的構造\n•\t原告適格の判断方法\n•\t処分性の判例展開\n•\t行政行為論の深掘り\n•\t国家賠償法1条・2条の判例理論\n•\t損失補償の理論\n•\t個別行政法との接続\nなどを本格的に掘り下げていく。\nつまり、\n第1～7編＝行政法を理解するための「骨格」\n↓\n次の段階＝その骨格に「理論・判例・専門知識」を肉付けする\nという関係になる。\nこの順番なら、最初から高度な学説を大量に詰め込むのではなく、行政法全体を理解した状態で高度な内容へ進める。","blanks":["行政法総論","行政組織","行政作用","行政手続"],"options":[["行政法総論","法律の優位","法律の留保","行政組織法"],["行政組織","比例原則","行政主体","行政機関"],["行政作用","比例原則","行政主体","行政機関"],["行政手続","比例原則","行政主体","行政機関"]],"mode":"administrative"}}}};

学6編・完全総整理","基礎法学の完成形"]],"chapters":{"1":{"1":"法とは、\n社会における人々の行動や関係を規律するための、国家などによって公的に認められた規範\nである。\n人間が複数人で生活すると、\n• 何をしてよいのか\n• 何をしてはいけないのか\n• 誰が何を請求できるのか\n• 誰が責任を負うのか\nを決める必要がある。\nそこで法が必要になる。\n人間が社会で生活する\n↓\n利害が衝突する\n↓\nルールが必要になる\n↓\n法によって規律する\n↓\n社会秩序を形成する","2":"もし社会に共通のルールがなければ、\n「自分はこう思う」\nだけで行動することになる。\nすると、\nA「これは自分の物だ」\nB「いや、自分の物だ」\n↓\n争い\n↓\n解決できない\nという問題が発生する。\nそこで法が、\n「誰に権利があるのか」\n「どのような場合に責任を負うのか」\nを決める。\nつまり法には、\n社会の紛争を予防・解決する機能\nがある。","3":"法には複数の目的がある。\n主なものは、\n1. 社会秩序の維持\n2. 権利・利益の保護\n3. 紛争の解決\n4. 公正・公平の実現\n5. 人権の保障\n6. 国家権力の統制\nである。\nしたがって、\n法＝単に人を縛るルール\nではない。\nむしろ、\n人々の自由や権利を保障するためにも法が存在する。","4":"法は社会から切り離して存在するものではない。\n社会\n↓\n人々の生活・利害\n↓\n問題・紛争\n↓\n法によるルール形成\n↓\n社会秩序\n社会が変化すれば、\n必要とされる法も変化する。\n例えば、\n• インターネット\n• AI\n• 個人情報\n• 電子商取引\n• 環境問題\nなど、新しい社会問題が生じれば、それに対応する法制度も発展する。","5":"法規範とは、\n人々の行為を一定の基準によって規律する法的なルール\nである。\n例えば、\n他人の物を勝手に奪ってはいけない。\nというルールがある。\n法規範は一般に、\n一定の要件\n↓\n一定の効果\nという構造を持つ。","6":"法律を理解するうえで、\n要件と効果\nは非常に重要。\n要件\nその法律上の効果が発生するために必要な条件。\n効果\n要件が満たされた場合に発生する法律上の結果。\n例えば、\n契約が成立\n↓\n一定の要件を満たす\n↓\n契約上の権利・義務が発生\nという構造。\n法律を読むときは、\n「どんな場合に、何が起こるのか」\nを見る。","7":"権利とは、\n法によって保護され、一定の利益を享受したり、他者に一定の行為を求めたりできる法的な地位\nと理解するとよい。\n例えば、\n売買契約が成立\n↓\n買主\n↓\n目的物を引き渡せと請求できる\nという場合、\n買主には引渡請求権がある。","8":"権利には、\n「自分が何かをできる」\nだけではなく、\n「他人に何かを求められる」\nという側面もある。\n例えば、\nA\n↓\nBに100万円を貸す\n↓\n返済期限到来\n↓\nA\n↓\nBに返還を請求できる\nこのときAには、\n貸金返還請求権\nがある。","9":"義務とは、\n法によって一定の行為をすること、またはしないことを要求される法的な拘束\nである。\n例えば、\nAがBから100万円を借りる\n↓\nA\n↓\n返還義務\n↓\nB\n↓\n返還請求権\nという関係になる。","10":"権利と義務は、\n相互に対応することが多い。\n例えば、\nA\n貸金返還請求権\n↓\nB\n返還義務\nという関係。\nしたがって、\n「誰が権利者で、誰が義務者なのか」\nを確認することが法律関係を理解する基本になる。","11":"法律関係とは、\n法によって規律された人と人との関係\nである。\n例えば、\n売買契約なら、\n売主\n↓\n目的物引渡義務\n買主\n↓\n代金支払義務\nという法律関係が発生する。","12":"法律関係を考えるときは、\n① 誰が\n↓\n② 誰に対して\n↓\n③ 何を請求・要求できるか\n↓\n④ 何をする義務があるか\n↓\n⑤ その根拠となる法は何か\nを見る。\nこれが法律学の基本的な視点になる。","13":"法と道徳は似ている部分がある。\n例えば、\n「人を傷つけてはいけない」\nという考えは、\n道徳にも法にも関係する。\nしかし、\n法＝道徳\nではない。\n法と道徳には違いがある。","14":"法\n国家による公的な強制と結びつく。\n道徳\n社会的・個人的な価値判断や良心に基づく。\n例えば、\n「困っている人を助けるべきだ」\nというのは道徳上重要でも、\nすべての場合に国家が法的義務として強制するとは限らない。\nしたがって、\n道徳\n＝\n「人としてどうあるべきか」\n\n法\n＝\n「社会において何をすべきか・してはいけないかを公的に規律する」\nと考える。","15":"完全に別ではない。\n実際には、\n道徳的価値が法律に取り込まれる\nことがある。\n例えば、\n• 殺人禁止\n• 窃盗禁止\n• 他人への損害賠償\n• 信義則\nなど。\nしたがって、\n法と道徳は区別されるが、相互に影響する。","16":"社会では、\n長期間繰り返されている慣行\nが存在する。\nこれを、\n慣習\nという。\nただし、\nすべての慣習が法になるわけではない。\n一定の要件の下で法的効力が認められるものがある。","17":"「習慣」と「法的な慣習」は区別する。\n習慣\n単に人々が繰り返している行動。\n慣習法\n一定の社会的慣行が、\n法として認められるもの。\nしたがって、\n繰り返されている\n≠\n必ず法になる","18":"社会には法以外にも規範がある。\n例えば、\n• 道徳\n• 宗教\n• 慣習\n• 社会的ルール\n• 礼儀\nなど。\nこれらをまとめて、\n社会規範\nと考えることができる。\n社会規範\n│\n├─ 法\n├─ 道徳\n├─ 宗教\n├─ 慣習\n└─ 礼儀・社会的ルール","19":"法　道徳　礼儀・慣習\n公的強制　強い　原則なし　原則なし\n国家による制度化　あり　原則なし　原則なし\n違反への制裁　法的制裁　道徳的非難等　社会的非難等\n目的　社会秩序・権利保障等　善悪・人格　社会生活の円滑化\nただし、\n現実には完全に切り分けられるわけではない。","20":"法の重要な特徴の一つは、\n公的な強制力と結びついていること\nである。\n例えば、\n契約上の義務を履行しない\n↓\n裁判\n↓\n判決\n↓\n必要に応じて強制執行\nということが可能になる。","21":"ただし、\n法＝常に国家が力で従わせる\nという意味ではない。\n多くの人は、\n法律だから守る\nという形で自発的に法に従っている。\nしたがって、\n法\n↓\nルールを設定\n↓\n通常は自発的に遵守\n↓\n違反\n↓\n必要に応じて公的強制\nという構造になる。","22":"法に違反した場合、\n法的な不利益\nが発生することがある。\n例えば、\n刑事法\n犯罪\n↓\n刑罰\n民法\n契約違反\n↓\n損害賠償・履行請求・解除など\n行政法\n法令違反\n↓\n行政処分・行政上の義務履行確保など\nというように分野によって異なる。","23":"現代国家では、\n法は国家権力とも密接に関係する。\n特に重要なのが、\n国家権力自身も法に従わなければならない\nという考え方。\nこれが、\n法の支配\nにつながる。","24":"法の支配とは、\n国家権力を法によって拘束し、人権や自由を保障するという原理\nである。\n国家権力\n↓\n法によって拘束\n↓\n恣意的な権力行使を防止\n↓\n国民の権利・自由を保障\nこれは憲法と深く関係する。","25":"法治主義とは、\n行政などの国家作用を法に基づいて行わせるという考え方\nである。\n特に行政法では、\n法律による行政\nという考え方が重要になる。","26":"両者は似ているが、完全に同じではない。\n法治主義\n国家作用が法に従って行われることを重視する。\n法の支配\n法そのものが人権保障・権力統制を実現するものであることを重視する。\nしたがって、\n法治主義\n→ 「法に従って行政等を行う」\n\n法の支配\n→ 「国家権力そのものを法で拘束する」\nというイメージを持つ。","27":"法には、\n正義・公平\nを実現する役割もある。\n例えば、\n同じ条件の人を合理的理由なく差別する\n↓\n不公平\nとなる。\nそこで法は、\n公平な扱い\nを実現しようとする。\nただし、\n「公平とは何か」\nについては社会によって議論が生じる。","28":"形式的正義\n同じルールを同じように適用する。\n実質的正義\n個々の事情を考慮して、実質的に公平な結果を目指す。\n例えば、\n全員に同じルール\n↓\n形式的公平\n\n弱者への特別な保護\n↓\n実質的公平\nという違いがある。","29":"法は自由を制限することがある。\n例えば、\n他人を傷つけてはいけない。\nというルール。\n一見すると、\n自由を制限している。\nしかし、\nもし他人を自由に傷つけられる社会なら、\n他人の自由も保障されない。\nしたがって法は、\n自由を制限することで、他者の自由を保障する\nという側面も持つ。","30":"法は、\n権利を認めるだけではなく、その権利を実現する仕組み\nも用意する。\n例えば、\n権利侵害\n↓\n裁判\n↓\n判決\n↓\n強制執行\nという仕組み。\nしたがって、\n権利＋救済制度\nが重要になる。","31":"権利には、\n対応する義務\nが存在することが多い。\n例えば、\nAの所有権\n↓\n他人が勝手に使用・侵害しない義務\nという関係。\nしたがって、\n権利保障は、他者に一定の義務を課すことによって実現される。","32":"法を大きく分類すると、\n公法と私法\nという区分がある。\n公法\n国家・公共団体と私人、または国家機関相互の関係などを中心に規律する法。\n例：\n• 憲法\n• 行政法\n• 刑法\n私法\n私人相互の関係を中心に規律する法。\n例：\n• 民法\n• 商法\n• 会社法\nただし、\nこの分類は絶対的ではない。","33":"もう一つ重要な分類が、\n実体法と手続法\nである。\n実体法\n権利・義務などの法律関係そのものを定める。\n例：\n民法、刑法など。\n手続法\n権利の実現や紛争解決の手続を定める。\n例：\n民事訴訟法、刑事訴訟法など。","34":"法律には、\n一般法\nと、\n特別法\nという関係もある。\n例えば、\n一般的ルール\n↓\n民法\n\n特定の場面について特別ルール\n↓\n商法・会社法等\nという関係。","35":"一般に、\n特別法は一般法に優先する\nという原則がある。\n例えば、\n一般的なルール\n↓\n特別な場面\n↓\n特別法が存在\n↓\n特別法を優先\nという考え方。\nただし、\n実際の適用では具体的な条文関係を確認する必要がある。","36":"強行法規\n当事者が、\n「この法律は適用しない」\nと合意しても排除できない規定。\n任意法規\n当事者が別の内容を合意すれば、\nその合意を優先できる規定。","37":"例えば、\n契約について法律が、\n「特別な合意がない場合はAとする」\nと定めているなら、\n当事者が、\n「Bとする」\nと合意できる場合がある。\nこれが任意規定。\n一方、\n公益や弱者保護などの観点から、当事者の合意によって変更できない\n場合には強行規定が問題になる。","38":"法の分類は、\n単なる暗記のためではない。\n分類することで、\n「この法律はどのような目的・構造を持っているのか」\nを理解できる。\n公法・私法\n↓\n誰と誰の関係か\n\n実体法・手続法\n↓\n何を定める法か\n\n一般法・特別法\n↓\nどちらを優先するか\n\n強行法規・任意法規\n↓\n当事者が変更できるか","39":"法的主体とは、\n法によって権利や義務の主体となることができる者\nである。\n代表的なのは、\n• 自然人\n• 法人\nである。","40":"自然人とは、\n生身の人間\nのこと。\n民法では、\n人は権利能力を持つ\nというところから法律関係が始まる。","41":"法人とは、\n法律によって法人格を認められた組織等\nである。\n例えば、\n• 株式会社\n• 一般社団法人\n• 一般財団法人\nなど。\n法人は、\n自然人ではないが、法によって権利義務の主体となる。","42":"法人格とは、\n独立した権利・義務の主体として法律上扱われる資格\nである。\n例えば株式会社では、\n株主\n↓\n出資\n↓\n株式会社\n↓\n会社自身が権利・義務を持つ\nという構造になる。","43":"法律関係では、\n主体\nと、\n客体\nを区別する。\n主体\n権利・義務の主体。\n客体\n権利の対象となるもの。\n例えば、\nAがBの土地を所有している。\nA\n↓\n権利主体\n\n所有権\n↓\n権利\n\n土地\n↓\n権利の客体\nとなる。","44":"法律行為とは、\n当事者の意思表示によって法律上の効果を発生させる行為\nである。\n代表例は、\n契約\nである。\n売りたい\n＋\n買いたい\n↓\n意思の合致\n↓\n売買契約\n↓\n法律上の権利・義務","45":"意思表示とは、\n一定の法律効果を発生させようとする意思を外部に表示すること\nである。\n例えば、\n「この土地を1,000万円で売ります」\nという意思表示。\n相手が、\n「買います」\nと応じれば、\n契約成立へ進む。","46":"契約とは、\n当事者間の意思の合致によって成立する法律行為\nである。\n例えば売買契約なら、\n売主\n「売る」\n\n買主\n「買う」\n\n↓\n意思の合致\n↓\n売買契約\nとなる。","47":"契約では、\n誰と契約するか\n\nどのような契約をするか\n\n契約するかどうか\nについて原則として自由が認められる。\nこれを、\n契約自由の原則\nという。\nただし、\n公序良俗・強行法規・消費者保護などによる制約\nがある。","48":"法に違反した場合、\n法的責任\nが発生することがある。\n代表的には、\n民事責任\n損害賠償など。\n刑事責任\n刑罰など。\n行政上の責任・不利益\n行政処分など。\n法違反\n↓\nどの分野の問題か\n↓\n民事？\n刑事？\n行政？\n↓\n対応する責任を判断","49":"責任と制裁は関連するが、\n完全に同じ概念ではない。\n例えば民事責任では、\n被害者の損害を回復する\nことが中心となる。\n刑事責任では、\n犯罪に対する刑罰\nが中心となる。\n行政法では、\n行政目的を実現するための処分\nなどが問題となる。","50":"法律は、\n具体的な事実に適用\nされる。\n基本構造は、\n法律\n↓\n要件を確認\n↓\n具体的事実を確認\n↓\n要件に当てはめる\n↓\n法律効果を導く\nこれを、\n法の適用\nという。","51":"法律学では、\n一般的な法規範\nと、\n具体的な事実\nを結びつけて結論を出す。\n基本的には、\n大前提\n↓\n法律のルール\n\n小前提\n↓\n具体的事実\n\n結論\n↓\n法律効果\nという構造。\nこれが、\n法的三段論法\nの基本である。","52":"法律問題では、\n① 事実を確認\n↓\n② 問題となる法律関係を特定\n↓\n③ 適用される法律を探す\n↓\n④ 要件を確認\n↓\n⑤ 事実を要件に当てはめる\n↓\n⑥ 法律効果を判断\n↓\n⑦ 必要なら救済手段を確認\nという流れで考える。","53":"法律の条文を読むだけでは、\n答えが一つに決まらない\n場合がある。\nそこで、\n法解釈\nが必要になる。\n法解釈とは、\n条文の意味・内容を明らかにする作業\nである。","54":"条文を読むときは、\n「誰に対して、どんな場合に、何を認め、何を禁止し、どのような効果を発生させているのか」\nを見る。\n特に、\n• 主体\n• 要件\n• 効果\n• 例外\n• ただし書\n• 準用\nなどを確認する。","55":"法は、\n条文を書くだけでは意味がない。\n法が実際に機能するには、\n法律\n↓\n行政\n↓\n裁判\n↓\n強制執行\n↓\n権利・義務の実現\nという仕組みが必要になる。","56":"法に関する争いが発生した場合、\n裁判所\nが法を解釈・適用して判断する。\n例えば、\nAとBが争う\n↓\n裁判所\n↓\n事実認定\n↓\n法解釈\n↓\n法適用\n↓\n判決\nとなる。","57":"行政も法に基づいて活動する。\n例えば、\n許可\n認可\n行政処分\nなど。\nしたがって、\n行政法では「行政がどのような根拠で、どこまで行動できるのか」\nが重要になる。","58":"刑法では、\nどのような行為が犯罪になるのか\nを法律によって定める。\nそして、\n犯罪が成立した場合にどのような刑罰が科されるのか\nを定める。\nここでは、\n罪刑法定主義\nが重要になる。","59":"法は、\n人権を保障するためにも存在する。\n特に憲法では、\n• 個人の尊重\n• 基本的人権\n• 法の下の平等\n• 表現の自由\n• 財産権\n• 適正手続\nなどが保障されている。\nつまり、\n法は国家権力から国民を守る役割も持つ。","60":"法によって、\n社会のすべての問題を完全に解決できるわけではない。\n例えば、\n• 道徳\n• 人間関係\n• 個人の価値観\n• 政治的判断\n• 経済的問題\nなどは法だけでは処理できない。\nしたがって、\n法にはできることと、できないことがある。","61":"法と政治は密接に関係する。\n例えば、\n政治\n↓\n社会の課題を発見\n↓\n政策を決定\n↓\n法律を制定\n↓\n行政が実施\n↓\n社会に影響\nという流れがある。\nただし、\n政治が決めれば何でも法律にできる\nわけではない。\n憲法による制約が存在する。","62":"経済活動も法によって規律される。\n例えば、\n• 契約\n• 所有権\n• 会社\n• 株式\n• 金融\n• 消費者保護\n• 独占禁止\nなど。\nしたがって、\n法は経済活動のルールを作る役割も持つ。","63":"倫理とは、\n「何が正しいのか」\n\n「人間はどう行動すべきか」\nという問題に関係する。\n法も倫理的価値から影響を受けるが、\n法律で規定されていないことがすべて倫理的に正しいわけではない。\n逆に、\n倫理的に問題があることがすべて違法とも限らない。","64":"ここまでをまとめる。\n人間\n↓\n社会生活\n↓\n利害・紛争\n↓\n社会規範\n↓\n法\n↓\n権利・義務\n↓\n法律関係\n↓\n法的責任\n↓\n裁判・行政等による実現","65":"法律を学ぶときは、次の5つを見る。\n① 主体\n誰が関係しているのか。\n② 客体\n何が問題になっているのか。\n③ 権利・義務\n誰が何を請求でき、誰が何をしなければならないのか。\n④ 要件・効果\nどの条件で、どの法律効果が発生するのか。\n⑤ 救済\n権利が侵害された場合、どうやって実現・回復するのか。\n主体\n↓\n客体\n↓\n権利・義務\n↓\n要件・効果\n↓\n救済","66":"「法とは何か」を一言で表すなら、\n法とは、社会における人々の行動・権利・義務・責任を公的に規律し、社会秩序と権利保障を実現するための規範である。\nそして法律を理解するときは、\n誰が？\n↓\n誰との間で？\n↓\n何について？\n↓\nどんな権利・義務がある？\n↓\nどんな要件で？\n↓\nどんな効果が発生する？\n↓\n違反したらどうなる？\n↓\nどう救済する？\nと考える。","67":"以下を何も見ずに説明してみる。\n1. 法とは何か。\n2. なぜ法が必要なのか。\n3. 法の目的は何か。\n4. 法規範とは何か。\n5. 要件と効果とは何か。\n6. 権利とは何か。\n7. 義務とは何か。\n8. 権利と義務はどう関係するか。\n9. 法律関係とは何か。\n10. 法と道徳の違いは何か。\n11. 法と慣習の違いは何か。\n12. 法と社会規範の関係は？\n13. 法の強制力とは何か。\n14. 法の支配とは何か。\n15. 法治主義とは何か。\n16. 法の支配と法治主義の違いは？\n17. 公法と私法の違いは？\n18. 実体法と手続法の違いは？\n19. 一般法と特別法の違いは？\n20. 強行法規と任意法規の違いは？\n21. 法的主体とは何か。\n22. 自然人と法人の違いは？\n23. 法人格とは何か。\n24. 法律行為とは何か。\n25. 意思表示とは何か。\n26. 契約とは何か。\n27. 契約自由の原則とは何か。\n28. 民事責任と刑事責任の違いは？\n29. 法の適用とは何か。\n30. 法的三段論法とは何か。\n31. 法解釈とは何か。\n32. 法と裁判はどう関係するか。\n33. 法と行政はどう関係するか。\n34. 法と人権はどう関係するか。\n35. 法にはどのような限界があるか。","68":"① 法とは\n社会を規律する公的な規範\n↓\n② 法が必要な理由\n社会生活\n↓\n利害対立\n↓\n紛争\n↓\n共通ルールが必要\n↓\n法\n↓\n③ 法が守るもの\n社会秩序\n＋\n権利\n＋\n自由\n＋\n公平\n＋\n人権\n↓\n④ 法律関係\n主体\n↓\n権利・義務\n↓\n客体\n↓\n⑤ 法規範\n要件\n↓\n法律効果\n↓\n⑥ 法の実現\n法律\n↓\n行政・裁判\n↓\n必要に応じた強制\n↓\n権利・義務の実現\n↓\n⑦ 法的思考\n事実\n↓\n問題発見\n↓\n法規範\n↓\n要件\n↓\n当てはめ\n↓\n法律効果\n↓\n救済\n\n★ 第1編の最重要ポイント10\n1. 法は社会を規律する公的な規範である。\n2. 法には社会秩序を維持する機能がある。\n3. 法には権利・自由・人権を保障する機能もある。\n4. 権利には、それに対応する義務が存在することが多い。\n5. 法律関係では「誰が・誰に・何を請求できるか」を考える。\n6. 法規範は「要件→効果」という構造で理解すると分かりやすい。\n7. 法と道徳・慣習・社会規範は区別する。\n8. 法の支配は国家権力そのものを法によって拘束する考え方である。\n9. 法的主体には自然人や法人がある。\n10. 法律問題は「事実→法規範→要件→当てはめ→効果→救済」で考える。\n\n第1編 完成\n基礎法学では、ここから、\n第1編　法とは何か\n↓\n第2編　法の種類・法体系\n↓\n第3編　法源・法の適用・解釈\n↓\n第4編　裁判・司法制度・法的手続\n↓\n第5編　法的思考・法律学\n↓\n第6編　現代社会と法・基礎法学総整理\nという順番で進める。\n第1編で最も重要なのは、\n「法律を暗記する前に、法が何をしているのかを理解する」\nことである。\nこれが分かると、憲法・民法・行政法・刑法・商法・会社法を学んだときも、それぞれの法律が「誰の、どのような法律関係を、どのようなルールで規律しているのか」という共通の視点から見られるようになる。"},"2":{"1":"第1章　法源とは何か\n法源とは、\n法としての規範が成立し、法的判断の根拠となる形式・由来\nをいう。\n簡単にいえば、\n「このルールは、どこから来たのか？」\nという問題である。\n例えば、\nこのルールは何を根拠としている？\n↓\n憲法？\n法律？\n命令？\n条例？\n判例？\n慣習？\nというように考える。\n","2":"第2章　なぜ法源を学ぶのか\n法律問題では、\n「なんとなくこう思う」\nでは結論を出せない。\n必要なのは、\n法的な根拠\nである。\nしたがって、\n具体的な事件\n↓\n法的根拠を探す\n↓\n法源を確認\n↓\n適用されるルールを特定\n↓\n結論\nという流れになる。\n","3":"第3章　成文法\n成文法とは、\n文章として明確な形式で制定された法\nである。\n日本では、\n• 憲法\n• 法律\n• 政令\n• 省令\n• 条例\nなどが代表的。\n成文法の特徴は、\n内容が文章として公示されている\nことである。\n","4":"第4章　不文法\n不文法とは、\n成文法のように一つの制定文書として存在しない法\nをいう。\n代表的なものとして、\n• 慣習法\n• 一定の法原理\n• 判例上形成された法理\nなどが問題となる。\nただし、\n日本では成文法が法体系の中心的な位置を占めている。\n","5":"第5章　成文法と不文法\n成文法　不文法\n形式　文章化されている　一つの制定文書ではない\n代表例　憲法・法律・命令　慣習法等\n明確性　比較的高い　内容の確定に解釈等が必要\n公示　制度化されている　形式によって異なる\n","6":"第6章　憲法\n日本の法体系において、\n憲法は最高法規\nである。\n憲法に反する法律等は、\nその効力が問題となる。\n憲法\n↓\n法律\n↓\n命令\n↓\n行政\nという基本構造を理解する。\n","7":"第7章　法律\n法律とは、\n国会が制定する法規範\nである。\n国民の権利・義務に関わる重要な事項について、\n国会による立法\nが行われる。\n","8":"第8章　命令\n命令とは、\n行政機関が制定する法規範\nである。\n代表的には、\n• 政令\n• 府令\n• 省令\nなど。\nただし、\n命令は法律に反することができない。\n","9":"第9章　政令\n政令は、\n内閣が制定する命令\nである。\n法律を執行するため、\n法律から委任された事項等\nについて定める。\nしたがって、\n法律\n↓\n政令\n↓\n具体化\nという関係がある。\n","10":"第10章　省令\n省令は、\n各省の大臣が発する命令\nである。\n法律や政令に基づいて、\nより具体的な事項\nを定める。\n","11":"第11章　条例\n条例は、\n地方公共団体が制定する自治立法\nである。\n地方の実情に応じて、\n地域社会を規律するルール\nを定める。\nただし、\n法律の範囲内\nでなければならない。\n","12":"第12章　憲法・法律・命令・条例\n基本的には、\n憲法\n↓\n法律\n↓\n政令・省令等\nという関係を押さえる。\n地方公共団体については、\n憲法\n↓\n法律\n↓\n条例\nという関係も重要になる。\nただし、\n「すべての法令が単純な一列の上下関係にある」\nと考えるのは正確ではない。\n","13":"第13章　法令の優劣\n法規範が複数存在する場合、\nどの規範が優先するのか\nが問題になる。\n基本的には、\n上位の法規範に反する下位の法規範は許されない。\n例えば、\n憲法\n↓\n法律\n↓\n命令\nという関係。\n","14":"第14章　法令の抵触\n例えば、\n法律A\n↓\n「Xを認める」\n命令B\n↓\n「Xを禁止する」\nとする。\n命令Bが法律Aに反するなら、\n命令Bの適法性・効力が問題になる。\nしたがって、\n法令間の矛盾を発見したら、法形式と根拠規定を確認する。\n","15":"第15章　法律の留保\n行政が国民の権利・自由を制約する場合、\n法律上の根拠\nが必要となる場面がある。\nこれに関係するのが、\n法律の留保\nという考え方。\n行政法では、\n「行政はどこまで法律なしに活動できるのか」\nという問題につながる。\n","16":"第16章　委任立法\n国会が法律を制定し、\n詳細な事項を命令に委ねる\nことがある。\nこれを、\n委任立法\nという。\n国会\n↓\n法律\n↓\n「詳細は政令で定める」\n↓\n内閣\n↓\n政令\nという構造。\n","17":"第17章　委任の限界\n国会が行政に、\n何でも自由に決めてよい\nと委任できるわけではない。\n委任には、\n法律による統制\nが必要。\n特に、\n国民の権利・義務に重大な影響を与える事項\nについては、委任の内容・範囲が問題になる。\n","18":"第18章　慣習法\n慣習法とは、\n社会において一定の慣行が繰り返され、法として認められるもの\nである。\nただし、\n単なる慣習＝慣習法\nではない。\n慣行\n↓\n長期間・反復\n↓\n法的規範として認められる\n↓\n慣習法\nというイメージ。\n","19":"第19章　慣習と法律\n法律と慣習が存在する場合、\nどちらを適用するか\nが問題になる。\n日本法では、\n法令による規律が基本\nであり、慣習が法的効力を持つかどうかは、\n民法など個別の規定も確認する必要がある。\n","20":"第20章　判例とは何か\n判例とは、\n裁判所が具体的事件について示した判断\nである。\n特に、\n最高裁判所の判断\nは、その後の同種事件の法解釈に大きな影響を与える。\n","21":"第21章　判例は法律そのものなのか\nここは重要。\n日本では、\n裁判所の判決が国会制定法と全く同じ意味で「法律」になるわけではない。\nしかし、\n先例として非常に重要な法的意味\nを持つ。\nしたがって、\n法律\n↓\n条文\n↓\n裁判所による解釈\n↓\n判例\n↓\nその後の事件に影響\nという関係を理解する。\n","22":"第22章　最高裁判例の重要性\n最高裁判所がある法律について、\n一定の解釈\nを示した場合、\n下級裁判所もその判断を強く意識して判断する。\nまた、\n実務上、最高裁判例は非常に重要な法解釈の基準\nとなる。\n","23":"第23章　判例と条文\n判例は、\n条文と対立するもの\nではない。\nむしろ、\n条文\n↓\n意味が問題になる\n↓\n裁判所が解釈\n↓\n判例\n↓\n条文の具体的意味が明らかになる\nという関係が多い。\n","24":"第24章　判例と法解釈\n法律には、\n抽象的な文言\nが多い。\n例えば、\n「正当な理由」\n「相当な期間」\n「信義に従い」\nなど。\nそこで裁判所が、\n具体的事件でどのような意味を持つか\nを判断する。\n","25":"第25章　法解釈とは何か\n法解釈とは、\n法規範の意味・内容を明らかにする作業\nである。\n単に、\n条文を読む\nだけではない。\nその文言が、\n「この事件ではどういう意味になるのか」\nまで考える。\n","26":"第26章　なぜ法解釈が必要なのか\n法律の条文は、\nすべての具体的事件を詳細に書いているわけではない。\n例えば、\n「権利を濫用してはならない」\nという条文がある。\nでは、\nどこからが権利濫用なのか？\nという問題が生じる。\nそこで解釈が必要になる。\n","27":"第27章　文理解釈\n文理解釈とは、\n条文の文言・文章構造を重視して意味を明らかにする解釈\nである。\nまず、\n「条文に何と書いてあるか」\nを見る。\n法律解釈の出発点となる。\n","28":"第28章　論理解釈\n論理解釈とは、\n条文の文言だけでなく、制度・目的・他の条文との関係などを考慮して意味を明らかにする解釈\nである。\n例えば、\n条文\n↓\n制度趣旨\n↓\n他の条文\n↓\n法体系\n↓\n具体的意味\nと考える。\n","29":"第29章　目的論的解釈\n目的論的解釈では、\nその法律が何のために作られたのか\nを考える。\n例えば、\n消費者保護を目的とする法律なら、\n消費者保護という目的\nを踏まえて条文を解釈する。\nただし、\n目的だけを理由に条文の文言から大きく離れてよいわけではない。\n","30":"第30章　体系解釈\n体系解釈とは、\nその条文だけでなく、法律全体・法体系との関係から意味を考える方法\nである。\n条文A\n↕\n条文B\n↕\n条文C\n↓\n法律全体\n↓\n意味を確定\nという考え方。\n","31":"第31章　反対解釈\n反対解釈とは、\nある事項について法律が規定していることから、その反対の場合にはその規定を適用しないと考える解釈\nである。\nただし、\nいつでも反対解釈が成立するわけではない。\n条文の趣旨・構造を確認する必要がある。\n","32":"第32章　類推解釈\n類推解釈とは、\n条文が直接対象としていない事例について、趣旨が同じように妥当すると考え、規定を類推して適用すること\nである。\nAの場合\n↓\n法律が規定\nBの場合\n↓\n条文には直接書いていない\n↓\nAとBの趣旨が実質的に同じ\n↓\n類推適用を検討\n","33":"第33章　拡張解釈\n拡張解釈とは、\n条文の文言が通常理解される範囲よりも広く、その意味を解する解釈\nである。\nただし、\n法律の文言から完全に離れて自由に意味を作ることではない。\n","34":"第34章　縮小解釈\n縮小解釈とは、\n条文の文言上は広く読める場合でも、趣旨等から適用範囲を狭くする解釈\nである。\n例えば、\n文言だけなら広く適用できそうだが、制度趣旨から一部の場合を除外する\nといった場合。\n","35":"第35章　反対解釈と類推解釈\nこの2つは混同しやすい。\n反対解釈\nA\n↓\n法律が適用される\nB\n↓\nAと反対だから\n↓\n法律を適用しない\n類推解釈\nA\n↓\n法律が適用される\nB\n↓\nAと趣旨が同じ\n↓\n条文を類推適用\nつまり、\n反対解釈＝適用しない方向\n類推解釈＝適用する方向\nというイメージ。\n","36":"第36章　類推解釈と刑法\n刑法では、\n類推解釈によって犯罪成立範囲を広げること\nは許されない。\nこれは、\n罪刑法定主義\nと関係する。\n刑罰\n↓\n法律による明確な根拠\n↓\n犯罪成立範囲を勝手に拡張\n×\n","37":"第37章　法解釈と人権保障\n憲法上の人権に関わる場合、\n国家権力による人権制約\nが問題になる。\nそのため、\n法律の文言・目的・憲法との整合性\nなどを慎重に検討する必要がある。\n","38":"第38章　法解釈と憲法\n法律の解釈は、\n憲法に適合するように行う\nことが重要になる。\n法律に複数の解釈が可能で、\n一方は憲法に適合し、他方は憲法に反する\nという場合、\n憲法適合的な解釈が可能か\nを検討することがある。\n","39":"第39章　法の適用とは何か\n法の適用とは、\n一般的な法規範を具体的な事件・事実に適用して、法律上の結論を導くこと\nである。\n一般的な法律\n↓\n具体的事実\n↓\n要件に該当するか\n↓\n法律効果\n","40":"第40章　法適用の基本構造\n法の適用は、\n① 法規範を発見\n↓\n② 法規範を解釈\n↓\n③ 事実を確定\n↓\n④ 要件に当てはめる\n↓\n⑤ 法律効果を導く\nという流れになる。\n","41":"第41章　事実認定\n法律問題では、\n法律だけではなく事実も重要。\n例えば、\n「契約が成立した」\nという法律効果を考えるには、\n本当に意思の合致があったのか？\nを確認する必要がある。\nこれが、\n事実認定\nである。\n","42":"第42章　法的評価\n事実を確認しただけでは、\n法律上の結論\nは出ない。\n例えば、\nAがBを殴った。\nという事実から、\n暴行なのか、傷害なのか、正当防衛なのか\nなどを法律上評価する必要がある。\n","43":"第43章　当てはめ\n当てはめとは、\n具体的事実が法律上の要件を満たすかを判断すること\nである。\n法律\n「Aという要件が必要」\n↓\n事実\n「実際にAがあった」\n↓\n要件充足\n↓\n法律効果\n","44":"第44章　法的三段論法\n法的三段論法は、\n法規範と具体的事実を結びつけて法律上の結論を導く思考方法\nである。\n大前提\n法律のルール\n小前提\n具体的事実\n結論\n法律効果\n大前提\n「XならY」\n小前提\n「AはXである」\n結論\n「AにはYが生じる」\n","45":"第45章　法的三段論法の具体例\n例えば、\n他人の物を故意に壊した者は損害賠償責任を負う。\nというルールがあるとする。\nAが、\nBの所有する時計を故意に壊した。\nなら、\n大前提\n故意に他人の物を壊す\n→\n損害賠償責任\n小前提\nAはBの時計を故意に壊した\n結論\nAはBに損害賠償責任を負う\nとなる。\n","46":"第46章　法律問題では「要件」を探す\n法律を読むとき、\n結論だけを探してはいけない。\nまず、\nその結論が発生するための要件\nを探す。\n法律効果\n↓\n何が必要？\n↓\n要件\n↓\n具体的事実\n↓\n満たしている？\n","47":"第47章　法律効果\n法律効果とは、\n法律上発生する権利・義務・地位その他の法的結果\nである。\n例えば、\n• 契約成立\n• 損害賠償義務\n• 取消し\n• 解除\n• 刑罰\n• 行政処分\nなど。\n","48":"第48章　要件事実\n要件事実とは、\nある法律効果を発生させるために、法律上必要となる具体的事実\nである。\n例えば、\n損害賠償請求\n↓\n一定の要件\n↓\n故意・過失\n＋\n権利侵害等\n＋\n損害\n＋\n因果関係\nというように、\n法律効果を導くために必要な事実を整理する。\n","49":"第49章　法適用と証拠\n裁判では、\n「その事実が本当にあったのか」\nが問題になる。\nそこで、\n• 書類\n• 証言\n• 物\n• 電子データ\nなどの証拠によって事実を認定する。\n証拠\n↓\n事実認定\n↓\n要件への当てはめ\n↓\n法律効果\n","50":"第50章　法律解釈と事実認定の違い\nここは重要。\n法解釈\n法律の意味を明らかにする。\n事実認定\n実際に何が起きたのかを確定する。\n当てはめ\n確定した事実が法律の要件を満たすか判断する。\n法解釈\n＋\n事実認定\n↓\n当てはめ\n↓\n結論\n","51":"第51章　法律問題を解く基本手順\n法律問題では、\n① 事実を読む\n↓\n② 法的問題を発見\n↓\n③ 関係する法分野を特定\n↓\n④ 適用法を探す\n↓\n⑤ 条文を確認\n↓\n⑥ 条文を解釈\n↓\n⑦ 要件を分解\n↓\n⑧ 事実を認定\n↓\n⑨ 当てはめ\n↓\n⑩ 法律効果\n↓\n⑪ 救済方法\nという流れで考える。\n","52":"第52章　法律の欠缺\n法律が、\nある問題について明確な規定を置いていない\n場合がある。\nこれを、\n法の欠缺\nという。\nこの場合、\n• 類推\n• 慣習\n• 一般原則\n• 他の法規範\nなどを用いて解決することが問題になる。\n","53":"第53章　類推適用による補充\n法律に明確な規定がない。\n↓\n似た制度の規定がある。\n↓\n両者の趣旨が共通する。\n↓\nその規定を類推適用できないか検討する。\nただし、\n類推適用が常に許されるわけではない。\n特に刑罰法規では、\n被告人に不利な類推による処罰範囲の拡張\nは許されない。\n","54":"第54章　法の一般原則\n具体的な条文だけで解決できない場合、\n法の一般原則\nが重要になることがある。\n例えば、\n• 信義則\n• 権利濫用禁止\n• 公序良俗\n• 平等\n• 適正手続\nなど。\nただし、\nどの原則をどのように使うか\nについては具体的な法分野ごとの検討が必要。\n","55":"第55章　法解釈の限界\n法解釈は、\n「裁判官が好きなように法律を作ること」\nではない。\n解釈には、\n• 文言\n• 体系\n• 趣旨\n• 立法目的\n• 憲法\n• 他の法規範\nなどによる制約がある。\nしたがって、\n解釈と立法は区別する。\n","56":"第56章　立法と解釈\n立法\n新しいルールを制定する。\n解釈\n既に存在する法規範の意味を明らかにする。\n国会\n↓\n立法\n↓\n法律\n裁判所\n↓\n解釈・適用\n↓\n具体的事件\nもちろん、\n判例によって法解釈が発展する\nことはある。\n","57":"第57章　判例の読み方\n判例を読むときは、\n① どんな事実だったか\n↓\n② 何が争われたか\n↓\n③ どの条文が問題になったか\n↓\n④ 裁判所はどう判断したか\n↓\n⑤ なぜそう判断したか\n↓\n⑥ その判断はどんな事件に使えるか\nを見る。\n","58":"第58章　判例の「結論」だけを覚えない\n例えば、\n「最高裁はAと判断した」\nだけでは不十分。\n重要なのは、\nなぜAと判断したのか\nである。\n事実\n↓\n争点\n↓\n規範\n↓\n理由\n↓\n結論\nという構造で覚える。\n","59":"第59章　法源から法適用まで\nここまでを一つにつなげる。\n法源\n↓\n憲法・法律・命令・条例・慣習等\n↓\n適用される法規範を発見\n↓\n条文・判例等を確認\n↓\n法解釈\n↓\n要件を整理\n↓\n事実認定\n↓\n当てはめ\n↓\n法律効果\n↓\n救済\nこれが法律学の基本的な流れ。\n","60":"第60章　総合事例①――契約\nAがBから商品を購入した。\nBが商品を引き渡さない。\nまず、\n民法上の売買契約\nを確認する。\n↓\n契約が成立しているか。\n↓\nBに引渡義務があるか。\n↓\n履行期が到来しているか。\n↓\n履行遅滞の要件を満たすか。\n↓\nどの法律効果が発生するか。\nという順番で考える。\n","61":"第61章　総合事例②――行政処分\n行政庁がAに不利益な処分をした。\nAが、\n「この処分は違法だ」\nと主張する。\nここでは、\n行政庁\n↓\nどんな処分？\n↓\n法律上の根拠は？\n↓\n要件を満たす？\n↓\n裁量はある？\n↓\n手続は適法？\n↓\n違法？\n↓\n取消訴訟等による救済\nと考える。\n","62":"第62章　総合事例③――犯罪\nAがBを殴って負傷させた。\n事実\n↓\nAがBを殴った\n↓\n刑法上のどの犯罪？\n↓\n構成要件\n↓\n違法性\n↓\n責任\n↓\n犯罪成立\n↓\n刑罰\nという順序で考える。\n","63":"第63章　総合事例④――法の抵触\n法律Aと命令Bの内容が矛盾している。\nこの場合、\n① 法形式を確認\n↓\n② 上位・下位関係を確認\n↓\n③ 命令の法律上の根拠を確認\n↓\n④ 委任の範囲を確認\n↓\n⑤ 抵触の有無を判断\n↓\n⑥ 必要なら裁判で争う\nという流れになる。\n","64":"第64章　第3編の基本公式\n法律を学ぶときは、\n「どこから来たルールか」→「何という意味か」→「この事実に当てはまるか」\nの3段階で考える。\n法源\n↓\n法解釈\n↓\n法適用\nさらに細かくすると、\n法源\n↓\n規範発見\n↓\n解釈\n↓\n要件分解\n↓\n事実認定\n↓\n当てはめ\n↓\n法律効果\n","65":"第65章　第3編の核心\n第3編の核心は、\n法律問題は「条文を知っているか」だけでは解けない。\n必要なのは、\n① 適用される法規範を見つける\n② その意味を解釈する\n③ 具体的事実を認定する\n④ 要件に当てはめる\n⑤ 法律効果を導く\nという一連の思考。\nつまり、\n法源 → 解釈 → 適用\nが法律学の基本動作になる。\n","66":"第66章　自己説明チェック\n以下を何も見ずに説明する。\n法源\n1. 法源とは何か。\n2. なぜ法源を学ぶのか。\n3. 成文法とは何か。\n4. 不文法とは何か。\n5. 成文法と不文法の違いは？\n6. 日本で成文法が重要なのはなぜか。\n7. 憲法は法体系の中でどのような位置にあるか。\n8. 法律とは何か。\n9. 命令とは何か。\n10. 政令とは何か。\n11. 省令とは何か。\n12. 条例とは何か。\n13. 法令の上下関係をどう考えるか。\n14. 委任立法とは何か。\n15. 委任立法にはなぜ限界があるか。\n16. 慣習法とは何か。\n17. 判例とは何か。\n18. 判例と法律は同じものか。\n法解釈\n19. なぜ法解釈が必要なのか。\n20. 文理解釈とは何か。\n21. 論理解釈とは何か。\n22. 目的論的解釈とは何か。\n23. 体系解釈とは何か。\n24. 反対解釈とは何か。\n25. 類推解釈とは何か。\n26. 拡張解釈とは何か。\n27. 縮小解釈とは何か。\n28. 反対解釈と類推解釈の違いは？\n29. なぜ刑法で不利な類推解釈が禁止されるのか。\n30. 法解釈にはどのような限界があるか。\n法の適用\n31. 法の適用とは何か。\n32. 事実認定とは何か。\n33. 法的評価とは何か。\n34. 当てはめとは何か。\n35. 法的三段論法とは何か。\n36. 大前提・小前提・結論とは何か。\n37. 要件とは何か。\n38. 法律効果とは何か。\n39. 要件事実とは何か。\n40. 証拠はなぜ必要なのか。\n41. 法解釈と事実認定の違いは？\n42. 法律問題を解く基本手順は？\n43. 法の欠缺とは何か。\n44. なぜ類推適用が問題になるのか。\n45. 立法と解釈の違いは？\n","67":"第67章　第3編最終整理\n① 法源\n法源\n│\n├─ 憲法\n├─ 法律\n├─ 命令\n│   ├─ 政令\n│   └─ 省令等\n├─ 条例\n├─ 慣習法等\n└─ 判例・法理\n↓\n② 法解釈\n条文\n↓\n文理解釈\n↓\n論理解釈\n↓\n目的・体系・制度趣旨\n↓\n必要に応じて\n類推・反対・拡張・縮小\n↓\n規範の意味を確定\n↓\n③ 法適用\n一般的な法規範\n↓\n具体的事実\n↓\n事実認定\n↓\n要件に当てはめ\n↓\n法律効果\n↓\n④ 救済\n法律効果\n↓\n権利侵害・紛争\n↓\n裁判・行政等\n↓\n権利実現・救済\n\n★ 第3編の最重要10ポイント\n1. 法源とは、法的判断の根拠となる法規範の形式・由来である。\n2. 日本では憲法・法律などの成文法が中心的な位置を占める。\n3. 命令は法律に反することができず、委任にも限界がある。\n4. 条例は地方公共団体による自治立法である。\n5. 判例は法律そのものではないが、法解釈・実務上非常に重要である。\n6. 法解釈とは、法規範の意味・内容を明らかにする作業である。\n7. 文理解釈・論理解釈・体系解釈・目的論的解釈などを組み合わせて考える。\n8. 類推解釈は、条文の趣旨を類似事例に及ぼすが、特に刑罰法規では限界がある。\n9. 法の適用では、法規範・事実・当てはめを区別する。\n10. 法律学の基本公式は「法源→解釈→事実認定→当てはめ→法律効果」である。\n\n第3編 完成\n第1編\n法とは何か・法の基本概念\n↓\n「法とは何か？」\n第2編\n法の種類・法体系\n↓\n「法にはどんな種類がある？」\n第3編\n法源・法の適用・解釈\n↓\n「その法はどこから来て、どう読み、どう事件に適用する？」\nここまでで、\n法そのものを理解するための基本理論\nが完成した。\n次の第4編では、\n「実際に法を使って争いを解決する仕組み」\nに進む。\nつまり、\n裁判とは何か\n↓\n民事裁判\n↓\n刑事裁判\n↓\n行政事件\n↓\n裁判所\n↓\n検察\n↓\n警察\n↓\n弁護士\n↓\n訴訟\n↓\n証拠\n↓\n判決\n↓\n司法制度\nという、裁判・司法制度・法的手続を体系的に学ぶ。"}},"questions":{"1":{"1":[{"text":"法とは、\n社会における人々の行動や関係を「1」、国家などによって「2」\nである。\n人間が複数人で生活すると、\n• 何をしてよいのか\n• 何をしてはいけないのか\n• 誰が何を請求できるのか\n• 誰が責任を負うのか\nを決める必要がある。\nそこで法が必要になる。\n人間が社会で生活する\n↓\n「3」\n↓\nルールが必要になる\n↓\n法によって規律する\n↓\n「4」","source":"法とは、\n社会における人々の行動や関係を規律するための、国家などによって公的に認められた規範\nである。\n人間が複数人で生活すると、\n• 何をしてよいのか\n• 何をしてはいけないのか\n• 誰が何を請求できるのか\n• 誰が責任を負うのか\nを決める必要がある。\nそこで法が必要になる。\n人間が社会で生活する\n↓\n利害が衝突する\n↓\nルールが必要になる\n↓\n法によって規律する\n↓\n社会秩序を形成する","answers":[{"n":1,"correct":"規律するための","options":["処罰するための","救済するための","規律するための","管理するための"]},{"n":2,"correct":"公的に認められた規範","options":["単なる習慣","個人的な価値判断","政治的な意見","公的に認められた規範"]},{"n":3,"correct":"利害が衝突する","options":["法律が成立する","利害が衝突する","裁判が確定する","権利が消滅する"]},{"n":4,"correct":"社会秩序を形成する","options":["刑罰を決定する","社会秩序を形成する","会社を設立する","契約を成立させる"]}]}],"2":[{"text":"もし社会に「1」がなければ、\n「自分はこう思う」\nだけで行動することになる。\nすると、\nA「これは自分の物だ」\nB「いや、自分の物だ」\n↓\n「2」\n↓\n解決できない\nという問題が発生する。\nそこで法が、\n「誰に権利があるのか」\n「どのような場合に責任を負うのか」\nを決める。\nつまり法には、\n社会の「3」\nがある。","source":"もし社会に共通のルールがなければ、\n「自分はこう思う」\nだけで行動することになる。\nすると、\nA「これは自分の物だ」\nB「いや、自分の物だ」\n↓\n争い\n↓\n解決できない\nという問題が発生する。\nそこで法が、\n「誰に権利があるのか」\n「どのような場合に責任を負うのか」\nを決める。\nつまり法には、\n社会の紛争を予防・解決する機能\nがある。","answers":[{"n":1,"correct":"共通のルール","options":["公的に認められた規範","共通のルール","規律するための","利害が衝突する"]},{"n":2,"correct":"争い","options":["規律するための","利害が衝突する","公的に認められた規範","争い"]},{"n":3,"correct":"紛争を予防・解決する機能","options":["利害が衝突する","紛争を予防・解決する機能","公的に認められた規範","規律するための"]}]}],"3":[{"text":"法には複数の目的がある。\n主なものは、\n1. 「1」\n2. 「2」\n3. 紛争の解決\n4. 公正・公平の実現\n5. 人権の ールが優先され、条文をどう解釈して具体的事件に適用するのか」\nを学ぶ。\nつまり、\n法とは何か\n↓\n法にはどんな種類があるか\n↓\n法はどこから来るのか\n↓\n法をどう解釈するのか\n↓\n具体的事件にどう適用するのか\nという、法律学の思考の流れへ進んでいく。","answers":[{"n":1,"correct":"特別法が一般法に優先する","options":["権利・義務の内容","法律が標準的なルールを用意する","特別法が一般法に優先する","商取引に関する特別なルール"]},{"n":2,"correct":"強行法規","options":["一般的な私人間ルール","法律による行政","消費者法","強行法規"]},{"n":3,"correct":"任意法規","options":["犯罪と刑罰、犯罪を処理する手続などを規律する法の総称","国内法と国際法","任意法規","特別法が一般法に優先する"]},{"n":4,"correct":"最高法規","options":["どの法律関係が存在するか","何と何を比較しているのか","最高法規","どの法秩序に属するか"]},{"n":5,"correct":"複数の法分野","options":["複数の法分野","国家内部で適用される法","実体法／手続法","国内法と国際法"]},{"n":6,"correct":"法体系の中で位置づけることが重要","options":["民法などの実体法","法体系の中で位置づけることが重要","国家権力を制限","他の法律との接点はないか"]}]}]},"3":{"1":[{"text":"第1章　「1」とは何か\n法源とは、\n法としての規範が成立し、法的判断の根拠となる形式・由来\nをいう。\n簡単にいえば、\n「このルールは、「2」？」\nという問題である。\n例えば、\nこのルールは何を根拠としている？\n↓\n憲法？\n法律？\n命令？\n条例？\n判例？\n慣習？\nというように考える。\n","source":"第1章　法源とは何か\n法源とは、\n法としての規範が成立し、法的判断の根拠となる形式・由来\nをいう。\n簡単にいえば、\n「このルールは、どこから来たのか？」\nという問題である。\n例えば、\nこのルールは何を根拠としている？\n↓\n憲法？\n法律？\n命令？\n条例？\n判例？\n慣習？\nというように考える。\n","answers":[{"correct":"法源","options":["法源","どこから来たのか","法律関係","法的責任"]},{"correct":"どこから来たのか","options":["どこから来たのか","法源","法律関係","法的責任"]}]}],"2":[{"text":"第2章　なぜ「2」を学ぶのか\n法律問題では、\n「なんとなくこう思う」\nでは結論を出せない。\n必要なのは、\n「1」\nである。\nしたがって、\n具体的な事件\n↓\n法的根拠を探す\n↓\n法源を確認\n↓\n適用されるルールを特定\n↓\n結論\nという流れになる。\n","source":"第2章　なぜ法源を学ぶのか\n法律問題では、\n「なんとなくこう思う」\nでは結論を出せない。\n必要なのは、\n法的な根拠\nである。\nしたがって、\n具体的な事件\n↓\n法的根拠を探す\n↓\n法源を確認\n↓\n適用されるルールを特定\n↓\n結論\nという流れになる。\n","answers":[{"correct":"法的な根拠","options":["法的な根拠","法源","法律関係","法的責任"]},{"correct":"法源","options":["法源","法的な根拠","法律関係","法的責任"]}]}],"3":[{"text":"第3章　「1」\n成文法とは、\n「2」\nである。\n日本では、\n• 憲法\n• 法律\n• 政令\n• 省令\n• 条例\nなどが代表的。\n成文法の特徴は、\n内容が文章として公示されている\nことである。\n","source":"第3章　成文法\n成文法とは、\n文章として明確な形式で制定された法\nである。\n日本では、\n• 憲法\n• 法律\n• 政令\n• 省令\n• 条例\nなどが代表的。\n成文法の特徴は、\n内容が文章として公示されている\nことである。\n","answers":[{"correct":"成文法","options":["成文法","文章として明確な形式で制定された法","法律関係","法的責任"]},{"correct":"文章として明確な形式 ","法的責任"]},{"correct":"法解釈の基準","options":["法解釈の基準","一定の解釈","法律関係","法的責任"]}]}],"23":[{"text":"第23章　判例と条文\n判例は、\n条文と対立するもの\nではない。\nむしろ、\n条文\n↓\n意味が問題になる\n↓\n「1」\n↓\n判例\n↓\n「2」が明らかになる\nという関係が多い。\n","source":"第23章　判例と条文\n判例は、\n条文と対立するもの\nではない。\nむしろ、\n条文\n↓\n意味が問題になる\n↓\n裁判所が解釈\n↓\n判例\n↓\n条文の具体的意味が明らかになる\nという関係が多い。\n","answers":[{"correct":"裁判所が解釈","options":["裁判所が解釈","条文の具体的意味","法律関係","法的責任"]},{"correct":"条文の具体的意味","options":["条文の具体的意味","裁判所が解釈","法律関係","法的責任"]}]}],"24":[{"text":"第24章　判例と法解釈\n法律には、\n「1」\nが多い。\n例えば、\n「正当な理由」\n「相当な期間」\n「信義に従い」\nなど。\nそこで裁判所が、\n「2」でどのような意味を持つか\nを判断する。\n","source":"第24章　判例と法解釈\n法律には、\n抽象的な文言\nが多い。\n例えば、\n「正当な理由」\n「相当な期間」\n「信義に従い」\nなど。\nそこで裁判所が、\n具体的事件でどのような意味を持つか\nを判断する。\n","answers":[{"correct":"抽象的な文言","options":["抽象的な文言","具体的事件","法律関係","法的責任"]},{"correct":"具体的事件","options":["具体的事件","抽象的な文言","法律関係","法的責任"]}]}],"25":[{"text":"第25章　法解釈とは何か\n法解釈とは、\n「1」\nである。\n単に、\n「2」\nだけではない。\nその文言が、\n「この事件ではどういう意味になるのか」\nまで考える。\n","source":"第25章　法解釈とは何か\n法解釈とは、\n法規範の意味・内容を明らかにする作業\nである。\n単に、\n条文を読む\nだけではない。\nその文言が、\n「この事件ではどういう意味になるのか」\nまで考える。\n","answers":[{"correct":"法規範の意味・内容を明らかにする作業","options":["法規範の意味・内容を明らかにする作業","条文を読む","法律関係","法的責任"]},{"correct":"条文を読む","options":["条文を読む","法規範の意味・内容を明らかにする作業","法律関係","法的責任"]}]}],"26":[{"text":"第26章　なぜ「2」が必要なのか\n法律の条文は、\nすべての「1」。\n例えば、\n「権利を濫用してはならない」\nという条文がある。\nでは、\nどこからが権利濫用なのか？\nという問題が生じる。\nそこで解釈が必要になる。\n","source":"第26章　なぜ法解釈が必要なのか\n法律の条文は、\nすべての具体的事件を詳細に書いているわけではない。\n例えば、\n「権利を濫用してはならない」\nという条文がある。\nでは、\nどこからが権利濫用なのか？\nという問題が生じる。\nそこで解釈が必要になる。\n","answers":[{"correct":"具体的事件を詳細に書いているわけではない","options":["具体的事件を詳細に書いているわけではない","法解釈","法律関係","法的責任"]},{"correct":"法解釈","options":["法解釈","具体的事件を詳細に書いているわけではない","法律関係","法的責任"]}]}],"27":[{"text":"第27章　「1」\n文理解釈とは、\n「2」を重視して意味を明らかにする解釈\nである。\nまず、\n「条文に何と書いてあるか」\nを見る。\n法律解釈の出発点となる。\n","source":"第27章　文理解釈\n文理解釈とは、\n条文の文言・文章構造を重視して意味を明らかにする解釈\nである。\nまず、\n「条文に何と書いてあるか」\nを見る。\n法律解釈の出発点となる。\n","answers":[{"correct":"文理解釈","options":["文理解釈","条文の文言・文章構造","法律関係","法的責任"]},{"correct":"条文の文言・文章構造","options":["条文の文言・文章構造","文理解釈","法律関係","法的責任"]}]}],"28":[{"text":"第28章　「1」\n論理解釈とは、\n条文の文言だけでなく、「2」などを考慮して意味を明らかにする解釈\nである。\n例えば、\n条文\n↓\n制度趣旨\n↓\n他の条文\n↓\n法体系\n↓\n具体的意味\nと考える。\n","source":"第28章　論理解釈\n論理解釈とは、\n条文の文言だけでなく、制度・目的・他の条文との関係などを考慮して意味を明らかにする解釈\nである。\n例えば、\n条文\n↓\n制度趣旨\n↓\n他の条文\n↓\n法体系\n↓\n具体的意味\nと考える。\n","answers":[{"correct":"論理解釈","options":["論理解釈","制度・目的・他の条文との関係","法律関係","法的責任"]},{"correct":"制度・目的・他の条文との関係","options":["制度・目的・他の条文との関係","論理解釈","法律関係","法的責任"]}]}],"29":[{"text":"第29章　「1」\n目的論的解釈では、\nその法律が何のために作られたのか\nを考える。\n例えば、\n消費者保護を目的とする法律なら、\n「2」\nを踏まえて条文を解釈する。\nただし、\n目的だけを理由に条文の文言から大きく離れてよいわけではない。\n","source":"第29章　目的論的解釈\n目的論的解釈では、\nその法律が何のために作られたのか\nを考える。\n例えば、\n消費者保護を目的とする法律なら、\n消費者保護という目的\nを踏まえて条文を解釈する。\nただし、\n目的だけを理由に条文の文言から大きく離れてよいわけではない。\n","answers":[{"correct":"目的論的解釈","options":["目的論的解釈","消費者保護という目的","法律関係","法的責任"]},{"correct":"消費者保護という目的","options":["消費者保護という目的","目的論的解釈","法律関係","法的責任"]}]}],"30":[{"text":"第30章　「1」\n体系解釈とは、\nその条文だけでなく、「2」から意味を考える方法\nである。\n条文A\n↕\n条文B\n↕\n条文C\n↓\n法律全体\n↓\n意味を確定\nという考え方。\n","source":"第30章　体系解釈\n体系解釈とは、\nその条文だけでなく、法律全体・法体系との関係から意味を考える方法\nである。\n条文A\n↕\n条文B\n↕\n条文C\n↓\n法律全体\n↓\n意味を確定\nという考え方。\n","answers":[{"correct":"体系解釈","options":["体系解釈","法律全体・法体系との関係","法律関係","法的責任"]},{"correct":"法律全体・法体系との関係","options":["法律全体・法体系との関係","体系解釈","法律関係","法的責任"]}]}],"31":[{"text":"第31章　「1」\n反対解釈とは、\nある事項について法律が規定していることから、その反対の場合にはその規定を「2」と考える解釈\nである。\nただし、\nいつでも反対解釈が成立するわけではない。\n条文の趣旨・構造を確認する必要がある。\n","source":"第31章　反対解釈\n反対解釈とは、\nある事項について法律が規定していることから、その反対の場合にはその規定を適用しないと考える解釈\nである。\nただし、\nいつでも反対解釈が成立するわけではない。\n条文の趣旨・構造を確認する必要がある。\n","answers":[{"correct":"反対解釈","options":["反対解釈","適用しない","法律関係","法的責任"]},{"correct":"適用しない","options":["適用しない","反対解釈","法律関係","法的責任"]}]}],"32":[{"text":"第32章　「1」\n類推解釈とは、\n条文が直接対象としていない事例について、趣旨が同じように妥当すると考え、規定を類推して適用すること\nである。\nAの場合\n↓\n法律が規定\nBの場合\n↓\n条文には直接書いていない\n↓\nAとBの趣旨が実質的に同じ\n↓\n「2」を検討\n","source":"第32章　類推解釈\n類推解釈とは、\n条文が直接対象としていない事例について、趣旨が同じように妥当すると考え、規定を類推して適用すること\nである。\nAの場合\n↓\n 。\nそのため、\n法律の文言・目的・「2」\nなどを慎重に検討する必要がある。\n","source":"第37章　法解釈と人権保障\n憲法上の人権に関わる場合、\n国家権力による人権制約\nが問題になる。\nそのため、\n法律の文言・目的・憲法との整合性\nなどを慎重に検討する必要がある。\n","answers":[{"correct":"国家権力による人権制約","options":["国家権力による人権制約","憲法との整合性","法律関係","法的責任"]},{"correct":"憲法との整合性","options":["憲法との整合性","国家権力による人権制約","法律関係","法的責任"]}]}],"38":[{"text":"第38章　法解釈と憲法\n法律の解釈は、\n「1」\nことが重要になる。\n法律に複数の解釈が可能で、\n一方は憲法に適合し、他方は憲法に反する\nという場合、\n「2」が可能か\nを検討することがある。\n","source":"第38章　法解釈と憲法\n法律の解釈は、\n憲法に適合するように行う\nことが重要になる。\n法律に複数の解釈が可能で、\n一方は憲法に適合し、他方は憲法に反する\nという場合、\n憲法適合的な解釈が可能か\nを検討することがある。\n","answers":[{"correct":"憲法に適合するように行う","options":["憲法に適合するように行う","憲法適合的な解釈","法律関係","法的責任"]},{"correct":"憲法適合的な解釈","options":["憲法適合的な解釈","憲法に適合するように行う","法律関係","法的責任"]}]}],"39":[{"text":"第39章　法の適用とは何か\n法の適用とは、\n「1」を「2」に適用して、法律上の結論を導くこと\nである。\n一般的な法律\n↓\n具体的事実\n↓\n要件に該当するか\n↓\n「3」\n","source":"第39章　法の適用とは何か\n法の適用とは、\n一般的な法規範を具体的な事件・事実に適用して、法律上の結論を導くこと\nである。\n一般的な法律\n↓\n具体的事実\n↓\n要件に該当するか\n↓\n法律効果\n","answers":[{"correct":"一般的な法規範","options":["一般的な法規範","具体的な事件・事実","法律効果","法律関係"]},{"correct":"具体的な事件・事実","options":["具体的な事件・事実","一般的な法規範","法律効果","法律関係"]},{"correct":"法律効果","options":["法律効果","一般的な法規範","具体的な事件・事実","法律関係"]}]}],"40":[{"text":"第40章　法適用の基本構造\n法の適用は、\n① 「1」\n↓\n② 「2」\n↓\n③ 「3」\n↓\n④ 「4」\n↓\n⑤ 法律効果を導く\nという流れになる。\n","source":"第40章　法適用の基本構造\n法の適用は、\n① 法規範を発見\n↓\n② 法規範を解釈\n↓\n③ 事実を確定\n↓\n④ 要件に当てはめる\n↓\n⑤ 法律効果を導く\nという流れになる。\n","answers":[{"correct":"法規範を発見","options":["法規範を発見","法規範を解釈","事実を確定","要件に当てはめる"]},{"correct":"法規範を解釈","options":["法規範を解釈","法規範を発見","事実を確定","要件に当てはめる"]},{"correct":"事実を確定","options":["事実を確定","法規範を発見","法規範を解釈","要件に当てはめる"]},{"correct":"要件に当てはめる","options":["要件に当てはめる","法規範を発見","法規範を解釈","事実を確定"]}]}],"41":[{"text":"第41章　「1」\n法律問題では、\n法律だけではなく事実も重要。\n例えば、\n「契約が成立した」\nという法律効果を考えるには、\n本当に「2」があったのか？\nを確認する必要がある。\nこれが、\n事実認定\nである。\n","source":"第41章　事実認定\n法律問題では、\n法律だけではなく事実も重要。\n例えば、\n「契約が成立した」\nという法律効果を考えるには、\n本当に意思の合致があったのか？\nを確認する必要がある。\nこれが、\n事実認定\nである。\n","answers":[{"correct":"事実認定","options":["事実認定","
