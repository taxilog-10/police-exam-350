とか。\nQ3\n会社と株主はなぜ別人格なのか。\nQ4\n会社財産と株主財産はどう違うか。\nQ5\n定款とは何か。\nQ6\n会社法上の会社にはどのような種類があるか。\nQ7\n持分会社とは何か。\nQ8\n株式会社と持分会社はどう違うか。\nQ9\n会社法上の「社員」は従業員と同じか。\nQ10\n株主とは何か。\nQ11\n株式とは何か。\nQ12\n有限責任とは何か。\nQ13\n直接責任と間接責任の違いは何か。\nQ14\n所有と経営の分離とは何か。\nQ15\n株主総会とは何か。\nQ16\n取締役とは何か。\nQ17\n代表取締役とは何か。\nQ18\n会社法で機関設計が重要なのはなぜか。\nQ19\n会社法で会社債権者の保護が問題になるのはなぜか。\nQ20\n法人格否認の法理とは何か。","blanks":["会社","株主","責任"],"options":[["会社","両方","債務","出資"],["株主","両方","会社","債務"],["責任","両方","会社","債務"]],"explanations":["本文：会社法とは何か。","本文：会社と株主はなぜ別人格なのか。","本文：有限責任とは何か。"],"mode":"commercial"},"54":{"text":"会社法の出発点\n会社 ↓ 独立した法人格 ↓ 会社自身が権利義務の主体\n株式会社\n出資 ↓ 株式 ↓ 株主 ↓ 株主総会 ↓ 取締役等 ↓ 経営 ↓ 会社\n持分会社\n持分会社\n├─ 合名会社\n│   └─ 全員無限責任\n│\n├─ 合資会社\n│   └─ 無限＋有限\n│\n└─ 合同会社\n└─ 全員有限責任\n会社法の最終構造\n出資者\n↓\n会社\n↓\n法人格\n↓\n会社財産\n↓\n機関\n├─ 意思決定\n├─ 業務執行\n└─ 監督\n↓\n事業活動\n↓\n利益・債務\n↓\n株主・債権者・役員の利益調整\n★ 第3編の最重要ポイント\n1.\t会社は法人格を持つ\n2.\t会社と株主・社員は別人格\n3.\t会社財産と個人財産は区別される\n4.\t株式会社では株主が社員であり、株式を持つ\n5.\t株式会社の株主は有限責任\n6.\t合名・合資・合同会社を持分会社という\n7.\t会社法の重要テーマは「誰が決め、誰が経営し、誰が監督し、誰が責任を負うか」\n8.\t株式会社では所有と経営を分離できる\n9.\t法人格否認の法理は例外的な法理\n10.\t会社法は株主・経営者・債権者などの利益を調整する法律でもある\n第3編 完成\n第1編 商法総論 ↓ 商人・営業・商号・商業登記・支配人等\n第2編 商行為 ↓ 商人間売買・代理商・仲立・問屋・運送・寄託等\n第3編 会社法総論 ↓ 会社・法人格・会社の種類・株主・社員・出資・有限責任・機関\n↓\n次は第4編「株式会社」\nここから会社法の中心に入り、\n設立 → 株式 → 株主 → 株主総会 → 取締役 → 取締役会 → 代表取締役 → 監査役 → 役員責任 → 株式会社のガバナンス\nを一つずつ深く整理する。","blanks":["株式会社","法人格","株主"],"options":[["株式会社","事業目的","人的関係","取締役会"],["法人格","ルール","債権者","剰余金"],["株主","両方","会社","債務"]],"explanations":["本文：株式会社","本文：会社 ↓ 独立した法人格 ↓ 会社自身が権利義務の主体","本文：出資 ↓ 株式 ↓ 株主 ↓ 株主総会 ↓ 取締役等 ↓ 経営 ↓ 会社"],"mode":"commercial"}},"4":{"1":{"text":"株式会社とは、\n株式を発行して出資を集め、その出資者である株主が有限責任を負う会社\nである。\n株式会社を理解する基本構造は、\n出資\n↓\n株式\n↓\n株主\n↓\n株式会社\n↓\n事業活動\n↓\n利益・損失\nである。","blanks":["株式","会社","出資"],"options":[["株式","事項","任期","会社"],["会社","事項","任期","債務"],["出資","事項","任期","会社"]],"explanations":["本文：株式会社とは、","本文：株式会社とは、","本文：株式を発行して出資を集め、その出資者である株主が有限責任を負う会社"],"mode":"commercial"},"2":{"text":"株式会社を理解するうえで重要なのは、\n1.\t法人格\n2.\t株主の有限責任\n3.\t株式による出資\nである。\n法人格\n会社自身が権利義務の主体となる。\n有限責任\n株主は原則として、出資した額を超えて会社債務について直接責任を負わない。\n株式\n出資者としての地位を株式という形で細分化する。","blanks":["株式","会社","責任"],"options":[["株式","事項","任期","会社"],["会社","事項","任期","債務"],["責任","事項","任期","会社"]],"explanations":["本文：株式会社を理解するうえで重要なのは、","本文：株式会社を理解するうえで重要なのは、","本文：2.\t株主の有限責任"],"mode":"commercial"},"3":{"text":"株式会社は、一定の設立手続きを経て成立する。\n基本的な流れは、\n発起人\n↓\n定款作成\n↓\n出資\n↓\n設立手続\n↓\n設立登記\n↓\n株式会社成立\nである。\n特に重要なのが、\n設立登記によって株式会社が成立する\nという点。","blanks":["設立","株式会社","登記"],"options":[["設立","事項","任期","会社"],["株式会社","事業活動","取引安全","取締役会"],["登記","事項","任期","会社"]],"explanations":["本文：株式会社は、一定の設立手続きを経て成立する。","本文：株式会社は、一定の設立手続きを経て成立する。","本文：設立登記"],"mode":"commercial"},"4":{"text":"発起人とは、\n株式会社の設立を企画し、定款に発起人として署名・記名押印等をする者\nである。\n発起人は株式会社設立の中心人物となる。\nただし、\n発起人＝設立後の株主\nとは必ずしも同じ意味ではない。","blanks":["発起人","設立","株式会社"],"options":[["発起人","どこで","債権者","別概念"],["設立","事項","任期","会社"],["株式会社","事業活動","取引安全","取締役会"]],"explanations":["本文：発起人とは、","本文：株式会社の設立を企画し、定款に発起人として署名・記名押印等をする者","本文：株式会社の設立を企画し、定款に発起人として署名・記名押印等をする者"],"mode":"commercial"},"5":{"text":"定款とは、\n会社の組織・運営について定めた基本規則\nである。\n会社の「基本設計図」と考えると分かりやすい。\n定款には、\n•\t目的\n•\t商号\n•\t本店所在地\n•\t発行可能株式総数\n•\t機関 など、会社に関する重要事項を定める。","blanks":["会社","定款","商号"],"options":[["会社","事項","任期","債務"],["定款","事項","任期","会社"],["商号","事項","任期","会社"]],"explanations":["本文：会社の組織・運営について定めた基本規則","本文：定款とは、","本文：•\t商号"],"mode":"commercial"},"6":{"text":"定款の記載事項には、\n絶対的記載事項\n必ず定款に記載しなければならない事項。\n相対的記載事項\n定める場合には定款に記載しなければ効力を生じない事項。\n任意的記載事項\n定款に定めることができる事項。\nという区別がある。","blanks":["定款","記載事項","効力"],"options":[["定款","事項","任期","会社"],["記載事項","事業活動","取引安全","取締役会"],["効力","事項","任期","会社"]],"explanations":["本文：定款の記載事項には、","本文：定款の記載事項には、","本文：定める場合には定款に記載しなければ効力を生じない事項。"],"mode":"commercial"},"7":{"text":"株式会社の定款には、会社の基本的事項を記載する。\n代表的には、\n•\t目的\n•\t商号\n•\t本店の所在地\n•\t設立に際して出資される財産の価額またはその最低額\n•\t発起人の氏名・名称および住所\nなどが重要。\n行政書士試験では、\n「絶対的記載事項は何か」\nという形で問われることがある。","blanks":["会社","発起人","商号"],"options":[["会社","事項","任期","債務"],["発起人","どこで","債権者","別概念"],["商号","事項","任期","会社"]],"explanations":["本文：株式会社の定款には、会社の基本的事項を記載する。","本文：•\t発起人の氏名・名称および住所","本文：•\t商号"],"mode":"commercial"},"8":{"text":"株式会社の設立では、\n通常の現金出資とは異なる特殊な設立方法\nが問題になることがある。\n代表的なのが、\n•\t現物出資\n•\t財産引受\n•\t発起人の報酬その他の特別の利益\n•\t設立費用\nなど。\nこれらは会社財産を不当に減少させる危険があるため、会社法上一定の規制を受ける。","blanks":["会社","設立","出資"],"options":[["会社","事項","任期","債務"],["設立","事項","任期","会社"],["出資","事項","任期","会社"]],"explanations":["本文：株式会社の設立では、","本文：株式会社の設立では、","本文：通常の現金出資とは異なる特殊な設立方法"],"mode":"commercial"},"9":{"text":"現物出資とは、\n金銭以外の財産を出資すること\nである。\n例えば、\nAが会社設立時に、\n現金100万円ではなく、 自動車100万円相当を出資する。\nこれが現物出資。\n問題点\n本当に100万円の価値があるのか？\n↓\n過大評価されると、\n会社財産が不足する。\n↓\n他の株主や会社債権者を害する可能性。\nそのため規制がある。","blanks":["出資","会社","債権者"],"options":[["出資","事項","任期","会社"],["会社","事項","任期","債務"],["債権者","どこで","別概念","剰余金"]],"explanations":["本文：現物出資とは、","本文：Aが会社設立時に、","本文：他の株主や会社債権者を害する可能性。"],"mode":"commercial"},"10":{"text":"財産引受とは、\n発起人が会社成立を条件として、第三者から特定の財産を譲り受けること\nである。\nこれも会社設立時の財産形成に関係するため、会社法上規制される。","blanks":["会社","発起人","第三者"],"options":[["会社","事項","任期","債務"],["発起人","どこで","債権者","別概念"],["第三者","どこで","債権者","別概念"]],"explanations":["本文：発起人が会社成立を条件として、第三者から特定の財産を譲り受けること","本文：発起人が会社成立を条件として、第三者から特定の財産を譲り受けること","本文：発起人が会社成立を条件として、第三者から特定の財産を譲り受けること"],"mode":"commercial"},"11":{"text":"設立時には、\n株式を引き受ける者が出資を行う。\n基本構造は、\n株式を引き受ける\n↓\n出資する\n↓\n株主となる\nである。","blanks":["株式","出資","株主"],"options":[["株式","事項","任期","会社"],["出資","事項","任期","会社"],["株主","事項","任期","会社"]],"explanations":["本文：株式を引き受ける者が出資を行う。","本文：株式を引き受ける者が出資を行う。","本文：株主となる"],"mode":"commercial"},"12":{"text":"設立時に発行される株式を、\n設立時発行株式\nという。\n株式会社はこの株式を通じて資本を集める。","blanks":["株式","設立","会社"],"options":[["株式","事項","任期","会社"],["設立","事項","任期","会社"],["会社","事項","任期","債務"]],"explanations":["本文：設立時に発行される株式を、","本文：設立時に発行される株式を、","本文：株式会社はこの株式を通じて資本を集める。"],"mode":"commercial"},"13":{"text":"設立手続を完了し、\n設立登記\nをすることで株式会社が成立する。\n成立後は、\n発起人\n↓\n設立手続\n↓\n株式会社\n↓\n独立した法人格\nとなる。","blanks":["設立","株式会社","法人格"],"options":[["設立","事項","任期","会社"],["株式会社","事業活動","取引安全","取締役会"],["法人格","どこで","債権者","別概念"]],"explanations":["本文：設立手続を完了し、","本文：をすることで株式会社が成立する。","本文：独立した法人格"],"mode":"commercial"},"14":{"text":"設立手続に重大な瑕疵がある場合、\n会社設立の効力を争う\n問題が生じる。\nただし、会社は多数の第三者との取引関係を形成する。\nそのため、\nいつまでも会社の存在を不安定にする\nことは取引安全上望ましくない。\nそこで会社法では、設立の瑕疵を争う方法・期間などについて特別なルールを設けている。","blanks":["会社","設立","取引安全"],"options":[["会社","事項","任期","債務"],["設立","事項","任期","会社"],["取引安全","事業活動","取締役会","意思決定"]],"explanations":["本文：会社設立の効力を争う","本文：設立手続に重大な瑕疵がある場合、","本文：ことは取引安全上望ましくない。"],"mode":"commercial"},"15":{"text":"株式とは、\n株式会社における株主としての地位を細分化したもの\nである。\n例えば、\n1,000株発行された会社でAが100株持っている。\n↓\nAは株主。\n↓\n100株に対応する株主としての権利を持つ。","blanks":["株主","会社","株式"],"options":[["株主","事項","任期","会社"],["会社","事項","任期","債務"],["株式","事項","任期","会社"]],"explanations":["本文：株式会社における株主としての地位を細分化したもの","本文：株式会社における株主としての地位を細分化したもの","本文：株式とは、"],"mode":"commercial"},"16":{"text":"株主は、\n株式会社そのものを所有しているわけではない。\n株主が持っているのは、\n株式という権利\nである。\nしたがって、\n会社の財産\n≠\n株主の財産\n株式\n＝\n株主の権利\nである。","blanks":["株主","株式","会社"],"options":[["株主","事項","任期","会社"],["株式","事項","任期","会社"],["会社","事項","任期","債務"]],"explanations":["本文：株主は、","本文：株式会社そのものを所有しているわけではない。","本文：株式会社そのものを所有しているわけではない。"],"mode":"commercial"},"17":{"text":"原則として、同じ種類の株式であれば、\n株式の内容は均一\nである。\n例えば普通株式100株を持っていれば、\n同じ普通株式100株を持つ他の株主と基本的に同じ権利内容を持つ。\nただし、会社法では種類株式制度が認められている。","blanks":["株式","会社","株主"],"options":[["株式","事項","任期","会社"],["会社","事項","任期","債務"],["株主","事項","任期","会社"]],"explanations":["本文：原則として、同じ種類の株式であれば、","本文：ただし、会社法では種類株式制度が認められている。","本文：同じ普通株式100株を持つ他の株主と基本的に同じ権利内容を持つ。"],"mode":"commercial"},"18":{"text":"一つの株式を、\n「この部分だけ株主として扱ってほしい」\nというように細分化して扱うことはできない。\n株式は、\n一個の単位として株主の地位を構成する。\nただし、株式の共有など別の法律問題は存在する。","blanks":["株式","株主","法律問題"],"options":[["株式","事項","任期","会社"],["株主","事項","任期","会社"],["法律問題","事業活動","取引安全","取締役会"]],"explanations":["本文：一つの株式を、","本文：「この部分だけ株主として扱ってほしい」","本文：ただし、株式の共有など別の法律問題は存在する。"],"mode":"commercial"},"19":{"text":"株主は原則として、\n株式を譲渡することができる。\n例えば、\nA ↓ 株式100株 ↓ Bへ譲渡 ↓ Bが株主となる\nという流れ。\n株式の譲渡自由は、株式会社制度の重要な特徴である。","blanks":["株式","譲渡","株主"],"options":[["株式","事項","任期","会社"],["譲渡","事項","任期","会社"],["株主","事項","任期","会社"]],"explanations":["本文：株式を譲渡することができる。","本文：株式を譲渡することができる。","本文：株主は原則として、"],"mode":"commercial"},"20":{"text":"ただし会社は、\n株式の譲渡について一定の制限\nを設けることができる。\n特に、\n非公開会社\nでは株式譲渡制限が重要になる。\nこれは、\n「誰が会社の構成員になるか」\nを会社側がコントロールする必要がある場合があるから。","blanks":["会社","株式","譲渡"],"options":[["会社","事項","任期","債務"],["株式","事項","任期","会社"],["譲渡","事項","任期","会社"]],"explanations":["本文：ただし会社は、","本文：株式の譲渡について一定の制限","本文：株式の譲渡について一定の制限"],"mode":"commercial"},"21":{"text":"会社法上の「公開会社」は、\nすべての株式について譲渡制限が付されている会社ではない会社\nをいう。\nつまり、\n上場会社＝公開会社\nではない。\nここは非常に重要。","blanks":["会社","株式","譲渡"],"options":[["会社","事項","任期","債務"],["株式","事項","任期","会社"],["譲渡","事項","任期","会社"]],"explanations":["本文：会社法上の「公開会社」は、","本文：すべての株式について譲渡制限が付されている会社ではない会社","本文：すべての株式について譲渡制限が付されている会社ではない会社"],"mode":"commercial"},"22":{"text":"「公開会社」と「上場会社」は別概念。\n公開会社\n会社法上の概念。\n上場会社\n証券取引所に株式を上場している会社。\nしたがって、\n公開会社\n≠\n上場会社\nである。","blanks":["会社","株式","証券取引所"],"options":[["会社","事項","任期","債務"],["株式","事項","任期","会社"],["証券取引所","代表取締役","新株予約権","業務執行等"]],"explanations":["本文：「公開会社」と「上場会社」は別概念。","本文：証券取引所に株式を上場している会社。","本文：証券取引所に株式を上場している会社。"],"mode":"commercial"},"23":{"text":"株式会社では、\n株主は、その有する株式の内容および数に応じて平等に取り扱われる\nという考え方が重要。\nこれを、\n株主平等原則\nという。\nただし、種類株式など、会社法が認める制度による異なる取扱いは可能。","blanks":["株式","会社","株主"],"options":[["株式","事項","任期","会社"],["会社","事項","任期","債務"],["株主","事項","任期","会社"]],"explanations":["本文：株式会社では、","本文：株式会社では、","本文：株主は、その有する株式の内容および数に応じて平等に取り扱われる"],"mode":"commercial"},"24":{"text":"株主の権利には、\n自益権\n経済的利益を受ける権利。\n例：\n•\t配当を受ける権利\n•\t残余財産の分配を受ける権利\n共益権\n会社の経営に参加・監督する権利。\n例：\n•\t議決権\n•\t株主総会での議決\nがある。","blanks":["株主","会社","配当"],"options":[["株主","事項","任期","会社"],["会社","事項","任期","債務"],["配当","事項","任期","会社"]],"explanations":["本文：株主の権利には、","本文：会社の経営に参加・監督する権利。","本文：•\t配当を受ける権利"],"mode":"commercial"},"25":{"text":"議決権とは、\n株主総会において議案について意思決定に参加する権利\nである。\n原則として、\n1株1議決権\nという考え方が基本となる。\nただし種類株式などにより例外がある。","blanks":["株主総会","株式","議決権"],"options":[["株主総会","事業活動","取引安全","取締役会"],["株式","事項","任期","会社"],["議決権","どこで","債権者","別概念"]],"explanations":["本文：株主総会において議案について意思決定に参加する権利","本文：ただし種類株式などにより例外がある。","本文：議決権とは、"],"mode":"commercial"},"26":{"text":"会社が利益を上げたからといって、\n株主が会社財産を直接取得するわけではない。\n会社法上の手続きを経て、\n剰余金の配当\nが行われることで株主が利益を受ける。","blanks":["会社","株主","利益"],"options":[["会社","事項","任期","債務"],["株主","事項","任期","会社"],["利益","事項","任期","会社"]],"explanations":["本文：会社が利益を上げたからといって、","本文：株主が会社財産を直接取得するわけではない。","本文：会社が利益を上げたからといって、"],"mode":"commercial"},"27":{"text":"会社が解散・清算され、\n債権者への弁済などを終えた後に残余財産があれば、\n株主に分配されることがある。\nこれが残余財産の分配である。","blanks":["債権者","会社","株主"],"options":[["債権者","どこで","別概念","剰余金"],["会社","事項","任期","債務"],["株主","事項","任期","会社"]],"explanations":["本文：債権者への弁済などを終えた後に残余財産があれば、","本文：会社が解散・清算され、","本文：株主に分配されることがある。"],"mode":"commercial"},"28":{"text":"株主総会は、\n株主によって構成される株式会社の意思決定機関\nである。\n会社にとって重要な事項について株主が意思決定する。","blanks":["株主","会社","株式"],"options":[["株主","事項","任期","会社"],["会社","事項","任期","債務"],["株式","事項","任期","会社"]],"explanations":["本文：株主総会は、","本文：株主によって構成される株式会社の意思決定機関","本文：株主によって構成される株式会社の意思決定機関"],"mode":"commercial"},"29":{"text":"株主総会が決定できる事項は、\n会社法または定款によって定められた事項\nである。\n特に重要なのが、\n•\t定款変更\n•\t取締役等の選任・解任\n•\t組織再編等の重要事項\n•\t剰余金配当等\nである。","blanks":["定款","株主総会","組織再編"],"options":[["定款","事項","任期","会社"],["株主総会","事業活動","取引安全","取締役会"],["組織再編","事業活動","取引安全","取締役会"]],"explanations":["本文：会社法または定款によって定められた事項","本文：株主総会が決定できる事項は、","本文：•\t組織再編等の重要事項"],"mode":"commercial"},"30":{"text":"株主総会には、\n定時株主総会\n毎事業年度終了後に開催する。\n臨時株主総会\n必要に応じて開催する。\nという区別がある。","blanks":["株主総会","開催","毎事業年度終了後"],"options":[["株主総会","事業活動","取引安全","取締役会"],["開催","事項","任期","会社"],["毎事業年度終了後","決議取消しの訴え","何を決めるのか","決議無効確認の訴え"]],"explanations":["本文：株主総会には、","本文：毎事業年度終了後に開催する。","本文：毎事業年度終了後に開催する。"],"mode":"commercial"},"31":{"text":"株主総会を開催するには、\n原則として招集手続\nが必要。\n株主に、\n•\tいつ\n•\tどこで\n•\t何を決めるのか\nを知らせる必要がある。\nこれは株主が適切に議決権を行使するためである。","blanks":["株主","招集","何を決めるのか"],"options":[["株主","事項","任期","会社"],["招集","事項","任期","会社"],["何を決めるのか","コントロール","毎事業年度終了後","決議取消しの訴え"]],"explanations":["本文：株主総会を開催するには、","本文：原則として招集手続","本文：•\t何を決めるのか"],"mode":"commercial"},"32":{"text":"株主総会では、\n決議\nによって意思決定する。\n決議には、\n普通決議\n一般的な事項について行う決議。\n特別決議\n会社にとって特に重要な事項について、普通決議より厳しい要件を要求する決議。\nなどがある。","blanks":["株主総会","会社","決議"],"options":[["株主総会","事業活動","取引安全","取締役会"],["会社","事項","任期","債務"],["決議","事項","任期","会社"]],"explanations":["本文：株主総会では、","本文：会社にとって特に重要な事項について、普通決議より厳しい要件を要求する決議。","本文：決議"],"mode":"commercial"},"33":{"text":"基本的な考え方は、\n一般的な事項\n↓\n普通決議\n会社の基本に大きな影響\n↓\n特別決議\n↓\nより厳格な要件\nである。\n行政書士試験では、\n決議要件の数字\nが狙われることがあるので、後の問題演習では正確な条文要件まで確認する。","blanks":["会社","普通決議","特別決議"],"options":[["会社","事項","任期","債務"],["普通決議","事業活動","取引安全","取締役会"],["特別決議","事業活動","取引安全","取締役会"]],"explanations":["本文：会社の基本に大きな影響","本文：普通決議","本文：特別決議"],"mode":"commercial"},"34":{"text":"株主総会の手続や内容に問題がある場合、\n決議の効力\nが問題になる。\n代表的には、\n•\t決議取消しの訴え\n•\t決議無効確認の訴え\n•\t決議不存在確認の訴え\nなどがある。","blanks":["株主総会","決議不存在確認の訴え","決議無効確認の訴え"],"options":[["株主総会","事業活動","取引安全","取締役会"],["決議不存在確認の訴え","決議無効確認の訴え","毎事業年度終了後","決議取消しの訴え"],["決議無効確認の訴え","毎事業年度終了後","決議不存在確認の訴え","決議取消しの訴え"]],"explanations":["本文：株主総会の手続や内容に問題がある場合、","本文：•\t決議不存在確認の訴え","本文：•\t決議無効確認の訴え"],"mode":"commercial"},"35":{"text":"取締役は、\n株式会社の業務執行を担う重要な役員\nである。\n株式会社では、\n株主 ↓ 株主総会 ↓ 取締役等 ↓ 業務執行\nという構造になる。","blanks":["株式会社","取締役","株主"],"options":[["株式会社","事業活動","取引安全","取締役会"],["取締役","どこで","債権者","別概念"],["株主","事項","任期","会社"]],"explanations":["本文：株式会社の業務執行を担う重要な役員","本文：取締役は、","本文：株主 ↓ 株主総会 ↓ 取締役等 ↓ 業務執行"],"mode":"commercial"},"36":{"text":"取締役は原則として、\n株主総会の決議によって選任される。\nつまり、\n株主 ↓ 株主総会 ↓ 取締役を選任 ↓ 取締役が会社経営\nという関係。","blanks":["取締役","株主","会社"],"options":[["取締役","どこで","債権者","別概念"],["株主","事項","任期","会社"],["会社","事項","任期","債務"]],"explanations":["本文：取締役は原則として、","本文：株主総会の決議によって選任される。","本文：株主 ↓ 株主総会 ↓ 取締役を選任 ↓ 取締役が会社経営"],"mode":"commercial"},"37":{"text":"取締役には任期がある。\n会社の機関設計によって任期のルールが異なる場合がある。\n特に、\n公開会社と非公開会社\nでは任期に関する扱いが異なるため、試験対策では正確な条文を確認する必要がある。","blanks":["会社","取締役","機関"],"options":[["会社","事項","任期","債務"],["取締役","どこで","債権者","別概念"],["機関","事項","任期","会社"]],"explanations":["本文：会社の機関設計によって任期のルールが異なる場合がある。","本文：取締役には任期がある。","本文：会社の機関設計によって任期のルールが異なる場合がある。"],"mode":"commercial"},"38":{"text":"取締役には、\n会社のために適切に職務を行う義務\nがある。\n代表的なのが、\n善管注意義務\n取締役として通常要求される注意をもって職務を行う義務。\n忠実義務\n法令・定款・株主総会決議などを遵守し、会社のため忠実に職務を行う義務。","blanks":["取締役","会社","株主総会"],"options":[["取締役","どこで","債権者","別概念"],["会社","事項","任期","債務"],["株主総会","事業活動","取引安全","取締役会"]],"explanations":["本文：取締役には、","本文：会社のために適切に職務を行う義務","本文：法令・定款・株主総会決議などを遵守し、会社のため忠実に職務を行う義務。"],"mode":"commercial"},"39":{"text":"取締役が、\n自分自身の利益と会社の利益が衝突する取引\nを行うことがある。\n例えば、\n会社が取締役個人から高額な土地を購入する。\nこの場合、\n会社側 ↓ できるだけ安く買いたい\n取締役個人 ↓ できるだけ高く売りたい\nという利益衝突がある。\nこれを、\n利益相反取引\nという。\n会社法では一定の規制がある。","blanks":["会社","利益","取締役"],"options":[["会社","事項","任期","債務"],["利益","事項","任期","会社"],["取締役","どこで","債権者","別概念"]],"explanations":["本文：自分自身の利益と会社の利益が衝突する取引","本文：自分自身の利益と会社の利益が衝突する取引","本文：取締役が、"],"mode":"commercial"},"40":{"text":"取締役が会社と同じ種類の事業を自分自身で行えば、\n会社の利益を奪う可能性\nがある。\nそこで、\n競業取引\nについて一定の規制がある。","blanks":["会社","取締役","利益"],"options":[["会社","事項","任期","債務"],["取締役","どこで","債権者","別概念"],["利益","事項","任期","会社"]],"explanations":["本文：取締役が会社と同じ種類の事業を自分自身で行えば、","本文：取締役が会社と同じ種類の事業を自分自身で行えば、","本文：会社の利益を奪う可能性"],"mode":"commercial"},"41":{"text":"取締役会とは、\n取締役によって構成される株式会社の業務執行等に関する意思決定機関\nである。\nただし、すべての株式会社に取締役会が存在するわけではない。","blanks":["取締役","株式会社","機関"],"options":[["取締役","どこで","債権者","別概念"],["株式会社","事業活動","取引安全","取締役会"],["機関","事項","任期","会社"]],"explanations":["本文：取締役会とは、","本文：取締役によって構成される株式会社の業務執行等に関する意思決定機関","本文：取締役によって構成される株式会社の業務執行等に関する意思決定機関"],"mode":"commercial"},"42":{"text":"取締役会設置会社では、\n会社の業務執行に関する重要な事項を決定する\nとともに、\n取締役の職務執行を監督する。\nつまり、\n取締役会\n├─ 重要な業務執行の決定\n└─ 取締役の監督\nという2つの役割が重要。","blanks":["取締役","会社","業務執行"],"options":[["取締役","どこで","債権者","別概念"],["会社","事項","任期","債務"],["業務執行","事業活動","取引安全","取締役会"]],"explanations":["本文：取締役会設置会社では、","本文：取締役会設置会社では、","本文：会社の業務執行に関する重要な事項を決定する"],"mode":"commercial"},"43":{"text":"代表取締役は、\n会社を代表し、業務を執行する者\nである。\n外部との関係では、\n株式会社 ↓ 代表取締役 ↓ 第三者\nという形で会社を代表する。","blanks":["会社","代表取締役","第三者"],"options":[["会社","事項","任期","債務"],["代表取締役","新株予約権","業務執行等","証券取引所"],["第三者","どこで","債権者","別概念"]],"explanations":["本文：会社を代表し、業務を執行する者","本文：代表取締役は、","本文：株式会社 ↓ 代表取締役 ↓ 第三者"],"mode":"commercial"},"44":{"text":"取締役会設置会社では、\n取締役会 ↓ 重要な業務執行の決定 ↓ 代表取締役を選定 ↓ 代表取締役 ↓ 業務執行・会社代表\nという関係を基本として理解する。","blanks":["取締役","会社","業務執行"],"options":[["取締役","どこで","債権者","別概念"],["会社","事項","任期","債務"],["業務執行","事業活動","取引安全","取締役会"]],"explanations":["本文：取締役会設置会社では、","本文：取締役会設置会社では、","本文：取締役会 ↓ 重要な業務執行の決定 ↓ 代表取締役を選定 ↓ 代表取締役 ↓ 業務執行・会社代表"],"mode":"commercial"},"45":{"text":"監査役は、\n取締役の職務執行を監査する機関\nである。\nつまり、\n取締役 ↓ 業務執行\n監査役 ↓ その職務執行を監査\nという構造。","blanks":["取締役","監査役","機関"],"options":[["取締役","どこで","債権者","別概念"],["監査役","どこで","債権者","別概念"],["機関","事項","任期","会社"]],"explanations":["本文：取締役の職務執行を監査する機関","本文：監査役は、","本文：取締役の職務執行を監査する機関"],"mode":"commercial"},"46":{"text":"大規模な株式会社などでは、\n会計監査人\nによる会計監査が行われる。\n監査役が取締役の職務執行を監査するのに対し、\n会計監査人 ↓ 計算書類等の会計監査\nという役割を担う。","blanks":["株式会社","計算書類","取締役"],"options":[["株式会社","事業活動","取引安全","取締役会"],["計算書類","事業活動","取引安全","取締役会"],["取締役","どこで","債権者","別概念"]],"explanations":["本文：大規模な株式会社などでは、","本文：会計監査人 ↓ 計算書類等の会計監査","本文：監査役が取締役の職務執行を監査するのに対し、"],"mode":"commercial"},"47":{"text":"会計参与は、\n取締役等と共同して計算書類等を作成する機関\nである。\n会社の計算・会計の適正性を支える役割を持つ。","blanks":["計算書類","取締役","会社"],"options":[["計算書類","事業活動","取引安全","取締役会"],["取締役","どこで","債権者","別概念"],["会社","事項","任期","債務"]],"explanations":["本文：取締役等と共同して計算書類等を作成する機関","本文：取締役等と共同して計算書類等を作成する機関","本文：会社の計算・会計の適正性を支える役割を持つ。"],"mode":"commercial"},"48":{"text":"株式会社には複数の機関設計がある。\n例えば、\n取締役\n↓\nシンプルな会社\n取締役会\n＋\n監査役\n↓\nより組織的な会社\n取締役会\n＋\n監査等委員会\n指名委員会等\n↓\nより高度な監督体制\nなど。\n重要なのは、\nすべての株式会社が同じ機関構造ではない\nということ。","blanks":["会社","取締役","株式"],"options":[["会社","事項","任期","債務"],["取締役","どこで","債権者","別概念"],["株式","事項","任期","会社"]],"explanations":["本文：株式会社には複数の機関設計がある。","本文：取締役","本文：株式会社には複数の機関設計がある。"],"mode":"commercial"},"49":{"text":"公開会社では、\n株主が頻繁に入れ替わる可能性\nがある。\nそのため、\n株主総会だけで会社を細かく運営するのではなく、取締役会などによる組織的な経営が重要\nになる。\n一方、非公開会社では、\n株主間の人的関係が比較的強い\n場合があり、より柔軟な機関設計が認められている。","blanks":["会社","株主","取締役会"],"options":[["会社","事項","任期","債務"],["株主","事項","任期","会社"],["取締役会","事業活動","取引安全","意思決定"]],"explanations":["本文：公開会社では、","本文：株主が頻繁に入れ替わる可能性","本文：株主総会だけで会社を細かく運営するのではなく、取締役会などによる組織的な経営が重要"],"mode":"commercial"},"50":{"text":"株式会社では、\n誰が経営し、誰が監督するのか\nを明確にする必要がある。\n基本構造は、\n株主\n↓\n株主総会\n↓\n重要事項の決定・役員選任\n↓\n取締役\n↓\n業務執行\n↓\n代表取締役\n↓\n会社を代表\n↓\n監査機関\n↓\n監督・監査\nである。","blanks":["取締役","会社","株主"],"options":[["取締役","どこで","債権者","別概念"],["会社","事項","任期","債務"],["株主","事項","任期","会社"]],"explanations":["本文：取締役","本文：株式会社では、","本文：株主"],"mode":"commercial"},"51":{"text":"取締役などが任務を怠った場合、\n会社に対して損害賠償責任\nを負うことがある。\n例えば、\n取締役が重大な注意義務違反 ↓ 会社に1,000万円の損害 ↓ 取締役の責任が問題\nとなる。","blanks":["取締役","会社","責任"],"options":[["取締役","どこで","債権者","別概念"],["会社","事項","任期","債務"],["責任","事項","任期","会社"]],"explanations":["本文：取締役などが任務を怠った場合、","本文：会社に対して損害賠償責任","本文：会社に対して損害賠償責任"],"mode":"commercial"},"52":{"text":"取締役等の行為によって、\n会社だけでなく第三者が損害を受ける\n場合もある。\n例えば、\n取締役が悪意・重大な過失によって第三者に損害を与えた。\nこの場合、\n第三者に対する役員責任\nが問題になる。","blanks":["第三者","取締役","会社"],"options":[["第三者","どこで","債権者","別概念"],["取締役","どこで","債権者","別概念"],["会社","事項","任期","債務"]],"explanations":["本文：会社だけでなく第三者が損害を受ける","本文：取締役等の行為によって、","本文：会社だけでなく第三者が損害を受ける"],"mode":"commercial"},"53":{"text":"会社に損害が発生しているのに、\n会社自身が役員を責任追及しない\n場合がある。\nそこで一定の要件の下で、\n株主が会社に代わって役員の責任を追及する\n制度がある。\nこれが、\n株主代表訴訟\nである。","blanks":["会社","株主","責任"],"options":[["会社","事項","任期","債務"],["株主","事項","任期","会社"],["責任","事項","任期","会社"]],"explanations":["本文：会社に損害が発生しているのに、","本文：株主が会社に代わって役員の責任を追及する","本文：会社自身が役員を責任追及しない"],"mode":"commercial"},"54":{"text":"株主は単に配当を受けるだけではない。\n一定の要件の下で、\n•\t株主総会で質問\n•\t議決権行使\n•\t会計帳簿閲覧等\n•\t株主代表訴訟\n•\t違法行為差止め\nなど、会社経営を監督するための権利を持つ。","blanks":["株主","会社","配当"],"options":[["株主","事項","任期","会社"],["会社","事項","任期","債務"],["配当","事項","任期","会社"]],"explanations":["本文：株主は単に配当を受けるだけではない。","本文：など、会社経営を監督するための権利を持つ。","本文：株主は単に配当を受けるだけではない。"],"mode":"commercial"},"55":{"text":"株式会社では、\n多数決\nが基本となる。\nしかし、\n多数派が少数株主を不当に害する\n可能性がある。\nそこで会社法では、\n少数株主の権利・救済\nを一定程度保障している。\nこれを、\n少数株主保護\nという。","blanks":["株主","会社","株式"],"options":[["株主","事項","任期","会社"],["会社","事項","任期","債務"],["株式","事項","任期","会社"]],"explanations":["本文：多数派が少数株主を不当に害する","本文：株式会社では、","本文：株式会社では、"],"mode":"commercial"},"56":{"text":"株式会社では、\n株主総会の決議を多数決で行う\nのが基本。\nこれは、\n大量の株主が存在しても意思決定できる\nようにするため。\nただし、\n多数決だから何をしてもよい\nわけではない。\n法令・定款に違反する決議や、株主の権利を不当に侵害する行為については法的問題が生じる。","blanks":["株主","株式会社","定款"],"options":[["株主","事項","任期","会社"],["株式会社","事業活動","取引安全","取締役会"],["定款","事項","任期","会社"]],"explanations":["本文：株主総会の決議を多数決で行う","本文：株式会社では、","本文：法令・定款に違反する決議や、株主の権利を不当に侵害する行為については法的問題が生じる。"],"mode":"commercial"},"57":{"text":"株式会社は、\n事業を行うために資金を調達する。\n主な方法として、\n① 株式発行 ② 新株予約権 ③ 借入れ ④ 社債\nなどがある。","blanks":["株式","新株予約権","社債"],"options":[["株式","事項","任期","会社"],["新株予約権","代表取締役","業務執行等","証券取引所"],["社債","事項","任期","会社"]],"explanations":["本文：株式会社は、","本文：① 株式発行 ② 新株予約権 ③ 借入れ ④ 社債","本文：① 株式発行 ② 新株予約権 ③ 借入れ ④ 社債"],"mode":"commercial"},"58":{"text":"株式を新たに発行することで、\n会社は出資を受けて資金を調達できる。\n投資家\n↓\n出資\n↓\n会社\n↓\n株式\n↓\n投資家\n会社にとっては資本調達となる。","blanks":["会社","株式","出資"],"options":[["会社","事項","任期","債務"],["株式","事項","任期","会社"],["出資","事項","任期","会社"]],"explanations":["本文：会社は出資を受けて資金を調達できる。","本文：株式を新たに発行することで、","本文：会社は出資を受けて資金を調達できる。"],"mode":"commercial"},"59":{"text":"新株予約権とは、\n一定の条件で会社に対して株式の交付を請求できる権利\nである。\n例えば、\n新株予約権 ↓ 一定の条件を満たす ↓ 株式を取得 ↓ 株主となる\nという仕組み。","blanks":["新株予約権","株式","会社"],"options":[["新株予約権","代表取締役","業務執行等","証券取引所"],["株式","事項","任期","会社"],["会社","事項","任期","債務"]],"explanations":["本文：新株予約権とは、","本文：一定の条件で会社に対して株式の交付を請求できる権利","本文：一定の条件で会社に対して株式の交付を請求できる権利"],"mode":"commercial"},"60":{"text":"社債は、\n会社が多数の投資家から資金を借り入れるために発行する債券\nである。\n株式との違いが重要。\n株式\n投資家 ↓ 出資 ↓ 株主\n社債\n投資家 ↓ 貸付的な資金提供 ↓ 社債権者 ↓ 会社に対する債権\nつまり、\n株主＝会社の構成員 社債権者＝会社の債権者\nである。","blanks":["会社","社債","債権者"],"options":[["会社","事項","任期","債務"],["社債","事項","任期","会社"],["債権者","どこで","別概念","剰余金"]],"explanations":["本文：会社が多数の投資家から資金を借り入れるために発行する債券","本文：社債は、","本文：投資家 ↓ 貸付的な資金提供 ↓ 社債権者 ↓ 会社に対する債権"],"mode":"commercial"},"61":{"text":"株式\t社債\n地位\t株主\t債権者\n出資・貸付\t出資\t貸付的\n議決権\t原則あり\tなし\n配当・利息\t配当\t利息\n元本回収\t原則として保証なし\t償還される\n経営参加\tあり\t原則なし","blanks":["出資","配当","債権者"],"options":[["出資","事項","任期","会社"],["配当","事項","任期","会社"],["債権者","どこで","別概念","剰余金"]],"explanations":["本文：出資・貸付\t出資\t貸付的","本文：配当・利息\t配当\t利息","本文：地位\t株主\t債権者"],"mode":"commercial"},"62":{"text":"会社が自分自身の株式を取得することを、\n自己株式の取得\nという。\n会社が自社株を自由に取得すると、\n資本維持や株主平等などに影響する\n可能性がある。\nそのため会社法では一定の規制がある。","blanks":["会社","株式","株主"],"options":[["会社","事項","任期","債務"],["株式","事項","任期","会社"],["株主","事項","任期","会社"]],"explanations":["本文：会社が自分自身の株式を取得することを、","本文：会社が自分自身の株式を取得することを、","本文：資本維持や株主平等などに影響する"],"mode":"commercial"},"63":{"text":"会社が株主に利益を分配することを、\n剰余金の配当\nという。\nただし、\n会社に利益があるから当然に自由に配当できる\nわけではない。\n会社財産を不当に流出させれば、\n会社債権者を害する可能性\nがあるため、会社法上の規制がある。","blanks":["会社","配当","利益"],"options":[["会社","事項","任期","債務"],["配当","事項","任期","会社"],["利益","事項","任期","会社"]],"explanations":["本文：会社が株主に利益を分配することを、","本文：剰余金の配当","本文：会社が株主に利益を分配することを、"],"mode":"commercial"},"64":{"text":"株式会社では、\n株主が有限責任\nである。\nそのため会社債権者は、\n原則として会社財産を引当てとして取引する。\nしたがって会社法では、\n•\t資本・純資産に関する規律\n•\t配当規制\n•\t自己株式取得の規制\n•\t計算書類\n•\t役員責任\nなどを通じて会社債権者を保護する。","blanks":["会社","債権者","株式"],"options":[["会社","事項","任期","債務"],["債権者","どこで","別概念","剰余金"],["株式","事項","任期","会社"]],"explanations":["本文：株式会社では、","本文：そのため会社債権者は、","本文：株式会社では、"],"mode":"commercial"},"65":{"text":"株式会社では、\n会社の財産・利益・損失を正確に把握する\n必要がある。\nそのため、\n•\t計算書類\n•\t事業報告\n•\t会計監査 などの制度が設けられている。\n詳細は第5編で扱う。","blanks":["会社","計算書類","利益"],"options":[["会社","事項","任期","債務"],["計算書類","事業活動","取引安全","取締役会"],["利益","事項","任期","会社"]],"explanations":["本文：株式会社では、","本文：•\t計算書類","本文：会社の財産・利益・損失を正確に把握する"],"mode":"commercial"},"66":{"text":"株式会社は永遠に存在するとは限らない。\n一定の事由が発生すると、\n解散\nする。\n解散すると、\n会社の事業活動を終了させ、財産関係を整理する\n段階に入る。","blanks":["会社","解散","株式"],"options":[["会社","事項","任期","債務"],["解散","事項","任期","会社"],["株式","事項","任期","会社"]],"explanations":["本文：株式会社は永遠に存在するとは限らない。","本文：解散","本文：株式会社は永遠に存在するとは限らない。"],"mode":"commercial"},"67":{"text":"解散した会社は、原則として清算手続に入る。\n基本的には、\n解散\n↓\n清算\n↓\n債権回収\n↓\n債務弁済\n↓\n残余財産の分配\n↓\n清算結了\nという流れ。","blanks":["清算","解散","会社"],"options":[["清算","事項","任期","会社"],["解散","事項","任期","会社"],["会社","事項","任期","債務"]],"explanations":["本文：解散した会社は、原則として清算手続に入る。","本文：解散した会社は、原則として清算手続に入る。","本文：解散した会社は、原則として清算手続に入る。"],"mode":"commercial"},"68":{"text":"ここまでを一本につなげる。\n発起人\n↓\n定款\n↓\n出資\n↓\n設立登記\n↓\n株式会社成立\n↓\n法人格\n↓\n株式\n↓\n株主\n↓\n株主総会\n↓\n取締役等\n↓\n業務執行\n↓\n代表取締役\n↓\n事業活動\n↓\n利益・損失\n├─ 配当\n├─ 再投資\n└─ 会社財産として蓄積\n↓\n必要に応じて\n組織再編・解散・清算","blanks":["取締役","会社","株式"],"options":[["取締役","どこで","債権者","別概念"],["会社","事項","任期","債務"],["株式","事項","任期","会社"]],"explanations":["本文：取締役等","本文：株式会社成立","本文：株式会社成立"],"mode":"commercial"},"69":{"text":"株式会社では、\n株主\n↓\n資本を提供\n経営者\n↓\n会社を経営\n会社\n↓\n独立した法人\n債権者\n↓\n会社に対する債権を持つ\nという関係がある。\n会社法は、この4者の利益を適切に調整する。","blanks":["会社","債権者","株式"],"options":[["会社","事項","任期","債務"],["債権者","どこで","別概念","剰余金"],["株式","事項","任期","会社"]],"explanations":["本文：株式会社では、","本文：債権者","本文：株式会社では、"],"mode":"commercial"},"70":{"text":"会社法の問題では、\n① 誰の問題か\n株主？ 取締役？ 会社？ 債権者？\n② 何についてか\n株式？ 株主総会？ 取締役？ 配当？ 責任？\n③ 誰が決めるか\n株主総会？ 取締役会？ 代表取締役？\n④ どんな要件か\n普通決議？ 特別決議？ 定款？ 会社法上の要件？\n⑤ 効果は何か\n有効？ 無効？ 取消し？ 損害賠償？\nという順番で考える。","blanks":["取締役","会社","株主"],"options":[["取締役","どこで","債権者","別概念"],["会社","事項","任期","債務"],["株主","事項","任期","会社"]],"explanations":["本文：株主？ 取締役？ 会社？ 債権者？","本文：会社法の問題では、","本文：株主？ 取締役？ 会社？ 債権者？"],"mode":"commercial"},"71":{"text":"A株式会社には、\n株主A・B・Cがいる。\n会社は取締役Dが経営している。\nDが会社の財産を使って自分のために土地を購入した。\nこの場合、\n① 会社財産か ↓ 会社財産\n② Dは誰か ↓ 取締役\n③ 自分のための取引か ↓ 利益相反の可能性\n④ 会社法上の手続を経ているか ↓ 確認\n⑤ 会社に損害が発生したか ↓ 役員責任\nという順番で分析する。","blanks":["会社","取締役","株式"],"options":[["会社","事項","任期","債務"],["取締役","どこで","債権者","別概念"],["株式","事項","任期","会社"]],"explanations":["本文：A株式会社には、","本文：会社は取締役Dが経営している。","本文：A株式会社には、"],"mode":"commercial"},"72":{"text":"株式会社の本質は、\n出資者である株主から資金を集め、会社という独立した法人が事業を行い、株主の有限責任と会社の機関制度によって企業活動を運営する仕組み\nにある。\nそのため、\n出資\n↓\n株式\n↓\n株主\n↓\n法人格\n↓\n会社財産\n↓\n株主総会\n↓\n取締役\n↓\n代表取締役\n↓\n業務執行\n↓\n監査\n↓\n利益・配当\n↓\n責任・債権者保護\nという一本の流れを理解する。","blanks":["会社","株主","取締役"],"options":[["会社","事項","任期","債務"],["株主","事項","任期","会社"],["取締役","どこで","債権者","別概念"]],"explanations":["本文：株式会社の本質は、","本文：出資者である株主から資金を集め、会社という独立した法人が事業を行い、株主の有限責任と会社の機関制度によって企業活動を運営する仕組み","本文：取締役"],"mode":"commercial"},"73":{"text":"以下を何も見ずに説明できるか確認する。\n設立\n1.\t株式会社とは何か。\n2.\t発起人とは何か。\n3.\t定款とは何か。\n4.\t絶対的記載事項とは何か。\n5.\t現物出資とは何か。\n6.\t財産引受とは何か。\n7.\t株式会社はいつ成立するか。\n株式\n8.\t株式とは何か。\n9.\t株主とは何か。\n10.\t株主と会社はなぜ別人格なのか。\n11.\t株式譲渡自由の意味は何か。\n12.\t譲渡制限株式とは何か。\n13.\t公開会社と上場会社は同じか。\n14.\t株主平等原則とは何か。\n15.\t自益権と共益権とは何か。\n機関\n16.\t株主総会とは何か。\n17.\t普通決議と特別決議は何が違うか。\n18.\t取締役とは何か。\n19.\t取締役会とは何か。\n20.\t代表取締役とは何か。\n21.\t監査役とは何か。\n22.\t会計監査人とは何か。\n23.\t機関設計とは何か。\n経営・責任\n24.\t取締役の善管注意義務とは何か。\n25.\t忠実義務とは何か。\n26.\t利益相反取引とは何か。\n27.\t競業取引とは何か。\n28.\t役員の会社に対する責任とは何か。\n29.\t第三者に対する役員責任とは何か。\n30.\t株主代表訴訟とは何か。\n31.\t少数株主保護が必要なのはなぜか。\n資金・会社財産\n32.\t株式と社債はどう違うか。\n33.\t新株予約権とは何か。\n34.\t自己株式とは何か。\n35.\t剰余金配当とは何か。\n36.\tなぜ会社財産を自由に流出させてはいけないのか。\n37.\tなぜ会社債権者を保護する必要があるのか。\n終了\n38.\t解散とは何か。\n39.\t清算とは何か。\n40.\t株式会社の設立から清算までを説明せよ。","blanks":["会社","株式","株主"],"options":[["会社","事項","任期","債務"],["株式","事項","任期","会社"],["株主","事項","任期","会社"]],"explanations":["本文：1.\t株式会社とは何か。","本文：1.\t株式会社とは何か。","本文：9.\t株主とは何か。"],"mode":"commercial"},"74":{"text":"株式会社の設立\n発起人\n↓\n定款\n↓\n出資\n↓\n設立手続\n↓\n設立登記\n↓\n株式会社成立\n株式会社の基本\n会社\n＝\n独立した法人格\n株主\n出資\n↓\n株式\n↓\n株主\n↓\n有限責任\n経営\n株主\n↓\n株主総会\n↓\n取締役\n↓\n取締役会\n↓\n代表取締役\n↓\n業務執行\n※すべての株式会社が同じ機関構成ではない。\n監督\n取締役\n↓\n業務執行\n↓\n監査役等\n↓\n監督・監査\n利益\n会社の利益\n↓\n会社財産\n↓\n会社法上の手続\n↓\n剰余金配当\n↓\n株主\n終了\n解散\n↓\n清算\n↓\n債務弁済\n↓\n残余財産分配\n↓\n清算結了\n★ 第4編の最重要10ポイント\n1.\t株式会社は法人であり、会社自身が権利義務の主体\n2.\t株主と会社は別人格\n3.\t株主は株式を持ち、原則として有限責任\n4.\t株式会社は株式を通じて資金を集める\n5.\t株主総会は株主による意思決定機関\n6.\t取締役は業務執行を担う\n7.\t代表取締役は会社を代表する\n8.\t取締役会は重要な業務執行の決定・取締役の監督を担う\n9.\t役員には会社・第三者に対する責任が生じ得る\n10.\t会社法は株主・経営者・会社債権者などの利益を調整する\n第4編 完成\n第1編 商法総論 ↓ 商人・営業・商号・商業登記・支配人等\n第2編 商行為 ↓ 商人間売買・代理商・仲立・問屋・運送・寄託等\n第3編 会社法総論 ↓ 会社・法人格・会社の種類・社員・出資・責任・機関\n第4編 株式会社 ↓ 設立・株式・株主・株主総会・取締役・取締役会・代表取締役・監査・役員責任・資金調達・解散清算\n↓\n次は第5編「株式会社の計算・組織再編等」\nここでは、\n計算 → 剰余金 → 資本金 → 自己株式 → 新株予約権 → 社債 → 合併 → 会社分割 → 株式交換 → 株式移転 → 解散・清算\nをさらに体系的に整理する。","blanks":["株式会社","取締役","責任"],"options":[["株式会社","事業活動","取引安全","取締役会"],["取締役","どこで","債権者","別概念"],["責任","事項","任期","会社"]],"explanations":["本文：株式会社の設立","本文：取締役","本文：有限責任"],"mode":"commercial"}},"5":{"1":{"text":"会社法における「計算」とは、\n会社の財産・損益・資本などを明らかにするための会計に関する仕組み\nをいう。\n会社は事業を行う以上、\n•\tいくら儲かったか\n•\tいくら損したか\n•\tどれだけ財産があるか\n•\tどれだけ債務があるか\nを明らかにする必要がある。\n事業活動\n↓\n取引\n↓\n収益・費用\n↓\n財産・負債\n↓\n計算書類\n↓\n株主・債権者等が把握","blanks":["会社","計算書類","債権者"],"options":[["会社","A社","B社","債務"],["計算書類","事業活動","会社分割","全部取得"],["債権者","事業A","事業B","事業X"]],"explanations":["本文：会社法における「計算」とは、","本文：計算書類","本文：株主・債権者等が把握"],"mode":"commercial"},"2":{"text":"株式会社では、\n株主が会社の財産を直接管理しているとは限らない。\nそのため、\n会社の経営状態を客観的に明らかにする必要がある。\nさらに、会社の財産は、\n会社債権者の重要な引当財産\nでもある。\nしたがって計算制度には、\n① 株主保護 ② 債権者保護 ③ 投資家への情報提供 ④ 経営管理\nという意味がある。","blanks":["会社","債権者","株主"],"options":[["会社","A社","B社","債務"],["債権者","事業A","事業B","事業X"],["株主","A社","B社","会社"]],"explanations":["本文：株式会社では、","本文：会社債権者の重要な引当財産","本文：株主が会社の財産を直接管理しているとは限らない。"],"mode":"commercial"},"3":{"text":"株式会社では、会社の財産・損益等を明らかにするため、\n計算書類\nを作成する。\n代表的なものとして、\n•\t貸借対照表\n•\t損益計算書\n•\t株主資本等変動計算書\n•\t個別注記表\nなどがある。","blanks":["会社","計算書類","株式"],"options":[["会社","A社","B社","債務"],["計算書類","事業活動","会社分割","全部取得"],["株式","A社","B社","会社"]],"explanations":["本文：株式会社では、会社の財産・損益等を明らかにするため、","本文：計算書類","本文：株式会社では、会社の財産・損益等を明らかにするため、"],"mode":"commercial"},"4":{"text":"貸借対照表は、\nある時点で会社がどのような財産・負債・純資産を持っているか\nを示す。\n基本構造は、\n資産\n＝\n負債＋純資産\nである。\n例\n会社が、\n資産1億円 負債4,000万円\nなら、\n純資産 ＝6,000万円\nとなる。","blanks":["会社","貸借対照表","純資産を持っているか"],"options":[["会社","A社","B社","債務"],["貸借対照表","C社がA社","不動産事業","損益計算書"],["純資産を持っているか","残余財産の分配","一定程度内部","債権の取立て"]],"explanations":["本文：ある時点で会社がどのような財産・負債・純資産を持っているか","本文：貸借対照表は、","本文：ある時点で会社がどのような財産・負債・純資産を持っているか"],"mode":"commercial"},"5":{"text":"損益計算書は、\n一定期間に会社がどれだけ収益を上げ、どれだけ費用を使い、最終的にどれだけ利益・損失が生じたか\nを示す。\n基本的には、\n収益\n－\n費用\n↓\n利益または損失\nである。","blanks":["利益","損失","会社"],"options":[["利益","A社","B社","会社"],["損失","A社","B社","会社"],["会社","A社","B社","債務"]],"explanations":["本文：一定期間に会社がどれだけ収益を上げ、どれだけ費用を使い、最終的にどれだけ利益・損失が生じたか","本文：一定期間に会社がどれだけ収益を上げ、どれだけ費用を使い、最終的にどれだけ利益・損失が生じたか","本文：一定期間に会社がどれだけ収益を上げ、どれだけ費用を使い、最終的にどれだけ利益・損失が生じたか"],"mode":"commercial"},"6":{"text":"会社の財産状態を理解するためには、\n資産\n会社が持っている経済的価値。\n例： 現金、預金、土地、建物、売掛金など。\n負債\n会社が他人に対して負っている債務。\n例： 借入金、買掛金など。\n純資産\n資産から負債を差し引いた残り。\n資産\n－\n負債\n＝\n純資産","blanks":["会社","債務","純資産"],"options":[["会社","A社","B社","債務"],["債務","A社","B社","会社"],["純資産","事業A","事業B","事業X"]],"explanations":["本文：会社の財産状態を理解するためには、","本文：会社が他人に対して負っている債務。","本文：純資産"],"mode":"commercial"},"7":{"text":"資本金は、\n会社の資本関係を示す会社法上の重要な項目\nである。\n注意すべきなのは、\n資本金＝現在会社が持っている現金\nではないということ。\n会社が出資を受け、その後その資金を事業に使えば、\n現金は減っていても資本金という会社法上の区分が存在する。","blanks":["会社","出資","資本金"],"options":[["会社","A社","B社","債務"],["出資","A社","B社","会社"],["資本金","事業A","事業B","事業X"]],"explanations":["本文：会社の資本関係を示す会社法上の重要な項目","本文：会社が出資を受け、その後その資金を事業に使えば、","本文：資本金は、"],"mode":"commercial"},"8":{"text":"資本金を、\n「会社の銀行口座にその金額が残っている」\nと考えてはいけない。\n例えば、\n1,000万円出資 ↓ 資本金等の形成 ↓ その1,000万円で設備を購入 ↓ 現金は減少 ↓ 設備という資産になる\nということがある。\nしたがって、\n資本金と現金は別概念\nである。","blanks":["会社","出資","資本金"],"options":[["会社","A社","B社","債務"],["出資","A社","B社","会社"],["資本金","事業A","事業B","事業X"]],"explanations":["本文：「会社の銀行口座にその金額が残っている」","本文：1,000万円出資 ↓ 資本金等の形成 ↓ その1,000万円で設備を購入 ↓ 現金は減少 ↓ 設備という資産になる","本文：資本金を、"],"mode":"commercial"},"9":{"text":"株式会社では、設立時や募集株式の発行などに伴って、\n資本金の額\nが定められる。\nただし、出資された財産のすべてが必ず資本金になるとは限らず、会社法上のルールに従って資本金・資本準備金等に区分される。","blanks":["会社","株式","設立"],"options":[["会社","A社","B社","債務"],["株式","A社","B社","会社"],["設立","A社","B社","会社"]],"explanations":["本文：株式会社では、設立時や募集株式の発行などに伴って、","本文：株式会社では、設立時や募集株式の発行などに伴って、","本文：株式会社では、設立時や募集株式の発行などに伴って、"],"mode":"commercial"},"10":{"text":"会社の財産を確保するため、\n資本準備金・利益準備金\nなどの制度がある。\nこれらは、\n会社財産を一定程度内部に留保する\nという役割を持つ。","blanks":["会社","利益","準備金"],"options":[["会社","A社","B社","債務"],["利益","A社","B社","会社"],["準備金","事業A","事業B","事業X"]],"explanations":["本文：会社の財産を確保するため、","本文：資本準備金・利益準備金","本文：資本準備金・利益準備金"],"mode":"commercial"},"11":{"text":"剰余金とは、簡単にいうと、\n会社の純資産のうち、会社法上一定の計算によって算定される、配当等の対象となり得る財産\nである。\nここで重要なのは、\n利益＝そのまま自由に配当できる\nではないということ。\n会社法上の分配可能額などのルールを守る必要がある。","blanks":["会社","配当","剰余金"],"options":[["会社","A社","B社","債務"],["配当","A社","B社","会社"],["剰余金","事業A","事業B","事業X"]],"explanations":["本文：会社の純資産のうち、会社法上一定の計算によって算定される、配当等の対象となり得る財産","本文：会社の純資産のうち、会社法上一定の計算によって算定される、配当等の対象となり得る財産","本文：剰余金とは、簡単にいうと、"],"mode":"commercial"},"12":{"text":"剰余金の配当とは、\n会社が株主に対して利益等を分配すること\nである。\n基本的な流れは、\n会社\n↓\n利益等が発生\n↓\n会社財産として存在\n↓\n会社法上の手続\n↓\n剰余金配当\n↓\n株主\nとなる。","blanks":["会社","剰余金","株主"],"options":[["会社","A社","B社","債務"],["剰余金","事業A","事業B","事業X"],["株主","A社","B社","会社"]],"explanations":["本文：会社が株主に対して利益等を分配すること","本文：剰余金の配当とは、","本文：会社が株主に対して利益等を分配すること"],"mode":"commercial"},"13":{"text":"会社が、\n「利益が出たから好きなだけ株主に配ろう」\nということはできない。\nなぜなら、\n会社財産 ↓ 配当 ↓ 会社財産減少 ↓ 債権者への弁済原資減少\nとなるから。\nそこで会社法では、\n分配可能額\nなどに関する規制を設けている。","blanks":["会社","債権者","株主"],"options":[["会社","A社","B社","債務"],["債権者","事業A","事業B","事業X"],["株主","A社","B社","会社"]],"explanations":["本文：会社が、","本文：会社財産 ↓ 配当 ↓ 会社財産減少 ↓ 債権者への弁済原資減少","本文：「利益が出たから好きなだけ株主に配ろう」"],"mode":"commercial"},"14":{"text":"株主への配当や自己株式の取得など、会社財産を株主に分配する行為には、\n分配可能額\nによる制限がある。\nつまり、\n会社財産\n↓\n何でも自由に株主へ\n×\n↓\n会社法上の分配可能額等を確認\n↓\n適法な範囲で分配\nと考える。","blanks":["会社","株主","自己株式"],"options":[["会社","A社","B社","債務"],["株主","A社","B社","会社"],["自己株式","事業活動","会社分割","全部取得"]],"explanations":["本文：株主への配当や自己株式の取得など、会社財産を株主に分配する行為には、","本文：株主への配当や自己株式の取得など、会社財産を株主に分配する行為には、","本文：株主への配当や自己株式の取得など、会社財産を株主に分配する行為には、"],"mode":"commercial"},"15":{"text":"株式会社が自社の株式を取得すると、\n自己株式\nとなる。\n例えば、\n会社 ↓ 自社株を株主から買い取る ↓ 会社が自社株を保有 ↓ 自己株式\nである。","blanks":["株式","会社","株主"],"options":[["株式","A社","B社","会社"],["会社","A社","B社","債務"],["株主","A社","B社","会社"]],"explanations":["本文：株式会社が自社の株式を取得すると、","本文：株式会社が自社の株式を取得すると、","本文：会社 ↓ 自社株を株主から買い取る ↓ 会社が自社株を保有 ↓ 自己株式"],"mode":"commercial"},"16":{"text":"会社が自社株を自由に大量取得すると、\n•\t会社財産の流出\n•\t株主間の不公平\n•\t株価への影響\n•\t経営支配への影響\nなどが生じる可能性がある。\nそのため会社法では、\n自己株式の取得について一定の規制\nを設けている。","blanks":["会社","自己株式","株主"],"options":[["会社","A社","B社","債務"],["自己株式","事業活動","会社分割","全部取得"],["株主","A社","B社","会社"]],"explanations":["本文：会社が自社株を自由に大量取得すると、","本文：自己株式の取得について一定の規制","本文：•\t株主間の不公平"],"mode":"commercial"},"17":{"text":"会社が保有する自己株式を、\n第三者などに処分する\nこともできる。\nこれは新たな株式発行と似た経済的効果を持つ場合があるため、\n株主の利益や支配関係に与える影響\nを考える必要がある。","blanks":["株式","第三者","会社"],"options":[["株式","A社","B社","会社"],["第三者","事業A","事業B","事業X"],["会社","A社","B社","債務"]],"explanations":["本文：会社が保有する自己株式を、","本文：第三者などに処分する","本文：会社が保有する自己株式を、"],"mode":"commercial"},"18":{"text":"会社が新たに株式を発行して、\n資金を調達する\nことがある。\nこれを、\n募集株式の発行\nという。\n基本構造は、\n投資家\n↓\n出資\n↓\n会社\n↓\n新しい株式\n↓\n投資家\nである。","blanks":["株式","会社","出資"],"options":[["株式","A社","B社","会社"],["会社","A社","B社","債務"],["出資","A社","B社","会社"]],"explanations":["本文：会社が新たに株式を発行して、","本文：会社が新たに株式を発行して、","本文：出資"],"mode":"commercial"},"19":{"text":"新しい株式が発行されると、\n既存株主の持株割合が低下する\n可能性がある。\n例えば、\n発行済株式100株 ↓ Aが50株 ↓ Aの持株比率50%\nここで新たに100株発行すると、\n発行済株式200株 ↓ Aは50株のまま ↓ 持株比率25%\nとなる。\nこれを、\n希薄化\nという。","blanks":["株式","株主","持株比率"],"options":[["株式","A社","B社","会社"],["株主","A社","B社","会社"],["持株比率","事業活動","会社分割","全部取得"]],"explanations":["本文：新しい株式が発行されると、","本文：既存株主の持株割合が低下する","本文：発行済株式100株 ↓ Aが50株 ↓ Aの持株比率50%"],"mode":"commercial"},"20":{"text":"新しい株式を、\n特定の第三者に割り当てる\nことがある。\nこれを、\n第三者割当\nという。\n資金調達だけでなく、\n特定の企業との資本関係を作る\nなどの目的で利用されることもある。","blanks":["第三者","株式","特定"],"options":[["第三者","事業A","事業B","事業X"],["株式","A社","B社","会社"],["特定","A社","B社","会社"]],"explanations":["本文：特定の第三者に割り当てる","本文：新しい株式を、","本文：特定の第三者に割り当てる"],"mode":"commercial"},"21":{"text":"新株を特定の者に、\n他の株主等に比べて著しく有利な条件\nで発行する場合がある。\nこの場合、\n既存株主の利益を害する可能性\nがある。\nそのため会社法上、一定の手続・規制が問題となる。","blanks":["株主","会社","新株"],"options":[["株主","A社","B社","会社"],["会社","A社","B社","債務"],["新株","A社","B社","会社"]],"explanations":["本文：他の株主等に比べて著しく有利な条件","本文：そのため会社法上、一定の手続・規制が問題となる。","本文：新株を特定の者に、"],"mode":"commercial"},"22":{"text":"新株予約権とは、\n一定の条件で会社に対して株式の交付を請求できる権利\nである。\n新株予約権\n↓\n条件を満たす\n↓\n株式を取得\n↓\n株主になる","blanks":["新株予約権","株式","会社"],"options":[["新株予約権","C社がA社","不動産事業","損益計算書"],["株式","A社","B社","会社"],["会社","A社","B社","債務"]],"explanations":["本文：新株予約権とは、","本文：一定の条件で会社に対して株式の交付を請求できる権利","本文：一定の条件で会社に対して株式の交付を請求できる権利"],"mode":"commercial"},"23":{"text":"新株予約権は、\n•\tストックオプション\n•\t資金調達\n•\t買収防衛\n•\tインセンティブ\nなどに利用される。\n特に、\nストックオプション\nでは役員・従業員などに新株予約権を与え、会社の成長による利益を共有させることがある。","blanks":["新株予約権","会社","利益"],"options":[["新株予約権","C社がA社","不動産事業","損益計算書"],["会社","A社","B社","債務"],["利益","A社","B社","会社"]],"explanations":["本文：新株予約権は、","本文：では役員・従業員などに新株予約権を与え、会社の成長による利益を共有させることがある。","本文：では役員・従業員などに新株予約権を与え、会社の成長による利益を共有させることがある。"],"mode":"commercial"},"24":{"text":"社債とは、\n会社が資金を借り入れるために発行する証券\nである。\n社債を購入した者は、\n社債権者\nとなる。","blanks":["社債","債権者","会社"],"options":[["社債","A社","B社","会社"],["債権者","事業A","事業B","事業X"],["会社","A社","B社","債務"]],"explanations":["本文：社債とは、","本文：社債権者","本文：会社が資金を借り入れるために発行する証券"],"mode":"commercial"},"25":{"text":"ここは非常に重要。\n株式\n投資家 ↓ 出資 ↓ 株主 ↓ 会社の構成員\n社債\n投資家 ↓ 資金を貸す ↓ 社債権者 ↓ 会社に対する債権者\nしたがって、\n株主と社債権者は法律上の地位が違う。","blanks":["債権者","社債","会社"],"options":[["債権者","事業A","事業B","事業X"],["社債","A社","B社","会社"],["会社","A社","B社","債務"]],"explanations":["本文：投資家 ↓ 資金を貸す ↓ 社債権者 ↓ 会社に対する債権者","本文：社債","本文：投資家 ↓ 出資 ↓ 株主 ↓ 会社の構成員"],"mode":"commercial"},"26":{"text":"株式\t社債\t銀行借入\n相手\t株主\t社債権者\t銀行等\n法的地位\t社員\t債権者\t債権者\n議決権\t原則あり\tなし\tなし\n返済\t原則なし\t償還\t返済\n利益\t配当\t利息\t利息","blanks":["債権者","社債","株式"],"options":[["債権者","事業A","事業B","事業X"],["社債","A社","B社","会社"],["株式","A社","B社","会社"]],"explanations":["本文：相手\t株主\t社債権者\t銀行等","本文：株式\t社債\t銀行借入","本文：株式\t社債\t銀行借入"],"mode":"commercial"},"27":{"text":"会社が成長すると、\n他社と一体化する\n事業の一部を切り離す\n完全子会社化する\nなどの必要が生じる。\nそこで、\n組織再編\nという制度がある。\n代表的なのが、\n•\t合併\n•\t会社分割\n•\t株式交換\n•\t株式移転\nである。","blanks":["会社","株式","組織再編"],"options":[["会社","A社","B社","債務"],["株式","A社","B社","会社"],["組織再編","事業活動","会社分割","全部取得"]],"explanations":["本文：会社が成長すると、","本文：•\t株式交換","本文：組織再編"],"mode":"commercial"},"28":{"text":"合併とは、\n複数の会社を一つに統合すること\nである。\n代表的には、\n吸収合併\n一方の会社が他方を吸収する。\nA社 ＋ B社\n↓\nA社\nB社は消滅する。\n新設合併\n複数の会社が消滅し、新しい会社を設立する。\nA社 ＋ B社\n↓\nC社","blanks":["会社","合併","設立"],"options":[["会社","A社","B社","債務"],["合併","A社","B社","会社"],["設立","A社","B社","会社"]],"explanations":["本文：複数の会社を一つに統合すること","本文：合併とは、","本文：複数の会社が消滅し、新しい会社を設立する。"],"mode":"commercial"},"29":{"text":"吸収合併では、\n存続会社\nと、\n消滅会社\nが存在する。\nA社\n＋\nB社\n↓\nA社存続\nB社消滅\n↓\nA社がB社の権利義務を承継\n包括承継がポイント。","blanks":["会社","合併","A社"],"options":[["会社","A社","B社","債務"],["合併","A社","B社","会社"],["A社","B社","会社","債務"]],"explanations":["本文：存続会社","本文：吸収合併では、","本文：A社"],"mode":"commercial"},"30":{"text":"新設合併では、\nA社 ↓ 消滅\nB社 ↓ 消滅\nC社設立 ↓ 権利義務承継\nという構造になる。","blanks":["設立","合併","消滅"],"options":[["設立","A社","B社","会社"],["合併","A社","B社","会社"],["消滅","A社","B社","会社"]],"explanations":["本文：C社設立 ↓ 権利義務承継","本文：新設合併では、","本文：A社 ↓ 消滅"],"mode":"commercial"},"31":{"text":"会社分割とは、\n会社の事業に関する権利義務の全部または一部を、他の会社または新設会社に承継させる制度\nである。\nつまり、\n会社 ↓ 事業A＋事業B ↓ 会社分割 ↓ 事業Aを別会社へ 事業Bは元会社\nというような再編が可能。","blanks":["会社","事業A","事業B"],"options":[["会社","A社","B社","債務"],["事業A","事業B","事業X","債権者"],["事業B","事業A","事業X","債権者"]],"explanations":["本文：会社分割とは、","本文：会社 ↓ 事業A＋事業B ↓ 会社分割 ↓ 事業Aを別会社へ 事業Bは元会社","本文：会社 ↓ 事業A＋事業B ↓ 会社分割 ↓ 事業Aを別会社へ 事業Bは元会社"],"mode":"commercial"},"32":{"text":"吸収分割では、\n既に存在する他の会社\nに事業を承継させる。\nA社\n↓\n事業X\n↓\nB社へ承継","blanks":["会社","吸収分割","承継"],"options":[["会社","A社","B社","債務"],["吸収分割","事業活動","会社分割","全部取得"],["承継","A社","B社","会社"]],"explanations":["本文：既に存在する他の会社","本文：吸収分割では、","本文：に事業を承継させる。"],"mode":"commercial"},"33":{"text":"新設分割では、\n分割によって新しい会社を設立する。\nA社\n↓\n事業X\n↓\n新会社B\nとなる。","blanks":["会社","設立","新設分割"],"options":[["会社","A社","B社","債務"],["設立","A社","B社","会社"],["新設分割","事業活動","会社分割","全部取得"]],"explanations":["本文：分割によって新しい会社を設立する。","本文：分割によって新しい会社を設立する。","本文：新設分割では、"],"mode":"commercial"},"34":{"text":"株式交換とは、\nある会社を完全子会社とするために、その会社の株式を取得し、完全親会社となる会社との関係を作る制度\nである。\nA社\n↓\nB社株式を全部取得\n↓\nB社\n＝A社の完全子会社","blanks":["会社","株式","A社"],"options":[["会社","A社","B社","債務"],["株式","A社","B社","会社"],["A社","B社","会社","債務"]],"explanations":["本文：ある会社を完全子会社とするために、その会社の株式を取得し、完全親会社となる会社との関係を作る制度","本文：株式交換とは、","本文：A社"],"mode":"commercial"},"35":{"text":"株式交換では、\n完全親会社と完全子会社\nという関係を作ることが重要。\n例えば、\nA社 ↓ B社株式を全部取得 ↓ A社 ＝完全親会社\nB社 ＝完全子会社\nとなる。","blanks":["会社","株式","A社"],"options":[["会社","A社","B社","債務"],["株式","A社","B社","会社"],["A社","B社","会社","債務"]],"explanations":["本文：完全親会社と完全子会社","本文：株式交換では、","本文：A社 ↓ B社株式を全部取得 ↓ A社 ＝完全親会社"],"mode":"commercial"},"36":{"text":"株式移転とは、\n複数または単独の株式会社が、その発行済株式の全部を新たに設立する株式会社に取得させる制度\nである。\nA社\nB社\n↓\n新設C社\n↓\nC社がA社・B社を完全子会社化\nという構造。","blanks":["株式","会社","設立"],"options":[["株式","A社","B社","会社"],["会社","A社","B社","債務"],["設立","A社","B社","会社"]],"explanations":["本文：株式移転とは、","本文：複数または単独の株式会社が、その発行済株式の全部を新たに設立する株式会社に取得させる制度","本文：複数または単独の株式会社が、その発行済株式の全部を新たに設立する株式会社に取得させる制度"],"mode":"commercial"},"37":{"text":"株式交換\t株式移転\n親会社\t既存会社\t新設会社\n子会社\t完全子会社化\t完全子会社化\n新会社設立\t原則不要\t必要\n基本構造\t既存会社→既存会社\t新設会社→既存会社","blanks":["会社","株式","設立"],"options":[["会社","A社","B社","債務"],["株式","A社","B社","会社"],["設立","A社","B社","会社"]],"explanations":["本文：親会社\t既存会社\t新設会社","本文：株式交換\t株式移転","本文：新会社設立\t原則不要\t必要"],"mode":"commercial"},"38":{"text":"組織変更とは、\n株式会社を持分会社に、または持分会社を株式会社に変更する制度\nである。\n例えば、\n株式会社 ↓ 合同会社\nなど。\n会社そのものの法人格を維持しながら、会社形態を変更する。","blanks":["会社","株式","法人格"],"options":[["会社","A社","B社","債務"],["株式","A社","B社","会社"],["法人格","事業A","事業B","事業X"]],"explanations":["本文：株式会社を持分会社に、または持分会社を株式会社に変更する制度","本文：株式会社を持分会社に、または持分会社を株式会社に変更する制度","本文：会社そのものの法人格を維持しながら、会社形態を変更する。"],"mode":"commercial"},"39":{"text":"組織再編では、\n株主の地位が大きく変わる\n可能性がある。\n例えば、\nA社の株主だったのに、\n合併 ↓ B社の株式を受け取る\nなど。\nそのため会社法では、\n•\t株主総会の決議\n•\t反対株主の株式買取請求\n•\t債権者保護手続\nなどの制度が問題になる。","blanks":["株主","株式","組織再編"],"options":[["株主","A社","B社","会社"],["株式","A社","B社","会社"],["組織再編","事業活動","会社分割","全部取得"]],"explanations":["本文：株主の地位が大きく変わる","本文：合併 ↓ B社の株式を受け取る","本文：組織再編では、"],"mode":"commercial"},"40":{"text":"合併や会社分割などによって、\n会社の財産・債務関係が変化する。\nすると会社債権者に影響が出る。\nそこで、\n債権者異議手続\nなどの債権者保護制度が設けられている。","blanks":["債権者","会社","合併"],"options":[["債権者","事業A","事業B","事業X"],["会社","A社","B社","債務"],["合併","A社","B社","会社"]],"explanations":["本文：すると会社債権者に影響が出る。","本文：合併や会社分割などによって、","本文：合併や会社分割などによって、"],"mode":"commercial"},"41":{"text":"会社が重要な組織再編を行う場合、\n反対する株主\nが存在することがある。\nそこで一定の要件の下、\n会社に対して自己の株式を公正な価格で買い取るよう請求する\n制度がある。\nこれが、\n反対株主の株式買取請求\nである。","blanks":["会社","株式","株主"],"options":[["会社","A社","B社","債務"],["株式","A社","B社","会社"],["株主","A社","B社","会社"]],"explanations":["本文：会社が重要な組織再編を行う場合、","本文：会社に対して自己の株式を公正な価格で買い取るよう請求する","本文：反対する株主"],"mode":"commercial"},"42":{"text":"株式会社は一定の事由によって、\n解散\nする。\n解散すると、\n通常の事業活動を終了し、会社財産を整理する段階\nに入る。\nただし、\n解散＝その瞬間に会社が消滅\nではない。","blanks":["会社","解散","株式"],"options":[["会社","A社","B社","債務"],["解散","A社","B社","会社"],["株式","A社","B社","会社"]],"explanations":["本文：株式会社は一定の事由によって、","本文：解散","本文：株式会社は一定の事由によって、"],"mode":"commercial"},"43":{"text":"解散後は、\n清算\nを行う。\n基本的な流れは、\n解散\n↓\n清算\n↓\n会社財産を整理\n↓\n債権回収\n↓\n債務弁済\n↓\n残余財産分配\n↓\n清算結了\nである。","blanks":["清算","解散","会社"],"options":[["清算","A社","B社","会社"],["解散","A社","B社","会社"],["会社","A社","B社","債務"]],"explanations":["本文：清算","本文：解散後は、","本文：会社財産を整理"],"mode":"commercial"},"44":{"text":"清算を行うため、\n清算人\nが置かれる。\n清算人は、\n•\t現務の結了\n•\t債権の取立て\n•\t債務の弁済\n•\t残余財産の分配\nなどを行う。","blanks":["清算","債務","残余財産の分配"],"options":[["清算","A社","B社","会社"],["債務","A社","B社","会社"],["残余財産の分配","一定程度内部","債権の取立て","権利義務承継"]],"explanations":["本文：清算を行うため、","本文：•\t債務の弁済","本文：•\t残余財産の分配"],"mode":"commercial"},"45":{"text":"清算の結果、\n会社の財産 ↓ 債務を弁済 ↓ まだ財産が残る ↓ 残余財産\nとなる。\nその残余財産を、\n株主等に分配する\nことになる。","blanks":["会社","株主","清算"],"options":[["会社","A社","B社","債務"],["株主","A社","B社","会社"],["清算","A社","B社","会社"]],"explanations":["本文：会社の財産 ↓ 債務を弁済 ↓ まだ財産が残る ↓ 残余財産","本文：株主等に分配する","本文：清算の結果、"],"mode":"commercial"},"46":{"text":"株式会社は、\n事業開始\n↓\n事業活動\n↓\n利益・損失\n↓\n資金調達\n↓\n必要に応じて組織再編\n↓\n解散\n↓\n清算\n↓\n清算結了\nという一生を持つ。","blanks":["清算","株式会社","組織再編"],"options":[["清算","A社","B社","会社"],["株式会社","事業活動","会社分割","全部取得"],["組織再編","事業活動","会社分割","全部取得"]],"explanations":["本文：清算","本文：株式会社は、","本文：必要に応じて組織再編"],"mode":"commercial"},"47":{"text":"会社は資金を、\n① 株式\n↓\n出資\n↓\n株主\n② 社債\n↓\n借入的資金\n↓\n社債権者\n③ 銀行借入\n↓\n借入金\n↓\n金融機関\nなどから調達する。","blanks":["社債","債権者","株式"],"options":[["社債","A社","B社","会社"],["債権者","事業A","事業B","事業X"],["株式","A社","B社","会社"]],"explanations":["本文：② 社債","本文：社債権者","本文：① 株式"],"mode":"commercial"},"48":{"text":"株主\n↓\n出資\n↓\n会社\n↓\n事業\n↓\n利益\n↓\n配当\n債権者\n↓\n貸付・取引\n↓\n会社\n↓\n返済・弁済 株式会社の「計算」とは何か。","本文：組織再編"],"mode":"commercial"},"58":{"text":"会社のお金\n出資\n↓\n資本金等\n↓\n事業活動\n↓\n収益・費用\n↓\n利益\n↓\n剰余金\n↓\n配当\n資金調達\n会社\n│\n├─ 株式\n│   ↓\n│   株主\n│\n├─ 新株予約権\n│   ↓\n│   将来の株式取得\n│\n└─ 社債\n↓\n社債権者\n組織再編\n会社\n│\n├─ 合併\n│   └─ 会社を統合\n│\n├─ 会社分割\n│   └─ 事業を切り分け\n│\n├─ 株式交換\n│   └─ 既存会社を完全子会社化\n│\n├─ 株式移転\n│   └─ 新設会社を親会社にする\n│\n└─ 組織変更\n└─ 株式会社⇔持分会社\n会社の終了\n解散\n↓\n清算\n↓\n債権回収\n↓\n債務弁済\n↓\n残余財産分配\n↓\n清算結了\n★ 第5編の最重要10ポイント\n1.\t計算書類は会社の財産・損益等を明らかにする\n2.\t貸借対照表は財産状態、損益計算書は一定期間の経営成績を示す\n3.\t資本金＝現在の現金ではない\n4.\t配当には分配可能額などの制限がある\n5.\t自己株式の取得には会社法上の規制がある\n6.\t新株発行は資金調達になるが、既存株主の持株比率を希薄化させ得る\n7.\t新株予約権は将来株式を取得できる権利\n8.\t社債権者は株主ではなく会社の債権者\n9.\t合併・会社分割・株式交換・株式移転は組織再編\n10.\t解散しても直ちに法人格が消滅するわけではなく、清算を経て終了する\n第5編 完成\n第1編 商法総論 ↓ 商人・営業・商号・商業登記・支配人\n第2編 商行為 ↓ 商人間売買・商事代理・仲立・問屋・運送・寄託等\n第3編 会社法総論 ↓ 会社・法人格・会社の種類・社員・責任・機関\n第4編 株式会社 ↓ 設立・株式・株主・株主総会・取締役・取締役会・代表取締役・監査・役員責任\n第5編 株式会社の計算・組織再編等 ↓ 計算・資本金・剰余金・配当・自己株式・資金調達・新株予約権・社債・合併・会社分割・株式交換・株式移転・解散・清算\n↓\n次は第6編「持分会社・その他の会社法」\nここでは、\n合名会社 → 合資会社 → 合同会社 → 社員の責任 → 持分 → 業務執行 → 代表 → 退社 → 持分譲渡 → 解散・清算 → 株式会社との比較\nまで整理して、商法・会社法の基礎本全6編を完成させる。","blanks":["株式","株主","清算"],"options":[["株式","A社","B社","会社"],["株主","A社","B社","会社"],["清算","A社","B社","会社"]],"explanations":["本文：├─ 株式","本文：│   株主","本文：清算"],"mode":"commercial"}},"6":{"1":{"text":"持分会社とは、\n合名会社・合資会社・合同会社の総称\nである。\n株式会社と同じく、\n法人格を持つ会社\nである。\nしかし、株式会社とは会社の構造が大きく異なる。\n会社\n│\n├─ 株式会社\n│   └─ 株式を中心とする\n│\n└─ 持分会社\n├─ 合名会社\n├─ 合資会社\n└─ 合同会社","blanks":["会社","株式","法人格"],"options":[["会社","両者","個人","債務"],["株式","両者","会社","個人"],["法人格","ルール","不十分","債権者"]],"explanations":["本文：持分会社とは、","本文：株式会社と同じく、","本文：法人格を持つ会社"],"mode":"commercial"},"2":{"text":"株式会社は、\n出資者と経営者を分離しやすい会社\nである。\nこれに対して持分会社は、\n出資者自身が経営に関与する\nという人的結合を重視した構造を持つ。\n特に、\n少人数で信頼関係を前提として事業を行う\n場合に適している。","blanks":["会社","出資","株式"],"options":[["会社","両者","個人","債務"],["出資","両者","会社","個人"],["株式","両者","会社","個人"]],"explanations":["本文：株式会社は、","本文：出資者と経営者を分離しやすい会社","本文：株式会社は、"],"mode":"commercial"},"3":{"text":"持分会社では、\n「誰が社員なのか」\nが非常に重要になる。\nここでいう「社員」は、\n会社法上の社員＝出資者・構成員\nを意味する。\n一般的な意味の従業員ではない。","blanks":["会社","出資","誰が社員なのか"],"options":[["会社","両者","個人","債務"],["出資","両者","会社","個人"],["誰が社員なのか","残余財産の処理","具体的ルール","名前を覚える"]],"explanations":["本文：持分会社では、","本文：会社法上の社員＝出資者・構成員","本文：「誰が社員なのか」"],"mode":"commercial"},"4":{"text":"持分会社には、\n① 合名会社 ② 合資会社 ③ 合同会社\nがある。\n最大の違いは、\n社員がどのような責任を負うか\nである。","blanks":["会社","責任","最大"],"options":[["会社","両者","個人","債務"],["責任","両者","会社","個人"],["最大","両者","会社","個人"]],"explanations":["本文：持分会社には、","本文：社員がどのような責任を負うか","本文：最大の違いは、"],"mode":"commercial"},"5":{"text":"合名会社は、\n社員全員が無限責任社員\nである会社。\nつまり、\n会社財産だけでは債務を弁済できない場合、\n社員が会社債務について無限責任を負う。\n会社債務\n↓\nまず会社財産\n↓\n不足\n↓\n社員が責任を負う","blanks":["会社","責任","債務"],"options":[["会社","両者","個人","債務"],["責任","両者","会社","個人"],["債務","両者","会社","個人"]],"explanations":["本文：合名会社は、","本文：社員全員が無限責任社員","本文：会社財産だけでは債務を弁済できない場合、"],"mode":"commercial"},"6":{"text":"合資会社では、\n無限責任社員と有限責任社員\nが存在する。\n合資会社\n│\n├─ 無限責任社員\n│\n└─ 有限責任社員\nしたがって、\n両者の責任が異なる。","blanks":["責任","合資会社","存在"],"options":[["責任","両者","会社","個人"],["合資会社","人的結合","人的関係","代表社員"],["存在","両者","会社","個人"]],"explanations":["本文：無限責任社員と有限責任社員","本文：合資会社では、","本文：が存在する。"],"mode":"commercial"},"7":{"text":"合同会社は、\n社員全員が有限責任社員\nである持分会社。\nしたがって、\n合同会社\n↓\n社員全員\n↓\n有限責任\nとなる。\nただし株式会社とは異なり、\n社員自身が業務執行に関与することを基本とする\nという人的会社としての特徴を持つ。","blanks":["会社","有限責任","株式"],"options":[["会社","両者","個人","債務"],["有限責任","人的結合","人的関係","代表社員"],["株式","両者","会社","個人"]],"explanations":["本文：合同会社は、","本文：社員全員が有限責任社員","本文：ただし株式会社とは異なり、"],"mode":"commercial"},"8":{"text":"合名会社\t合資会社\t合同会社\n無限責任社員\t全員\t一部\tなし\n有限責任社員\tなし\t一部\t全員\n法人格\tあり\tあり\tあり\n人的結合\t強い\t強い\t強い\n有限責任\tなし\t一部\t全員","blanks":["会社","責任","法人格"],"options":[["会社","両者","個人","債務"],["責任","両者","会社","個人"],["法人格","ルール","不十分","債権者"]],"explanations":["本文：合名会社\t合資会社\t合同会社","本文：無限責任社員\t全員\t一部\tなし","本文：法人格\tあり\tあり\tあり"],"mode":"commercial"},"9":{"text":"ここは会社法を理解するうえで重要。\n無限責任\n会社財産だけでは債務を弁済できない場合、\n社員自身の財産によっても責任を負う。\n有限責任\n原則として、\n社員が会社に対して負う出資義務の範囲などを基礎として責任が限定される。\nしたがって、\n無限責任\n＝責任範囲が広い\n有限責任\n＝責任が限定される\nと理解する。","blanks":["責任","会社","出資"],"options":[["責任","両者","会社","個人"],["会社","両者","個人","債務"],["出資","両者","会社","個人"]],"explanations":["本文：無限責任","本文：ここは会社法を理解するうえで重要。","本文：社員が会社に対して負う出資義務の範囲などを基礎として責任が限定される。"],"mode":"commercial"},"10":{"text":"合同会社は、\n全社員が有限責任\nという点では株式会社と共通する。\nしかし、\n株式会社\n株主\n↓\n出資\n↓\n株式\n↓\n株主総会\n↓\n取締役\n↓\n業務執行\n合同会社\n社員\n↓\n出資\n↓\n持分\n↓\n原則として社員自身が業務執行\nという違いがある。","blanks":["会社","株式","株主"],"options":[["会社","両者","個人","債務"],["株式","両者","会社","個人"],["株主","両者","会社","個人"]],"explanations":["本文：合同会社は、","本文：という点では株式会社と共通する。","本文：株主"],"mode":"commercial"},"11":{"text":"持分会社では、\n持分\nが社員としての地位を表す。\n株式会社では、\n株式\nが重要だった。\n持分会社では、\n持分\nが重要になる。\n株式会社\n→ 株式\n持分会社\n→ 持分","blanks":["会社","株式","持分"],"options":[["会社","両者","個人","債務"],["株式","両者","会社","個人"],["持分","両者","会社","個人"]],"explanations":["本文：持分会社では、","本文：株式会社では、","本文：持分会社では、"],"mode":"commercial"},"12":{"text":"持分会社では、\n新しい社員が加入する\nことがある。\n社員の加入によって、\n•\t出資\n•\t業務執行\n•\t利益分配\n•\t会社の人的構成\nなどが変化する。","blanks":["会社","出資","利益"],"options":[["会社","両者","個人","債務"],["出資","両者","会社","個人"],["利益","両者","会社","個人"]],"explanations":["本文：持分会社では、","本文：•\t出資","本文：•\t利益分配"],"mode":"commercial"},"13":{"text":"社員は、\n会社に対して出資義務\nを負う。\n出資によって、\n会社財産が形成される。\n社員\n↓\n出資\n↓\n会社\n↓\n会社財産\n↓\n事業","blanks":["会社","出資","社員"],"options":[["会社","両者","個人","債務"],["出資","両者","会社","個人"],["社員","両者","会社","個人"]],"explanations":["本文：会社に対して出資義務","本文：会社に対して出資義務","本文：社員は、"],"mode":"commercial"},"14":{"text":"持分会社では、\n社員が業務執行に関与する\nことが基本となる。\nただし、\n定款によって異なる仕組みを設けることもできる。\n株式会社よりも、\n柔軟な内部自治\nが認められている。","blanks":["会社","株式","定款"],"options":[["会社","両者","個人","債務"],["株式","両者","会社","個人"],["定款","両者","会社","個人"]],"explanations":["本文：持分会社では、","本文：株式会社よりも、","本文：定款によって異なる仕組みを設けることもできる。"],"mode":"commercial"},"15":{"text":"合同会社では、\n原則として社員が業務を執行する。\nしたがって、\n社員\n↓\n出資者\n＋\n業務執行者\nという関係になりやすい。\nこれは、\n所有と経営が近い\nということを意味する。","blanks":["合同会社","出資","業務執行"],"options":[["合同会社","人的結合","人的関係","代表社員"],["出資","両者","会社","個人"],["業務執行","人的結合","人的関係","代表社員"]],"explanations":["本文：合同会社では、","本文：出資者","本文：業務執行者"],"mode":"commercial"},"16":{"text":"定款によって、\n業務を執行する社員\nを定めることができる。\nその場合、\n社員全員\n↓\n業務執行社員を定める\n↓\n業務執行社員が経営\nという構造になる。","blanks":["定款","業務執行社員","社員全員"],"options":[["定款","両者","会社","個人"],["業務執行社員","具体的ルール","名前を覚える","ということ"],["社員全員","人的結合","人的関係","代表社員"]],"explanations":["本文：定款によって、","本文：業務執行社員を定める","本文：社員全員"],"mode":"commercial"},"17":{"text":"持分会社では、\n代表社員\nという制度がある。\n会社を対外的に代表する者である。\n株式会社の、\n代表取締役\nに近い役割を持つ。","blanks":["会社","代表取締役","株式"],"options":[["会社","両者","個人","債務"],["代表取締役","ということ","基本ルール","人的結合"],["株式","両者","会社","個人"]],"explanations":["本文：持分会社では、","本文：代表取締役","本文：株式会社の、"],"mode":"commercial"},"18":{"text":"株式会社\t持分会社\n代表者\t代表取締役\t代表社員\n基礎となる地位\t取締役\t社員\n株主・社員\t株主\t社員\n所有と経営\t分離しやすい\t近接しやすい","blanks":["取締役","株主","会社"],"options":[["取締役","ルール","不十分","債権者"],["株主","両者","会社","個人"],["会社","両者","個人","債務"]],"explanations":["本文：代表者\t代表取締役\t代表社員","本文：株主・社員\t株主\t社員","本文：株式会社\t持分会社"],"mode":"commercial"},"19":{"text":"持分会社では、\n社員間の人的関係\nが重視される。\n株式会社のような、\n株式数を基礎とする多数決\nとは異なる仕組みを採用している。\nしたがって、\n定款による自治\nが非常に重要になる。","blanks":["会社","株式","定款"],"options":[["会社","両者","個人","債務"],["株式","両者","会社","個人"],["定款","両者","会社","個人"]],"explanations":["本文：持分会社では、","本文：株式会社のような、","本文：定款による自治"],"mode":"commercial"},"20":{"text":"持分会社の大きな特徴は、\n定款自治の範囲が広い\nことである。\nつまり、\n法律\n↓\n基本ルール\n↓\n定款\n↓\n社員間の具体的ルール\nという構造を作りやすい。","blanks":["定款","持分会社","具体的ルール"],"options":[["定款","両者","会社","個人"],["持分会社","人的結合","人的関係","代表社員"],["具体的ルール","名前を覚える","業務執行社員","ということ"]],"explanations":["本文：定款自治の範囲が広い","本文：持分会社の大きな特徴は、","本文：社員間の具体的ルール"],"mode":"commercial"},"21":{"text":"会社に利益が生じれば、\n社員への利益分配\nが問題となる。\n持分会社では、\n定款によって分配方法などを定めることができる。\nしたがって、\n株式会社のように株式数だけを基準に考える必要はない。","blanks":["会社","株式","利益"],"options":[["会社","両者","個人","債務"],["株式","両者","会社","個人"],["利益","両者","会社","個人"]],"explanations":["本文：会社に利益が生じれば、","本文：株式会社のように株式数だけを基準に考える必要はない。","本文：会社に利益が生じれば、"],"mode":"commercial"},"22":{"text":"利益だけでなく、\n損失の負担\nも問題になる。\n基本的には、\n定款による定め\nが重要になる。\n定款に特段の定めがない場合には、会社法上のルールによって処理する。","blanks":["定款","会社","利益"],"options":[["定款","両者","会社","個人"],["会社","両者","個人","債務"],["利益","両者","会社","個人"]],"explanations":["本文：定款による定め","本文：定款に特段の定めがない場合には、会社法上のルールによって処理する。","本文：利益だけでなく、"],"mode":"commercial"},"23":{"text":"持分会社の持分は、\n株式会社の株式と同じように自由に譲渡できるわけではない。\nなぜなら、\n「誰が社員になるか」\nが会社の人的関係に直結するからである。","blanks":["会社","株式","譲渡"],"options":[["会社","両者","個人","債務"],["株式","両者","会社","個人"],["譲渡","両者","会社","個人"]],"explanations":["本文：持分会社の持分は、","本文：株式会社の株式と同じように自由に譲渡できるわけではない。","本文：株式会社の株式と同じように自由に譲渡できるわけではない。"],"mode":"commercial"},"24":{"text":"例えば、\nA・B・Cの3人で合同会社を経営している。\nAが突然、\n「自分の持分を知らないDに全部譲る」\nとすると、\nB・Cにとっては、\n一緒に経営する相手が突然変わる\nことになる。\nそのため、\n持分会社では社員の個性が重視され、持分譲渡には一定の制限がある。","blanks":["会社","譲渡","自分の持分を知らないDに全部譲る"],"options":[["会社","両者","個人","債務"],["譲渡","両者","会社","個人"],["自分の持分を知らないDに全部譲る","Cの3人が共同で事業を始める","取消しとは異なる特殊な制度","法人なら必ず社員になれる"]],"explanations":["本文：A・B・Cの3人で合同会社を経営している。","本文：持分会社では社員の個性が重視され、持分譲渡には一定の制限がある。","本文：「自分の持分を知らないDに全部譲る」"],"mode":"commercial"},"25":{"text":"持分会社では、\n社員が会社から離脱する\nことがある。\nこれを、\n退社\nという。\n退社には、\n•\t任意退社\n•\t法定退社\nなどがある。","blanks":["会社","社員","退社"],"options":[["会社","両者","個人","債務"],["社員","両者","会社","個人"],["退社","両者","会社","個人"]],"explanations":["本文：持分会社では、","本文：社員が会社から離脱する","本文：退社"],"mode":"commercial"},"26":{"text":"社員が退社すると、\nその社員の持分について財産的な清算\nが問題になる。\nつまり、\n社員\n↓\n退社\n↓\n会社との関係終了\n↓\n持分の価値を清算\n↓\n払戻し等\nという流れになる。","blanks":["清算","会社","退社"],"options":[["清算","両者","会社","個人"],["会社","両者","個人","債務"],["退社","両者","会社","個人"]],"explanations":["本文：その社員の持分について財産的な清算","本文：会社との関係終了","本文：社員が退社すると、"],"mode":"commercial"},"27":{"text":"持分会社では、\n社員の死亡\nも重要。\nなぜなら、\n誰が社員になるか\nが会社の存立・人的関係に関係するからである。\n株式会社の株式相続とは異なる考え方が必要になる。","blanks":["会社","株式","社員"],"options":[["会社","両者","個人","債務"],["株式","両者","会社","個人"],["社員","両者","会社","個人"]],"explanations":["本文：持分会社では、","本文：株式会社の株式相続とは異なる考え方が必要になる。","本文：社員の死亡"],"mode":"commercial"},"28":{"text":"株式会社では、\n株式が相続の対象になる\nことが基本。\n一方、持分会社では、\n定款の定めなどを確認しながら、社員たる地位と相続人との関係を考える\n必要がある。","blanks":["会社","株式","定款"],"options":[["会社","両者","個人","債務"],["株式","両者","会社","個人"],["定款","両者","会社","個人"]],"explanations":["本文：株式会社では、","本文：株式会社では、","本文：定款の定めなどを確認しながら、社員たる地位と相続人との関係を考える"],"mode":"commercial"},"29":{"text":"持分会社では、\n法人が社員になる\nこともある。\nただし、\n無限責任社員については特別なルール\nが存在する。\nしたがって、\n「法人なら必ず社員になれる」\nと単純に考えるのではなく、会社の種類と責任関係を確認する。","blanks":["会社","責任","法人なら必ず社員になれる"],"options":[["会社","両者","個人","債務"],["責任","両者","会社","個人"],["法人なら必ず社員になれる","取消しとは異なる特殊な制度","Cの3人が共同で事業を始める","自分の持分を知らないDに全部譲る"]],"explanations":["本文：持分会社では、","本文：無限責任社員については特別なルール","本文：「法人なら必ず社員になれる」"],"mode":"commercial"},"30":{"text":"株式会社では、\n•\t株主総会\n•\t取締役\n•\t取締役会\n•\t監査役\nなどの機関設計が問題になった。\n持分会社では、\n社員自身が業務執行に関与する\nことを基本としている。\nそのため株式会社ほど複雑な機関構造を必要としない。","blanks":["会社","取締役","株式"],"options":[["会社","両者","個人","債務"],["取締役","ルール","不十分","債権者"],["株式","両者","会社","個人"]],"explanations":["本文：株式会社では、","本文：•\t取締役","本文：株式会社では、"],"mode":"commercial"},"31":{"text":"合同会社は、\n「有限責任」と「人的会社的な柔軟性」\nを組み合わせた会社。\n合同会社\n＝\n有限責任\n＋\n定款自治\n＋\n所有と経営の近接\nこれが大きな特徴。","blanks":["会社","有限責任","定款"],"options":[["会社","両者","個人","債務"],["有限責任","人的結合","人的関係","代表社員"],["定款","両者","会社","個人"]],"explanations":["本文：合同会社は、","本文：「有限責任」と「人的会社的な柔軟性」","本文：定款自治"],"mode":"commercial"},"32":{"text":"株式会社\t合同会社\n責任\t株主は有限責任\t社員は有限責任\n出資単位\t株式\t持分\n経営\t取締役等\t原則社員\n組織\t比較的制度化\t柔軟\n定款自治\tあり\tより広い\n株式上場\t可能\t不可\n所有と経営\t分離しやすい\t近い","blanks":["株式","責任","会社"],"options":[["株式","両者","会社","個人"],["責任","両者","会社","個人"],["会社","両者","個人","債務"]],"explanations":["本文：株式会社\t合同会社","本文：責任\t株主は有限責任\t社員は有限責任","本文：株式会社\t合同会社"],"mode":"commercial"},"33":{"text":"3種類を、\n「名前を覚える」\nだけでは不十分。\n重要なのは、\n責任の違い\nである。\n合名\n↓\n全員無限責任\n合資\n↓\n無限＋有限\n合同\n↓\n全員有限責任\nこれを最初に押さえる。","blanks":["責任","名前を覚える","不十分"],"options":[["責任","両者","会社","個人"],["名前を覚える","具体的ルール","業務執行社員","ということ"],["不十分","ルール","債権者","取締役"]],"explanations":["本文：責任の違い","本文：「名前を覚える」","本文：だけでは不十分。"],"mode":"commercial"},"34":{"text":"合名会社\n社員全員\n↓\n無限責任\n合資会社\n無限責任社員\n＋\n有限責任社員\n合同会社\n社員全員\n↓\n有限責任","blanks":["責任","会社","社員全員"],"options":[["責任","両者","会社","個人"],["会社","両者","個人","債務"],["社員全員","人的結合","人的関係","代表社員"]],"explanations":["本文：無限責任","本文：合名会社","本文：社員全員"],"mode":"commercial"},"35":{"text":"持分会社も、\n株式会社と同じく法人\nである。\nしたがって、\n会社と社員は別人格\nである。\n例えば、\n会社が1000万円の債務を負ったとしても、\n「会社の債務＝社員個人の債務」\nと直ちに考えてはいけない。\nただし、\n無限責任社員については、会社債務に関して社員自身が責任を負う場面がある。","blanks":["会社","債務","責任"],"options":[["会社","両者","個人","債務"],["債務","両者","会社","個人"],["責任","両者","会社","個人"]],"explanations":["本文：持分会社も、","本文：会社が1000万円の債務を負ったとしても、","本文：無限責任社員については、会社債務に関して社員自身が責任を負う場面がある。"],"mode":"commercial"},"36":{"text":"ここは重要。\n法人格\n＝\n会社と社員を別人格として扱う\n有限責任\n＝\n社員の責任範囲を限定する\nしたがって、\n法人格と有限責任は同じものではない。\n例えば、\n合名会社にも法人格はあるが、社員は無限責任を負う。","blanks":["責任","法人格","会社"],"options":[["責任","両者","会社","個人"],["法人格","ルール","不十分","債権者"],["会社","両者","個人","債務"]],"explanations":["本文：有限責任","本文：法人格","本文：会社と社員を別人格として扱う"],"mode":"commercial"},"37":{"text":"持分会社でも、\n法人格が濫用される\n場合には、\n法人格否認の法理\nが問題となる。\n例えば、\n会社を単なる個人の財布として利用するなど、\n会社と個人を形式的に別人格として扱うことが著しく不当\nな場合である。","blanks":["会社","法人格","法理"],"options":[["会社","両者","個人","債務"],["法人格","ルール","不十分","債権者"],["法理","両者","会社","個人"]],"explanations":["本文：持分会社でも、","本文：法人格が濫用される","本文：法人格否認の法理"],"mode":"commercial"},"38":{"text":"持分会社も、\n一定の事由によって解散\nする。\n解散すると、\n清算\nの段階に入る。\n解散\n↓\n清算\n↓\n財産整理\n↓\n債務弁済\n↓\n残余財産\n↓\n社員等へ分配","blanks":["解散","清算","持分会社"],"options":[["解散","両者","会社","個人"],["清算","両者","会社","個人"],["持分会社","人的結合","人的関係","代表社員"]],"explanations":["本文：一定の事由によって解散","本文：清算","本文：持分会社も、"],"mode":"commercial"},"39":{"text":"清算では、\n•\t現務の結了\n•\t債権の取立て\n•\t債務の弁済\n•\t残余財産の処理\nなどを行う。\n株式会社の清算と共通する部分も多い。","blanks":["清算","株式会社","債務"],"options":[["清算","両者","会社","個人"],["株式会社","人的結合","人的関係","代表社員"],["債務","両者","会社","個人"]],"explanations":["本文：清算では、","本文：株式会社の清算と共通する部分も多い。","本文：•\t債務の弁済"],"mode":"commercial"},"40":{"text":"一定の場合には、\n解散事由が発生しても会社を継続する\nことが問題になる。\nここでも、\n会社法上の要件と定款\nを確認することが重要。","blanks":["会社","定款","解散"],"options":[["会社","両者","個人","債務"],["定款","両者","会社","個人"],["解散","両者","会社","個人"]],"explanations":["本文：解散事由が発生しても会社を継続する","本文：会社法上の要件と定款","本文：解散事由が発生しても会社を継続する"],"mode":"commercial"},"41":{"text":"株式会社が解散した場合、\n特別清算\nという制度が問題になることがある。\nこれは、\n清算の遂行に著しい支障を来す事情がある場合などに、裁判所の監督の下で行われる特別な清算手続\nである。\n通常の清算とは区別する。","blanks":["清算","株式会社","解散"],"options":[["清算","両者","会社","個人"],["株式会社","人的結合","人的関係","代表社員"],["解散","両者","会社","個人"]],"explanations":["本文：特別清算","本文：株式会社が解散した場合、","本文：株式会社が解散した場合、"],"mode":"commercial"},"42":{"text":"会社法には、\n会社内部の法律関係をめぐる訴訟\nについて特別な制度がある。\n例えば、\n•\t設立無効の訴え\n•\t株主総会決議取消しの訴え\n•\t合併無効の訴え\nなど。","blanks":["会社","株主総会","設立"],"options":[["会社","両者","個人","債務"],["株主総会","人的結合","人的関係","代表社員"],["設立","両者","会社","個人"]],"explanations":["本文：会社法には、","本文：•\t株主総会決議取消しの訴え","本文：•\t設立無効の訴え"],"mode":"commercial"},"43":{"text":"株式会社では、\n株主総会の決議に手続上・内容上の問題\nがある場合、\n決議取消しの訴え\nなどが問題になる。\n会社法上の訴えは、\n民法上の一般的な無効・取消しとは異なる特殊な制度\nとして理解する。","blanks":["会社","株主総会","株式"],"options":[["会社","両者","個人","債務"],["株主総会","人的結合","人的関係","代表社員"],["株式","両者","会社","個人"]],"explanations":["本文：株式会社では、","本文：株主総会の決議に手続上・内容上の問題","本文：株式会社では、"],"mode":"commercial"},"44":{"text":"会社の設立に重大な瑕疵がある場合、\n設立無効の訴え\nが問題になる。\n重要なのは、\n会社が成立した後に、どのようにその効力を争うか\nという点。","blanks":["会社","設立","重大"],"options":[["会社","両者","個人","債務"],["設立","両者","会社","個人"],["重大","両者","会社","個人"]],"explanations":["本文：会社の設立に重大な瑕疵がある場合、","本文：会社の設立に重大な瑕疵がある場合、","本文：会社の設立に重大な瑕疵がある場合、"],"mode":"commercial"},"45":{"text":"合併などの組織再編についても、\n一定の要件の下で無効を争う制度\nがある。\nしたがって、\n合併\n↓\n手続に重大な問題\n↓\n組織再編の効力を争う\n↓\n会社法上の訴え\nという考え方を持つ。","blanks":["組織再編","合併","会社"],"options":[["組織再編","人的結合","人的関係","代表社員"],["合併","両者","会社","個人"],["会社","両者","個人","債務"]],"explanations":["本文：合併などの組織再編についても、","本文：合併などの組織再編についても、","本文：会社法上の訴え"],"mode":"commercial"},"46":{"text":"会社法では、\n多数決\nが重要。\nしかし、\n多数派が少数派を不当に排除する\nことまで認められているわけではない。\nそこで、\n•\t株主代表訴訟\n•\t株式買取請求\n•\t株主総会決議取消し\n•\t各種の差止め\n•\t情報開示\nなどの制度によって、\n少数者の利益\nを保護する。","blanks":["株主","会社","株式"],"options":[["株主","両者","会社","個人"],["会社","両者","個人","債務"],["株式","両者","会社","個人"]],"explanations":["本文：•\t株主代表訴訟","本文：会社法では、","本文：•\t株式買取請求"],"mode":"commercial"},"47":{"text":"会社法では、\n株主\n↓\n利益を得たい\n取締役\n↓\n会社を経営\n会社債権者\n↓\n会社財産から弁済を受けたい\n少数株主\n↓\n多数派から保護されたい       <div class="card">
        <div class="title">${head.textContent}</div>
        <div class="sub">${titles.length}章</div>
      </div>
      <div class="grid">
        ${titles.map((t,i)=>`
          <button class="chapter" onclick="openChapter(${currentPart},${i})">
            <span class="num">${i+1}</span><span>${escapeHtml(t)}</span>
          </button>`).join("")}
      </div>`;
    return;
  }

  if(page==="quiz"){
    if(book==="past350") renderPast350Quiz();
    else renderQuiz();
  }
}

function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function getQuestion(){
  const D=getBook();
  const p=D.questions?.[String(currentPart+1)];
  const q=p?.[String(currentChapter+1)];
  return Array.isArray(q) ? (q[0] || null) : (q || null);
}

function getPastGroup(q){
  return q?.groups?.[pastExplanationIndex] || null;
}
function resetPastQuiz(){
  pastExplanationIndex=0;
  pastBlankIndex=0;
  pastAnswers=[];
  pastAnswersByGroup=[];
  pastChecked=false;
}

function openPart(p){
  currentPart=p;
  page="list";
  render();
}

function openChapter(p,i){
  currentPart=p;
  currentChapter=i;
  if(book==="past350") resetPastQuiz();
  blankIndex=0;
  answers=[];
  checked=false;
  page="quiz";
  render();
}

function getBlankData(q, index){
  // 憲法基礎は、問題文に登場する上からの順番で空欄を出題する。
  const actualIndex = (q.mode === "constitution" || q.mode === "civil" || q.mode === "administrative" || q.mode === "commercial" || q.mode === "past350") ? getConstitutionBlankOrder(q)[index] : index;
  if(Array.isArray(q.answers)){
    const a=q.answers[actualIndex];
    return a ? {correct:a.correct, choices:Array.isArray(a.options)?a.options.slice():[]} : {correct:undefined,choices:[]};
  }
  const blanks=Array.isArray(q.blanks)?q.blanks:[];
  const opts=Array.isArray(q.options)?q.options:[];
  return {correct:blanks[actualIndex], choices:Array.isArray(opts[actualIndex])?opts[actualIndex].slice():[]};
}

function getBlanks(q){
  if(Array.isArray(q.answers)) return q.answers.map(a=>a.correct);
  return Array.isArray(q.blanks)?q.blanks.slice():[];
}

// 憲法基礎：本文中で最初に登場する位置を基準に、空欄を上から順番に並べる。
// 問題データ内の blanks の並び順は変更せず、表示・出題順だけを本文順にする。
function getConstitutionBlankOrder(q){
  const blanks=getBlanks(q);
  const prompt=String(q.text||q.question||q.source||'');
  return blanks.map((target,i)=>{
    const pos=prompt.indexOf(String(target));
    return {i,pos:pos<0?Number.MAX_SAFE_INTEGER:pos};
  }).sort((a,b)=>a.pos-b.pos || a.i-b.i).map(x=>x.i);
}

// 正解位置を毎回変える。単純なシャッフルではなく、正解を必ずA以外へ移動させてから並べる。
function shuffleChoices(arr, correct, seed){
  const a=arr.slice();
  if(a.length<=1) return a;
  // Fisher-Yates
  let x=(seed*9301+49297)%233280;
  const rnd=()=>{x=(x*9301+49297)%233280;return x/233280;};
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(rnd()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  // 正解が先頭なら、正解以外の要素と必ず交換する。
  if(String(choiceValue(a[0]))===String(correct)){
    const candidates=[];
    for(let i=1;i<a.length;i++) if(String(choiceValue(a[i]))!==String(correct)) candidates.push(i);
    if(candidates.length){
      const j=candidates[Math.floor(rnd()*candidates.length)];
      [a[0],a[j]]=[a[j],a[0]];
    }
  }
  return a;
}

function choiceValue(c){
  return (c && typeof c==='object') ? (c.answer ?? c.text ?? c.value) : c;
}

function renderQuestionText(q, blanks, current){
  const prompt=String(q.text||q.question||q.source||'');
  // 第1〜3編：本文中の「1」「2」…を空欄化。
  if(/「\d+」/.test(prompt)){
    return prompt.replace(/「(\d+)」/g,(m,n)=>{
      const idx=Number(n)-1;
      if(idx<0 || idx>=blanks.length) return m;
      if(idx===current) return '<span class="blank">？</span>';
      return answers[idx]!==undefined ? '<span class="blank">'+escapeHtml(String(answers[idx]))+'</span>' : '<span class="blank">　</span>';
    });
  }

  // 憲法基礎・民法基礎：元本文を維持したまま、対象語だけを表示上の空欄にする。
  if(q.mode==="constitution" || q.mode==="civil" || q.mode==="administrative" || q.mode==="commercial"){
    let display=escapeHtml(prompt);
    const order=getConstitutionBlankOrder(q);
    // 本文上の位置は変えず、現在の出題番号だけを上から順番に対応させる。
    for(let visualIndex=0;visualIndex<order.length;visualIndex++){
      const i=order[visualIndex];
      const target=String(blanks[i]);
      const escaped=target.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re=new RegExp(escaped);
      if(!re.test(display)) continue;
      let replacement;
      if(visualIndex===current) replacement='<span class="blank">？</span>';
      else if(answers[i]!==undefined) replacement='<span class="blank">'+escapeHtml(String(answers[i]))+'</span>';
      else replacement='<span class="blank">　</span>';
      display=display.replace(re,replacement);
    }
    return display;
  }

  // 第4〜6編：本文中の空欄対象語をすべて隠す。
  // 現在の空欄だけ「？」、回答済みは回答、未回答の後続空欄は空欄線として表示する。
  let display=escapeHtml(prompt);
  for(let i=0;i<blanks.length;i++){
    const target=String(blanks[i]);
    const re=new RegExp('「'+target.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'」');
    if(!re.test(display)) continue;
    let replacement;
    if(i===current) replacement='<span class="blank">？</span>';
    else if(answers[i]!==undefined) replacement='<span class="blank">'+escapeHtml(String(answers[i]))+'</span>';
    else replacement='<span class="blank">　</span>';
    display=display.replace(re,replacement);
  }
  return display;
}

function renderPastText(group, current){
  const prompt=String(group?.text||'');
  const blanks=Array.isArray(group?.blanks)?group.blanks:[];
  let display=escapeHtml(prompt);
  // Source text is shown as-is except the current/previous/future target terms.
  // Replace longer targets first so nested phrases do not break.
  const order=blanks.map((t,i)=>({i,pos:prompt.indexOf(String(t))})).sort((a,b)=>(a.pos<0?1:0)-(b.pos<0?1:0)||a.pos-b.pos||a.i-b.i);
  for(const item of order){
    const i=item.i, target=String(blanks[i]);
    if(!target || item.pos<0) continue;
    const re=new RegExp(target.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    if(!re.test(display)) continue;
    let replacement;
    if(i===current) replacement='<span class="blank">？</span>';
    else if(pastAnswers[i]!==undefined) replacement='<span class="blank">'+escapeHtml(String(pastAnswers[i]))+'</span>';
    else replacement='<span class="blank">　</span>';
    display=display.replace(re,replacement);
  }
  return display;
}

function renderPast350Quiz(){
  const q=getQuestion();
  const groups=q?.groups||[];
  const group=groups[pastExplanationIndex];
  if(!group){
    app.innerHTML='<div class="card"><div class="title">このNo.の解説データがありません</div></div>';
    return;
  }
  const blanks=group.blanks||[];
  if(!blanks.length){
    app.innerHTML='<div class="card"><div class="title">この解説に穴埋めがありません</div></div>';
    return;
  }
  if(pastBlankIndex>=blanks.length) pastBlankIndex=0;
  const correct=blanks[pastBlankIndex];
  const choices=shuffleChoices(group.options[pastBlankIndex]||[],correct,(currentChapter+1)*1000+(pastExplanationIndex+1)*100+pastBlankIndex+1);
  const D=getBook();
  head.textContent=`No.${currentChapter+1}・解説${pastExplanationIndex+1}`;
  const display=renderPastText(group,pastBlankIndex);
  app.innerHTML=`
    <div class="card">
      <div class="small">No.${currentChapter+1}　${escapeHtml((D.titles[currentPart]||[])[currentChapter]||'')}</div>
      <div class="title">解説${pastExplanationIndex+1}</div>
      <div class="question">${display}</div>
      <div class="sub">解説${pastExplanationIndex+1}　空欄 ${pastBlankIndex+1} / ${blanks.length}</div>
    </div>
    <div class="card" id="choices"></div>`;
  const box=document.getElementById('choices');
  choices.forEach((c,i)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='choice';
    b.textContent=String.fromCharCode(65+i)+'. '+String(choiceValue(c));
    b.onclick=()=>answerPast350(i,choices);
    box.appendChild(b);
  });
}

function answerPast350(i,choices){
  if(pastChecked) return;
  const q=getQuestion();
  const group=getPastGroup(q);
  const blanks=group.blanks;
  const correct=blanks[pastBlankIndex];
  const value=choiceValue(choices[i]);
  pastAnswers[pastBlankIndex]=value;
  if(!Array.isArray(pastAnswersByGroup[pastExplanationIndex])) pastAnswersByGroup[pastExplanationIndex]=[];
  pastAnswersByGroup[pastExplanationIndex][pastBlankIndex]=value;
  [...document.querySelectorAll('.choice')].forEach((b,j)=>{
    b.disabled=true;
    const v=choiceValue(choices[j]);
    if(j===i)b.classList.add('selected');
    if(String(v)===String(correct))b.classList.add('correct');
    if(j===i && String(v)!==String(correct))b.classList.add('wrong');
  });
  const ok=String(value)===String(correct);
  const box=document.getElementById('choices');
  const result=document.createElement('div');
  result.className='result '+(ok?'ok':'ng');
  result.innerHTML=(ok?'✓ 正解':'✕ 不正解')+'<br>正解：<b>'+escapeHtml(String(correct))+'</b>';
  const next=document.createElement('button');
  next.type='button'; next.className='next';
  next.textContent=pastBlankIndex<blanks.length-1?'次の空欄へ':(pastExplanationIndex<q.groups.length-1?'解説'+(pastExplanationIndex+2)+'へ':'このNo.の結果を見る');
  next.onclick=()=>{
    if(pastBlankIndex<blanks.length-1){pastBlankIndex++;renderPast350Quiz();}
    else if(pastExplanationIndex<q.groups.length-1){
      pastAnswersByGroup[pastExplanationIndex]=pastAnswers.slice();
      pastExplanationIndex++;pastBlankIndex=0;pastAnswers=[];renderPast350Quiz();
    }
    else{
      pastAnswersByGroup[pastExplanationIndex]=pastAnswers.slice();
      pastChecked=true;showPast350Final();
    }
  };
  box.appendChild(result); box.appendChild(next);
}

function showPast350Final(){
  const q=getQuestion();
  let total=0,score=0;
  const rows=q.groups.map((g,gi)=>{
    let gs=0;
    const rr=g.blanks.map((c,i)=>{total++;const ok=String(pastAnswersByGroup?.[gi]?.[i])===String(c);if(ok){score++;gs++;}return `<div class="result ${ok?'ok':'ng'}">${i+1}. ${ok?'○':'×'}　あなたの回答：${escapeHtml(String(pastAnswersByGroup?.[gi]?.[i]??''))}<br>正解：<b>${escapeHtml(String(c))}</b><br>${escapeHtml(String(g.text))}</div>`;}).join('');
    return `<div class="card"><div class="title">解説${gi+1}</div><div class="sub">${gs} / ${g.blanks.length} 正解</div>${rr}</div>`;
  }).join('');
  app.innerHTML=`<div class="card"><div class="title">No.${currentChapter+1} 結果</div><div class="sub">${score} / ${total} 正解</div></div>${rows}<div class="card"><button class="next" onclick="openChapter(${currentPart},${currentChapter})">もう一度</button><button class="next" onclick="nextChapter()">次のNo.へ</button></div>`;
}

function renderQuiz(){
  const q=getQuestion();
  if(!q){
    app.innerHTML='<div class="card"><div class="title">問題データがありません</div><div class="sub">この章の問題データを確認してください。</div></div>';
    return;
  }
  const blanks=getBlanks(q);
  if(!blanks.length){
    app.innerHTML='<div class="card"><div class="title">この章に空欄がありません</div></div>';
    return;
  }
  if(blankIndex>=blanks.length) blankIndex=0;

  const visualOrder=(q.mode === "constitution" || q.mode === "civil" || q.mode === "administrative" || q.mode === "commercial" || q.mode === "past350") ? getConstitutionBlankOrder(q) : null;
  const actualIndex=(q.mode === "constitution" || q.mode === "civil" || q.mode === "administrative" || q.mode === "commercial" || q.mode === "past350") ? visualOrder[blankIndex] : blankIndex;
  const bd=getBlankData(q,blankIndex);
  const choices=shuffleChoices(bd.choices,bd.correct,(currentPart+1)*10000+(currentChapter+1)*100+blankIndex+1);
  const D=getBook();
  head.textContent=`第${currentPart+1}編・第${currentChapter+1}章`;

  const display=renderQuestionText(q,blanks,blankIndex);
  app.innerHTML=`
    <div class="card">
      <div class="small">第${currentChapter+1}章　${escapeHtml((D.titles[currentPart]||[])[currentChapter]||'')}</div>
      <div class="question">${display}</div>
      <div class="sub">空欄 ${blankIndex+1} / ${blanks.length}</div>
    </div>
    <div class="card" id="choices"></div>`;

  const box=document.getElementById('choices');
  if(!choices.length){
    box.innerHTML='<div class="sub">この空欄の選択肢がありません。</div>';
    return;
  }
  choices.forEach((c,i)=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='choice';
    b.textContent=String.fromCharCode(65+i)+'. '+String(choiceValue(c));
    b.onclick=()=>answer(i,choices);
    box.appendChild(b);
  });
}

function answer(i,choices){
  if(checked) return;
  const q=getQuestion();
  const blanks=getBlanks(q);
  const actualIndex=(q.mode === "constitution" || q.mode === "civil" || q.mode === "administrative" || q.mode === "commercial" || q.mode === "past350") ? getConstitutionBlankOrder(q)[blankIndex] : blankIndex;
  const correct=blanks[actualIndex];
  const value=choiceValue(choices[i]);
  answers[actualIndex]=value;

  [...document.querySelectorAll('.choice')].forEach((b,j)=>{
    b.disabled=true;
    const v=choiceValue(choices[j]);
    if(j===i)b.classList.add('selected');
    if(String(v)===String(correct))b.classList.add('correct');
    if(j===i && String(v)!==String(correct))b.classList.add('wrong');
  });

  const ok=String(value)===String(correct);
  const box=document.getElementById('choices');
  const result=document.createElement('div');
  result.className='result '+(ok?'ok':'ng');
  result.innerHTML=(ok?'✓ 正解':'✕ 不正解')+'<br>正解：<b>'+escapeHtml(String(correct))+'</b>';
  const next=document.createElement('button');
  next.type='button';
  next.className='next';
  next.textContent=blankIndex<blanks.length-1?'次の空欄へ':'この章の結果を見る';
  next.onclick=()=>{
    if(blankIndex<blanks.length-1){blankIndex++;renderQuiz();}
    else{checked=true;showFinal();}
  };
  box.appendChild(result);
  box.appendChild(next);
}

function showFinal(){
  const q=getQuestion();
  const blanks=getBlanks(q);
  const explanations=q.explanations||[];
  let score=0;
  const rows=blanks.map((c,i)=>{
    const ok=String(answers[i])===String(c);
    if(ok)score++;
    return `<div class="result ${ok?"ok":"ng"}">
      ${i+1}. ${ok?"○":"×"}　あなたの回答：${escapeHtml(String(answers[i]??""))}<br>
      正解：<b>${escapeHtml(String(c))}</b>
      ${explanations[i]?`<br>${escapeHtml(String(explanations[i]))}`:""}
    </div>`;
  }).join("");

  app.innerHTML=`
    <div class="card">
      <div class="title">結果</div>
      <div class="sub">${score} / ${blanks.length} 正解</div>
      ${rows}
      <button class="next" onclick="openChapter(${currentPart},${currentChapter})">もう一度</button>
      <button class="next" onclick="nextChapter()">次の章へ</button>
    </div>`;
}

function nextChapter(){
  const D=getBook();
  if(book==="past350"){
    const titles=D.titles[currentPart]||[];
    if(currentChapter < titles.length-1) openChapter(currentPart,currentChapter+1); else home();
    return;
  }
  const titles=D.titles[currentPart]||[];
  if(currentChapter < titles.length-1){
    openChapter(currentPart,currentChapter+1);
  }else if(currentPart < D.titles.length-1){
    openPart(currentPart+1);
  }else{
    home();
  }
}

render();
</script>
