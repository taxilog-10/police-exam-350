うこと\nを防ぐ意味もある。\n\n⸻","blanks":["歳費","憲法"],"options":[["歳費","国民主権","最高機関","任期"],["憲法","最高機関","任期","歳費"]],"mode":"constitution"}],"21":[{"text":"国会は、\n自分たちの内部事項について一定の自主性\nを持つ。\nこれを、\n議院自律権\nという。\n\n⸻","blanks":["国会","一定の自主性"],"options":[["国会","参議院","内閣","立法裁量"],["一定の自主性","議院内閣制","プライバシ","免責特権"]],"mode":"constitution"}],"22":[{"text":"憲法58条は、\n各議院は、議員の規則その他の手続及び内部の規律に関する規則を定める\nとする。\nつまり、\n議院内部のルール\nを各議院が自ら定める。\n\n⸻","blanks":["憲法","議員の規則"],"options":[["憲法","臨時会","内閣","法律案"],["議員の規則","違憲審査","議員の任期","国権の最高機関"]],"mode":"constitution"}],"23":[{"text":"各議院は、\n自分の議員の資格について争うこと\nができる。\nただし、\n議員の資格を自由に奪える\nという意味ではない。\n憲法・法律に従って判断する必要がある。\n\n⸻","blanks":["憲法","自分の議員"],"options":[["憲法","司法権","逮捕","法律案"],["自分の議員","参議院","立法裁量","法律制定"]],"mode":"constitution"}],"24":[{"text":"議院は、\n議員を懲罰すること\nができる。\nこれは、\n国会の秩序を維持する\nため。\nただし、\n懲罰権も憲法の制約を受ける。\n\n⸻","blanks":["懲罰","国会","憲法"],"options":[["懲罰","歳費","天皇","選挙"],["国会","逮捕","裁判所","歳費"],["憲法","立法裁量","法律案","国政調査"]],"mode":"constitution"}],"25":[{"text":"国会は、\n常会・臨時会・特別会\nなどによって活動する。\n\n⸻","blanks":["特別会","臨時会","国会","常会"],"options":[["特別会","内閣","法律案","任期"],["臨時会","歳費","常会","裁判所"],["国会","権力分立","定足数","免責特権"],["常会","法律制定","任期","特別会"]],"mode":"constitution"}],"26":[{"text":"憲法52条により、\n国会の常会は、毎年一回これを召集する。\n通常国会と呼ばれる。\n主に、\n予算\n法律案\nなどについて審議する。\n\n⸻","blanks":["常会","法律案","国会","憲法","予算"],"options":[["常会","解散","選挙","特別会"],["法律案","臨時会","国会","最高機関"],["国会","臨時会","内閣","最高機関"],["憲法","選挙","逮捕","裁判所"],["予算","内閣","逮捕","任期"]],"mode":"constitution"}],"27":[{"text":"憲法53条により、\n内閣が必要と認めた場合\nまたは、\nいずれかの議院の総議員の4分の1以上の要求\nがある場合、\n内閣は臨時会の召集を決定しなければならない。\n\n⸻","blanks":["臨時会","憲法","内閣"],"options":[["臨時会","違憲審査","内閣","二院制"],["憲法","国会","臨時会","衆議院"],["内閣","参議院","予算","権力分立"]],"mode":"constitution"}],"28":[{"text":"衆議院が解散された場合、\n総選挙\nが行われる。\nその後、\n特別会\nが召集される。\nここでは、\n内閣総理大臣の指名\nなど重要な手続が行われる。\n\n⸻","blanks":["特別会","内閣総理大臣の指名","衆議院","解散","選挙"],"options":[["特別会","最高機関","憲法","権力分立"],["内閣総理大臣の指名","国民主権","職業選択の自由","国会と国民主権"],["衆議院","免責特権","立法裁量","法律制定"],["解散","議会","天皇","国政調査"],["選挙","解散","国政調査","逮捕"]],"mode":"constitution"}],"29":[{"text":"国会には、\n会期\nがある。\n会期中に、\n法律案\n予算\nなどを審議する。\n\n⸻","blanks":["法律案","国会","予算"],"options":[["法律案","定足数","議決","内閣"],["国会","特別会","逮捕","法律制定"],["予算","法律制定","定足数","条約"]],"mode":"constitution"}],"30":[{"text":"原則として、\n一つの会期で議決されなかった案件は、次の会期に当然には引き継がれない。\nこれを、\n会期不継続の原則\nという。\nただし、\n法律や国会法上の例外\nがある。\n\n⸻","blanks":["会期不継続の原則","国会","議決"],"options":[["会期不継続の原則","権力分立","議員の任期","不逮捕特権"],["国会","議決","任期","天皇"],["議決","法律案","天皇","国政調査"]],"mode":"constitution"}],"31":[{"text":"法律が成立するまでの基本的な流れは、\n法律案提出\n↓\n委員会審査\n↓\n本会議\n↓\n一方の議院で可決\n↓\n他方の議院へ\n↓\n審議\n↓\n両議院で成立\n↓\n天皇の公布\nという流れ。\n\n⸻","blanks":["法律案","天皇"],"options":[["法律案","憲法","特別会","法律制定"],["天皇","国民主権","国政調査","臨時会"]],"mode":"constitution"}],"32":[{"text":"法律案は、\n国会議員\nだけでなく、\n内閣\nも提出できる。\nつまり、\n「唯一の立法機関」だから内閣は法律案を提出できない\nというわけではない。\n\n⸻","blanks":["唯一の立法機関","法律案","国会","内閣"],"options":[["唯一の立法機関","権力分立","国会中心立法の原則","内閣総理大臣の指名"],["法律案","議会","歳費","権力分立"],["国会","内閣","権力分立","国民主権"],["内閣","予算","議決","司法権"]],"mode":"constitution"}],"33":[{"text":"国会では、\n法律案をまず委員会で詳しく審査する\n仕組みが重要。\n法律案\n↓\n委員会\n↓\n専門的・具体的審査\n↓\n本会議\n↓\n議決\n\n⸻","blanks":["法律案","国会","議決"],"options":[["法律案","懲罰","憲法","条約"],["国会","国民主権","特別会","任期"],["議決","権力分立","臨時会","歳費"]],"mode":"constitution"}],"34":[{"text":"原則として、\n各議院の議事は、出席議員の過半数\nで決する。\nただし、\n憲法・法律に特別の定め\nがある場合は別。\n\n⸻","blanks":["憲法","出席議員の過半数"],"options":[["憲法","議決","国会","立法裁量"],["出席議員の過半数","国権の最高機関","最高機関","衆議院の優越"]],"mode":"constitution"}],"35":[{"text":"各議院は、\n総議員の3分の1以上\nが出席しなければ、\n議事を開き議決することができない。\nこれを、\n定足数\nという。\n\n⸻","blanks":["定足数","議決"],"options":[["定足数","懲罰","違憲審査","法律制定"],["議決","議会","国政調査","参議院"]],"mode":"constitution"}],"36":[{"text":"通常の法律案では、\n衆議院\n↓\n可決\n↓\n参議院\n↓\n可決\n↓\n法律成立\nとなる。\nしかし、\n衆議院と参議院の意見が一致しない\n場合がある。\nそこで、\n衆議院の優越\nが設けられている。\n\n⸻","blanks":["衆議院の優越","法律案","参議院"],"options":[["衆議院の優越","財政民主主義","基本的人権","職業選択の自由"],["法律案","議会","内閣","権力分立"],["参議院","最高機関","国政調査","国民主権"]],"mode":"constitution"}],"37":[{"text":"衆議院は、\n国民の意思をより直接的に反映しやすい\nことなどから、\n一定の事項について参議院より強い権限を持つ。\n代表例は、\n•\t予算\n•\t条約\n•\t内閣総理大臣の指名\n•\t法律案\nである。\n\n⸻","blanks":["内閣総理大臣の指名","法律案","衆議院","参議院","予算"],"options":[["内閣総理大臣の指名","権力分立","国会と国民主権","議員の任期"],["法律案","法律制定","参議院","天皇"],["衆議院","憲法","参議院","議決"],["参議院","条約","天皇","法律制定"],["予算","常会","議決","議会"]],"mode":"constitution"}],"38":[{"text":"参議院が法律案を否決した場合、\n衆議院が出席議員の3分の2以上で再可決\nすれば、\n法律として成立する。\nここは重要。\n衆議院 可決\n↓\n参議院 否決\n↓\n衆議院\n出席議員の3分の2以上\n↓\n再可決\n↓\n法律成立\n\n⸻","blanks":["法律案","衆議院","参議院"],"options":[["法律案","定足数","法律制定","違憲審査"],["衆議院","違憲審査","特別会","憲法"],["参議院","任期","最高機関","立法裁量"]],"mode":"constitution"}],"39":[{"text":"予算については、\n衆議院に先に提出\nされる。\nこれを、\n予算先議権\nという。\nさらに、\n両議院で異なる議決\nとなった場合、\n憲法60条\nによって衆議院の優越が認められる。\n\n⸻","blanks":["衆議院の優越","予算先議権","憲法","議決"],"options":[["衆議院の優越","職業選択の自由","財政民主主義","国会の会期"],["予算先議権","国会の活動","国会の会期","内閣総理大臣"],["憲法","内閣","最高機関","司法権"],["議決","免責特権","臨時会","法律案"]],"mode":"constitution"}],"40":[{"text":"条約についても、\n憲法61条\nにより一定の場合に衆議院の優越が認められる。\n\n⸻","blanks":["衆議院の優越","憲法","条約"],"options":[["衆議院の優越","法律を作る場所","プライバシ","職業選択の自由"],["憲法","衆議院","議決","国会"],["条約","立法裁量","参議院","裁判所"]],"mode":"constitution"}],"41":[{"text":"内閣総理大臣は、\n国会議員の中から国会の議決で指名\nされる。\n国民\n↓\n国会議員を選挙\n↓\n国会\n↓\n内閣総理大臣を指名\n↓\n内閣\n\n⸻","blanks":["内閣総理大臣","国会","議決","選挙"],"options":[["内閣総理大臣","職業選択の自由","内閣不信任決議","最高機関"],["国会","予算","歳費","逮捕"],["議決","立法裁量","憲法","国政調査"],["選挙","憲法","定足数","懲罰"]],"mode":"constitution"}],"42":[{"text":"衆議院と参議院が異なる人物を指名した場合、\n両院協議会\nなどの手続を経ても一致しないとき、\n衆議院の議決が国会の議決となる\n場合がある。\n\n⸻","blanks":["衆議院","参議院","国会","議会","議決"],"options":[["衆議院","天皇","議会","臨時会"],["参議院","議会","衆議院","免責特権"],["国会","臨時会","逮捕","二院制"],["議会","議決","法律案","天皇"],["議決","常会","定足数","最高機関"]],"mode":"constitution"}],"43":[{"text":"日本は、\n議院内閣制\nを採用している。\n議院内閣制とは、\n内閣が国会、とりわけ衆議院との信頼関係を基礎として成立・存立する仕組み\nである。\n\n⸻","blanks":["議院内閣制","衆議院","国会"],"options":[["議院内閣制","予算先議権","唯一の立法機関","免責特権"],["衆議院","最高機関","国政調査","権力分立"],["国会","定足数","臨時会","法律案"]],"mode":"constitution"}],"44":[{"text":"国民\n↓\n国会議員を選ぶ\n↓\n国会\n↓\n内閣総理大臣を指名\n↓\n内閣\n↓\n行政\nそして、\n衆議院の信任\nと\n内閣の責任\nが結びつく。\n\n⸻","blanks":["内閣総理大臣","衆議院","国会"],"options":[["内閣総理大臣","立法裁量","国会と内閣の関係","不逮捕特権"],["衆議院","免責特権","国政調査","予算"],["国会","歳費","解散","司法権"]],"mode":"constitution"}],"45":[{"text":"衆議院は、\n内閣不信任決議\nをすることができる。\nこれに対して内閣は、\n総辞職\nまたは\n衆議院解散\nを選択する。\n\n⸻","blanks":["内閣不信任決議","衆議院","解散"],"options":[["内閣不信任決議","予算先議権","内閣総理大臣の指名","国民主権"],["衆議院","常会","権力分立","天皇"],["解散","国政調査","参議院","国民主権"]],"mode":"constitution"}],"46":[{"text":"衆議院\n↓\n内閣不信任決議\n↓\n内閣\n├─ 10日以内に衆議院解散\n│       ↓\n│      総選挙\n│\n└─ 解散しない\n↓\n総辞職\n\n⸻","blanks":["内閣不信任決議","衆議院","解散","選挙"],"options":[["内閣不信任決議","自分の議員","国会と内閣の関係","国政調査"],["衆議院","裁判所","権力分立","解散"],["解散","立法裁量","国会","常会"],["選挙","国民主権","国会","法律案"]],"mode":"constitution"}],"47":[{"text":"憲法62条は、\n両議院は、各々国政に関する調査を行い、これに関して証人の出頭及び証言並びに記録の提出を要求することができる\nと定める。\nこれが、\n国政調査権\nである。\n\n⸻","blanks":["国政調査","憲法"],"options":[["国政調査","議員の任期","立法裁量","裁判所"],["憲法","国会","逮捕","参議院"]],"mode":"constitution"}],"48":[{"text":"国会は、\n法律を作る\nだけではない。\n政府の活動を、\n監視・チェック\nする役割も持つ。\n国会\n↓\n行政を調査\n↓\n問題点を発見\n↓\n政治的責任を追及\n↓\n法律・予算等に反映\n\n⸻","blanks":["国会","予算"],"options":[["国会","条約","予算","議決"],["予算","懲罰","選挙","憲法"]],"mode":"constitution"}],"49":[{"text":"国政調査権も、\n無制限ではない。\n憲法上の権利、\n裁判所の独立\n個人のプライバシー\nなどとの調整が必要になる。\n\n⸻","blanks":["プライバシ","国政調査","裁判所","憲法"],"options":[["プライバシ","参議院","自分の議員","議員の任期"],["国政調査","プライバシ","二院制","議員の規則"],["裁判所","権力分立","国民主権","定足数"],["憲法","天皇","常会","衆議院"]],"mode":"constitution"}],"50":[{"text":"国家活動には、\nお金\nが必要。\nそこで、\n予算\nについて国会が重要な権限を持つ。\nこれは、\n国民の税金をどのように使うか\nという問題だからである。\n\n⸻","blanks":["国会","予算"],"options":[["国会","議決","最高機関","参議院"],["予算","議会","任期","免責特権"]],"mode":"constitution"}],"51":[{"text":"財政について重要なのが、\n財政民主主義\nである。\nつまり、\n国民の代表機関である国会が、国家財政をコントロールする\nという考え方。\n\n⸻","blanks":["財政民主主義","国会"],"options":[["財政民主主義","不逮捕特権","内閣不信任決議","国会の会期"],["国会","免責特権","権力分立","国政調査"]],"mode":"constitution"}],"52":[{"text":"国会の最も基本的な仕事は、\n法律を制定すること\nである。\nただし、国会の役割は法律制定だけではない。\n国会\n│\n├─ 法律制定\n├─ 予算議決\n├─ 条約承認\n├─ 内閣総理大臣指名\n├─ 国政調査\n└─ 内閣の政治的コントロール\n\n⸻","blanks":["内閣総理大臣","国政調査","法律制定","国会","議決"],"options":[["内閣総理大臣","国会と国民主権","立法裁量","不逮捕特権"],["国政調査","プライバシ","予算","立法裁量"],["法律制定","臨時会","最高機関","国会の会期"],["国会","逮捕","懲罰","内閣"],["議決","常会","二院制","裁判所"]],"mode":"constitution"}],"53":[{"text":"国会と内閣は、\n完全に独立しているわけでも、\n完全な上下関係でもない。\n日本では、\n権力分立＋議院内閣制\nという構造になっている。\n国会\n↕\n内閣\n相互に関係しながら、\n権力をコントロールする。\n\n⸻","blanks":["議院内閣制","権力分立","国会"],"options":[["議院内閣制","自分の議員","権力分立","二院制"],["権力分立","議員の任期","プライバシ","基本的人権"],["国会","解散","司法権","定足数"]],"mode":"constitution"}],"54":[{"text":"裁判所は、\n法律を解釈・適用\nする。\nさらに、\n法律が憲法に適合するか\nを審査できる。\nつまり、\n国会\n↓\n法律を制定\n↓\n裁判所\n↓\n憲法適合性を審査\nという関係になる。\n\n⸻","blanks":["裁判所","国会","憲法"],"options":[["裁判所","内閣","定足数","立法裁量"],["国会","免責特権","議会","懲罰"],["憲法","選挙","司法権","免責特権"]],"mode":"constitution"}],"55":[{"text":"国会には、\n社会政策や制度設計について一定の裁量\nが認められる。\nしかし、\n憲法に反する法律\nを作ることはできない。\nつまり、\n国会も憲法に拘束される。\n\n⸻","blanks":["国会","憲法"],"options":[["国会","国民主権","臨時会","定足数"],["憲法","二院制","定足数","任期"]],"mode":"constitution"}],"56":[{"text":"国会が法律を制定した。\n↓\nその法律が、\n基本的人権を過度に制約\nしている。\n↓\n裁判所が、\n憲法に違反すると判断\nすることがある。\nこれが、\n違憲審査\nである。\n\n⸻","blanks":["基本的人権","違憲審査","裁判所","国会","憲法"],"options":[["基本的人権","国政調査","最高機関","内閣不信任決議"],["違憲審査","議員の規則","議員の任期","参議院"],["裁判所","参議院","特別会","歳費"],["国会","議会","国民主権","任期"],["憲法","懲罰","二院制","立法裁量"]],"mode":"constitution"}],"57":[{"text":"国会は、\n基本的人権を保障する法律\nを作ることもできる。\nしかし同時に、\n人権を制約する法律\nを作ることもある。\nしたがって、\n国会による立法そのものが憲法によって制限されている。\n\n⸻","blanks":["基本的人権","国会","憲法"],"options":[["基本的人権","国会の会期","不逮捕特権","議員の規則"],["国会","歳費","衆議院","裁判所"],["憲法","解散","国政調査","議会"]],"mode":"constitution"}],"58":[{"text":"国会の本質は、\n「法律を作る場所」\nだけではない。\n本質的には、\n国民の意思を政治に反映し、国家権力をコントロールする代表機関\nと理解する。\n\n⸻","blanks":["法律を作る場所","国会"],"options":[["法律を作る場所","出席議員の過半数","内閣不信任決議","予算先議権"],["国会","天皇","立法裁量","歳費"]],"mode":"constitution"}],"59":[{"text":"国会が、\nAの職業を禁止する法律\nを制定した。\n↓\nAの職業選択の自由\n↓\n憲法22条\n↓\n国会の立法裁量\n↓\n規制目的\n↓\n規制手段\n↓\n合理性・必要性\n↓\n違憲審査\nという流れになる。\n\n⸻","blanks":["職業選択の自由","違憲審査","立法裁量","国会","憲法"],"options":[["職業選択の自由","財政民主主義","国会中心立法の原則","衆議院の優越"],["違憲審査","臨時会","議院内閣制","国会の会期"],["立法裁量","法律案","議員の規則","予算"],["国会","懲罰","法律制定","国政調査"],["憲法","国会","権力分立","特別会"]],"mode":"constitution"}],"60":[{"text":"国会が、\n行政機関の不正疑惑\nについて調査する。\n↓\n62条\n↓\n国政調査権\n↓\n証人・資料等\n↓\nただし、\n人権・司法権との関係\nなどに注意。\n\n⸻","blanks":["国政調査","司法権","国会"],"options":[["国政調査","プライバシ","予算","衆議院"],["司法権","法律制定","懲罰","違憲審査"],["国会","法律制定","裁判所","特別会"]],"mode":"constitution"}],"61":[{"text":"衆議院が、\n内閣不信任決議\nを行った。\n↓\n内閣は、\n総辞職\nまたは\n衆議院解散\nという憲法69条上の対応をとることになる。\n\n⸻","blanks":["内閣不信任決議","衆議院","憲法","解散"],"options":[["内閣不信任決議","職業選択の自由","国会の活動","国民主権"],["衆議院","参議院","議会","定足数"],["憲法","内閣","二院制","解散"],["解散","議会","法律制定","懲罰"]],"mode":"constitution"}],"62":[{"text":"法律案\n↓\n衆議院\n↓\n可決\n↓\n参議院\n↓\n否決\n↓\n衆議院\n↓\n出席議員3分の2以上で再可決\n↓\n法律成立\n\n⸻","blanks":["法律案","衆議院","参議院"],"options":[["法律案","違憲審査","懲罰","解散"],["衆議院","特別会","法律案","解散"],["参議院","任期","二院制","権力分立"]],"mode":"constitution"}],"63":[{"text":"国民\n│\n選挙\n↓\n国会\n┌──────────────┐\n│              │\n衆議院          参議院\n│              │\n└──────┬───────┘\n│\n┌────────────┼────────────┐\n↓            ↓            ↓\n立法          予算         調査\n│\n↓\n法律\n│\n↓\n内閣・行政\n│\n↓\n裁判所\n│\n↓\n違憲審査\n\n⸻","blanks":["違憲審査","裁判所","衆議院","参議院","国会"],"options":[["違憲審査","法律制定","定足数","国政調査"],["裁判所","違憲審査","解散","定足数"],["衆議院","立法裁量","議決","司法権"],["参議院","法律制定","二院制","司法権"],["国会","内閣","憲法","国政調査"]],"mode":"constitution"}],"64":[{"text":"憲法\n│\n┌───────┼───────┐\n↓       ↓       ↓\n国会     内閣    裁判所\n立法      行政     司法\n↕       ↕       ↕\n└────相互抑制────┘\n国会だけが強いのではない。\nそれぞれの国家機関が、\n互いに権力を制限する\nことで、\n権力の集中を防ぐ。\n\n⸻","blanks":["裁判所","国会","憲法","内閣"],"options":[["裁判所","任期","解散","憲法"],["国会","解散","法律案","最高機関"],["憲法","内閣","条約","臨時会"],["内閣","予算","権力分立","任期"]],"mode":"constitution"}],"65":[{"text":"国会を一言で表すなら、\n国民の代表者によって構成され、法律・予算等を通じて国家意思を形成し、行政を監視する機関\nである。\n\n⸻","blanks":["国会","予算"],"options":[["国会","憲法","特別会","条約"],["予算","国政調査","常会","臨時会"]],"mode":"constitution"}],"66":[{"text":"① 国民主権\n↓\n② 代表民主制\n↓\n③ 国会\n↓\n④ 立法・財政・調査\n↓\n⑤ 内閣・裁判所との相互抑制\n\n⸻","blanks":["代表民主制","国民主権","裁判所","国会","内閣"],"options":[["代表民主制","自分の議員","最高機関","定足数"],["国民主権","予算","代表民主制","免責特権"],["裁判所","二院制","国会","任期"],["国会","免責特権","国民主権","解散"],["内閣","立法裁量","常会","予算"]],"mode":"constitution"}],"67":[{"text":"基本\n1.\t国会とは何か。\n2.\t憲法41条は何を定めるか。\n3.\t「国権の最高機関」とは何を意味するか。\n4.\t「唯一の立法機関」とは何か。\n5.\t国会と国民主権はどうつながるか。\n6.\t二院制とは何か。\n7.\tなぜ二院制を採用しているのか。\n衆議院・参議院\n8.\t衆議院の任期は？\n9.\t参議院の任期は？\n10.\t衆議院と参議院の最大の違いは？\n11.\tなぜ衆議院には解散があるのか。\n12.\tなぜ参議院は解散されないのか。\n13.\t衆議院の優越とは何か。\n議員\n14.\t不逮捕特権とは？\n15.\t免責特権とは？\n16.\tなぜ議員に特権が認められるのか。\n17.\t議院自律権とは？\n国会活動\n18.\t常会とは？\n19.\t臨時会とは？\n20.\t特別会とは？\n21.\t定足数とは？\n22.\t議決の原則は？\n23.\t法律案はどのように成立するか。\n権限\n24.\t国会の代表的権限を挙げよ。\n25.\t国政調査権とは？\n26.\t予算について国会はどのような権限を持つか。\n27.\t内閣総理大臣は誰が指名するか。\n28.\t内閣不信任決議とは？\n29.\t衆議院の優越が認められる代表例は？\n総合\n30.\t国会と内閣の関係を説明せよ。\n31.\t国会と裁判所の関係を説明せよ。\n32.\t国会も憲法に拘束される理由は？\n33.\t国会が人権を制限する法律を作った場合、どう考えるか。\n34.\t国政調査権と人権の関係は？\n35.\t国会と三権分立の関係を説明せよ。\n36.\t国民主権→選挙→国会→法律という流れを説明せよ。\n\n⸻","blanks":["国権の最高機関","唯一の立法機関","国会と内閣の関係","内閣不信任決議","国会と国民主権"],"options":[["国権の最高機関","一定の自主性","国会と国民主権","議院内閣制"],["唯一の立法機関","議員の規則","最高機関","国会と国民主権"],["国会と内閣の関係","免責特権","出席議員の過半数","唯一の立法機関"],["内閣不信任決議","国会の活動","最高機関","自分の議員"],["国会と国民主権","一定の自主性","予算先議権","議員の規則"]],"mode":"constitution"}],"68":[{"text":"国会を理解するためには、\n「法律を作る場所」\nだけで終わらせない。\n全体は、\n国民主権\n↓\n国民が選挙\n↓\n国会議員\n↓\n国会\n↓\n法律・予算・条約等\n↓\n国家意思を形成\n↓\n内閣が行政を行う\n↓\n国会が行政を監視\n↓\n裁判所が法を適用\n↓\n必要に応じて違憲審査\nという流れになる。\nつまり、\n国会は国民主権を具体化する代表機関であり、立法・財政・国政調査などを通じて国家権力をコントロールする中心的機関\nである。\nそして最も重要なのは、\n国会自身も憲法に拘束される\nということ。\n国民\n↓\n国民主権\n↓\n国会\n↓\n法律\n↓\nしかし\n↓\n憲法に違反する法律は許されない\n↓\n違憲審査\nこれが、\n立憲主義＋国民主権＋権力分立\nを統合した国会論の核心である。","blanks":["法律を作る場所","国政調査","違憲審査","国民主権","権力分立"],"options":[["法律を作る場所","予算先議権","会期不継続の原則","国会の活動"],["国政調査","議員の規則","臨時会","違憲審査"],["違憲審査","二院制","国政調査","衆議院"],["国民主権","議院内閣制","不逮捕特権","定足数"],["権力分立","議員の規則","衆議院","予算先議権"]],"mode":"constitution"}]},"8":{"1":[{"text":"内閣は、\n行政権を担当する国家機関\nである。\n憲法65条は、\n行政権は、内閣に属する。\nと定めている。\nつまり、\n国家作用\n│\n├─ 立法\n│   ↓\n│  国会\n│\n├─ 行政\n│   ↓\n│  内閣\n│\n└─ 司法\n↓\n裁判所\nという三権分立の中で、\n内閣＝行政\nと考える。\n\n⸻","blanks":["行政権","裁判所","国会","憲法","内閣"],"options":[["行政権","行政事件","解散","選挙"],["裁判所","権力分立","国務大臣","条約"],["国会","選挙","国務大臣","上司"],["憲法","予算","行政立法","国務大臣"],["内閣","上司","財政","外交"]],"mode":"constitution"}],"2":[{"text":"行政とは、簡単にいえば、\n法律を実際の社会で実現する国家活動\nである。\n例えば、\n•\t道路・公共施設の整備\n•\t社会保障\n•\t警察行政\n•\t税金の徴収\n•\t外交\n•\t許認可\n•\t各種行政サービス\nなど。\n\n⸻","blanks":["外交","公共施設の整備"],"options":[["外交","上司","司法権","選挙"],["公共施設の整備","行政事件","表現の自由","内閣不信任決議"]],"mode":"constitution"}],"3":[{"text":"行政権とは、\n立法作用・司法作用以外の国家作用\nと単純に理解するだけでは不十分。\n現代国家では、\n国民生活に関係する非常に広い活動\nを行政が行っている。\nしたがって、\n行政権＝法律を執行するだけ\nと考えないことが重要。\n\n⸻","blanks":["行政権","司法作用以外の国家作用"],"options":[["行政権","罷免","政令","権力分立"],["司法作用以外の国家作用","法律の根拠","内閣総理大臣","公共施設の整備"]],"mode":"constitution"}],"4":[{"text":"憲法66条1項は、\n内閣は、法律の定めるところにより、その首長たる内閣総理大臣及びその他の国務大臣で組織する。\nと定める。\nつまり、\n内閣\n│\n├─ 内閣総理大臣\n│\n└─ 国務大臣\nという構造。\n\n⸻","blanks":["内閣総理大臣","国務大臣","憲法","首長"],"options":[["内閣総理大臣","衆議院の優越","権力分立","行政事件"],["国務大臣","内閣","国会","司法権"],["憲法","議会","総辞職","行政立法"],["首長","国政調査","予算","外交"]],"mode":"constitution"}],"5":[{"text":"内閣総理大臣は、\n内閣の首長\nである。\n内閣を代表し、\n行政各部を指揮監督する\n重要な権限を持つ。\n\n⸻","blanks":["内閣総理大臣","首長"],"options":[["内閣総理大臣","司法権","人身の自由","内閣と国会の関係"],["首長","恩赦","選挙","政令"]],"mode":"constitution"}],"6":[{"text":"内閣総理大臣は、\n国会議員の中から国会の議決で指名\nされる。\nその後、\n天皇が任命する。\n国民\n↓\n選挙\n↓\n国会議員\n↓\n国会\n↓\n内閣総理大臣を指名\n↓\n天皇が任命\n↓\n内閣総理大臣\n\n⸻","blanks":["内閣総理大臣","国会","天皇","議決","選挙"],"options":[["内閣総理大臣","内閣不信任決議","法律の根拠","内閣と国会の関係"],["国会","上司","行政立法","閣議"],["天皇","議会","恩赦","議決"],["議決","議会","解散","恩赦"],["選挙","国会","罷免","財政"]],"mode":"constitution"}],"7":[{"text":"両議院で指名が一致しない場合、\n両院協議会\nなどの手続を経ても一致しなければ、\n衆議院の議決が国会の議決となる\n場合がある。\nこれは、\n衆議院の優越\nの一つ。\n\n⸻","blanks":["指名が一致しない場合","衆議院の優越","国会","議会","議決"],"options":[["指名が一致しない場合","内閣不信任","権力分立","議院内閣制"],["衆議院の優越","内閣総理大臣","行政処分","内閣不信任"],["国会","行政立法","衆議院","議決"],["議会","閣議","罷免","国家賠償"],["議決","衆議院","罷免","行政事件"]],"mode":"constitution"}],"8":[{"text":"国務大臣は、\n内閣を構成する大臣\nである。\n内閣総理大臣が任命する。\nただし、\n国務大臣の過半数は国会議員の中から選ばなければならない。\n\n⸻","blanks":["国務大臣","内閣総理大臣","国会"],"options":[["国務大臣","行政処分","表現の自由","予算"],["内閣総理大臣","表現の自由","天皇の国事行為","内閣不信任決議"],["国会","解散","憲法","罷免"]],"mode":"constitution"}],"9":[{"text":"内閣総理大臣は、\n国務大臣を任意に罷免\nすることができる。\nこれは、\n内閣総理大臣が内閣を統一的に指揮する\nために重要。\n\n⸻","blanks":["内閣総理大臣","国務大臣","罷免"],"options":[["内閣総理大臣","行政処分","行政権","行政法上の行政行為"],["国務大臣","法律の根拠","上司","内閣"],["罷免","国家賠償","刑罰","衆議院"]],"mode":"constitution"}],"10":[{"text":"内閣は、\n複数の大臣がバラバラに活動する組織\nではない。\n内閣総理大臣を中心に、\n一体として行政を運営する\nことが重要。\n\n⸻","blanks":["内閣総理大臣","複数の大臣"],"options":[["内閣総理大臣","内閣不信任決議","公共施設の整備","内閣と国会の関係"],["複数の大臣","国家賠償","内閣と国会の関係","公共施設の整備"]],"mode":"constitution"}],"11":[{"text":"日本の政治制度の核心が、\n議院内閣制\nである。\n議院内閣制とは、\n内閣が国会の信任を基礎として成立・存立する制度\nである。\n\n⸻","blanks":["議院内閣制","国会"],"options":[["議院内閣制","内閣総理大臣","権力分立","公共施設の整備"],["国会","外交","刑罰","権力分立"]],"mode":"constitution"}],"12":[{"text":"国民\n↓\n選挙\n↓\n国会\n↓\n内閣総理大臣を指名\n↓\n内閣\n↓\n行政\nさらに、\n衆議院\n↓\n内閣不信任\n↓\n内閣\n├─ 総辞職\n└─ 衆議院解散\nという関係がある。\n\n⸻","blanks":["内閣総理大臣","内閣不信任","衆議院","国会","解散"],"options":[["内閣総理大臣","行政権","内閣不信任決議","内閣総理大臣の指名"],["内閣不信任","複数の大臣","裁判所","刑罰"],["衆議院","刑罰","解散","裁判所"],["国会","恩赦","行政処分","総辞職"],["解散","国家賠償","上司","内閣"]],"mode":"constitution"}],"13":[{"text":"国会と内閣を完全に分離すると、\n政治の意思決定が対立して動かなくなる\n可能性がある。\nそこで、\n国会と内閣を一定程度結びつける。\nただし、\n国会が内閣を監視する\nことで権力集中も防ぐ。\n\n⸻","blanks":["国会","内閣"],"options":[["国会","権力分立","天皇","衆議院"],["内閣","上司","総辞職","選挙"]],"mode":"constitution"}],"14":[{"text":"憲法66条3項は、\n内閣は、行政権の行使について、国会に対し連帯して責任を負う。\nとする。\nつまり、\n内閣全体として国会に責任を負う。\n\n⸻","blanks":["行政権","国会","憲法","内閣"],"options":[["行政権","国政調査","政令","外交"],["国会","司法権","行政処分","政令"],["憲法","行政権","選挙","裁判所"],["内閣","司法権","解散","国会"]],"mode":"constitution"}],"15":[{"text":"憲法72条は、\n内閣総理大臣が内閣を代表して議案を国会に提出し、一般国務及び外交関係について国会に報告し、行政各部を指揮監督する\nことを定める。\nここから、\n内閣総理大臣の行政統括権\nを理解する。\n\n⸻","blanks":["内閣総理大臣","国会","憲法","外交"],"options":[["内閣総理大臣","国務大臣","天皇の国事行為","人身の自由"],["国会","権力分立","予算","議会"],["憲法","財政","政令","権力分立"],["外交","議決","国政調査","上司"]],"mode":"constitution"}],"16":[{"text":"内閣の意思決定は、\n閣議\nによって行われる。\n閣議とは、\n内閣総理大臣と国務大臣による内閣の意思決定の場\nである。\n\n⸻","blanks":["閣議","内閣総理大臣","国務大臣"],"options":[["閣議","天皇","行政処分","恩赦"],["内閣総理大臣","内閣不信任決議","総辞職","行政法上の行政行為"],["国務大臣","複数の大臣","国会","行政処分"]],"mode":"constitution"}],"17":[{"text":"日本の閣議は、\n全員一致による意思決定\nが基本とされている。\nしたがって、\n総理\n＋\n各国務大臣\n↓\n閣議\n↓\n内閣として意思決定\nという仕組み。\n\n⸻","blanks":["国務大臣","閣議","内閣"],"options":[["国務大臣","国民の権利","刑罰","条約"],["閣議","国政調査","議決","司法権"],["内閣","予算","上司","国家賠償"]],"mode":"constitution"}],"18":[{"text":"憲法73条は、\n内閣の事務\nを定める。\n代表的には、\n•\t法律を誠実に執行\n•\t外交関係を処理\n•\t条約を締結\n•\t予算を作成\n•\t政令を制定\n•\t恩赦を決定\nなど。\n\n⸻","blanks":["憲法","政令","予算","内閣","恩赦"],"options":[["憲法","選挙","司法権","行政処分"],["政令","内閣","国政調査","選挙"],["予算","議会","罷免","上司"],["内閣","政令","権力分立","首長"],["恩赦","議会","国務大臣","行政立法"]],"mode":"constitution"}],"19":[{"text":"内閣は、\n国会が制定した法律\nを誠実に執行しなければならない。\nつまり、\n国会\n↓\n法律\n↓\n内閣\n↓\n執行\n↓\n国民生活\nという関係。\n\n⸻","blanks":["国会","内閣"],"options":[["国会","天皇","行政立法","司法権"],["内閣","財政","憲法","行政権"]],"mode":"constitution"}],"20":[{"text":"内閣は、\n政令\nを制定することができる。\n政令は、\n法律を実施するため\nなどに制定される。\nただし、\n法律に反する政令を作ることはできない。\n\n⸻","blanks":["政令","内閣"],"options":[["政令","憲法","予算","議決"],["内閣","国会","刑罰","衆議院"]],"mode":"constitution"}],"21":[{"text":"憲法\n↓\n法律\n↓\n政令\n↓\n行政上の具体的活動\nという階層で理解するとよい。\nしたがって、\n政令は法律より下位\nである。\n\n⸻","blanks":["憲法","政令"],"options":[["憲法","財政","国政調査","行政事件"],["政令","憲法","条約","行政事件"]],"mode":"constitution"}],"22":[{"text":"法律が、\n詳細な事項を政令などに委ねる\nことがある。\nこれを、\n委任\nという。\nただし、\n国会が重要事項をすべて行政に丸投げ\nすることは許されない。\n\n⸻","blanks":["国会","政令"],"options":[["国会","条約","財政","解散"],["政令","解散","議決","内閣"]],"mode":"constitution"}],"23":[{"text":"行政が作る一般的・抽象的な規範を、\n行政立法\nという。\n行政立法\n│\n├─ 政令\n├─ 省令\n└─ その他の行政上の規範\n行政法で学んだ、\n行政立法\nとここでつながる。\n\n⸻","blanks":["行政立法","政令"],"options":[["行政立法","恩赦","国会","総辞職"],["政令","恩赦","司法権","罷免"]],"mode":"constitution"}],"24":[{"text":"内閣は、\n条約を締結する。\nただし、\n事前または場合によっては事後に国会の承認\nが必要。\nつまり、\n内閣\n↓\n条約締結\n↓\n国会の承認\nという関係。\n\n⸻","blanks":["条約","国会","内閣"],"options":[["条約","行政権","選挙","天皇"],["国会","国務大臣","外交","憲法"],["内閣","議決","裁判所","議会"]],"mode":"constitution"}],"25":[{"text":"外交関係の処理も、\n内閣の重要な権限。\n例えば、\n•\t外交交渉\n•\t外国との関係\n•\t条約\n•\t外交政策\nなど。\n\n⸻","blanks":["外交","内閣","条約"],"options":[["外交","条約","行政権","刑罰"],["内閣","解散","権力分立","政令"],["条約","刑罰","閣議","財政"]],"mode":"constitution"}],"26":[{"text":"内閣は、\n予算を作成して国会に提出\nする。\n国会が、\n予算を議決\nする。\n内閣\n↓\n予算案作成\n↓\n国会\n↓\n審議・議決\n↓\n国家財政\n\n⸻","blanks":["予算","国会","議決","内閣","財政"],"options":[["予算","司法権","裁判所","国政調査"],["国会","司法権","財政","首長"],["議決","行政権","司法権","解散"],["内閣","罷免","国会","司法権"],["財政","憲法","権力分立","恩赦"]],"mode":"constitution"}],"27":[{"text":"ここでも、\n権力分立\nが働いている。\n内閣だけで、\n自由に国家予算を決める\nわけではない。\n国会が、\n財政を民主的にコントロール\nする。\n\n⸻","blanks":["権力分立","国会","予算","内閣","財政"],"options":[["権力分立","刑罰","国務大臣","国政調査"],["国会","外交","罷免","行政立法"],["予算","上司","政令","解散"],["内閣","国務大臣","恩赦","司法権"],["財政","国会","権力分立","予算"]],"mode":"constitution"}],"28":[{"text":"内閣には、\n恩赦の決定\nに関する権限がある。\n恩赦とは、\n刑罰について一定の法的効果を与える制度\nである。\nただし、\n恩赦は内閣の専断的な自由裁量というだけではなく、憲法・法律上の制度として行われる。\n\n⸻","blanks":["恩赦","憲法","刑罰","内閣"],"options":[["恩赦","議会","権力分立","議決"],["憲法","議会","衆議院","首長"],["刑罰","上司","議会","政令"],["内閣","条約","閣議","行政事件"]],"mode":"constitution"}],"29":[{"text":"天皇は、\n国政に関する権能を有しない。\n内閣の助言と承認に基づいて、\n国事行為\nを行う。\nしたがって、\n内閣\n↓\n助言・承認\n↓\n天皇\n↓\n国事行為\nとなる。\n\n⸻","blanks":["天皇","内閣"],"options":[["天皇","行政事件","解散","外交"],["内閣","国会","衆議院","予算"]],"mode":"constitution"}],"30":[{"text":"衆議院解散は、\n議院内閣制\nを理解するうえで重要。\n憲法69条では、\n衆議院で不信任決議が可決\nまたは\n信任決議が否決\nされた場合、\n内閣は10日以内に衆議院を解散しない限り総辞職\nしなければならない。\n\n⸻","blanks":["議院内閣制","衆議院","憲法","解散"],"options":[["議院内閣制","衆議院の優越","総辞職","行政事件"],["衆議院","上司","国家賠償","内閣"],["憲法","裁判所","選挙","国務大臣"],["解散","罷免","予算","首長"]],"mode":"constitution"}],"31":[{"text":"実際の日本政治では、\n憲法7条3号\nに基づく天皇の国事行為としての衆議院解散\nも重要な論点となる。\nただし、\n天皇自身が政治的判断をして解散する\nわけではない。\n\n⸻","blanks":["天皇の国事行為","衆議院","憲法","解散"],"options":[["天皇の国事行為","権力分立","総辞職","内閣不信任"],["衆議院","総辞職","内閣","上司"],["憲法","選挙","議決","行政事件"],["解散","国会","行政事件","議会"]],"mode":"constitution"}],"32":[{"text":"内閣は、\n一定の場合に総辞職\nしなければならない。\n代表例は、\n① 内閣不信任への対応\n不信任\n↓\n解散しない\n↓\n総辞職\n② 内閣総理大臣が欠けた場合\n③ 衆議院議員総選挙後に初めて国会が召集された場合\n\n⸻","blanks":["内閣総理大臣","内閣不信任","衆議院","国会","解散"],"options":[["内閣総理大臣","公共施設の整備","内閣総理大臣の指名","複数の大臣"],["内閣不信任","衆議院","予算","人身の自由"],["衆議院","国会","議会","行政事件"],["国会","司法権","天皇","内閣"],["解散","議決","国務大臣","行政立法"]],"mode":"constitution"}],"33":[{"text":"総辞職した後も、\n直ちに行政が停止する\nわけではない。\n新しい内閣総理大臣が任命されるまで、\n引き続きその職務を行う。\n\n⸻","blanks":["内閣総理大臣","総辞職"],"options":[["内閣総理大臣","内閣不信任決議","総辞職","公共施設の整備"],["総辞職","国会","上司","解散"]],"mode":"constitution"}],"34":[{"text":"国会\n│\n├─ 内閣総理大臣を指名\n│\n├─ 予算を議決\n│\n├─ 法律を制定\n│\n├─ 条約を承認\n│\n└─ 内閣を監視\n↑\n│\n内閣\n│\n├─ 法律を執行\n├─ 予算を作成\n├─ 政令を制定\n└─ 行政を統括\n\n⸻","blanks":["内閣総理大臣","国会","政令","議決","予算"],"options":[["内閣総理大臣","法律の根拠","表現の自由","内閣と国会の関係"],["国会","外交","恩赦","行政立法"],["政令","国会","総辞職","外交"],["議決","天皇","国政調査","総辞職"],["予算","外交","議決","行政処分"]],"mode":"constitution"}],"35":[{"text":"重要なのは、\n国会が内閣の「上司」\nという単純な関係ではないこと。\n日本では、\n議院内閣制＋権力分立\nによって、\n相互に関係しながら権力をコントロールする。\n\n⸻","blanks":["上司","議院内閣制","権力分立","国会"],"options":[["上司","裁判所","議会","選挙"],["議院内閣制","権力分立","天皇の国事行為","行政処分"],["権力分立","内閣総理大臣","法律の根拠","外交"],["国会","財政","政令","衆議院"]],"mode":"constitution"}],"36":[{"text":"内閣は、\n行政権を担当する。\n裁判所は、\n司法権を担当する。\nしたがって、\n行政と司法は別の国家作用。\n行政が行った行為について、\n裁判所が違法性を審査\nする場合もある。\n\n⸻","blanks":["行政権","裁判所","司法権","内閣"],"options":[["行政権","条約","国会","外交"],["裁判所","外交","議決","恩赦"],["司法権","閣議","政令","国家賠償"],["内閣","罷免","司法権","国務大臣"]],"mode":"constitution"}],"37":[{"text":"例えば、\n行政庁がAに営業許可を与えなかった。\n↓\nAが争う。\n↓\n行政事件訴訟\n↓\n裁判所\n↓\n行政処分が適法か審査。\nこれは、\n憲法上の司法権\nと\n行政法上の行政救済\nがつながる部分。\n\n⸻","blanks":["行政処分","行政事件","裁判所","司法権","憲法"],"options":[["行政処分","議院内閣制","司法権","内閣総理大臣"],["行政事件","司法権","上司","法律の根拠"],["裁判所","首長","行政立法","司法権"],["司法権","行政立法","予算","恩赦"],["憲法","条約","行政立法","閣議"]],"mode":"constitution"}],"38":[{"text":"行政活動も、\n憲法に従わなければならない。\n例えば、\n行政が表現活動を制限する\n↓\n表現の自由\n行政が職業活動を制限する\n↓\n職業選択の自由\n行政が身体を拘束する\n↓\n人身の自由\nというように、\n行政活動と人権保障\nは直接つながる。\n\n⸻","blanks":["職業選択の自由","表現の自由","人身の自由","憲法"],"options":[["職業選択の自由","内閣総理大臣","行政法上の行政行為","複数の大臣"],["表現の自由","公共施設の整備","行政権","内閣総理大臣"],["人身の自由","上司","議院内閣制","内閣と国会の関係"],["憲法","国務大臣","政令","国政調査"]],"mode":"constitution"}],"39":[{"text":"内閣だからといって、\n何でもできる\nわけではない。\n内閣\n↓\n行政権\n↓\n憲法\n↓\n法律\n↓\n行政活動\nという制約を受ける。\n\n⸻","blanks":["行政権","憲法","内閣"],"options":[["行政権","財政","予算","行政事件"],["憲法","条約","行政立法","罷免"],["内閣","天皇","解散","憲法"]],"mode":"constitution"}],"40":[{"text":"行政活動には、\n法律による行政\nという基本原理がある。\n行政は、\n法律に基づいて\n行われる必要がある。\n特に、\n国民の権利・自由を制約する場合\nには法律の根拠が重要になる。\n\n⸻","blanks":["国民の権利","法律の根拠"],"options":[["国民の権利","予算","内閣と国会の関係","内閣総理大臣"],["法律の根拠","行政処分","表現の自由","権力分立"]],"mode":"constitution"}],"41":[{"text":"ここで行政法と完全につながる。\n憲法65条\n行政権＝内閣\n↓\n行政組織\n↓\n行政機関\n↓\n行政行為\n↓\n行政指導\n↓\n行政計画\n↓\n行政手続\n↓\n行政救済\nつまり、\n行政法は「憲法上の行政権が、現実にどう動くのか」を具体化する法分野\nと考えることができる。\n\n⸻","blanks":["憲法上の行政権が、現実にどう動くのか","内閣"],"options":[["憲法上の行政権が、現実にどう動くのか","国政調査","公共施設の整備","法律による行政の原理"],["内閣","外交","選挙","権力分立"]],"mode":"constitution"}],"42":[{"text":"内閣\n│\n├─ 行政権\n│\n├─ 法律の執行\n│\n├─ 外交\n│\n├─ 条約\n│\n├─ 予算\n│\n├─ 政令\n│\n├─ 恩赦\n│\n└─ 行政各部の統括\n\n⸻","blanks":["行政権","政令","予算","内閣","恩赦"],"options":[["行政権","罷免","予算","条約"],["政令","罷免","権力分立","予算"],["予算","解散","政令","国務大臣"],["内閣","政令","予算","行政権"],["恩赦","上司","裁判所","総辞職"]],"mode":"constitution"}],"43":[{"text":"国会が法律を制定。\n↓\n内閣が政令を制定。\n↓\n政令が法律の内容を大きく変更している。\n↓\n問題。\n行政が法律を超えて規制していないか？\n↓\n法律による行政の原理\n↓\n政令の適法性\n↓\n必要なら裁判所による審査。\n\n⸻","blanks":["法律による行政の原理","裁判所","国会","政令","内閣"],"options":[["法律による行政の原理","行政処分","行政事件","内閣総理大臣の指揮監督権"],["裁判所","司法権","国政調査","行政処分"],["国会","首長","国家賠償","内閣"],["政令","国会","首長","衆議院"],["内閣","権力分立","裁判所","行政権"]],"mode":"constitution"}],"44":[{"text":"衆議院が内閣不信任決議を可決。\n↓\n内閣は、\n10日以内に衆議院を解散\nまたは\n総辞職\nを選択する。\n↓\n解散\n↓\n総選挙\n↓\n新しい国会\n↓\n内閣総理大臣の指名\nという流れ。\n\n⸻","blanks":["内閣総理大臣の指名","内閣不信任決議","衆議院","国会","解散"],"options":[["内閣総理大臣の指名","指名が一致しない場合","国家賠償","内閣総理大臣"],["内閣不信任決議","衆議院","複数の大臣","国務大臣の過半数"],["衆議院","予算","国務大臣","外交"],["国会","権力分立","国務大臣","行政処分"],["解散","条約","権力分立","刑罰"]],"mode":"constitution"}],"45":[{"text":"行政庁が、\nAの営業を禁止した。\n↓\n職業選択の自由\n↓\n憲法22条\n↓\n法律上の根拠はあるか？\n↓\n規制目的は正当か？\n↓\n規制手段は必要・合理的か？\n↓\n人権制約として合憲か？\n\n⸻","blanks":["職業選択の自由","憲法"],"options":[["職業選択の自由","行政法上の行政行為","法律による行政の原理","総辞職"],["憲法","国務大臣","天皇","国政調査"]],"mode":"constitution"}],"46":[{"text":"公務員の違法な職務行為。\n↓\n国民に損害。\n↓\n国家賠償法。\n↓\n憲法17条。\n↓\n国家賠償請求。\n\n⸻","blanks":["国家賠償","憲法"],"options":[["国家賠償","行政立法","行政処分","上司"],["憲法","権力分立","首長","天皇"]],"mode":"constitution"}],"47":[{"text":"行政庁が、\n営業許可を取り消した。\n↓\n行政法上の行政行為。\n↓\n取消訴訟。\n↓\n処分の違法性を審査。\n↓\n裁判所による救済。\n\n⸻","blanks":["裁判所","行政法上の行政行為"],"options":[["裁判所","外交","予算","衆議院"],["行政法上の行政行為","議院内閣制","複数の大臣","天皇の国事行為"]],"mode":"constitution"}],"48":[{"text":"国民\n↓\n選挙\n↓\n国会\n↓\n内閣総理大臣を指名\n↓\n内閣\n↓\n行政権\n↓\n法律を執行\n↓\n行政活動\n↓\n国民生活\nそして、\n国会\n↓\n監視・統制\n↓\n内閣\n\n裁判所\n↓\n適法性・合憲性審査\n↓\n行政\nというチェックが入る。\n\n⸻","blanks":["内閣総理大臣","行政権","裁判所","国会","選挙"],"options":[["内閣総理大臣","内閣不信任","国家賠償","行政を担当する機関"],["行政権","恩赦","罷免","政令"],["裁判所","権力分立","財政","行政事件"],["国会","司法権","衆議院","罷免"],["選挙","裁判所","刑罰","権力分立"]],"mode":"constitution"}],"49":[{"text":"内閣を一言で表すなら、\n国会の信任を基礎として成立し、内閣総理大臣を中心に行政権を行使する国家機関\nである。\n\n⸻","blanks":["内閣総理大臣","行政権","国会"],"options":[["内閣総理大臣","表現の自由","行政法上の行政行為","内閣不信任決議"],["行政権","内閣","上司","国務大臣"],["国会","国務大臣","恩赦","行政立法"]],"mode":"constitution"}],"50":[{"text":"① 行政権\n↓\n② 内閣総理大臣\n↓\n③ 国務大臣\n↓\n④ 議院内閣制\n↓\n⑤ 国会・裁判所による統制\n\n⸻","blanks":["内閣総理大臣","議院内閣制","国務大臣","行政権","裁判所"],"options":[["内閣総理大臣","人身の自由","衆議院","行政処分"],["議院内閣制","内閣","衆議院","衆議院の優越"],["国務大臣","国家賠償","予算","国民の権利"],["行政権","外交","天皇","国政調査"],["裁判所","選挙","国政調査","行政処分"]],"mode":"constitution"}],"51":[{"text":"基本\n1.\t内閣とは何か。\n2.\t憲法65条は何を定めるか。\n3.\t行政とは何か。\n4.\t行政権とは何か。\n5.\t内閣は誰によって構成されるか。\n6.\t内閣総理大臣はどのように選ばれるか。\n7.\t国務大臣は誰が任命するか。\n8.\t国務大臣の過半数についてどのような制限があるか。\n議院内閣制\n9.\t議院内閣制とは何か。\n10.\t日本が議院内閣制を採用する意味は？\n11.\t内閣は国会に対してどのような責任を負うか。\n12.\t内閣不信任決議とは？\n13.\t不信任決議後、内閣はどうするか。\n14.\t内閣総辞職が必要となる場合は？\n内閣の権限\n15.\t内閣の代表的権限を挙げよ。\n16.\t政令とは何か。\n17.\t法律と政令の関係は？\n18.\t条約について内閣と国会はどう関係するか。\n19.\t予算について内閣と国会はどう関係するか。\n20.\t恩赦とは何か。\n21.\t内閣総理大臣の指揮監督権とは？\n統治\n22.\t内閣と国会の関係を説明せよ。\n23.\t内閣と裁判所の関係を説明せよ。\n24.\t内閣も憲法に拘束される理由は？\n25.\t法律による行政の原理とは？\n26.\t行政法と憲法65条はどうつながるか。\n総合\n27.\t国民→国会→内閣という流れを説明せよ。\n28.\t議院内閣制と三権分立は両立するか。\n29.\t内閣不信任と衆議院解散の関係を説明せよ。\n30.\t政令が法律に反している場合、どう考えるか。\n31.\t行政が人権を制約した場合、どのように分析するか。\n32.\t内閣と行政法の関係を説明せよ。\n33.\t国会・内閣・裁判所による相互統制を説明せよ。\n\n⸻","blanks":["内閣総理大臣の指揮監督権","法律による行政の原理","国務大臣の過半数","内閣と国会の関係","内閣不信任決議"],"options":[["内閣総理大臣の指揮監督権","内閣不信任決議","法律による行政の原理","国政調査"],["法律による行政の原理","議院内閣制","国務大臣","国家賠償"],["国務大臣の過半数","法律の根拠","内閣総理大臣の指名","天皇の国事行為"],["内閣と国会の関係","衆議院の優越","国政調査","国民の権利"],["内閣不信任決議","内閣不信任","衆議院","総辞職"]],"mode":"constitution"}],"52":[{"text":"内閣を理解する最重要ポイントは、\n「行政を担当する機関」\nだけで終わらせないこと。\n日本の内閣は、\n国民主権\n↓\n国民が国会議員を選ぶ\n↓\n国会\n↓\n内閣総理大臣を指名\n↓\n内閣\n↓\n行政権\n↓\n法律・予算等を実行\n↓\n国民生活\nという民主的な正統性を持つ。\nしかし、内閣には強大な行政権があるため、\n国会\n↓\n法律・予算・国政調査・不信任\n↓\n内閣\n\n裁判所\n↓\n行政活動の適法性・合憲性を審査\n↓\n内閣\nという統制が必要になる。\nしたがって、\n日本の統治構造は「国会が法律を作り、内閣が行政を行い、裁判所が司法を担う」という単純な分業ではない。\nそれぞれが、\n憲法の下で役割を分担し、同時に相互にコントロールする\n仕組みになっている。\nそして内閣について最も重要な一文は、\n「内閣は、国会の信任を基礎として成立し、内閣総理大臣を中心に行政権を行使する」\nである。\nこれを軸に、\n議院内閣制\n＋\n行政権\n＋\n内閣総理大臣\n＋\n国務大臣\n＋\n国会による統制\n＋\n裁判所による司法審査\nを一つの体系として理解すれば、第8編は完成である。","blanks":["行政を担当する機関","内閣総理大臣","議院内閣制","国務大臣","国政調査"],"options":[["行政を担当する機関","内閣総理大臣の指揮監督権","行政法上の行政行為","内閣不信任"],["内閣総理大臣","行政権","衆議院の優越","裁判所"],["議院内閣制","国民の権利","権力分立","内閣と国会の関係"],["国務大臣","行政権","総辞職","内閣総理大臣"],["国政調査","行政処分","憲法","行政権"]],"mode":"constitution"}]},"9":{"1":[{"text":"国家作用は大きく、\n立法・行政・司法\nに分けられる。\n司法とは、\n具体的な争訟について法を適用し、判断する国家作用\nである。\n立法\n↓\n一般的ルールを作る\n↓\n国会\n\n行政\n↓\n法律を具体的に実施する\n↓\n内閣\n\n司法\n↓\n具体的な事件について法を適用する\n↓\n裁判所\n\n⸻","blanks":["裁判所","国会","内閣"],"options":[["裁判所","刑罰","政治権力","国会"],["国会","刑事事件","天皇","立憲主義"],["内閣","不法行為","行政権","刑事事件"]],"mode":"constitution"}],"2":[{"text":"憲法76条1項は、\nすべて司法権は、最高裁判所及び法律の定めるところにより設置する下級裁判所に属する。\nと定める。\nつまり、\n司法権は裁判所に属する。\n\n⸻","blanks":["司法権","最高裁判所","下級裁判所","憲法"],"options":[["司法権","行政処分","憲法","裁判"],["最高裁判所","最高法規","刑事裁判","人身の自由"],["下級裁判所","最高裁判所","民事裁判","司法権の独立"],["憲法","立憲主義","最高法規","行政権"]],"mode":"constitution"}],"3":[{"text":"日本の裁判所は、\n裁判所\n│\n└─ 最高裁判所\n│\n└─ 下級裁判所\n├─ 高等裁判所\n├─ 地方裁判所\n├─ 家庭裁判所\n└─ 簡易裁判所\nという体系になっている。\n\n⸻","blanks":["家庭裁判所","簡易裁判所","最高裁判所","下級裁判所","地方裁判所"],"options":[["家庭裁判所","司法積極主義","違憲審査制","政治権力"],["簡易裁判所","法の支配","裁判官個人","司法権の独立"],["最高裁判所","刑事裁判","司法消極主義","最高法規"],["下級裁判所","政治権力","違憲審査制","良心に従う"],["地方裁判所","高等裁判所","最高裁判所","良心に従う"]],"mode":"constitution"}],"4":[{"text":"最高裁判所は、\n日本の司法制度における最上級の裁判所\nである。\n最高裁判所は、\n憲法問題\n法律解釈\nなどについて最終的な判断をする。\n\n⸻","blanks":["最高裁判所","憲法"],"options":[["最高裁判所","政治権力","表現の自由","家庭裁判所"],["憲法","逮捕","黙秘権","政治権力"]],"mode":"constitution"}],"5":[{"text":"下級裁判所には、\n•\t高等裁判所\n•\t地方裁判所\n•\t家庭裁判所\n•\t簡易裁判所\nがある。\nそれぞれ、\n管轄\n審級\n事件の種類\nなどが異なる。\n\n⸻","blanks":["下級裁判所","家庭裁判所","簡易裁判所","地方裁判所","高等裁判所"],"options":[["下級裁判所","基本的人権","違憲審査制","良心に従う"],["家庭裁判所","基本的人権","不法行為","違憲審査権"],["簡易裁判所","最高裁判所","国家機関","刑事裁判"],["地方裁判所","国家賠償","司法積極主義","法の支配"],["高等裁判所","損害賠償等","国民審査","基本的人権"]],"mode":"constitution"}],"6":[{"text":"日本では原則として、\n三審制\nが採用されている。\n第1審\n↓\n控訴\n↓\n第2審\n↓\n上告\n↓\n第3審\nただし、\nすべての事件が必ず3回審理される\nという意味ではない。\n\n⸻","blanks":["三審制","回審理"],"options":[["三審制","と表現","不法行為","裁判所"],["回審理","不法行為","行政処分","命令"]],"mode":"constitution"}],"7":[{"text":"司法権の重要な役割は、\n権利・利益を法に基づいて救済すること\nである。\n例えば、\n契約をめぐる争い\n損害賠償\n行政処分\n刑事事件\nなど。\n\n⸻","blanks":["行政処分","司法権"],"options":[["行政処分","身分保障","三審制","政治権力"],["司法権","国会","罷免","行政処分"]],"mode":"constitution"}],"8":[{"text":"民事裁判では、\n個人・企業などの間の権利義務\nをめぐる争いを扱う。\nA\n↓\n「Bにお金を払ってほしい」\n↓\n裁判\n↓\n権利の有無を判断\n↓\n判決\n\n⸻","blanks":["Bにお金を払ってほしい","民事裁判"],"options":[["Bにお金を払ってほしい","損害賠償等","政治問題だから全部裁判できない","裁判官の独立"],["民事裁判","下級裁判所","行政処分","国民審査"]],"mode":"constitution"}],"9":[{"text":"刑事裁判では、\n犯罪を行ったとして起訴された人について、有罪・無罪などを判断する。\nここでは、\n人身の自由\n適正手続\n罪刑法定主義\n黙秘権\nなどが重要になる。\n\n⸻","blanks":["刑事裁判","罪刑法定主義","人身の自由","適正手続","黙秘権"],"options":[["刑事裁判","司法権","国家賠償","最高裁判所"],["罪刑法定主義","最高裁判所","法律上の争訟","人身の自由"],["人身の自由","表現の自由","憲法と法律","国民の信頼"],["適正手続","国民審査","不法行為","政治権力"],["黙秘権","憲法","国家機関","不法行為"]],"mode":"constitution"}],"10":[{"text":"行政事件では、\n行政庁の行為が適法か\nなどを争う。\n例えば、\n営業許可取消処分\n↓\n取消訴訟\n↓\n裁判所\n↓\n行政処分の適法性を判断。\nこれは、\n行政法の行政救済\nと直接つながる。\n\n⸻","blanks":["行政事件","行政処分","裁判所"],"options":[["行政事件","人身の自由","違憲審査","司法権"],["行政処分","適正手続","国民の信頼","最高裁判所"],["裁判所","国民審査","命令","立憲主義"]],"mode":"constitution"}],"11":[{"text":"司法権が重要なのは、\n国家権力も法に従わなければならない\nから。\n国家\n↓\n行政・立法\n↓\n法に従う\n↓\n裁判所\n↓\n違法・違憲を審査\nこれが、\n法の支配\nを具体化する。\n\n⸻","blanks":["法の支配","裁判所","司法権"],"options":[["法の支配","人身の自由","国民の信頼","法律制定"],["裁判所","最高法規","国民審査","と表現"],["司法権","国家機関","憲法","黙秘権"]],"mode":"constitution"}],"12":[{"text":"憲法76条3項は、\nすべて裁判官は、その良心に従い独立してその職権を行い、この憲法及び法律にのみ拘束される。\nと定める。\nこれが、\n裁判官の独立\nである。\n\n⸻","blanks":["裁判官の独立","憲法","良心"],"options":[["裁判官の独立","法律上の争訟","司法積極主義","表現の自由"],["憲法","と表現","三審制","回審理"],["良心","回審理","罷免","法律制定"]],"mode":"constitution"}],"13":[{"text":"裁判官が、\n政府\n国会\n世論\nなどから自由に判断できなければ、\n公正な裁判\nができない。\nしたがって、\n政治\n↓\n裁判官に圧力\n↓\nNG\nとなる。\n裁判官は、\n憲法と法律\nに基づいて判断する。\n\n⸻","blanks":["憲法と法律","国会"],"options":[["憲法と法律","損害賠償等","法の支配","高等裁判所"],["国会","黙秘権","国家賠償","裁判"]],"mode":"constitution"}],"14":[{"text":"「良心」とは、\n裁判官個人の好き嫌い\nという意味ではない。\n裁判官が、\n外部からの圧力ではなく、\n法と職業上の良心に従って判断する\nことを意味する。\n\n⸻","blanks":["良心","裁判官個人"],"options":[["良心","憲法","刑事事件","司法権"],["裁判官個人","憲法と法律","民事裁判","表現の自由"]],"mode":"constitution"}],"15":[{"text":"最高裁判所には、\n最高裁判所長官\nと\nその他の最高裁判所判事\nがいる。\n長官は、\n内閣の指名に基づいて天皇が任命\nする。\nその他の判事は、\n内閣が任命\nする。\n\n⸻","blanks":["最高裁判所","天皇","内閣"],"options":[["最高裁判所","憲法と法律","人身の自由","司法消極主義"],["天皇","法の支配","国会","裁判"],["内閣","と表現","民事裁判","裁判"]],"mode":"constitution"}],"16":[{"text":"最高裁判所裁判官については、\n国民審査\nが行われる。\n国民が、\nその裁判官を辞めさせるべきか\nを判断する制度。\n\n⸻","blanks":["最高裁判所裁判官","国民審査"],"options":[["最高裁判所裁判官","憲法と法律","人身の自由","法律上の争訟"],["国民審査","下級裁判所","行政処分","国民の信頼"]],"mode":"constitution"}],"17":[{"text":"国民審査は、\n司法権の独立\nと\n民主的コントロール\nを調整する制度と考えられる。\n裁判官\n↓\n独立して判断\n↓\nしかし\n↓\n最高裁判所裁判官\n↓\n国民審査\n\n⸻","blanks":["最高裁判所裁判官","司法権の独立"],"options":[["最高裁判所裁判官","損害賠償等","良心に従う","簡易裁判所"],["司法権の独立","法的権利義務","裁判所の役割","基本的人権"]],"mode":"constitution"}],"18":[{"text":"裁判官には、\n強い身分保障\nが認められている。\nなぜなら、\n政治権力によって簡単に辞めさせられる\nなら、\n独立した裁判\nができなくなるから。\n\n⸻","blanks":["身分保障","政治権力"],"options":[["身分保障","刑事裁判","刑事事件","司法権"],["政治権力","三審制","最高裁判所","回審理"]],"mode":"constitution"}],"19":[{"text":"裁判官は、\n原則として自由に罷免されない。\n憲法上定められた一定の事由による。\n例えば、\n心身の故障\n弾劾\nなど。\n\n⸻","blanks":["憲法","罷免"],"options":[["憲法","回審理","最高法規","国家賠償"],["罷免","国会","不法行為","国民審査"]],"mode":"constitution"}],"20":[{"text":"憲法82条は、\n裁判の対審及び判決は、公開法廷で行う。\nと定める。\nこれが、\n裁判公開の原則\nである。\n\n⸻","blanks":["憲法","裁判公開の原則"],"options":[["憲法","内閣","刑事裁判","三審制"],["裁判公開の原則","最高裁判所","司法権の独立","国民の信頼"]],"mode":"constitution"}],"21":[{"text":"裁判を秘密にすると、\n裁判官が適切に判断しているか\nを国民が確認できない。\nそこで、\n司法への国民の信頼\nを確保する。\n\n⸻","blanks":["国民の信頼","裁判"],"options":[["国民の信頼","下級裁判所","地方裁判所","裁判の公開"],["裁判","天皇","良心","最高法規"]],"mode":"constitution"}],"22":[{"text":"裁判の公開は重要だが、\n常に完全公開\nというわけではない。\n憲法82条は、\n善良の風俗を害するおそれ\nなどについて一定の例外を認めている。\nただし、\n政治犯罪\n出版に関する犯罪\n憲法第3章の権利が問題となる事件\nについては、\n非公開を全面的に認めることはできない。\n\n⸻","blanks":["裁判の公開","憲法"],"options":[["裁判の公開","裁判官個人","国民審査","最高法規"],["憲法","国民審査","黙秘権","裁判所"]],"mode":"constitution"}],"23":[{"text":"裁判所の非常に重要な権限が、\n違憲審査権\nである。\n憲法81条は、\n最高裁判所は、一切の法律、命令、規則又は処分が憲法に適合するかしないかを決定する終審裁判所である。\nと定める。\n\n⸻","blanks":["違憲審査権","最高裁判所","憲法"],"options":[["違憲審査権","統治行為論","司法消極主義","表現の自由"],["最高裁判所","高等裁判所","国家賠償","国民の信頼"],["憲法","命令","罷免","黙秘権"]],"mode":"constitution"}],"24":[{"text":"国会が法律を作った。\n↓\nしかし、\n憲法に違反している可能性\nがある。\n↓\n裁判所が、\n憲法適合性\nを判断する。\n国会\n↓\n法律\n↓\n裁判所\n↓\n憲法と適合する？\n↓\n合憲／違憲\n\n⸻","blanks":["裁判所","国会","憲法"],"options":[["裁判所","民事裁判","裁判","三審制"],["国会","憲法","内閣","刑事事件"],["憲法","不法行為","行政事件","国民審査"]],"mode":"constitution"}],"25":[{"text":"憲法は、\n最高法規\nである。\nしたがって、\n国会が作った法律\nであっても、\n憲法に反することはできない。\nそこで、\n裁判所による違憲審査\nが必要になる。\n\n⸻","blanks":["違憲審査","最高法規","裁判所","国会","憲法"],"options":[["違憲審査","と表現","法律制定","司法権"],["最高法規","違憲審査","基本的人権","損害賠償等"],["裁判所","法律制定","国会","不法行為"],["国会","回審理","法の支配","命令"],["憲法","刑事事件","内閣","立憲主義"]],"mode":"constitution"}],"26":[{"text":"立憲主義\n↓\n国家権力を憲法で制限\n↓\n国会も憲法に拘束\n↓\n法律が憲法に違反する可能性\n↓\n裁判所\n↓\n違憲審査\nつまり、\n違憲審査制は立憲主義を実効化する重要な仕組み\nである。\n\n⸻","blanks":["違憲審査制","立憲主義","裁判所","国会","憲法"],"options":[["違憲審査制","民事裁判","良心に従う","刑事裁判"],["立憲主義","行政処分","民事裁判","不法行為"],["裁判所","国家賠償","三審制","国会"],["国会","裁判","黙秘権","法の支配"],["憲法","民事裁判","国会","命令"]],"mode":"constitution"}],"27":[{"text":"日本では、\n付随的違憲審査制\nが基本とされる。\nつまり、\n具体的な事件を裁判する中で、\nその事件に適用される法令の憲法適合性を判断する。\n\n⸻","blanks":["違憲審査制","憲法"],"options":[["違憲審査制","下級裁判所","家庭裁判所","司法消極主義"],["憲法","国家機関","三審制","刑事事件"]],"mode":"constitution"}],"28":[{"text":"付随的審査\n具体的事件\n↓\n裁判\n↓\n適用される法律\n↓\n憲法違反？\n抽象的審査\n法律\n↓\n具体的事件とは無関係に\n↓\n憲法適合性だけを判断\n日本は基本的に、\n具体的事件を前提とする違憲審査\nを採用している。\n\n⸻","blanks":["違憲審査","憲法"],"options":[["違憲審査","回審理","下級裁判所","国家賠償"],["憲法","国家賠償","刑罰","刑事事件"]],"mode":"constitution"}],"29":[{"text":"憲法81条により、\n法律\n命令\n規則\n処分\nなどが憲法適合性の審査対象となり得る。\n\n⸻","blanks":["憲法","命令"],"options":[["憲法","不法行為","回審理","と表現"],["命令","国会","裁判","刑罰"]],"mode":"constitution"}],"30":[{"text":"裁判所が、\n政治問題すべて\nについて自由に判断できるわけではない。\n裁判所には、\n司法権の限界\nがある。\n\n⸻","blanks":["裁判所","司法権"],"options":[["裁判所","刑罰","刑事裁判","命令"],["司法権","行政機関","法の支配","立憲主義"]],"mode":"constitution"}],"31":[{"text":"司法権が働くためには、\n具体的な法律上の争訟\nであることが基本となる。\nつまり、\n単なる政治的意見\n一般的な政策論\nだけでは、\n裁判所が判断できない場合がある。\n\n⸻","blanks":["法律上の争訟","裁判所","司法権"],"options":[["法律上の争訟","裁判公開の原則","国民の信頼","下級裁判所"],["裁判所","天皇","行政処分","最高法規"],["司法権","政治権力","行政事件","不法行為"]],"mode":"constitution"}],"32":[{"text":"裁判所は、\n「この法律は良い法律か？」\nという一般論だけを判断する機関ではない。\n基本的には、\n具体的な事件について、法的権利義務を判断する\n機関。\n\n⸻","blanks":["裁判所","法的権利義務"],"options":[["裁判所","法の支配","国家賠償","黙秘権"],["法的権利義務","損害賠償等","行政組織の上司","法律上の根拠"]],"mode":"constitution"}],"33":[{"text":"国家の高度に政治的な問題について、\n裁判所が判断することを控える\nという考え方がある。\nこれを、\n統治行為論\nという。\nただし、\n「政治問題だから全部裁判できない」\nという意味ではない。\n\n⸻","blanks":["政治問題だから全部裁判できない","統治行為論","裁判所"],"options":[["政治問題だから全部裁判できない","人身の自由","裁判所の役割","裁判公開の原則"],["統治行為論","損害賠償等","国家機関","地方裁判所"],["裁判所","国会","不法行為","最高法規"]],"mode":"constitution"}],"34":[{"text":"裁判所が、\n政治部門の判断に対して慎重な態度をとる\n場合がある。\nこれを、\n司法消極主義\nと表現することがある。\n\n⸻","blanks":["司法消極主義","と表現","裁判所"],"options":[["司法消極主義","地方裁判所","簡易裁判所","違憲審査権"],["と表現","司法権","不法行為","国会"],["裁判所","命令","最高法規","法律制定"]],"mode":"constitution"}],"35":[{"text":"反対に、\n裁判所が積極的に憲法問題に介入し、\n人権保障を強く行う\n場合、\n司法積極主義\nと表現される。\n\n⸻","blanks":["司法積極主義","と表現","裁判所","憲法"],"options":[["司法積極主義","下級裁判所","裁判官個人","表現の自由"],["と表現","刑事事件","国民審査","罷免"],["裁判所","と表現","内閣","立憲主義"],["憲法","刑事事件","裁判所","刑罰"]],"mode":"constitution"}],"36":[{"text":"国会\n↓\n法律制定\n↓\n裁判所\n↓\n法律を適用\n↓\n必要に応じて違憲審査\nこの関係から、\n裁判所は国会を政治的に指揮する機関ではない\nが、\n国会の立法を憲法の観点から審査することがある\nと理解する。\n\n⸻","blanks":["違憲審査","法律制定","裁判所","国会","憲法"],"options":[["違憲審査","刑事事件","国民審査","行政機関"],["法律制定","立憲主義","適正手続","基本的人権"],["裁判所","立憲主義","回審理","民事裁判"],["国会","裁判所","良心","憲法"],["憲法","国民審査","黙秘権","行政処分"]],"mode":"constitution"}],"37":[{"text":"行政が処分を行う。\n↓\n国民が争う。\n↓\n裁判所が、\n処分の適法性\nを審査する。\nしたがって、\n裁判所は行政権を法的にコントロールする役割\nも持つ。\n\n⸻","blanks":["行政権","裁判所"],"options":[["行政権","法律制定","罷免","良心"],["裁判所","国家賠償","行政処分","行政事件"]],"mode":"constitution"}],"38":[{"text":"憲法\n│\n┌───────┼───────┐\n↓       ↓       ↓\n国会     内閣    裁判所\n立法      行政      司法\n↕       ↕       ↕\n└────相互抑制────┘\n司法権の独立によって、\n他の国家機関からの不当な介入\nを防ぐ。\n\n⸻","blanks":["司法権の独立","裁判所","国会","憲法","内閣"],"options":[["司法権の独立","司法消極主義","法的権利義務","違憲審査制"],["裁判所","天皇","良心","国民審査"],["国会","裁判","と表現","三審制"],["憲法","良心","国会","政治権力"],["内閣","不法行為","良心","裁判"]],"mode":"constitution"}],"39":[{"text":"裁判所は、\n基本的人権を救済する重要な機関。\n例えば、\n表現の自由を侵害された\n↓\n裁判\n違法な行政処分を受けた\n↓\n取消訴訟\n公務員の違法行為で損害\n↓\n国家賠償\nという形。\n\n⸻","blanks":["表現の自由","基本的人権","行政処分","国家賠償","裁判所"],"options":[["表現の自由","国家賠償","基本的人権","法の支配"],["基本的人権","法の支配","刑事事件","統治行為論"],["行政処分","家庭裁判所","刑事裁判","人身の自由"],["国家賠償","国民の信頼","法律制定","三審制"],["裁判所","政治権力","法の支配","行政処分"]],"mode":"constitution"}],"40":[{"text":"憲法32条は、\n何人も、裁判所において裁判を受ける権利を奪われない。\nと定める。\nこれは、\n人権救済の入口\nとなる重要な権利。\n\n⸻","blanks":["裁判を受ける権利","裁判所","憲法"],"options":[["裁判を受ける権利","統治行為論","裁判所の役割","行政組織の上司"],["裁判所","良心","憲法","刑事裁判"],["憲法","行政処分","黙秘権","刑罰"]],"mode":"constitution"}],"41":[{"text":"裁判所の役割をまとめると、\n裁判所\n│\n├─ 民事裁判\n│   ↓\n│  私人間の権利救済\n│\n├─ 刑事裁判\n│   ↓\n│  犯罪・刑罰\n│\n├─ 行政事件\n│   ↓\n│  行政権の法的統制\n│\n└─ 違憲審査\n↓\n憲法保障\n\n⸻","blanks":["裁判所の役割","民事裁判","違憲審査","刑事裁判","行政事件"],"options":[["裁判所の役割","地方裁判所","罪刑法定主義","高等裁判所"],["民事裁判","三審制","最高裁判所","基本的人権"],["違憲審査","行政機関","憲法と法律","法律制定"],["刑事裁判","行政事件","三審制","下級裁判所"],["行政事件","法律制定","立憲主義","民事裁判"]],"mode":"constitution"}],"42":[{"text":"裁判官\n↓\n独立して判断\n↓\n政治権力から自由\n↓\n身分保障\n↓\n公正な裁判\nここで、\n司法権の独立\nと\n裁判官の身分保障\nがつながる。\n\n⸻","blanks":["裁判官の身分保障","司法権の独立"],"options":[["裁判官の身分保障","人身の自由","裁判所の役割","地方裁判所"],["司法権の独立","違憲審査権","良心に従う","司法消極主義"]],"mode":"constitution"}],"43":[{"text":"司法権全体として、\n他の国家機関から独立\nしていなければならない。\n\n⸻","blanks":["司法権","国家機関"],"options":[["司法権","刑罰","国民審査","天皇"],["国家機関","法律制定","損害賠償等","と表現"]],"mode":"constitution"}],"44":[{"text":"さらに個々の裁判官も、\n他の裁判官\n上級裁判所\n行政府\nなどから不当に干渉されず、\n憲法・法律に従って判断する。\n\n⸻","blanks":["裁判所","憲法"],"options":[["裁判所","立憲主義","民事裁判","行政権"],["憲法","行政事件","民事裁判","行政権"]],"mode":"constitution"}],"45":[{"text":"上級裁判所は、\n下級裁判所の判決を上訴審として審査\nする。\nしかし、\n行政組織の上司のように下級裁判官を指揮命令する\nという意味ではない。\n\n⸻","blanks":["下級裁判所","行政組織の上司"],"options":[["下級裁判所","政治権力","司法権の独立","国民審査"],["行政組織の上司","日本の違憲審査制","裁判官の身分保障","下級裁判所"]],"mode":"constitution"}],"46":[{"text":"最高裁判所には、\n訴訟手続・裁判所内部の規律等について規則を定める権限\nが認められている。\nこれは、\n司法権の自律性\nとも関係する。\n\n⸻","blanks":["最高裁判所","司法権"],"options":[["最高裁判所","刑事事件","損害賠償等","司法消極主義"],["司法権","回審理","民事裁判","行政権"]],"mode":"constitution"}],"47":[{"text":"刑事事件では、\n検察官\nが重要な役割を担う。\nただし、\n検察官＝裁判所\nではない。\n捜査・起訴\n↓\n検察\n↓\n裁判\n↓\n裁判所\n↓\n有罪・無罪等を判断\n\n⸻","blanks":["裁判所","刑事事件"],"options":[["裁判所","行政事件","刑事裁判","国民審査"],["刑事事件","民事裁判","刑事裁判","法律制定"]],"mode":"constitution"}],"48":[{"text":"警察も、\n行政機関\nである。\nしたがって、\n警察\n↓\n捜査\n↓\n検察\n↓\n起訴\n↓\n裁判所\n↓\n裁判\nという役割分担になる。\n\n⸻","blanks":["裁判所","行政機関"],"options":[["裁判所","罷免","立憲主義","裁判"],["行政機関","行政事件","国民審査","損害賠償等"]],"mode":"constitution"}],"49":[{"text":"行政法では、\n取消訴訟\n無効等確認訴訟\n義務付け訴訟\n差止訴訟\nなどを学んだ。\nこれらはすべて、\n行政権を裁判所によって法的に統制する仕組み\nである。\n\n⸻","blanks":["行政権","裁判所"],"options":[["行政権","憲法","国家機関","国家賠償"],["裁判所","回審理","行政事件","最高法規"]],"mode":"constitution"}],"50":[{"text":"民法では、\n契約\n不法行為\n物権\n相続\nなどを学んだ。\nこれらについて争いが起きた場合、\n裁判所が民法を適用して判断する。\n\n⸻","blanks":["裁判所","不法行為"],"options":[["裁判所","国家機関","民事裁判","立憲主義"],["不法行為","民事裁判","下級裁判所","地方裁判所"]],"mode":"constitution"}],"51":[{"text":"刑法では、\nどの行為が犯罪となるか\nを定める。\n刑事訴訟では、\nその人が犯罪を行ったか\nを裁判所が判断する。\nしたがって、\n刑法\n↓\n犯罪・刑罰のルール\n↓\n刑事手続\n↓\n裁判所\n↓\n具体的事件を判断\nとなる。\n\n⸻","blanks":["裁判所","刑罰"],"options":[["裁判所","国家賠償","良心","立憲主義"],["刑罰","内閣","国家機関","良心"]],"mode":"constitution"}],"52":[{"text":"国会が、\n表現の自由を過度に制限する法律\nを制定した。\n↓\nAがその法律の適用を受ける。\n↓\n裁判。\n↓\n裁判所が、\n憲法21条\nとの関係を審査。\n↓\n必要に応じて、\n違憲判断。\n\n⸻","blanks":["表現の自由","裁判所","国会","憲法"],"options":[["表現の自由","基本的人権","司法消極主義","良心に従う"],["裁判所","回審理","民事裁判","司法権"],["国会","天皇","行政権","逮捕"],["憲法","天皇","内閣","法の支配"]],"mode":"constitution"}],"53":[{"text":"行政庁が、\nAの営業許可を取り消した。\n↓\nAが取消訴訟。\n↓\n裁判所。\n↓\n処分に法律上の根拠があるか。\n↓\n手続は適法か。\n↓\n裁量の逸脱・濫用はないか。\n↓\n適法・違法を判断。\n\n⸻","blanks":["裁判所","法律上の根拠"],"options":[["裁判所","立憲主義","と表現","司法権"],["法律上の根拠","裁判官個人","罪刑法定主義","下級裁判所"]],"mode":"constitution"}],"54":[{"text":"公務員が違法な職務行為。\n↓\nAに損害。\n↓\n国家賠償請求。\n↓\n裁判所。\n↓\n国家賠償法の要件を判断。\n\n⸻","blanks":["国家賠償","裁判所"],"options":[["国家賠償","最高法規","身分保障","行政事件"],["裁判所","憲法","黙秘権","国民審査"]],"mode":"constitution"}],"55":[{"text":"Aが犯罪の疑いで逮捕。\n↓\n捜査。\n↓\n起訴。\n↓\n刑事裁判。\n↓\n証拠を審理。\n↓\n有罪・無罪等を判断。\n↓\n有罪なら刑罰。\n\n⸻","blanks":["刑事裁判","逮捕","刑罰"],"options":[["刑事裁判","基本的人権","国民の信頼","地方裁判所"],["逮捕","天皇","罷免","裁判所"],["刑罰","最高法規","憲法","法律制定"]],"mode":"constitution"}],"56":[{"text":"AとBが契約を締結。\n↓\nBが契約上の義務を履行しない。\n↓\nAが損害賠償等を請求。\n↓\n裁判所。\n↓\n契約の成立\n↓\n債務不履行\n↓\n損害\n↓\n因果関係\n↓\n賠償責任\nを判断。\n\n⸻","blanks":["裁判所","損害賠償等"],"options":[["裁判所","国家機関","国家賠償","罷免"],["損害賠償等","最高裁判所","最高法規","良心に従う"]],"mode":"constitution"}],"57":[{"text":"具体的事件\n↓\n法的権利義務の争い\n↓\n裁判所\n↓\n事実認定\n↓\n法解釈\n↓\n法律適用\n↓\n判決\n憲法問題があれば、\n法律・行政行為\n↓\n憲法との関係\n↓\n違憲審査\n↓\n合憲／違憲\nとなる。\n\n⸻","blanks":["違憲審査","裁判所","憲法"],"options":[["違憲審査","身分保障","と表現","政治権力"],["裁判所","行政権","国家機関","法律制定"],["憲法","内閣","良心","と表現"]],"mode":"constitution"}],"58":[{"text":"司法を一言で表すなら、\n具体的な争訟について、独立した裁判所が憲法・法律に基づいて判断し、権利救済と法秩序の維持を行う国家作用\nである。\n\n⸻","blanks":["裁判所","憲法"],"options":[["裁判所","憲法","国家賠償","刑罰"],["憲法","裁判","国家賠償","司法権"]],"mode":"constitution"}],"59":[{"text":"① 司法権\n↓\n② 裁判所\n↓\n③ 裁判官の独立\n↓\n④ 裁判による権利救済\n↓\n⑤ 違憲審査\n\n⸻","blanks":["裁判官の独立","違憲審査","裁判所","司法権"],"options":[["裁判官の独立","司法積極主義","法律上の根拠","損害賠償等"],["違憲審査","最高法規","憲法と法律","国家機関"],["裁判所","黙秘権","国家機関","国会"],["司法権","罷免","刑事裁判","国会"]],"mode":"constitution"}],"60":[{"text":"司法\n1.\t司法とは何か。\n2.\t司法権とは何か。\n3.\t憲法76条は何を定めるか。\n4.\t裁判所にはどのような種類があるか。\n5.\t三審制とは何か。\n6.\t民事裁判と刑事裁判の違いは？\n7.\t行政事件とは何か。\n裁判官\n8.\t裁判官の独立とは何か。\n9.\tなぜ裁判官は独立していなければならないか。\n10.\t「良心に従う」とはどういう意味か。\n11.\t裁判官の身分保障が必要な理由は？\n12.\t最高裁判所裁判官の国民審査とは？\n裁判\n13.\t裁判公開の原則とは？\n14.\tなぜ裁判を公開するのか。\n15.\t公開には例外があるか。\n16.\t裁判を受ける権利とは？\n違憲審査\n17.\t違憲審査制とは？\n18.\t憲法81条は何を定めるか。\n19.\t日本の違憲審査制の特徴は？\n20.\t付随的違憲審査制とは？\n21.\t抽象的違憲審査との違いは？\n22.\t何が違憲審査の対象となるか。\n23.\t違憲審査が立憲主義とつながる理由は？\n司法権の限界\n24.\t法律上の争訟とは？\n25.\tなぜ具体的事件が必要なのか。\n26.\t統治行為論とは？\n27.\t司法消極主義とは？\n28.\t司法積極主義とは？\n総合\n29.\t国会・内閣・裁判所の関係を説明せよ。\n30.\t裁判所は国会を支配する機関か。\n31.\t裁判所は行政をどのように統制するか。\n32.\t行政事件訴訟と司法権の関係は？\n33.\t国家賠償と司法権の関係は？\n34.\t基本的人権と裁判所の関係を説明せよ。\n35.\t違憲審査と立憲主義の関係を説明せよ。\n36.\t第7編・第8編・第9編を三権分立として説明せよ。\n\n⸻","blanks":["良心に従う","最高裁判所裁判官の国民審査","なぜ裁判を公開するのか","裁判を受ける権利","日本の違憲審査制"],"options":[["良心に従う","裁判の公開","簡易裁判所","家庭裁判所"],["最高裁判所裁判官の国民審査","地方裁判所","裁判所の役割","司法権の独立"],["なぜ裁判を公開するのか","Bにお金を払ってほしい","裁判を受ける権利","最高裁判所裁判官"],["裁判を受ける権利","表現の自由","罪刑法定主義","基本的人権"],["日本の違憲審査制","憲法と法律","争いを解決する場所","最高裁判所裁判官"]],"mode":"constitution"}],"61":[{"text":"司法を理解する中心は、\n「裁判所が具体的な事件について、憲法・法律に基づいて判断する」\nということ。\n憲法\n│\n┌─────────┼─────────┐\n↓         ↓         ↓\n国会       内閣      裁判所\n│          │          │\n立法        行政        司法\n│          │          │\n法律       行政活動    裁判\n│          │          │\n└──────────┼──────────┘\n↓\n相互抑制\n│\n↓\n人権保障\nそして裁判所には、\n司法権\nだけでなく、\n違憲審査権\nという重要な役割がある。\n国会\n↓\n法律制定\n↓\n法律が憲法に反していないか？\n↓\n裁判所\n↓\n違憲審査\nさらに行政については、\n内閣\n↓\n行政処分\n↓\n国民が不服\n↓\n行政事件訴訟\n↓\n裁判所\n↓\n行政の適法性を審査\nとなる。\nしたがって、第9編の最重要ポイントは、\n裁判所は単に「争いを解決する場所」ではない。\nということ。\n裁判所は、\n①具体的な紛争を解決し、 ②国民の権利を救済し、 ③行政を法的に統制し、 ④必要に応じて法律等の憲法適合性を審査する\nという役割を持つ。\nこれによって、\n法の支配・立憲主義・基本的人権保障\nが実際の社会で機能する。","blanks":["争いを解決する場所","違憲審査権","基本的人権","行政処分","立憲主義"],"options":[["争いを解決する場所","損害賠償等","裁判所の役割","法的権利義務"],["違憲審査権","最高法規","違憲審査制","刑事事件"],["基本的人権","政治権力","裁判の公開","国家機関"],["行政処分","損害賠償等","国家機関","下級裁判所"],["立憲主義","政治権力","法の支配","最高法規"]],"mode":"constitution"}]},"10":{"1":[{"text":"国家も活動するためには、\nお金\nが必要である。\n道路、警察、教育、社会保障、防衛、行政など、国家活動には財源が必要になる。\nこの国家のお金に関する活動を、\n財政\nという。\n\n⸻","blanks":["教育","財政"],"options":[["教育","憲法改正","地方議会","憲法"],["財政","憲法","選挙","議会"]],"mode":"constitution"}],"2":[{"text":"国家が国民から自由にお金を集め、自由に使えると、\n国民の財産\nや\n国民の政治的自由\nが危険になる。\nそこで憲法は、\n国家のお金について国会による民主的コントロール\nを要求している。\nこれを、\n財政民主主義\nと考える。\n\n⸻","blanks":["財政民主主義","国会","憲法"],"options":[["財政民主主義","基本的人権","第10編の核心","憲法改正の限界"],["国会","教育","財政","地方自治"],["憲法","課税","財政","裁判所"]],"mode":"constitution"}],"3":[{"text":"財政民主主義の基本は、\n国家の財政について、国民の代表者である国会が関与する\nということ。\n国民\n↓\n選挙\n↓\n国会\n↓\n予算・課税等をコントロール\n↓\n国家財政\n\n⸻","blanks":["財政民主主義","国会","予算","選挙","課税"],"options":[["財政民主主義","人権を保障します","違憲審査制","内閣総理大臣"],["国会","条例","憲法","首長"],["予算","解散","教育","財政"],["選挙","条例","地方自治","国務大臣"],["課税","社会権","参政権","衆議院"]],"mode":"constitution"}],"4":[{"text":"憲法84条は、\nあらたに租税を課し、又は現行の租税を変更するには、法律又は法律の定める条件によることを必要とする。\nと定める。\nこれが、\n租税法律主義\nである。\n\n⸻","blanks":["租税法律主義","憲法"],"options":[["租税法律主義","憲法の基本原理","地方自治の本旨","予算先議権"],["憲法","地方自治","住民自治","予算"]],"mode":"constitution"}],"5":[{"text":"国家が、\n「今年から国民全員に100万円の税金を払わせる」\nと行政だけで決めることはできない。\n原則として、\n法律上の根拠\nが必要になる。\n\n⸻","blanks":["法律上の根拠","万円の税金"],"options":[["法律上の根拠","憲法の基本原理","予算先議権","代表民主制"],["万円の税金","国家権力","権力分立","地方公共団体"]],"mode":"constitution"}],"6":[{"text":"税金は、\n国民の財産を国家に移転させる\n制度。\nだからこそ、\n国民の代表者による国会\nが法律を制定することが重要。\n国民の財産\n↓\n課税\n↓\n国家へ\n↓\nだから\n↓\n国会による法律\n\n⸻","blanks":["国会","課税"],"options":[["国会","議決","首長","選挙"],["課税","予算","住民自治","政令"]],"mode":"constitution"}],"7":[{"text":"予算とは、\n国家が一定期間にどれだけのお金を収入・支出するかについての計画\nである。\n憲法86条は、\n内閣は、毎会計年度の予算を作成し、国会に提出して、その審議を受け議決を経なければならない。\nと定める。\n\n⸻","blanks":["予算","国会","憲法","議決","内閣"],"options":[["予算","参議院","住民自治","裁判所"],["国会","議決","社会権","財政"],["憲法","国民投票","参議院","衆議院"],["議決","地方議会","住民自治","課税"],["内閣","団体自治","国民主権","課税"]],"mode":"constitution"}],"8":[{"text":"内閣\n↓\n予算を作成\n↓\n国会へ提出\n↓\n衆議院\n↓\n参議院\n↓\n国会の議決\n↓\n国家予算\n\n⸻","blanks":["衆議院","参議院","国会","議決","予算"],"options":[["衆議院","硬性憲法","団体自治","社会権"],["参議院","憲法","団体自治","行政処分"],["国会","教育","首長","議会"],["議決","団体自治","国民主権","憲法"],["予算","住民自治","裁判所","地方自治"]],"mode":"constitution"}],"9":[{"text":"予算は、\n先に衆議院に提出\nされる。\nこれを、\n衆議院の予算先議権\nという。\n\n⸻","blanks":["予算先議権","衆議院"],"options":[["予算先議権","最高法規","通常の法律","憲法98条"],["衆議院","政令","条例","解散"]],"mode":"constitution"}],"10":[{"text":"予算について衆議院と参議院の議決が異なる場合、\n憲法60条\nにより、\n一定の場合に衆議院の議決が国会の議決となる。\nここでも、\n衆議院の優越\nが働く。\n\n⸻","blanks":["衆議院の優越","参議院","国会","憲法","議決"],"options":[["衆議院の優越","財政民主主義","万円の税金","法律上の根拠"],["参議院","憲法","条例","決算"],["国会","参政権","社会権","首長"],["憲法","衆議院","社会権","変更"],["議決","裁判所","団体自治","財政"]],"mode":"constitution"}],"11":[{"text":"予算を使った後には、\n決算\nがある。\nつまり、\n予算\n↓\nお金を使う\n↓\n決算\n↓\n実際にどう使ったか確認\nという流れ。\n\n⸻","blanks":["決算","予算"],"options":[["決算","条例","地方自治","社会権"],["予算","憲法改正","課税","財政"]],"mode":"constitution"}],"12":[{"text":"国家の財政をチェックする機関として、\n会計検査院\nがある。\n会計検査院は、\n国の収入・支出を検査\nする。\nこれにより、\n財政の適正性\nを確保する。\n\n⸻","blanks":["会計検査院","財政"],"options":[["会計検査院","万円の税金","住民自治","地方自治"],["財政","選挙","社会権","条例"]],"mode":"constitution"}],"13":[{"text":"憲法89条は、\n公金その他の公の財産を、宗教上の組織等や公の支配に属しない慈善・教育・博愛の事業に対して支出・利用させること\nについて一定の制限を設けている。\n重要なのは、\n公金の使い方にも憲法上の限界がある\nということ。\n\n⸻","blanks":["憲法","教育"],"options":[["憲法","社会権","地方議会","国民主権"],["教育","団体自治","地方自治","首長"]],"mode":"constitution"}],"14":[{"text":"財政は、\n単なるお金の問題\nではない。\n例えば、\n社会保障\n教育\n医療\n公共施設\nなど、\n基本的人権の実現\nにも財政が必要。\n財政\n↓\n国家の政策\n↓\n社会保障・教育等\n↓\n基本的人権の実現\n\n⸻","blanks":["基本的人権","教育","財政"],"options":[["基本的人権","国民投票","国民主権","経済的自由"],["教育","参議院","首長","衆議院"],["財政","議決","首長","衆議院"]],"mode":"constitution"}],"15":[{"text":"財政について、\n内閣が予算を作る\n一方、\n国会が審議・議決する。\nこれは、\n行政府だけに財政権限を集中させない\nため。\n\n⸻","blanks":["国会","議決","予算","内閣","財政"],"options":[["国会","条例","政令","国民主権"],["議決","国家権力","国民主権","選挙"],["予算","財政","国家権力","住民自治"],["内閣","国会","議決","議会"],["財政","憲法改正","首長","教育"]],"mode":"constitution"}],"16":[{"text":"地方自治とは、\n地域のことを、その地域の住民や地方公共団体が一定の範囲で自主的に決定する仕組み\nである。\n憲法92条以下に定められている。\n\n⸻","blanks":["地方公共団体","地方自治","憲法"],"options":[["地方公共団体","住民の生活","個人の尊重","法律上の根拠"],["地方自治","憲法改正","国民主権","国民投票"],["憲法","国務大臣","教育","財政"]],"mode":"constitution"}],"17":[{"text":"憲法92条は、\n地方自治の本旨\nに基づいて地方自治を保障する。\n「地方自治の本旨」には、\n住民自治\nと\n団体自治\nという2つの側面がある。\n\n⸻","blanks":["地方自治の本旨","団体自治","住民自治","憲法"],"options":[["地方自治の本旨","人権の条文集","地方公共団体の長","予算先議権"],["団体自治","代表民主制","憲法改正","最高法規"],["住民自治","個人の尊重","団体自治","人身の自由"],["憲法","内閣","変更","裁判所"]],"mode":"constitution"}],"18":[{"text":"住民自治とは、\n地域住民が地域の政治・行政に参加する\nという考え方。\n地域住民\n↓\n選挙・住民参加\n↓\n地方政治\n↓\n地域の意思決定\n\n⸻","blanks":["住民自治","選挙"],"options":[["住民自治","参政権","大規模災害","住民の生活"],["選挙","参議院","衆議院","決算"]],"mode":"constitution"}],"19":[{"text":"団体自治とは、\n国から独立した地方公共団体が、地域の事務を自主的に処理する\nという考え方。\n国\n│\n├── 地方公共団体\n│     ↓\n│    地域の事務\n│     ↓\n│    自主的に処理\n\n⸻","blanks":["団体自治","地方公共団体"],"options":[["団体自治","国家権力","立憲主義","人身の自由"],["地方公共団体","予算先議権","憲法と法律","財政民主主義"]],"mode":"constitution"}],"20":[{"text":"地方公共団体には、\n都道府県\n市区町村\nなどがある。\n地方自治の中心的な主体となる。\n\n⸻","blanks":["地方公共団体","地方自治"],"options":[["地方公共団体","住民の生活","憲法改正の限界","人権の条文集"],["地方自治","代表民主制","最高法規性","会計検査院"]],"mode":"constitution"}],"21":[{"text":"地方公共団体には、\n議会\nが置かれる。\n議会は、\n条例\n予算\nなどについて議決する。\n\n⸻","blanks":["地方公共団体","条例","議会","議決","予算"],"options":[["地方公共団体","基本的人権","大規模災害","法律上の根拠"],["条例","教育","内閣","裁判所"],["議会","国家権力","国民投票","衆議院"],["議決","憲法改正","参政権","参議院"],["予算","地方自治","国民投票","社会権"]],"mode":"constitution"}],"22":[{"text":"地方公共団体には、\n首長\nがいる。\n例えば、\n都道府県知事\n市町村長\nなど。\n住民が直接選挙する。\n\n⸻","blanks":["地方公共団体","首長","選挙"],"options":[["地方公共団体","経済的自由","憲法改正の限界","憲法の内容"],["首長","国民投票","国民主権","社会権"],["選挙","内閣","衆議院","裁判所"]],"mode":"constitution"}],"23":[{"text":"地方議会の議員も、\n住民による直接選挙\nで選ばれる。\nここに、\n住民自治\nが表れる。\n\n⸻","blanks":["地方議会","住民自治","選挙"],"options":[["地方議会","会計検査院","国民投票","国民主権"],["住民自治","参議院","国務大臣","国家権力"],["選挙","憲法改正","議決","参議院"]],"mode":"constitution"}],"24":[{"text":"地域住民\n│\n┌───┴───┐\n↓       ↓\n議会      首長\n│       │\n└───┬───┘\n↓\n地方公共団体\n↓\n地方行政\n\n⸻","blanks":["地方公共団体","議会","首長"],"options":[["地方公共団体","住民の生活","地方自治の本旨","衆議院の優越"],["議会","国民主権","参政権","住民自治"],["首長","国家権力","地方議会","裁判所"]],"mode":"constitution"}],"25":[{"text":"地方公共団体は、\n条例\nを制定することができる。\n条例とは、\n地方公共団体が地域の事務について制定する自主的なルール\nである。\n\n⸻","blanks":["条例","地方公共団体"],"options":[["条例","地方自治","決算","社会権"],["地方公共団体","最高法規性","法律上の根拠","人身の自由"]],"mode":"constitution"}],"26":[{"text":"条例は、\n国の法律より上位\nではない。\n憲法\n↓\n法律\n↓\n条例\n↓\n地方行政\nという関係で理解する。\nただし、\n条例は地域の実情に応じた独自の規律\nを作ることができる。\n\n⸻","blanks":["条例","憲法"],"options":[["条例","住民自治","憲法改正","予算"],["憲法","地方議会","天皇","住民自治"]],"mode":"constitution"}],"27":[{"text":"地方公共団体が自由に何でも決められるわけではない。\n地方自治も、\n憲法\n法律\nの範囲内で行われる。\nしたがって、\n地方自治＝国から完全に独立\nではない。\n\n⸻","blanks":["地方公共団体","地方自治","憲法"],"options":[["地方公共団体","地方自治の本旨","憲法改正の限界","個人の尊重"],["地方自治","憲法と法律","権力分立","行政処分"],["憲法","衆議院","選挙","地方自治"]],"mode":"constitution"}],"28":[{"text":"地方自治では、\n地域住民\nが重要な主体。\n住民は、\n選挙\n直接請求\nなどを通じて地方政治に関与できる。\n\n⸻","blanks":["地方自治","選挙"],"options":[["地方自治","憲法98条","住民の生活","国家権力"],["選挙","国会","裁判所","参議院"]],"mode":"constitution"}],"29":[{"text":"地方自治には、\n直接民主制的な制度\nも存在する。\n例えば、\n条例制定・改廃の請求\n監査請求\n議会解散請求\n議員・長の解職請求\nなど。\n\n⸻","blanks":["地方自治","条例","議会","解散"],"options":[["地方自治","国民主権","個人の尊重","参議院"],["条例","裁判所","選挙","参政権"],["議会","憲法","議決","解散"],["解散","国務大臣","地方議会","国家権力"]],"mode":"constitution"}],"30":[{"text":"地方自治は、\n国政だけではなく、\n地域レベルでも民主主義を実現する\n仕組み。\n国政\n↓\n国会\n↓\n代表民主制\n\n地方\n↓\n地方議会・首長\n↓\n住民自治＋団体自治\n\n⸻","blanks":["代表民主制","地方自治","団体自治","地方議会","住民自治"],"options":[["代表民主制","地方議会","人権の条文集","国務大臣"],["地方自治","住民自治","憲法の内容","行政処分"],["団体自治","住民の生活","憲法と法律","国民投票"],["地方議会","国民投票","地方自治","硬性憲法"],["住民自治","参議院","国民投票","国民主権"]],"mode":"constitution"}],"31":[{"text":"地方自治は、\n人権保障\nとも関係する。\n地域によって、\n住民の生活に必要な行政サービス\nを提供するから。\n\n⸻","blanks":["地方自治","住民の生活"],"options":[["地方自治","最高法規","基本的人権","国務大臣"],["住民の生活","人身の自由","地方自治","権力分立"]],"mode":"constitution"}],"32":[{"text":"これまで行政法で学んだ、\n行政主体\n行政機関\n行政行為\n条例\n地方公共団体\nなどが、\n憲法92条以下\nとつながる。\n\n⸻","blanks":["地方公共団体","条例","憲法"],"options":[["地方公共団体","経済的自由","最高裁判所","通常の法律"],["条例","予算","内閣","地方議会"],["憲法","変更","天皇","選挙"]],"mode":"constitution"}],"33":[{"text":"ここから最後のテーマ。\n憲法保障とは、\n憲法の内容を実際に守り、憲法の最高法規性を確保する仕組み\nである。\n\n⸻","blanks":["憲法の最高法規性","憲法の内容"],"options":[["憲法の最高法規性","基本的人権","代表民主制","内閣総理大臣"],["憲法の内容","地方公共団体","憲法と法律","住民の生活"]],"mode":"constitution"}],"34":[{"text":"憲法に、\n「人権を保障します」\nと書くだけでは不十分。\n国家が憲法に違反した場合、\nそれを止める仕組み\nが必要。\n\n⸻","blanks":["人権を保障します","憲法"],"options":[["人権を保障します","憲法の基本原理","法律上の根拠","憲法の最高法規性"],["憲法","住民自治","裁判所","首長"]],"mode":"constitution"}],"35":[{"text":"憲法保障\n│\n├─ 最高法規性\n│\n├─ 憲法尊重擁護義務\n│\n├─ 違憲審査制\n│\n├─ 権力分立\n│\n├─ 国民主権\n│\n└─ 国民による政治的統制\n\n⸻","blanks":["憲法尊重擁護義務","最高法規性","違憲審査制","国民主権","権力分立"],"options":[["憲法尊重擁護義務","人権を保障します","憲法保障の仕組み","大規模災害"],["最高法規性","憲法の内容","地方自治","通常の法律"],["違憲審査制","最高法規","住民の生活","権力分立"],["国民主権","基本的人権","参議院","憲法98条"],["権力分立","住民自治","国家権力","国務大臣"]],"mode":"constitution"}],"36":[{"text":"憲法98条1項は、\nこの憲法は、国の最高法規であって、その条規に反する法律、命令、詔勅及び国務に関するその他の行為の全部又は一部は、その効力を有しない。\nと定める。\nつまり、\n憲法より下位の国家作用は、憲法に反してはならない。\n\n⸻","blanks":["憲法98条","最高法規"],"options":[["憲法98条","住民自治","最高法規","会計検査院"],["最高法規","参議院","万円の税金","憲法98条"]],"mode":"constitution"}],"37":[{"text":"憲法\n↓\n最高法規\n↓\n法律\n↓\n政令・省令\n↓\n行政処分\n下位の国家作用は、\n上位の法規範に従わなければならない。\n\n⸻","blanks":["行政処分","最高法規","憲法","政令"],"options":[["行政処分","憲法と法律","最高法規性","地方自治"],["最高法規","国家権力","立憲主義","憲法と法律"],["憲法","国務大臣","決算","政令"],["政令","変更","国民主権","地方自治"]],"mode":"constitution"}],"38":[{"text":"憲法99条は、\n天皇又は摂政及び国務大臣、国会議員、裁判官その他の公務員\nに憲法を尊重し擁護する義務を課している。\n重要なのは、\n国家権力を担う者こそ憲法を守らなければならない\nということ。\n\n⸻","blanks":["国務大臣","国会","天皇","憲法"],"options":[["国務大臣","会計検査院","国民主権","人身の自由"],["国会","条例","憲法","選挙"],["天皇","憲法","社会権","地方自治"],["憲法","社会権","議会","議決"]],"mode":"constitution"}],"39":[{"text":"憲法は、\n国家権力を制限するための法\nでもある。\nだから、\n国家権力\n↓\n憲法によって制限\n↓\n国家機関・公務員\n↓\n憲法を尊重・擁護\nとなる。\n\n⸻","blanks":["憲法","国家権力"],"options":[["憲法","教育","財政","選挙"],["国家権力","憲法の内容","権力分立","憲法改正"]],"mode":"constitution"}],"40":[{"text":"第9編で学んだ、\n違憲審査制\nも憲法保障の中心。\n法律\n↓\n具体的事件\n↓\n裁判所\n↓\n憲法適合性を審査\n↓\n違憲なら効力を否定\n\n⸻","blanks":["違憲審査制","裁判所","憲法"],"options":[["違憲審査制","大規模災害","国民主権","最高法規性"],["裁判所","内閣","最高法規","参議院"],["憲法","条例","決算","変更"]],"mode":"constitution"}],"41":[{"text":"最高裁判所は、\n憲法81条\nにより、\n法律・命令・規則・処分等の憲法適合性について最終的に判断する権限\nを持つ。\n\n⸻","blanks":["最高裁判所","憲法"],"options":[["最高裁判所","会計検査院","国家権力","基本的人権"],["憲法","選挙","国民主権","参政権"]],"mode":"constitution"}],"42":[{"text":"国会は、\n憲法を守る側\nでもあり、\n憲法によって制限される側\nでもある。\nつまり、\n国会\n↓\n法律を制定\n↓\nしかし\n↓\n憲法に拘束される\n↓\n違憲審査の対象になり得る\n\n⸻","blanks":["違憲審査の対象","国会","憲法"],"options":[["違憲審査の対象","地方自治と行政法","地方公共団体の長","個人の尊重"],["国会","団体自治","予算","課税"],["憲法","住民自治","内閣","選挙"]],"mode":"constitution"}],"43":[{"text":"内閣も、\n憲法に拘束される。\n例えば、\n違法・違憲な行政処分\nを行えば、\n裁判所による審査\nの対象となる可能性がある。\n\n⸻","blanks":["行政処分","裁判所","憲法","内閣"],"options":[["行政処分","憲法と法律","硬性憲法","代表民主制"],["裁判所","衆議院","住民自治","行政処分"],["憲法","天皇","参政権","決算"],["内閣","議決","憲法改正","国民主権"]],"mode":"constitution"}],"44":[{"text":"裁判所自身も、\n憲法に拘束される。\n裁判官は、\n憲法と法律に従って職務を行う。\nそして、\n他の国家機関の違憲・違法な行為\nを審査する。\n\n⸻","blanks":["憲法と法律","裁判所"],"options":[["憲法と法律","代表民主制","違憲審査制","経済的自由"],["裁判所","最高法規","教育","変更"]],"mode":"constitution"}],"45":[{"text":"憲法保障は、\n国家機関だけ\nの問題ではない。\n国民も、\n選挙\n裁判\n政治参加\nなどを通じて、\n憲法秩序を支える。\n\n⸻","blanks":["憲法","選挙"],"options":[["憲法","教育","内閣","条例"],["選挙","憲法改正","天皇","財政"]],"mode":"constitution"}],"46":[{"text":"憲法そのものを変更する制度が、\n憲法改正\nである。\n憲法96条に定められている。\n\n⸻","blanks":["憲法改正","変更"],"options":[["憲法改正","住民自治","会計検査院","憲法の内容"],["変更","裁判所","課税","財政"]],"mode":"constitution"}],"47":[{"text":"憲法改正には、\n各議院の総議員の3分の2以上の賛成\nによる国会の発議が必要。\n衆議院\n総議員の2/3以上\n+\n参議院\n総議員の2/3以上\n↓\n国会が発議\n\n⸻","blanks":["憲法改正","衆議院","参議院","国会"],"options":[["憲法改正","立憲主義","硬性憲法","法の支配"],["衆議院","憲法","地方自治","社会権"],["参議院","権力分立","地方自治","変更"],["国会","決算","国務大臣","教育"]],"mode":"constitution"}],"48":[{"text":"国会が発議した後、\n国民の承認\nを受ける必要がある。\nつまり、\n国会\n↓\n改正発議\n↓\n国民投票\n↓\n過半数の賛成\n↓\n憲法改正\nという流れ。\n\n⸻","blanks":["国民投票","憲法改正","国会"],"options":[["国民投票","予算先議権","住民自治","大規模災害"],["憲法改正","国家権力","会計検査院","予算先議権"],["国会","憲法","参議院","議決"]],"mode":"constitution"}],"49":[{"text":"憲法は、\n国家の基本ルール\nであり、\n国民の権利・統治構造\nを定める。\nだから、\n国会だけで自由に変更できる\nのではなく、\n最終的に国民の承認\nを必要とする。\n\n⸻","blanks":["国会","憲法"],"options":[["国会","予算","教育","衆議院"],["憲法","国務大臣","決算","天皇"]],"mode":"constitution"}],"50":[{"text":"日本国憲法は、\n硬性憲法\nである。\nつまり、\n通常の法律よりも厳格な手続によって改正する。\n通常の法律\n↓\n国会の通常の議決\n\n憲法改正\n↓\n国会の厳格な発議要件\n↓\n国民投票\n\n⸻","blanks":["硬性憲法","憲法改正","国民投票","国会","議決"],"options":[["硬性憲法","地方議会","憲法改正","会計検査院"],["憲法改正","国民主権","憲法98条","予算先議権"],["国民投票","行政処分","憲法と法律","憲法改正"],["国会","政令","変更","条例"],["議決","参政権","国会","国務大臣"]],"mode":"constitution"}],"51":[{"text":"憲法を守るために、\n改正手続\n自体も重要。\n憲法96条に従わず、\n通常の法律と同じ方法で憲法を変更する\nことはできない。\n\n⸻","blanks":["憲法","通常の法律"],"options":[["憲法","財政","条例","地方自治"],["通常の法律","国民投票","内閣総理大臣","住民の生活"]],"mode":"constitution"}],"52":[{"text":"憲法改正については、\n改正権にも限界があるのか\nという理論上の問題がある。\nこれは、\n憲法改正の限界\nという論点。\n基礎段階では、\n憲法の基本原理を根本から破壊するような改正が許されるのか\nという問題として理解しておけばよい。\n\n⸻","blanks":["憲法改正の限界","憲法の基本原理"],"options":[["憲法改正の限界","地方公共団体の長","地方自治と民主主義","財政民主主義"],["憲法の基本原理","憲法と法律","憲法尊重擁護義務","地方自治と行政法"]],"mode":"constitution"}],"53":[{"text":"大規模災害・戦争などの緊急事態では、\n国家が通常とは異なる対応\nを迫られることがある。\nしかし、\n緊急事態だから憲法を無視してよい\nわけではない。\nむしろ、\n緊急時こそ国家権力をどう統制するか\nが重要になる。\n\n⸻","blanks":["憲法","大規模災害"],"options":[["憲法","衆議院","参政権","社会権"],["大規模災害","地方議会","国務大臣","万円の税金"]],"mode":"constitution"}],"54":[{"text":"国会\n↓\n立法\n\n内閣\n↓\n行政\n\n裁判所\n↓\n司法\nそれぞれを分けることで、\n一つの機関に権力が集中すること\nを防ぐ。\nしたがって、\n権力分立そのものが憲法保障の仕組み\nでもある。\n\n⸻","blanks":["憲法保障の仕組み","権力分立","裁判所","国会","内閣"],"options":[["憲法保障の仕組み","憲法の最高法規性","内閣総理大臣","大規模災害"],["権力分立","団体自治","万円の税金","参政権"],["裁判所","憲法改正","団体自治","参政権"],["国会","国家権力","天皇","決算"],["内閣","参政権","憲法改正","地方議会"]],"mode":"constitution"}],"55":[{"text":"憲法\n│\n┌──────┴──────┐\n↓             ↓\n基本原理        基本的人権\n│             │\n└──────┬──────┘\n↓\n国家権力\n│\n┌────────────┼────────────┐\n↓            ↓            ↓\n国会          内閣         裁判所\n立法           行政          司法\n│            │             │\n└────────────┼────────────┘\n↓\n相互抑制\n↓\n憲法保障\n↓\n人権保障\n\n⸻","blanks":["基本的人権","裁判所","国会","憲法","内閣"],"options":[["基本的人権","最高法規性","違憲審査制","予算先議権"],["裁判所","国民主権","変更","憲法改正"],["国会","政令","首長","憲法改正"],["憲法","議決","天皇","課税"],["内閣","地方議会","議会","政令"]],"mode":"constitution"}],"56":[{"text":"行政が、\n法律上の根拠なく新しい税金を徴収しようとした。\n↓\n憲法84条\n↓\n租税法律主義\n↓\n法律上の根拠があるか。\n↓\nなければ憲法上問題となる。\n\n⸻","blanks":["租税法律主義","憲法"],"options":[["租税法律主義","住民自治","憲法の基本原理","個人の尊重"],["憲法","条例","憲法改正","内閣"]],"mode":"constitution"}],"57":[{"text":"市が、\n地域の事情に応じた条例\nを制定した。\n↓\n地方自治\n↓\n憲法94条\n↓\n条例制定権\n↓\nただし、\n憲法・法律との関係\nを確認。\n\n⸻","blanks":["地方自治","条例","憲法"],"options":[["地方自治","違憲審査","地方議会","国民投票"],["条例","内閣","財政","団体自治"],["憲法","内閣","国会","変更"]],"mode":"constitution"}],"58":[{"text":"国会が、\n基本的人権を過度に制約する法律\nを制定。\n↓\nその法律が具体的事件に適用される。\n↓\n裁判所\n↓\n違憲審査\n↓\n憲法違反か判断。\n\n⸻","blanks":["基本的人権","違憲審査","裁判所","国会","憲法"],"options":[["基本的人権","住民の生活","住民自治","人権の条文集"],["違憲審査","国民投票","憲法98条","行政処分"],["裁判所","国民投票","地方自治","国務大臣"],["国会","憲法改正","政令","決算"],["憲法","衆議院","社会権","国家権力"]],"mode":"constitution"}],"59":[{"text":"国会が、\n憲法を変更したい\nと考えた。\n↓\n各議院の総議員の3分の2以上\n↓\n国会が発議\n↓\n国民投票\n↓\n承認\n↓\n改正成立。\n\n⸻","blanks":["国民投票","国会","憲法"],"options":[["国民投票","憲法98条","予算先議権","会計検査院"],["国会","予算","決算","国民投票"],["憲法","憲法改正","天皇","予算"]],"mode":"constitution"}],"60":[{"text":"これで第1編から第10編までがつながる。\n日本国憲法\n│\n┌────────────────────────┐\n↓                        ↓\n基本原理                   統治機構\n│                        │\n国民主権・人権・平和        権力分立\n立憲主義・法の支配            │\n│               ┌──────┼──────┐\n│               ↓      ↓      ↓\n│             国会    内閣   裁判所\n│             立法    行政    司法\n│               │      │      │\n│               └──────┼──────┘\n│                      ↓\n│                   相互抑制\n│                      ↓\n└────────────────→ 憲法保障\n│\n↓\n人権保障\n\n⸻","blanks":["国民主権","権力分立","立憲主義","法の支配","裁判所"],"options":[["国民主権","憲法の内容","団体自治","憲法改正"],["権力分立","法の支配","地方自治","憲法98条"],["立憲主義","大規模災害","権力分立","会計検査院"],["法の支配","最高法規","国民主権","会計検査院"],["裁判所","解散","衆議院","国務大臣"]],"mode":"constitution"}],"61":[{"text":"憲法は、\n「人権の条文集」\nでも、\n「国家機関の説明書」\nだけでもない。\n本質的には、\n国家権力を憲法によって組織し、制限し、その中で基本的人権を保障するための基本法\nである。\n\n⸻","blanks":["人権の条文集","国家機関の説明書","基本的人権","憲法"],"options":[["人権の条文集","会計検査院","人権を保障します","憲法改正の限界"],["国家機関の説明書","地方自治と民主主義","地方公共団体","衆議院の優越"],["基本的人権","万円の税金","憲法改正","憲法の内容"],["憲法","天皇","内閣","参政権"]],"mode":"constitution"}],"62":[{"text":"個人の尊重\n↓\n基本的人権\n↓\n国家権力を制限\n↓\n立憲主義\n↓\n権力分立\n↓\n国会・内閣・裁判所\n↓\n相互抑制\n↓\n違憲審査\n↓\n憲法保障\n↓\n人権の実効的保障\n\n⸻","blanks":["個人の尊重","基本的人権","違憲審査","権力分立","立憲主義"],"options":[["個人の尊重","経済的自由","国務大臣","地方公共団体"],["基本的人権","違憲審査制","最高法規","憲法と法律"],["違憲審査","基本的人権","国民主権","最高法規"],["権力分立","参政権","憲法98条","住民自治"],["立憲主義","基本的人権","参政権","最高法規性"]],"mode":"constitution"}],"63":[{"text":"さらに、\n国民\n↓\n主権者\n↓\n選挙\n↓\n国会\n↓\n内閣総理大臣\n↓\n内閣\n↓\n行政\nという民主的正統性がある。\nしたがって、\n立憲主義だけでも、民主主義だけでも不十分。\n日本国憲法は、\n立憲主義と民主主義を組み合わせている。\n\n⸻","blanks":["内閣総理大臣","立憲主義","国会","憲法","選挙"],"options":[["内閣総理大臣","憲法の基本原理","経済的自由","第10編の核心"],["立憲主義","違憲審査","地方議会","行政処分"],["国会","参議院","裁判所","内閣"],["憲法","国家権力","選挙","議会"],["選挙","衆議院","条例","天皇"]],"mode":"constitution"}],"64":[{"text":"人権についても、\n精神的自由\n↓\n経済的自由\n↓\n人身の自由\n↓\n社会権\n↓\n参政権\n↓\n受益権\nという広がりがある。\nそして、\n人権を実際に守るために、\n国会・内閣・裁判所\nという統治機構が存在する。\n\n⸻","blanks":["経済的自由","人身の自由","参政権","裁判所","社会権"],"options":[["経済的自由","万円の税金","国民主権","団体自治"],["人身の自由","憲法と法律","人権の条文集","最高法規"],["参政権","教育","国民投票","条例"],["裁判所","解散","政令","国務大臣"],["社会権","地方自治","条例","教育"]],"mode":"constitution"}],"65":[{"text":"国家には、\n人権を保障するための財政\nも必要。\n国民\n↓\n租税\n↓\n国家財政\n↓\n予算\n↓\n社会保障・教育・行政等\n↓\n人権保障\nしたがって、\n財政も憲法秩序の一部\nである。\n\n⸻","blanks":["憲法","教育","予算","財政"],"options":[["憲法","首長","選挙","政令"],["教育","予算","内閣","課税"],["予算","国民投票","天皇","解散"],["財政","国民投票","裁判所","国務大臣"]],"mode":"constitution"}],"66":[{"text":"国だけでなく、\n地方公共団体\nにも民主主義と行政が存在する。\n国\n↓\n国政\n↓\n国会・内閣\n\n地方\n↓\n地方自治\n↓\n議会・首長\n↓\n住民自治\nつまり、\n民主主義は国政だけでなく地方にも及ぶ。\n\n⸻","blanks":["地方公共団体","地方自治","住民自治","国会","議会"],"options":[["地方公共団体","最高裁判所","代表民主制","違憲審査の対象"],["地方自治","大規模災害","行政処分","国民主権"],["住民自治","参政権","基本的人権","憲法98条"],["国会","教育","国務大臣","内閣"],["議会","参議院","参政権","地方議会"]],"mode":"constitution"}],"67":[{"text":"憲法\n│\n┌───────────┼───────────┐\n↓           ↓           ↓\n国民主権      人権保障     権力分立\n│           │           │\n└───────────┼───────────┘\n↓\n統治機構\n│\n┌──────────┼──────────┐\n↓          ↓          ↓\n国会        内閣       裁判所\n│          │          │\n立法        行政        司法\n└──────────┼──────────┘\n↓\n相互抑制\n↓\n違憲審査\n↓\n憲法保障\n↓\n人権保障\n\n⸻","blanks":["違憲審査","国民主権","権力分立","裁判所","国会"],"options":[["違憲審査","会計検査院","最高法規","国民投票"],["国民主権","最高法規","住民自治","予算先議権"],["権力分立","予算先議権","最高法規","団体自治"],["裁判所","国家権力","国会","国務大臣"],["国会","選挙","裁判所","決算"]],"mode":"constitution"}],"68":[{"text":"第10編の核心は、\n国家には強大な権力と財政力があるからこそ、それを憲法によってコントロールしなければならない\nということ。\n財政では、\n国会による財政統制\n地方自治では、\n住民による地域政治への参加\n憲法保障では、\n憲法の最高法規性と違憲審査\nが重要になる。\n\n⸻","blanks":["第10編の核心","憲法の最高法規性","違憲審査","地方自治","国会"],"options":[["第10編の核心","内閣総理大臣","国家機関の説明書","憲法の最高法規性"],["憲法の最高法規性","憲法尊重擁護義務","地方公共団体の長","違憲審査の対象"],["違憲審査","国務大臣","団体自治","行政処分"],["地方自治","国家権力","法の支配","人身の自由"],["国会","選挙","国務大臣","地方自治"]],"mode":"constitution"}],"69":[{"text":"財政\n1.\t財政とは何か。\n2.\tなぜ財政を憲法で規律するのか。\n3.\t財政民主主義とは何か。\n4.\t租税法律主義とは何か。\n5.\t憲法84条は何を定めるか。\n6.\t予算とは何か。\n7.\t予算は誰が作成するか。\n8.\t予算について国会は何をするか。\n9.\t会計検査院とは何か。\n10.\t公金支出にはどのような憲法上の制限があるか。\n地方自治\n11.\t地方自治とは何か。\n12.\t地方自治の本旨とは？\n13.\t住民自治とは？\n14.\t団体自治とは？\n15.\t地方議会とは？\n16.\t地方公共団体の長とは？\n17.\t条例とは？\n18.\t条例と法律の関係は？\n19.\t地方自治と民主主義はどうつながるか。\n20.\t地方自治と行政法はどうつながるか。\n憲法保障\n21.\t憲法保障とは？\n22.\tなぜ憲法保障が必要なのか。\n23.\t憲法98条1項の意味は？\n24.\t憲法99条の義務を負うのは誰か。\n25.\t違憲審査制が憲法保障になる理由は？\n26.\t権力分立が憲法保障になる理由は？\n27.\t国会も憲法に拘束される理由は？\n28.\t内閣も憲法に拘束される理由は？\n29.\t裁判所と憲法保障の関係は？\n憲法改正\n30.\t憲法改正とは？\n31.\t憲法96条は何を定めるか。\n32.\t改正発議にはどの程度の賛成が必要か。\n33.\t国民投票が必要な理由は？\n34.\t硬性憲法とは？\n35.\t憲法改正の限界とは？\n総合\n36.\t財政民主主義と国民主権の関係を説明せよ。\n37.\t地方自治と民主主義の関係を説明せよ。\n38.\t憲法98条と違憲審査の関係を説明せよ。\n39.\t憲法99条と立憲主義の関係を説明せよ。\n40.\t憲法保障と権力分立の関係を説明せよ。\n41.\t国会・内閣・裁判所を憲法保障の観点から説明せよ。\n42.\t第1編から第10編までを一本の体系として説明せよ。\n\n⸻","blanks":["なぜ憲法保障が必要なのか","地方自治と民主主義","憲法保障と権力分立","地方自治と行政法","地方公共団体の長"],"options":[["なぜ憲法保障が必要なのか","地方公共団体の長","財政民主主義","万円の税金"],["地方自治と民主主義","代表民主制","憲法改正の限界","地方自治の本旨"],["憲法保障と権力分立","憲法保障の仕組み","内閣総理大臣","予算先議権"],["地方自治と行政法","第10編の核心","予算先議権","大規模災害"],["地方公共団体の長","租税法律主義","財政民主主義","大規模災害"]],"mode":"constitution"}],"70":[{"text":"第10編を一言でまとめると、\n国家の財政・地方自治・憲法保障を通じて、憲法秩序を実際に維持する仕組み\nである。\n国民\n↓\n国民主権\n↓\n選挙\n↓\n国会\n↓\n法律・予算\n↓\n内閣\n↓\n行政\n↓\n地方公共団体\n↓\n国民生活\nそして、そのすべての上に、\n憲法\nがある。\n憲法\n↓\n┌────────────┐\n↓            ↓\n国家権力       基本的人権\n↓            ↓\n国会・内閣・裁判所\n↓\n相互抑制\n↓\n違憲審査\n↓\n憲法保障\n↓\n人権保障\n最終的に憲法を理解するための核心は、\n「国民が主権者であり、国家権力は憲法によって組織・制限され、その目的として基本的人権が保障される」\nという一点に集約できる。\n\n⸻\n\n憲法 基礎本――全10編 完成\n第1編　憲法総論\n↓\n第2編　基本的人権総論\n↓\n第3編　精神的自由\n↓\n第4編　経済的自由・人身の自由\n↓\n第5編　社会権・参政権・受益権\n↓\n第6編　国民の義務・基本的人権の総合整理\n↓\n第7編　国会\n↓\n第8編　内閣\n↓\n第9編　裁判所・司法\n↓\n第10編　財政・地方自治・憲法保障\nこれで、\n憲法の基本原理\n\n↓\n\n基本的人権\n\n↓\n\n統治機構\n\n↓\n\n憲法保障\nまで、一通りの体系が完成した。","blanks":["地方公共団体","経済的自由","基本的人権","人身の自由","違憲審査"],"options":[["地方公共団体","会計検査院","憲法98条","違憲審査の対象"],["経済的自由","住民の生活","憲法と法律","国民主権"],["基本的人権","万円の税金","地方公共団体","大規模災害"],["人身の自由","団体自治","代表民主制","違憲審査制"],["違憲審査","大規模災害","最高法規","立憲主義"]],"mode":"constitution"}]}}};

\n債権 → 人に対する請求\n親族 → 家族関係\n相続 → 死亡による権利義務の承継\n⸻","blanks":["民法","結婚・離婚する","総則"],"options":[["民法","総則","胎児","法人"],["結婚・離婚する","必ず絶対に従う","というケース。","貸金返還請求権"],["総則","民法","胎児","法人"]],"mode":"civil"},"2":{"text":"1　権利能力平等の原則\n原則として、人は誰でも権利・義務の主体となることができる。\nこれを権利能力という。\n例えば、\nAが土地を所有する\nという場合、Aが「権利の主体」になることができる必要がある。\n⸻\n2　私的自治の原則\n民法の非常に重要な考え方である。\n私人間の法律関係は、原則として当事者自身の意思によって決定する。\n例えば、\nA「この車を100万円で売ります」\nB「買います」\n↓\n売買契約成立\nというように、国家が一方的に内容を決めるのではなく、当事者の意思を基本として法律関係が形成される。\n⸻\n3　契約自由の原則\n私的自治の具体的な現れの一つ。\n原則として、\n•\t誰と契約するか\n•\t契約するかどうか\n•\tどのような内容にするか\n•\tどのような方式にするか\nを当事者が自由に決定できる。\nただし、自由には限界がある。\n例えば、\n「犯罪を行う契約」\nなどを自由だからといって認めることはできない。\nしたがって、\n私的自治・契約自由\n↓\n原則として自由\n↓\nしかし法律・公序良俗などによる制限がある\nという構造になる。\n⸻\n4　信義則\n民法1条2項は、権利の行使・義務の履行について、信義に従い誠実に行わなければならないという考え方を定めている。\nつまり、\n「権利だから何をしてもいい」\nわけではない。\n法律上の権利を持っていても、その行使が信義に反する場合には問題となる。\n⸻\n5　権利濫用禁止\n民法1条3項は、権利の濫用を許さない。\nつまり、\n権利を持っていることと、その権利をどのように行使しても許されることは別\nである。\n例\nAが土地の所有権を持っている。\nしかし、AがBを嫌がらせする目的だけで、極端に不合理な方法で所有権を行使する。\n↓\n所有権がある ≠ どんな行使でも許される\n⸻","blanks":["権利能力","権利の主体","この車を100万円で売ります","買います"],"options":[["権利能力","買います","意思能力","法律行為"],["権利の主体","土地を買う","次の「物権","Aの所有権"],["この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情","契約当事者以外なら全員第三者"],["買います","権利能力","意思能力","法律行為"]],"mode":"civil"},"3":{"text":"1　権利能力\n権利能力＝権利・義務の主体となることができる資格\n自然人については、原則として出生によって取得し、死亡によって失う。\n例えば、\n「土地を所有できる」\nというのは権利能力があるからである。\n⸻\n2　胎児\n胎児は原則としてまだ出生していないため、通常の権利能力を持つとは扱われない。\nしかし、民法は一定の場合に胎児を保護している。\n特に重要なのが、\n•\t損害賠償請求\n•\t相続\n•\t遺贈\nである。\nしたがって、\n胎児＝完全に法律上無関係\nではない。\n⸻\n3　意思能力\n意思能力＝自分の行為の意味・結果を理解する能力\n例えば、\n「100万円で車を買う」\nという行為について、その意味を理解できる能力が必要になる。\n意思能力を欠く状態でされた法律行為については、法律上の効力が問題となる。\n⸻\n4　行為能力\n意思能力とは別に、民法では一定の者について、単独で完全に有効な法律行為をする能力を制限する制度がある。\nこれが行為能力である。\n代表的なのが、\n•\t未成年者\n•\t成年被後見人\n•\t被保佐人\n•\t被補助人\nである。\n⸻\n5　未成年者\n現在の民法では、成年年齢は18歳。\n未成年者が法律行為をする場合、原則として法定代理人の同意が問題となる。\n基本構造\n未成年者\n↓\n法律行為\n↓\n原則として法定代理人の同意が必要\n↓\n同意なく行った一定の行為\n↓\n取り消すことができる\nただし、未成年者に認められた一定の行為については例外がある。\n⸻\n6　成年被後見人\n成年被後見人は、事理を弁識する能力を欠く常況にある者について、家庭裁判所が後見開始の審判をした場合の制度である。\n成年被後見人の法律行為については、原則として取消しの対象となる。\nただし、日用品の購入その他日常生活に関する行為については取消しの対象とならない。\n⸻\n7　被保佐人・被補助人\n成年被後見人ほど強い制限を必要としない者について、\n•\t保佐\n•\t補助\nという制度が用意されている。\n重要なのは、\n制限の程度が同じではない\nということである。\nイメージ\n成年被後見人 → 制限が強い\n被保佐人 → 中間\n被補助人 → より限定的\n⸻","blanks":["権利能力","胎児","完全に法律上無関係","意思能力"],"options":[["権利能力","買います","意思能力","法律行為"],["胎児","民法","総則","法人"],["完全に法律上無関係","その契約を認めます","Bには代理権がある","○年が経過したとき"],["意思能力","権利能力","買います","法律行為"]],"mode":"civil"},"4":{"text":"1　法人とは\n法人とは、\n法律によって権利・義務の主体として認められた団体等\nである。\n通常、団体そのものは自然人ではない。\nしかし法律上、\n「この団体を一つの権利・義務の主体として扱おう」\nとすることで、法人として活動できる。\n⸻\n2　法人の基本構造\n例えば会社。\n会社が、\n•\t土地を買う\n•\tお金を借りる\n•\t従業員を雇う\n•\t契約する\nことができるのは、会社自体が法人として権利・義務の主体となっているからである。\n⸻\n3　法人と個人の区別\n会社の財産\n≠\n社長個人の財産\n原則として、\n法人の法律関係と構成員個人の法律関係は別\nである。\nこれが法人格の重要な意味である。\n⸻\n4　法人の機関\n法人は人間そのものではない。\nそこで、\n「誰が法人の意思を形成し、誰が法人を代表するのか」\nという問題が生じる。\nこれが法人の機関の問題である。\n例えば株式会社では、代表取締役などが法人を代表して活動する。\n⸻","blanks":["法人","土地を買う","お金を借りる","従業員を雇う"],"options":[["法人","民法","総則","胎児"],["土地を買う","権利の主体","次の「物権","Aの所有権"],["お金を借りる","従業員を雇う","典型的には、","物権法定主義"],["従業員を雇う","お金を借りる","典型的には、","物権法定主義"]],"mode":"civil"},"5":{"text":"1　法律行為とは\n法律行為とは、簡単にいうと、\n当事者の意思表示に基づいて、法律上の効果を発生させる行為\nである。\n代表例が契約。\n例\nA「この車を100万円で売る」\nB「買う」\n↓\n意思表示\n↓\n売買契約\n↓\n法律上の権利・義務が発生\n⸻\n2　法律行為の基本構造\n法律行為\n↓\n意思表示\n↓\n法律上の効果\nという流れで理解する。\nただし、意思表示があれば必ず有効になるわけではない。\n例えば、\n•\t錯誤\n•\t詐欺\n•\t強迫\n•\t公序良俗違反\n•\t内容の違法性\nなどによって、効力が否定・制限されることがある。\n⸻","blanks":["法律行為","この車を100万円で売る","買う","錯誤"],"options":[["法律行為","権利能力","買います","意思能力"],["この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか","他人の土地を利用する権利"],["買う","民法","総則","胎児"],["錯誤","民法","総則","胎児"]],"mode":"civil"},"6":{"text":"1　意思表示とは\n意思表示とは、\n一定の法律効果を発生させようとする意思を外部に表すこと\nである。\n例えば、\n「この車を100万円で売ります」\nという発言は、売買契約を成立させようとする意思表示である。\n⸻\n2　意思と表示\n意思表示には、\n内心の意思\n↓\n外部への表示\nという構造がある。\nここで問題になるのが、\n内心の意思と外部に表示された内容が一致しない場合\nである。\n⸻\n3　心裡留保\n本人が真意ではないことを知りながら意思表示をする場合。\n例えば、\nA「この車、1円で売るよ」\nしかしAには本当に売るつもりがない。\n↓\n原則として一定の要件の下で意思表示は有効。\nただし、相手方が真意でないことを知っていた、または知ることができた場合には別の扱いとなる。\n⸻\n4　虚偽表示\n相手方と通謀して、真実とは異なる意思表示をすること。\n例えば、\nAとBが、\n「Aの土地をBに売ったことにしよう」\nと合意する。\nしかし実際には売買する意思がない。\n↓\n通謀虚偽表示。\n原則として無効。\nただし、これを知らない第三者との関係では第三者保護が問題となる。\n⸻\n5　錯誤\n意思表示をした本人が、重要な点について勘違いしていた場合。\n例えば、\nAは「100万円」だと思って契約したが、実際には「1,000万円」だった。\n↓\n錯誤の問題。\n現在の民法では、一定の要件を満たす場合に意思表示を取り消すことができる。\n⸻\n6　詐欺\n相手方からだまされて意思表示をした場合。\n例：\nAがBに、\n「この車は事故歴が一切ありません」\nと嘘をつく。\nBがそれを信じて購入する。\n↓\n詐欺による意思表示として取消しが問題となる。\n⸻\n7　強迫\n相手方から脅されて意思表示をした場合。\n例：\nA「この契約をしないなら危害を加える」\nB「……分かりました」\n↓\nBの意思表示は強迫によるものとして取消しが問題となる。\n⸻\n8　意思表示の整理\n原因\t内容\t基本的な効果\n心裡留保\t真意ではない表示\t原則有効\n通謀虚偽表示\t相手方と嘘の表示を合意\t無効\n錯誤\t重要な勘違い\t取消し\n詐欺\tだまされる\t取消し\n強迫\t脅される\t取消し\nここは民法総則の重要な骨格である。\n⸻","blanks":["意思表示","この車を100万円で売ります","この車、1円で売るよ","Aの土地をBに売ったことにしよう"],"options":[["意思表示","権利能力","買います","意思能力"],["この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情","契約当事者以外なら全員第三者"],["この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか","その土地がBのものだ"],["Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実","所有権を邪魔している状態をやめろ"]],"mode":"civil"},"7":{"text":"1　法律行為なら何でも自由なのか\n違う。\n民法では私的自治が基本だが、一定の限界がある。\n代表的なのが、\n公序良俗\nである。\n公序良俗に反する法律行為は無効となる。\n⸻\n2　公序良俗\n社会の基本的な秩序・倫理に反する法律行為を無効とする考え方。\n例えば、\n極端に反社会的な内容の契約\nなど。\nつまり、\n契約自由\n↓\nしかし\n↓\n法律上許されない内容は無効\nという関係になる。\n⸻\n3　強行規定と任意規定\n民法の規定には、\n任意規定\n当事者が別の内容を合意すれば、それが優先される。\n強行規定\n当事者が合意しても、その合意に反することができない。\nという区別がある。\nしたがって、\n「民法に書いてあるルール＝必ず絶対に従う」\nではない。\nこの区別は契約法を理解するうえでも非常に重要である。\n⸻","blanks":["民法に書いてあるルール","必ず絶対に従う"],"options":[["民法に書いてあるルール","第三者に主張できること","取引行為による占有取得","債務を履行することが、"],["必ず絶対に従う","結婚・離婚する","というケース。","貸金返還請求権"]],"mode":"civil"},"8":{"text":"1　無効\n無効とは、\n法律行為が法律上の効力を生じないこと\nである。\n原則として、最初から効力を認めない。\n⸻\n2　取消し\n取消しとは、\n一応は効力が認められている法律行為について、一定の者が取消しをすることによって、法律行為の効力を否定する制度\nである。\nここが無効との大きな違い。\n⸻\n3　無効と取消し\n無効\t取消し\n基本\t効力が認められない\t一応効力あり\n誰が主張できるか\t原則として広い\t取消権者\n取消し前\t効力なし\t一応有効\n取消し後\t―\t遡及的に効力を失う\nイメージ\n無効\n法律行為 ↓ 最初から効力なし\n取消し\n法律行為 ↓ 一応有効 ↓ 取消し ↓ 原則として初めから効力を失う\n⸻","blanks":["無効","取消し"],"options":[["無効","民法","総則","胎児"],["取消し","不確実","所有権","第三者"]],"mode":"civil"},"9":{"text":"1　条件\n法律行為の効力の発生・消滅を、将来発生するかどうか不確実な事実にかからせるもの。\n例えば、\n「試験に合格したら100万円をあげる」\n試験に合格するかどうかはまだ分からない。\n↓\n条件。\n⸻\n2　停止条件\n一定の事実が発生したら法律行為の効力が発生する。\n条件成就\n↓\n効力発生\n⸻\n3　解除条件\n一定の事実が発生したら法律行為の効力が消滅する。\n条件成就\n↓\n効力消滅\n⸻\n4　期限\n条件と違って、期限は将来到来することが確実な事実にかかわる。\n例えば、\n「2027年4月1日から賃貸借を開始する」\n2027年4月1日が来ること自体は確実。\n↓\n期限。\n⸻\n5　条件と期限の違い\n条件\t期限\n将来の事実\t発生するか不確実\t到来が確実\n例\t合格したら\t4月1日になったら\n⸻","blanks":["試験に合格したら100万円をあげる","条件成就"],"options":[["試験に合格したら100万円をあげる","債務者が持っている権利を行使しない","死亡した人の権利は全部相続人へ移る","人――権利能力・意思能力・行為能力"],["条件成就","権利能力","買います","意思能力"]],"mode":"civil"},"10":{"text":"1　代理とは\n代理とは、\n代理人が本人のために意思表示をし、その効果を本人に帰属させる制度\nである。\n例\nA＝本人 B＝代理人 C＝相手方\nBがAの代理人としてCと契約。\n↓\n契約の効果\n↓\n原則としてAに帰属。\n⸻\n2　代理の基本構造\n本人\n↓ 代理権\n代理人\n↓ 法律行為\n相手方\n↓\n法律効果\n↓\n本人\nここが代理制度の核心。\n⸻\n3　代理人自身が契約するのに、なぜ本人に効果が帰属するのか\n代理制度では、\n「誰が実際に意思表示をしたか」\nだけではなく、\n「誰のために法律行為をしたのか」\nが重要になる。\n代理人が本人のために行動することによって、その法律効果を本人に帰属させる。\n⸻","blanks":["代理","誰が実際に意思表示をしたか","誰のために法律行為をしたのか"],"options":[["代理","民法","総則","胎児"],["誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか","自分の土地の便益のために、"],["誰のために法律行為をしたのか","この車を100万円で売ります","代理権があるように見える事情","契約当事者以外なら全員第三者"]],"mode":"civil"},"11":{"text":"1　無権代理とは\n代理権がない者が、代理人として法律行為をすること。\n例えば、\nA「Bさん、私の代理人として契約していいよ」\nという代理権がないのに、\nB「Aの代理人として契約します」\n↓\n無権代理。\n⸻\n2　基本構造\n本人A ↓ 代理権なし\n代理人B ↓ Cと契約\n↓\nAは当然には契約に拘束されない。\nそこで登場するのが追認である。\n⸻\n3　追認\n本人が、\n「その契約を認めます」\nとすること。\n↓\n無権代理行為が本人に効力を生じる。\n⸻\n4　相手方の保護\n無権代理では、\n本人を保護するだけではなく、相手方をどう保護するか\nも重要となる。\nそのため民法では、相手方に、\n•\t催告\n•\t取消し\n•\t無権代理人への責任追及\nなどの制度を用意している。\n⸻","blanks":["Aの代理人として契約します","その契約を認めます","催告","取消し"],"options":[["Aの代理人として契約します","誰が実際に意思表示をしたか","本当にこの人が所有者なのか","自分の土地の便益のために、"],["その契約を認めます","完全に法律上無関係","Bには代理権がある","○年が経過したとき"],["催告","民法","総則","胎児"],["取消し","不確実","所有権","第三者"]],"mode":"civil"},"12":{"text":"1　表見代理とは\n実際には代理権がないのに、\n「代理権があるように見える事情」\nが存在し、一定の要件を満たす場合に、本人に責任を負わせる制度。\n⸻\n2　なぜ必要なのか\n例えば、\nAがBに代理権を与えたように見える状況を作ってしまった。\nCは、\n「Bには代理権がある」\nと信じて取引した。\nこの場合、何も知らないCを完全に犠牲にすると取引の安全が害される。\nそこで、\n本人側の帰責性\n＋\n相手方の信頼\n↓\n一定の場合に本人に効果を帰属\nという仕組みが表見代理である。\n⸻","blanks":["代理権があるように見える事情","Bには代理権がある"],"options":[["代理権があるように見える事情","この車を100万円で売ります","誰のために法律行為をしたのか","契約当事者以外なら全員第三者"],["Bには代理権がある","完全に法律上無関係","その契約を認めます","○年が経過したとき"]],"mode":"civil"},"13":{"text":"1　期間とは\n一定の時点から一定の時点までの時間的な長さ。\n民法では、\n•\t日\n•\t月\n•\t年\nなどによって期間を計算する。\n⸻\n2　期間計算が重要な理由\n法律上、\n「○日以内」\n「○年が経過したとき」\nなどの期限が頻繁に登場する。\nそこで、\nいつから数えるのか\nいつ終わるのか\nを正確に決める必要がある。\n⸻","blanks":["○日以内","○年が経過したとき"],"options":[["○日以内","権利能力","買います","意思能力"],["○年が経過したとき","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"14":{"text":"1　時効とは\n一定期間の経過によって、法律上の効果を認める制度。\n民法上、時効には大きく、\n•\t取得時効\n•\t消滅時効\nがある。\n⸻","blanks":["取得時効","消滅時効"],"options":[["取得時効","権利能力","買います","意思能力"],["消滅時効","権利能力","買います","意思能力"]],"mode":"civil"},"15":{"text":"1　取得時効とは\n一定の要件を満たして他人の物を一定期間占有することなどによって、権利を取得する制度。\n典型的には、\n長期間にわたって一定の土地を自分の土地として占有している\nというケース。\nただし、\n「長く使っただけで当然に所有権を取得する」\nという単純な制度ではない。\n占有の態様、期間、善意・無過失など、法律上の要件を満たす必要がある。\n⸻","blanks":["典型的には、","というケース。"],"options":[["典型的には、","お金を借りる","従業員を雇う","物権法定主義"],["というケース。","結婚・離婚する","必ず絶対に従う","貸金返還請求権"]],"mode":"civil"},"16":{"text":"1　消滅時効とは\n権利を一定期間行使しないことによって、その権利について時効の効果が生じる制度。\n特に重要なのが債権。\n例えば、\nAがBにお金を貸した。\n↓\nAにはBに返済を請求する権利がある。\nしかし、いつまでも権利関係を不安定なままにしておくことは望ましくない。\nそこで、一定期間権利を行使しない場合に時効が問題となる。\n⸻\n2　現在の消滅時効制度\n現在の民法では、債権の消滅時効について、\n•\t権利を行使できることを知った時から5年間\n•\t権利を行使できる時から10年間\nという二つの期間を基本としている。\nただし、権利の種類によって特則があるため、\n「全部5年」\nと覚えてはいけない。\n⸻","blanks":["債権","全部5年"],"options":[["債権","民法","総則","胎児"],["全部5年","権利能力","買います","意思能力"]],"mode":"civil"},"17":{"text":"1　期間が経過すれば、それだけで終わりなのか\n時効では、\n期間経過\nだけでなく、\n援用\nという考え方が重要になる。\n⸻\n2　援用\n時効による利益を受けようとする者が、\n「時効の利益を受けます」\nと主張すること。\nつまり、\n期間経過\n↓\n時効完成の状態\n↓\n援用\n↓\n時効の効果\nという流れで理解する。\n⸻\n3　時効の更新・完成猶予\n現在の民法では、以前の「中断」「停止」という考え方が整理され、\n•\t完成猶予\n•\t更新\nという制度になっている。\n完成猶予\n一定の事情によって、\n時効が完成することを一時的に阻止する。\n更新\n一定の事情が発生すると、\nそれまで進行していた時効期間をリセットし、新たに期間が進行する。\n⸻","blanks":["時効の利益を受けます","完成猶予","中断","停止"],"options":[["時効の利益を受けます","この車、1円で売るよ","いつ所有権が移るのか","その土地がBのものだ"],["完成猶予","権利能力","買います","意思能力"],["中断","民法","総則","胎児"],["停止","民法","総則","胎児"]],"mode":"civil"},"18":{"text":"ここまでを一本につなげる。\n民法総則の基本構造\n人\n↓\n権利能力 意思能力 行為能力\n↓\n法律行為\n↓\n意思表示\n↓\n契約など\n↓\n問題があれば\n•\t錯誤\n•\t詐欺\n•\t強迫\n•\t虚偽表示\n•\t公序良俗違反\n•\t行為能力制限\n↓\n無効・取消し\n⸻\nさらに、\n代理\n↓\n本人 ↓ 代理人 ↓ 相手方\n↓\n本人に法律効果を帰属\nただし、\n代理権なし ↓ 無権代理\n↓\n本人の追認など\nまたは\n表見代理\n↓\n相手方の信頼を一定の場合に保護\n⸻\nさらに、\n時間の経過\n↓\n期間\n↓\n時効\n↓\n取得時効 ／ 消滅時効\n↓\n完成猶予・更新\n↓\n援用\n⸻","blanks":["錯誤","詐欺","強迫","虚偽表示"],"options":[["錯誤","民法","総則","胎児"],["詐欺","民法","総則","胎児"],["強迫","民法","総則","胎児"],["虚偽表示","権利能力","買います","意思能力"]],"mode":"civil"},"19":{"text":"民法総則は、単純に条文をバラバラに覚える科目ではない。\n大きく見ると、\n「誰が」\n↓\n「どのような意思で」\n↓\n「どのような法律行為をして」\n↓\n「どのような法律効果を発生させるか」\n↓\n「その法律効果を誰に帰属させるか」\n↓\n「その法律関係に問題がないか」\n↓\n「時間の経過によってどうなるか」\nという構造になっている。\n⸻","blanks":["誰が","どのような意思で","どのような法律行為をして","どのような法律効果を発生させるか"],"options":[["誰が","民法","総則","胎児"],["どのような意思で","変更・管理・保存","保険金が発生した","① 誰が権利者か"],["どのような法律行為をして","この車を100万円で売る","所有権を何％持っているか","他人の土地を利用する権利"],["どのような法律効果を発生させるか","Aの土地をBに売ったことにしよう","条件\t将来発生するか不確実な事実","所有権を邪魔している状態をやめろ"]],"mode":"civil"},"20":{"text":"分野\t中心となる問題\n権利能力\t誰が権利・義務の主体になれるか\n意思能力\t行為の意味を理解できるか\n行為能力\t単独で有効な法律行為ができるか\n法律行為\t意思表示によって法律効果を発生させる\n意思表示\t内心と表示の食い違いをどう扱うか\n無効\t初めから法律上の効力を認めない\n取消し\t取消権者が取り消して効力を否定する\n代理\t他人の行為の効果を本人に帰属させる\n無権代理\t代理権がない者による代理行為\n表見代理\t代理権があるように見える場合の相手方保護\n条件\t将来発生するか不確実な事実\n期限\t将来到来することが確実な事実\n時効\t一定期間の経過による法律上の効果\n⸻","blanks":["条件\t将来発生するか不確実な事実"],"options":[["条件\t将来発生するか不確実な事実","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","所有権を邪魔している状態をやめろ"]],"mode":"civil"},"21":{"text":"AがBに、\n「私の代理人としてCから車を買ってきて」\nと代理権を与えた。\nBがCと契約。\n↓\n通常の代理。\nA＝本人 B＝代理人 C＝相手方\n↓\n契約の効果はAに帰属。\n⸻\nところがBには代理権がなかった。\n↓\n無権代理。\nAが後から、\n「その契約を認めます」\n↓\n追認。\n⸻\nさらに、Bに代理権があるようにA自身が表示していたなど、一定の事情が存在し、Cが正当に信頼した。\n↓\n表見代理の問題。\n⸻\nこのように、\n本人 → 代理権 → 代理人 → 相手方\nという関係を最初に把握すると、総則の問題がかなり整理しやすくなる。\n⸻","blanks":["私の代理人としてCから車を買ってきて","その契約を認めます"],"options":[["私の代理人としてCから車を買ってきて","この問題は物権のどの部分の問題なのか","売買で債務不履行が起きたらどうなる？","請負で完成した仕事に問題があったら？"],["その契約を認めます","完全に法律上無関係","Bには代理権があ
