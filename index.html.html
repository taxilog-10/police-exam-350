る。\n2. 日本では憲法・法律などの成文法が中心的な位置を占める。\n3. 命令は法律に反することができず、委任にも限界がある。\n4. 条例は地方公共団体による自治立法である。\n5. 判例は法律そのものではないが、法解釈・実務上非常に重要である。\n6. 法解釈とは、法規範の意味・内容を明らかにする作業である。\n7. 文理解釈・論理解釈・体系解釈・目的論的解釈などを組み合わせて考える。\n8. 類推解釈は、条文の趣旨を類似事例に及ぼすが、特に刑罰法規では限界がある。\n9. 法の適用では、法規範・事実・当てはめを区別する。\n10. 法律学の基本公式は「法源→解釈→事実認定→当てはめ→法律効果」である。\n\n第3編 完成\n第1編\n法とは何か・法の基本概念\n↓\n「法とは何か？」\n第2編\n法の種類・法体系\n↓\n「法にはどんな種類がある？」\n第3編\n法源・法の適用・解釈\n↓\n「その法はどこから来て、どう読み、どう事件に適用する？」\nここまでで、\n法そのものを理解するための基本理論\nが完成した。\n次の第4編では、\n「実際に法を使って争いを解決する仕組み」\nに進む。\nつまり、\n裁判とは何か\n↓\n民事裁判\n↓\n刑事裁判\n↓\n行政事件\n↓\n裁判所\n↓\n検察\n↓\n警察\n↓\n弁護士\n↓\n訴訟\n↓\n証拠\n↓\n判決\n↓\n司法制度\nという、裁判・司法制度・法的手続を体系的に学ぶ。","source":"第67章　第3編最終整理\n① 法源\n法源\n│\n├─ 憲法\n├─ 法律\n├─ 命令\n│   ├─ 政令\n│   └─ 省令等\n├─ 条例\n├─ 慣習法等\n└─ 判例・法理\n↓\n② 法解釈\n条文\n↓\n文理解釈\n↓\n論理解釈\n↓\n目的・体系・制度趣旨\n↓\n必要に応じて\n類推・反対・拡張・縮小\n↓\n規範の意味を確定\n↓\n③ 法適用\n一般的な法規範\n↓\n具体的事実\n↓\n事実認定\n↓\n要件に当てはめ\n↓\n法律効果\n↓\n④ 救済\n法律効果\n↓\n権利侵害・紛争\n↓\n裁判・行政等\n↓\n権利実現・救済\n\n★ 第3編の最重要10ポイント\n1. 法源とは、法的判断の根拠となる法規範の形式・由来である。\n2. 日本では憲法・法律などの成文法が中心的な位置を占める。\n3. 命令は法律に反することができず、委任にも限界がある。\n4. 条例は地方公共団体による自治立法である。\n5. 判例は法律そのものではないが、法解釈・実務上非常に重要である。\n6. 法解釈とは、法規範の意味・内容を明らかにする作業である。\n7. 文理解釈・論理解釈・体系解釈・目的論的解釈などを組み合わせて考える。\n8. 類推解釈は、条文の趣旨を類似事例に及ぼすが、特に刑罰法規では限界がある。\n9. 法の適用では、法規範・事実・当てはめを区別する。\n10. 法律学の基本公式は「法源→解釈→事実認定→当てはめ→法律効果」である。\n\n第3編 完成\n第1編\n法とは何か・法の基本概念\n↓\n「法とは何か？」\n第2編\n法の種類・法体系\n↓\n「法にはどんな種類がある？」\n第3編\n法源・法の適用・解釈\n↓\n「その法はどこから来て、どう読み、どう事件に適用する？」\nここまでで、\n法そのものを理解するための基本理論\nが完成した。\n次の第4編では、\n「実際に法を使って争いを解決する仕組み」\nに進む。\nつまり、\n裁判とは何か\n↓\n民事裁判\n↓\n刑事裁判\n↓\n行政事件\n↓\n裁判所\n↓\n検察\n↓\n警察\n↓\n弁護士\n↓\n訴訟\n↓\n証拠\n↓\n判決\n↓\n司法制度\nという、裁判・司法制度・法的手続を体系的に学ぶ。","answers":[{"correct":"法源","options":["法源","法解釈","文理解釈","論理解釈"]},{"correct":"法解釈","options":["法解釈","法源","文理解釈","論理解釈"]},{"correct":"文理解釈","options":["文理解釈","法源","法解釈","論理解釈"]},{"correct":"論理解釈","options":["論理解釈","法源","法解釈","文理解釈"]},{"correct":"類推・反対・拡張・縮小","options":["類推・反対・拡張・縮小","法源","法解釈","文理解釈"]},{"correct":"事実認定","options":["事実認定","法源","法解釈","文理解釈"]},{"correct":"法律効果","options":["法律効果","法源","法解釈","文理解釈"]}]}]},"4":{"1":[{"text":"裁判とは、「具体的な紛争」について、「裁判所」が「法を解釈・適用」して判断する公的な手続である。例えば、A「100万円返してほしい」↓B「返す必要はない」↓紛争↓裁判所↓法を解釈↓「事実を認定」↓法律を適用↓「判決」","blanks":["具体的な紛争","裁判所","法を解釈・適用","事実を認定","判決"],"options":[["具体的な紛争","紛争","裁判所","法解釈"],["裁判所","紛争","法解釈","事実認定"],["法を解釈・適用","紛争","裁判所","法解釈"],["事実を認定","紛争","裁判所","法解釈"],["判決","紛争","裁判所","法解釈"]]}],"2":[{"text":"人々の間で争いが生じたとき、「自分の力で解決する」ことを認めてしまうと、「力の強い者が勝つ社会」になってしまう。そこで、「国家」が「中立的な第三者」として紛争を解決する。これが裁判制度の重要な役割である。","blanks":["自分の力で解決する","力の強い者が勝つ社会","国家","中立的な第三者"],"options":[["自分の力で解決する","紛争","裁判所","法解釈"],["力の強い者が勝つ社会","紛争","裁判所","法解釈"],["国家","紛争","裁判所","法解釈"],["中立的な第三者","紛争","裁判所","法解釈"]]}],"3":[{"text":"私人が、「相手が悪いから自分で制裁する」ということを自由に行うことは、「原則として認められない」。例えば、AがBに100万円を貸した。Bが返さない。だからAがBの車を勝手に持っていく。ということは原則として許されない。権利がある↓「裁判等」によって実現↓必要に応じて「強制執行」という仕組みを利用する。","blanks":["原則として認められない","裁判等","強制執行"],"options":[["原則として認められない","紛争","裁判所","法解釈"],["裁判等","紛争","裁判所","法解釈"],["強制執行","紛争","裁判所","法解釈"]]}],"4":[{"text":"「司法」とは、具体的な法律上の争いについて、「法を適用して公権的に判断する国家作用」である。三権分立では、「立法」↓国会、「行政」↓内閣・行政機関、司法↓「裁判所」となる。","blanks":["司法","法を適用して公権的に判断する国家作用","立法","行政","裁判所"],"options":[["司法","紛争","裁判所","法解釈"],["法を適用して公権的に判断する国家作用","紛争","裁判所","法解釈"],["立法","紛争","裁判所","法解釈"],["行政","紛争","裁判所","法解釈"],["裁判所","紛争","法解釈","事実認定"]]}],"5":[{"text":"日本国「憲法76条1項」は、「司法権」が「裁判所」に属するという仕組みを定めている。したがって、法律上の争いを公権的に判断する中心的機関は裁判所である。","blanks":["憲法76条1項","司法権","裁判所"],"options":[["憲法76条1項","紛争","裁判所","法解釈"],["司法権","紛争","裁判所","法解釈"],["裁判所","紛争","法解釈","事実認定"]]}],"6":[{"text":"日本の裁判所には、「最高裁判所」・「高等裁判所」・「地方裁判所」・「家庭裁判所」・「簡易裁判所」がある。最高裁判所↓高等裁判所↓地方裁判所・家庭裁判所↓簡易裁判所という「審級制度」が基本になる。","blanks":["最高裁判所","高等裁判所","地方裁判所","家庭裁判所","簡易裁判所","審級制度"],"options":[["最高裁判所","紛争","裁判所","法解釈"],["高等裁判所","紛争","裁判所","法解釈"],["地方裁判所","紛争","裁判所","法解釈"],["家庭裁判所","紛争","裁判所","法解釈"],["簡易裁判所","紛争","裁判所","法解釈"],["審級制度","紛争","裁判所","法解釈"]]}],"7":[{"text":"最高裁判所は、日本の司法制度における「最上級の裁判所」である。最高裁判所には、法令の「憲法適合性」を最終的に判断する権限もある。","blanks":["最上級の裁判所","憲法適合性"],"options":[["最上級の裁判所","紛争","裁判所","法解釈"],["憲法適合性","紛争","裁判所","法解釈"]]}],"8":[{"text":"「高等裁判所」は、主として地方裁判所などの第一審判決に対する「控訴事件」を扱う。また、事件の種類によって異なる役割を持つ。","blanks":["高等裁判所","控訴事件"],"options":[["高等裁判所","紛争","裁判所","法解釈"],["控訴事件","紛争","裁判所","法解釈"]]}],"9":[{"text":"「地方裁判所」は、民事・刑事事件の「第一審」を中心に扱う裁判所である。重大な事件では、地方裁判所が第一審となることが多い。","blanks":["地方裁判所","第一審"],"options":[["地方裁判所","紛争","裁判所","法解釈"],["第一審","紛争","裁判所","法解釈"]]}],"10":[{"text":"「家庭裁判所」は、家族関係や「少年事件」などを扱う裁判所。例えば、離婚・親族関係の事件、相続に関する事件、少年事件など。","blanks":["家庭裁判所","少年事件"],"options":[["家庭裁判所","紛争","裁判所","法解釈"],["少年事件","紛争","裁判所","法解釈"]]}],"11":[{"text":"「簡易裁判所」は、比較的軽微な民事・刑事事件を扱う。特に民事では、「少額訴訟」などの制度もある。","blanks":["簡易裁判所","少額訴訟"],"options":[["簡易裁判所","紛争","裁判所","法解釈"],["少額訴訟","紛争","裁判所","法解釈"]]}],"12":[{"text":"「審級制度」とは、一つの事件について、一定の条件の下で上級裁判所に判断を求められる仕組みである。一般に、「第一審」↓「控訴」↓「第二審」↓「上告」↓「最高裁判所」という構造になる。","blanks":["審級制度","第一審","控訴","第二審","上告","最高裁判所"],"options":[["審級制度","紛争","裁判所","法解釈"],["第一審","紛争","裁判所","法解釈"],["控訴","紛争","裁判所","法解釈"],["第二審","紛争","裁判所","法解釈"],["上告","紛争","裁判所","法解釈"],["最高裁判所","紛争","裁判所","法解釈"]]}],"13":[{"text":"裁判官も判断を誤る可能性がある。そこで、「上級裁判所による審査」を認める。目的は、「判断の誤りを是正」する、「法解釈を統一」する、裁判の公正を確保することなど。","blanks":["上級裁判所による審査","判断の誤りを是正","法解釈を統一"],"options":[["上級裁判所による審査","紛争","裁判所","法解釈"],["判断の誤りを是正","紛争","裁判所","法解釈"],["法解釈を統一","紛争","裁判所","法解釈"]]}],"14":[{"text":"「民事裁判」とは、「私人間」の権利・義務などをめぐる紛争を解決する裁判である。例えば、「貸金返還」、「損害賠償」、土地所有権、契約違反など。","blanks":["民事裁判","私人間","貸金返還","損害賠償"],"options":[["民事裁判","紛争","裁判所","法解釈"],["私人間","紛争","裁判所","法解釈"],["貸金返還","紛争","裁判所","法解釈"],["損害賠償","紛争","裁判所","法解釈"]]}],"15":[{"text":"「原告」↓「請求」↓「被告」↓争う↓裁判所↓「事実認定」↓「法解釈」↓「当てはめ」↓「判決」","blanks":["原告","請求","被告","事実認定","法解釈","当てはめ","判決"],"options":[["原告","紛争","裁判所","法解釈"],["請求","紛争","裁判所","法解釈"],["被告","紛争","裁判所","法解釈"],["事実認定","紛争","裁判所","法解釈"],["法解釈","紛争","裁判所","事実認定"],["当てはめ","紛争","裁判所","法解釈"],["判決","紛争","裁判所","法解釈"]]}],"16":[{"text":"「原告」＝裁判を起こして請求する側。「被告」＝その請求を受ける側。ただし、刑事裁判の「「被告人」」とは区別する。","blanks":["原告","被告","被告人"],"options":[["原告","紛争","裁判所","法解釈"],["被告","紛争","裁判所","法解釈"],["被告人","紛争","裁判所","法解釈"]]}],"17":[{"text":"民事裁判では、原告が何を求めているのかが重要。例えば、「BはAに100万円を支払え」という請求。これを、「請求の趣旨」として整理する。","blanks":["請求の趣旨"],"options":[["請求の趣旨","紛争","裁判所","法解釈"]]}],"18":[{"text":"民事裁判では、当事者が主張する事実を裁判所が「証拠」等によって認定する。例えば、本当に100万円を貸したのか？を、「契約書」、「振込記録」、「メッセージ」、「証人」などから判断する。","blanks":["証拠","契約書","振込記録","メッセージ","証人"],"options":[["証拠","紛争","裁判所","法解釈"],["契約書","紛争","裁判所","法解釈"],["振込記録","紛争","裁判所","法解釈"],["メッセージ","紛争","裁判所","法解釈"],["証人","紛争","裁判所","法解釈"]]}],"19":[{"text":"「刑事裁判」とは、犯罪を行ったとされる者について、「犯罪の成立」と「刑罰」などを判断する裁判である。基本的には、犯罪の疑い↓捜査↓「起訴」↓刑事裁判↓「有罪・無罪」等↓刑罰という流れになる。","blanks":["刑事裁判","犯罪の成立","刑罰","起訴","有罪・無罪"],"options":[["刑事裁判","紛争","裁判所","法解釈"],["犯罪の成立","紛争","裁判所","法解釈"],["刑罰","紛争","裁判所","法解釈"],["起訴","紛争","裁判所","法解釈"],["有罪・無罪","紛争","裁判所","法解釈"]]}],"20":[{"text":"「被疑者」＝犯罪をしたと疑われ、捜査の対象となっている者。「被告人」＝検察官から公訴を提起され、刑事裁判の対象となっている者。犯罪の疑い↓被疑者↓「起訴」↓被告人","blanks":["被疑者","被告人","起訴"],"options":[["被疑者","紛争","裁判所","法解釈"],["被告人","紛争","裁判所","法解釈"],["起訴","紛争","裁判所","法解釈"]]}],"21":[{"text":"「検察官」は、犯罪を捜査し、「公訴を提起」し、刑事裁判で「公判を維持」するなどの職務を担う。刑事手続では、国家による刑罰権の行使と深く関係する。","blanks":["検察官","公訴を提起","公判を維持"],"options":[["検察官","紛争","裁判所","法解釈"],["公訴を提起","紛争","裁判所","法解釈"],["公判を維持","紛争","裁判所","法解釈"]]}],"22":[{"text":"「警察」は、「犯罪の捜査」や公共の安全・秩序の維持などを担う。刑事事件では、警察↓捜査↓証拠収集等↓「検察」↓「起訴判断」という流れが基本になる。ただし、警察＝有罪を決める機関ではない。最終的な刑事裁判の判断は「裁判所」が行う。","blanks":["警察","犯罪の捜査","検察","起訴判断","裁判所"],"options":[["警察","紛争","裁判所","法解釈"],["犯罪の捜査","紛争","裁判所","法解釈"],["検察","紛争","裁判所","法解釈"],["起訴判断","紛争","裁判所","法解釈"],["裁判所","紛争","法解釈","事実認定"]]}],"23":[{"text":"「弁護士」は、当事者の権利・利益を法律上保護する専門家である。民事では、「原告・被告の代理人」などとして活動する。刑事では、「被告人の弁護人」として活動する。","blanks":["弁護士","原告・被告の代理人","被告人の弁護人"],"options":[["弁護士","紛争","裁判所","法解釈"],["原告・被告の代理人","紛争","裁判所","法解釈"],["被告人の弁護人","紛争","裁判所","法解釈"]]}],"24":[{"text":"「裁判官」は、具体的事件について「中立・公正」な立場から法を解釈・適用して判断する。したがって、原告の味方でも、被告の味方でもない。","blanks":["裁判官","中立・公正"],"options":[["裁判官","紛争","裁判所","法解釈"],["中立・公正","紛争","裁判所","法解釈"]]}],"25":[{"text":"裁判官は、外部から不当な影響を受けずに判断する必要がある。これを、「司法権の独立」・「裁判官の職権の独立」という観点から理解する。政治×圧力×当事者↓裁判官↓法に基づいて判断","blanks":["司法権の独立","裁判官の職権の独立"],"options":[["司法権の独立","紛争","裁判所","法解釈"],["裁判官の職権の独立","紛争","裁判所","法解釈"]]}],"26":[{"text":"「憲法82条」は、裁判の「対審及び判決を公開」する原則を定める。公開裁判には、「公正な裁判」、国民による監視、裁判への信頼という意味がある。","blanks":["憲法82条","対審及び判決を公開","公正な裁判"],"options":[["憲法82条","紛争","裁判所","法解釈"],["対審及び判決を公開","紛争","裁判所","法解釈"],["公正な裁判","紛争","裁判所","法解釈"]]}],"27":[{"text":"すべての裁判が、「無条件に公開」されるわけではない。憲法上、一定の場合には、「対審を非公開」とすることが認められている。ただし、「公開原則」そのものを軽視してよいわけではない。","blanks":["無条件に公開","対審を非公開","公開原則"],"options":[["無条件に公開","紛争","裁判所","法解釈"],["対審を非公開","紛争","裁判所","法解釈"],["公開原則","紛争","裁判所","法解釈"]]}],"28":[{"text":"「憲法31条」は、法律の定める「適正な手続」によらなければ刑罰などを科されないという考え方を示している。これが、「適正手続の保障」である。","blanks":["憲法31条","適正な手続","適正手続の保障"],"options":[["憲法31条","紛争","裁判所","法解釈"],["適正な手続","紛争","裁判所","法解釈"],["適正手続の保障","紛争","裁判所","法解釈"]]}],"29":[{"text":"刑事手続では、国家が強い権力を行使する。例えば、「逮捕」、「捜索」、「押収」、「勾留」、「刑罰」など。そこで、被疑者・被告人の「人権保障」が非常に重要になる。","blanks":["逮捕","捜索","押収","勾留","刑罰","人権保障"],"options":[["逮捕","紛争","裁判所","法解釈"],["捜索","紛争","裁判所","法解釈"],["押収","紛争","裁判所","法解釈"],["勾留","紛争","裁判所","法解釈"],["刑罰","紛争","裁判所","法解釈"],["人権保障","紛争","裁判所","法解釈"]]}],"30":[{"text":"逮捕や捜索・押収などについては、「裁判官」が発する「令状」が必要となる場合がある。警察・検察↓捜査↓令状が必要な場合↓裁判官↓令状↓「強制処分」。これは、捜査機関の権力を裁判官によってコントロールする仕組みである。","blanks":["令状","裁判官","強制処分"],"options":[["令状","紛争","裁判所","法解釈"],["裁判官","紛争","裁判所","法解釈"],["強制処分","紛争","裁判所","法解釈"]]}],"31":[{"text":"「逮捕」は、「被疑者」の身体を拘束する強制処分。原則として、「逮捕状」による逮捕が基本。ただし、「現行犯逮捕」など、憲法・刑事訴訟法上の例外がある。","blanks":["逮捕","被疑者","逮捕状","現行犯逮捕"],"options":[["逮捕","紛争","裁判所","法解釈"],["被疑者","紛争","裁判所","法解釈"],["逮捕状","紛争","裁判所","法解釈"],["現行犯逮捕","紛争","裁判所","法解釈"]]}],"32":[{"text":"「捜索」とは、人・場所・物などを探す強制処分。「押収」とは、物を強制的に取得・確保すること。「憲法35条」によって、住居・書類・所持品等について「令状主義」が保障される。","blanks":["捜索","押収","憲法35条","令状主義"],"options":[["捜索","紛争","裁判所","法解釈"],["押収","紛争","裁判所","法解釈"],["憲法35条","紛争","裁判所","法解釈"],["令状主義","紛争","裁判所","法解釈"]]}],"33":[{"text":"被疑者・被告人には、「自己に不利益な供述を強要されない権利」がある。これは、国家が自白を強制することを防ぐという重要な意味を持つ。","blanks":["自己に不利益な供述を強要されない権利"],"options":[["自己に不利益な供述を強要されない権利","紛争","裁判所","法解釈"]]}],"34":[{"text":"刑事裁判では、有罪判決が確定するまでは、被告人を犯罪者として扱うべきではないという考え方が重要になる。これを、「無罪推定」という。","blanks":["無罪推定"],"options":[["無罪推定","紛争","裁判所","法解釈"]]}],"35":[{"text":"裁判では、「事実認定」が必要になる。そのため、「書証」、「証人」、「物証」、「電磁的記録」などの証拠を用いる。証拠↓事実認定↓法律要件↓当てはめ↓判決","blanks":["事実認定","書証","証人","物証","電磁的記録"],"options":[["事実認定","紛争","裁判所","法解釈"],["書証","紛争","裁判所","法解釈"],["証人","紛争","裁判所","法解釈"],["物証","紛争","裁判所","法解釈"],["電磁的記録","紛争","裁判所","法解釈"]]}],"36":[{"text":"「民事裁判」＝私人間紛争の解決、「原告・被告」、「民法等」、請求認容・棄却等。「刑事裁判」＝犯罪・刑罰の判断、「検察官・被告人」、「刑法等」、有罪・無罪等。国家刑罰権は民事では原則問題にならず、刑事では中心的問題。","blanks":["民事裁判","刑事裁判","原告・被告","検察官・被告人","民法等","刑法等"],"options":[["民事裁判","紛争","裁判所","法解釈"],["刑事裁判","紛争","裁判所","法解釈"],["原告・被告","紛争","裁判所","法解釈"],["検察官・被告人","紛争","裁判所","法解釈"],["民法等","紛争","裁判所","法解釈"],["刑法等","紛争","裁判所","法解釈"]]}],"37":[{"text":"「行政事件」とは、「行政活動」をめぐる法律上の争いである。例えば、行政庁がAの営業許可を取り消した。Aが、「この取消しは違法だ」と争う。この場合、「行政事件訴訟」などが問題になる。","blanks":["行政事件","行政活動","行政事件訴訟"],"options":[["行政事件","紛争","裁判所","法解釈"],["行政活動","紛争","裁判所","法解釈"],["行政事件訴訟","紛争","裁判所","法解釈"]]}],"38":[{"text":"「行政庁」↓「行政処分」↓国民↓「違法だ」↓「行政事件訴訟」↓「裁判所」↓適法・違法を判断","blanks":["行政庁","行政処分","行政事件訴訟","裁判所"],"options":[["行政庁","紛争","裁判所","法解釈"],["行政処分","紛争","裁判所","法解釈"],["行政事件訴訟","紛争","裁判所","法解釈"],["裁判所","紛争","法解釈","事実認定"]]}],"39":[{"text":"両者は区別する。「民事事件」＝「私人間の法律関係」。「行政事件」＝行政庁の「公権力の行使」などをめぐる法律関係。ただし、国家が関係する事件がすべて行政事件になるわけではない。","blanks":["民事事件","私人間の法律関係","行政事件","公権力の行使"],"options":[["民事事件","紛争","裁判所","法解釈"],["私人間の法律関係","紛争","裁判所","法解釈"],["行政事件","紛争","裁判所","法解釈"],["公権力の行使","紛争","裁判所","法解釈"]]}],"40":[{"text":"裁判所は、条文をそのまま機械的に読むだけではない。必要に応じて、「文理解釈」、「論理解釈」、「体系解釈」、「目的論的解釈」などを用いる。第3編で学んだ、法解釈がここで実際に使われる。","blanks":["文理解釈","論理解釈","体系解釈","目的論的解釈"],"options":[["文理解釈","紛争","裁判所","法解釈"],["論理解釈","紛争","裁判所","法解釈"],["体系解釈","紛争","裁判所","法解釈"],["目的論的解釈","紛争","裁判所","法解釈"]]}],"41":[{"text":"裁判所は、何が実際に起きたのかを「証拠」等から判断する。主張↓証拠↓「事実認定」↓「法規範」↓「当てはめ」↓判決","blanks":["事実認定","証拠","法規範","当てはめ"],"options":[["事実認定","紛争","裁判所","法解釈"],["証拠","紛争","裁判所","法解釈"],["法規範","紛争","裁判所","法解釈"],["当てはめ","紛争","裁判所","法解釈"]]}],"42":[{"text":"「判決」とは、裁判所が事件について示す「公的な判断」である。民事事件では、原告の請求を認めるかどうかなどを判断する。刑事事件では、被告人が「有罪か無罪」かなどを判断する。","blanks":["判決","公的な判断","有罪か無罪"],"options":[["判決","紛争","裁判所","法解釈"],["公的な判断","紛争","裁判所","法解釈"],["有罪か無罪","紛争","裁判所","法解釈"]]}],"43":[{"text":"判決は、一定の期間内に「不服申立て」がなされなければ「確定」するなど、手続上の要件によって確定する。確定すると、原則としてその判断を前提として法律関係が処理される。","blanks":["確定","不服申立て"],"options":[["確定","紛争","裁判所","法解釈"],["不服申立て","紛争","裁判所","法解釈"]]}],"44":[{"text":"「確定判決」には、「既判力」という重要な効力がある。簡単にいうと、確定判決によって判断された事項について、当事者間で後から自由に争い直すことを制限する効力である。","blanks":["既判力","確定判決"],"options":[["既判力","紛争","裁判所","法解釈"],["確定判決","紛争","裁判所","法解釈"]]}],"45":[{"text":"判決が出ても、相手が「自発的に従わない」場合がある。例えば、「BはAに100万円を支払え」という判決が確定したのに、Bが払わない。そこで、「強制執行」が問題になる。判決↓相手が履行しない↓強制執行↓財産を差し押さえる等↓「権利実現」","blanks":["強制執行","自発的に従わない","権利実現"],"options":[["強制執行","紛争","裁判所","法解釈"],["自発的に従わない","紛争","裁判所","法解釈"],["権利実現","紛争","裁判所","法解釈"]]}],"46":[{"text":"重要なのは、裁判＝権利実現の最終段階ではない場合があること。紛争↓裁判↓判決↓確定↓「強制執行」↓権利実現。したがって、「裁判制度」と「執行制度」はつながっている。","blanks":["裁判制度","執行制度","強制執行"],"options":[["裁判制度","紛争","裁判所","法解釈"],["執行制度","紛争","裁判所","法解釈"],["強制執行","紛争","裁判所","法解釈"]]}],"47":[{"text":"紛争は、必ず裁判をしなければならないわけではない。例えば、「和解」、「調停」、「仲裁」、ADRなどがある。これらを、「裁判外紛争解決手続（ADR）」という。","blanks":["裁判外紛争解決手続（ADR）","和解","調停","仲裁"],"options":[["裁判外紛争解決手続（ADR）","紛争","裁判所","法解釈"],["和解","紛争","裁判所","法解釈"],["調停","紛争","裁判所","法解釈"],["仲裁","紛争","裁判所","法解釈"]]}],"48":[{"text":"「和解」とは、当事者が「互いに譲歩」するなどして紛争を解決すること。例えば、A「100万円全額払ってほしい」B「50万円なら払う」↓A・Bが「合意」↓50万円で解決ということがある。","blanks":["和解","互いに譲歩","合意"],"options":[["和解","紛争","裁判所","法解釈"],["互いに譲歩","紛争","裁判所","法解釈"],["合意","紛争","裁判所","法解釈"]]}],"49":[{"text":"「調停」では、「第三者」が当事者の「話合い」を仲介する。裁判のように、裁判官が一方的に勝敗を決めることが中心ではない。A↘調停機関↗B↓話合い↓「合意」","blanks":["調停","第三者","話合い","合意"],"options":[["調停","紛争","裁判所","法解釈"],["第三者","紛争","裁判所","法解釈"],["話合い","紛争","裁判所","法解釈"],["合意","紛争","裁判所","法解釈"]]}],"50":[{"text":"「仲裁」では、当事者が「合意」によって「第三者」に紛争の判断を委ねる。裁判とは異なる紛争解決制度である。特に、「国際商取引」などで利用されることがある。","blanks":["仲裁","合意","第三者","国際商取引"],"options":[["仲裁","紛争","裁判所","法解釈"],["合意","紛争","裁判所","法解釈"],["第三者","紛争","裁判所","法解釈"],["国際商取引","紛争","裁判所","法解釈"]]}],"51":[{"text":"「裁判」＝裁判所等、公的裁判あり、手続ルールあり、判決等、話合いは必須ではない。「ADR」＝「調停人・「仲裁人」」等、制度によって異なる、比較的柔軟、制度により異なる、話合いが重視される場合が多い。","blanks":["裁判","ADR","調停人・仲裁人","仲裁人"],"options":[["裁判","紛争","裁判所","法解釈"],["ADR","紛争","裁判所","法解釈"],["調停人・仲裁人","紛争","裁判所","法解釈"],["仲裁人","紛争","裁判所","法解釈"]]}],"52":[{"text":"裁判所は、法律・命令・規則・処分等が「憲法」に適合するかを判断することがある。これを、「違憲審査」という。日本では、「具体的事件を前提とした司法審査」が基本である。","blanks":["違憲審査","憲法","具体的事件を前提とした司法審査"],"options":[["違憲審査","紛争","裁判所","法解釈"],["憲法","紛争","裁判所","法解釈"],["具体的事件を前提とした司法審査","紛争","裁判所","法解釈"]]}],"53":[{"text":"「司法」は、国会や内閣を無制限に支配する機関ではない。一方、国会・内閣の行為が法に反していないかを判断する役割も持つ。国会↓法律、内閣↓行政、裁判所↓法律を解釈・適用＋「違憲審査」","blanks":["司法","違憲審査"],"options":[["司法","紛争","裁判所","法解釈"],["違憲審査","紛争","裁判所","法解釈"]]}],"54":[{"text":"裁判所にも、何でも自由に判断できるわけではない。例えば、「司法権の範囲」、「法律上の争訟」、「当事者適格」、「原告適格」、「訴えの利益」などの問題がある。","blanks":["司法権の範囲","法律上の争訟","当事者適格","原告適格","訴えの利益"],"options":[["司法権の範囲","紛争","裁判所","法解釈"],["法律上の争訟","紛争","裁判所","法解釈"],["当事者適格","紛争","裁判所","法解釈"],["原告適格","紛争","裁判所","法解釈"],["訴えの利益","紛争","裁判所","法解釈"]]}],"55":[{"text":"裁判所が司法権を行使するためには、「法律上の争訟」であることが基本的に必要。簡単にいえば、当事者間の「具体的な権利・義務」などについて、「法を適用して解決できる争い」である。","blanks":["法律上の争訟","具体的な権利・義務","法を適用して解決できる争い"],"options":[["法律上の争訟","紛争","裁判所","法解釈"],["具体的な権利・義務","紛争","裁判所","法解釈"],["法を適用して解決できる争い","紛争","裁判所","法解釈"]]}],"56":[{"text":"「憲法32条」は、何人も裁判所において「裁判を受ける権利」を奪われないと定める。つまり、法的権利・利益が侵害された場合に、「裁判所による救済」を求めることができることが重要。","blanks":["憲法32条","裁判を受ける権利","裁判所による救済"],"options":[["憲法32条","紛争","裁判所","法解釈"],["裁判を受ける権利","紛争","裁判所","法解釈"],["裁判所による救済","紛争","裁判所","法解釈"]]}],"57":[{"text":"「紛争発生」↓当事者↓「裁判」または「ADR」↓裁判の場合は裁判所↓「事実認定」↓「法解釈」↓「当てはめ」↓「判決」↓確定↓必要に応じて「強制執行」","blanks":["紛争発生","裁判","ADR","事実認定","法解釈","当てはめ","判決","強制執行"],"options":[["紛争発生","紛争","裁判所","法解釈"],["裁判","紛争","裁判所","法解釈"],["ADR","紛争","裁判所","法解釈"],["事実認定","紛争","裁判所","法解釈"],["法解釈","紛争","裁判所","事実認定"],["当てはめ","紛争","裁判所","法解釈"],["判決","紛争","裁判所","法解釈"],["強制執行","紛争","裁判所","法解釈"]]}],"58":[{"text":"AがBに100万円を貸した。Bが返さない。貸付↓返済期限↓Bが返さない↓Aが請求↓「民事裁判」↓「契約・証拠」を確認↓「法解釈・当てはめ」↓判決↓必要なら「強制執行」","blanks":["民事裁判","契約・証拠","法解釈・当てはめ","強制執行"],"options":[["民事裁判","紛争","裁判所","法解釈"],["契約・証拠","紛争","裁判所","法解釈"],["法解釈・当てはめ","紛争","裁判所","法解釈"],["強制執行","紛争","裁判所","法解釈"]]}],"59":[{"text":"AがBを殴り、Bが負傷した。「刑事」：「警察」↓捜査↓「検察」↓「起訴」↓「刑事裁判」↓有罪・無罪。「民事」：B↓Aに「損害賠償」請求↓民事裁判↓損害賠償。つまり、一つの事件に刑事・民事の両方が存在し得る。","blanks":["刑事","警察","検察","起訴","刑事裁判","民事","損害賠償"],"options":[["刑事","紛争","裁判所","法解釈"],["警察","紛争","裁判所","法解釈"],["検察","紛争","裁判所","法解釈"],["起訴","紛争","裁判所","法解釈"],["刑事裁判","紛争","裁判所","法解釈"],["民事","紛争","裁判所","法解釈"],["損害賠償","紛争","裁判所","法解釈"]]}],"60":[{"text":"「行政庁」がAの営業許可を取り消した。Aが、「違法な処分だ」と主張。行政庁↓処分↓A↓取消しを求める↓「行政事件訴訟」↓裁判所↓「処分の適法性」を審査","blanks":["行政庁","行政事件訴訟","処分の適法性"],"options":[["行政庁","紛争","裁判所","法解釈"],["行政事件訴訟","紛争","裁判所","法解釈"],["処分の適法性","紛争","裁判所","法解釈"]]}],"61":[{"text":"AとBが契約について争っている。A「契約した」B「契約していない」↓「契約書」↓「メール」↓「振込記録」↓「証人」↓裁判所が「事実認定」↓契約成立の「法律要件」を検討↓「当てはめ」↓「判決」","blanks":["契約書","メール","振込記録","証人","事実認定","法律要件","当てはめ","判決"],"options":[["契約書","紛争","裁判所","法解釈"],["メール","紛争","裁判所","法解釈"],["振込記録","紛争","裁判所","法解釈"],["証人","紛争","裁判所","法解釈"],["事実認定","紛争","裁判所","法解釈"],["法律要件","紛争","裁判所","法解釈"],["当てはめ","紛争","裁判所","法解釈"],["判決","紛争","裁判所","法解釈"]]}],"62":[{"text":"裁判を理解する基本公式は、「紛争」 → 「手続」 → 「事実認定」 → 「法解釈」 → 「当てはめ」 → 「判決」 → 必要に応じて「執行」である。紛争↓誰が？↓何を求める？↓どの手続？↓どんな事実？↓どの法律？↓どんな要件？↓当てはめ↓判決↓執行","blanks":["紛争","手続","事実認定","法解釈","当てはめ","判決","執行"],"options":[["紛争","裁判所","法解釈","事実認定"],["手続","紛争","裁判所","法解釈"],["事実認定","紛争","裁判所","法解釈"],["法解釈","紛争","裁判所","事実認定"],["当てはめ","紛争","裁判所","法解釈"],["判決","紛争","裁判所","法解釈"],["執行","紛争","裁判所","法解釈"]]}],"63":[{"text":"裁判の本質は、「具体的な紛争」について、裁判所が「法を解釈・適用」し、「公的な判断」を示すことである。そして裁判は、単に「勝ち・負け」を決める制度ではない。その背後には、「法の支配」、「人権保障」、紛争解決、「権利実現」、国家権力の統制という重要な役割がある。","blanks":["具体的な紛争","法を解釈・適用","公的な判断","法の支配","人権保障","権利実現"],"options":[["具体的な紛争","紛争","裁判所","法解釈"],["法を解釈・適用","紛争","裁判所","法解釈"],["公的な判断","紛争","裁判所","法解釈"],["法の支配","紛争","裁判所","法解釈"],["人権保障","紛争","裁判所","法解釈"],["権利実現","紛争","裁判所","法解釈"]]}],"64":[{"text":"「裁判」・司法：1.裁判とは何か。2.なぜ裁判が必要なのか。3.自力救済が原則として制限されるのはなぜか。4.司法とは何か。5.「司法権」とは何か。6.日本の裁判所には何があるか。7.最高裁判所の役割は？8.高等裁判所の役割は？9.地方裁判所の役割は？10.家庭裁判所の役割は？11.簡易裁判所の役割は？12.「審級制度」とは何か。13.なぜ審級制度が必要か。民事：14.「民事裁判」とは何か。15.原告と被告の違いは？16.請求とは何か。17.民事裁判で証拠が重要なのはなぜか。刑事：18.「刑事裁判」とは何か。19.被疑者と被告人の違いは？20.検察官の役割は？21.警察の役割は？22.弁護士の役割は？23.裁判官の役割は？24.「令状主義」とは何か。25.「黙秘権」とは何か。26.無罪推定とは何か。行政・違憲審査：27.「行政事件」とは何か。28.民事事件と行政事件の違いは？29.違憲審査とは何か。30.裁判所と三権分立はどう関係するか。判決・救済：31.判決とは何か。32.判決の確定とは何か。33.既判力とは何か。34.強制執行とは何か。35.裁判と強制執行はどうつながるか。36.ADRとは何か。37.和解とは何か。38.調停とは何か。39.仲裁とは何か。40.裁判とADRの違いは？","blanks":["裁判","司法権","審級制度","民事裁判","刑事裁判","行政事件","令状主義","黙秘権"],"options":[["裁判","紛争","裁判所","法解釈"],["司法権","紛争","裁判所","法解釈"],["審級制度","紛争","裁判所","法解釈"],["民事裁判","紛争","裁判所","法解釈"],["刑事裁判","紛争","裁判所","法解釈"],["行政事件","紛争","裁判所","法解釈"],["令状主義","紛争","裁判所","法解釈"],["黙秘権","紛争","裁判所","法解釈"]]}],"65":[{"text":"①「紛争発生」＝権利・利益の対立↓紛争。②「解決方法」＝紛争から「裁判」または「ADR」（和解・調停・仲裁）。③裁判＝当事者↓主張↓証拠↓「事実認定」↓「法解釈」↓「当てはめ」↓「判決」。④判決後＝判決↓確定↓自発的履行または強制執行↓権利実現。第4編の最重要10ポイント：1.裁判は具体的な紛争について法を解釈・適用する公的手続。2.司法権は裁判所に属する。3.日本には最高裁判所・高等裁判所・地方裁判所・家庭裁判所・簡易裁判所がある。4.審級制度は裁判の誤りの是正や法解釈の統一に役立つ。5.民事裁判は私人間の権利・義務等の紛争を扱う。6.刑事裁判は犯罪の成立や刑罰などを判断する。7.行政事件は行政活動をめぐる法律上の争いを扱う。8.裁判では事実認定と法解釈を区別する。9.判決だけで権利が実現しない場合には強制執行が問題になる。10.裁判は法の支配・人権保障・紛争解決・権利実現を支える。第4編完成：第1編→第2編→第3編→第4編まで完成した。法とは何か→どんな種類があるか→どこから来るか→どう解釈するか→どう具体的事件に適用するか→争いになったらどう解決するか、までつながった。次の第5編では法律家がどう分析し、論点を発見し、条文・判例・事実を組み合わせて法的結論を出すのかを学ぶ。","blanks":["紛争発生","解決方法","裁判","ADR","事実認定","法解釈","当てはめ","判決"],"options":[["紛争発生","紛争","裁判所","法解釈"],["解決方法","紛争","裁判所","法解釈"],["裁判","紛争","裁判所","法解釈"],["ADR","紛争","裁判所","法解釈"],["事実認定","紛争","裁判所","法解釈"],["法解釈","紛争","裁判所","事実認定"],["当てはめ","紛争","裁判所","法解釈"],["判決","紛争","裁判所","法解釈"]]}]},"5":{"1":[{"text":"「法的思考」とは、具体的な事実を法律上の問題として整理し、適用される「法規範」を発見・解釈し、事実を「当てはめ」て結論を導く思考方法である。「何が、どの法律に違反し、どの「法律効果」が発生するのか」を考える。","blanks":["法的思考","法規範","当てはめ","法律効果"],"options":[["法的思考","法規範","要件","法律効果"],["法規範","法的思考","要件","法律効果"],["当てはめ","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"]]}],"2":[{"text":"AがBから100万円を借りたが返さない。一般的には「借りたなら返すべき」と考えるが、「法的思考」では「金銭消費貸借契約」の成立、返済期限、「債務不履行」、Bが請求できる内容を検討する。","blanks":["法的思考","金銭消費貸借契約","債務不履行"],"options":[["法的思考","法規範","要件","法律効果"],["金銭消費貸借契約","法的思考","法規範","要件"],["債務不履行","法的思考","法規範","要件"]]}],"3":[{"text":"法律問題は、事実×法規範→法的結論として考える。「事実を確認」→「法的問題を発見」→「適用法規」を探す→「法解釈」→「法律要件」を整理→事実を「当てはめ」→「法律効果」→救済・手続、という順序で処理する。","blanks":["事実を確認","法的問題を発見","適用法規","法解釈","法律要件","当てはめ","法律効果"],"options":[["事実を確認","法的思考","法規範","要件"],["法的問題を発見","法的思考","法規範","要件"],["適用法規","法的思考","法規範","要件"],["法解釈","法的思考","法規範","要件"],["法律要件","法的思考","法規範","要件"],["当てはめ","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"]]}],"4":[{"text":"「法的三段論法」では、「大前提」が法律・法規範、「小前提」が具体的事実、結論が「法律効果」である。法規範＋事実→当てはめ→法律効果という構造で考える。","blanks":["法的三段論法","大前提","小前提","法律効果"],"options":[["法的三段論法","法的思考","法規範","要件"],["大前提","法的思考","法規範","要件"],["小前提","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"]]}],"5":[{"text":"法律を読むときは「要件」→「効果」で考える。要件は法律効果を発生させる条件、効果は要件を満たした場合の「法律上の結果」である。","blanks":["要件","効果","法律上の結果"],"options":[["要件","法的思考","法規範","法律効果"],["効果","法的思考","法規範","要件"],["法律上の結果","法的思考","法規範","要件"]]}],"6":[{"text":"法律家にとって重要なのは問題を見つけること。土地売買なら「契約成立」、「意思能力・行為能力」、「代理」、「錯誤」、「詐欺・強迫」、契約違反、「解除」、損害賠償請求などを考える。","blanks":["契約成立","意思能力・行為能力","代理","錯誤","詐欺・強迫","解除"],"options":[["契約成立","法的思考","法規範","要件"],["意思能力・行為能力","法的思考","法規範","要件"],["代理","法的思考","法規範","要件"],["錯誤","法的思考","法規範","要件"],["詐欺・強迫","法的思考","法規範","要件"],["解除","法的思考","法規範","要件"]]}],"7":[{"text":"「論点」とは、「法的な判断が必要となる重要な問題点」である。「契約が成立したか」が争われれば契約成立の要件が論点になる。","blanks":["論点","法的な判断が必要となる重要な問題点"],"options":[["論点","法的思考","法規範","要件"],["法的な判断が必要となる重要な問題点","法的思考","法規範","要件"]]}],"8":[{"text":"事実を、「誰が」・「誰に」・何をした・何が起きた・どんな権利義務が問題か・「どの法律」が関係するか・「どの要件」が問題か、に分解して論点を発見する。","blanks":["誰が","誰に","どの法律","どの要件"],"options":[["誰が","法的思考","法規範","要件"],["誰に","法的思考","法規範","要件"],["どの法律","法的思考","法規範","要件"],["どの要件","法的思考","法規範","要件"]]}],"9":[{"text":"法律関係は、誰が誰に何を請求できるかで整理する。AがBに100万円を貸せば、Bには「返還義務」、Aには100万円の返還「請求権」がある。","blanks":["請求権","返還義務","返還請求権"],"options":[["請求権","法的思考","法規範","要件"],["返還義務","法的思考","法規範","要件"],["返還請求権","法的思考","法規範","要件"]]}],"10":[{"text":"民事事件では「請求権の発生根拠」を探す。「契約」、「不法行為」、「不当利得」、「物権」その他の法律上の原因などから請求権を考える。","blanks":["請求権の発生根拠","契約","不法行為","不当利得","物権"],"options":[["請求権の発生根拠","法的思考","法規範","要件"],["契約","法的思考","法規範","要件"],["不法行為","法的思考","法規範","要件"],["不当利得","法的思考","法規範","要件"],["物権","法的思考","法規範","要件"]]}],"11":[{"text":"法律問題は「「誰が」・「誰に」・「何を」・「なぜ」」で整理する。誰が＝権利者・義務者、誰に＝相手方、何を＝権利義務、なぜ＝発生根拠。","blanks":["誰が","誰に","何を","なぜ"],"options":[["誰が","法的思考","法規範","要件"],["誰に","法的思考","法規範","要件"],["何を","法的思考","法規範","要件"],["なぜ","法的思考","法規範","要件"]]}],"12":[{"text":"「事実」と「法的評価」を区別する。「AはBを殴った」は事実、「Aには不法行為責任がある」は法的評価。事実→法的評価→「法律効果」の順で考える。","blanks":["事実","法的評価","法律効果"],"options":[["事実","法的思考","法規範","要件"],["法的評価","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"]]}],"13":[{"text":"「事実認定」とは、裁判で「何が起きたのか」を確定すること。本当にAがBを殴ったのかは事実認定の問題である。","blanks":["事実認定","何が起きたのか"],"options":[["事実認定","法的思考","法規範","要件"],["何が起きたのか","法的思考","法規範","要件"]]}],"14":[{"text":"「法律解釈」とは、その事実にどの法律をどう適用するかを考えること。「故意」とは何を意味するかは法律解釈の問題である。","blanks":["法律解釈"],"options":[["法律解釈","法的思考","法規範","要件"]]}],"15":[{"text":"「事実認定」は何が起きたかを「証拠・証言」等から判断し、「法律解釈」は法律が何を意味するかを「条文・判例」・法理から判断する。","blanks":["事実認定","法律解釈","証拠・証言","条文・判例"],"options":[["事実認定","法的思考","法規範","要件"],["法律解釈","法的思考","法規範","要件"],["証拠・証言","法的思考","法規範","要件"],["条文・判例","法的思考","法規範","要件"]]}],"16":[{"text":"「当てはめ」とは、「具体的事実」が「法律の要件」を満たすかを判断すること。事実と要件を結び付けて要件充足を説明する。","blanks":["当てはめ","法律の要件","具体的事実"],"options":[["当てはめ","法的思考","法規範","要件"],["法律の要件","法的思考","法規範","要件"],["具体的事実","法的思考","法規範","要件"]]}],"17":[{"text":"良い当てはめは「「要件」を満たす」とだけ書かず、「なぜ満たすのか」を事実に即して説明する。","blanks":["なぜ満たすのか","要件"],"options":[["なぜ満たすのか","法的思考","法規範","要件"],["要件","法的思考","法規範","法律効果"]]}],"18":[{"text":"自分に有利な事情だけでなく、「錯誤」・「詐欺・強迫」など、契約を取り消せないかという反対事実も検討する。","blanks":["錯誤","詐欺・強迫"],"options":[["錯誤","法的思考","法規範","要件"],["詐欺・強迫","法的思考","法規範","要件"]]}],"19":[{"text":"法律家の思考では、「Aの主張」→「Bの反論」→「Aの再反論」→法的評価という構造を作り、一方的な結論を避ける。","blanks":["Aの主張","Bの反論","Aの再反論"],"options":[["Aの主張","法的思考","法規範","要件"],["Bの反論","法的思考","法規範","要件"],["Aの再反論","法的思考","法規範","要件"]]}],"20":[{"text":"複数の問題があるときは、「契約成立」→有効→「債務不履行」→「解除」→「損害賠償」など、重要な争点を整理する。","blanks":["契約成立","債務不履行","解除","損害賠償"],"options":[["契約成立","法的思考","法規範","要件"],["債務不履行","法的思考","法規範","要件"],["解除","法的思考","法規範","要件"],["損害賠償","法的思考","法規範","要件"]]}],"21":[{"text":"すべての論点を同じ重さで扱わず、結論を左右する「重要論点」を優先する。契約自体が無効なら解除の細部を検討する意味がない場合がある。","blanks":["重要論点"],"options":[["重要論点","法的思考","法規範","要件"]]}],"22":[{"text":"法律問題は「前提問題」→「後続問題」の順に処理する。前の段階が否定されれば後ろの問題が不要になることがある。","blanks":["前提問題","後続問題"],"options":[["前提問題","法的思考","法規範","要件"],["後続問題","法的思考","法規範","要件"]]}],"23":[{"text":"何を実現したいかという「法律効果」から逆算し、何の権利か→「発生要件」は何か→事実は満たすか、と考える。","blanks":["法律効果","発生要件"],"options":[["法律効果","法的思考","法規範","要件"],["発生要件","法的思考","法規範","要件"]]}],"24":[{"text":"条文を読むときは、「主語」・「要件」・「効果」・「例外」を探す。「誰が→どの条件で→何を→どうする」という構造を見る。","blanks":["主語","要件","効果","例外"],"options":[["主語","法的思考","法規範","要件"],["要件","法的思考","法規範","法律効果"],["効果","法的思考","法規範","要件"],["例外","法的思考","法規範","要件"]]}],"25":[{"text":"法律には「原則」・「例外」・「ただし書」・「準用」・「委任」・「定義」などがある。条文を一文だけ切り取らず構造を読む。","blanks":["原則","例外","ただし書","準用","委任","定義"],"options":[["原則","法的思考","法規範","要件"],["例外","法的思考","法規範","要件"],["ただし書","法的思考","法規範","要件"],["準用","法的思考","法規範","要件"],["委任","法的思考","法規範","要件"],["定義","法的思考","法規範","要件"]]}],"26":[{"text":"「定義規定」は特定の言葉の意味を定める規定。法律独自の定義があれば、その「法律上の定義」が重要になる。","blanks":["定義規定","法律上の定義"],"options":[["定義規定","法的思考","法規範","要件"],["法律上の定義","法的思考","法規範","要件"]]}],"27":[{"text":"条文は孤立せず、「基本規定」→「例外規定」→「特則」→「準用規定」→関連規定というネットワークで理解する。","blanks":["基本規定","例外規定","特則","準用規定"],"options":[["基本規定","法的思考","法規範","要件"],["例外規定","法的思考","法規範","要件"],["特則","法的思考","法規範","要件"],["準用規定","法的思考","法規範","要件"]]}],"28":[{"text":"「一般法」と「特別法」が同じ問題に関係する場合、原則として特別法が一般法に優先する。「民法」と「借地借家法」などが例。","blanks":["一般法","特別法","民法","借地借家法"],"options":[["一般法","法的思考","法規範","要件"],["特別法","法的思考","法規範","要件"],["民法","法的思考","法規範","要件"],["借地借家法","法的思考","法規範","要件"]]}],"29":[{"text":"法律問題では「原則」だけでなく「ただし」という「例外」を常に意識する。","blanks":["原則","例外"],"options":[["原則","法的思考","法規範","要件"],["例外","法的思考","法規範","要件"]]}],"30":[{"text":"「判例」は裁判所が「具体的事件」について示した判断。法律が実際の事件でどう「解釈・適用」されるかを理解するために学ぶ。","blanks":["判例","具体的事件","解釈・適用"],"options":[["判例","法的思考","法規範","要件"],["具体的事件","法的思考","法規範","要件"],["解釈・適用","法的思考","法規範","要件"]]}],"31":[{"text":"判例は、「事案」→「争点」→当事者の主張→「裁判所の判断」→「理由」→「結論」、で整理すると分かりやすい。","blanks":["事案","争点","裁判所の判断","理由","結論"],"options":[["事案","法的思考","法規範","要件"],["争点","法的思考","法規範","要件"],["裁判所の判断","法的思考","法規範","要件"],["理由","法的思考","法規範","要件"],["結論","法的思考","法規範","要件"]]}],"32":[{"text":"「原告敗訴」だけでは不十分。なぜ敗訴したのか、「規範」→「理由」→「当てはめ」→「結論」を見る。","blanks":["規範","理由","当てはめ","結論"],"options":[["規範","法的思考","法規範","要件"],["理由","法的思考","法規範","要件"],["当てはめ","法的思考","法規範","要件"],["結論","法的思考","法規範","要件"]]}],"33":[{"text":"「判例の射程」とは、その判断がどのような「事案」にまで及ぶかという観点。事案が異なれば同じ結論とは限らない。","blanks":["判例の射程","事案"],"options":[["判例の射程","法的思考","法規範","要件"],["事案","法的思考","法規範","要件"]]}],"34":[{"text":"社会状況や法解釈の変化などにより裁判所が従来の判断を変更することがある。判例は永遠に固定されたルールではない。","blanks":[],"options":[]}],"35":[{"text":"社会的に望ましい結果だけで結論を出さず、まず「現行法」上どう評価されるかを検討し、その上で政策的・制度的問題を考える。","blanks":["現行法"],"options":[["現行法","法的思考","法規範","要件"]]}],"36":[{"text":"「法的安定性」とは、人々が法律関係を予測できること。同様の事案が毎回違う判断になれば社会は混乱する。","blanks":["法的安定性"],"options":[["法的安定性","法的思考","法規範","要件"]]}],"37":[{"text":"「具体的妥当性」とは、「個別具体的な事情」に応じた妥当な結論を重視すること。","blanks":["具体的妥当性","個別具体的な事情"],"options":[["具体的妥当性","法的思考","法規範","要件"],["個別具体的な事情","法的思考","法規範","要件"]]}],"38":[{"text":"法律学では「法的安定性」と「具体的妥当性」の「バランス」が重要で、どちらか一方だけでは不十分。","blanks":["法的安定性","具体的妥当性","バランス"],"options":[["法的安定性","法的思考","法規範","要件"],["具体的妥当性","法的思考","法規範","要件"],["バランス","法的思考","法規範","要件"]]}],"39":[{"text":"公平とは「同じものを同じように扱う」ことが重要だが、事情が異なるものまで無条件に同じ扱いにするとかえって不公平になる。","blanks":["同じものを同じように扱う"],"options":[["同じものを同じように扱う","法的思考","法規範","要件"]]}],"40":[{"text":"複数の利益が衝突する場合、「利益衡量」によりそれぞれを比較・調整することがある。「表現の自由」と「他人の名誉」などが例。ただし単純に大きい利益が勝つわけではない。","blanks":["利益衡量","表現の自由","他人の名誉"],"options":[["利益衡量","法的思考","法規範","要件"],["表現の自由","法的思考","法規範","要件"],["他人の名誉","法的思考","法規範","要件"]]}],"41":[{"text":"「比例原則的思考」では、公権力の制約について「目的」に対して「手段」が過大でないかを、目的→手段→「必要性」→「相当性」という視点から検討する。","blanks":["比例原則的思考","目的","手段","必要性","相当性"],"options":[["比例原則的思考","法的思考","法規範","要件"],["目的","法的思考","法規範","要件"],["手段","法的思考","法規範","要件"],["必要性","法的思考","法規範","要件"],["相当性","法的思考","法規範","要件"]]}],"42":[{"text":"「法的評価」とは、事実を法律上どのように評価するか。「Aの行為は「正当防衛」に当たる」は法的評価。","blanks":["法的評価","正当防衛"],"options":[["法的評価","法的思考","法規範","要件"],["正当防衛","法的思考","法規範","要件"]]}],"43":[{"text":"「証拠」→「事実認定」→「法的評価」→「法律効果」の順序を崩さない。事実を評価する前に、その事実が認定できるかを確認する。","blanks":["証拠","事実認定","法的評価","法律効果"],"options":[["証拠","法的思考","法規範","要件"],["事実認定","法的思考","法規範","要件"],["法的評価","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"]]}],"44":[{"text":"法的文章の基本構造は、「問題提起」→「規範」→「理由」→「当てはめ」→「結論」。結論だけを書かない。","blanks":["問題提起","規範","理由","当てはめ","結論"],"options":[["問題提起","法的思考","法規範","要件"],["規範","法的思考","法規範","要件"],["理由","法的思考","法規範","要件"],["当てはめ","法的思考","法規範","要件"],["結論","法的思考","法規範","要件"]]}],"45":[{"text":"「IRAC」は、I=「Issue」（問題点）、R=「Rule」（ルール）、A=「Application」（当てはめ）、C=「Conclusion」（結論）という実践的な型。","blanks":["IRAC","Issue","Rule","Application","Conclusion"],"options":[["IRAC","法的思考","法規範","要件"],["Issue","法的思考","法規範","要件"],["Rule","法的思考","法規範","要件"],["Application","法的思考","法規範","要件"],["Conclusion","法的思考","法規範","要件"]]}],"46":[{"text":"AがBを殴った事例では、「Issue」＝「不法行為責任」の成否、「Rule」＝不法行為の要件、「Application」＝Aの行為を要件に当てはめ、「Conclusion」＝要件を満たす限り損害賠償責任が成立する。","blanks":["Issue","Rule","Application","Conclusion","不法行為責任"],"options":[["Issue","法的思考","法規範","要件"],["Rule","法的思考","法規範","要件"],["Application","法的思考","法規範","要件"],["Conclusion","法的思考","法規範","要件"],["不法行為責任","法的思考","法規範","要件"]]}],"47":[{"text":"避けるべきなのは「感情論」、「結論だけ」、「条文の丸暗記」、「事実と評価の混同」。法的根拠と事実への適用を示す。","blanks":["感情論","結論だけ","条文の丸暗記","事実と評価の混同"],"options":[["感情論","法的思考","法規範","要件"],["結論だけ","法的思考","法規範","要件"],["条文の丸暗記","法的思考","法規範","要件"],["事実と評価の混同","法的思考","法規範","要件"]]}],"48":[{"text":"自分が好きな結論ではなく、「法的根拠」から導ける結論を探す。結論→理由→法的根拠→「事実」の関係を意識する。","blanks":["法的根拠","事実"],"options":[["法的根拠","法的思考","法規範","要件"],["事実","法的思考","法規範","要件"]]}],"49":[{"text":"高度な法律学では「自説」だけでなく「反対説」、「反対説の根拠」、問題点、「自説の優位性」まで検討し論証を強くする。","blanks":["自説","反対説","反対説の根拠","自説の優位性"],"options":[["自説","法的思考","法規範","要件"],["反対説","法的思考","法規範","要件"],["反対説の根拠","法的思考","法規範","要件"],["自説の優位性","法的思考","法規範","要件"]]}],"50":[{"text":"「学説」とは法律学者などが法律問題について示す「理論・見解」で、「判例」とは異なり裁判所の判断そのものではない。","blanks":["学説","理論・見解","判例"],"options":[["学説","法的思考","法規範","要件"],["理論・見解","法的思考","法規範","要件"],["判例","法的思考","法規範","要件"]]}],"51":[{"text":"学説には法律の意味の理論的説明、判例分析、「問題点」の指摘、「新しい解釈」の提案などの役割がある。","blanks":["問題点","新しい解釈"],"options":[["問題点","法的思考","法規範","要件"],["新しい解釈","法的思考","法規範","要件"]]}],"52":[{"text":"法律学では「条文」・「判例」・「学説」・「事実への適用」を関連させる。ただし条文・判例・学説は同じ法的地位ではない。","blanks":["条文","判例","学説","事実への適用"],"options":[["条文","法的思考","法規範","要件"],["判例","法的思考","法規範","要件"],["学説","法的思考","法規範","要件"],["事実への適用","法的思考","法規範","要件"]]}],"53":[{"text":"法律情報は信頼性を確認する。「憲法・法律」、「政令・省令」、「判例」、「公的資料」、基本書・専門書、解説記事等を区別し、一次的法源と解説を見分ける。","blanks":["憲法・法律","政令・省令","判例","公的資料"],"options":[["憲法・法律","法的思考","法規範","要件"],["政令・省令","法的思考","法規範","要件"],["判例","法的思考","法規範","要件"],["公的資料","法的思考","法規範","要件"]]}],"54":[{"text":"法律問題の調査は、事実整理→法律上の問題への変換→「関係条文」→「関連判例」→「学説・解説」→当てはめ→結論の順に進める。","blanks":["関係条文","関連判例","学説・解説"],"options":[["関係条文","法的思考","法規範","要件"],["関連判例","法的思考","法規範","要件"],["学説・解説","法的思考","法規範","要件"]]}],"55":[{"text":"「お金を返してくれない」より「「金銭消費貸借」・「返還請求」・「弁済期」」のように「法律上の概念」へ変換して検索する方が有効。","blanks":["法律上の概念","金銭消費貸借","返還請求","弁済期"],"options":[["法律上の概念","法的思考","法規範","要件"],["金銭消費貸借","法的思考","法規範","要件"],["返還請求","法的思考","法規範","要件"],["弁済期","法的思考","法規範","要件"]]}],"56":[{"text":"複雑な事件は、「契約成立」・有効・「債務不履行」・「解除」・損害発生・「因果関係」・損害額など、「小さな問題に分解」する。","blanks":["小さな問題に分解","契約成立","債務不履行","解除","因果関係"],"options":[["小さな問題に分解","法的思考","法規範","要件"],["契約成立","法的思考","法規範","要件"],["債務不履行","法的思考","法規範","要件"],["解除","法的思考","法規範","要件"],["因果関係","法的思考","法規範","要件"]]}],"57":[{"text":"法的思考の縦軸は、「法の目的」→「基本原理」→「条文」→「判例」→「具体的事実」→結論。","blanks":["法の目的","基本原理","条文","判例","具体的事実"],"options":[["法の目的","法的思考","法規範","要件"],["基本原理","法的思考","法規範","要件"],["条文","法的思考","法規範","要件"],["判例","法的思考","法規範","要件"],["具体的事実","法的思考","法規範","要件"]]}],"58":[{"text":"法的思考の横軸は、「憲法」・「民法」・「商法」・「行政法」・「刑法」・「手続法」など複数分野を横断して考えること。","blanks":["憲法","民法","商法","行政法","刑法","手続法"],"options":[["憲法","法的思考","法 }],"66":[{"text":"法的思考の最終モデルは、①「事実」→②「問題発見」→③「法源」→④「解釈」→⑤「要件」→⑥「当てはめ」→⑦「法律効果」→⑧「救済」→⑨反論→⑩最終結論。","blanks":["事実","問題発見","法源","解釈","要件","当てはめ","法律効果","救済"],"options":[["事実","法的思考","法規範","要件"],["問題発見","法的思考","法規範","要件"],["法源","法的思考","法規範","要件"],["解釈","法的思考","法規範","要件"],["要件","法的思考","法規範","法律効果"],["当てはめ","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"],["救済","法的思考","法規範","要件"]]}],"67":[{"text":"核心は結論を先に決めず、「法的根拠」→「要件」→「事実」→「当てはめ」→「法律効果」の順で考えること。日常的事実を法律上の概念へ変換する。","blanks":["法的根拠","要件","事実","当てはめ","法律効果"],"options":[["法的根拠","法的思考","法規範","要件"],["要件","法的思考","法規範","法律効果"],["事実","法的思考","法規範","要件"],["当てはめ","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"]]}],"68":[{"text":"「自己説明チェック」：法的思考、一般的思考との違い、「法的三段論法」、要件と効果、論点、論点発見、誰が・誰に・何を・なぜ、「事実認定」、「法律解釈」、法的評価、当てはめ、条文、一般法と特別法、原則と例外、判例、射程、学説、反論、反対説、法的安定性、具体的妥当性、利益衡量、比例原則、「IRAC」、問題分解、時系列、主体、法分野横断、民事・刑事・行政を説明する。","blanks":["自己説明チェック","法的三段論法","事実認定","法律解釈","IRAC"],"options":[["自己説明チェック","法的思考","法規範","要件"],["法的三段論法","法的思考","法規範","要件"],["事実認定","法的思考","法規範","要件"],["法律解釈","法的思考","法規範","要件"],["IRAC","法的思考","法規範","要件"]]}],"69":[{"text":"第5編最終整理：①「事実」整理→②法律問題発見→③「法源」→④「解釈」→⑤「要件」→⑥「当てはめ」→⑦「法律効果」→⑧「救済」・手続→⑨反論→⑩結論。最重要公式は、法源→解釈→要件→事実→当てはめ→法律効果→救済、そして「Issue」→Rule→Application→Conclusion。","blanks":["法源","解釈","要件","事実","当てはめ","法律効果","救済","Issue"],"options":[["法源","法的思考","法規範","要件"],["解釈","法的思考","法規範","要件"],["要件","法的思考","法規範","法律効果"],["事実","法的思考","法規範","要件"],["当てはめ","法的思考","法規範","要件"],["法律効果","法的思考","法規範","要件"],["救済","法的思考","法規範","要件"],["Issue","法的思考","法規範","要件"]]}]},"6":{"1":[{"text":"「法」は「社会」から切り離された存在ではない。社会に人が存在し、利益の対立・権利侵害・「紛争」が発生するからこそ、法が必要になる。人間社会→利益・価値観の対立→紛争→「ルールの必要性」→法。","blanks":["法","社会","紛争","ルールの必要性"],"options":[["法","法源","法の支配","法治主義"],["社会","法","法源","法の支配"],["紛争","法","法源","法の支配"],["ルールの必要性","法","法源","法の支配"]]}],"2":[{"text":"「法」は人々の「行動」を一定の範囲で規律する。契約・所有・婚姻・相続・犯罪・税・行政など、「社会生活の基本的ルール」として機能する。","blanks":["法","行動","社会生活の基本的ルール"],"options":[["法","法源","法の支配","法治主義"],["行動","法","法源","法の支配"],["社会生活の基本的ルール","法","法源","法の支配"]]}],"3":[{"text":"法は既存の社会を維持するだけではない。「法改正」によって社会そのものを変化させることもある。「社会問題」→政治的議論→法改正→「新しいルール」→「社会の変化」。","blanks":["法改正","社会問題","新しいルール","社会の変化"],"options":[["法改正","法","法源","法の支配"],["社会問題","法","法源","法の支配"],["新しいルール","法","法源","法の支配"],["社会の変化","法","法源","法の支配"]]}],"4":[{"text":"近代「国家」では国家が「法を制定・執行」する。しかし国家だから何をしてもよいわけではない。ここで重要になるのが「法の支配」である。","blanks":["国家","法を制定・執行","法の支配"],"options":[["国家","法","法源","法の支配"],["法を制定・執行","法","法源","法の支配"],["法の支配","法","法源","法治主義"]]}],"5":[{"text":"「「法」の支配」とは、「国家権力」も法に従わなければならないという考え方。国民→法→国家権力という構造を持つ。","blanks":["法の支配","国家権力","法"],"options":[["法の支配","法","法源","法治主義"],["国家権力","法","法源","法の支配"],["法","法源","法の支配","法治主義"]]}],"6":[{"text":"「法治主義」は、「行政」などの国家活動を法に基づいて行わせるという考え方。特に行政法では、行政活動と「法律」との関係が重要になる。","blanks":["法治主義","行政","法律"],"options":[["法治主義","法","法源","法の支配"],["行政","法","法源","法の支配"],["法律","法","法源","法の支配"]]}],"7":[{"text":"「法の支配」は、「国家権力」による人権侵害を防ぐ役割を持つ。国家権力→法による制限→「人権保障」。","blanks":["法の支配","国家権力","人権保障"],"options":[["法の支配","法","法源","法治主義"],["国家権力","法","法源","法の支配"],["人権保障","法","法源","法の支配"]]}],"8":[{"text":"日本の法秩序では、「憲法」が「最高法規」である。憲法→「法律」→「政令・省令」等→個別の行政行為等という基本的な上下関係がある。","blanks":["憲法","最高法規","法律","政令・省令"],"options":[["憲法","法","法源","法の支配"],["最高法規","法","法源","法の支配"],["法律","法","法源","法の支配"],["政令・省令","法","法源","法の支配"]]}],"9":[{"text":"「基本的人権」は国家から与えられる単なる恩恵ではない。憲法によって、「国家権力」から「尊重・保障」されるべき基本的権利として位置づけられている。","blanks":["基本的人権","国家権力","尊重・保障"],"options":[["基本的人権","法","法源","法の支配"],["国家権力","法","法源","法の支配"],["尊重・保障","法","法源","法の支配"]]}],"10":[{"text":"「自由」とは何をしてもよいという意味ではない。「他人の権利」や社会秩序との関係で一定の「法的制約」を受ける。自分の自由↕他人の権利↕「公共的利益」。","blanks":["自由","他人の権利","公共的利益","法的制約"],"options":[["自由","法","法源","法の支配"],["他人の権利","法","法源","法の支配"],["公共的利益","法","法源","法の支配"],["法的制約","法","法源","法の支配"]]}],"11":[{"text":"法は人を不合理に差別してはならないという「平等原則」とも関係する。すべての人を常に完全に同じ扱いにすることが平等とは限らず、「合理的な区別」か「不合理な差別」かが重要である。","blanks":["平等原則","合理的な区別","不合理な差別"],"options":[["平等原則","法","法源","法の支配"],["合理的な区別","法","法源","法の支配"],["不合理な差別","法","法源","法の支配"]]}],"12":[{"text":"法学では「法律に従っていれば、それだけで「正義」なのか」という問題が生じる。正義・「公平」・「自由」・「平等」・「安全」・「社会秩序」などの価値が関係する。","blanks":["正義","公平","自由","平等","安全","社会秩序"],"options":[["正義","法","法源","法の支配"],["公平","法","法源","法の支配"],["自由","法","法源","法の支配"],["平等","法","法源","法の支配"],["安全","法","法源","法の支配"],["社会秩序","法","法源","法の支配"]]}],"13":[{"text":"「形式的正義」とは、「同じルールを同じように適用」するという側面。同じ条件の人には同じルールを適用する。「法的安定性」とも関係する。","blanks":["形式的正義","同じルールを同じように適用","法的安定性"],"options":[["形式的正義","法","法源","法の支配"],["同じルールを同じように適用","法","法源","法の支配"],["法的安定性","法","法源","法の支配"]]}],"14":[{"text":"「実質的正義」は、結果や「実質的な公平」にも目を向ける。表面的には同じ扱いでも、実際には著しく不公平という場合がある。","blanks":["実質的正義","実質的な公平"],"options":[["実質的正義","法","法源","法の支配"],["実質的な公平","法","法源","法の支配"]]}],"15":[{"text":"法は「正義」を実現するための重要な手段である。しかし法律と正義が常に完全に一致するとは限らない。だからこそ「法改正」・「違憲審査」・「司法判断」・「学説」などが存在する。","blanks":["正義","法改正","違憲審査","司法判断","学説"],"options":[["正義","法","法源","法の支配"],["法改正","法","法源","法の支配"],["違憲審査","法","法源","法の支配"],["司法判断","法","法源","法の支配"],["学説","法","法源","法の支配"]]}],"16":[{"text":"「倫理」とは、人間が「「何が正しいか」」を考える規範である。「法」と倫理は重なる部分があるが、完全に同じではない。","blanks":["倫理","何が正しいか","法"],"options":[["倫理","法","法源","法の支配"],["何が正しいか","法","法源","法の支配"],["法","法源","法の支配","法治主義"]]}],"17":[{"text":"困っている人を助けることは「道徳」的に望ましい。しかしすべての場面で「法」律上の義務になるとは限らない。道徳≠法。","blanks":["道徳","法"],"options":[["道徳","法","法源","法の支配"],["法","法源","法の支配","法治主義"]]}],"18":[{"text":"宗教も人々の行動規範となる。しかし日本国憲法では「信教の自由」が保障され、「国家と宗教」との関係にも一定の制約がある。","blanks":["信教の自由","国家と宗教"],"options":[["信教の自由","法","法源","法の支配"],["国家と宗教","法","法源","法の支配"]]}],"19":[{"text":"経済活動には「契約」・「所有権」・「会社」・金融・「消費者保護」・「労働」・「税」など、多くの法制度が関係する。市場経済も「法的基盤」なしには成立しにくい。","blanks":["契約","所有権","会社","消費者保護","労働","税","法的基盤"],"options":[["契約","法","法源","法の支配"],["所有権","法","法源","法の支配"],["会社","法","法源","法の支配"],["消費者保護","法","法源","法の支配"],["労働","法","法源","法の支配"],["税","法","法源","法の支配"],["法的基盤","法","法源","法の支配"]]}],"20":[{"text":"民法では当事者が自由に契約を結ぶという考え方が重要。しかし完全に無制限ではなく、「法律上の制限」、「公序良俗」、「強行規定」、消費者保護等が関係する。","blanks":["法律上の制限","公序良俗","強行規定"],"options":[["法律上の制限","法","法源","法の支配"],["公序良俗","法","法源","法の支配"],["強行規定","法","法源","法の支配"]]}],"21":[{"text":"「所有権」は「財産」を支配する基本的な権利。しかし所有権も無制限の絶対的権利ではなく、法によって他人の権利や「公共的利益」との調整が行われる。","blanks":["所有権","財産","公共的利益"],"options":[["所有権","法","法源","法の支配"],["財産","法","法源","法の支配"],["公共的利益","法","法源","法の支配"]]}],"22":[{"text":"企業活動には「会社法」・「商法」・「民法」・「労働法」・「税法」・「独占禁止法」・金融関連法などが関係する。企業は法的主体として活動する。","blanks":["会社法","商法","民法","労働法","税法","独占禁止法"],"options":[["会社法","法","法源","法の支配"],["商法","法","法源","法の支配"],["民法","法","法源","法の支配"],["労働法","法","法源","法の支配"],["税法","法","法源","法の支配"],["独占禁止法","法","法源","法の支配"]]}],"23":[{"text":"「消費者」は企業と比べて情報・交渉力などで弱い立場になることがある。そこで「消費者契約法」などによって一定の「保護」が図られている。","blanks":["消費者","消費者契約法","保護"],"options":[["消費者","法","法源","法の支配"],["消費者契約法","法","法源","法の支配"],["保護","法","法源","法の支配"]]}],"24":[{"text":"労働関係では「労働者」と「使用者」の力関係が問題になる。そのため「労働条件」・「賃金」・「労働時間」・「解雇」・労働安全などについて法的規制が存在する。","blanks":["労働者","使用者","労働条件","賃金","労働時間","解雇"],"options":[["労働者","法","法源","法の支配"],["使用者","法","法源","法の支配"],["労働条件","法","法源","法の支配"],["賃金","法","法源","法の支配"],["労働時間","法","法源","法の支配"],["解雇","法","法源","法の支配"]]}],"25":[{"text":"「技術」が進歩すると、従来の法律では想定していなかった問題が生じる。「インターネット」・「SNS」・「AI」・仮想空間・「自動運転」・バイオテクノロジーなど。","blanks":["技術","インターネット","SNS","AI","自動運転"],"options":[["技術","法","法源","法の支配"],["インターネット","法","法源","法の支配"],["SNS","法","法源","法の支配"],["AI","法","法源","法の支配"],["自動運転","法","法源","法の支配"]]}],"26":[{"text":"「インターネット」では「名誉毀損」・「著作権」・「個人情報」・「プライバシー」・契約・犯罪など多数の法律問題が発生する。新しい技術だから別世界の法が適用されるわけではない。","blanks":["インターネット","名誉毀損","著作権","個人情報","プライバシー"],"options":[["インターネット","法","法源","法の支配"],["名誉毀損","法","法源","法の支配"],["著作権","法","法源","法の支配"],["個人情報","法","法源","法の支配"],["プライバシー","法","法源","法の支配"]]}],"27":[{"text":"「SNS」では「表現の自由」が重要になる一方、「名誉」・「プライバシー」・「著作権」・営業上の利益・他人の人格権などとの衝突も生じる。表現の自由と他人の権利の調整問題になる。","blanks":["SNS","表現の自由","名誉","プライバシー","著作権"],"options":[["SNS","法","法源","法の支配"],["表現の自由","法","法源","法の支配"],["名誉","法","法源","法の支配"],["プライバシー","法","法源","法の支配"],["著作権","法","法源","法の支配"]]}],"28":[{"text":"「AI」の発達によって「AIが行った行為について誰が「責任」を負うのか」という問題が生じる。AIによる誤情報・「著作権」・「個人情報」・「差別的出力」・製造物責任・契約責任などが問題になる。","blanks":["AI","責任","著作権","個人情報","差別的出力"],"options":[["AI","法","法源","法の支配"],["責任","法","法源"," "予算における衆議院の優越","決算","会計検査院","公金支出の制限","財政と基本的人権","財政と国会","地方自治とは何か","地方自治の本旨","住民自治","団体自治","地方公共団体","地方議会","地方公共団体の長","地方議会議員","地方自治の基本構造","条例","条例と法律","地方自治と法律","地方自治と住民","住民の直接参加","地方自治と民主主義","地方自治と基本的人権","地方自治と行政法","憲法保障とは何か","なぜ憲法保障が必要なのか","憲法保障の仕組み","最高法規性","憲法と法律","憲法尊重擁護義務","なぜ公務員に義務があるのか","違憲審査制","違憲審査と最高裁判所","憲法保障と国会","憲法保障と内閣","憲法保障と裁判所","憲法保障と国民","憲法改正","憲法改正の発議","国民投票","なぜ国民投票が必要なのか","硬性憲法","憲法改正と憲法保障","憲法改正の限界","憲法と緊急事態","憲法保障と権力分立","憲法保障の全体構造","総合事例①――課税","総合事例②――地方条例","総合事例③――違憲立法","総合事例④――憲法改正","憲法全体の最終体系","憲法の全体を一つにつなげる","憲法の基本構造","国民主権との統合","基本的人権との統合","財政との統合","地方自治との統合","憲法保障の最終構造","第10編の核心","自己説明チェック","第10編最終整理"]],"questions":{"1":{"1":[{"text":"憲法とは、\n国家の基本的な仕組みと、国家と国民との関係を定める最高法規\nである。\n普通の法律が、\n国民の具体的な権利義務や社会生活\nを規律するのに対して、憲法は、\n国家そのものをどのように構成し、国家権力をどのように制限するか\nを定める。\n\n⸻\n\n憲法の基本構造\n憲法\n│\n┌─────────┴─────────┐\n│                   │\n国家の仕組み          国家権力の制限\n│                   │\n国会・内閣・裁判所      基本的人権\n│                   │\n└─────────┬─────────┘\n│\n国民の自由\nと権利を保障\nしたがって憲法を学ぶときは、\n「国家権力をどう作り、どう制限するのか」\nという視点が重要になる。\n\n⸻","blanks":["国家権力をどう作り、どう制限するのか","憲法の基本構造","基本的人権","最高法規","裁判所"],"options":[["国家権力をどう作り、どう制限するのか","日本国憲法の基本原理","基本的人権の尊重","戦力の不保持"],["憲法の基本構造","表現の自由","基本的人権とは何か","地方公共団体"],["基本的人権","憲法解釈","損失補償","最高法規"],["最高法規","人身の自由","の意味","幸福追求"],["裁判所","の意味","国民投票","憲法9条"]],"mode":"constitution"}],"2":[{"text":"近代憲法の重要な目的は、\n国家権力から国民の自由・権利を保障すること\nである。\n国家には、\n•\t警察\n•\t税金を徴収する権限\n•\t刑罰を科す権限\n•\t法律を制定する権限\n•\t行政を行う権限\nなど、非常に強い権力がある。\nそこで、\n「国家が強大な権力を持つなら、その権力を制限しなければならない」\nという考え方が生まれる。\nこれが近代立憲主義につながる。\n\n⸻","blanks":["近代立憲主義","憲法","刑罰"],"options":[["近代立憲主義","公共の福祉","戦力の不保持","憲法と民法"],["憲法","国会","憲法9条","国家権力"],["刑罰","司法権","主権","天皇"]],"mode":"constitution"}],"3":[{"text":"立憲主義とは、\n国家権力を憲法によって制限し、国民の自由・権利を保障しようとする考え方\nである。\n重要なのは、\n「憲法があること」\nだけではない。\nむしろ、\n国家権力が憲法に従わなければならない\nという点に意味がある。\n\n⸻\n\nイメージ\n国家権力\n↓\n何でも自由にできる\n×\n↓\n憲法\n↓\n国家権力を制限\n↓\n国民の自由・権利を保障\n\n⸻","blanks":["憲法があること","立憲主義"],"options":[["憲法があること","公共の福祉","憲法と民法","日本国憲法"],["立憲主義","プライバシ","憲法解釈","適正手続"]],"mode":"constitution"}],"4":[{"text":"近代立憲主義は、\n国家権力を制限すること\nを中心的な考え方とする。\nその背景には、\n•\t人権保障\n•\t権力分立\n•\t法の支配\n•\t国民主権\nなどがある。\nこれらは後の各論で詳しく学ぶ。\n\n⸻","blanks":["近代立憲主義","国民主権","権力分立","法の支配"],"options":[["近代立憲主義","主権とは何か","プライバシ","戦力の不保持"],["国民主権","代表民主制","最高法規","国民投票"],["権力分立","の意味","立憲主義","国民主権"],["法の支配","国民主権","憲法解釈","法治主義"]],"mode":"constitution"}],"5":[{"text":"日本国憲法を理解するうえで、特に重要なのが、\n① 国民主権\n② 基本的人権の尊重\n③ 平和主義\nである。\nこの3つは日本国憲法の基本原理として理解される。\n\n⸻","blanks":["日本国憲法の基本原理","基本的人権の尊重","国民主権","平和主義"],"options":[["日本国憲法の基本原理","人身の自由","唯一の立法機関","憲法全体の構造"],["基本的人権の尊重","そもそも人権とは何か","この法律は違憲ですか","憲法の基本構造"],["国民主権","損失補償","最高法規","違憲審査"],["平和主義","違憲審査","損失補償","立憲主義"]],"mode":"constitution"}],"6":[{"text":"日本国憲法は、\n主権が国民に存する\nという考え方を採用している。\nこれが国民主権。\nつまり、\n国家の政治の最終的な正当性の根拠を国民に求める。\n\n⸻","blanks":["国民主権","憲法"],"options":[["国民主権","最高法規","憲法と民法","国家権力"],["憲法","議会","国家賠償","天皇"]],"mode":"constitution"}],"7":[{"text":"「主権」という言葉には複数の意味があるため注意する。\n一般的には、\n国家の統治についての最高の決定権\nという意味で用いられる。\n日本国憲法では、\n国民が政治の最終的な正当性の根拠となる\nという意味で国民主権を理解することが重要。\n\n⸻","blanks":["主権","の意味","憲法"],"options":[["主権","国家賠償","国家権力","の意味"],["の意味","国家権力","幸福追求","内閣"],["憲法","国家賠償","平和主義","教育"]],"mode":"constitution"}],"8":[{"text":"国民主権は、\n民主主義\nと深く関係する。\n国民が、\n•\t選挙\n•\t国民投票\n•\t政治的意思表明\nなどを通じて政治に関与する。\nただし、\n国民が直接すべての政治を行う\nという意味ではない。\n日本では基本的に、\n代表民主制\nが採用されている。\n\n⸻","blanks":["代表民主制","国民主権","国民投票","選挙"],"options":[["代表民主制","プライバシ","憲法と民法","憲法改正"],["国民主権","憲法98条","最高法規","人身の自由"],["国民投票","平和主義","国家権力","最高法規"],["選挙","幸福追求","主権","内閣"]],"mode":"constitution"}],"9":[{"text":"日本では国民が、\n国会議員などの代表者\nを選挙によって選ぶ。\nそして代表者が、\n国民を代表して政治を行う。\nこれを、\n代表民主制\nという。\n\n⸻\n\n直接民主制との比較\n制度\t内容\n直接民主制\t国民自身が直接決定\n代表民主制\t選挙で代表者を選び、代表者が政治を行う\n日本国憲法では、\n代表民主制が基本。\nただし、憲法改正については国民投票が必要となる。\n\n⸻","blanks":["代表民主制","憲法改正","国民投票","国会","選挙"],"options":[["代表民主制","憲法と法律","憲法改正","憲法9条"],["憲法改正","法治主義","国民投票","立憲主義"],["国民投票","代表民主制","公共の福祉","の意味"],["国会","制限","憲法改正","憲法9条"],["選挙","刑罰","司法権","制限"]],"mode":"constitution"}],"10":[{"text":"日本国憲法の中心的原理の一つが、\n基本的人権の尊重\nである。\n基本的人権とは、\n人間が人間として尊重され、自由で尊厳ある生活を送るために保障される基本的な権利\nである。\n\n⸻","blanks":["基本的人権の尊重","憲法"],"options":[["基本的人権の尊重","日本国憲法の基本原理","基本的人権","地方公共団体"],["憲法","制限","議会","条例"]],"mode":"constitution"}],"11":[{"text":"基本的人権には、\n国家から保障されるだけではなく、人間の尊厳に根ざした権利\nという性格がある。\nそのため憲法では、\n•\t思想\n•\t信教\n•\t表現\n•\t身体\n•\t職業\n•\t財産\n•\t生存\n•\t教育\n•\t労働\n•\t参政\nなど、幅広い権利を保障している。\n\n⸻","blanks":["基本的人権","憲法","教育","思想"],"options":[["基本的人権","違憲審査権","憲法と法律","代表民主制"],["憲法","天皇","国務大臣","司法権"],["教育","侵害","国家権力","国民主権"],["思想","天皇","憲法","選挙"]],"mode":"constitution"}],"12":[{"text":"憲法上の人権保障を考えるとき、\n誰に対して保障される権利なのか\nを考える必要がある。\n基本的には、\n国家権力から個人を守る\nという構造が中心になる。\n\n⸻\n\n基本構造\n国家\n│\n国家権力\n↓\n┌─────┐\n│ 個人 │\n└─────┘\n↑\n憲法が保障\n\n⸻","blanks":["憲法","国家権力"],"options":[["憲法","国家権力","条約","思想"],["国家権力","幸福追求","権力分立","法律制定"]],"mode":"constitution"}],"13":[{"text":"基本的人権は、\n何をしても絶対に自由\nという意味ではない。\n日本国憲法では、\n公共の福祉\nによる人権制約が問題となる。\n例えば、\n表現の自由\nと\n他人の名誉・プライバシー\nなどが衝突する場合がある。\nそのため、\n権利と権利の調整\nが必要となる。\n\n⸻","blanks":["公共の福祉","プライバシ","表現の自由","基本的人権","憲法"],"options":[["公共の福祉","憲法と法律","地方自治","損失補償"],["プライバシ","憲法と行政法","憲法9条","表現の自由"],["表現の自由","憲法解釈","国務大臣","損失補償"],["基本的人権","司法審査","憲法解釈","国務大臣"],["憲法","憲法9条","国家賠償","教育"]],"mode":"constitution"}],"14":[{"text":"公共の福祉については、\n「国家が公共のためと言えば、自由を好きなだけ制限できる」\nという意味ではない。\n人権を制約する場合には、\n•\tどの権利が問題なのか\n•\tどのような制約なのか\n•\t制約の目的は何か\n•\t制約は必要か\n•\t制約の程度は適切か\nなどを検討する。\n\n⸻","blanks":["公共の福祉","制限"],"options":[["公共の福祉","最高裁判所","憲法と行政法","最高法規"],["制限","憲法改正","国家賠償","天皇"]],"mode":"constitution"}],"15":[{"text":"日本国憲法は、\n戦争の放棄\nを定めている。\n憲法9条が中心となる。\n\n⸻","blanks":["憲法9条","日本国憲法"],"options":[["憲法9条","最高法規","権力分立","プライバシ"],["日本国憲法","損失補償","違憲審査権","表現の自由"]],"mode":"constitution"}],"16":[{"text":"憲法9条は、\n戦争を放棄すること\nを定める。\nさらに、\n戦力の不保持\n交戦権の否認\nについて定めている。\n\n⸻","blanks":["憲法9条","戦力の不保持"],"options":[["憲法9条","憲法改正","地方自治","無罪推定"],["戦力の不保持","憲法98条","地方公共団体","憲法があること"]],"mode":"constitution"}],"17":[{"text":"憲法9条を理解するとき、\n「日本には一切の実力組織が存在できない」\nと単純に考えてはいけない。\n政府は、\n自衛のための必要最小限度の実力\nについて、憲法9条の下でも許容されるという解釈を採用している。\nこの問題は、\n自衛隊\n集団的自衛権\n安全保障法制\nなどにつながる。\n詳細な学説・判例は後の総合教科書で掘り下げる。\n\n⸻","blanks":["日本には一切の実力組織が存在できない","憲法9条"],"options":[["日本には一切の実力組織が存在できない","日本国憲法の基本原理","近代立憲主義","憲法全体の構造"],["憲法9条","無罪推定","国家賠償","法律制定"]],"mode":"constitution"}],"18":[{"text":"憲法は、\n国の最高法規\nである。\n憲法に反する法律や命令などは、\n憲法に適合するかが問題となる。\n\n⸻","blanks":["最高法規","憲法"],"options":[["最高法規","代表民主制","憲法と民法","プライバシ"],["憲法","の意味","国家賠償","刑罰"]],"mode":"constitution"}],"19":[{"text":"憲法98条は、\n憲法が国の最高法規である\nことを定める。\nまた、\n条約・法律などについて誠実に遵守すること\nも定めている。\n\n⸻","blanks":["憲法98条","最高法規","条約"],"options":[["憲法98条","人身の自由","表現の自由","最高法規"],["最高法規","幸福追求","立憲主義","の意味"],["条約","思想","侵害","財産権"]],"mode":"constitution"}],"20":[{"text":"憲法99条では、\n天皇・国務大臣・国会議員・裁判官その他の公務員\nに憲法を尊重し擁護する義務を課している。\nここで重要なのは、\n国民一般に対する規定ではない\nという点。\nつまり、\n国家機関・公務員\n↓\n憲法を尊重・擁護\n↓\n国家権力が憲法に従う\nという構造。\n\n⸻","blanks":["国務大臣","国会","天皇","憲法"],"options":[["国務大臣","国家権力","憲法改正","人身の自由"],["国会","裁判所","幸福追求","司法権"],["天皇","国務大臣","内閣","国家賠償"],["憲法","内閣","平和主義","国会"]],"mode":"constitution"}],"21":[{"text":"法の支配とは、\n国家権力も法に従わなければならない\nという原理。\n国家が、\n「自分たちは国家だから自由に権力を行使できる」\nとはならない。\n\n⸻","blanks":["法の支配","国家権力"],"options":[["法の支配","プライバシ","憲法と民法","損失補償"],["国家権力","国家賠償","憲法改正","損失補償"]],"mode":"constitution"}],"22":[{"text":"似た概念として、\n法治主義\nがある。\n法治主義\n行政などの国家作用を法律に従わせることを重視する。\n法の支配\n国家権力そのものを法によって拘束し、人権保障を実現することを重視する。\n両者は関連するが、\n完全に同じ概念ではない。\n\n⸻","blanks":["法治主義","法の支配"],"options":[["法治主義","地方自治","人身の自由","権力分立"],["法の支配","地方自治","国家賠償","幸福追求"]],"mode":"constitution"}],"23":[{"text":"国家権力を一つの機関に集中させると、\n権力濫用\nの危険がある。\nそこで、\n国家権力を複数の機関に分ける。\nこれが権力分立。\n日本では、\n国家権力\n│\n┌─────────┼─────────┐\n↓         ↓         ↓\n国会       内閣      裁判所\n立法        行政       司法\nという三権分立を基本とする。\n\n⸻","blanks":["権力分立","裁判所","国会","内閣"],"options":[["権力分立","法の支配","司法権","プライバシ"],["裁判所","国会","天皇","衆議院"],["国会","国民主権","幸福追求","主権"],["内閣","思想","幸福追求","議会"]],"mode":"constitution"}],"24":[{"text":"国会は、\n国権の最高機関\nであり、\n唯一の立法機関\nとされる。\n国会については第7編で詳しく学ぶ。\n\n⸻","blanks":["国会","唯一の立法機関","国権の最高機関"],"options":[["国会","条約","思想","司法審査"],["唯一の立法機関","地方公共団体","主権とは何か","基本的人権とは何か"],["国権の最高機関","天皇の国事行為","国家機関の権限","基本的人権"]],"mode":"constitution"}],"25":[{"text":"内閣は、\n行政権\nを担当する。\n内閣総理大臣を中心として、\n国の行政を統括する。\n詳細は第8編で学ぶ。\n\n⸻","blanks":["内閣","行政権"],"options":[["内閣","条例","国家賠償","憲法9条"],["行政権","侵害","憲法9条","司法審査"]],"mode":"constitution"}],"26":[{"text":"司法権は、\n裁判所\nに属する。\n裁判所は、\n法律上の紛争について判断し、法を適用する。\nまた、\n法律などが憲法に適合するか\nを判断する違憲審査権も重要。\n詳細は第9編で学ぶ。\n\n⸻","blanks":["裁判所","違憲審査権","司法権","憲法"],"options":[["裁判所","司法権","地方自治","主権"],["違憲審査権","憲法98条","憲法と行政法","戦力の不保持"],["司法権","内閣","制限","衆議院"],["憲法","憲法9条","選挙","思想"]],"mode":"constitution"}],"27":[{"text":"三権分立は、\n「国会・内閣・裁判所が完全に独立して一切関係しない」\nという意味ではない。\nむしろ、\n相互に関係しながら、互いに権力を抑制する\n仕組み。\n\n⸻\n\n例\n国会\n↓\n法律制定\n↓\n内閣\n↓\n行政執行\n↓\n裁判所\n↓\n違法・違憲か審査\nこのように、\n相互牽制\nが行われる。\n\n⸻","blanks":["法律制定","裁判所","国会","内閣"],"options":[["法律制定","人身の自由","司法審査","地方自治"],["裁判所","財産権","国民主権","憲法解釈"],["国会","内閣","制限","司法審査"],["内閣","議会","教育","裁判所"]],"mode":"constitution"}],"28":[{"text":"日本国憲法では、\n天皇は日本国および日本国民統合の象徴\nとされている。\n天皇は、\n国政に関する権能を有しない。\n\n⸻","blanks":["天皇","憲法"],"options":[["天皇","国家権力","国民投票","刑罰"],["憲法","裁判所","思想","幸福追求"]],"mode":"constitution"}],"29":[{"text":"天皇は、\n憲法が定める国事行為\nを行う。\n例えば、\n•\t国会の召集\n•\t衆議院の解散\n•\t法律等の公布\n•\t国務大臣等の任免に関する認証\n•\t外国の大使・公使の接受\nなど。\nただし、\n内閣の助言と承認\nが必要となる。\n\n⸻","blanks":["国務大臣","衆議院","国会","天皇","憲法"],"options":[["国務大臣","プライバシ","の意味","立憲主義"],["衆議院","内閣","国民投票","侵害"],["国会","思想","国務大臣","財産権"],["天皇","制限","裁判所","思想"],["憲法","条例","思想","司法審査"]],"mode":"constitution"}],"30":[{"text":"日本国憲法は、\n地方自治\nを保障している。\n地方公共団体について、\n•\t議会\n•\t長\n•\t条例\n•\t地方自治\nなどの仕組みを定める。\n詳細は第10編で学ぶ。\n\n⸻","blanks":["地方自治","地方公共団体","条例","憲法","議会"],"options":[["地方自治","司法権","憲法と民法","権力分立"],["地方公共団体","代表民主制","国家権力","表現の自由"],["条例","内閣","国民主権","刑罰"],["憲法","天皇","思想","侵害"],["議会","憲法","条例","司法審査"]],"mode":"constitution"}],"31":[{"text":"憲法と法律は、\n同じ「法」でも役割が異なる。\n憲法\n国家の基本構造・基本的人権・国家権力の限界などを定める。\n法律\n憲法に従って、具体的な社会関係を規律する。\n\n⸻\n\n例\n憲法\n↓\n表現の自由を保障\n↓\n法律\n↓\n具体的な制度・ルール\n↓\n行政\n↓\n個別の処分\nしたがって、\n法律も憲法に反してはいけない。\n\n⸻","blanks":["憲法と法律","表現の自由","基本的人権"],"options":[["憲法と法律","憲法98条","国家賠償","違憲審査権"],["表現の自由","幸福追求","憲法と民法","損失補償"],["基本的人権","憲法と行政法","地方自治","国民投票"]],"mode":"constitution"}],"32":[{"text":"憲法と行政法は非常に密接。\n例えば、\n憲法\n↓\n基本的人権\n↓\n行政権力を制限\n↓\n行政法\n↓\n行政手続・行政救済\nとなる。\n行政法で学んだ、\n•\t法律による行政の原理\n•\t行政裁量\n•\t適正手続\n•\t国家賠償\n•\t損失補償\nなどの背景には、\n憲法上の価値・原則\nが存在する。\n\n⸻","blanks":["憲法と行政法","法律による行政の原理","基本的人権","損失補償","国家賠償"],"options":[["憲法と行政法","罪刑法定主義","国家機関の権限","主権とは何か"],["法律による行政の原理","罪刑法定主義","基本的人権の尊重","地方公共団体"],["基本的人権","国民主権","代表民主制","日本国憲法"],["損失補償","国家賠償","司法審査","国家権力"],["国家賠償","基本的人権","プライバシ","国家権力"]],"mode":"constitution"}],"33":[{"text":"憲法と民法も無関係ではない。\n民法は、\n私人と私人との関係\nを中心に規律する。\n一方、\n憲法は国家と個人との関係\nを中心に規律する。\nしかし、\n•\t私人間の人権\n•\t家族関係\n•\t財産権\n•\t契約\n•\t不法行為\nなどにも憲法上の価値が影響する。\n\n⸻","blanks":["憲法と民法","財産権"],"options":[["憲法と民法","損失補償","戦力の不保持","幸福追求"],["財産権","憲法9条","損失補償","思想"]],"mode":"constitution"}],"34":[{"text":"刑法とも深く関係する。\n例えば、\n•\t罪刑法定主義\n•\t適正手続\n•\t人身の自由\n•\t無罪推定との関係\n•\t刑罰の限界\nなど。\nつまり、\n憲法は刑法・刑事訴訟法の上位にある基本原理を提供する。\n\n⸻","blanks":["罪刑法定主義","人身の自由","無罪推定","適正手続","憲法"],"options":[["罪刑法定主義","司法審査","国務大臣","人身の自由"],["人身の自由","国民投票","損失補償","地方自治"],["無罪推定","憲法9条","国務大臣","憲法解釈"],["適正手続","国家権力","プライバシ","国民投票"],["憲法","国会","条約","制限"]],"mode":"constitution"}],"35":[{"text":"憲法に反する国家行為が行われた場合、\n違憲審査\nが問題となる。\n例えば、\n法律\n↓\n憲法に違反？\n↓\n裁判所\n↓\n違憲審査\nとなる。\n\n⸻","blanks":["違憲審査","裁判所","憲法"],"options":[["違憲審査","無罪推定","代表民主制","法の支配"],["裁判所","衆議院","財産権","最高法規"],["憲法","平和主義","制限","国家賠償"]],"mode":"constitution"}],"36":[{"text":"日本では、\n司法審査型の違憲審査制\nが採用されている。\n最高裁判所は、\n一切の法律・命令・規則・処分が憲法に適合するかを判断する権限\nを持つ。\n\n⸻","blanks":["違憲審査制","最高裁判所","司法審査","憲法"],"options":[["違憲審査制","代表民主制","プライバシ","憲法と行政法"],["最高裁判所","地方自治","憲法と民法","憲法と法律"],["司法審査","法治主義","最高法規","憲法解釈"],["憲法","選挙","刑罰","思想"]],"mode":"constitution"}],"37":[{"text":"日本の違憲審査は、\n抽象的に「この法律は違憲ですか」と一般的に判断する制度\nではない。\n基本的には、\n具体的な事件を裁判する中で、その事件に適用される法令の憲法適合性を判断する\nという仕組み。\n\n⸻","blanks":["この法律は違憲ですか","違憲審査","憲法"],"options":[["この法律は違憲ですか","憲法全体の構造","唯一の立法機関","天皇の国事行為"],["違憲審査","無罪推定","法治主義","憲法改正"],["憲法","条例","天皇","議会"]],"mode":"constitution"}],"38":[{"text":"違憲審査では、\n•\t法律\n•\t命令\n•\t規則\n•\t処分\nなどが問題となる。\nつまり、\n国家の行為が憲法に適合しているか\nを審査する。\n\n⸻","blanks":["違憲審査","憲法"],"options":[["違憲審査","人身の自由","国民投票","プライバシ"],["憲法","思想","国会","憲法改正"]],"mode":"constitution"}],"39":[{"text":"憲法問題を考えるときは、\n① 誰の権利が侵害されたのか\n↓\n② どの憲法上の権利か\n↓\n③ 国家によるどのような行為か\n↓\n④ その行為は権利を制約しているか\n↓\n⑤ 制約に正当な理由があるか\n↓\n⑥ 制約の程度は許されるか\n↓\n⑦ 違憲か合憲か\nという順番で考える。\n\n⸻","blanks":["憲法","侵害"],"options":[["憲法","思想","条約","国家権力"],["侵害","行政権","選挙","裁判所"]],"mode":"constitution"}],"40":[{"text":"憲法問題では、\n条文の文言\nだけでなく、\n•\t憲法の基本原理\n•\t条文の趣旨\n•\t人権保障\n•\t国家機関の権限\n•\t社会的背景\n•\t判例\nなどを考慮して解釈する。\n\n⸻","blanks":["憲法","国家機関の権限"],"options":[["憲法","司法審査","主権","衆議院"],["国家機関の権限","公共の福祉","地方公共団体","日本国憲法"]],"mode":"constitution"}],"41":[{"text":"憲法解釈では、\n文理解釈\n条文の文言を重視する。\n体系解釈\n憲法全体の構造から解釈する。\n目的論的解釈\n規定の目的・趣旨から解釈する。\nなどの方法がある。\n実際には、\n一つだけではなく複数の解釈方法を組み合わせる。\n\n⸻","blanks":["憲法解釈","憲法全体の構造"],"options":[["憲法解釈","国家賠償","プライバシ","代表民主制"],["憲法全体の構造","地方自治とは何か","戦力の不保持","違憲審査権"]],"mode":"constitution"}],"42":[{"text":"憲法は特に、\n判例の重要性が高い分野\nである。\nなぜなら、\n憲法の条文は抽象的な文言が多い\nから。\n例えば、\n「公共の福祉」\n「幸福追求」\n「表現の自由」\nなどについて、\n裁判所が具体的な事案の中で意味を明らかにしている。\n\n⸻","blanks":["公共の福祉","幸福追求","表現の自由","裁判所","憲法"],"options":[["公共の福祉","最高裁判所","地方自治","幸福追求"],["幸福追求","平和主義","無罪推定","法治主義"],["表現の自由","平和主義","司法審査","プライバシ"],["裁判所","思想","司法権","幸福追求"],["憲法","憲法9条","憲法改正","刑罰"]],"mode":"constitution"}],"43":[{"text":"憲法問題では、\n事実\n↓\n国家の行為\n↓\n憲法上の権利・原則\n↓\n権利への制約\n↓\n制約の正当化\n↓\n違憲審査\n↓\n結論\nという流れを意識する。\n\n⸻","blanks":["違憲審査","憲法"],"options":[["違憲審査","法治主義","国民投票","無罪推定"],["憲法","衆議院","憲法改正","憲法9条"]],"mode":"constitution"}],"44":[{"text":"ここまでをまとめると、\n日本国憲法\n│\n┌──────────────┴──────────────┐\n│                             │\n基本原理                       国家統治\n│                             │\n┌────────┼────────┐       ┌──────────┼──────────┐\n│        │        │       │          │          │\n国民主権 人権尊重 平和主義   国会       内閣       裁判所\n│        │        │       │          │          │\n│        │        │       立法       行政       司法\n│        │        │\n└────────┼────────┘\n│\n立憲主義\n│\n国家権力を制限\n│\n権力分立\n│\n違憲審査\n│\n憲法保障を実現\n\n⸻","blanks":["違憲審査","国民主権","権力分立","立憲主義","平和主義"],"options":[["違憲審査","人身の自由","法治主義","法律制定"],["国民主権","司法権","憲法改正","プライバシ"],["権力分立","の意味","平和主義","地方自治"],["立憲主義","国家賠償","最高法規","無罪推定"],["平和主義","憲法改正","憲法と民法","憲法9条"]],"mode":"constitution"}],"45":[{"text":"憲法を一言で理解するなら、\n「国家権力を憲法によって組織し、同時に制限することで、国民の基本的人権を保障する法」\nと考える。\nさらに、\n国民主権\n↓\n国民が政治の正当性の根拠\n↓\n国家権力を構成\n↓\n権力分立\n↓\n国家権力を相互に抑制\n↓\n憲法によって国家権力を拘束\n↓\n基本的人権を保障\n↓\n裁判所による違憲審査\nという一本の流れで理解する。\n\n⸻","blanks":["基本的人権","違憲審査","国民主権","権力分立","裁判所"],"options":[["基本的人権","国民投票","地方自治","憲法と行政法"],["違憲審査","法治主義","プライバシ","憲法98条"],["国民主権","最高法規","憲法解釈","国務大臣"],["権力分立","立憲主義","最高法規","代表民主制"],["裁判所","天皇","損失補償","国務大臣"]],"mode":"constitution"}],"46":[{"text":"次の質問に、自分の言葉で説明できれば第1編の理解度は高い。\n憲法そのもの\n1.\t憲法とは何か。\n2.\t普通の法律と憲法は何が違うか。\n3.\tなぜ国家権力を制限する必要があるのか。\n4.\t立憲主義とは何か。\n5.\t法の支配とは何か。\n基本原理\n6.\t国民主権とは何か。\n7.\t代表民主制とは何か。\n8.\t基本的人権とは何か。\n9.\t公共の福祉とは何か。\n10.\t平和主義とは何か。\n11.\t憲法9条は何を定めているか。\n統治\n12.\t権力分立とは何か。\n13.\t三権分立の意味は何か。\n14.\t国会の役割は何か。\n15.\t内閣の役割は何か。\n16.\t裁判所の役割は何か。\n17.\t天皇の地位は何か。\n18.\t天皇の国事行為とは何か。\n19.\t地方自治とは何か。\n憲法保障\n20.\tなぜ憲法が最高法規なのか。\n21.\t憲法99条の意味は何か。\n22.\t違憲審査とは何か。\n23.\t日本の違憲審査制にはどのような特徴があるか。\n24.\tなぜ具体的事件の中で違憲審査を行うのか。\n思考\n25.\t憲法問題を見たとき、最初に何を確認するか。\n26.\t基本的人権が制約された場合、何を検討するか。\n27.\t憲法・行政法・民法はどのようにつながっているか。\n\n⸻","blanks":["基本的人権とは何か","日本の違憲審査制","地方自治とは何か","天皇の国事行為","主権とは何か"],"options":[["基本的人権とは何か","日本国憲法の基本原理","法律による行政の原理","基本的人権"],["日本の違憲審査制","憲法の基本構造","法律による行政の原理","公共の福祉"],["地方自治とは何か","基本的人権","国権の最高機関","そもそも人権とは何か"],["天皇の国事行為","基本的人権とは何か","この法律は違憲ですか","代表民主制"],["主権とは何か","基本的人権","地方公共団体","表現の自由"]],"mode":"constitution"}],"47":[{"text":"憲法総論を最終的に、\n「国家権力と国民の関係」\nとして理解する。\n国家\n│\n┌──────┴──────┐\n│             │\n統治機構        国家権力\n│             │\n国会・内閣・裁判所    │\n│             ↓\n│          憲法で制限\n│             │\n└──────┬──────┘\n↓\n基本的人権保障\n↓\n国民\nそして、その全体を支える基本原理が、\n国民主権\n\n基本的人権の尊重\n\n平和主義\n\n立憲主義\n\n権力分立\n\n法の支配\nである。\n\n⸻\n\n第1編の到達点\n第1編を終えた段階では、\n「憲法の条文を暗記した」\nではなく、\n「憲法は何のために存在し、国家権力をどのように組織・制限し、国民の権利をどのように保障しているのか」\nを説明できることが目標。\nこの土台の上に、\n第2編　基本的人権総論\nを置く。\n第2編以降では、\n「そもそも人権とは何か」\nから始め、\n人権の主体 → 人権の保障範囲 → 人権制約 → 公共の福祉 → 違憲審査基準\nというところまで掘り下げていく。\nそして第3編以降で、\n思想・良心、信教、表現、職業、財産、人身、社会権、参政権\nなどの個別の人権を学ぶ。\nこれによって、\n総論 → 人権各論 → 統治機構 → 違憲審査\nという憲法全体の体系がつながる。","blanks":["国家権力と国民の関係","憲法の条文を暗記した","そもそも人権とは何か","基本的人権の尊重","公共の福祉"],"options":[["国家権力と国民の関係","憲法全体の構造","近代立憲主義","罪刑法定主義"],["憲法の条文を暗記した","近代立憲主義","国権の最高機関","憲法と民法"],["そもそも人権とは何か","日本国憲法の基本原理","近代立憲主義","国家機関の権限"],["基本的人権の尊重","天皇の国事行為","この法律は違憲ですか","日本の違憲審査制"],["公共の福祉","主権とは何か","最高裁判所","戦力の不保持"]],"mode":"constitution"}]},"2":{"1":[{"text":"基本的人権とは、\n人間が人間として尊重され、自由で尊厳ある生活を送るために保障される基本的な権利\nである。\n日本国憲法では、\n「基本的人権の享有」\nを保障し、基本的人権を「侵すことのできない永久の権利」として保障している。\n\n⸻","blanks":["基本的人権の享有","侵すことのできない永久の権利","憲法"],"options":[["基本的人権の享有","人権保障の","私人間の問題","個人の人格的生存"],["侵すことのできない永久の権利","どちらか一方が常に絶対に優先","差別禁止の対象","集会・結社の自由"],["憲法","思想","違憲審査","教育"]],"mode":"constitution"}],"2":[{"text":"人権保障の目的は、\n個人の尊厳を守ること\nにある。\nつまり、\n国家\n↓\n国民を統治\n↓\nしかし国家権力には濫用の危険\n↓\n憲法\n↓\n基本的人権を保障\n↓\n個人の尊厳・自由を守る\nという構造。\n\n⸻","blanks":["人権保障の目的","基本的人権","憲法"],"options":[["人権保障の目的","思想・良心の自由","人身の自由","国家賠償請求権"],["基本的人権","人権とは何か","表現の自由","人権制約"],["憲法","自由権","多数派","平等"]],"mode":"constitution"}],"3":[{"text":"憲法13条は、\nすべて国民は個人として尊重される\nと定める。\nこれは基本的人権を理解するうえで極めて重要。\n国家が、\n「社会全体のためだから個人は犠牲になってよい」\nと簡単に考えることは許されない。\n\n⸻","blanks":["基本的人権","憲法"],"options":[["基本的人権","個人の尊重","人権とは何か","国民主権"],["憲法","比例性","国民主権","刑罰"]],"mode":"constitution"}],"4":[{"text":"個人の尊重とは、\n一人ひとりを独立した人格として扱う\nということ。\nしたがって、\n•\t国家\n•\t社会\n•\t多数派\n•\t政府\nなどの利益だけを理由として、\n個人の人格や自由を無視すること\nは許されない。\n\n⸻","blanks":["個人の尊重","多数派"],"options":[["個人の尊重","国民主権","一定の法律上","令状主義"],["多数派","思想","被選挙権","合理的"]],"mode":"constitution"}],"5":[{"text":"憲法13条は、\n生命、自由及び幸福追求に対する国民の権利\nを保障している。\nこれを一般に、\n幸福追求権\nと呼ぶ。\n幸福追求権は、\n個人が人格的に生きるために必要な自由・利益を保障する一般的な権利\nとして重要な役割を持つ。\n\n⸻","blanks":["幸福追求権","憲法"],"options":[["幸福追求権","罪刑法定主義","弁護人依頼権","行政機関"],["憲法","合理的","平等権","令状主義"]],"mode":"constitution"}],"6":[{"text":"幸福追求権から、\n個人の人格的利益\nを保障する考え方が導かれる。\n代表的な問題として、\n•\tプライバシー\n•\t自己決定\n•\t氏名\n•\t肖像\n•\t個人情報\n•\t私生活上の自由\nなどがある。\n\n⸻","blanks":["プライバシ","幸福追求権"],"options":[["プライバシ","罪刑法定主義","行政機関","基本的人権"],["幸福追求権","弁護人依頼権","公共の福祉","人権保障"]],"mode":"constitution"}],"7":[{"text":"社会の変化によって、\n憲法制定時には明確に想定されていなかった利益\nが重要になることがある。\n例えば、\n•\tプライバシー\n•\t個人情報\n•\t自己決定\n•\t私生活上の自由\nなど。\nこれらを、\n新しい人権\nとして憲法13条から保障できるか\nという問題が生じる。\n\n⸻","blanks":["新しい人権","プライバシ","憲法"],"options":[["新しい人権","労働基本権","一定の法律上","人権制約"],["プライバシ","私人間の問題","人格的利益","行政処分"],["憲法","受益権","人権制約","努力目標"]],"mode":"constitution"}],"8":[{"text":"ただし、\n「自分が重要だと思う利益なら何でも憲法上の人権になる」\nわけではない。\n憲法上の人権として保障されるためには、\n個人の人格的生存に関わる重要な利益であるか\nなどを検討する必要がある。\n\n⸻","blanks":["憲法","個人の人格的生存"],"options":[["憲法","財産権","令状主義","自由権"],["個人の人格的生存","人権相互の調整","立法府の政策判断","人権保障の"]],"mode":"constitution"}],"9":[{"text":"基本的人権は、様々な方法で分類できる。\n代表的には、\n自由権\n国家から干渉されない自由。\n社会権\n人間らしい生活を国家に保障させる権利。\n参政権\n政治に参加する権利。\n受益権\n国家に一定の行為を求める権利。\n平等権\n差別されず平等に扱われる権利。\n\n⸻","blanks":["基本的人権","参政権","平等権","社会権","受益権"],"options":[["基本的人権","人権とは何か","経済的自由","国民主権"],["参政権","自由権","行政機関","多数派"],["平等権","教育","憲法","受益権"],["社会権","国民主権","多数派","平等"],["受益権","財産権","人権保障","平等"]],"mode":"constitution"}],"10":[{"text":"自由権とは、\n国家による不当な干渉から個人を守る権利\nである。\n例えば、\n•\t思想・良心の自由\n•\t信教の自由\n•\t表現の自由\n•\t居住・移転の自由\n•\t職業選択の自由\n•\t財産権\n•\t人身の自由\nなど。\n\n⸻","blanks":["自由権","居住・移転の自由","思想・良心の自由","職業選択の自由","信教の自由"],"options":[["自由権","条約","受益権","集会規制"],["居住・移転の自由","裁判を受ける権利","基本的人権の享有","私人間の問題"],["思想・良心の自由","裁判を受ける権利","罪刑法定主義","集会・結社の自由"],["職業選択の自由","人身の自由","受益権とは何か","社会権とは何か"],["信教の自由","努力目標","プライバシ","制約の目的"]],"mode":"constitution"}],"11":[{"text":"社会権とは、\n人間らしい生活を保障するため、国家に一定の積極的な対応を求める権利\nである。\n例えば、\n•\t生存権\n•\t教育を受ける権利\n•\t労働基本権\nなど。\n\n⸻","blanks":["社会権","教育を受ける権利","労働基本権","生存権"],"options":[["社会権","参政権","人権制約","集会規制"],["教育を受ける権利","職業選択の自由","弁護人依頼権","人格的利益"],["労働基本権","違憲の問題","人権保障の","人権とは何か"],["生存権","行政処分","多数派","令状主義"]],"mode":"constitution"}],"12":[{"text":"参政権とは、\n国民が政治に参加する権利\nである。\n代表的には、\n•\t選挙権\n•\t被選挙権\nなど。\n国民主権を実現するために重要。\n\n⸻","blanks":["参政権","国民主権","被選挙権"],"options":[["参政権","思想","平等権","条約"],["国民主権","人権保障の","労働基本権","幸福追求権"],["被選挙権","行政処分","多数派","労働基本権"]],"mode":"constitution"}],"13":[{"text":"受益権とは、\n国家に一定の行為・救済を求める権利\nをいう。\n代表的には、\n•\t請願権\n•\t裁判を受ける権利\n•\t国家賠償請求権\nなど。\n\n⸻","blanks":["受益権","裁判を受ける権利","国家賠償請求権","請願権"],"options":[["受益権","財産権","憲法","生存権"],["裁判を受ける権利","私人間の問題","二重の基準論","人権制約の理由"],["国家賠償請求権","プログラム規定","信教の自由","基本的人権の享有"],["請願権","行政処分","刑罰","憲法"]],"mode":"constitution"}],"14":[{"text":"平等権とは、\n合理的な理由なく差別的な扱いを受けない権利\nである。\n憲法14条が中心。\n\n⸻","blanks":["平等権","憲法"],"options":[["平等権","思想","天皇","参政権"],["憲法","比例性","適正手続","外国人"]],"mode":"constitution"}],"15":[{"text":"憲法14条は、\nすべて国民は法の下に平等\nと定める。\nつまり、\n国家が個人を扱う際に、不合理な差別をしてはいけない。\n\n⸻","blanks":["憲法","平等"],"options":[["憲法","請願権","行政処分","受益権"],["平等","努力目標","人権保障","教育"]],"mode":"constitution"}],"16":[{"text":"平等とは、\nすべての人を完全に同じように扱う\nという意味ではない。\nむしろ、\n同じものは同じように、異なるものは合理的な理由があれば異なるように扱う\nという考え方が基本。\nこれを、\n相対的平等\nという。\n\n⸻","blanks":["平等","合理的"],"options":[["平等","憲法","努力目標","多数派"],["合理的","受益権","基本的","刑罰"]],"mode":"constitution"}],"17":[{"text":"例えば、\n年齢によって一定の法律上の扱いを変える\nことが直ちに違憲になるわけではない。\n問題は、\nその区別に合理的な理由があるか\nである。\n\n⸻","blanks":["一定の法律上","合理的"],"options":[["一定の法律上","罪刑法定主義","公共の福祉","信教の自由"],["合理的","国民主権","行政処分","教育"]],"mode":"constitution"}],"18":[{"text":"憲法14条は、\n•\t人種\n•\t信条\n•\t性別\n•\t社会的身分\n•\t門地\nなどを挙げている。\nただし、\nこの5つだけが差別禁止の対象\nという意味ではない。\n\n⸻","blanks":["憲法","差別禁止の対象"],"options":[["憲法","基本的","努力目標","受益権"],["差別禁止の対象","人権制約の理由","弁護人依頼権","信教の自由"]],"mode":"constitution"}],"19":[{"text":"平等原則では、\n異なる扱い\n↓\n区別がある\n↓\n何の目的か\n↓\n区別との関係は合理的か\n↓\n不合理な差別なら違憲の問題\nという考え方をする。\n\n⸻","blanks":["平等","違憲の問題"],"options":[["平等","財産権","適正手続","比例性"],["違憲の問題","プライバシ","行政機関","幸福追求権"]],"mode":"constitution"}],"20":[{"text":"基本的人権は、\n日本国民だけに限られるのか\nという問題がある。\n外国人についても、\n性質上日本国民にのみ認められる権利を除き、基本的人権の保障が及ぶ\nと考えるのが基本。\nただし、\n出入国・在留・参政権など\n性質上外国人にそのまま保障できないものもある。\n\n⸻","blanks":["基本的人権","外国人","参政権"],"options":[["基本的人権","人身の自由","罪刑法定主義","違憲の問題"],["外国人","多数派","適正手続","社会権"],["参政権","社会権","基本的","財産権"]],"mode":"constitution"}],"21":[{"text":"人権は、\n自然人だけのものなのか\nという問題もある。\n法人についても、\n性質上可能な範囲で憲法上の権利保障が及ぶ\nと考えられる。\n例えば、\n•\t財産権\n•\t表現活動\n•\t経済活動\nなど。\n一方、\n人間の身体や人格そのものに関する権利\nは法人には性質上認められない。\n\n⸻","blanks":["財産権","憲法"],"options":[["財産権","思想","令状主義","憲法"],["憲法","教育","人権制約","受益権"]],"mode":"constitution"}],"22":[{"text":"未成年者も、\n基本的人権の主体\nである。\nただし、\n年齢・発達段階などを考慮して一定の制約が認められる場合\nがある。\n重要なのは、\n「未成年だから人権がない」\nということではない。\n\n⸻","blanks":["未成年だから人権がない","基本的人権"],"options":[["未成年だから人権がない","裁判を受ける権利","参政権とは何か","この人権なら必ずこの基準"],["基本的人権","人権とは何か","公共の福祉","違憲の問題"]],"mode":"constitution"}],"23":[{"text":"天皇・皇族については、\n一般国民と同じようにすべての権利を行使できるわけではない。\n特に、\n皇位継承や国事行為などの憲法上の地位\nとの関係で特殊な問題が生じる。\nこの分野は、\n人権の主体性と天皇制\nの関係として理解する。\n\n⸻","blanks":["天皇","憲法"],"options":[["天皇","外国人","比例性","人権制約"],["憲法","平等","社会権","令状主義"]],"mode":"constitution"}],"24":[{"text":"公務員も、\n原則として基本的人権の主体である。\nただし、\n公務の性質上、一定の人権制約\nが認められる場合がある。\n例えば、\n•\t政治活動\n•\t労働基本権\n•\t表現活動\nなど。\n重要なのは、\n「公務員だから人権がない」\nわけではないこと。\n\n⸻","blanks":["公務員だから人権がない","労働基本権","基本的人権"],"options":[["公務員だから人権がない","一定の法律上","どちらか一方が常に絶対に優先","基本的人権とは何か"],["労働基本権","基本的人権","個人の尊重","人格的利益"],["基本的人権","個人の尊重","人権制約","行政機関"]],"mode":"constitution"}],"25":[{"text":"憲法上の人権保障は、\n基本的には国家と個人との関係\nを規律する。\nでは、\n私人Aが私人Bの人権を侵害したらどうなるか。\nここで、\n私人間効力\nの問題が生じる。\n\n⸻","blanks":["私人間効力","憲法"],"options":[["私人間効力","信教の自由","弁護人依頼権","努力目標"],["憲法","自由権","行政機関","参政権"]],"mode":"constitution"}],"26":[{"text":"例えば、\n会社A\n↓\n従業員Bを差別\nこれは、\n国家ではなく私人間の問題。\nこの場合、\n憲法の人権規定を直接適用するのか\nという問題が生じる。\n\n⸻","blanks":["憲法","私人間の問題"],"options":[["憲法","被選挙権","平等","努力目標"],["私人間の問題","人格的利益","公共の利益","社会権とは何か"]],"mode":"constitution"}],"27":[{"text":"私人間の人権問題については、\n直接適用\n憲法上の人権規定を私人間に直接適用する考え方。\n間接適用\n民法などの私法規定を解釈する際に、憲法の人権保障の趣旨を反映させる考え方。\n日本では、\n間接適用の考え方\nが重要となる。\n\n⸻","blanks":["私人間の人権問題","人権保障の","憲法"],"options":[["私人間の人権問題","私人間の問題","二重の基準論","弁護人依頼権"],["人権保障の","行政処分","私人間効力","人権保障"],["憲法","比例性","被選挙権","平等権"]],"mode":"constitution"}],"28":[{"text":"基本的人権は重要だが、\nすべての人権が無制限ではない。\nなぜなら、\n一人の自由が他人の自由と衝突する\nことがあるから。\n例えば、\nAの表現の自由\n↓\nBの名誉\n↓\n衝突\n↓\nどこまで認める？\nという問題。\n\n⸻","blanks":["表現の自由","基本的人権"],"options":[["表現の自由","一定の法律上","幸福追求権","個人の尊重"],["基本的人権","労働基本権","人権保障","個人の尊重"]],"mode":"constitution"}],"29":[{"text":"人権制約を考える中心概念が、\n公共の福祉\nである。\nただし、\n公共の福祉＝国家に都合のよいこと\nではない。\n人権相互の調整や、社会全体との調整を図るための原理として理解する。\n\n⸻","blanks":["公共の福祉","人権相互の調整"],"options":[["公共の福祉","プライバシ","一定の法律上","人権制約"],["人権相互の調整","プログラム規定","差別禁止の対象","社会権とは何か"]],"mode":"constitution"}],"30":[{"text":"人権制約を検討するときは、\n① どの権利か\n↓\n② その権利は保障されるか\n↓\n③ 国家による制約があるか\n↓\n④ 制約の目的は正当か\n↓\n⑤ 手段は目的達成に適しているか\n↓\n⑥ 必要以上に制約していないか\n↓\n⑦ 利益と不利益のバランスはどうか\n↓\n⑧ 合憲か違憲か\nという流れで考える。\n\n⸻","blanks":["制約の目的","人権制約"],"options":[["制約の目的","努力目標","表現の自由","私人間の問題"],["人権制約","信教の自由","制約の目的","労働基本権"]],"mode":"constitution"}],"31":[{"text":"すべての人権について、\n同じ強さで審査する\nわけではない。\n一般に、\n精神的自由に対する制約\nは特に慎重に審査される。\n一方、\n経済的自由\nについては、立法府の政策判断が尊重される場面もある。\n\n⸻","blanks":["経済的自由","立法府の政策判断"],"options":[["経済的自由","令状主義","行政機関","行政処分"],["立法府の政策判断","人権保障の目的","個人の人格的生存","罪刑法定主義"]],"mode":"constitution"}],"32":[{"text":"この考え方を体系化したものが、\n二重の基準論\nである。\n大まかには、\n精神的自由\n↓\nより厳格な審査\n\n経済的自由\n↓\n比較的緩やかな審査\nという考え方。\nただし、\nすべての事件が単純に二種類に分けられる\nわけではない。\n後の各論で判例を通じて理解する。\n\n⸻","blanks":["二重の基準論","経済的自由"],"options":[["二重の基準論","人権相互の調整","労働基本権","公共の福祉"],["経済的自由","人権制約","公共の利益","表現の自由"]],"mode":"constitution"}],"33":[{"text":"違憲審査では、\n権利の重要性\n制約の程度\n制約の目的\n制約方法\n国家の裁量の広さ\nなどを総合的に考える。\nしたがって、\n「この人権なら必ずこの基準」\nと機械的に覚えるだけでは不十分。\n\n⸻","blanks":["この人権なら必ずこの基準","違憲審査"],"options":[["この人権なら必ずこの基準","なぜ精神的自由は強く保障されるのか","国家賠償請求権","差別禁止の対象"],["違憲審査","参政権","行政処分","個人の尊重"]],"mode":"constitution"}],"34":[{"text":"人権制約を考える際には、\n目的と手段のバランス\nが重要になる。\n基本的には、\n目的\n何を守ろうとしているのか。\n↓\n手段\nその目的を達成する方法か。\n↓\n必要性\nもっと制限の少ない方法はないか。\n↓\n均衡\n得られる利益と失われる自由のバランスは適切か。\nという考え方。\n\n⸻","blanks":["人権制約","基本的"],"options":[["人権制約","適正手続","公共の福祉","制約の目的"],["基本的","参政権","天皇","適正手続"]],"mode":"constitution"}],"35":[{"text":"複数の人権が衝突することがある。\n例えば、\n表現の自由\nと\n名誉・プライバシー\nなど。\nこの場合、\n「どちらか一方が常に絶対に優先」\nと考えるのではなく、\nそれぞれの権利の重要性・制約の程度を比較する。\n\n⸻","blanks":["どちらか一方が常に絶対に優先","プライバシ","表現の自由"],"options":[["どちらか一方が常に絶対に優先","社会権とは何か","国家賠償請求権","人権相互の調整"],["プライバシ","幸福追求権","罪刑法定主義","公共の利益"],["表現の自由","人権とは何か","令状主義","罪刑法定主義"]],"mode":"constitution"}],"36":[{"text":"人権制約の理由として、\n公共の利益\nが主張されることがある。\nしかし、\n公共の利益という抽象的な言葉だけで人権制約を正当化することはできない。\n具体的に、\n•\t何を守るのか\n•\tなぜ必要なのか\n•\tどの程度の危険があるのか\n•\t他の手段はないか\nを検討する必要がある。\n\n⸻","blanks":["人権制約の理由","公共の利益"],"options":[["人権制約の理由","立法府の政策判断","居住・移転の自由","集会・結社の自由"],["公共の利益","制約の目的","信教の自由","公共の福祉"]],"mode":"constitution"}],"37":[{"text":"人権を制約する場合でも、\n単に行政機関が自由に制限できる\nわけではない。\n特に、\n法律による根拠\nが重要となる。\n行政法で学んだ、\n法律による行政の原理\nともつながる。\n\n⸻","blanks":["法律による行政の原理","行政機関"],"options":[["法律による行政の原理","基本的人権とは何か","私人間の人権問題","職業選択の自由"],["行政機関","被選挙権","個人の尊重","公共の利益"]],"mode":"constitution"}],"38":[{"text":"国家が個人の自由を制約する場合、\nどこまで法律による根拠が必要か\nという問題がある。\n特に、\n•\t刑罰\n•\t財産権制約\n•\t営業規制\n•\t身体拘束\nなどでは法律との関係が重要。\n\n⸻","blanks":["財産権","刑罰"],"options":[["財産権","条約","思想","適正手続"],["刑罰","自由権","比例性","集会規制"]],"mode":"constitution"}],"39":[{"text":"行政によって人権が制約されることは多い。\n例えば、\n•\t営業許可\n•\t建築規制\n•\t集会規制\n•\t道路使用規制\n•\t警察活動\n•\t税金\n•\t社会保障\nなど。\nそのため、\n憲法上の人権\n↓\n行政による制約\n↓\n行政法上の処分\n↓\n行政救済\n↓\n憲法適合性を審査\nという流れが生じる。\n\n⸻","blanks":["集会規制","憲法"],"options":[["集会規制","基本的","基本的人権","外国人"],["憲法","国民主権","被選挙権","教育"]],"mode":"constitution"}],"40":[{"text":"刑事法では特に、\n人身の自由\nが重要になる。\n国家が、\n逮捕・勾留・刑罰\nなどによって個人の自由を制約するからである。\nそのため、\n•\t罪刑法定主義\n•\t適正手続\n•\t令状主義\n•\t黙秘権\n•\t弁護人依頼権\nなどが重要になる。\n詳細は後の人身の自由で扱う。\n\n⸻","blanks":["弁護人依頼権","罪刑法定主義","人身の自由","令状主義","適正手続"],"options":[["弁護人依頼権","人権保障の目的","二重の基準論","国家権力の濫用"],["罪刑法定主義","国家権力の濫用","二重の基準論","一定の法律上"],["人身の自由","私人間の問題","弁護人依頼権","新しい人権"],["令状主義","平等権","人身の自由","外国人"],["適正手続","労働基本権","努力目標","人権保障"]],"mode":"constitution"}],"41":[{"text":"人権保障は、\n国家が何もしないこと\nだけを意味しない。\n場合によっては、\n国家が積極的に制度を整備する\nことも求められる。\n特に、\n社会権\nではこの側面が強い。\n\n⸻","blanks":["社会権","人権保障"],"options":[["社会権","外国人","令状主義","基本的"],["人権保障","人権保障の","外国人","多数派"]],"mode":"constitution"}],"42":[{"text":"自由権では、\n国家が不当に干渉しない\nことが中心。\n例えば、\n表現したい\n↓\n国家が不当に禁止しない\n↓\n表現の自由を保障\nという構造。\n\n⸻","blanks":["表現の自由","自由権"],"options":[["表現の自由","人身の自由","違憲の問題","努力目標"],["自由権","請願権","多数派","財産権"]],"mode":"constitution"}],"43":[{"text":"社会権では、\n国家による積極的な施策\nが問題になる。\n例えば、\n•\t社会保障\n•\t教育\n•\t労働環境\nなど。\nそのため、\nどこまで国家に具体的な給付・制度整備を要求できるのか\nという問題が生じる。\n\n⸻","blanks":["社会権","教育"],"options":[["社会権","被選挙権","行政処分","多数派"],["教育","人権制約","行政処分","違憲審査"]],"mode":"constitution"}],"44":[{"text":"社会権の一部について、\n国家に政策目標を示す性格\nが強い場合がある。\nこれを、\nプログラム規定\nとして捉える考え方がある。\nただし、\nすべての社会権が単純に「努力目標」にすぎない\nという意味ではない。\n\n⸻","blanks":["努力目標","プログラム規定","社会権"],"options":[["努力目標","人身の自由","国民主権","行政処分"],["プログラム規定","プライバシ","私人間の問題","罪刑法定主義"],["社会権","人権保障","行政処分","被選挙権"]],"mode":"constitution"}],"45":[{"text":"私人間の問題では、\n民法の一般条項\nが重要になる。\n例えば、\n•\t公序良俗\n•\t信義則\n•\t不法行為\n•\t権利濫用\nなど。\nこれらを解釈するときに、\n憲法上の人権保障の価値\nが影響することがある。\n\n⸻","blanks":["人権保障の","憲法"],"options":[["人権保障の","私人間の問題","新しい人権","プライバシ"],["憲法","平等権","刑罰","合理的"]],"mode":"constitution"}],"46":[{"text":"現代の人権保障は、\n日本国憲法だけで完結するものではない。\n日本は、\n•\t国際人権規約\n•\t女性差別撤廃条約\n•\t子どもの権利条約\n•\t障害者権利条約\nなどの国際人権条約にも関係している。\nただし、\n条約と憲法の関係\n条約と国内法の関係\nなどは別途整理する必要がある。\n\n⸻","blanks":["憲法","条約"],"options":[["憲法","被選挙権","参政権","行政処分"],["条約","天皇","令状主義","比例性"]],"mode":"constitution"}],"47":[{"text":"国家には、\n災害・戦争・重大な危機\nなどの非常時が存在する。\nしかし、\n「緊急事態だから人権を自由に制限できる」\nとはならない。\nむしろ、\n非常時ほど国家権力の濫用を防ぐ仕組み\nが重要となる。\n\n⸻","blanks":["緊急事態だから人権を自由に制限できる","国家権力の濫用"],"options":[["緊急事態だから人権を自由に制限できる","人権相互の調整","職業選択の自由","基本的人権とは何か"],["国家権力の濫用","思想・良心の自由","人身の自由","人格的利益"]],"mode":"constitution"}],"48":[{"text":"憲法上の人権問題を見たら、\nSTEP1\n誰の問題か？\n↓\n国民？\n外国人？\n法人？\n公務員？\n未成年者？\n\n⸻\n\nSTEP2\n何の権利か？\n↓\n表現？\n信教？\n職業？\n財産？\n平等？\n社会権？\n\n⸻\n\nSTEP3\n国家による制約があるか？\n↓\n法律？\n行政処分？\n刑罰？\n規制？\n\n⸻\n\nSTEP4\nどの程度重要な権利か？\n↓\n精神的自由？\n経済的自由？\n社会権？\n\n⸻\n\nSTEP5\n制約の目的は何か？\n↓\n安全？\n他人の権利？\n公共秩序？\n福祉？\n\n⸻\n\nSTEP6\n手段は適切か？\n↓\n必要か？\n過度ではないか？\n\n⸻\n\nSTEP7\n憲法に適合するか？\n↓\n合憲\nor\n違憲\n\n⸻","blanks":["経済的自由","行政処分","外国人","社会権","憲法"],"options":[["経済的自由","私人間の問題","人格的利益","被選挙権"],["行政処分","基本的人権","人格的利益","プライバシ"],["外国人","国民主権","思想","行政処分"],["社会権","請願権","国民主権","違憲審査"],["憲法","条約","行政処分","思想"]],"mode":"constitution"}],"49":[{"text":"AがSNS上でBについて発言した。\nBは、\n名誉を侵害された\nと主張。\nAは、\n表現の自由がある\nと主張。\nここでは、\nA\n↓\n表現の自由\n↘\n衝突\n↗\nB\n↓\n名誉・人格的利益\nとなる。\n検討すべきなのは、\n•\t発言の内容\n•\t公共性\n•\t目的\n•\t真実性\n•\t表現方法\n•\tBへの侵害の程度\nなど。\n\n⸻","blanks":["表現の自由","人格的利益"],"options":[["表現の自由","人権保障の","私人間の問題","信教の自由"],["人格的利益","人権保障の","公共の福祉","人権制約"]],"mode":"constitution"}],"50":[{"text":"外国人Aが、\n日本国内で一定の政治活動を行った。\n国家が、\n外国人だから政治活動は一切禁止\nとした。\nこの場合、\n外国人にも基本的人権が保障されるのか\n↓\nその権利は性質上外国人にも保障されるのか\n↓\n国家による制約は正当化できるか\nという順番で検討する。\n\n⸻","blanks":["基本的人権","外国人"],"options":[["基本的人権","違憲の問題","プライバシ","一定の法律上"],["外国人","令状主義","国民主権","多数派"]],"mode":"constitution"}],"51":[{"text":"会社Aが、\n従業員Bの思想を理由として不利益な扱い\nをした。\nここでは、\n私人間の人権問題\nが生じる。\nしたがって、\n憲法上の人権\n↓\n私人間効力\n↓\n民法等の私法\n↓\n憲法の趣旨を反映\n↓\n適法・違法を判断\nという考え方が重要。\n\n⸻","blanks":["私人間の人権問題","私人間効力","憲法","思想"],"options":[["私人間の人権問題","教育を受ける権利","差別禁止の対象","国家賠償請求権"],["私人間効力","努力目標","公共の福祉","制約の目的"],["憲法","思想","多数派","条約"],["思想","憲法","被選挙権","参政権"]],"mode":"constitution"}],"52":[{"text":"基本的人権\n│\n┌─────────────┼─────────────┐\n│             │             │\n平等権          自由権         社会権\n│             │             │\n憲法14条     ┌───┼───┐     ┌──┼──┐\n│   │   │     │  │  │\n精神 経済 人身   生存 教育 労働\n的   的   の\n自由 自由 自由\n\n│\n参政権\n│\n国民主権\n\n│\n受益権\n│\n国家による救済\n\n⸻","blanks":["基本的人権","国民主権","参政権","平等権","社会権"],"options":[["基本的人権","弁護人依頼権","罪刑法定主義","人権とは何か"],["国民主権","新しい人権","集会規制","幸福追求権"],["参政権","被選挙権","多数派","合理的"],["平等権","自由権","比例性","努力目標"],["社会権","自由権","教育","行政処分"]],"mode":"constitution"}],"53":[{"text":"基本的人権の総論で最も重要なのは、\n「人権は国家から個人を守るために存在する」\nという基本構造。\nそして、\n「人権は重要だが、無制限ではない」\nということ。\nしたがって、\n人権保障\n↓\n原則として自由\n↓\n他者の権利・公共の福祉との衝突\n↓\n国家による制約\n↓\nその制約が正当か審査\n↓\n合憲／違憲\nという思考が基本になる。\n\n⸻","blanks":["人権は重要だが、無制限ではない","公共の福祉","基本的人権"],"options":[["人権は重要だが、無制限ではない","私人間の人権問題","基本的人権とは何か","職業選択の自由"],["公共の福祉","表現の自由","経済的自由","制約の目的"],["基本的人権","個人の尊重","人権保障","信教の自由"]],"mode":"constitution"}],"54":[{"text":"概念\t意味\n個人の尊重\t一人ひとりの人格を尊重する\n幸福追求権\t個人の人格的生存に関わる利益を保障\n平等権\t不合理な差別を受けない\n自由権\t国家から不当に干渉されない\n社会権\t人間らしい生活のため国家に一定の対応を求める\n参政権\t政治に参加する\n受益権\t国家に一定の行為・救済を求める\n公共の福祉\t人権相互・社会との調整原理\n私人間効力\t人権保障を私人間関係でどう考えるか\n二重の基準\t精神的自由等をより厳格に審査する考え方\n比例性\t権利制約と目的との均衡を検討する考え方\n\n⸻","blanks":["私人間効力","公共の福祉","幸福追求権","個人の尊重","比例性"],"options":[["私人間効力","個人の尊重","公共の利益","人権とは何か"],["公共の福祉","違憲の問題","新しい人権","基本的人権"],["幸福追求権","令状主義","新しい人権","人権保障"],["個人の尊重","人身の自由","一定の法律上","私人間の問題"],["比例性","人権制約","努力目標","被選挙権"]],"mode":"constitution"}],"55":[{"text":"基本的人権\n1.\t基本的人権とは何か。\n2.\tなぜ基本的人権を保障する必要があるのか。\n3.\t個人の尊重とは何か。\n4.\t幸福追求権とは何か。\n5.\t新しい人権とは何か。\n人権の分類\n6.\t自由権とは何か。\n7.\t社会権とは何か。\n8.\t参政権とは何か。\n9.\t受益権とは何か。\n10.\t平等権とは何か。\n人権の主体\n11.\t外国人にも人権は保障されるか。\n12.\t法人にも人権は保障されるか。\n13.\t未成年者にも人権は保障されるか。\n14.\t公務員にも人権は保障されるか。\n15.\t天皇・皇族の人権にはどのような特殊性があるか。\n人権制約\n16.\t基本的人権は絶対無制限か。\n17.\t公共の福祉とは何か。\n18.\tなぜ人権を制約する必要があるのか。\n19.\t人権制約を判断するとき何を検討するか。\n20.\t二重の基準論とは何か。\n21.\t比例性とは何か。\n私人間\n22.\t憲法の人権規定は私人間にも直接適用されるのか。\n23.\t私人間効力とは何か。\n24.\t間接適用とは何か。\n25.\t民法と憲法は私人間の人権問題でどのようにつながるか。\n実践\n26.\t表現の自由と名誉が衝突した場合どう考えるか。\n27.\t外国人の人権問題をどう分析するか。\n28.\t会社と従業員の人権問題をどう分析するか。\n29.\t行政によって人権が制約された場合、憲法と行政法をどうつなげるか。\n\n⸻","blanks":["基本的人権とは何か","私人間の人権問題","受益権とは何か","参政権とは何か","社会権とは何か"],"options":[["基本的人権とは何か","二重の基準論","人権制約の理由","私人間の人権問題"],["私人間の人権問題","職業選択の自由","プログラム規定","私人間の問題"],["受益権とは何か","人権相互の調整","立法府の政策判断","二重の基準論"],["参政権とは何か","個人の人格的生存","教育を受ける権利","職業選択の自由"],["社会権とは何か","人権制約の理由","居住・移転の自由","人権保障の目的"]],"mode":"constitution"}],"56":[{"text":"基本的人権を理解するときは、\n個人\n│\n個人の尊重\n│\n基本的人権\n│\n┌──────────┼──────────┐\n│          │          │\n平等        自由        社会\n│          │          │\n│      ┌───┼───┐      │\n│      │   │   │      │\n│     精神 経済 人身   社会権\n│\n└──────────┬──────────┘\n│\n国家による制約\n│\n公共の福祉\n│\n違憲審査・比例性\n│\n合憲／違憲\nという体系で考える。\n\n⸻\n\n第2編の到達点\n第2編を終えた段階で、\n「人権とは何か」\nだけではなく、\n「誰に人権が保障され、国家がどのような場合に人権を制約でき、その制約が憲法上許されるかをどう判断するのか」\nまで説明できることが目標。\nここまでが、\n基本的人権の総論\nである。\n次の第3編からは、この総論を具体的な権利に当てはめる。\nまず、\n思想・良心の自由 → 信教の自由 → 表現の自由 → 集会・結社の自由 → 学問の自由\nという精神的自由を扱う。\nここでは特に、\n「なぜ精神的自由は強く保障されるのか」\n「表現の自由が制約されたとき、どのような審査をするのか」\n「判例はどこまで自由を認めているのか」\nという、第2編で学んだ総論が具体的に使われる。","blanks":["人権とは何か","なぜ精神的自由は強く保障されるのか","判例はどこまで自由を認めているのか","思想・良心の自由","集会・結社の自由"],"options":[["人権とは何か","個人の尊重","人権保障の目的","信教の自由"],["なぜ精神的自由は強く保障されるのか","個人の人格的生存","人権相互の調整","裁判を受ける権利"],["判例はどこまで自由を認めているのか","なぜ精神的自由は強く保障されるのか","差別禁止の対象","受益権とは何か"],["思想・良心の自由","プライバシ","居住・移転の自由","基本的人権の享有"],["集会・結社の自由","人権保障の","人権とは何か","受益権とは何か"]],"mode":"constitution"}]},"3":{"1":[{"text":"精神的自由とは、\n人間が自分の内面において何を考え、何を信じ、どのような意見を持ち、それを外部に表現するかについての自由\nである。\n代表的には、\n•\t思想・良心の自由\n•\t信教の自由\n•\t表現の自由\n•\t集会・結社の自由\n•\t学問の自由\nがある。\n\n⸻","blanks":["思想・良心の自由","集会・結社の自由","信教の自由","学問の自由","表現の自由"],"options":[["思想・良心の自由","精神的自由の体系","公共施設の利用","宗教を信じる自由"],["集会・結社の自由","宗教上の信念","明確性の原則","ある政治思想を持つ"],["信教の自由","集会の自由","宗教上の信念","内心の自由"],["学問の自由","結社の自由","デモ行進","表現の自由"],["表現の自由","政治的表現","報道の自由","信教の自由"]],"mode":"constitution"}],"2":[{"text":"精神的自由は、\n個人の人格そのものに深く関わる自由\nである。\nさらに、\n民主主義を維持するためにも重要\nである。\n例えば表現の自由がなければ、\n•\t政府を批判する\n•\t政策について議論する\n•\t選挙で判断する\n•\t社会問題を告発する\nことが困難になる。\nしたがって精神的自由には、\n個人の自己実現\nと\n民主主義の政治過程\nという二つの重要な側面がある。\n\n⸻","blanks":["表現の自由","選挙"],"options":[["表現の自由","宗教的行為","報道の自由","宗教団体"],["選挙","宗教団体","事前抑制","複数人"]],"mode":"constitution"}],"3":[{"text":"精神的自由\n│\n┌─────────────┼─────────────┐\n│             │             │\n思想・良心       信教          表現\n│             │             │\n│         ┌───┴───┐     ┌──┼──┬──┐\n│         │       │     │  │  │  │\n内心      信仰    宗教活動 言論 出版 集会\n│\n結社\n\n│\n学問の自由\nこの中でも、\n表現の自由\nは特に重要。\n\n⸻","blanks":["学問の自由","表現の自由","思想","良心"],"options":[["学問の自由","二重の基準論","結社の自由","明確性の原則"],["表現の自由","二重の基準論","表現の内容","最高裁判所"],["思想","報道の自由","宗教団体","インタ"],["良心","教育","合法的","民主主義"]],"mode":"constitution"}],"4":[{"text":"憲法19条は、\n思想及び良心の自由は、これを侵してはならない\nと定める。\nこれは、\n人の内心にある思想・信条を国家が強制的に支配してはならない\nという保障。\n\n⸻","blanks":["思想","良心の自由","憲法"],"options":[["思想","国民主権","取材の自由","内心の自由"],["良心の自由","宗教的行為","学問の自由","結社の自由"],["憲法","インタ","取材の自由","教育"]],"mode":"constitution"}],"5":[{"text":"思想・良心の自由の核心は、\n内心の自由\nである。\nつまり、\n何を考えるか\n↓\n何を信じるか\n↓\nどのような価値観を持つか\n↓\n国家が強制してはいけない\nということ。\n\n⸻","blanks":["内心の自由","思想・良心の自由"],"options":[["内心の自由","明確性の原則","一定の目的","事前抑制"],["思想・良心の自由","ある政治思想を持つ","宗教的行為の自由","研究発表の自由"]],"mode":"constitution"}],"6":[{"text":"重要なのは、\n内心そのもの\nと\n内心に基づく外部行為\nを区別すること。\n例えば、\n「ある政治思想を持つ」\n↓\n原則として強く保障。\nしかし、\n「その思想を理由に他人へ暴力を振るう」\n↓\n外部行為なので、無制限に保障されるわけではない。\n\n⸻","blanks":["ある政治思想を持つ","その思想を理由に他人へ暴力を振るう"],"options":[["ある政治思想を持つ","この思想を持ってはいけない","良心の自由と","二重の基準論"],["その思想を理由に他人へ暴力を振るう","宗教的行為の自由","研究発表の自由","思想・良心の自由"]],"mode":"constitution"}],"7":[{"text":"国家が、\n「この思想を持ちなさい」\n「この思想を持ってはいけない」\nと強制することは、思想・良心の自由との関係で重大な問題となる。\n特に、\n国家による内心への介入\nは極めて慎重に考えなければならない。\n\n⸻","blanks":["この思想を持ちなさい","この思想を持ってはいけない","思想・良心の自由","良心の自由と"],"options":[["この思想を持ちなさい","怖いからやめておこう","奴隷的拘束・苦役からの自由","この思想を持ってはいけない"],["この思想を持ってはいけない","宗教と国家を完全に無関係にする","宗教的行為の自由","宗教だから絶対に自由"],["思想・良心の自由","この思想を持ちなさい","研究発表の自由","インターネット上の表現"],["良心の自由と","他人の名誉","一定の目的","取材の自由"]],"mode":"constitution"}],"8":[{"text":"国家は、\n国民の思想を調査・評価すること\nについて強い制約を受ける。\n例えば、\n政治的思想が政府にとって好ましいかどうか\nを理由として、\n人を差別したり不利益を与えたりする\nことには憲法上重大な問題がある。\n\n⸻","blanks":["思想","憲法"],"options":[["思想","恣意的","教育","萎縮効果"],["憲法","複数人","民主主義","知る権利"]],"mode":"constitution"}],"9":[{"text":"学校などにおいて、\n国旗・国歌への起立・斉唱など\nが問題となることがある。\nここでは、\n教職員の思想・良心の自由\nと\n学校教育上の職務上の義務\nとの関係が問題となる。\n重要なのは、\n「思想・良心の自由があるから、どのような外部行為も自由」\nと単純にはならないこと。\n\n⸻","blanks":["思想","良心の自由","教育"],"options":[["思想","良心","憲法","一定の目的"],["良心の自由","政教分離","取材の自由","宗教団体"],["教育","思想","合法的","良心"]],"mode":"constitution"}],"10":[{"text":"憲法20条は、\n信教の自由\nを保障する。\n信教の自由とは、\n宗教を信じる自由、信じない自由、宗教を選択・変更する自由\nなどを含む。\n\n⸻","blanks":["信教の自由","憲法"],"options":[["信教の自由","内心の自由","デモ行進","表現の内容"],["憲法","合法的","報道の自由","インタ"]],"mode":"constitution"}],"11":[{"text":"信教の自由には、\n① 信仰の自由\n何を信じるか。\n② 宗教的行為の自由\nどのような宗教活動をするか。\n③ 宗教的結社の自由\n宗教団体を結成・参加する自由。\nなどがある。\n\n⸻","blanks":["宗教的行為の自由","信教の自由","結社の自由"],"options":[["宗教的行為の自由","怖いからやめておこう","集会・結社の自由","研究発表の自由"],["信教の自由","政治的表現","報道の自由","表現の自由"],["結社の自由","二重の基準論","表現の自由","政治的表現"]],"mode":"constitution"}],"12":[{"text":"信教の自由は、\n「宗教を信じる自由」\nだけではない。\n重要なのが、\n宗教を信じない自由\nである。\nつまり、\n信じる\n↕\n信じない\n↕\n変更する\nという自由も保障される。\n\n⸻","blanks":["宗教を信じる自由","信教の自由"],"options":[["宗教を信じる自由","精神的自由の体系","良心の自由と","内心と外部行為"],["信教の自由","外部的行為","デモ行進","プライバシ"]],"mode":"constitution"}],"13":[{"text":"宗教的行為についても自由が保障される。\n例えば、\n•\t礼拝\n•\t祈り\n•\t宗教儀式\n•\t宗教活動\nなど。\nただし、\n外部的行為\nについては他人の権利や社会秩序との関係で一定の制約が問題となる。\n\n⸻","blanks":["宗教的行為","外部的行為"],"options":[["宗教的行為","デモ行進","特定の宗教","刑法上の犯罪"],["外部的行為","学問の自由","良心の自由","明確性の原則"]],"mode":"constitution"}],"14":[{"text":"宗教団体を、\n結成する\n活動する\n参加する\nことも保障される。\nただし、\n宗教団体だから何をしても許される\nという意味ではない。\n\n⸻","blanks":["宗教団体","結成"],"options":[["宗教団体","インタ","プライバシ","学問の自由"],["結成","検閲","選挙","思想"]],"mode":"constitution"}],"15":[{"text":"日本国憲法では、\n国家と宗教との関係を一定の限度で分離する\nという考え方が採用されている。\nこれを、\n政教分離原則\nという。\n\n⸻","blanks":["政教分離","憲法"],"options":[["政教分離","萎縮効果","他人の名誉","宗教団体"],["憲法","民主主義","良心","刑罰"]],"mode":"constitution"}],"16":[{"text":"政教分離の目的は、\n国家が特定の宗教を特別扱いすることを防ぐ\nこと。\nまた、\n国家が宗教を利用したり、宗教を強制したりすること\nを防ぐことにもつながる。\n\n⸻","blanks":["政教分離の目的","特定の宗教"],"options":[["政教分離の目的","他人の名誉","政府批判は禁止","プライバシ"],["特定の宗教","社会的背景","二重の基準論","大学の自治"]],"mode":"constitution"}],"17":[{"text":"政教分離は、\n「宗教と国家を完全に無関係にする」\nという意味ではない。\n国家と宗教との間には、\n社会生活上のさまざまな接点\nが存在する。\n問題は、\n国家が宗教に対してどのような関与をしたのか\nである。\n\n⸻","blanks":["宗教と国家を完全に無関係にする","政教分離"],"options":[["宗教と国家を完全に無関係にする","個人の人格形成","信仰しない
