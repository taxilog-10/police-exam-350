<script>
"use strict";

const ADMIN = {"parts":[["第1編","行政法総論",5],["第2編","行政組織",6],["第3編","行政作用",12],["第4編","行政手続・情報",7],["第5編","行政の実効性確保",6],["第6編","行政救済",13],["第7編","行政法の統合",4]],"titles":[["行政法とは何か","行政法の基本原理","行政法の法源","行政組織","行政法上の法律関係"],["行政主体","行政機関","行政機関相互の関係","国の行政組織","国と地方公共団体","地方自治の基本構造"],["行政活動の形式","行政立法","行政計画","行政行為","行政行為の種類","行政裁量","行政行為の効力","行政行為の瑕疵","行政行為の取消し・撤回","行政契約","行政指導","行政上の事実行為"],["行政手続の基本原理","行政手続法","申請に対する処分","不利益処分","行政指導の手続","届出・意見公募手続","情報公開・個人情報保護の基礎"],["行政上の義務履行確保","行政上の強制執行","行政代執行","直接強制・執行罰・強制徴収","即時強制","行政罰"],["行政救済法の全体像","行政不服審査制度","行政不服審査法の基本構造","行政事件訴訟の基本構造","取消訴訟","取消訴訟の訴訟要件","取消訴訟の審理・判決","無効等確認訴訟","不作為の違法確認訴訟","義務付け訴訟・差止訴訟","当事者訴訟・民衆訴訟・機関訴訟","国家賠償","損失補償"],["行政法の基本原理と各制度の関係","行政活動を違法と判断するための思考方法","行政事件を法的に分析する方法","行政法の全体体系総整理"]],"questions":{"1":{"1":{"text":"1　行政の意味\n国家の活動は、一般に、\n立法・行政・司法\nという三つの作用に分けて理解される。\n立法\n社会一般に適用されるルールを制定する。\n行政\n法律などに基づいて、社会の具体的な問題を処理し、公共目的を実現する。\n司法\n具体的な紛争について法を適用し、裁判によって解決する。\nただし、現実の行政活動は極めて広範であり、「行政＝単純な法律の執行」と考えることはできない。\n行政は、\n•\t規制\n•\t許認可\n•\t給付\n•\t公共施設の管理\n•\t警察活動\n•\t社会保障\n•\t環境保護\n•\t都市計画\n•\t税\n•\t教育\n•\t災害対策\nなど、社会のほぼすべての領域に関係する。\n⸻\n2　行政法とは何か\n行政法とは、基本的には、\n行政に関する法\nである。\nしかし、専門的には単なる「行政に関係する法律の集合」と理解するだけでは不十分である。\n行政法の中心的な問題は、\n行政がどのような根拠・手続・限界の下で活動できるのか\nという点にある。\nつまり、\n行政活動\n↓\n法的根拠\n↓\n行政活動の形式\n↓\n行政に認められた権限\n↓\nその権限の限界\n↓\n国民の権利・利益との調整\n↓\n違法だった場合の救済\nという一連の問題を扱う。\n⸻\n3　行政法の二つの側面\n行政法には、\n行政を機能させる側面\nと\n行政を統制する側面\nの両方がある。\n行政に権限がなければ、必要な公共政策を実施できない。\n一方で、行政に無制限の権限を与えれば、国民の権利・自由が侵害される危険がある。\nしたがって、\n行政に必要な権限を与える\n＋\nその権限を法によって統制する\nという両面が必要になる。\n⸻\n4　行政法の三領域\n行政法は学習上、大きく3つに分けられる。\n分野\t基本的な問い\n行政組織法\t誰が行政を行うのか\n行政作用法\t行政はどのように活動するのか\n行政救済法\t違法・不当な行政からどう救済するのか\n全体像\n行政主体\n↓\n行政組織\n↓\n行政活動\n↓\n行政作用法\n↓\n国民の権利・利益への影響\n↓\n違法・不当な行政活動\n↓\n行政救済\nこの構造を行政法の基本地図として覚える。\n⸻\n5　行政法は一つの法典ではない\n「行政法」という名前の一つの法典が存在するわけではない。\n行政に関する法規は、\n•\t行政手続法\n•\t行政不服審査法\n•\t行政事件訴訟法\n•\t国家賠償法\n•\t地方自治法\n•\t情報公開関係法令\n•\t個人情報保護関係法令\n•\t各種の行政規制法\nなど、多数の法令に分散している。\nしたがって行政法の学習では、\n個別法をバラバラに覚えるのではなく、共通する原理・制度・考え方を理解する\nことが重要となる。\n⸻","blanks":["行政","行政法","立法","司法"],"options":[["行政","法源","憲法","法律"],["行政法","行政庁","法人格","行政権"],["立法","法源","憲法","法律"],["司法","法源","憲法","法律"]],"mode":"administrative"},"2":{"text":"1　なぜ基本原理が必要なのか\n行政には広い権限が与えられている。\nしかし、\n「行政だから何をしてもよい」\nということにはならない。\n行政は法に従わなければならず、さらに憲法上保障された国民の権利・自由にも配慮しなければならない。\nここから行政法の基本原理が導かれる。\n⸻\n2　法治主義・法の支配\n行政法を理解するうえで最も基本的な考え方の一つが、\n国家権力を法によって拘束する\nという考え方である。\n行政\n↓\n公権力を行使\n↓\n国民の権利・利益に影響\n↓\n行政の判断だけで自由に行動すると危険\n↓\n法によって行政を拘束する\nこれが行政法の基本的な方向性である。\n⸻\n3　法律による行政の原理\n「法律による行政の原理」とは、行政活動が法律に従って行われなければならないという基本原理である。\nその内容については、伝統的には次のような側面から整理される。\n① 法律の優位\n行政は法律に反して活動してはならない。\nつまり、\n法律 ＞ 行政活動\nという関係になる。\n行政が法律に反する活動をすれば、違法となる可能性がある。\n⸻\n② 法律の留保\n一定の行政活動については、\n法律上の根拠が必要なのではないか\nという問題が生じる。\n特に国民の権利・自由を制約する行政活動について、どこまで法律の根拠を要求するのかが重要な論点となる。\nここでは、\n•\t侵害留保説\n•\t権力留保説\n•\t全部留保説\n•\t社会留保説\nなどの考え方が問題となる。\nただし、これらの学説は後の総合教科書で詳しく検討する。\nこの基礎本では、\n「行政に法律の根拠が必要なのは、どの範囲なのか？」\nという問題があることを理解すればよい。\n⸻\n4　比例原則\n行政が目的を実現するために国民の権利・自由を制限する場合でも、\n必要以上に制限してはいけない\nという考え方が問題になる。\n例えば、\n目的 → 危険な建物への立入規制\nだからといって、\n→ その目的と無関係な過度の規制\nまで許されるわけではない。\n基本的には、\n目的\n↓\n手段\n↓\n目的達成に必要か？\n↓\n他により制限の小さい手段はないか？\n↓\n制限は過大ではないか？\nという思考をする。\n⸻\n5　平等原則\n行政は、合理的な理由なく国民を不平等に扱ってはならない。\nただし、\n「すべての人を常に同じように扱わなければならない」\nという意味ではない。\n重要なのは、\n異なる扱いをすることに合理的な理由があるか\nという点である。\n⸻\n6　信頼保護\n国民が行政の行為を信頼して行動した場合、その信頼をどの程度保護すべきかという問題がある。\n例えば、\n行政の継続的な取扱い\n↓\n国民がそれを信頼\n↓\nその前提で生活・事業上の行動\n↓\n行政が突然正反対の対応\n↓\n国民に大きな不利益\nという場合、\n行政は自ら作り出した信頼をどの程度尊重すべきか\nが問題になる。\n⸻\n7　適正手続\n行政が国民に不利益を与える場合、\n適切な手続を経ているか\nという問題も重要になる。\n例えば、\n行政庁が不利益処分をする\n↓\n対象者に必要な情報を与える\n↓\n意見を述べる機会を保障\n↓\n必要な調査・判断\n↓\n処分\nというように、手続そのものが重要になる。\n⸻\n8　行政裁量と司法審査\n行政には、法律が一定の幅を認めている場合がある。\nこれを行政裁量という。\n例えば法律が、\n「一定の事情を考慮して許可することができる」\nなどと規定している場合、行政には一定の判断余地がある。\nしかし、\n裁量がある＝行政は自由\nではない。\n裁量\n↓\n法律によって認められた判断の幅\n↓\nその幅を逸脱・濫用\n↓\n違法となる可能性\nという関係になる。\n⸻\n9　基本原理の全体像\n行政\n↓\n法律による行政\n↓\n法律に反してはいけない\n＝法律の優位\n↓\n一定の場合には法律の根拠が必要\n＝法律の留保\n↓\n行政の判断にも限界\n↓\n比例原則 平等原則 信頼保護 適正手続 裁量統制\n↓\n行政権を法的にコントロールする\nこれが行政法総論の中心軸となる。\n⸻","blanks":["法律による行政の原理","法律の優位","法律の留保","比例原則"],"options":[["法律による行政の原理","法律行為的な行政活動","国民の権利利益の保護","不作為の違法確認訴訟"],["法律の優位","行政組織法","自力執行力","不可変更力"],["法律の留保","行政組織法","自力執行力","不可変更力"],["比例原則","行政主体","行政機関","行政行為"]],"mode":"administrative"},"3":{"text":"1　法源とは何か\n法源とは、\n法的判断の根拠となる法規範の存在形式\nをいう。\n行政法では、法律だけでなく様々な法源が問題になる。\n⸻\n2　憲法\n行政活動を考えるうえで憲法は最上位の法規範となる。\nしたがって、\n憲法\n↓\n法律\n↓\n命令・条例など\n↓\n行政活動\nという法体系を基本として理解する。\n行政活動が憲法に反していれば、その適法性が問題になる。\n⸻\n3　法律\n行政活動の重要な法源である。\n国会が制定する法律によって、\n•\t行政機関の権限\n•\t国民の義務\n•\t許認可\n•\t規制\n•\t手続\n•\t救済\nなどが定められる。\n⸻\n4　命令\n行政機関が制定する一般的規範を命令という。\n代表的には、\n•\t政令\n•\t省令\nなどがある。\nただし、行政機関が自由に法律と同じ内容の規範を作れるわけではない。\n法律\n↓\n命令制定の根拠・限界\n↓\n命令\nという関係を理解する必要がある。\n⸻\n5　条例\n地方公共団体が制定する自主的な法規範である。\n地方公共団体\n↓\n地域の実情に応じたルール\n↓\n条例\nという構造になる。\nただし、条例にも法的な限界がある。\n⸻\n6　規則\n行政機関や地方公共団体の機関が一定の事項について制定する規範である。\n法律・政令・省令・条例・規則などは、それぞれ、\n誰が制定するのか\nどの範囲で制定できるのか\nを区別する必要がある。\n⸻\n7　判例\n行政法では判例の重要性が非常に高い。\nなぜなら、行政法には、\n•\t条文だけでは明確にならない問題\n•\t裁量の限界\n•\t処分性\n•\t原告適格\n•\t信頼保護\n•\t国家賠償\nなど、裁判所による具体化が重要な領域が多いからである。\nしたがって、\n条文を読む\n↓\n判例で具体的な適用を見る\nという学習が必要になる。\n⸻\n8　行政上の一般原則\n行政法では、個別の条文だけではなく、\n•\t信義則\n•\t信頼保護\n•\t平等原則\n•\t比例原則\n•\t権利濫用禁止\nなどの一般原則が問題になることがある。\nこれらがどのような場面で行政活動を拘束するのかは、個別の判例・学説との関係で理解する必要がある。\n⸻\n9　法源の階層\n基本的には、\n憲法\n↓\n法律\n↓\n政令・省令等\n↓\n条例・規則等\nという法体系を意識する。\nただし、実際の行政法では単純な上下関係だけでなく、\nどの法令がどの事項についてどの権限を与えているか\nという権限配分まで確認する必要がある。\n⸻","blanks":["法源","憲法","法律","条例"],"options":[["法源","行政","立法","司法"],["憲法","行政","立法","司法"],["法律","行政","立法","司法"],["条例","行政","立法","司法"]],"mode":"administrative"},"4":{"text":"1　行政組織法とは\n行政組織法とは、\n行政を担当する主体・機関の構造や権限関係を規律する法\nである。\nつまり、\n「誰が行政を行うのか」\nを扱う。\n⸻\n2　行政主体と行政機関\nこの二つは区別する。\n行政主体\n行政活動の法律上の主体となる存在。\n代表例：\n•\t国\n•\t地方公共団体\n行政機関\n行政主体のために具体的な行政活動を行う組織上の機関。\nイメージすると、\n行政主体\n↓\n行政機関\n↓\n具体的な行政活動\nとなる。\n⸻\n3　国\n国は最大の行政主体である。\n国の行政組織には、\n•\t内閣\n•\t各省\n•\t庁\n•\tその他の行政機関\nなどが存在する。\n行政組織は単純に「国」という一つの組織で動いているわけではなく、多数の機関に権限が配分されている。\n⸻\n4　地方公共団体\n地方公共団体も重要な行政主体である。\n地方自治\n↓\n地域の行政需要\n↓\n地方公共団体\n↓\n条例・規則など\n↓\n地域行政\nという構造を持つ。\n地方自治を理解することは、行政法だけでなく、行政実務を理解するうえでも重要である。\n⸻\n5　行政機関の権限\n行政機関には、それぞれ担当する権限がある。\n例えば、\nA行政庁に権限がある\n↓\nB行政庁には原則としてその権限がない\nというように、\n誰がどの権限を持っているのか\nを確認する必要がある。\n行政事件を分析するとき、\n「この行政庁は本当にその処分をする権限を持っているのか？」\nという視点は非常に重要になる。\n⸻\n6　権限の委任\n行政機関が持つ権限を、他の行政機関に委ねることがある。\n権限の委任\n↓\n本来の権限を持つ行政機関\n↓\n一定の権限を他の機関へ移す\nという構造になる。\nここでは、\n•\t委任\n•\t代理\n•\t専決\n•\t代決\nなどを区別する必要がある。\nこれらは似ているが法的効果が異なる。\n⸻\n7　行政組織を学ぶ意味\n行政組織は単なる「組織図の暗記」ではない。\n実際の行政事件では、\n誰が処分をしたのか\n↓\nその行政機関に権限があったのか\n↓\n権限は適法に行使されたのか\n↓\n誰が責任を負うのか\nという問題につながる。\nしたがって行政組織法は、行政作用法・行政救済法と密接に関係する。\n⸻","blanks":["行政組織法","行政主体","行政機関","行政庁"],"options":[["行政組織法","法律の優位","法律の留保","自力執行力"],["行政主体","比例原則","行政行為","補助機関"],["行政機関","比例原則","行政行為","補助機関"],["行政庁","行政法","法人格","行政権"]],"mode":"administrative"},"5":{"text":"1　行政法上の法律関係とは\n行政法を学ぶ際には、\n行政と国民との間にどのような法的関係が存在するのか\nを理解する必要がある。\n例えば、\n国民が行政庁に許可を申請する\n↓\n行政庁が審査\n↓\n許可・不許可\n↓\n国民の法的地位に変化\nというように、行政活動によって法律関係が形成・変更・消滅する。\n⸻\n2　公法と私法\n行政法を学ぶと、\n公法と私法をどう区別するのか\nという問題が出てくる。\n大まかには、\n公法\n国家・行政と私人との関係など、公的な権力関係を規律する法領域。\n私法\n私人相互の関係を中心に規律する法領域。\nただし、現実には明確に二分できない場面も多い。\n⸻\n3　行政主体も私人として行動することがある\n行政主体が関係しているからといって、必ずしも公法上の法律関係になるとは限らない。\n例えば行政主体が、\n土地を購入する\nという活動をする場合、私人と同じような契約関係が問題になることがある。\nしたがって、\n「行政主体が関係しているか」だけでなく、「どのような性質の活動なのか」\nを確認する必要がある。\n⸻\n4　公権力の行使\n行政法上、特に重要なのが、\n行政が公権力を行使して国民の法的地位を一方的に変化させる場面\nである。\n例えば、\n行政庁\n↓\n法律に基づいて\n↓\n国民に許可を与える・拒否する\n↓\n国民の法的地位に影響\nという場合である。\nここから、\n行政行為とは何か？\n処分とは何か？\n取消訴訟の対象になるのか？\nという行政作用法・行政救済法の問題へ進んでいく。\n⸻\n5　行政と私人の関係\n行政と私人の関係には様々な形がある。\n① 権力的関係\n行政が公権力を行使する。\n例：\n→ 許可 → 認可 → 課税 → 規制 → 不利益処分\n② 給付・サービス関係\n行政が国民に給付・サービスを提供する。\n例：\n→ 社会保障 → 公共施設 → 各種給付\n③ 契約関係\n行政主体が私人と契約を締結する。\n→ 行政契約 → 公共工事 → 物品購入など\n④ 行政指導等\n行政が私人に一定の行為をするよう求める。\n→ 行政指導\nこのように行政活動は一つの形式ではない。\n⸻\n6　行政法上の権利・義務\n行政法上の法律関係では、\n誰にどのような権利・義務があるのか\nを考える。\n例えば、\n法律\n↓\n一定の要件を満たした者\n↓\n行政庁に申請\n↓\n行政庁に一定の判断義務\n↓\n申請者の法的地位\nという関係が形成されることがある。\nしたがって行政法では、\n「行政が何をしたか」\nだけでなく、\n「その結果、誰のどのような法的地位がどう変化したか」\nを見ることが重要になる。\n⸻\n第1編　総合整理\nここまでの5章を一つにつなげる。\n行政法総論の全体構造\n① 行政とは何か\n行政\n↓\n公共目的を実現するための多様な国家活動\n↓\n国民の権利・利益に影響\n↓\n法的統制が必要\n⸻\n② なぜ行政法が必要か\n行政に権限を与える\n＋\n行政権を法で拘束する\n↓\n法律による行政\n↓\n比例・平等・信頼保護・適正手続など\n↓\n適正な行政\n⸻\n③ 何が行政を拘束するのか\n憲法\n↓\n法律\n↓\n命令・条例等\n↓\n判例・一般原則等\n↓\n行政活動\n⸻\n④ 誰が行政するのか\n行政主体\n↓\n国・地方公共団体など\n↓\n行政機関\n↓\n権限配分\n↓\n具体的行政活動\n⸻\n⑤ 行政と国民の関係\n行政\n↓\n権力的活動 給付・サービス 契約 行政指導 その他の活動\n↓\n国民の法的地位に影響\n↓\n行政作用法\n↓\n問題が発生\n↓\n行政救済法\n⸻\n第1編・最重要マップ\n【憲法】\n↓\n国家権力を統制\n↓\n【行政】\n↓\n┌───────────────┐\n↓                               ↓\n行政を機能させる              行政を統制する\n↓                               ↓\n行政権限・組織                法律による行政\n↓\n┌─────────────┐\n↓             ↓\n法律の優位      法律の留保\n↓\n┌─────────┼─────────┐\n↓         ↓         ↓\n比例原則   平等原則   信頼保護\n↓\n適正手続\n↓\n行政活動\n↓\n┌───────────┬───────────┐\n↓           ↓           ↓\n行政立法     行政行為     行政指導\n↓           ↓           ↓\n└───────────┬───────────┘\n↓\n国民の権利・利益\n↓\n違法・不当？\n↓\n【救済】\n↓\n┌─────────┬─────────┐\n↓         ↓         ↓\n不服審査   行政訴訟   国家賠償\n⸻\n第1編を修了した時点での到達目標\nこの段階では、細かい条文番号を大量に暗記することが目的ではない。\n以下を自分の言葉で説明できることを目標とする。\nA　行政法の位置付け\n•\t行政とは何か\n•\t行政法とは何か\n•\tなぜ行政法が必要なのか\n•\t行政法と憲法・民法との関係\n•\t行政法の三領域\nB　行政法の基本原理\n•\t法治主義\n•\t法律による行政の原理\n•\t法律の優位\n•\t法律の留保\n•\t比例原則\n•\t平等原則\n•\t信頼保護\n•\t適正手続\n•\t行政裁量の統制\nC　法源\n•\t憲法\n•\t法律\n•\t命令\n•\t条例\n•\t規則\n•\t判例\n•\t一般原則\nD　行政組織\n•\t行政主体\n•\t行政機関\n•\t国\n•\t地方公共団体\n•\t行政機関の権限\n•\t権限の委任・代理等\nE　行政法律関係\n•\t公法と私法\n•\t公権力の行使\n•\t行政と私人の関係\n•\t行政活動による法的地位の変化\n⸻\n第1編・理解確認\n最後に、次の質問に答えられるか確認する。\n1.\t行政法は何を規律する法なのか。\n2.\t行政法には「行政を機能させる」という側面と「行政を統制する」という側面があるのはなぜか。\n3.\t行政法が一つの法典として存在しないのはなぜか。\n4.\t行政組織法・行政作用法・行政救済法の違いは何か。\n5.\t「法律による行政の原理」とは何か。\n6.\t法律の優位と法律の留保はどう違うか。\n7.\t行政裁量が認められている場合、行政は完全に自由に判断できるのか。\n8.\t比例原則は何を問題にするのか。\n9.\t行政主体と行政機関はどう違うか。\n10.\t行政主体が行う活動がすべて行政法上の公法関係になるのか。\n11.\t行政と国民との法律関係にはどのようなものがあるか。\n12.\t行政活動によって国民の権利・利益が侵害された場合、なぜ行政救済法につながるのか。\n⸻\n第1編の核心\n行政法を一言で覚えるなら、\n「行政を法によって動かし、同時に法によってコントロールするための仕組み」\nである。\nそして行政法を専門的に分析するときは、\n誰が？\n↓\nどんな権限で？\n↓\nどのような形式で？\n↓\nどんな手続で？\n↓\nどこまでできる？\n↓\n国民の権利・利益にどんな影響がある？\n↓\n違法ならどう救済する？\nという一本の流れで考える。\nこれが、これから行政法の各制度を学んでいく際の基本的な思考フレームになる。","blanks":["行政と国民との間にどのような法的関係が存在するのか","公法","私法","行政行為"],"options":[["行政と国民との間にどのような法的関係が存在するのか","法的問題を自分で発見する","簡易迅速かつ公正な手続","法律による行政の原理"],["公法","行政","立法","司法"],["私法","行政","立法","司法"],["行政行為","比例原則","行政主体","行政機関"]],"mode":"administrative"}},"2":{"1":{"text":"第1節　行政主体とは\n行政主体とは、基本的には、\n行政活動に関する権利・義務の帰属主体となる存在\nをいう。\n代表的な行政主体は、\n•\t国\n•\t地方公共団体\nである。\nしかし、現代の行政活動では、国・地方公共団体以外にも行政的な役割を担う法人等が存在する。\nしたがって、行政主体を理解するときには、\n「誰が行政活動の法的主体なのか」\nという視点が重要になる。\n⸻\n第2節　行政主体と行政機関\nここは行政組織法の最重要事項の一つである。\n行政主体\n行政活動について、法律上の主体となる存在。\n行政機関\n行政主体のために、具体的な行政活動を担当する組織上の機関。\nしたがって、\n行政主体 ≠ 行政機関\nである。\n例えば、\n国\n↓\n行政主体\n↓\n大臣\n↓\n行政機関・行政庁\n↓\n行政処分\nという関係になる。\n⸻\n第3節　なぜ区別するのか\n例えば大臣が国民に対して処分を行った場合、\n「大臣個人」が国家そのものになるわけではない。\n大臣という行政機関が、\n国という行政主体に帰属する行政権限を行使する\nという構造になっている。\nこの区別を理解すると、\n•\t誰の行為なのか\n•\t誰に権限があるのか\n•\t誰が責任を負うのか\n•\t誰を相手に訴えるのか\nという行政法上の問題を整理しやすくなる。\n⸻\n第4節　行政主体の種類\n行政主体には代表的に次のようなものがある。\n① 国\n国家全体を行政主体として行政活動を行う。\n② 地方公共団体\n都道府県・市町村など。\n地域における行政を担う。\n③ 特別な行政主体\n一定の行政目的のために法律によって設けられた法人等が、一定の行政作用を担う場合がある。\nここでは、\n行政主体は必ずしも「国」だけではない\nことを理解する。\n⸻\n第5節　行政主体と法人格\n行政主体を考える際には、\n法人格\nも重要になる。\n行政主体が法人格を持つことで、\n•\t権利義務の帰属\n•\t財産の管理\n•\t契約\n•\t訴訟\n•\t責任\nなどを法的に整理できる。\n特に地方公共団体は法人として活動する。\n⸻\n第6節　行政主体と行政事務\n行政主体は、一定の行政事務を担当する。\nただし、\n「行政主体だから何でもできる」\nわけではない。\n行政主体にも、\n•\t法律\n•\t条例\n•\t組織法\n•\t権限規定\nなどによる制約がある。\nしたがって、\n行政主体\n↓\n行政権限\n↓\n法律上の根拠\n↓\n権限の範囲\n↓\n具体的行政活動\nという関係で理解する。\n⸻\n第7節　行政主体と私法上の活動\n行政主体が行う活動が、すべて公権力の行使になるわけではない。\n例えば行政主体が、\n•\t土地を購入する\n•\t建物を賃借する\n•\t物品を購入する\n•\t民間企業と契約する\nなど、私人に近い形で活動する場合もある。\nしたがって、\n「行政主体が行った＝当然に公法上の行為」\nではない。\n行政主体が、\nどのような目的で、どのような法形式を用いて活動したのか\nを確認する必要がある。\n⸻","blanks":["行政主体","国","地方公共団体","法人格"],"options":[["行政主体","比例原則","行政機関","行政行為"],["国","長","行政","立法"],["地方公共団体","内閣総理大臣","公権力の行使","公共工事契約"],["法人格","行政法","行政庁","行政権"]],"mode":"administrative"},"2":{"text":"第1節　行政機関とは\n行政機関とは、行政主体のために行政事務を担当する組織上の機関である。\n行政機関には、\n•\t行政庁\n•\t諮問機関\n•\t参与機関\n•\t監査機関\n•\t執行機関\n•\t補助機関\nなど、様々な種類がある。\nしたがって、\n行政機関＝行政庁\nではない。\n⸻\n第2節　行政庁\n行政庁とは、\n行政主体の意思を決定し、それを外部に表示する権限を持つ行政機関\nと理解するとよい。\n例えば、\n•\t大臣\n•\t都道府県知事\n•\t市町村長\n•\t一定の委員会\nなどが行政庁となる場合がある。\n行政庁は行政法上特に重要である。\nなぜなら、\n行政処分など、国民の権利・利益に直接影響する行政活動\nを行う中心的な機関だからである。\n⸻\n第3節　行政機関の種類\n① 行政庁\n意思を決定・表示する。\n↓\n行政処分など\n⸻\n② 補助機関\n行政庁を補助する。\n例：\n•\t大臣を補佐する職員\n•\t知事を補佐する職員\nなど。\n⸻\n③ 諮問機関\n行政庁から諮問を受けて意見を述べる。\n基本的には、\n最終的な意思決定を行うのは行政庁\nである。\n⸻\n④ 参与機関\n行政庁の意思決定に一定の形で参加する機関。\n制度によって、その意見・同意等がどのような法的意味を持つかが異なる。\n⸻\n⑤ 監査機関\n行政活動を監査・検査する。\n行政活動が適正に行われているかをチェックする役割を持つ。\n⸻\n第4節　独任制と合議制\n行政機関には、\n独任制\n一人の行政庁を中心に意思決定する方式。\n例：\n大臣 知事 市町村長\nなど。\n合議制\n複数の者による合議によって意思を決定する方式。\n例：\n行政委員会\nなど。\n⸻\n第5節　行政機関の階層性\n行政組織には、\n上級機関\n↓\n下級機関\nという階層的構造が存在する場合がある。\n上級機関が下級機関に対して一定の指揮監督を行うことで、行政活動の統一性を確保する。\nただし、\n上級機関だから無制限に命令できる\nというわけではない。\n指揮監督権にも法律上の根拠・限界がある。\n⸻\n第6節　行政機関の権限\n行政機関には、それぞれ一定の権限が配分されている。\n例えば、\n法律\n↓\nA行政庁に許可権限を付与\n↓\nA行政庁\n↓\n許可・不許可を判断\nという構造になる。\nしたがって行政事件では、\nその行政機関に本当に権限があったのか？\nという問題が重要になる。\n⸻","blanks":["行政機関","行政庁","補助機関","諮問機関"],"options":[["行政機関","比例原則","行政主体","行政行為"],["行政庁","行政法","法人格","行政権"],["補助機関","比例原則","行政主体","行政行為"],["諮問機関","比例原則","行政主体","行政行為"]],"mode":"administrative"},"3":{"text":"第1節　なぜ機関相互の関係が必要なのか\n行政には大量の事務が存在する。\n一つの行政機関だけで全てを処理することは不可能である。\nそこで、\n•\t権限配分\n•\t指揮監督\n•\t委任\n•\t代理\n•\t代行\n•\t専決\nなどの仕組みが必要になる。\n⸻\n第2節　上級行政機関と下級行政機関\n行政組織では、\n上級機関\nと\n下級機関\nとの関係が存在することがある。\n上級機関\n↓\n指揮監督\n↓\n下級機関\nという構造である。\nこの関係によって、\n•\t行政の統一\n•\t法令の統一的執行\n•\t事務の調整\nなどが図られる。\n⸻\n第3節　指揮監督\n指揮監督とは、上級行政機関が下級行政機関に対して、一定の範囲でその行政事務について指示・監督することである。\nしかし、\n指揮監督権も法律上の権限\nである。\nしたがって、\n「上級機関だから当然に何でも命令できる」\nとはならない。\n⸻\n第4節　権限の委任\n権限の委任とは、\nある行政機関が持っている権限を、他の行政機関に移し、その機関がその権限を行使できるようにすること\nである。\nイメージ：\nA\n↓ 権限を委任\nB\n↓\nBが権限行使\nここでは、\n誰に権限が帰属しているのか\nが変化することが重要である。\n⸻\n第5節　権限の代理\n代理では、\n本来の権限者が誰なのか\nという点が委任とは異なる。\nAに権限がある\n↓\nBがAのために行為\n↓\n法律上の権限主体はA\nという構造になる。\n⸻\n第6節　代行\n代行は、本来の権限者に代わって他の者が職務を行う仕組みである。\n例えば、\n•\t欠員\n•\t事故\n•\tその他の一定の事情\nによって、本来の行政庁が職務を行えない場合などが問題になる。\n⸻\n第7節　専決\n専決とは、\n行政庁の内部において、一定の事項を担当者が決裁する仕組み\nである。\nここで重要なのは、\n専決＝権限そのものの委任\nとは限らないことである。\n行政組織内部の事務処理として、\n誰がどのような手順で行政庁の意思決定を行うのか\nという問題として理解する。\n⸻\n第8節　委任・代理・代行・専決の比較\n制度\t基本構造\t権限を見るポイント\n委任\t権限を他機関へ移す\t権限の帰属が移る\n代理\t本人のために行使\t本人に権限が残る\n代行\t本来の者に代わって職務\t代行関係\n専決\t内部的に決裁を分担\t内部的事務処理\nただし、実際の法的評価では、名称だけで判断してはいけない。\n根拠法令と制度の内容を確認する\nことが重要である。\n⸻","blanks":["権限配分","指揮監督","委任","代理"],"options":[["権限配分","比例原則","行政主体","行政機関"],["指揮監督","比例原則","行政主体","行政機関"],["委任","行政","立法","司法"],["代理","行政","立法","司法"]],"mode":"administrative"},"4":{"text":"第1節　国の行政組織の基本構造\n国の行政組織は大きく、\n内閣\n↓\n内閣府・各省\n↓\n外局等\n↓\nその他の行政機関\nという構造で理解できる。\nまた、内閣から独立した機関も存在する。\n⸻\n第2節　内閣\n日本国憲法上、行政権は内閣に属する。\n内閣は、\n行政権の中核となる機関\nである。\n内閣総理大臣と国務大臣から構成される。\n⸻\n第3節　内閣総理大臣\n内閣総理大臣は、\n内閣の首長\nである。\n国務大臣を任命し、内閣を統轄する。\nただし、内閣総理大臣の権限も、\n憲法・法律によって定められた権限\nである。\n行政組織を理解するときは、\n「内閣総理大臣が何でも自由に決定できる」\nという理解をしてはいけない。\n⸻\n第4節　国務大臣\n国務大臣は、\n内閣を構成する。\nまた、各省の長として行政事務を担当する。\nしたがって、\n国務大臣としての地位\nと\n各省の長としての地位\nを区別して考える場面がある。\n⸻\n第5節　内閣府・各省\n国の行政事務は、内閣府や各省などに分担されている。\nそれぞれ、\n所掌事務\nが定められている。\nつまり、\n行政機関\n↓\n所掌事務\n↓\n担当する行政分野\nという関係になる。\n⸻\n第6節　外局\n外局には、\n•\t委員会\n•\t庁\nなどがある。\n外局は内閣府・各省の内部に置かれながら、一定の独立性・専門性を持って行政を担当する。\n具体的な組織については、時代によって再編されることもあるため、\n現在の行政組織法令を確認する\nことが重要である。\n⸻\n第7節　附属機関\n行政組織には、\n審議会\nなどの附属機関が置かれることがある。\n行政庁が専門的・技術的な判断を必要とする場合に、\n専門的知見\nを行政判断に取り入れる役割を持つ。\n⸻\n第8節　地方支分部局\n国の行政機関には、地方に置かれる出先機関も存在する。\nこれらは、\n国の行政事務を地域で実施する\n役割を担う。\nしたがって、\n地方にある行政機関＝地方公共団体\nではない。\nここは非常に重要。\n国の地方出先機関\n→ 国の行政組織\n都道府県・市町村\n→ 地方公共団体\n両者は別物である。\n⸻","blanks":["内閣","行政権","内閣総理大臣","国務大臣"],"options":[["内閣","行政","立法","司法"],["行政権","行政法","行政庁","法人格"],["内閣総理大臣","地方公共団体","公権力の行使","公共工事契約"],["国務大臣","比例原則","行政主体","行政機関"]],"mode":"administrative"},"5":{"text":"第1節　地方公共団体とは\n地方公共団体は、\n地域の行政を担う行政主体\nである。\n代表的には、\n•\t都道府県\n•\t市町村\nがある。\n⸻\n第2節　地方自治\n地方自治は、\n地域の行政を地域の住民と地方公共団体が担う\nという考え方を基礎とする。\n日本国憲法は地方自治を保障しており、地方自治法がその具体的制度を定めている。\n⸻\n第3節　普通地方公共団体\n普通地方公共団体は、\n•\t都道府県\n•\t市町村\nである。\n市町村は住民に近い行政を担い、都道府県は広域的な行政を担うという役割分担が基本となる。\n⸻\n第4節　特別地方公共団体\n特別地方公共団体として、\n特別区\nなどがある。\nまた、制度上の地方公共団体には、一般的な都道府県・市町村とは異なる形態も存在する。\n重要なのは、\n地方公共団体には複数の種類がある\nということである。\n⸻\n第5節　地方公共団体の事務\n地方公共団体が行う事務には、\n自治事務\nと\n法定受託事務\nがある。\n自治事務\n地方公共団体が処理する事務のうち、法定受託事務以外のもの。\n法定受託事務\n法律または政令によって、地方公共団体が処理することとされている事務。\n⸻\n第6節　国と地方の役割分担\n地方分権の考え方では、\n国と地方公共団体の役割を適切に分担する\nことが重要となる。\n国\n↓\n全国的・広域的な事務\n地方\n↓\n地域に密着した行政\nという役割分担を基本として考える。\nただし、実際には両者が関係する行政分野も多い。\n⸻\n第7節　国の関与\n国と地方公共団体が完全に独立しているわけではない。\n国は法律に基づき、\n地方公共団体に対して一定の関与\nを行う場合がある。\nただし、\n地方自治を尊重しながら、法律に基づいて行われなければならない\nという点が重要である。\n⸻\n第8節　地方分権\n地方分権とは、\n地方公共団体の自主性・自立性を高め、国と地方の役割分担を適切にする\n方向の考え方である。\n地方分権\n↓\n地方公共団体の権限・責任\n↓\n地域の実情に応じた行政\nという関係で理解する。\n⸻","blanks":["地方公共団体","地方自治","都道府県","市町村"],"options":[["地方公共団体","内閣総理大臣","公権力の行使","公共工事契約"],["地方自治","比例原則","行政主体","行政機関"],["都道府県","比例原則","行政主体","行政機関"],["市町村","行政法","行政庁","法人格"]],"mode":"administrative"},"6":{"text":"第1節　地方公共団体の組織\n地方公共団体には、\n•\t議会\n•\t長\n•\t執行機関\n•\tその他の機関\nが存在する。\n地方行政を理解するには、\n議会と執行機関\nの関係を理解することが重要である。\n⸻\n第2節　地方議会\n地方議会は、\n地方公共団体の意思を決定する代表機関\nとして重要な役割を担う。\n主なものとして、\n•\t条例\n•\t予算\n•\t決算\n•\tその他重要事項\nについて議決する。\n⸻\n第3節　長\n普通地方公共団体では、\n•\t都道府県知事\n•\t市町村長\nが長となる。\n長は執行機関として、\n地方公共団体の行政を実際に執行する\n重要な役割を担う。\n⸻\n第4節　議会と長\n地方公共団体では、\n議会\nと\n長\nがそれぞれ異なる役割を担う。\n議会\n↓\n条例・予算などについて議決\n長\n↓\n行政を執行\nという基本構造になる。\nこの関係によって、\n地方行政における相互牽制\nが図られる。\n⸻\n第5節　条例\n地方公共団体は、\n法律の範囲内で条例を制定する権限\nを持つ。\n条例は、\n地域の実情に応じた行政ルール\nとして重要である。\n⸻\n条例制定権の限界\n条例だからといって、どんな内容でも制定できるわけではない。\n条例\n↓\n憲法\n↓\n法律\n↓\n地方自治法等\n↓\n条例制定権の範囲\nという法的関係を考える。\n特に、\n法律と条例の関係\nは地方自治法上の重要論点である。\n⸻\n第6節　規則\n地方公共団体の長などは、法令・条例に基づいて規則を制定することがある。\nしたがって、\n条例\nと\n規則\nは区別する必要がある。\n一般的には、\n条例\n→ 地方議会が制定\n規則\n→ 長などが制定\nという違いを基本として理解する。\n⸻\n第7節　住民の直接請求\n地方自治では、\n住民が地方行政に直接関与する制度\nも存在する。\n代表的なものとして、\n•\t条例の制定・改廃請求\n•\t監査請求\n•\t議会解散請求\n•\t長等の解職請求\nなどがある。\nこれらは、\n住民自治\nを具体化する仕組みとして理解できる。\n⸻\n第8節　住民監査請求\n住民監査請求は、\n地方公共団体の財務会計上の違法・不当な行為について、住民が監査を求める制度\nである。\n重要なのは、\n地方行政に対する住民による法的統制\nという性格を持つことである。\n⸻\n第9節　住民訴訟\n住民監査請求と関連して、\n住民訴訟\nがある。\n地方公共団体の財務会計上の違法な行為について、一定の要件のもとで住民が裁判上の救済を求める制度である。\nしたがって、\n地方行政\n↓\n財務会計行為\n↓\n違法？\n↓\n住民監査請求\n↓\n一定の場合\n↓\n住民訴訟\nという流れを理解する。\n⸻\n第10節　地方自治と行政救済\n地方公共団体も行政主体である。\nしたがって、\n地方公共団体\n↓\n行政活動\n↓\n住民の権利・利益に影響\n↓\n違法・不当？\n↓\n行政不服審査\n↓\n行政事件訴訟\n↓\n国家賠償\nなどの問題につながる。\n地方自治は行政救済法と切り離して理解することはできない。\n⸻\n第2編　行政組織の総合体系\nここまでを一本につなげる。\n【行政主体】\n↓\n┌──────────────┐\n↓              ↓\n国          地方公共団体\n↓              ↓\n行政組織        地方自治\n↓              ↓\n行政機関       議会・長など\n↓              ↓\n行政庁等        条例・規則\n↓              ↓\n権限の帰属     地方行政\n↓              ↓\n┌───────┼────────────┘\n↓       ↓\n委任      代理\n↓       ↓\n代行      専決\n└───┬───┘\n↓\n行政活動\n↓\n国民・住民の法的地位\n↓\n違法・不当？\n↓\n行政救済\n⸻\n行政組織法を理解するための5つの視点\n行政組織の問題に遭遇したら、次の5つを見る。\n① 主体\n誰が行政主体なのか？\n国？\n地方公共団体？\nその他の行政主体？\n⸻\n② 機関\n誰が実際に行政活動を行ったのか？\n大臣？\n知事？\n市町村長？\n委員会？\nその他？\n⸻\n③ 権限\nその機関に権限があるのか？\n法律？\n条例？\n委任？\nその他？\n⸻\n④ 関係\nその機関は他の機関とどういう関係にあるのか？\n上級・下級？\n指揮監督？\n委任？\n代理？\n代行？\n専決？\n⸻\n⑤ 責任\nその行政活動の法的責任は誰に帰属するのか？\n行政主体？\n行政機関？\n公務員？\nこの問題が、後の国家賠償・行政訴訟などにつながる。\n⸻\n第2編　重要概念比較\n行政主体・行政機関・行政庁\n概念\t意味\n行政主体\t行政活動の法的主体\n行政機関\t行政主体のために行政事務を担当する組織\n行政庁\t行政主体の意思を決定・表示する権限を持つ機関\n⸻\n独任制・合議制\n独任制\t合議制\n意思決定\t一人\t複数人\n代表例\t大臣・知事・市町村長\t行政委員会等\n特徴\t責任・意思決定が明確\t専門性・多面的判断\n⸻\n委任・代理・代行・専決\n核心\n委任\t権限を他の機関に移す\n代理\t本人のために権限を行使\n代行\t本来の権限者に代わって職務\n専決\t内部的に決裁を分担\n⸻\n国の行政組織と地方公共団体\n国\t地方公共団体\n行政主体\t国\t都道府県・市町村等\n中心組織\t内閣\t議会・長等\n活動範囲\t全国的\t地域的\n基本法制\t憲法・国家行政組織法等\t憲法・地方自治法等\nルール\t法律等\t条例・規則等\n⸻\n第2編　実際の事例で考える\n事例1　権限のない行政庁が処分したら？\nAという行政庁に許可権限が与えられている。\nところがBという行政庁が許可を拒否した。\n考える。\n誰が処分した？\n↓\nB行政庁\n↓\nBに権限はある？\n↓\n根拠法令は？\n↓\n委任されている？\n↓\n適法な権限行使？\nこのように、行政組織法の問題は行政作用・行政救済につながる。\n⸻\n事例2　担当職員が決裁した\n大臣名義の行政処分について、実際には担当職員が決裁した。\nこの場合、\n「担当職員が処分した」\nと単純に判断してはいけない。\n確認するのは、\n専決なのか？\n↓\n委任なのか？\n↓\n代理なのか？\n↓\n誰に権限が帰属しているのか？\nである。\n⸻\n事例3　国の機関と地方公共団体を混同する\n県内に国の出先機関がある。\nそのため、\n「県の行政機関だろう」\nと考えてしまう。\nしかし、\n国の地方支分部局\nと\n都道府県の行政組織\nは別である。\n所在地が同じ地域にあることと、行政主体が同じであることは別問題である。\n⸻\n事例4　条例と法律が衝突する\n地方公共団体が条例を制定した。\nしかし、その内容が法律と矛盾している可能性がある。\nこの場合、\n条例だから地域では絶対に有効\nとはならない。\n確認する。\n憲法\n↓\n法律\n↓\n条例\n↓\n条例制定権の範囲\n↓\n法律との関係\n↓\n適法性\nこの問題は、地方自治法・憲法・行政法の交差点に位置する。\n⸻\n第2編　専門職レベル基礎として覚えるべき核心\n行政組織法を単なる組織図として暗記してはいけない。\n本質は、\n行政権限を誰に配分し、その権限をどのように行使させるか\nという問題である。\nしたがって、\n行政主体\n↓\n行政機関\n↓\n権限の帰属\n↓\n権限の配分\n↓\n機関相互の関係\n↓\n実際の行政活動\n↓\n国民の権利・利益\n↓\n行政救済\nという一本の流れで理解する。\n⸻\n第2編　到達目標\nこの編を終えた時点で、次を自分の言葉で説明できることを目標とする。\n行政主体\n•\t行政主体とは何か\n•\t行政主体と行政機関の違い\n•\t国・地方公共団体の位置付け\n•\t特別な行政主体の存在\n•\t行政主体と私法上の活動\n行政機関\n•\t行政機関とは何か\n•\t行政庁とは何か\n•\t補助機関\n•\t諮問機関\n•\t参与機関\n•\t監査機関\n•\t独任制・合議制\n•\t行政機関の階層性\n権限\n•\t権限の帰属\n•\t所掌事務\n•\t指揮監督\n•\t委任\n•\t代理\n•\t代行\n•\t専決\n国の行政組織\n•\t内閣\n•\t内閣総理大臣\n•\t国務大臣\n•\t内閣府\n•\t各省\n•\t外局\n•\t附属機関\n•\t地方支分部局\n•\t独立した行政機関\n地方自治\n•\t地方公共団体\n•\t普通地方公共団体\n•\t特別地方公共団体\n•\t都道府県\n•\t市町村\n•\t自治事務\n•\t法定受託事務\n•\t地方分権\n•\t国の関与\n•\t地方議会\n•\t長\n•\t条例\n•\t規則\n•\t住民の直接請求\n•\t住民監査請求\n•\t住民訴訟\n⸻\n第2編　理解確認\n1.\t行政主体とは何か。\n2.\t行政主体と行政機関はどう違うか。\n3.\t行政庁とは何か。\n4.\t行政機関にはどのような種類があるか。\n5.\t独任制と合議制はどう違うか。\n6.\tなぜ行政機関には権限の配分が必要なのか。\n7.\t上級行政機関と下級行政機関にはどのような関係があるか。\n8.\t指揮監督権にはどのような限界があるか。\n9.\t権限の委任とは何か。\n10.\t委任と代理はどう違うか。\n11.\t代行と専決はどう違うか。\n12.\t国の行政組織はどのような基本構造になっているか。\n13.\t内閣と各省はどのような関係にあるか。\n14.\t国の地方支分部局と地方公共団体はどう違うか。\n15.\t地方自治とは何か。\n16.\t普通地方公共団体と特別地方公共団体はどう違うか。\n17.\t自治事務と法定受託事務はどう違うか。\n18.\t国と地方公共団体にはどのような関係があるか。\n19.\t地方議会と長にはどのような役割の違いがあるか。\n20.\t条例と規則はどう違うか。\n21.\t住民の直接請求にはどのようなものがあるか。\n22.\t住民監査請求と住民訴訟は何のための制度か。\n23.\t行政組織法と行政作用法はどうつながるか。\n24.\t行政組織法と行政救済法はどうつながるか。\n⸻\n第2編・最終総整理\n行政法を専門的に考える場合、\n「誰が行政をしているのか？」\nから出発する。\n↓\n行政主体\n↓\n国・地方公共団体等\n↓\n行政機関\n↓\n行政庁・補助機関・諮問機関等\n↓\n権限\n↓\n誰に帰属している？\n↓\n委任？\n代理？\n代行？\n専決？\n↓\n行政活動\n↓\n行政行為・行政指導・行政契約等\n↓\n国民・住民の権利利益\n↓\n違法・不当？\n↓\n行政救済\nという流れになる。\n⸻\n第2編の一文要約\n行政組織法とは、行政を担う主体・機関を定め、その権限の帰属・配分・相互関係を規律することによって、行政を適切に組織・運営するための法である。\nそして、\n「誰が行政をしたのか」ではなく、「どの行政主体の、どの行政機関に、どの権限が帰属し、それがどのように行使されたのか」\nまで考えることが、行政法を専門的に理解するための基本となる。","blanks":["地方議会","条例","予算","長"],"options":[["地方議会","比例原則","行政主体","行政機関"],["条例","行政","立法","司法"],["予算","行政","立法","司法"],["長","国","行政","立法"]],"mode":"administrative"}},"3":{"1":{"text":"第1節　行政活動は一種類ではない\n行政活動には様々な形式がある。\n大きく整理すると、\n行政立法\n↓ 一般的・抽象的なルールを作る\n行政計画\n↓ 将来の行政活動を計画する\n行政行為\n↓ 個別具体的な法的効果を発生させる\n行政契約\n↓ 契約という形で行政目的を実現する\n行政指導\n↓ 相手方に任意の協力を求める\n事実行為\n↓ 現実の事実上の活動をする\nというように整理できる。\n⸻\n第2節　なぜ行政活動の形式を区別するのか\n形式が違えば、\n必要な法的根拠\n法的効果\n手続\n司法審査\n救済方法\nなどが変わる。\n例えば、\n行政庁が一般的な基準を作った\n↓\n行政立法\nと、\n行政庁が特定の人に許可を与えた\n↓\n行政行為\nでは、法律上の性質が全く違う。\nしたがって、\n「行政が何をしたか」だけでなく、「どの法形式で行ったのか」\nを確認する必要がある。\n⸻\n第3節　行政活動の基本的な分類\n行政活動\t基本的な役割\n行政立法\t一般的ルールを定める\n行政計画\t将来の行政活動を計画する\n行政行為\t個別具体的な法的効果を発生させる\n行政契約\t契約によって行政目的を実現\n行政指導\t相手方の任意の協力を求める\n事実行為\t現実の事実上の活動\nこの分類を行政作用法の「地図」として使う。\n⸻","blanks":["行政立法","行政計画","行政行為","行政契約"],"options":[["行政立法","比例原則","行政主体","行政機関"],["行政計画","比例原則","行政主体","行政機関"],["行政行為","比例原則","行政主体","行政機関"],["行政契約","比例原則","行政主体","行政機関"]],"mode":"administrative"},"2":{"text":"第1節　行政立法とは\n行政立法とは、\n行政機関が一般的・抽象的な規範を制定すること\nをいう。\n例えば、\n法律\n↓\n行政機関に細かな基準を定める権限を委任\n↓\n政令・省令等\n↓\n具体的な行政活動\nという関係である。\n⸻\n第2節　なぜ行政立法が必要なのか\n法律だけですべての細かな行政ルールを定めることは難しい。\n例えば、\n法律\n↓\n「一定の基準を満たす建築物について許可する」\nと定めても、\n具体的な技術基準\nまで法律にすべて書くのは困難である。\nそこで、\n法律\n↓\n基本的事項を定める\n↓\n行政立法\n↓\n技術的・専門的・細目的事項を具体化\nという仕組みが用いられる。\n⸻\n第3節　法規命令\n行政立法のうち、\n国民の権利・義務に直接関係する法規範\nとして重要なのが法規命令である。\n代表的には、\n•\t政令\n•\t省令\nなどがある。\nただし、\n行政機関が法律と同じような規範を自由に作れる\nわけではない。\n法律による行政の原理から、\n行政立法には一定の法的限界がある。\n⸻\n第4節　委任命令\n法律が、\n「この事項について政令で定める」\nなどと行政機関に具体化を委ねる場合がある。\nこれが委任命令である。\n法律\n↓\n一定事項を委任\n↓\n政令・省令\n↓\n具体的規範\nという構造になる。\n⸻\n第5節　執行命令\n法律を実施するために必要な細かな事項を定める命令が問題となる。\n重要なのは、\n法律の内容を勝手に変更したり、新しい義務を無制限に作ったりすることはできない\nということである。\n⸻\n第6節　行政規則\n行政機関が内部的に定める一般的な基準・ルールもある。\n代表例：\n•\t通達\n•\t訓令\n•\t職務命令\n•\t裁量基準\nなど。\n行政規則は、原則として行政組織内部の規範であり、\n国民を直接法的に拘束する法規命令とは区別する\n必要がある。\n⸻\n第7節　通達\n通達は、上級行政機関が下級行政機関に対して、\n法令の解釈・運用などについて指示する\nために用いられる。\n原則として、\n通達それ自体が国民を直接拘束する法律ではない。\nしたがって、\n通達\n↓\n行政内部の統一\nと、\n法律\n↓\n国民の権利・義務を直接規律\nを区別する。\n⸻\n第8節　裁量基準\n行政庁が裁量を行使するとき、\nどのような場合にどのような判断をするか\nをあらかじめ基準化することがある。\nこれが裁量基準である。\n裁量基準\n↓\n行政判断の統一\n↓\n予測可能性\n↓\n恣意的判断の防止\nというメリットがある。\nただし、\n裁量基準を作ったからといって、行政庁の裁量が完全になくなるとは限らない。\n⸻","blanks":["行政立法","法規命令","委任命令","執行命令"],"options":[["行政立法","比例原則","行政主体","行政機関"],["法規命令","比例原則","行政主体","行政機関"],["委任命令","比例原則","行政主体","行政機関"],["執行命令","比例原則","行政主体","行政機関"]],"mode":"administrative"},"3":{"text":"第1節　行政計画とは\n行政計画とは、\n行政主体が一定の行政目的を実現するため、将来の行政活動について定める計画\nである。\n例えば、\n•\t都市計画\n•\t土地利用計画\n•\t道路計画\n•\t地域振興計画\n•\t環境計画\nなどがある。\n⸻\n第2節　行政計画の特徴\n行政計画は、\n将来を見据えた行政活動\nである。\n現在の一つの処分だけを見るのではなく、\n将来どのような行政を行うのか\nを計画する。\n⸻\n第3節　行政計画の法的性質\n行政計画には様々な種類がある。\n中には、\n国民の権利・義務に直接影響するもの\nもあれば、\n行政内部の政策方針にとどまるもの\nもある。\nしたがって、\n行政計画だからすべて同じ法的性質\nではない。\n⸻\n第4節　行政計画と国民\n例えば都市計画によって、\n土地利用\n↓\n建築可能性\n↓\n土地所有者の利益\nに影響が出る場合がある。\nそこで、\n行政計画による国民の権利・利益への制約をどのように法的にコントロールするか\nが問題となる。\n⸻\n第5節　行政計画の変更\n行政計画は、\n社会情勢の変化\nによって変更されることがある。\nしかし、\n計画\n↓\n国民が信頼\n↓\nその前提で行動\n↓\n行政が突然変更\n↓\n国民に重大な不利益\nという場合には、\n信頼保護\nなどの問題が生じる可能性がある。\n⸻","blanks":["行政計画","将来の行政活動","都市計画"],"options":[["行政計画","比例原則","行政主体","行政機関"],["将来の行政活動","行政指導の限界","代替的作為義務","行政不服審査法"],["都市計画","比例原則","行政主体","行政機関"]],"mode":"administrative"},"4":{"text":"第1節　行政行為とは\n行政法を学ぶうえで最重要概念の一つ。\n行政行為とは、伝統的な行政法学上、\n行政庁が、公権力の行使として、具体的事実について、直接に国民の権利義務その他の法的地位を形成・確認する行為\nとして整理される。\n代表例：\n•\t許可\n•\t認可\n•\t下命\n•\t免許\n•\t特許\n•\t確認\n•\t取消し\n•\t課税処分\nなど。\n⸻\n第2節　行政行為の基本構造\n法律\n↓\n行政庁\n↓\n具体的な事実\n↓\n行政行為\n↓\n国民の法的地位\nという構造になる。\n例えば、\n営業許可\n法律\n↓\n要件を満たす\n↓\n行政庁\n↓\n許可\n↓\n営業できる法的地位\nとなる。\n⸻\n第3節　行政行為の重要性\n行政行為は、\n行政が一方的に国民の法的地位を変化させる\nという特徴を持つ。\nそのため、\n国民の権利・自由に大きな影響\nを与える。\nだからこそ、\n•\t法律の根拠\n•\t要件\n•\t裁量\n•\t手続\n•\t効力\n•\t瑕疵\n•\t取消し\n•\t撤回\n•\t救済\nなどが重要になる。\n⸻\n第4節　行政行為の分類\n行政行為には様々な分類がある。\n代表的には、\n法律行為的行政行為\n準法律行為的行政行為\nという分類がある。\nさらに、\n授益的行為\n侵害的行為\nという観点から分類することもできる。\n⸻\n第5節　授益的行政行為\n国民に利益を与える行政行為。\n例：\n許可 特許 給付等\n行政\n↓\n国民に利益\nという方向になる。\nただし、授益的であっても、\n第三者の利益に影響\nする場合などには法的問題が生じる。\n⸻\n第6節　侵害的行政行為\n国民の権利・自由を制限する行政行為。\n例：\n営業停止 課税 許可取消し 義務付け\nなど。\n侵害的行政行為では、\n法律の根拠\nが特に重要になる。\n⸻","blanks":["行政行為","公権力の行使","法的地位","許可"],"options":[["行政行為","比例原則","行政主体","行政機関"],["公権力の行使","地方公共団体","内閣総理大臣","公共工事契約"],["法的地位","比例原則","行政主体","行政機関"],["許可","行政","立法","司法"]],"mode":"administrative"},"5":{"text":"第1節　下命\n下命とは、\n行政庁が国民に対して一定の作為・不作為を命じる行為\nである。\n例えば、\n「○○をしなさい」\nという命令。\n国民\n↓\n一定の義務\n↓\nその履行\nという関係になる。\n⸻\n第2節　禁止\n禁止とは、\n一定の行為をしてはならないと命じる行政行為\nである。\n例えば、\n営業禁止\nなど。\n⸻\n第3節　許可\n許可とは、\n一般的に禁止されている行為について、一定の要件のもとで禁止を解除する行為\nとして伝統的に説明される。\n例えば、\n法律\n↓\n原則として一定の営業を禁止\n↓\n要件を満たす\n↓\n許可\n↓\n営業可能\nという構造。\n⸻\n第4節　免許\n免許という言葉は様々な法律で使われる。\n一般的には、\n一定の資格・能力・要件を満たす者に特定の行為をすることを認める\nような制度を指すことが多い。\nただし、\n「免許」という名称だけで法的性質を決めてはいけない。\n具体的な法律の規定を見る必要がある。\n⸻\n第5節　特許\n行政法学上の特許とは、\n行政庁が特定の者に新たな権利・法律上の力を設定する行為\nとして説明される。\n代表的な例として、\n公企業の特許\nなどが伝統的に挙げられる。\n⸻\n第6節　認可\n認可とは、\n私人間などの法律行為を補充して、その法律上の効力を完成させる行為\nと伝統的に説明される。\n例えば、\n私人間の法律行為\n↓\n一定の行政庁の認可\n↓\n法律上の効力が完成\nという構造。\n⸻\n第7節　代理・代替的行為等\n行政庁が、\n他人に代わって法律上の行為をする\nような行政作用もある。\n行政行為の分類は、名称を丸暗記するより、\n行政庁が何をして、国民の法的地位がどう変化するのか\nを見ることが重要である。\n⸻","blanks":["下命","禁止","許可","認可"],"options":[["下命","行政","立法","司法"],["禁止","行政","立法","司法"],["許可","行政","立法","司法"],["認可","行政","立法","司法"]],"mode":"administrative"},"6":{"text":"第1節　行政裁量とは\n法律が行政庁に、\n一定の判断の幅\nを認める場合がある。\nこれを行政裁量という。\n法律\n↓\n複数の選択肢\n↓\n行政庁が判断\nという構造。\n⸻\n第2節　なぜ裁量が必要なのか\n行政が扱う問題は非常に複雑である。\n例えば、\n•\t技術的判断\n•\t専門的判断\n•\t公益の比較衡量\n•\t将来予測\n•\t政策的判断\nなどについて、法律がすべて一つの答えを定めることは難しい。\nそこで、\n行政に一定の判断余地を認める\n必要が生じる。\n⸻\n第3節　裁量＝自由ではない\n非常に重要。\n裁量がある＝何をしてもよい\nではない。\n裁量\n↓\n法律によって与えられた判断の幅\n↓\nその範囲を逸脱\nまたは\n裁量を濫用\n↓\n違法となる可能性\nという構造である。\n⸻\n第4節　羈束行為と裁量行為\n羈束行為\n法律の要件を満たせば、\n行政庁が原則として一定の判断をしなければならない\nもの。\n裁量行為\n法律が行政庁に、\n一定の判断の余地\nを認めるもの。\n⸻\n第5節　裁量の種類\n裁量には、\n要件裁量\nと\n効果裁量\nという整理がある。\n要件裁量\n法律上の要件に該当するかについて判断の余地がある。\n効果裁量\n要件を満たした後、\nどのような処分をするか\nについて判断の余地がある。\n⸻\n第6節　裁量統制\n裁量があっても、\n裁判所による法的統制がなくなるわけではない。\n裁量の判断について、\n•\t事実誤認\n•\t考慮すべき事項を考慮していない\n•\t考慮すべきでない事項を考慮\n•\t社会通念上著しく妥当性を欠く\n•\t法律の目的から逸脱\nなどがあれば、\n裁量権の逸脱・濫用\nが問題となる。\n⸻\n第7節　裁量審査の基本構造\n行政庁\n↓\n裁量あり\n↓\n行政判断\n↓\n裁判所\n↓\n裁量の存在を尊重\n↓\nしかし、\n裁量の範囲内か？\n↓\n判断過程に問題はないか？\n↓\n事実認定は適切か？\n↓\n考慮事項は適切か？\n↓\n逸脱・濫用はないか？\nという流れで審査する。\n⸻","blanks":["行政裁量","判断の幅","裁量"],"options":[["行政裁量","比例原則","行政主体","行政機関"],["判断の幅","比例原則","行政主体","行政機関"],["裁量","行政","立法","司法"]],"mode":"administrative"},"7":{"text":"第1節　行政行為にはどのような効力があるか\n行政行為は、単なる私人間の意思表示とは異なる。\n伝統的行政法学では、\n公定力\n不可争力\n自力執行力\n不可変更力\nなどの効力が論じられてきた。\nただし、それぞれ意味が違う。\n⸻\n第2節　公定力\n公定力とは、\n行政行為が違法であっても、権限ある機関によって取り消されるまでは、一定の範囲でその効力を前提として扱う\nという伝統的な説明である。\nこれにより、\n行政行為\n↓\n違法の疑い\n↓\n当然に誰でも無視\nではなく、\n↓\n一定の手続で争う\nという法的安定性が確保される。\n⸻\n第3節　不可争力\n行政行為について、\n一定期間内に取消訴訟等で争わなければ、後から争うことができなくなる\nという法的安定性の問題がある。\nこれが不可争力に関係する。\n⸻\n第4節　自力執行力\n行政行為に基づく義務を履行しない場合に、\n行政が一定の法的手段によって自らその実現を図る\nことができる場合がある。\nただし、\nすべての行政行為に当然に認められるわけではない。\n行政上の強制執行については、第5編以降で詳しく扱う。\n⸻\n第5節　不可変更力\n行政庁自身が、\n一度した行政行為を自由に変更・取消しできるのか\nという問題がある。\n特に、\n•\t取消し\n•\t撤回\n•\t信頼保護\n•\t法的安定性\nとの関係で問題になる。\n⸻","blanks":["公定力","不可争力","自力執行力","不可変更力"],"options":[["公定力","行政法","行政庁","法人格"],["不可争力","比例原則","行政主体","行政機関"],["自力執行力","法律の優位","法律の留保","行政組織法"],["不可変更力","法律の優位","法律の留保","行政組織法"]],"mode":"administrative"},"8":{"text":"第1節　瑕疵とは\n行政行為が、\n法律上要求される要件を満たしていない\n場合、その行政行為に瑕疵があるという。\n例えば、\n法律\n↓\n一定の要件\n↓\n行政行為\n↓\n要件を満たしていない\n↓\n瑕疵\nという構造。\n⸻\n第2節　違法な行政行為\n行政行為の違法には様々な原因がある。\n例えば、\n•\t権限違反\n•\t法律違反\n•\t手続違反\n•\t裁量権の逸脱・濫用\n•\t事実認定の誤り\nなど。\n⸻\n第3節　無効と取消し\n瑕疵ある行政行為について、\n無効なのか\n取り消すことができるのか\nを区別する。\n無効\n重大な瑕疵があり、\nはじめから法的効果を生じない\nと評価される場合。\n取消し\n瑕疵があるものの、\n権限ある機関によって取り消されるまでは一定の効力を持つ\nと扱われる場合。\n⸻\n第4節　無効と取消しの違い\n無効\t取消し\n瑕疵\t重大\t比較的軽い\n効力\t原則として初めから否定\t取消しまで一定の効力\n争い方\t無効確認等\t取消訴訟等\n法的安定性\t相対的に低い\t強く問題になる\nただし、\n「重大明白」という無効判断の基準などは、判例・学説との関係でさらに深く学ぶ必要がある。\n⸻\n第5節　手続上の瑕疵\n行政行為の内容だけでなく、\n手続\nに問題がある場合もある。\n例えば、\n行政手続法上必要な手続\n↓\n行われていない\n↓\n手続上の瑕疵\n↓\n処分の効力にどう影響する？\nという問題になる。\n⸻","blanks":["瑕疵","権限違反","法律違反","手続違反"],"options":[["瑕疵","行政","立法","司法"],["権限違反","比例原則","行政主体","行政機関"],["法律違反","比例原則","行政主体","行政機関"],["手続違反","比例原則","行政主体","行政機関"]],"mode":"administrative"},"9":{"text":"第1節　職権取消し\n行政庁が、\n自らした違法な行政行為を取り消す\nことを職権取消しという。\n例えば、\n違法な許可\n↓\n行政庁が違法を認識\n↓\n職権取消し\nという流れ。\n⸻\n第2節　取消しと撤回の違い\n非常に重要。\n取消し\n行政行為が最初から違法だった\nことを理由として、その効力を失わせる。\n撤回\n当初は適法だった行政行為を、その後の事情によって将来に向かって失効させる\nもの。\n⸻\nイメージ\n取消し\n最初\n↓\n違法\n↓\n行政行為\n↓\n取消し\n⸻\n撤回\n最初\n↓\n適法\n↓\n行政行為\n↓\n後から事情変化\n↓\n撤回\n⸻\n第3節　撤回の理由\n撤回が問題となるのは、\n•\t法令上の事情\n•\t公益上の必要\n•\t相手方の義務違反\n•\t前提事情の変化\nなど。\nただし、\n行政庁が自由に撤回できるとは限らない。\n⸻\n第4節　信頼保護との関係\n行政庁が一度した行政行為を後から取消し・撤回すると、\n国民がその行政行為を信頼して行った活動\nに影響する。\nそのため、\n行政行為\n↓\n国民の信頼\n↓\n取消し・撤回\n↓\n不利益\n↓\n信頼保護・比例原則等\nという問題が生じる。\n⸻\n第5節　職権取消しと撤回の比較\n職権取消し\t撤回\n原因\t原始的な違法\t後発的事情\n当初\t違法\t適法\n効果\t遡及的に問題となり得る\t原則として将来に向かう\n重要問題\t法的安定性・信頼保護\t公益・信頼保護等\n⸻","blanks":["職権取消し","取消し","撤回","信頼保護"],"options":[["職権取消し","法律の優位","法律の留保","行政組織法"],["取消し","行政法","行政庁","法人格"],["撤回","行政","立法","司法"],["信頼保護","比例原則","行政主体","行政機関"]],"mode":"administrative"},"10":{"text":"第1節　行政契約とは\n行政契約とは、\n行政主体が行政目的を実現するために締結する契約\nである。\n行政\n↓\n一方的な処分\nだけではなく、\n↓\n契約\n↓\n相手方の協力\nによって行政目的を実現する場合もある。\n⸻\n第2節　行政契約の種類\n代表的には、\n•\t行政主体と私人との契約\n•\t行政主体相互間の契約\n•\t公共工事契約\n•\t公有財産に関する契約\n•\t給付行政に関する契約\nなどがある。\n⸻\n第3節　行政契約と民法\n行政主体が契約を締結した場合、\n民法などの私法が問題になることもある。\nしかし、\n行政目的のための契約\nであるため、\n•\t法律による行政\n•\t平等原則\n•\t公益\n•\t法律上の権限\n•\t契約相手方の保護\nなど、行政法特有の問題も生じる。\n⸻\n第4節　行政契約のメリット\n行政契約には、\n相手方との協力を得ながら行政目的を実現できる\nという特徴がある。\n行政\n↓\n一方的命令\nではなく、\n行政\n↔\n私人\n↓\n協議・合意\n↓\n行政目的\nという方法を取れる。\n⸻\n第5節　行政契約の限界\n行政契約だからといって、\n行政が何でも契約で決められる\nわけではない。\n例えば、\n法律上行政庁に一方的な処分を行わせることが予定されている場合、\nそれを契約によって自由に置き換えられるのか\nという問題がある。\nしたがって、\n契約によって行政権限の限界を回避できないか\nという視点が重要になる。\n⸻","blanks":["行政契約","公共工事契約","給付行政"],"options":[["行政契約","比例原則","行政主体","行政機関"],["公共工事契約","地方公共団体","内閣総理大臣","公権力の行使"],["給付行政","比例原則","行政主体","行政機関"]],"mode":"administrative"},"11":{"text":"第1節　行政指導とは\n行政指導とは、\n行政機関が、その任務・所掌事務の範囲内で、一定の行政目的を実現するため、特定の者に一定の作為・不作為などを求める指導・勧告・助言等で、処分には当たらないもの\nとして理解される。\n行政\n↓\n「○○してください」\n↓\n相手方\nという形になる。\n⸻\n第2節　行政指導の特徴\n行政指導の重要な特徴は、\n原則として相手方の任意の協力によって実現する\nという点である。\n行政指導\n↓\nお願い・勧告・助言等\n↓\n相手方\n↓\n任意に従う\nという構造。\n⸻\n第3節　行政指導と行政処分\nここは必ず区別する。\n行政処分\n行政庁\n↓\n一方的に法的効果\n↓\n国民の法的地位が変化\n行政指導\n行政\n↓\n協力を求める\n↓\n相手方の任意\nという違い。\n⸻\n第4節　行政指導のメリット\n行政指導には、\n•\t柔軟性\n•\t専門性\n•\t迅速性\n•\t相手方との協議\nなどのメリットがある。\n行政\n↓\n命令\nだけでなく、\n行政\n↔\n相手方\n↓\n協議・調整\nによって問題を解決できる。\n⸻\n第5節　行政指導の問題点\n行政指導には、\n実質的に相手方が断れない\nという問題が生じることがある。\n例えば、\n行政\n↓\n「お願いです」\n↓\n相手方\n↓\n実際には従わないと許可が出ない？\nという場合、\n任意の行政指導が実質的な強制になっていないか\nが問題となる。\n⸻\n第6節　行政手続法による統制\n行政手続法では、行政指導について一定のルールを設けている。\n重要な考え方は、\n行政指導の相手方の任意性を確保すること\nである。\n行政指導\n↓\n任意の協力\n↓\n事実上の強制になってはいけない\nという方向で理解する。\n⸻\n第7節　行政指導と法的根拠\n行政指導は処分とは異なり、\n直ちに相手方の権利義務を一方的に変更するものではない。\nしかし、\n法律上許される範囲を超えて行政指導をすることはできない。\nしたがって、\n行政指導にも法的限界がある。\n⸻","blanks":["行政指導","任意の協力","柔軟性","行政手続法"],"options":[["行政指導","比例原則","行政主体","行政機関"],["任意の協力","法律の優位","法律の留保","行政組織法"],["柔軟性","行政法","行政庁","法人格"],["行政手続法","法律の優位","法律の留保","行政組織法"]],"mode":"administrative"},"12":{"text":"第1節　事実行為とは\n行政活動の中には、\n法律上の意思表示そのものではなく、現実の事実を実現する活動\nがある。\n例えば、\n•\t道路の維持管理\n•\tごみ収集\n•\t公共施設の管理\n•\t情報提供\n•\t行政調査\n•\t物理的な活動\nなど。\n⸻\n第2節　法律行為と事実行為\n法律行為的な行政活動\n行政庁の意思表示によって、\n法的効果を発生させる。\n例：\n行政処分\n事実行為\n現実の活動によって、\n物理的・事実的な結果を生じさせる。\n例：\n道路補修\nという違いがある。\n⸻\n第3節　行政上の実力行使\n行政が物理的に活動する場合には、\n国民の権利・自由への制約\nが生じることがある。\n例えば、\n立入検査\n↓\n建物内に入る\n↓\n財産・プライバシーに影響\nという場合、\n法律上の根拠・手続・比例原則\nなどが問題となる。\n⸻\n第4節　行政調査\n行政調査とは、\n行政目的を実現するために必要な情報・資料を収集する活動\nである。\n例えば、\n•\t立入検査\n•\t報告徴収\n•\t質問\n•\t帳簿検査\nなど。\n行政\n↓\n情報が必要\n↓\n調査\n↓\n事実認定\n↓\n行政判断\nという流れになる。\n⸻\n第5節　行政調査の限界\n行政調査も、\n「行政だから自由に調査できる」\nわけではない。\n調査\n↓\n法律上の根拠\n↓\n必要性\n↓\n相当性\n↓\n適正手続\nなどが問題となる。\n特に、\n強制的な調査なのか、任意の調査なのか\nを区別する必要がある。\n⸻\n第6節　事実行為と国家賠償\n行政上の事実行為によって、\n国民に損害が発生する\n場合がある。\n例えば、\n行政の物理的活動\n↓\n違法\n↓\n国民に損害\n↓\n国家賠償\nという問題につながる。\nしたがって、\n行政行為だけが行政法上の責任問題を生むわけではない。\n⸻\n第3編　行政作用・総合体系\nここまでの12章を一本につなげる。\n【行政活動】\n↓\n「どんな方法で行う？」\n↓\n┌──────────┬──────────┐\n↓          ↓          ↓\n一般的       個別的       合意・協力\nルール       法的効果\n↓          ↓          ↓\n行政立法     行政行為    行政契約\n↓          ↓          ↓\n└──────────┬──────────┘\n↓\n行政計画\n↓\n将来の行政\n↓\n行政指導\n↓\n任意の協力\n↓\n事実行為\n↓\n現実の活動\n↓\n┌──────────────┐\n↓              ↓\n国民の権利       公共目的\n・利益への影響\n↓\n法的統制\n↓\n法律・比例・平等・\n適正手続・裁量統制\n↓\n違法？\n↓\n行政救済\n⸻\n行政作用を分析する基本フレーム\n実際の行政事件では、まず次の順番で考える。\nSTEP 1　何をした？\n行政庁が、\n何をしたのか？\n⸻\nSTEP 2　どの形式？\nそれは、\n•\t行政立法？\n•\t行政計画？\n•\t行政行為？\n•\t行政契約？\n•\t行政指導？\n•\t事実行為？\n⸻\nSTEP 3　法的効果は？\n国民の、\n権利\n義務\n法的地位\nにどのような変化が生じた？\n⸻\nSTEP 4　法的根拠は？\n法律？\n条例？\n命令？\nその他？\n⸻\nSTEP 5　行政に裁量はある？\n羈束？\n裁量？\n裁量があるなら、\nその範囲内か？\n⸻\nSTEP 6　手続は適法？\n行政手続法等に従っているか？\n⸻\nSTEP 7　比例・平等・信頼保護等に反しないか？\n行政活動\n↓\n目的\n↓\n手段\n↓\n必要性・相当性\n↓\n国民の利益との比較\n⸻\nSTEP 8　違法ならどう救済する？\n行政不服審査？\n取消訴訟？\n義務付け訴訟？\n国家賠償？\nなどへつながる。\n⸻\n行政作用の重要比較\n行政立法・行政行為・行政指導\n行政立法\t行政行為\t行政指導\n対象\t一般的・抽象的\t個別・具体的\t個別具体的な場合が多い\n法的効果\t規範を設定\t法的地位を変える\t原則として直接の法的効果なし\n相手方\t一般\t特定人等\t特定人等\n強制性\t規範による\t一方的\t原則任意\n典型例\t政令・省令\t許可・取消し\t勧告・助言\n⸻\n行政行為・行政契約・行政指導\n行政行為\t行政契約\t行政指導\n基本構造\t一方的\t合意\t任意の協力\n法的効果\t直接発生\t契約による\t原則なし\n相手方\t一般に特定\t契約相手\t指導対象者\n強制性\tあり得る\t合意による\t原則なし\n⸻\n取消しと撤回\n取消し\t撤回\n問題\t当初から違法\t後発的事情\n当初の適法性\t違法\t適法\n効果\t遡及が問題となる\t原則将来効\n重要論点\t瑕疵・法的安定性\t公益・信頼保護\n⸻\n羈束行為と裁量行為\n羈束\t裁量\n行政の判断余地\t小さい\t認められる\n法律の定め\t比較的明確\t一定の幅\n司法審査\t法適合性を通常どおり審査\t逸脱・濫用等を中心に審査\n⸻\n第3編　専門職レベル基礎としての核心\n行政作用法で最も重要なのは、\n行政活動の「名前」を暗記することではない。\n重要なのは、\nその行政活動が、国民の法的地位にどのような影響を与えるのか\nを考えることである。\n例えば、\n「行政指導です」\nと言われても、\n↓\n本当に任意なのか？\n↓\n実質的な強制ではないか？\n↓\n行政庁に権限があるのか？\n↓\n手続は適切か？\n↓\n相手方にどのような不利益があるか？\n↓\n違法ならどのように救済するか？\nまで考える。\n同様に、\n「許可です」\nだけで終わらず、\n↓\n許可とは何か？\n↓\n法的根拠は？\n↓\n要件は？\n↓\n裁量は？\n↓\n手続は？\n↓\n第三者への影響は？\n↓\n違法ならどう争う？\nと考える。\n⸻\n第3編　最重要思考法\n行政作用を見たら、\n①何をした？\n↓\n②どの法形式？\n↓\n③どんな法的効果？\n↓\n④法的根拠は？\n↓\n⑤裁量は？\n↓\n⑥手続は？\n↓\n⑦限界を超えていない？\n↓\n⑧違法ならどう救済？\nこの8段階で分析する。\n⸻\n第3編　到達目標\nこの編を終えた段階で、次の内容を説明できることを目標とする。\n行政活動の形式\n•\t行政活動の形式とは何か\n•\t行政立法\n•\t行政計画\n•\t行政行為\n•\t行政契約\n•\t行政指導\n•\t事実行為\n行政立法\n•\t行政立法とは何か\n•\t法規命令\n•\t委任命令\n•\t執行命令\n•\t行政規則\n•\t通達\n•\t裁量基準\n•\t行政立法の限界\n行政計画\n•\t行政計画とは何か\n•\t行政計画の種類\n•\t法的効果\n•\t国民の権利利益への影響\n•\t計画変更と信頼保護\n行政行為\n•\t行政行為とは何か\n•\t行政行為の特徴\n•\t授益的・侵害的行政行為\n•\t下命\n•\t禁止\n•\t許可\n•\t免許\n•\t特許\n•\t認可\n•\tその他の行政行為\n行政裁量\n•\t裁量とは何か\n•\t羈束行為との違い\n•\t要件裁量\n•\t効果裁量\n•\t裁量統制\n•\t逸脱・濫用\n行政行為の効力\n•\t公定力\n•\t不可争力\n•\t自力執行力\n•\t不可変更力\n行政行為の瑕疵\n•\t違法な行政行為\n•\t瑕疵\n•\t無効\n•\t取消し\n•\t手続上の瑕疵\n取消し・撤回\n•\t職権取消し\n•\t撤回\n•\t両者の違い\n•\t信頼保護との関係\n行政契約\n•\t行政契約とは\n•\t種類\n•\t民法との関係\n•\t行政契約の限界\n•\t公益との関係\n行政指導\n•\t行政指導とは\n•\t行政処分との違い\n•\t任意性\n•\t行政手続法による統制\n•\t違法・不当な行政指導\n事実行為\n•\t事実行為とは\n•\t行政調査\n•\t強制調査と任意調査\n•\t物理的活動\n•\t国家賠償との関係\n⸻\n第3編　理解確認\n1.\t行政作用法とは何を扱う法分野か。\n2.\tなぜ行政活動の形式を区別する必要があるか。\n3.\t行政立法と行政行為はどう違うか。\n4.\t法規命令と行政規則はどう違うか。\n5.\t通達は国民を直接拘束する法律なのか。\n6.\t行政計画とは何か。\n7.\t行政行為とは何か。\n8.\t許可と認可はどのように区別されるか。\n9.\t授益的行政行為と侵害的行政行為はどう違うか。\n10.\t行政裁量とは何か。\n11.\t裁量があると行政は自由に判断できるのか。\n12.\t羈束行為と裁量行為はどう違うか。\n13.\t公定力とは何か。\n14.\t行政行為の瑕疵とは何か。\n15.\t無効と取消しはどう違うか。\n16.\t職権取消しと撤回はどう違うか。\n17.\t行政契約と私人間の通常の契約はどのように関係するか。\n18.\t行政指導と行政処分はどう違うか。\n19.\t行政指導において「任意性」が重要なのはなぜか。\n20.\t行政上の事実行為とは何か。\n21.\t行政調査にはどのような法的問題があるか。\n22.\t行政作用を分析するとき、どのような順序で考えるべきか。\n⸻\n第3編・最終整理\n行政作用法の全体像は、\n行政が公共目的を実現する\n↓\nそのための手段を選ぶ\n↓\n一般的ルールを作る\n→ 行政立法\n↓\n将来の方向を決める\n→ 行政計画\n↓\n個別具体的に法的効果を発生させる\n→ 行政行為\n↓\n合意によって実現する\n→ 行政契約\n↓\n任意の協力を求める\n→ 行政指導\n↓\n現実の活動を行う\n→ 事実行為\n↓\nそのすべてについて\n法律による行政\n比例原則\n平等原則\n信頼保護\n適正手続\n裁量統制\nなどによる法的統制\n↓\n違法・不当な場合\n↓\n行政救済\nという構造になる。\n⸻\n第3編の一文要約\n行政作用法とは、行政が公共目的を実現するために用いる様々な活動形式と、その法的根拠・法的効果・限界を規律する法分野である。\nそして、行政法を専門的に考える際には、\n「行政が何をしたか」\nだけではなく、\n「どの法形式を使い、どの法的根拠に基づき、どのような法的効果を発生させ、その権限行使がどこまで許されるのか」\nまで考える。\nこれが行政作用法を理解するための基本となる。","blanks":["事実行為","法律行為的な行政活動","行政処分","行政上の事実行為"],"options":[["事実行為","比例原則","行政主体","行政機関"],["法律行為的な行政活動","法律による行政の原理","国民の権利利益の保護","不作為の違法確認訴訟"],["行政処分","比例原則","行政主体","行政機関"],["行政上の事実行為","行政の実効性確保","行政上の強制執行","狭義の訴えの利益"]],"mode":"administrative"}},"4":{"1":{"text":"第1節　行政手続とは\n行政手続とは、\n行政機関が行政上の決定を行うまで、またはその決定を行う際の手続\nをいう。\n例えば、\n申請\n↓\n審査\n↓\n行政庁の判断\n↓\n処分\nという一連の過程が行政手続に関係する。\n⸻\n第2節　なぜ行政手続が必要なのか\n行政には、\n公権力を行使して国民の権利・利益に影響を与える力\nがある。\nそのため、\n行政庁\n↓\n自由に判断\n↓\n国民の権利を制限\nとなれば、\n恣意的な行政\nにつながる危険がある。\nそこで、\n行政\n↓\n手続による統制\n↓\n公正な判断\n↓\n国民の権利利益の保護\nという仕組みが必要になる。\n⸻\n第3節　行政手続の基本的機能\n行政手続には、大きく次のような機能がある。\n① 公正の確保\n行政庁が恣意的に判断することを防ぐ。\n② 透明性の確保\n行政が、\n何を基準に\nどのように判断したのか\nを明らかにする。\n③ 国民の権利利益の保護\n国民に、\n意見を述べる機会\nなどを与える。\n④ 行政判断の適正化\n行政庁自身が、\n必要な情報・意見を踏まえて判断する\nことにつながる。\n⸻\n第4節　適正手続\n行政手続を考える際には、\n適正手続\nという考え方が重要になる。\n行政\n↓\n国民に不利益\n↓\n突然決定\nではなく、\n行政\n↓\n事前の通知\n↓\n資料・理由の提示\n↓\n意見を述べる機会\n↓\n行政庁による判断\n↓\n処分\nという手続的保障を考える。\n⸻\n第5節　行政手続と憲法\n行政手続法だけでなく、\n憲法上の適正手続\nとの関係も問題になる。\n行政手続\n↕\n憲法上の人権保障\nという関係である。\nただし、\n憲法上の適正手続があるから、すべての場合に同じ手続が必要\nというわけではない。\n処分の性質・不利益の程度・行政目的などを踏まえて考える。\n⸻\n第6節　手続的統制と実体的統制\n行政をコントロールする方法には、\n実体的統制\n行政が「何を決定できるか」\nを規制する。\n例：\n法律による行政 比例原則 裁量統制\n手続的統制\n行政が「どのように決定するか」\nを規制する。\n例：\n理由提示 聴聞 弁明の機会 意見公募\nという違いがある。\n⸻\n第7節　行政手続法の基本構造\n行政手続法は、\n1.\t総則\n2.\t申請に対する処分\n3.\t不利益処分\n4.\t行政指導\n5.\t処分等の求め\n6.\t届出\n7.\t意見公募手続等\nという構造を持つ。(e-Gov 法令検索)\nこの順番をそのまま行政手続の地図として利用できる。\n⸻","blanks":["行政手続","適正手続","実体的統制","手続的統制"],"options":[["行政手続","比例原則","行政主体","行政機関"],["適正手続","比例原則","行政主体","行政機関"],["実体的統制","法律の優位","法律の留保","行政組織法"],["手続的統制","法律の優位","法律の留保","行政組織法"]],"mode":"administrative"},"2":{"text":"第1節　行政手続法の目的\n行政手続法は、\n行政運営における公正の確保と透明性の向上を図り、国民の権利利益の保護に資すること\nを目的とする。\nしたがって、\n行政手続法＝単なる役所の事務処理マニュアル\nではない。\n行政権を手続面から統制するための法律である。(e-Gov 法令検索)\n⸻\n第2節　行政手続法の適用対象\n行政手続法は、\n•\t処分\n•\t行政指導\n•\t届出\n•\t命令等の制定\nなどについて手続を定める。\nただし、\n行政活動のすべてに一律に適用されるわけではない。\n個別法による特別な手続や、行政手続法上の適用除外などを確認する必要がある。\n⸻\n第3節　処分\n行政手続法における「処分」は、行政法総論で学んだ行政行為と完全に同じ概念として機械的に考えてはいけない。\n行政手続法上の定義を確認し、\nどの手続規定が適用される処分なのか\nを判断する必要がある。\n⸻\n第4節　申請\n行政庁に対して、\n許可・認可・免許その他の自己に利益を与える処分を求める行為\nが申請に該当する。\n基本構造：\n申請者\n↓\n申請\n↓\n行政庁\n↓\n審査\n↓\n処分\n⸻\n第5節　不利益処分\n不利益処分とは、\n行政庁が、特定の者を名宛人として、直接に義務を課し、またはその権利を制限する処分\nをいう。\n代表例：\n•\t許可取消し\n•\t営業停止\n•\t課税\n•\t免許取消し\nなど。\n不利益処分では、\n処分前にどのような手続保障が必要か\nが重要になる。\n⸻\n第6節　行政指導\n行政指導についても行政手続法が一定のルールを設けている。\n行政指導\n↓\n行政目的\n↓\n相手方への協力要請\n↓\n任意性\nという構造。\n行政指導が実質的な強制にならないように統制する。\n⸻\n第7節　届出\n届出とは、\n行政庁に対して一定の事項を通知する行為\nである。\n届出は申請とは異なる。\n申請\n↓\n行政庁の許可等を求める\n届出\n↓\n一定事項を通知する\nという違い。\n⸻\n第8節　意見公募手続\n行政機関が命令等を制定する場合、\n広く国民から意見を募集する\n仕組みがある。\nいわゆる、\nパブリックコメント\nである。\n行政機関\n↓\n命令等の案\n↓\n意見募集\n↓\n国民等から意見\n↓\n行政機関が考慮\n↓\n命令等\nという流れ。\n⸻","blanks":["行政手続法","公正の確保","透明性の向上","国民の権利利益の保護"],"options":[["行政手続法","法律の優位","法律の留保","行政組織法"],["公正の確保","法律の優位","法律の留保","行政組織法"],["透明性の向上","地方公共団体","内閣総理大臣","公権力の行使"],["国民の権利利益の保護","法律による行政の原理","法律行為的な行政活動","不作為の違法確認訴訟"]],"mode":"administrative"},"3":{"text":"第1節　申請処理の基本構造\n申請\n↓\n行政庁\n↓\n審査\n↓\n許可・認可等\nという過程を取る。\n申請者にとって重要なのは、\n行政庁が何を基準に、どのように審査するのか\nである。\n⸻\n第2節　審査基準\n行政庁は、申請に対する判断の基準を定めて公にしておくことが重要となる。\n審査基準\n↓\n申請者\n↓\n予測可能性\n↓\n行政判断の統一\n↓\n恣意的判断の防止\nという機能がある。\n⸻\n第3節　標準処理期間\n申請から処分までに通常必要となる期間を、\n標準処理期間\nとして定める場合がある。\nこれは、\n行政庁が申請をいつまでに必ず処理しなければならない\nという期限と必ずしも同じではない。\n重要なのは、\n申請者に処理期間の目安を示す\nという点である。\n⸻\n第4節　申請の審査\n行政庁は、\n法令上の要件\nに従って申請を審査する。\nしたがって、\n申請\n↓\n法令上の要件\n↓\n審査\n↓\n要件を満たす？\n↓\n処分\nという構造になる。\n⸻\n第5節　申請拒否と理由提示\n申請を拒否する場合には、\nなぜ拒否したのか\nを明らかにすることが重要になる。\n理由提示\n↓\n申請者が判断の根拠を理解\n↓\n不服申立て・訴訟の判断材料\n↓\n行政判断の透明性\nという機能がある。\n⸻\n第6節　申請と行政裁量\n行政庁に裁量が認められる場合、\n申請要件を満たしているか\nだけでなく、\n公益・政策・専門的判断\nなどが問題になることがある。\nしかし、\n裁量がある＝自由に拒否できる\nわけではない。\n裁量の範囲を超えれば、\n裁量権の逸脱・濫用\nが問題になる。\n⸻\n第7節　申請に対する不作為\n申請したのに、\n行政庁がいつまでも何もしない\n場合がある。\nこのような行政の不作為も、\n国民の権利利益に影響する。\nそこで、\n•\t行政手続上の処理\n•\t不作為への救済\n•\t行政不服審査\n•\t行政訴訟\nなどにつながる。\n⸻","blanks":["申請","審査基準","標準処理期間","理由提示"],"options":[["申請","行政","立法","司法"],["審査基準","比例原則","行政主体","行政機関"],["標準処理期間","地方公共団体","内閣総理大臣","公権力の行使"],["理由提示","比例原則","行政主体","行政機関"]],"mode":"administrative"},"4":{"text":"第1節　不利益処分とは\n不利益処分は、\n国民に義務を課したり、権利を制限したりする処分\nである。\n例：\n許可\n↓\n違反\n↓\n営業停止\nなど。\n行政\n↓\n不利益\n↓\n手続保障\nという関係が重要になる。\n⸻\n第2節　処分基準\n行政庁は、不利益処分について、\nどのような場合にどのような処分をするか\nという基準を定めることがある。\nこれを処分基準という。\n処分基準\n↓\n行政判断の予測可能性\n↓\n公平性\n↓\n恣意的判断の防止\nという機能がある。\n⸻\n第3節　理由提示\n不利益処分をする場合、\nなぜその処分をしたのか\nを明らかにすることが重要である。\n理由提示\n↓\n処分理由の明確化\n↓\n行政庁の慎重な判断\n↓\n相手方の不服申立て・訴訟\n↓\n行政統制\nという機能を持つ。\n⸻\n第4節　聴聞\n重大な不利益処分については、\n聴聞\nという手続が問題となる。\n基本構造：\n行政庁\n↓\n処分予定\n↓\n相手方に通知\n↓\n聴聞\n↓\n意見・証拠等\n↓\n行政庁の判断\n↓\n処分\nという流れ。\n⸻\n第5節　弁明の機会の付与\n不利益処分について、\n聴聞までは必要ないが、\n相手方に意見を述べる機会を保障する必要がある場合、\n弁明の機会の付与\nが行われる。\nしたがって、\n聴聞\n比較的重大な不利益処分\n弁明\nそれ以外の一定の不利益処分\nという基本的な区別をする。\n⸻\n第6節　聴聞の特徴\n聴聞では、\n•\t予定される処分\n•\t根拠となる事実\n•\t法令上の根拠\nなどが示され、\n相手方に、\n意見を述べる\n証拠を提出する\nなどの機会が保障される。\n⸻\n第7節　手続違反と処分\n行政庁が必要な手続を経ずに不利益処分をした場合、\nその手続違反が処分の違法性・効力にどのような影響を与えるのか\nが問題になる。\nこれは、\n行政手続\nと\n行政行為の瑕疵\nをつなぐ重要な論点である。\n⸻","blanks":["不利益処分","処分基準","聴聞","弁明の機会"],"options":[["不利益処分","法律の優位","法律の留保","行政組織法"],["処分基準","比例原則","行政主体","行政機関"],["聴聞","行政","立法","司法"],["弁明の機会","法律の優位","法律の留保","行政組織法"]],"mode":"administrative"},"5":{"text":"第1節　行政指導と任意性\n行政指導は、\n相手方の任意の協力\nによって実現するのが基本である。\n行政\n↓\n「協力してください」\n↓\n相手方\n↓\n自発的に応じる\nという構造。\n⸻\n第2節　行政指導の限界\n行政指導を利用して、\n実質的に処分と同じ効果を強制する\nことは問題となる。\n例えば、\n「これはお願いです」\nと言いながら、\n従わなければ許可しない\nという状態になれば、\n任意の行政指導\n↓\n実質的強制\nとなる危険がある。\n⸻\n第3節　行政指導の一般原則\n行政指導は、\n行政機関の任務・所掌事務の範囲内\nで行う必要がある。\nまた、\n相手方の権利利益を不当に侵害しない\nことが必要となる。\n⸻\n第4節　行政指導の方式\n行政指導をする場合、\nその趣旨・内容・責任者\nなどを明確にすることが重要になる。\n相手方が、\n「行政から何を求められているのか」\nを理解できるようにする。\n⸻\n第5節　行政指導の中止等の求め\n法律上、一定の場合には、\n違法な行政指導の中止等を求める\n制度が設けられている。\nここでは、\n行政指導\n↓\n法令違反の状態\n↓\n相手方\n↓\n中止等を求める\nという仕組みを理解する。\n⸻\n第6節　複数者への行政指導\n行政指導では、\n一定の業界・事業者全体\nに対して行われることもある。\nこの場合、\n個々の相手方の任意性\nだけでなく、\n行政指導が実質的に一律の規制として機能していないか\nという問題も生じる。\n⸻","blanks":["行政指導","相手方の任意の協力","任意性","行政指導の限界"],"options":[["行政指導","比例原則","行政主体","行政機関"],["相手方の任意の協力","裁量権の逸脱・濫用","法律関係を図にする","法律による行政の原理"],["任意性","行政法","行政庁","法人格"],["行政指導の限界","将来の行政活動","代替的作為義務","行政不服審査法"]],"mode":"administrative"},"6":{"text":"第1節　届出\n届出とは、\n行政庁に対して一定の事項を通知する行為\nである。\n重要なのは、\n届出と申請は違う\nということ。\n申請\n行政庁の許可等を求める。\n届出\n一定事項を通知する。\n⸻\n第2節　届出の効果\n届出について法令上、\n一定の事項を届け出れば法的義務を履行したものとされる\n場合がある。\n行政庁の許可を待つ必要がある制度とは異なる。\nしたがって、\n「行政に書類を出す＝申請」\nではない。\n⸻\n第3節　届出の不受理\n届出について行政庁が、\n「受け取りません」\nとすることができるのか。\n届出制度の趣旨から、\n行政庁の受理を要件とする制度なのか\nを確認する必要がある。\n届出\n↓\n法令上の要件\n↓\n通知\n↓\n法律上の効果\nという構造を理解する。\n⸻\n第4節　意見公募手続\n意見公募手続は、\n命令等を制定する前に、広く一般から意見を募集する制度\nである。\nいわゆる、\nパブリックコメント\nである。\n⸻\n第5節　意見公募手続の目的\n行政機関\n↓\n命令案\n↓\n国民・事業者等から意見\n↓\n様々な利害・専門知識\n↓\n行政判断\nという流れにより、\n•\t行政の透明性\n•\t公正性\n•\t政策の質\n•\t国民参加\nを高める。\n⸻\n第6節　意見公募手続の対象\nすべての行政上の文書について意見公募を行うわけではない。\n行政手続法上の、\n命令等\nについて一定の手続が問題になる。\nそのため、\n「行政が何かを決める＝必ずパブコメ」\nではない。\n⸻\n第7節　意見の扱い\n行政機関は、\n提出された意見を考慮する\nことが求められる。\nただし、\n提出された意見のとおりに必ず制度を変更しなければならない\nという制度ではない。\n意見公募は、\n行政の意思決定に国民の意見を反映させるための手続\nとして理解する。\n⸻","blanks":["届出","申請","意見公募手続","命令等"],"options":[["届出","行政","立法","司法"],["申請","行政","立法","司法"],["意見公募手続","地方公共団体","内閣総理大臣","公権力の行使"],["命令等","行政法","行政庁","法人格"]],"mode":"administrative"},"7":{"text":"第1節　なぜ行政情報が重要なのか\n行政は大量の情報を保有している。\n例えば、\n•\t行政文書\n•\t統計\n•\t許認可情報\n•\t政策情報\n•\t公共事業情報\n•\t個人情報\nなど。\n行政情報は、\n行政を監視するための重要な基盤\nになる。\nしかし同時に、\n個人のプライバシー\nも守らなければならない。\nしたがって、\n公開\nと\n保護\nのバランスが重要になる。\n⸻\n第2節　情報公開制度\n情報公開制度は、\n行政機関等が保有する情報について、一定の要件のもとで開示を求めることを認める制度\nである。\n基本構造：\n国民\n↓\n開示請求\n↓\n行政機関等\n↓\n行政文書等を確認\n↓\n開示・不開示\n↓\n必要に応じて不服申立て・訴訟\n⸻\n第3節　情報公開の目的\n情報公開には、\n① 行政の透明性\n行政が何をしているのかを明らかにする。\n② 国民による監視\n行政活動を国民がチェックできる。\n③ 民主的統制\n行政に対する国民の関与を可能にする。\n④ 行政運営の適正化\n情報公開を意識することで行政の適正な運営につながる。\nという機能がある。\n⸻\n第4節　行政文書\n情報公開では、\n何が開示請求の対象になるのか\nが重要。\n単に、\n「行政が知っている情報」\n全部が対象になるわけではない。\n法令上の、\n行政文書等\nの定義を確認する必要がある。\n⸻\n第5節　開示請求\n基本的には、\n請求者\n↓\n行政文書の開示請求\n↓\n行政機関\n↓\n開示決定等\nという流れになる。\n行政機関は、\n法律上の不開示事由\nに該当するかなどを判断する。\n⸻\n第6節　不開示情報\n情報公開制度では、\nすべての情報を無条件に公開するわけではない。\n例えば、\n•\t個人に関する情報\n•\t法人等の正当な利益を害する情報\n•\t国の安全等に関する情報\n•\t捜査等に関する情報\n•\t審議・検討等に関する情報\n•\t事務・事業に関する情報\nなど、一定の不開示情報が存在する。\nしたがって、\n公開原則と不開示情報のバランス\nが重要となる。\n⸻\n第7節　部分開示\n一つの行政文書の中に、\n開示できる部分\nと\n不開示情報\nが混在することがある。\nこの場合、\n不開示部分だけを除いて開示する\nという部分開示が問題になる。\n⸻\n第8節　情報公開と個人情報保護\n情報公開\n↓\n行政を知る権利・透明性\n個人情報保護\n↓\n個人の権利利益\nという、\n二つの価値\nを調整する必要がある。\n例えば、\n行政文書\n↓\nある個人の情報\n↓\n行政の透明性\nvs\n個人のプライバシー\nという問題になる。\n⸻\n第9節　個人情報保護制度\n現在の個人情報保護制度では、\n個人情報の保護に関する法律\nが公的部門を含む全国共通の制度の基盤となっている。\n2023年4月から、従来の行政機関個人情報保護法・独立行政法人等個人情報保護法を個人情報保護法に統合し、地方公共団体についても全国共通ルールを適用する仕組みへ移行した。(警視庁ポータルサイト)\nしたがって、古い行政法教材で見られる、\n「行政機関個人情報保護法」\nを現在の制度としてそのまま覚えるのは適切ではない。\n⸻\n第10節　個人情報とは\n個人情報保護法上、\n生存する個人に関する情報で、特定の個人を識別できるもの\nなどが基本となる。\n例えば、\n•\t氏名\n•\t生年月日\n•\t住所\n•\t顔写真\n•\t個人識別符号\n•\t他の情報と照合することで個人を識別できる情報\nなど。\n⸻\n第11節　行政機関等による個人情報の取扱い\n行政機関等が個人情報を扱う場合、\n無制限に利用・提供してよいわけではない。\n基本的には、\n取得\n↓\n保有\n↓\n利用\n↓\n提供\n↓\n安全管理\nという各段階について法的規律が存在する。\n個人情報保護委員会の現行ガイドラインでも、行政機関等について、個人情報・保有個人情報、利用・提供、安全管理、開示請求等の仕組みが整理されている。(警視庁ポータルサイト)\n⸻\n第12節　本人による開示請求等\n本人は、一定の要件のもと、\n自分の保有個人情報について開示等を求める\nことができる。\n情報公開制度\n↓\n行政情報全般\n個人情報保護制度\n↓\n本人の個人情報等\nという違いを基本的に理解する。\n⸻\n第13節　情報公開と個人情報保護の違い\n情報公開\t個人情報保護\n主な目的\t行政の透明性\t個人の権利利益の保護\n主な対象\t行政文書等\t個人情報・保有個人情報等\n基本的方向\t開示\t適正な取扱い・本人による権利行使\n問題\t不開示情報\t取得・利用・提供・安全管理等\nただし、\n両者は完全に別々の制度ではない。\n情報公開の場面でも個人情報保護が問題となる。\n⸻\n第14節　行政情報と公文書管理\n行政情報を適切に公開するためには、\nそもそも行政が文書を適切に作成・管理・保存していること\nが重要になる。\nしたがって、\n公文書管理\n↓\n情報公開\n↓\n行政の透明性\nという関係がある。\n公文書管理制度は情報公開・個人情報保護と並ぶ行政情報制度の重要な構成要素として位置付けられている。(有斐閣)\n⸻\n第4編　行政手続・情報の総合体系\n【行政活動】\n↓\n適正な意思決定\n↓\n【行政手続】\n↓\n┌──────────────┐\n↓              ↓\n申請             不利益処分\n↓              ↓\n審査         聴聞・弁明\n↓              ↓\n処分             処分\n└──────┬───────┘\n↓\n行政指導\n↓\n任意性\n↓\n届出・意見公募\n↓\n透明性・参加\n↓\n【行政情報】\n↓\n┌──────────────┐\n↓              ↓\n情報公開       個人情報保護\n↓              ↓\n行政監視       個人の権利利益\n└──────┬───────┘\n↓\n行政統制\n↓\n違法・不当なら\n↓\n行政救済\n⸻\n行政手続を分析する基本フレーム\n実際の行政事件では、次の順番で考える。\nSTEP 1　何が起きている？\n申請？\n不利益処分？\n行政指導？\n届出？\n命令等の制定？\n⸻\nSTEP 2　どの法律が適用される？\n行政手続法？\n個別法？\n条例？\nその他？\n↓\n特別法に特別な定めがある？\n⸻\nSTEP 3　行政庁には何が要求される？\n審査基準？\n処分基準？\n標準処理期間？\n理由提示？\n聴聞？\n弁明？\n⸻\nSTEP 4　手続は適正か？\n通知\n↓\n情報提供\n↓\n意見提出\n↓\n証拠提出\n↓\n理由提示\n↓\n判断\nという流れに問題がないか。\n⸻\nSTEP 5　行政指導なら任意性はあるか？\n行政指導\n↓\n本当に任意？\n↓\n実質的強制では？\n↓\n法的根拠・所掌事務の範囲内？\n⸻\nSTEP 6　情報が問題なら？\n公開請求？\n個人情報？\n不開示情報？\n本人請求？\n第三者情報？\n⸻\nSTEP 7　違法なら？\n行政不服審査\n↓\n行政訴訟\n↓\n国家賠償\nなどの救済へつなげる。\n⸻\n第4編　重要比較\n申請・届出\n申請\t届出\n基本目的\t許可等を求める\t一定事項を通知\n行政庁の判断\t原則必要\t制度上必ずしも必要でない\n典型例\t許可申請\t開業届等\nポイント\t審査\t通知\n⸻\n聴聞・弁明\n聴聞\t弁明の機会\n対象\t重大な不利益処分等\tその他の一定の不利益処分\n手続保障\tより充実\t簡易\n内容\t意見・証拠提出等\t弁明書等\n目的\t処分前の防御機会\t処分前の防御機会\n⸻\n情報公開・個人情報保護\n情報公開\t個人情報保護\n中心価値\t透明性\t個人の権利利益\n主な問題\t何を開示するか\tどう取り扱うか\n開示\t原則・例外を検討\t本人による開示請求等\n制限\t不開示情報\t利用・提供等の規律\n⸻\n第4編　具体例\n事例1　許可申請をしたが行政庁が処理しない\n申請\n↓\n行政庁が長期間処理しない\n↓\nまず、\n申請に該当するか？\n↓\n審査基準は？\n↓\n標準処理期間は？\n↓\n行政庁に処理義務は？\n↓\n不作為への救済は？\nという順番で考える。\n⸻\n事例2　突然営業停止処分を受けた\n営業停止\n↓\n不利益処分\n↓\n行政手続法等の適用？\n↓\n聴聞？\n↓\n通知？\n↓\n理由提示？\n↓\n手続は適法？\n↓\n実体的にも違法では？\n↓\n行政不服審査・行政訴訟\nという流れになる。\n⸻\n事例3　「お願いだから営業をやめて」と行政に言われた\nこれは、\n行政処分なのか？\nそれとも、\n行政指導なのか？\nを確認する。\n行政指導なら、\n任意なのか？\n↓\n実質的強制ではないか？\n↓\n行政手続法上の規律は？\nという分析を行う。\n⸻\n事例4　行政文書を公開してほしい\n開示請求\n↓\n対象文書は？\n↓\n行政文書等に該当？\n↓\n不開示情報は？\n↓\n部分開示できる？\n↓\n第三者情報は？\n↓\n開示・不開示決定\n↓\n争うなら不服申立て・訴訟\nという流れ。\n⸻\n事例5　行政文書に自分の個人情報が含まれている\n行政文書\n↓\n自分の個人情報\n↓\n情報公開制度？\n個人情報保護制度？\n↓\n本人の保有個人情報に対する開示請求等\nというように、\nどの制度を使うべきか\nを判断する。\n⸻\n第4編　専門職レベル基礎としての核心\n行政手続を学ぶ目的は、\n「行政手続法の条文を暗記すること」\nではない。\n本質は、\n行政が決定を行う過程を、法によってコントロールすること\nにある。\n⸻\n行政\n↓\n判断\n↓\nその前に、\n基準は明らかか？\n期間は適切か？\n相手方に情報が与えられたか？\n意見を述べる機会があるか？\n理由が示されたか？\n↓\n行政庁の判断\n↓\n国民の権利利益\nという流れで考える。\n⸻\n情報についても同じ。\n行政\n↓\n大量の情報を保有\n↓\n一方では、\n国民に公開する\n他方では、\n個人情報を保護する\n↓\n両者を調整\n↓\n行政の透明性\n＋\n個人の権利利益\nという構造になる。\n⸻\n第4編　最重要思考法\n行政手続を見たら、\n①何の手続？\n↓\n②誰に対する手続？\n↓\n③どの法律が適用？\n↓\n④行政庁に何が義務付けられている？\n↓\n⑤相手方にどんな手続保障がある？\n↓\n⑥手続違反はある？\n↓\n⑦実体面にも違法性はある？\n↓\n⑧どう救済する？\nという順番で考える。\n情報問題なら、\n①何の情報？\n↓\n②誰が保有？\n↓\n③どの制度？\n↓\n④開示対象？\n↓\n⑤不開示情報？\n↓\n⑥個人情報との関係？\n↓\n⑦不服申立て・訴訟？\nと分析する。\n⸻\n第4編　到達目標\nこの編を終えた時点で、次を説明できることを目標とする。\n行政手続の基本\n•\t行政手続とは何か\n•\tなぜ行政手続が必要なのか\n•\t公正\n•\t透明性\n•\t適正手続\n•\t手続的統制と実体的統制\n•\t行政手続法の全体構造\n申請\n•\t申請とは何か\n•\t審査基準\n•\t標準処理期間\n•\t審査\n•\t理由提示\n•\t申請拒否\n•\t不作為\n不利益処分\n•\t不利益処分とは\n•\t処分基準\n•\t理由提示\n•\t聴聞\n•\t弁明の機会\n•\t手続違反\n行政指導\n•\t行政指導とは\n•\t任意性\n•\t行政指導の限界\n•\t方式\n•\t中止等の求め\n•\t実質的強制\n届出・意見公募\n•\t届出\n•\t申請との違い\n•\t届出の効果\n•\t意見公募手続\n•\tパブリックコメント\n•\t意見の取扱い\n情報\n•\t情報公開制度\n•\t行政文書\n•\t開示請求\n•\t不開示情報\n•\t部分開示\n•\t個人情報保護\n•\t保有個人情報\n•\t本人による開示請求等\n•\t公文書管理\n•\t情報公開と個人情報保護の関係\n⸻\n第4編　理解確認\n1.\t行政手続とは何か。\n2.\tなぜ行政に手続的統制が必要なのか。\n3.\t行政手続法は何を目的とする法律か。\n4.\t行政手続法にはどのような制度があるか。\n5.\t申請と届出はどう違うか。\n6.\t審査基準とは何か。\n7.\t標準処理期間とは何か。\n8.\t不利益処分とは何か。\n9.\t聴聞と弁明の機会の付与はどう違うか。\n10.\t理由提示にはどのような意味があるか。\n11.\t行政指導の「任意性」が重要なのはなぜか。\n12.\t行政指導が実質的強制になると何が問題なのか。\n13.\t処分等の求めとは何か。\n14.\t意見公募手続とは何か。\n15.\t意見公募に提出された意見を行政機関は必ず採用しなければならないか。\n16.\t情報公開制度の目的は何か。\n17.\t行政文書とは何か。\n18.\t不開示情報とは何か。\n19.\t部分開示とは何か。\n20.\t情報公開と個人情報保護はどのように調整されるか。\n21.\t現在の公的部門の個人情報保護制度はどの法律を中心としているか。\n22.\t行政機関等が個人情報を取得・利用・提供する際に、なぜ法的規律が必要なのか。\n23.\t公文書管理と情報公開はどうつながるか。\n24.\t行政手続上の違法と行政処分そのものの違法はどう関係するか。\n⸻\n第4編・最終整理\n行政手続・情報を一つにつなげると、\n行政が決定する\n↓\n適正な手続が必要\n↓\n申請\n↓\n審査基準・標準処理期間\n↓\n処分\n↓\n不利益処分なら\n聴聞・弁明\n↓\n行政指導なら\n任意性を保障\n↓\n命令等なら\n意見公募\n↓\n行政活動に関する情報\n↓\n情報公開\n＋\n個人情報保護\n↓\n行政の透明性・公正性\n＋\n国民の権利利益の保護\n↓\n違法・不当なら\n行政救済\nとなる。\n⸻\n第4編の一文要約\n行政手続・情報法制は、行政がどのような過程で意思決定を行うかを法によって規律し、その過程の公正・透明性を確保するとともに、行政情報の公開と個人情報の保護を通じて、行政に対する民主的・法的統制と国民の権利利益を保障する仕組みである。","blanks":["情報公開","個人情報保護","行政文書","プライバシー"],"options":[["情報公開","比例原則","行政主体","行政機関"],["個人情報保護","地方公共団体","内閣総理大臣","公権力の行使"],["行政文書","比例原則","行政主体","行政機関"],["プライバシー","地方公共団体","内閣総理大臣","公権力の行使"]],"mode":"administrative"}},"5":{"1":{"text":"1　行政の実効性確保とは何か\n行政活動には、単に「行政庁が決定する」だけでは終わらないものが多い。\n例えば、\n「違法建築物を除却しなさい」\nという命令が出されたとする。\n行政庁が命令を出す ↓ 相手が従う ↓ 行政目的が実現\nなら問題はない。\nしかし、\n行政庁が命令を出す ↓ 相手が従わない ↓ 行政目的が実現しない\nということがある。\nそこで、\n相手が任意に従わない場合に、行政目的を実現するための仕組み\nが必要になる。\n⸻\n2　行政上の義務とは\n行政上の義務とは、法律や行政行為などによって私人等に課される公法上の義務をいう。\n例えば、\n•\t税金を納付する義務\n•\t建築物を除却する義務\n•\t許可条件を遵守する義務\n•\t法律上必要な措置をとる義務\nなどがある。\nただし、\n「行政上の義務がある」 ↓ 「すぐ行政が強制できる」\nとは限らない。\n強制手段は、法律上の根拠や要件に従って行われなければならない。\n⸻\n3　行政上の実効性確保の全体像\n行政上の実効性確保は、大きく次のように整理できる。\n手段\t基本的な意味\n行政上の強制執行\t義務を実力によって履行させる\n行政代執行\t本人の代わりに行政等が行う\n直接強制\t行政が直接実力を加えて義務内容を実現\n執行罰\t金銭的不利益を与えて履行を促す\n強制徴収\t金銭給付義務を強制的に徴収\n即時強制\t義務を命じる時間を待たずに実力行使\n行政罰\t違反行為に対して制裁を科す\nここで特に重要なのが、\n強制と制裁は違う\nということである。\n⸻\n4　「強制」と「制裁」を区別する\n例えば、税金を払わない人から財産を差し押さえる。\nこれは、\n「税金を払わなかったから罰する」\nことが目的ではない。\n目的は、\n未納の税金を徴収すること\nである。\n一方、法律違反をした者に罰金を科す場合は、\n違反行為に対する制裁\nである。\nしたがって、\n強制\n「義務を履行させる」\n制裁\n「違反に対して不利益を科す」\nという違いがある。\n⸻\n5　全体像\n行政上の義務\n↓\n相手が履行\n↓\n行政目的達成\n相手が履行しない場合、\n行政上の義務\n↓\n不履行\n↓\n┌───────────────┐\n│ 行政上の強制執行       │\n│ ・代執行               │\n│ ・直接強制             │\n│ ・執行罰               │\n│ ・強制徴収             │\n└───────────────┘\n↓\n義務の履行・行政目的実現\nさらに、\n違反行為\n↓\n行政上の制裁\n↓\n行政罰など\nとなる。\n⸻\n6　実効性確保の基本原則\n行政が強制力を持っているからといって、自由に実力行使できるわけではない。\n基本的には、\n法律の根拠\n＋\n法定の要件\n＋\n必要性・相当性\n＋\n適正な手続\nが問題となる。\n特に重要なのが、\n法律による行政\nとの関係である。\n行政が私人の権利・自由に直接介入する以上、強制手段についても法的根拠が必要になる。\n⸻\n【核心】\n行政の実効性確保を理解するときは、\n「何のための力なのか」\nを常に考える。\n•\t義務を履行させるため → 強制\n•\t緊急に危険を排除するため → 即時強制\n•\t違反に制裁を加えるため → 行政罰\nこの3つを混同しないことが重要である。\n⸻","blanks":["行政の実効性確保","行政上の義務","行政上の強制執行","行政罰"],"options":[["行政の実効性確保","行政上の事実行為","狭義の訴えの利益","行政法全体の体系"],["行政上の義務","地方公共団体","内閣総理大臣","公権力の行使"],["行政上の強制執行","行政上の事実行為","狭義の訴えの利益","行政法全体の体系"],["行政罰","行政法","行政庁","法人格"]],"mode":"administrative"},"2":{"text":"1　行政上の強制執行とは\n行政上の強制執行とは、\n行政上の義務を義務者が履行しない場合に、行政権が自力でその履行を確保する制度\nである。\nここでは「義務がすでに存在している」ことが重要。\nつまり、\n義務発生\n↓\n義務不履行\n↓\n強制執行\nという流れになる。\n⸻\n2　行政上の強制執行の種類\n伝統的には、次の4つに整理する。\n① 代執行\n本人に代わって行政等が義務を実現する。\n② 直接強制\n行政が直接実力を行使して義務内容を実現する。\n③ 執行罰\n義務を履行しない者に金銭的不利益を課し、履行を促す。\n④ 強制徴収\n金銭給付義務について、財産を差し押さえるなどして徴収する。\n⸻\n3　義務の種類によって手段が変わる\nここが非常に重要。\n例えば、\n建物を壊せ\n→ 代替可能な作為義務\n100万円を払え\n→ 金銭給付義務\n営業停止命令に従え\n→ 不作為義務\nというように、義務の性質が違う。\nそのため、\nどの義務を履行させようとしているのか\nから手段を考える。\n⸻\n4　義務の性質と強制手段\n義務\t代表的な手段\n代替的作為義務\t代執行\n非代替的作為義務\t直接強制・執行罰等\n不作為義務\t直接強制・執行罰等\n金銭給付義務\t強制徴収\nただし、実際には個別法によって制度が設けられているため、\n「この義務だから必ずこの手段」\nと機械的に決めるのではなく、個別法の根拠と制度設計を確認する。\n⸻\n5　行政上の強制執行と民事執行\n行政上の強制執行と、民事上の強制執行は似ているが異なる。\n民事\n私人A ↓ 私人Bに金銭を払え ↓ 払わない ↓ 裁判所による強制執行\n行政\n行政庁 ↓ 私人に行政上の義務 ↓ 履行しない ↓ 法律に基づく行政上の強制執行\nつまり、\n誰のどのような権利・義務を実現するための制度なのか\nが違う。\n⸻\n6　強制執行と行政処分\n行政処分そのものと、その処分を実現するための強制手段も区別する。\n例えば、\n「建物を除却せよ」\n↓\n行政上の義務を発生させる\n↓\n義務者が従わない\n↓\n代執行\n↓\n建物を実際に除却\nここで、\n除却命令\nと\n代執行\nは同じものではない。\n命令＝義務を発生・確定させる作用\n代執行＝その義務を現実に履行させる作用\nである。\n⸻\n【核心】\n行政法では、\n「義務を発生させる段階」\nと\n「義務を実現する段階」\nを区別する。\n⸻","blanks":["行政上の強制執行","代執行","直接強制","執行罰"],"options":[["行政上の強制執行","行政上の事実行為","行政の実効性確保","狭義の訴えの利益"],["代執行","行政法","行政庁","法人格"],["直接強制","比例原則","行政主体","行政機関"],["執行罰","行政法","行政庁","法人格"]],"mode":"administrative"},"3":{"text":"1　行政代執行とは\n行政代執行とは、\n義務者が自分で行うべき行為を、行政庁自身または第三者が代わりに行い、その費用を義務者から徴収する制度\nである。\n行政代執行法2条は、法律または法律に基づく行政庁の命令による行為であって、他人が代わってできる行為について、不履行があり、他の手段による履行確保が困難で、不履行を放置することが著しく公益に反するときに代執行を認めている。(e-Gov 法令検索)\n⸻\n2　典型例\n例えば違法建築物について、\n「この建物を除却しなさい」\nという命令が出されたとする。\nしかし義務者が、\n「壊しません」\nと拒否した。\nそこで行政が、\n除却命令\n↓\n義務者が不履行\n↓\n行政代執行\n↓\n行政または第三者が建物を除却\n↓\n必要な費用を義務者から徴収\nという流れをとる。\n⸻\n3　代執行の対象\n代執行の重要な条件は、\n他人が代わってすることのできる行為\nである。\nこれを、\n代替的作為義務\nという。\n例えば、\n•\t建物の除却\n•\t工作物の撤去\n•\t土砂等の除去\n•\t原状回復\nなど。\n⸻\n4　代替的作為義務とは\n「本人でなければできない行為」ではなく、\n第三者が代わって行っても義務の内容を実現できる行為\nである。\n例えば、\n「違法に設置した看板を撤去せよ」\nなら、\n本人が撤去してもよいし、\n業者が撤去してもよい。\nしたがって代執行に適する。\n⸻\n5　代執行の要件\n行政代執行法2条から整理すると、重要なのは次の条件。\n① 法律または法律に基づく命令による義務である\n単なるお願いでは足りない。\n② 代替的作為義務である\n他人が代わってできる行為であること。\n③ 義務者が履行しない\n義務があるだけでは足りない。\n④ 他の手段による履行確保が困難\n他に有効な方法がある場合には問題になる。\n⑤ 不履行を放置することが著しく公益に反する\n単なる行政上の都合だけでは足りない。\n⸻\n6　代執行の手続\n原則的には、\n義務発生\n↓\n履行期限\n↓\n戒告\n↓\n義務者がなお履行しない\n↓\n代執行令書\n↓\n代執行\n↓\n費用徴収\nという流れになる。\n行政代執行法3条は、原則として相当の履行期限を定め、代執行をする旨を事前に文書で戒告することを要求している。その後も履行しない場合には、代執行令書によって時期・執行責任者・費用概算を通知する。緊急の場合にはこの手続を経ずに代執行できる。(e-Gov 法令検索)\n⸻\n7　戒告\n戒告とは、\n期限までに履行しなければ代執行をする\nことを事前に知らせる手続である。\n「○月○日までに撤去してください」\n↓\n「履行しない場合は代執行します」\nという段階。\nこれは義務者に最後の履行機会を与える意味を持つ。\n⸻\n8　代執行令書\n戒告後も履行しない場合、\n代執行令書\nによって、\n•\t代執行をする時期\n•\t執行責任者\n•\t費用の概算\nなどを通知する。\nただし、\n非常の場合・危険切迫の場合\nには、戒告・代執行令書の手続を省略できる場合がある。(e-Gov 法令検索)\n⸻\n9　費用徴収\n代執行をしたからといって、行政が費用を負担して終わりではない。\n原則として、\n代執行に要した費用は義務者から徴収する。\n行政代執行法5条は費用額・納期等を定めて文書で納付を命じることを定め、6条はその費用を国税滞納処分の例によって徴収できるとしている。(e-Gov 法令検索)\n⸻\n10　代執行と「罰」は違う\nここは非常に重要。\n違法建築物を代執行で撤去する場合、\n「違反したから罰として建物を壊す」\nのではない。\n目的は、\n本来義務者が行うべき除却を実現すること\nである。\nしたがって代執行は、\n行政上の強制執行\nであり、\n行政罰\nではない。\n⸻\n11　代執行の限界\n代執行は行政に強い権限を与える。\nそのため、\n•\t本当に義務が存在するのか\n•\t義務の内容は何か\n•\t代執行の要件を満たすか\n•\t手続が適正か\n•\t必要以上の実力行使になっていないか\nなどが問題になる。\n⸻\n【核心】\n代執行は、\n「本人に代わって実現できる義務」\nが基本。\nそして、\n義務そのものを発生させる制度ではなく、既に存在する義務を現実化する制度\nである。\n⸻","blanks":["行政代執行","代替的作為義務","戒告","代執行令書"],"options":[["行政代執行","法律の優位","法律の留保","行政組織法"],["代替的作為義務","将来の行政活動","行政指導の限界","行政不服審査法"],["戒告","行政","立法","司法"],["代執行令書","法律の優位","法律の留保","行政組織法"]],"mode":"administrative"},"4":{"text":"1　直接強制\n直接強制とは、\n義務者が義務を履行しない場合に、行政庁が直接実力を行使して義務内容を実現する方法\nである。\n代執行との違いは、\n代執行\n本人に代わって行う。\n直接強制\n本人に対して直接実力を加えて実現する。\n⸻\n2　イメージ\n代執行\n「建物を撤去せよ」\n↓\n本人が撤去しない\n↓\n行政・業者が撤去\n直接強制\n「この場所から退去せよ」\n↓\n本人が退去しない\n↓\n行政が直接実力を行使\n↓\n退去させる\n⸻\n3　直接強制は強力な手段\n直接強制は、私人の身体・財産などに直接実力を加えることがあり得る。\nしたがって、\n法律上の根拠\nが特に重要になる。\n一般行政法上、\n「行政だから必要なら何でも直接強制できる」\nわけではない。\n個別法によって直接強制の制度が設けられている場合など、その法的根拠を確認する必要がある。\n⸻\n4　執行罰\n執行罰とは、\n義務を履行しない者に対して、一定の金銭的不利益を予告することによって、将来の義務履行を促す制度\nである。\n重要なのは、\n過去の違反を罰することが本質ではない\nということ。\n目的は、\n「今から義務を履行してください」\nと圧力をかけることである。\n⸻\n5　行政罰との違い\nここは必ず区別する。\n執行罰\t行政罰\n目的\t義務履行\t違反への制裁\n時間的方向\t将来の履行を促す\t過去の違反を対象\n性質\t強制執行\t制裁\n目的達成\t義務を履行すれば意味がある\t違反への責任追及\n例えば、\n「明日までに違法状態を是正しなければ、一定額の金銭的不利益を課す」\nという仕組みは、将来の履行を促す点で執行罰的である。\n⸻\n6　執行罰と刑罰も違う\n執行罰は、\n義務を履行させる\nためのもの。\n刑罰は、\n犯罪に対する国家の制裁\nである。\nしたがって、\n執行罰\n＝ 強制執行\n行政罰\n＝ 行政上の制裁\n刑罰\n＝ 刑事法上の制裁\nと整理する。\n⸻\n7　強制徴収\n強制徴収とは、\n金銭給付義務について、義務者が任意に支払わない場合に、行政庁が財産を差し押さえるなどして強制的に徴収する制度\nである。\n典型例は、\n税金\nである。\n⸻\n8　金銭給付義務\n例えば、\n税金100万円を納付してください。\nという義務がある。\nそれを払わない場合、\n納税義務\n↓\n納期限経過\n↓\n督促等\n↓\n滞納\n↓\n財産差押え\n↓\n換価\n↓\n徴収\nという仕組みがある。\n国税については国税徴収法が滞納処分の制度を定めており、差押え・換価・配当などの仕組みが整備されている。(e-Gov 法令検索)\n⸻\n9　滞納処分\n滞納処分とは、\n公法上の金銭給付義務を強制的に徴収するための行政上の手続\nである。\n典型的には、\n① 差押え\n財産を処分できない状態にする。\n↓\n② 換価\n差し押さえた財産を金銭化する。\n↓\n③ 配当\nその金銭から税等を徴収する。\nという流れになる。\n⸻\n10　差押え\n差押えは、\n滞納者の財産を確保し、その処分・換価を通じて債務の履行を実現するための措置\nである。\n国税徴収法47条は、一定の要件を満たす滞納について、徴収職員が財産を差し押さえる仕組みを定めている。(e-Gov 法令検索)\n⸻\n11　換価\n差し押さえた財産をそのまま行政が所有するわけではない。\n通常は、\n差押え\n↓\n換価\n↓\n金銭化\n↓\n徴収・配当\nという流れになる。\n⸻\n12　交付要求\nすでに他の強制換価手続が行われている場合、行政がその手続に参加して、税の配当を求めることがある。\nこれが、\n交付要求\nである。\n国税徴収法82条は、滞納者の財産について強制換価手続が行われた場合に、税務署長がその手続に対して滞納国税の交付を求める制度を定めている。(e-Gov 法令検索)\n⸻\n13　強制徴収の全体像\n金銭給付義務\n↓\n任意に支払わない\n↓\n滞納\n↓\n督促等\n↓\n差押え\n↓\n換価\n↓\n配当・徴収\n⸻\n【核心】\n強制徴収は、\n金銭を払わせるための強制執行\nである。\n行政罰のように、\n「払わなかったから罰する」\nことが目的ではない。\n⸻","blanks":["直接強制","執行罰","強制徴収","金銭給付義務"],"options":[["直接強制","比例原則","行政主体","行政機関"],["執行罰","行政法","行政庁","法人格"],["強制徴収","比例原則","行政主体","行政機関"],["金銭給付義務","地方公共団体","内閣総理大臣","公権力の行使"]],"mode":"administrative"},"5":{"text":"1　即時強制とは\n即時強制とは、\n行政上の義務をあらかじめ命じ、その不履行を待つことなく、行政が直接実力を行使して行政目的を実現する制度\nである。\nここが強制執行との最大の違い。\n⸻\n2　強制執行との比較\n強制執行\n義務\n↓\n不履行\n↓\n強制\n即時強制\n危険・行政目的\n↓\n直ちに実力行使\nつまり、\n「まず義務を命じて、それでも従わなければ強制する」\nのが強制執行。\nこれに対して、\n「義務不履行を待っている時間がないので、直ちに実力行使する」\nのが即時強制。\n⸻\n3　なぜ即時強制が必要なのか\n行政には、\n「後から命令すればいい」\nでは間に合わない場面がある。\n例えば、\n•\t人命に危険が迫っている\n•\t危険物が放置されている\n•\t感染症等の危険を緊急に排除する必要がある\n•\t放置すれば重大な事故が発生する\nなど。\nこのような場合、\n命令\n↓\n履行期限\n↓\n不履行\n↓\n強制\nとしていたら危険が現実化してしまう。\nそこで、\n危険発生\n↓\n直ちに実力行使\n↓\n危険排除\nという制度が必要になる。\n⸻\n4　即時強制と行政上の強制執行\n強制執行\t即時強制\n義務\t既に義務が存在\t義務履行を待たない\n不履行\t原則として必要\t原則として不履行を前提としない\n目的\t義務の履行\t危険排除・行政目的実現\n時間\t一定の手続を経る\t緊急性を重視\n実力行使\t義務履行のため\t直接行政目的のため\n⸻\n5　即時強制の典型的イメージ\n例えば、\n道路上に重大な危険を生じさせる物が放置されている。\nこの場合、\n「撤去してください」\n↓\n「明日までにしてください」\n↓\n「従わない」\n↓\n「強制します」\nとしていたら危険である。\nそこで法律上の要件を満たす場合、\n直ちに撤去する\nことが認められる。\n⸻\n6　即時強制と強制執行を混同しない\n最も重要な区別。\n強制執行\n義務を履行させるための強制\n即時強制\n義務履行を待たず、直接行政目的を実現するための強制\nである。\n⸻\n7　即時強制にも法律の根拠が必要\n即時強制は、私人の身体・財産などに直接介入する可能性がある。\nそのため、\n行政庁だから自由に即時強制できる\nわけではない。\n法律による行政の原理から、\nどのような場合に、どのような範囲で実力行使できるのか\nについて法的根拠が必要となる。\n⸻\n8　即時強制の限界\n即時強制は強力だからこそ、\n•\t本当に緊急性があるか\n•\t法律上の要件を満たしているか\n•\t目的達成に必要な範囲か\n•\t過剰な実力行使になっていないか\n•\t人権への侵害が必要最小限か\nなどが問題になる。\n⸻\n【核心】\n即時強制を一言でいうと、\n「義務不履行を待っていたら間に合わない場合の行政上の直接的実力行使」\nである。\n⸻","blanks":["即時強制","義務","危険","直接実力"],"options":[["即時強制","比例原則","行政主体","行政機関"],["義務","行政","立法","司法"],["危険","行政","立法","司法"],["直接実力","比例原則","行政主体","行政機関"]],"mode":"administrative"},"6":{"text":"1　行政罰とは\n行政罰とは、\n行政上の義務違反などに対して科される制裁\nである。\n行政上の強制執行と違い、\n将来の義務履行を直接実現すること\nではなく、\n違反行為に対する制裁\nが基本となる。\n⸻\n2　行政罰の目的\n行政罰には、\n•\t違反に対する制裁\n•\t将来の違反抑止\n•\t行政上の秩序維持\n•\t法令遵守の確保\nなどの機能がある。\nただし、\n「行政罰を科すこと」\nと\n「強制的に義務を履行させること」\nは区別する。\n⸻\n3　行政罰の種類\n行政罰は大きく、\n① 行政刑罰\n刑罰として科されるもの。\n② 行政上の秩序罰\n行政上の秩序違反に対する過料など。\nに分けて考える。\n⸻\n4　行政刑罰\n行政法上の義務違反に対して、\n刑法上の刑罰と同様に、刑罰として制裁を科す\nもの。\n例えば法律が、\n「○○に違反した者は、○年以下の拘禁刑または○万円以下の罰金に処する」\nなどと定める場合。\n行政法上の規制違反であっても、\n刑罰\nとして扱われる。\n⸻\n5　行政上の秩序罰\n行政上の義務違反・手続違反などに対して、\n過料\nを科す場合がある。\nこれは行政上の秩序維持を目的とする制裁である。\n⸻\n6　刑罰との関係\n行政刑罰は「行政法上の違反」に対する制裁であっても、\n刑罰である以上、刑事法上の原則が関係する。\n例えば、\n•\t法律主義\n•\t責任主義\n•\t適正手続\n•\t刑事手続\nなどが問題になる。\n⸻\n7　行政罰と行政上の強制執行\nここは第5編最大の重要ポイントの一つ。\n例えば、\n「建物を除却しなさい」\nという義務がある。\n強制執行\n本人が除却しない ↓ 行政代執行 ↓ 行政が建物を除却\n目的：\n義務を実現する\n⸻\n行政罰\n本人が法律違反をした ↓ 行政刑罰・過料など ↓ 制裁\n目的：\n違反行為に対する制裁\n⸻\n8　両方が問題になることもある\n同じ違反について、\n強制執行\nと\n行政罰\nがそれぞれ問題になることがある。\nなぜなら、\n「違反を処罰すること」\nと\n「違反状態を是正すること」\nは別の目的だからである。\n例えば、\n違法状態\n↓\n行政罰\n＝違反に対する制裁\nと同時に、\n違法状態\n↓\n行政代執行\n＝違法状態の除去\nということがあり得る。\n⸻\n9　行政罰と執行罰\n名称が似ているため注意する。\n執行罰\t行政罰\n分類\t強制執行\t制裁\n目的\t義務履行\t違反への制裁\n基本的対象\t将来の義務履行\t過去の違反\n性質\t強制手段\t罰・制裁\n典型的イメージ\t「履行しなければ金銭的不利益」\t「違反したから過料等」\n⸻\n10　行政罰と代執行\nこれも比較する。\n代執行\t行政罰\n目的\t義務を実現\t違反を制裁\n行為\t行政が代わって行う\t罰・過料等を科す\n対象\t既存の義務\t違反行為\n例\t建物を撤去\t違反者に刑罰・過料\n⸻\n11　行政上の制裁を広く考える\n行政法では「制裁」という言葉が広く使われることがある。\n例えば、\n•\t行政刑罰\n•\t過料\n•\t許可取消し\n•\t営業停止\n•\t課徴金等\nなど。\nただし、これらはすべて同じ法的性質ではない。\nしたがって、\n「不利益だから全部行政罰」\nと考えてはいけない。\n⸻\n12　行政処分による不利益と行政罰\n例えば、\n営業許可を取り消す\nことがある。\nこれは違反に対する不利益だから「罰」のように見える。\nしかし、法律上の制度としては、\n行政上の規制・許可制度を維持するための行政処分\nとして構成されることがある。\nしたがって、\n不利益処分＝行政罰\nではない。\n⸻\n13　行政罰を理解するための視点\n行政法上の不利益を見たら、\n次の順番で考える。\n① 何を根拠としている？\n↓\n② 誰に対して？\n↓\n③ 何を理由として？\n↓\n④ 何の目的で？\n↓\n⑤ 法的性質は？\n例えば、\n営業許可取消し\nなら、\n「違反したから罰」\nと即断せず、\n許可制度を維持するための行政処分なのか？\nを考える。\n⸻\n第5編　統合整理\nここまでの内容を一本につなげる。\n⸻\n1　行政の実効性確保の全体マップ\n行政目的\n↓\n行政活動\n↓\n法律・条例・行政行為等\n↓\n行政上の義務\n↓\n──────────────────\n│\n├─ 相手が履行\n│      ↓\n│   行政目的達成\n│\n└─ 相手が不履行\n↓\n実効性確保\n↓\n┌────────────────┐\n│ 強制執行         │\n│                  │\n│ ・代執行         │\n│ ・直接強制       │\n│ ・執行罰         │\n│ ・強制徴収       │\n└────────────────┘\n別ルート\n違反行為\n↓\n行政上の制裁\n↓\n行政罰等\n緊急の場合\n↓\n即時強制\n↓\n直ちに行政目的を実現\n⸻\n2　最重要比較表\n制度\t何をする？\t目的\n代執行\t行政等が代わりに行う\t義務履行\n直接強制\t直接実力を行使\t義務履行\n執行罰\t金銭的不利益で促す\t義務履行\n強制徴収\t財産を差し押さえる等\t金銭義務履行\n即時強制\t義務不履行を待たず実力行使\t緊急の行政目的\n行政罰\t罰・過料等を科す\t違反への制裁\n⸻\n3　「いつ」強制するのか\nこれも重要。\n通常の強制執行\n義務\n↓\n不履行\n↓\n強制\n即時強制\n危険・緊急性\n↓\n直ちに実力行使\n行政罰\n違反\n↓\n制裁\n⸻\n4　「何を実現するのか」で分類する\n義務を実現したい\n→ 強制執行\n金銭を回収したい\n→ 強制徴収\n危険を直ちに排除したい\n→ 即時強制\n違反を制裁したい\n→ 行政罰\n⸻\n5　「代執行」と「直接強制」の違い\nここは特に重要。\n代執行\n本人がやるべき行為\n↓\n本人がやらない\n↓\n行政・第三者が代わりにやる\n直接強制\n本人がやるべきこと\n↓\n本人がやらない\n↓\n行政が本人に直接実力を加える\n⸻\n6　「強制執行」と「即時強制」の違い\n強制執行\n＝ 義務が先\n不履行が後\n強制がさらに後\n一方、\n即時強制\n＝ 緊急の行政目的\n↓\n直ちに実力行使\n⸻\n7　「強制」と「制裁」の違い\nこれも第5編全体の中心。\n強制\n＝ 「従わせる」\n制裁\n＝ 「違反に不利益を与える」\n例えば、\n「建物を壊せ」\nという義務について、\n行政が建物を壊す → 代執行\n違反者に罰を科す → 行政罰\nである。\n⸻\n8　行政の実効性確保と法律による行政\n行政の実効性確保は、\n行政法の中でも特に公権力性が強く現れる分野\nである。\n行政が私人の財産を、\n•\t差し押さえる\n•\t壊す\n•\t撤去する\n•\t移動させる\n•\t直接実力を行使する\nことがあり得るからである。\nしたがって、\n行政目的\n↓\n実効性確保\n↓\n強制力\n↓\n私人の権利・自由への介入\n↓\n法律の根拠・法定要件\n↓\n必要性・相当性\n↓\n適正な行政\nという構造を理解する。\n⸻\n9　第3編とのつながり\n第3編では、\n行政行為・行政指導・行政契約など\nを学んだ。\n第5編では、その先を見る。\n例えば、\n行政庁\n↓\n「建物を除却せよ」\n↓\n行政行為\n↓\n義務発生\n↓\n義務者が従わない\n↓\n行政代執行\n↓\n現実に建物を除却\nつまり、\n行政作用の形式\nと\n実効性確保\nはつながっている。\n⸻\n10　第4編とのつながり\n第4編では行政手続を学んだ。\n行政が不利益な処分をする場合、\n行政手続\n↓\n理由提示・聴聞等\n↓\n適法な処分\n↓\n義務発生\n↓\n不履行\n↓\n強制執行\nという流れがあり得る。\nしたがって、\n行政手続と行政上の強制は別分野ではあるが、一連の行政過程としてつながっている。\n⸻\n11　第6編とのつながり\nそして行政が強制手段を行った場合、\n「その強制は適法だったのか？」\nという問題が発生する。\n例えば、\n•\t代執行の要件を満たしていたか\n•\t法律上の根拠があったか\n•\t手続に問題はなかったか\n•\t裁量権を逸脱していないか\n•\t過剰な実力行使ではないか\nなど。\nそこで、\n行政救済法\nにつながっていく。\n⸻\n第5編　実務的な分析方法\n行政の実効性確保に関する事件を見たら、次の順番で考える。\nSTEP 1　何の義務か？\n作為？\n不作為？\n金銭給付？\n⸻\nSTEP 2　義務の根拠は何か？\n法律？\n条例？\n行政行為？\nその他？\n⸻\nSTEP 3　義務は既に発生しているか？\n強制執行なのか、それとも即時強制なのかを区別する。\n⸻\nSTEP 4　本人は履行していないか？\n義務あり\n↓\n履行済み？\n↓\n不履行？\n⸻\nSTEP 5　どの制度を使うのか？\n代替的作為\n→ 代執行\n直接実力行使が必要\n→ 直接強制\n将来の履行を金銭的不利益で促す\n→ 執行罰\n金銭給付義務\n→ 強制徴収\n緊急\n→ 即時強制\n違反への制裁\n→ 行政罰\n⸻\nSTEP 6　法律上の要件を満たすか？\n制度ごとの要件を見る。\n⸻\nSTEP 7　手続は適法か？\n特に代執行などでは、\n戒告\n↓\n代執行令書\n↓\n代執行\nなどの手続を確認する。\n⸻\nSTEP 8　実力行使の程度は適切か？\n最後に、\n必要な範囲を超えていないか\nを見る。\n⸻\n第5編　具体例で統合する\n事例1　違法建築物\nAが違法建築物を建てた。\n行政庁 ↓ 除却命令 ↓ Aが従わない ↓ 代替的作為義務 ↓ 行政代執行の要件を検討 ↓ 代執行 ↓ 建物除却 ↓ 費用徴収\n⸻\n事例2　税金を払わない\nAに納税義務がある。\n納税義務\n↓\n納付しない\n↓\n滞納\n↓\n督促等\n↓\n財産差押え\n↓\n換価\n↓\n徴収\nこれは、\n強制徴収\nである。\n⸻\n事例3　緊急の危険\n危険な物が道路上にあり、直ちに事故が発生する危険がある。\n危険\n↓\n命令を待っている時間がない\n↓\n法律上の根拠・要件\n↓\n即時強制\n↓\n危険排除\nこれは通常の強制執行とは異なる。\n⸻\n事例4　違反者に罰\n法律違反をした者について、\n「○万円以下の罰金」\nという刑罰規定がある。\nこれは、\n行政刑罰\nとして理解する。\n違反状態そのものを強制的に除去する制度とは区別する。\n⸻\n第5編　自己確認問題\n問1\n行政上の強制執行とは何か？\n答え\n行政上の義務が履行されない場合に、行政権が自力でその履行を確保する制度。\n⸻\n問2\n代執行の典型的対象は？\n答え\n他人が代わってすることのできる作為義務、つまり代替的作為義務。\n⸻\n問3\n代執行と直接強制の違いは？\n答え\n代執行は本人に代わって行政等が義務内容を実現するのに対し、直接強制は行政が直接実力を行使して義務内容を実現する。\n⸻\n問4\n強制徴収とは？\n答え\n金銭給付義務について、任意の履行がない場合に財産の差押え等によって強制的に徴収する制度。\n⸻\n問5\n即時強制と強制執行の最大の違いは？\n答え\n強制執行は原則として既存の義務の不履行を前提とするのに対し、即時強制は義務の履行を待たずに直接実力を行使して行政目的を実現する点。\n⸻\n問6\n執行罰と行政罰の違いは？\n答え\n執行罰は義務履行を促すための強制執行手段であり、行政罰は違反行為に対する制裁である。\n⸻\n問7\n行政罰を科せば、必ず違反状態がなくなるか？\n答え\nならない。\n行政罰は制裁であって、違反状態の除去そのものを目的とする制度ではないからである。\n⸻\n問8\n代執行は「罰」なのか？\n答え\n原則として違う。\n代執行は行政上の義務を実現するための強制執行である。\n⸻\n第5編　最重要事項\n第5編で絶対に押さえるべきなのは、次の6点。\n① 行政の実効性確保とは\n行政上の義務や行政目的を現実に実現するための仕組み。\n② 強制執行\n義務を履行させる。\n③ 即時強制\n義務不履行を待つことなく、直ちに行政目的を実現する。\n④ 行政罰\n違反行為に制裁を加える。\n⑤ 代執行\n他人が代わってできる作為義務を、行政等が代わりに実現する。\n⑥ 強制徴収\n金銭給付義務を財産差押え等によって強制的に実現する。\n⸻\n第5編　最終整理\n最後に一本の図にすると、\n行政目的\n↓\n行政上の義務\n↓\n┌───────┴───────┐\n↓　　　　　　　　　　　　↓\n履行　　　　　　　　　　　不履行\n↓　　　　　　　　　　　　↓\n目的達成　　　　　　　実効性確保\n↓\n┌──────────────┐\n│　　　　　　　　　　　│\n強制執行　　　　　　　　即時強制\n│\n┌─────┼─────┬─────┐\n↓　　　　　↓　　　　　↓　　　　　↓\n代執行　　直接強制　　執行罰　　強制徴収\n│　　　　　│　　　　　│　　　　　│\n代わりに　直接実力　金銭的不利益　財産差押え等\n行う　　　を行使　　で履行促進　　で徴収\n別のルート\n↓\n違反\n↓\n行政上の制裁\n↓\n行政罰\n⸻\n第5編を理解するための最終キーワード\n実効性確保\n↓\n義務履行確保\n↓\n強制執行\n↓\n代執行・直接強制・執行罰・強制徴収\n↓\n即時強制\n↓\n行政罰\nそして、これらすべてに共通する根本原理が、\n法律による行政\n必要性・相当性\n適正な手続\n権利・自由との調整\nである。\nこの視点を持つと、第5編は単なる「強制手段の暗記」ではなく、\n行政が持つ公権力を、どのような条件で、どのような方法によって現実に行使できるのか\nを学ぶ分野として理解できる。\nそして次の第6編では、その強制を含む行政活動について、\n「その行政は違法ではないか」\n「違法なら、私人はどう争えるか」\nという問題に進む。\nこれが、\n行政法総論 → 行政作用 → 行政手続 → 実効性確保 → 行政救済\nという行政法全体の流れにつながる。","blanks":["行政罰","行政上の強制執行","秩序罰","刑罰"],"options":[["行政罰","行政法","行政庁","法人格"],["行政上の強制執行","行政上の事実行為","行政の実効性確保","狭義の訴えの利益"],["秩序罰","行政法","行政庁","法人格"],["刑罰","行政","立法","司法"]],"mode":"administrative"}},"6":{"1":{"text":"1　行政救済とは何か\n行政救済とは、\n行政活動によって権利利益を侵害された、または侵害されるおそれのある者を救済するための法制度\nをいう。\nただし、「行政に不満がある」というだけで、どの制度でも使えるわけではない。\nまず、\n何が起きたのか\nを把握する必要がある。\n⸻\n2　行政救済を考える基本構造\n例えば、\nAに営業許可が必要だったとする。\nA ↓ 営業許可申請 ↓ 行政庁が不許可 ↓ Aが不服\nここから、\n行政庁の判断を変えてほしい\n↓\n行政不服審査\n裁判所に判断してほしい\n↓\n行政事件訴訟\n行政活動によって損害が発生した\n↓\n国家賠償\n適法な行政活動によって\n特別な犠牲を受けた\n↓\n損失補償\nというように分かれる。\n⸻\n3　行政救済の大きな分類\n行政救済は、大きく次のように整理できる。\n分野\t目的\t代表的制度\n行政上の不服申立て\t行政庁に再検討させる\t審査請求\n行政事件訴訟\t裁判所による司法的救済\t取消訴訟等\n国家賠償\t違法な行政活動による損害を金銭的に賠償\t国家賠償法\n損失補償\t適法な公権力行使による特別の犠牲を補償\t憲法29条3項等\n⸻\n4　「違法」と「不当」\n行政救済を理解するうえで非常に重要なのが、\n違法\nと\n不当\nの区別である。\n違法\n法律に反している。\n不当\n法律違反とはいえなくても、行政の判断として妥当ではない。\n行政不服審査では、違法性だけでなく不当性も審査対象になり得る。\n一方、行政事件訴訟は基本的に、\n裁判所による法律上のコントロール\nである。\nしたがって、\n「行政庁としてはもっと別の判断をすべきだった」\nという問題と、\n「行政庁の判断は法律に反している」\nという問題を区別する。\n⸻\n5　行政救済の選択\n行政事件を見たら、まず、\n① 行政活動に何があった？\n↓\n② 何を求めたい？\n↓\n③ 違法？不当？\n↓\n④ 損害が発生？\n↓\n⑤ どの救済制度が適切？\nと考える。\n⸻\n6　行政救済の目的は一つではない\n例えば、\n「営業停止処分を取り消してほしい」\nなら、\n処分をなくしたい\nのである。\n一方、\n「違法な営業停止処分によって100万円の損害を受けた」\nなら、\n損害を賠償してほしい\nのである。\nさらに、\n「まだ処分されていないが、処分されると重大な損害が出る」\nなら、\n将来の行政活動を止めたい\nという救済が問題になる。\n⸻\n7　行政救済の基本マップ\n行政活動\n↓\n権利・利益への影響\n↓\n┌──────────────┐\n│ 何を求める？         │\n└──────────────┘\n↓\n────────────────────\n│\n├─ 行政庁に再検討させたい\n│       ↓\n│   行政不服審査\n│\n├─ 裁判所に行政を審査させたい\n│       ↓\n│   行政事件訴訟\n│\n├─ 損害を金銭で賠償してほしい\n│       ↓\n│   国家賠償\n│\n└─ 適法な公権力行使による\n特別な犠牲を補償してほしい\n↓\n損失補償\n⸻\n【核心】\n行政救済を考えるとき、\n「行政が悪い」\nから始めてはいけない。\nまず、\n「何を回復したいのか」\nを考える。\nこれが専門的な行政法分析の出発点になる。\n⸻","blanks":["行政救済","行政不服審査","行政事件訴訟","国家賠償"],"options":[["行政救済","比例原則","行政主体","行政機関"],["行政不服審査","地方公共団体","内閣総理大臣","公権力の行使"],["行政事件訴訟","地方公共団体","内閣総理大臣","公権力の行使"],["国家賠償","比例原則","行政主体","行政機関"]],"mode":"administrative"},"2":{"text":"1　行政不服審査とは\n行政不服審査とは、\n行政庁の処分その他の公権力の行使に不服がある者が、行政機関に対してその見直しを求める制度\nである。\n行政不服審査法1条は、簡易迅速かつ公正な手続によって国民の権利利益を救済するとともに、行政の適正な運営を確保することを目的としている。\n⸻\n2　なぜ行政不服審査が必要なのか\n行政処分に不服があるたびに、\nすぐ裁判所へ行く\nという方法だけでは負担が大きい。\nそこで、\n行政庁\n↓\n処分\n↓\n不服\n↓\n行政内部で再検討\n↓\n救済\nという仕組みが設けられている。\n⸻\n3　行政不服審査の特徴\n① 行政内部の救済\n裁判所ではなく、行政機関によって審査される。\n② 比較的簡易\n裁判よりも利用しやすい仕組みを目指している。\n③ 違法だけでなく不当も問題になる\nここが行政訴訟との重要な違い。\n⸻\n4　対象となるもの\n行政不服審査法では、\n行政庁の処分\nについて審査請求ができる。\nまた、\n申請をしたのに、行政庁が相当期間何もしない\nという不作為についても審査請求の制度がある。\n行政不服審査法2条・3条がそれぞれ処分と不作為についての審査請求を定めている。\n⸻\n5　処分についての審査請求\n典型例は、\n許可申請をした ↓ 不許可処分 ↓ 申請者が不服\nというもの。\nそこで、\n「この不許可処分を見直してください」\nと求める。\n⸻\n6　不作為についての審査請求\n例えば、\n許可申請をした ↓ いつまで経っても処分されない ↓ 行政庁が何もしない\nという場合。\nこれを、\n不作為\nという。\n行政不服審査法3条は、法令に基づく申請について相当期間が経過しても処分がされない場合に、不作為について審査請求できるとしている。\n⸻\n7　行政不服審査の基本構造\n行政庁の処分\n↓\n不服\n↓\n審査請求\n↓\n審査庁\n↓\n審理\n↓\n裁決\n⸻\n8　審査請求人\n審査請求をする人を、\n審査請求人\nという。\n例えば、\n不許可処分を受けた申請者\nなど。\n⸻\n9　審査庁\n審査請求を審査して裁決する行政庁を、\n審査庁\nという。\n原則として、\n処分をした行政庁と、審査する行政庁との関係\nが問題になる。\n⸻\n10　審理員\n行政不服審査制度では、原則として、\n審理員\nが審理手続を担当する。\nこれにより、\n処分をした行政庁と審理を担当する者との役割を分け、公正な審理を確保する\nという意味がある。\n⸻\n11　行政不服審査会等\nさらに、一定の場合には、\n行政不服審査会等\nへの諮問が行われる。\nつまり、\n審査請求\n↓\n審理員による審理\n↓\n審理員意見書\n↓\n行政不服審査会等への諮問\n↓\n裁決\nという構造を基本として理解する。\nただし、法律上、諮問が不要となる場合などもある。\n⸻\n12　審査請求の審理\n審理では、\n•\t当事者の主張\n•\t証拠\n•\t処分の適法性\n•\t処分の妥当性\n•\t関係法令\nなどが検討される。\n単に、\n「行政庁がそう言ったから正しい」\nとはならない。\n⸻\n13　裁決\n審査請求について最終的に判断するのが、\n裁決\nである。\n基本的には、\n•\t却下\n•\t棄却\n•\t認容\nなどに整理できる。\n却下\nそもそも審査請求を適法に審理できない。\n棄却\n審理した結果、請求人の主張を認めない。\n認容\n請求人の主張を認める。\n⸻\n14　行政不服審査の目的\n行政不服審査には、\n私人の救済\nだけでなく、\n行政の適正な運営\nという側面もある。\nつまり、\n不服申立て\n↓\n行政の判断を再検討\n↓\n誤った処分を是正\n↓\n国民救済\n＋\n行政の適正化\nとなる。\n⸻\n【核心】\n行政不服審査は、\n行政自身に行政を見直させる制度\nと理解すると分かりやすい。\n⸻","blanks":["行政不服審査","審査請求","簡易迅速かつ公正な手続","不当"],"options":[["行政不服審査","地方公共団体","内閣総理大臣","公権力の行使"],["審査請求","比例原則","行政主体","行政機関"],["簡易迅速かつ公正な手続","法律による行政の原理","法律行為的な行政活動","国民の権利利益の保護"],["不当","行政","立法","司法"]],"mode":"administrative"},"3":{"text":"1　行政不服審査法の全体像\n現在の行政不服審査法は、\n•\t総則\n•\t審査請求\n•\t再調査の請求\n•\t再審査請求\n•\t行政不服審査会等\n•\t補則\nという構造になっている。\n⸻\n2　審査請求\n中心となる制度。\n処分\n↓\n不服\n↓\n審査請求\n↓\n裁決\n⸻\n3　再調査の請求\n法律に特別の定めがある場合などに、\n処分庁自身に処分を再度調査させる\n制度。\nつまり、\n審査請求よりさらに処分庁自身による見直しに近い制度\nとして理解するとよい。\n⸻\n4　再審査請求\n法律に定めがある場合に、\n審査請求の裁決にさらに不服がある者が、再審査を求める制度\nである。\nただし、\nいつでも再審査請求できるわけではない。\n個別法による特別の制度として設けられている場合が中心である。\n⸻\n5　不服申立ての関係\n基本的なイメージは、\n処分\n↓\n┌────────────┐\n│ 審査請求       │\n└────────────┘\n↓\n裁決\n↓\n法律に定めがあれば\n↓\n再審査請求\nまた、法律に特別の定めがある場合、\n処分\n↓\n再調査の請求\n↓\n決定\n↓\n審査請求等\nという構造もあり得る。\n⸻\n6　不服申立期間\n行政救済では、\n期間\nが極めて重要。\n処分に不服があっても、いつまでも不服申立てできるわけではない。\nしたがって実務では、\n「処分の日」\nだけではなく、\n処分を知った日・審査請求期間・個別法の特則\nなどを確認する。\n⸻\n7　審査請求と執行停止\n行政処分に審査請求をしたからといって、\n当然に処分の効力が止まるわけではない。\nこれを、\n執行不停止の原則\nとして理解する。\nしたがって、\n処分\n↓\n審査請求\n↓\n原則として処分の効力は直ちには止まらない\n必要があれば、\n執行停止\nが問題となる。\n⸻\n8　なぜ執行停止が必要なのか\n例えば、\n営業許可取消し\nがされたとする。\n取消処分 ↓ 審査請求 ↓ 審査が終わるまで1年\nとなった場合、事業者がその間営業できなければ、後から処分が取り消されても回復困難な損害が生じる可能性がある。\nそこで、\n執行停止\nという制度が必要になる。\n⸻\n9　審査請求と行政訴訟\n重要なのは、\n行政不服審査をしたら必ず裁判できない\nわけではないということ。\n現代の行政救済では、\n不服申立てと行政訴訟をどのように使い分けるか\nが重要になる。\n原則として行政不服審査法上の審査請求を経なければ取消訴訟ができないという一般的な仕組みではない。\nただし、\n個別法が審査請求前置を定めている場合\nなどには注意する。\n⸻\n【核心】\n行政不服審査を理解するための4語。\n審査請求\n審理員\n裁決\n執行停止\nこの4つを軸に全体構造を理解する。\n⸻","blanks":["行政不服審査法","審査請求","再調査の請求","再審査請求"],"options":[["行政不服審査法","将来の行政活動","行政指導の限界","代替的作為義務"],["審査請求","比例原則","行政主体","行政機関"],["再調査の請求","地方公共団体","内閣総理大臣","公権力の行使"],["再審査請求","法律の優位","法律の留保","行政組織法"]],"mode":"administrative"},"4":{"text":"1　行政事件訴訟とは\n行政事件訴訟とは、\n行政活動をめぐる法律上の争いについて、裁判所による司法的救済を求める制度\nである。\n行政事件訴訟法2条は、行政事件訴訟を、\n•\t抗告訴訟\n•\t当事者訴訟\n•\t民衆訴訟\n•\t機関訴訟\nに分類している。\n⸻\n2　4種類の全体像\n行政事件訴訟\n↓\n┌────┬────┬────┬────┐\n↓       ↓       ↓       ↓\n抗告    当事者   民衆    機関\n訴訟    訴訟     訴訟    訴訟\n⸻\n3　抗告訴訟\n行政庁の公権力行使に関する不服を争う訴訟。\n代表例は、\n取消訴訟\nである。\nほかにも、\n•\t無効等確認訴訟\n•\t不作為の違法確認訴訟\n•\t義務付け訴訟\n•\t差止訴訟\nがある。\n⸻\n4　当事者訴訟\n行政庁の処分そのものを取り消してもらうというより、\n公法上の法律関係について当事者間で争う訴訟\nである。\n典型例として、\n公法上の法律関係に関する確認\nなどがある。\n⸻\n5　民衆訴訟\n自分自身の権利利益ではなく、\n法律上の資格に基づき、公共の利益のために提起する訴訟\nである。\n代表例として、\n住民訴訟\nがある。\n⸻\n6　機関訴訟\n国・公共団体の機関相互間の権限について争う訴訟。\n私人の権利救済とは異なり、\n行政主体内部の権限争い\nを対象とする。\n⸻\n7　行政事件訴訟の基本的な考え方\n行政訴訟では、\n「行政が違法だ」\nだけでは足りない。\n裁判では、\n① 何を争うのか\n↓\n② どの訴訟を使うのか\n↓\n③ 誰が原告になれるか\n↓\n④ 誰を被告にするか\n↓\n⑤ いつまでに提起するか\n↓\n⑥ 裁判所が審理できるか\n↓\n⑦ 行政の行為は違法か\n↓\n⑧ どのような判決を求めるか\nという順番で考える。\n⸻\n【核心】\n行政訴訟は、\n「違法かどうか」だけを見る制度ではない。\nその前段階として、\n「この裁判をそもそも適法に起こせるのか」\nを検討する。\nこれが、\n訴訟要件\nの問題につながる。\n⸻","blanks":["行政事件訴訟","抗告訴訟","当事者訴訟","民衆訴訟"],"options":[["行政事件訴訟","地方公共団体","内閣総理大臣","公権力の行使"],["抗告訴訟","比例原則","行政主体","行政機関"],["当事者訴訟","法律の優位","法律の留保","行政組織法"],["民衆訴訟","比例原則","行政主体","行政機関"]],"mode":"administrative"},"5":{"text":"1　取消訴訟とは\n取消訴訟とは、\n行政庁の処分または裁決の取消しを求める訴訟\nである。\n行政訴訟の中心的制度。\n⸻\n2　典型例\n例えば、\nAが営業許可を受けていた。\n行政庁 ↓ 営業許可取消処分 ↓ A ↓ 「この取消処分は違法だ」\nそこで、\n営業許可取消処分の取消訴訟\nを提起する。\n⸻\n3　取消判決の効果\n取消判決が確定すると、\n行政庁の処分を法的に取り消す効果\nが生じる。\nしたがって、\n違法な処分\n↓\n取消訴訟\n↓\n取消判決\n↓\n処分が法的に除去される\nという構造。\n⸻\n4　取消訴訟の対象\n基本的には、\n行政庁の「処分」\nが対象。\nここで、\n何でも取消訴訟の対象になるわけではない\nことが重要。\n⸻\n5　「処分」とは\n行政事件訴訟法上の処分性の問題。\n基本的には、\n行政庁の公権力の行使に当たる行為で、直接国民の権利義務を形成し、またはその範囲を確定するもの\nとして理解する。\n⸻\n6　なぜ処分性が重要なのか\n例えば、\n行政庁の内部的な準備行為\nについて、\n「取り消してください」\nと言っても、通常の取消訴訟の対象となるとは限らない。\nそこで、\nその行為によって私人の法的地位が直接変化するか\nを考える。\n⸻\n7　取消訴訟のイメージ\n行政庁\n↓\n処分\n↓\n私人の法的地位に影響\n↓\n「違法だ」\n↓\n取消訴訟\n↓\n裁判所\n↓\n取消判決\n⸻\n8　取消訴訟の目的\n取消訴訟は、\n違法な処分を法秩序から除去する\nための制度。\nしたがって、\n「損害があったからお金を払ってほしい」\nという目的なら、国家賠償など別の制度が問題になる。\n⸻\n【核心】\n取消訴訟は、\n処分をなくすための訴訟\nと理解する。\n⸻","blanks":["取消訴訟","取消判決","処分"],"options":[["取消訴訟","比例原則","行政主体","行政機関"],["取消判決","比例原則","行政主体","行政機関"],["処分","行政","立法","司法"]],"mode":"administrative"},"6":{"text":"ここから行政訴訟の専門性が一段上がる。\nただし、この基礎本では判例の細かい対立まで深入りせず、\n裁判所が本案判断に入るために必要な条件\nとして理解する。\n⸻\n1　訴訟要件とは\n訴訟要件とは、\n裁判所がその事件について本格的に審理・判断するために満たされなければならない条件\nである。\n⸻\n2　代表的な訴訟要件\n取消訴訟では、\n•\t処分性\n•\t原告適格\n•\t狭義の訴えの利益\n•\t被告適格\n•\t出訴期間\n•\t管轄\n•\tその他の法律上の要件\nなどが問題になる。\n⸻\n3　処分性\nまず、\nそもそも取消訴訟の対象となる「処分」が存在するか\nを確認する。\n⸻\n4　原告適格\n次に、\n誰が取消訴訟を起こせるのか\nが問題になる。\n単に、\n「その処分が嫌い」\nというだけでは原告になれるわけではない。\n行政事件訴訟法9条は、取消訴訟について法律上の利益を有する者に原告適格を認める。\n⸻\n5　法律上の利益\n「法律上の利益」とは、\n法律によって保護された利益\nとの関係で考える。\nつまり、\n行政処分\n↓\n法律が保護している利益\n↓\nその利益を侵害される者\n↓\n原告適格\nという考え方。\n⸻\n6　第三者の原告適格\n行政処分の直接の相手方ではない第三者でも、\n法律上保護された利益を侵害される\n場合には原告適格が問題になる。\n例えば、\nある施設の許可によって近隣住民の生命・身体等に重大な影響が生じる\nような場合。\nそこで、\n「その法律は誰の利益を保護しているのか」\nという視点が重要になる。\n⸻\n7　狭義の訴えの利益\n原告適格があっても、\n今さら取消しても意味がない\nという場合がある。\nこのとき、\n訴えの利益\nが問題になる。\n⸻\n8　被告適格\n行政事件訴訟では、\n誰を被告にするのか\nも法律上定められている。\n取消訴訟では、原則として、\n処分をした行政庁が所属する国または公共団体\nを被告とする。\n⸻\n9　出訴期間\n取消訴訟にも、\nいつまでも提起できるわけではない\nという時間的制限がある。\n行政事件訴訟法14条に定められる出訴期間を基本として、処分を知った日などとの関係を確認する。\nただし、個別法に特別の出訴期間が定められている場合もある。\n⸻\n10　訴訟要件の思考順序\n処分？\n↓\n原告になれる？\n↓\n今、取消す意味がある？\n↓\n被告は適切？\n↓\n期間内？\n↓\nその他の要件\n↓\n本案審理\n⸻\n【核心】\n行政訴訟では、\n「違法か？」\nの前に、\n「そもそも裁判所がこの事件を判断できる状態か？」\nを考える。\n⸻","blanks":["訴訟要件","処分性","原告適格","狭義の訴えの利益"],"options":[["訴訟要件","比例原則","行政主体","行政機関"],["処分性","行政法","行政庁","法人格"],["原告適格","比例原則","行政主体","行政機関"],["狭義の訴えの利益","行政上の事実行為","行政の実効性確保","行政上の強制執行"]],"mode":"administrative"},"7":{"text":"1　訴訟要件をクリアした後\n訴訟要件を満たして初めて、\n本案審理\nに入る。\nここで初めて、\n行政庁の処分は違法か？\nを本格的に検討する。\n⸻\n2　違法性の判断\n例えば、\n法律違反\n法律上の要件を満たしていない。\n手続違反\n必要な手続を経ていない。\n裁量権の逸脱・濫用\n裁量の範囲を超えている。\n事実認定の問題\n重要な事実を誤っている。\nなど。\n⸻\n3　行政裁量との関係\n第3編で学んだ行政裁量がここで登場する。\n行政庁に裁量があるからといって、\n何をしても合法\nではない。\n裁判所は、\n裁量権の逸脱・濫用がないか\nを審査する。\n⸻\n4　審理の構造\n訴訟要件\n↓\n本案審理\n↓\n行政処分の適法性\n↓\n・事実\n・法解釈\n・要件該当性\n・手続\n・裁量\n↓\n判決\n⸻\n5　取消判決\n裁判所が、\n「処分は違法」\nと判断した場合、\n請求認容\nとなり、処分が取り消される。\n⸻\n6　請求棄却\n一方、\n「処分は適法」\nと判断すれば、\n請求棄却\nとなる。\n⸻\n7　却下と棄却\n非常に重要。\n却下\n訴訟要件を満たしていない。\nつまり、\n本案の中身まで判断していない。\n棄却\n訴訟要件は満たしているが、原告の主張が認められない。\nつまり、\n本案について判断した結果、負けた。\n⸻\n8　取消判決の拘束力\n取消判決が確定すると、\n行政庁はその判決に従う必要がある。\n単に、\n「裁判所が違法と言った」\nだけではなく、\n行政庁を法的に拘束する\nという効果がある。\n⸻\n9　第三者への影響\n行政処分の取消しは、\n処分の相手方だけでなく第三者の法律関係にも影響する\n場合がある。\nそのため行政訴訟では、\n第三者の参加\nなども重要になる。\n⸻\n10　取消訴訟と行政庁の再処分\n取消判決がされた場合、\n行政庁が何をすべきか\nという問題もある。\n取消判決は、\n必ずしも「申請を必ず許可せよ」という意味ではない。\n例えば、\n「不許可処分は違法だから取り消す」\nという判決と、\n「行政庁は必ず許可しなければならない」\nという判断は別問題。\nここから、\n義務付け訴訟\nなどにつながる。\n⸻\n【核心】\n取消訴訟は、\n違法な処分を取り消す\nことが基本。\nそれ以上に、\n行政庁に何かをさせたい\nなら、別の訴訟類型が必要になることがある。\n⸻","blanks":["本案審理","違法性","裁量権の逸脱・濫用","取消判決"],"options":[["本案審理","比例原則","行政主体","行政機関"],["違法性","行政法","行政庁","法人格"],["裁量権の逸脱・濫用","相手方の任意の協力","法律関係を図にする","法律による行政の原理"],["取消判決","比例原則","行政主体","行政機関"]],"mode":"administrative"},"8":{"text":"1　無効等確認訴訟とは\n無効等確認訴訟とは、\n行政庁の処分または裁決の存否・効力の有無を確認する訴訟\nである。\n⸻\n2　取消訴訟との違い\n取消訴訟\n「この処分を取り消してください」\n無効等確認訴訟\n「この処分にはそもそも効力がありません」\nという違い。\n⸻\n3　無効とは\n行政行為に重大な瑕疵があり、\n最初から法的効力を認められない\n場合。\n第3編の、\n行政行為の瑕疵\nとつながる。\n⸻\n4　取消しと無効\n取消し\t無効\n効力\tいったん効力を持つ\t原則として初めから効力なし\n原則的対応\t取消訴訟\t無効等確認訴訟等\n瑕疵\t取消原因\t無効原因\n重要性\t比較的軽い\t重大\n⸻\n5　なぜ無効確認が必要なのか\n行政庁の行為が、\n「そもそも存在しないのと同じ」\nと考えられる場合、\n通常の取消しではなく、\n無効であることの確認\nが問題になる。\n⸻\n6　無効等確認訴訟の考え方\n行政行為\n↓\n重大な瑕疵\n↓\n無効？\n↓\n無効等確認訴訟\n↓\n裁判所が効力の有無を判断\n⸻\n【核心】\n取消しと無効の違いは、\n「いったん有効なものとして存在しているのか、それとも最初から法的効力を持たないのか」\nという視点で理解する。\n⸻","blanks":["無効等確認訴訟","重大な瑕疵","取消訴訟","無効"],"options":[["無効等確認訴訟","将来の行政活動","行政指導の限界","代替的作為義務"],["重大な瑕疵","法律の優位","法律の留保","行政組織法"],["取消訴訟","比例原則","行政主体","行政機関"],["無効","行政","立法","司法"]],"mode":"administrative"},"9":{"text":"1　行政が何もしない場合\n行政救済は、\n「行政が何かした」\n場合だけではない。\n行政が、\n何もしない\nこと自体が問題になる場合がある。\n⸻\n2　不作為\n例えば、\nA ↓ 許可申請 ↓ 行政庁 ↓ いつまで経っても処分しない\nこれが、\n不作為\nである。\n⸻\n3　不作為の違法確認訴訟\nこの場合、\n行政庁が処分をしないことが違法であることの確認\nを求める。\n⸻\n4　基本構造\n申請\n↓\n相当期間経過\n↓\n行政庁が処分しない\n↓\n不作為\n↓\n不作為の違法確認訴訟\n⸻\n5　不作為の違法確認だけで十分なのか\nここが重要。\n例えば、\n「行政庁が処分をしないことは違法です」\nと確認されても、\n行政庁が、\n「分かりました。でもまだ処分しません」\nとなれば、問題が残る。\nそこで、\n義務付け訴訟\nが重要になる。\n⸻\n6　不作為の違法確認と義務付け\n不作為の違法確認\n「処分しないのは違法」\n義務付け\n「この処分をしなさい」\nという違い。\n⸻\n7　行政救済の進化\n行政庁が何もしない\n↓\n不作為の違法確認\n↓\nさらに\n↓\n義務付け訴訟\nという関係を理解する。\n⸻\n【核心】\n不作為の違法確認訴訟は、\n行政庁の「何もしない」という状態そのものを違法として確認する制度\nである。\n⸻","blanks":["不作為","不作為の違法確認訴訟","申請","処分"],"options":[["不作為","行政法","行政庁","法人格"],["不作為の違法確認訴訟","法律による行政の原理","法律行為的な行政活動","国民の権利利益の保護"],["申請","行政","立法","司法"],["処分","行政","立法","司法"]],"mode":"administrative"},"10":{"text":"1　現代行政救済の重要制度\n取消訴訟だけでは、\n将来の行政活動に対応できない\n場合がある。\nそこで、\n•\t義務付け訴訟\n•\t差止訴訟\nが設けられている。\n⸻\n2　義務付け訴訟\n義務付け訴訟とは、\n行政庁に一定の処分または裁決をするよう求める訴訟\nである。\n⸻\n3　典型例\nAが許可を申請した。\n行政庁 ↓ 不許可\nA ↓ 「この不許可処分は違法だから、許可を出してほしい」\nという場合。\n単に不許可処分を取り消すだけでなく、\n許可処分をするよう求める\n必要がある場合がある。\n⸻\n4　義務付けの基本構造\n申請\n↓\n行政庁が不許可\n↓\n不許可を争う\n↓\n「許可をしなさい」\n↓\n義務付け訴訟\n⸻\n5　申請型義務付け訴訟\n申請に対する処分を求めるタイプ。\n例えば、\n建築許可を出せ\n営業許可を出せ\nなど。\n⸻\n6　非申請型義務付け訴訟\n申請をしていない場合でも、\n行政庁が一定の処分をすべきなのにしない\nという場面がある。\n例えば、\n違法状態を放置せず、行政庁が一定の規制処分をすべき\nというケース。\nこの場合にも義務付け訴訟が問題になる。\n⸻\n7　義務付け訴訟の重要性\n取消訴訟：\n「今の処分を消せ」\n義務付け：\n「行政庁にこの処分をさせろ」\nこの違い。\n⸻\n8　差止訴訟\n差止訴訟は、\n行政庁が一定の処分または裁決をすることの差止めを求める訴訟\nである。\nつまり、\nまだ処分されていない段階で、将来の処分を止める\n制度。\n⸻\n9　典型例\n行政庁が、\n「近いうちに営業許可を取り消す」\nと考えている。\nまだ取消処分はされていない。\nしかし、\nその処分がされると重大な損害が生じる\nという場合。\nそこで、\nその処分をするな\nと裁判所に求める。\n⸻\n10　差止訴訟の構造\n将来の行政処分\n↓\n重大な不利益のおそれ\n↓\n処分前に\n↓\n差止訴訟\n↓\n「その処分をするな」\n⸻\n11　取消訴訟との違い\n取消訴訟\t差止訴訟\n時点\t処分後\t処分前\n目的\t処分をなくす\t処分をさせない\n基本方向\t過去の処分\t将来の処分\n⸻\n12　義務付けと差止め\n行政に「やれ」\n↓\n義務付け\n行政に「やるな」\n↓\n差止め\n非常にシンプルに整理できる。\n⸻\n13　仮の救済\n本案判決を待っている間に、\n損害が発生してしま
