がある。\n⸻","blanks":[],"options":[],"mode":"civil"},"15":{"text":"離婚とは、\n法律上の婚姻関係を終了させること\nである。\n日本の離婚制度には、\n協議離婚\n当事者の合意による離婚。\n裁判上の離婚\n一定の法定離婚原因がある場合に、裁判によって離婚する。\nという大きな区別がある。\n⸻","blanks":["離婚","法律上の婚姻関係を終了させること"],"options":[["離婚","民法","総則","胎児"],["法律上の婚姻関係を終了させること","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"]],"mode":"civil"},"16":{"text":"夫婦双方が、\n「離婚する」\nと合意する。\n↓\n離婚届を提出。\n↓\n一定の要件を満たせば離婚成立。\n日本では協議離婚が認められていることが特徴。\n⸻","blanks":["離婚する","夫婦双方が、"],"options":[["離婚する","権利能力","買います","意思能力"],["夫婦双方が、","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"17":{"text":"協議が成立しない場合でも、\n一定の法定離婚原因\nが存在すれば、裁判上の離婚が認められる場合がある。\n代表的には、\n•\t不貞行為\n•\t悪意の遺棄\n•\t3年以上の生死不明\n•\t回復の見込みがない強度の精神病\n•\tその他婚姻を継続し難い重大な事由\nなどがある。\n⸻","blanks":["不貞行為","悪意の遺棄","3年以上の生死不明"],"options":[["不貞行為","権利能力","買います","意思能力"],["悪意の遺棄","権利の主体","土地を買う","次の「物権"],["3年以上の生死不明","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"18":{"text":"離婚すると、\n子どもとの法律関係\nが重要な問題になる。\n代表的には、\n•\t親権\n•\t養育費\n•\t面会交流\n•\t子の氏\n•\t子の監護\nなど。\n⸻","blanks":["親権","養育費","面会交流","子の氏"],"options":[["親権","民法","総則","胎児"],["養育費","取消し","不確実","所有権"],["面会交流","権利能力","買います","意思能力"],["子の氏","取消し","不確実","所有権"]],"mode":"civil"},"19":{"text":"1　親権とは\n親権とは、\n子の利益のために、子を監護・教育し、子の財産を管理するなどの権利・義務\nである。\n親権は、\n「親が子どもを自由に支配する権利」\nではない。\n核心は、\n子の利益のために行使される権利・義務\nという点にある。\n⸻","blanks":["親権","親が子どもを自由に支配する権利","子の利益のために行使される権利・義務"],"options":[["親権","民法","総則","胎児"],["親が子どもを自由に支配する権利","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"],["子の利益のために行使される権利・義務","私の代理人としてCから車を買ってきて","この問題は物権のどの部分の問題なのか","売買で債務不履行が起きたらどうなる？"]],"mode":"civil"},"20":{"text":"親権には大きく、\n身上監護\n子どもの生活・教育などを行う。\n財産管理\n子どもの財産を管理する。\n法律行為への関与\n一定の場合に子の法律行為を代理する。\nなどがある。\n⸻","blanks":["親権には大きく、","身上監護"],"options":[["親権には大きく、","どのような意思で","変更・管理・保存","保険金が発生した"],["身上監護","権利能力","買います","意思能力"]],"mode":"civil"},"21":{"text":"親権者は、\n子の人格を尊重し、その年齢・発達の程度に配慮して監護・教育を行う\nことが求められる。\nしたがって、\n「親だから何をしてもいい」\nという考え方は成立しない。\n⸻","blanks":["親だから何をしてもいい","親権者は、"],"options":[["親だから何をしてもいい","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"],["親権者は、","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"22":{"text":"親が子の代理人として法律行為をするとき、\n親自身と子どもの利益が対立する\n場合がある。\nこれを利益相反という。\n例えば、\n親と子が同じ財産について争う取引を、親が子の代理人として行う場合。\n↓\n親が自分の利益を優先する危険がある。\nそこで、\n特別代理人\nなどによって子を保護する制度が問題となる。\n⸻","blanks":["利益相反","親自身と子どもの利益が対立する"],"options":[["利益相反","権利能力","買います","意思能力"],["親自身と子どもの利益が対立する","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"]],"mode":"civil"},"23":{"text":"親子関係には、\n•\t実親子関係\n•\t養親子関係\nがある。\n実親子については、\n母子関係\n父子関係\nをどのように法律上確定するかが問題となる。\n⸻","blanks":["実親子関係","養親子関係"],"options":[["実親子関係","権利の主体","土地を買う","次の「物権"],["養親子関係","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"24":{"text":"母子関係については、\n出産した女性が母となる\nという考え方が基本となる。\n⸻","blanks":["母子関係については、"],"options":[["母子関係については、","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"25":{"text":"父子関係については、\n嫡出推定\nなどの制度が重要となる。\n婚姻関係にある男女から出生した子について、法律上の父を推定する仕組みがある。\n⸻","blanks":["父子関係については、","嫡出推定"],"options":[["父子関係については、","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["嫡出推定","権利能力","買います","意思能力"]],"mode":"civil"},"26":{"text":"嫡出推定は、\n子の父子関係を法律上早期に確定させる\nための制度。\n父子関係が争われた場合には、\n嫡出否認などの制度\nが問題となる。\n⸻","blanks":["嫡出推定は、","ための制度。"],"options":[["嫡出推定は、","お金を借りる","従業員を雇う","典型的には、"],["ための制度。","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"27":{"text":"婚姻関係にない男女の間に生まれた子について、\n父が法律上の親子関係を成立させる\nための制度が認知。\n⸻\n基本構造\n父\n│\n│ 認知\n↓\n子\n↓\n法律上の父子関係\n認知には、\n•\t任意認知\n•\t裁判認知\nなどがある。\n⸻","blanks":["任意認知","裁判認知"],"options":[["任意認知","権利能力","買います","意思能力"],["裁判認知","権利能力","買います","意思能力"]],"mode":"civil"},"28":{"text":"養子とは、\n血縁関係のない者との間に法律上の親子関係を成立させる制度\nである。\n養子縁組には、\n普通養子縁組\n通常の養子制度。\n特別養子縁組\n実親との法的親子関係を原則として終了させ、より強い親子関係を形成する制度。\nという区別がある。\n⸻","blanks":["養子","養子縁組には、"],"options":[["養子","民法","総則","胎児"],["養子縁組には、","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"29":{"text":"普通養子では、\n養親と養子との法律上の親子関係\nが成立する。\n一方、\n実親との法律上の親子関係\nも原則として残る。\n⸻","blanks":["普通養子では、","養親と養子との法律上の親子関係"],"options":[["普通養子では、","結婚・離婚する","必ず絶対に従う","というケース。"],["養親と養子との法律上の親子関係","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"]],"mode":"civil"},"30":{"text":"特別養子縁組は、\n子の利益を図るため、実親との法的親子関係を原則として終了させる制度\nである。\nそのため、普通養子より成立要件が厳格。\n⸻","blanks":["特別養子縁組は、"],"options":[["特別養子縁組は、","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"31":{"text":"養子になると、\n養親と養子との間に法律上の親子関係\nが発生する。\nこれに伴って、\n•\t扶養\n•\t相続\n•\t氏\n•\t親権\nなどについて法律上の効果が発生する。\n⸻","blanks":["扶養","相続","親権"],"options":[["扶養","民法","総則","胎児"],["相続","民法","総則","胎児"],["親権","民法","総則","胎児"]],"mode":"civil"},"32":{"text":"親権と、\n実際に子どもを監護すること\nは必ずしも完全に同一ではない。\nしたがって、\n親権\nと\n監護\nを区別して考える必要がある。\n⸻","blanks":["親権と、","実際に子どもを監護すること"],"options":[["親権と、","権利能力","買います","意思能力"],["実際に子どもを監護すること","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"]],"mode":"civil"},"33":{"text":"離婚などによって子どもと別居する親について、\n子どもと交流すること\nが問題となる。\nこれが面会交流。\n現在では、\n子の利益を最も優先して考慮する\nことが基本的な考え方となる。\n⸻","blanks":["面会交流","子どもと交流すること"],"options":[["面会交流","権利能力","買います","意思能力"],["子どもと交流すること","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"34":{"text":"子どもを監護していない親であっても、\n子を扶養する義務\nを負う。\nそのため、\n養育費\nが問題となる。\n⸻","blanks":["子を扶養する義務","を負う。"],"options":[["子を扶養する義務","どのような意思で","変更・管理・保存","保険金が発生した"],["を負う。","権利能力","買います","意思能力"]],"mode":"civil"},"35":{"text":"一定の親族には、\n互いに扶養する義務\nがある。\n代表的には、\n•\t直系血族\n•\t兄弟姉妹\nなど。\nまた、一定の場合には、\n三親等内の親族\nについて特別な扶養義務が問題となる。\n⸻","blanks":["直系血族","兄弟姉妹"],"options":[["直系血族","権利能力","買います","意思能力"],["兄弟姉妹","権利能力","買います","意思能力"]],"mode":"civil"},"36":{"text":"扶養とは、\n生活を維持するために必要な給付をすること\nである。\n例えば、\n生活費\n↓\n住居費\n↓\n食費\n↓\n医療費\nなど。\n⸻","blanks":["扶養"],"options":[["扶養","民法","総則","胎児"]],"mode":"civil"},"37":{"text":"扶養については、\n誰が誰を扶養するのか\nどの程度扶養するのか\nが問題となる。\n当事者の、\n•\t資力\n•\t生活状況\n•\t必要性\n•\t身分関係\nなどを考慮して決定される。\n⸻","blanks":["資力","生活状況","必要性","身分関係"],"options":[["資力","民法","総則","胎児"],["生活状況","権利能力","買います","意思能力"],["必要性","取消し","不確実","所有権"],["身分関係","権利能力","買います","意思能力"]],"mode":"civil"},"38":{"text":"親族法を理解するうえで、\n成年後見制度\nも重要。\n判断能力が十分でない人について、\n法律行為や財産管理を支援・保護する制度\nである。\n⸻","blanks":["親族法を理解するうえで、","成年後見制度"],"options":[["親族法を理解するうえで、","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["成年後見制度","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"39":{"text":"大きく、\n成年後見\n事理を弁識する能力を欠く常況。\n保佐\n事理を弁識する能力が著しく不十分。\n補助\n事理を弁識する能力が不十分。\nという段階に分けられる。\n⸻\nイメージ\n判断能力の低下\n↓\n┌───┼───┐\n│   │   │\n成年後見 保佐 補助\n│   │   │\n強い ←────→ 限定的\n制限\n⸻","blanks":["大きく、","成年後見"],"options":[["大きく、","権利能力","買います","意思能力"],["成年後見","権利能力","買います","意思能力"]],"mode":"civil"},"40":{"text":"成年後見人は、\n成年被後見人の利益を守るために、財産管理や法律行為について一定の権限を持つ。\nただし、\n本人の意思を尊重すること\nが重要。\n成年後見制度は、\n「本人からすべての自由を奪う制度」\nではない。\n⸻","blanks":["本人からすべての自由を奪う制度","成年後見人は、"],"options":[["本人からすべての自由を奪う制度","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"],["成年後見人は、","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"41":{"text":"被保佐人については、\n重要な法律行為\nについて保佐人の同意が必要となる場合がある。\n成年被後見人よりも、\n本人の自己決定を残す\n仕組みとなっている。\n⸻","blanks":["被保佐人については、","重要な法律行為"],"options":[["被保佐人については、","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["重要な法律行為","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"42":{"text":"補助は、\n判断能力の低下が比較的軽い場合\nに利用される。\n特定の法律行為について、\n補助人の同意を必要とする\nなど、より限定的な支援を行う。\n⸻","blanks":["補助は、","に利用される。"],"options":[["補助は、","権利能力","買います","意思能力"],["に利用される。","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"43":{"text":"法定後見だけではなく、\n本人が判断能力を十分に有する段階で、将来に備えて後見人を選んでおく\n制度もある。\nこれが任意後見。\n⸻\n基本構造\n本人\n↓\n判断能力があるうちに\n↓\n任意後見契約\n↓\n将来、判断能力が低下\n↓\n任意後見開始\n⸻","blanks":["任意後見","法定後見だけではなく、"],"options":[["任意後見","権利能力","買います","意思能力"],["法定後見だけではなく、","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"44":{"text":"現代の親族法では、\n本人の意思・人格・自己決定\nが重要な考慮要素となる。\n特に成年後見などでは、\n「保護する」\nだけでなく、\n「本人の意思を尊重する」\nことが重要。\n⸻","blanks":["保護する","本人の意思を尊重する"],"options":[["保護する","権利能力","買います","意思能力"],["本人の意思を尊重する","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"45":{"text":"親族法では、\n身分行為\nと\n財産行為\nを区別する。\n身分行為\n婚姻・離婚・認知・養子縁組など。\n財産行為\n売買・贈与・賃貸借など。\n身分行為では、\n本人の意思\nが特に重要になる。\n⸻","blanks":["親族法では、","身分行為"],"options":[["親族法では、","お金を借りる","従業員を雇う","典型的には、"],["身分行為","権利能力","買います","意思能力"]],"mode":"civil"},"46":{"text":"親族法は財産法と完全に分離しているわけではない。\n例えば、\n婚姻\n↓\n夫婦財産\n↓\n離婚\n↓\n財産分与\n↓\n相続\nというようにつながる。\nまた、\n親子関係\n↓\n扶養\n↓\n相続\nという関係もある。\n⸻","blanks":["夫婦財産","財産分与"],"options":[["夫婦財産","権利能力","買います","意思能力"],["財産分与","権利能力","買います","意思能力"]],"mode":"civil"},"47":{"text":"離婚すると、\n財産分与\nが問題となる。\n財産分与には、\n•\t夫婦が協力して形成した財産の清算\n•\t離婚後の扶養的要素\n•\t離婚による精神的損害の慰謝料との関係\nなど、複数の側面がある。\n⸻","blanks":["離婚後の扶養的要素","離婚すると、"],"options":[["離婚後の扶養的要素","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["離婚すると、","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"48":{"text":"この2つは同じではない。\n財産分与\n夫婦財産関係を清算する。\n慰謝料\n精神的損害を賠償する。\nしたがって、\n離婚\n↓\n財産分与\n＋\n慰謝料\nという形で両方が問題になる場合がある。\n⸻","blanks":["この2つは同じではない。","財産分与"],"options":[["この2つは同じではない。","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["財産分与","権利能力","買います","意思能力"]],"mode":"civil"},"49":{"text":"親族法の事件を見たら、\n① どの身分関係か\n婚姻？\n離婚？\n親子？\n養子？\n扶養？\n後見？\n⸻\n② 法律上の身分が成立しているか\n婚姻関係？\n親子関係？\n養親子関係？\n⸻\n③ 誰にどの権利・義務があるか\n親権？\n扶養義務？\n婚姻費用？\n財産分与？\n⸻\n④ 子どもが関係するか\n関係するなら、\n子の利益\nを中心に考える。\n⸻\n⑤ 財産問題が絡むか\n財産分与？\n婚姻費用？\n養育費？\n相続？\n⸻","blanks":["親族法の事件を見たら、","① どの身分関係か"],"options":[["親族法の事件を見たら、","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"],["① どの身分関係か","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"50":{"text":"AとBは夫婦。\n↓\n夫婦関係が悪化。\n↓\n協議して離婚。\n↓\n子Cがいる。\nこの場合、\n① 離婚成立\n↓\n② 親権\n↓\n③ 子の監護\n↓\n④ 養育費\n↓\n⑤ 面会交流\n↓\n⑥ 財産分与\n↓\n⑦ 慰謝料\nなどを順番に検討する。\n⸻","blanks":["AとBは夫婦。","夫婦関係が悪化。"],"options":[["AとBは夫婦。","結婚・離婚する","必ず絶対に従う","というケース。"],["夫婦関係が悪化。","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"51":{"text":"AとBは婚姻していない。\n↓\nBが子Cを出産。\n↓\nAが父として認知。\n↓\nAとCの法律上の親子関係が成立。\n↓\nその後、\n•\t扶養\n•\t親権\n•\t相続\nなどの法律関係につながる。\n⸻","blanks":["扶養","親権","相続"],"options":[["扶養","民法","総則","胎児"],["親権","民法","総則","胎児"],["相続","民法","総則","胎児"]],"mode":"civil"},"52":{"text":"Aは高齢になり、\n判断能力が大きく低下した。\n↓\n財産管理が難しくなる。\n↓\n成年後見制度の利用を検討。\n↓\n能力の程度に応じて、\n•\t成年後見\n•\t保佐\n•\t補助\nを検討。\n↓\n本人の利益・意思を尊重しながら、\n財産管理・法律行為を支援する。\n⸻","blanks":["成年後見","保佐","補助"],"options":[["成年後見","権利能力","買います","意思能力"],["保佐","民法","総則","胎児"],["補助","民法","総則","胎児"]],"mode":"civil"},"53":{"text":"親族法\n│\n┌────────────┼────────────┐\n│            │            │\n婚姻          親子         扶養\n│            │\n┌───┴───┐    ┌──┴──┐\n│       │    │     │\n婚姻    離婚  実親子  養子\n│       │    │     │\n│   ┌───┼───┐      │\n│   │   │   │      │\n│ 親権 養育費 面会   │\n│       │          │\n└───────┼──────────┘\n│\n財産関係\n│\n┌───────┼───────┐\n│       │       │\n婚姻費用 財産分与  相続\n│\n→ 第7編へ\n⸻","blanks":["財産関係","婚姻費用 財産分与  相続"],"options":[["財産関係","権利能力","買います","意思能力"],["婚姻費用 財産分与  相続","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"]],"mode":"civil"},"54":{"text":"制度\t内容\n婚姻\t法律上の夫婦関係を成立\n協議離婚\t夫婦の合意による離婚\n裁判離婚\t法定離婚原因による離婚\n親権\t子の監護・教育・財産管理等\n認知\t父子関係を法律上成立させる\n普通養子\t養親子関係を成立させ、実親子関係は原則残る\n特別養子\t実親との法的親子関係を原則終了\n面会交流\t子と別居親との交流\n養育費\t子の生活・成長のための費用\n扶養\t親族間で生活を支える\n成年後見\t判断能力を欠く人を保護・支援\n保佐\t判断能力が著しく不十分な人を支援\n補助\t判断能力が不十分な人を限定的に支援\n任意後見\t本人が事前に将来の後見人を決める\n⸻","blanks":["制度\t内容","婚姻\t法律上の夫婦関係を成立"],"options":[["制度\t内容","権利の主体","土地を買う","次の「物権"],["婚姻\t法律上の夫婦関係を成立","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"]],"mode":"civil"},"55":{"text":"親族法では、\n「誰が誰とどのような身分関係にあるのか」\nを最初に確定する。\nそのうえで、\n身分関係\n↓\n法律上の権利・義務\n↓\n具体的な問題\n↓\n本人・子の利益\n↓\n法律上の救済\nという順番で考える。\n⸻","blanks":["誰が誰とどのような身分関係にあるのか","親族法では、"],"options":[["誰が誰とどのような身分関係にあるのか","私の代理人としてCから車を買ってきて","この問題は物権のどの部分の問題なのか","売買で債務不履行が起きたらどうなる？"],["親族法では、","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"56":{"text":"親族\n1.\t親族とは誰をいうか。\n2.\t親族法と財産法の違いは何か。\n3.\t親族法で本人の意思が重要なのはなぜか。\n婚姻\n4.\t婚姻はどのように成立するか。\n5.\t婚姻の法律上の効果には何があるか。\n6.\t夫婦の同居・協力・扶助義務とは何か。\n7.\t婚姻費用とは何か。\n8.\t夫婦財産制とは何か。\n9.\t日常家事債務とは何か。\n離婚\n10.\t協議離婚と裁判離婚の違いは何か。\n11.\t裁判上の離婚原因には何があるか。\n12.\t離婚すると子について何が問題となるか。\n13.\t財産分与とは何か。\n14.\t財産分与と慰謝料の違いは何か。\n親子\n15.\t親子関係にはどのような種類があるか。\n16.\t嫡出推定とは何か。\n17.\t認知とは何か。\n18.\t親権とは何か。\n19.\t親権と監護の違いは何か。\n20.\t利益相反行為とは何か。\n21.\t面会交流とは何か。\n22.\t養育費とは何か。\n養子\n23.\t普通養子と特別養子の違いは何か。\n24.\t養子縁組によってどのような法律関係が生じるか。\n扶養・後見\n25.\t親族間の扶養とは何か。\n26.\t成年後見・保佐・補助の違いは何か。\n27.\t任意後見とは何か。\n28.\t成年後見制度で本人の意思が重要なのはなぜか。\n⸻","blanks":["扶養・後見"],"options":[["扶養・後見","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"57":{"text":"親族法の全体像は、\n親族\n│\n┌──────────┼──────────┐\n│          │          │\n婚姻        親子       扶養\n│          │\n│      ┌───┴───┐\n│      │       │\n│     実親子   養子\n│\n┌───┴───┐\n│       │\n婚姻     離婚\n│       │\n│   ┌───┼────────┐\n│   │   │        │\n│  親権 養育費  面会交流\n│\n夫婦財産\n婚姻費用\n│\n└────→ 財産分与\n＋\n成年後見\n保佐・補助\n任意後見\n⸻\n第6編終了時点での到達目標\n親族法では、\n「この人とこの人との間に、どのような法律上の身分関係があるのか」\nを判断できることが第一歩。\nそのうえで、\n婚姻\n↓\n夫婦の権利義務\n↓\n離婚\n↓\n親権・監護・養育費・面会交流・財産分与\nという流れ。\nまた、\n親子関係\n↓\n親権・扶養\n↓\n相続\nという流れも理解する。\nそして、\n判断能力の低下\n↓\n成年後見・保佐・補助\n↓\n本人の利益・意思を尊重した支援\nという体系も理解する。\nつまり第6編の核心は、\n「家族関係について、法律がどのような身分関係を作り、その身分関係からどのような権利・義務を発生させているのか」\nを理解することである。\nこれによって、次の**第7編「相続」**に進む準備が整う。\n特に、\n親子関係・配偶者\n↓\n相続人\n↓\n相続分・遺産分割・遺言・遺留分\nという形で、第6編と第7編が直接つながる。","blanks":["相続","「家族関係について、法律がどのような"],"options":[["相続","民法","総則","胎児"],["「家族関係について、法律がどのような","私の代理人としてCから車を買ってきて","この問題は物権のどの部分の問題なのか","売買で債務不履行が起きたらどうなる？"]],"mode":"civil"}},"7":{"1":{"text":"相続とは、\n人が死亡したことを原因として、その人の財産上の権利義務を一定の者が承継すること\nである。\n例えばAが死亡した場合、\nAが所有していた\n•\t土地\n•\t建物\n•\t預金\n•\t株式\n•\t債権\nなどが、一定のルールに従って相続人へ承継される。\n一方で、\n•\t一身専属的な権利\n•\t一身専属的な義務\n•\tその他、性質上相続されないもの\nなどは相続の対象にならない。\n⸻","blanks":["相続","土地","建物","預金"],"options":[["相続","民法","総則","胎児"],["土地","民法","総則","胎児"],["建物","民法","総則","胎児"],["預金","民法","総則","胎児"]],"mode":"civil"},"2":{"text":"相続を理解するときは、次の順番で考える。\n死亡\n↓\n相続開始\n↓\n相続人を確定\n↓\n相続財産を確定\n↓\n法定相続分を確認\n↓\n遺言の有無を確認\n↓\n遺産分割\n↓\n各相続人が財産を取得\n↓\n必要に応じて登記・名義変更\nただし、\n遺言がある場合\n遺産分割が必要な場合\n相続放棄をする場合\nなどによって流れが変わる。\n⸻","blanks":["相続開始","相続人を確定"],"options":[["相続開始","権利能力","買います","意思能力"],["相続人を確定","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"3":{"text":"相続は、\n死亡によって開始する。\nしたがって、\nA死亡\n↓\n相続開始\n↓\nAの相続人がAの権利義務を承継\nとなる。\n相続開始時点が重要なのは、\n「誰が相続人なのか」\n「どの財産が相続財産なのか」\n「相続分はいくらなのか」\nなどを原則として相続開始時を基準に判断するからである。\n⸻","blanks":["誰が相続人なのか","どの財産が相続財産なのか","相続分はいくらなのか"],"options":[["誰が相続人なのか","どのような意思で","変更・管理・保存","保険金が発生した"],["どの財産が相続財産なのか","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["相続分はいくらなのか","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"4":{"text":"相続人と被相続人が、\nどちらが先に死亡したのか明らかでない\n場合には、特別なルールが問題となる。\n相続では、\n誰が先に死亡したか\nによって相続関係が大きく変わるためである。\n⸻","blanks":["相続人と被相続人が、","相続では、"],"options":[["相続人と被相続人が、","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["相続では、","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"5":{"text":"民法は、\n誰が相続人になるのか\nを法律で定めている。\nこれを法定相続人という。\n基本的な順位は、\n第1順位\n子\n↓\n第2順位\n直系尊属\n↓\n第3順位\n兄弟姉妹\nである。\nただし、\n配偶者は常に相続人となる。\n⸻","blanks":["法定相続人","民法は、"],"options":[["法定相続人","権利の主体","土地を買う","次の「物権"],["民法は、","権利能力","買います","意思能力"]],"mode":"civil"},"6":{"text":"重要なのは、\n「配偶者＋血族相続人」\nという組み合わせ。\n例えば、\n被相続人A\n│\n├── 配偶者B\n│\n└── 子C\nなら、\nBとCが相続人。\n⸻\n別の例。\n被相続人A\n│\n├── 配偶者B\n│\n└── 子なし\n│\n父母\nなら、\nBと直系尊属が相続人。\n⸻","blanks":["配偶者＋血族相続人","重要なのは、"],"options":[["配偶者＋血族相続人","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["重要なのは、","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"7":{"text":"子は第1順位の相続人。\n原則として、\n子は同順位で相続する。\n例えば、\nA死亡\n│\n├── 子B\n├── 子C\n└── 子D\nなら、\nB・C・Dが相続人となる。\n⸻","blanks":["子は第1順位の相続人。","子は同順位で相続する。"],"options":[["子は第1順位の相続人。","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"],["子は同順位で相続する。","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"8":{"text":"相続人になるはずだった者が、\n被相続人より先に死亡している\nなど一定の場合には、その者の子が相続人になる。\nこれが代襲相続。\n⸻\n例\n祖父A\n│\n├── 父B\n│    × Aより先に死亡\n│\n│    └── 孫C\nAが死亡すると、\nBはすでに死亡している。\n↓\n一定の要件を満たせば、\nCがBに代わってAを相続する。\n⸻","blanks":["代襲相続","被相続人より先に死亡している"],"options":[["代襲相続","権利能力","買います","意思能力"],["被相続人より先に死亡している","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"]],"mode":"civil"},"9":{"text":"代襲相続がさらに連続する場合、\n再代襲\nが問題になる。\nただし、誰についても無制限に再代襲が認められるわけではない。\nしたがって、\n「相続人が先に死んでいたら、とにかくその子孫全員が相続する」\nと単純に考えてはいけない。\n⸻","blanks":["したがって、","と単純に考えてはいけない。"],"options":[["したがって、","お金を借りる","従業員を雇う","典型的には、"],["と単純に考えてはいけない。","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"]],"mode":"civil"},"10":{"text":"子がいない場合、\n直系尊属\nが相続人となる。\n代表的には、\n•\t父\n•\t母\n•\t祖父母\nなど。\nただし、\nより近い世代の直系尊属が優先する。\n⸻","blanks":["祖父母","直系尊属"],"options":[["祖父母","取消し","不確実","所有権"],["直系尊属","権利能力","買います","意思能力"]],"mode":"civil"},"11":{"text":"子も直系尊属もいない場合、\n兄弟姉妹\nが相続人となる。\n兄弟姉妹にも、\n代襲相続\nが問題となる。\nただし、兄弟姉妹の代襲には特別な制限がある。\n⸻","blanks":["兄弟姉妹","兄弟姉妹にも、"],"options":[["兄弟姉妹","権利能力","買います","意思能力"],["兄弟姉妹にも、","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"12":{"text":"本来なら相続人となる者でも、\n被相続人を殺害するなど、一定の重大な行為\nをした場合には、\n相続人としての資格を失う\nことがある。\nこれを相続欠格という。\n⸻","blanks":["相続欠格","相続人としての資格を失う"],"options":[["相続欠格","権利能力","買います","意思能力"],["相続人としての資格を失う","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"]],"mode":"civil"},"13":{"text":"被相続人の意思によって、\n一定の相続人から相続資格を奪う\n制度が廃除。\nただし、\n被相続人が好き嫌いで自由に相続人を排除できる制度\nではない。\n法律上定められた重大な事由が必要となる。\n⸻","blanks":["被相続人の意思によって、","一定の相続人から相続資格を奪う"],"options":[["被相続人の意思によって、","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["一定の相続人から相続資格を奪う","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"]],"mode":"civil"},"14":{"text":"制度\t原因\t主体\n相続欠格\t法定された重大な行為\t法律上当然に資格を失う\n廃除\t虐待・重大な侮辱等の一定事由\t被相続人の意思＋法定手続\n共通するのは、\n相続人としての資格を失わせる\nということ。\n⸻","blanks":["制度\t原因\t主体","共通するのは、"],"options":[["制度\t原因\t主体","どのような意思で","変更・管理・保存","保険金が発生した"],["共通するのは、","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"15":{"text":"相続される財産は、\n被相続人の財産上の権利義務\nである。\n例えば、\n•\t所有権\n•\t預金\n•\t売買代金請求権\n•\t貸金返還請求権\n•\t株式\n•\t賃貸借上の権利\nなど。\n⸻","blanks":["所有権","預金","売買代金請求権","貸金返還請求権"],"options":[["所有権","取消し","不確実","第三者"],["預金","民法","総則","胎児"],["売買代金請求権","結婚・離婚する","必ず絶対に従う","というケース。"],["貸金返還請求権","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"16":{"text":"すべての権利義務が相続されるわけではない。\n例えば、\n一身専属的な権利義務\nは原則として相続されない。\nしたがって、\n「死亡した人の権利は全部相続人へ移る」\nとは考えない。\n⸻","blanks":["死亡した人の権利は全部相続人へ移る","一身専属的な権利義務"],"options":[["死亡した人の権利は全部相続人へ移る","試験に合格したら100万円をあげる","債務者が持っている権利を行使しない","人――権利能力・意思能力・行為能力"],["一身専属的な権利義務","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"17":{"text":"相続では、\nプラスの財産だけではなく、マイナスの財産も問題になる。\n例えば、\nAが\n•\t預金1,000万円\n•\t借金500万円\nを残して死亡。\n↓\n相続人は、\n一定のルールに従って債務も承継する。\nこの点が、\n相続＝財産をもらえる\nだけではない重要なポイント。\n⸻","blanks":["相続","預金1,000万円","借金500万円","財産をもらえる"],"options":[["相続","民法","総則","胎児"],["預金1,000万円","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["借金500万円","結婚・離婚する","必ず絶対に従う","というケース。"],["財産をもらえる","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"18":{"text":"複数の相続人がいる場合、\n相続債務がどのように承継されるか\nが問題になる。\n特に、\n•\t可分債務\n•\t不可分債務\n•\t連帯債務\n•\t保証債務\nなど、債務の性質によって検討する必要がある。\n⸻","blanks":["可分債務","不可分債務","連帯債務","保証債務"],"options":[["可分債務","権利能力","買います","意思能力"],["不可分債務","権利の主体","土地を買う","次の「物権"],["連帯債務","権利能力","買います","意思能力"],["保証債務","権利能力","買います","意思能力"]],"mode":"civil"},"19":{"text":"相続人が複数いる場合、\n法律が定めた相続割合\nを法定相続分という。\n例えば、\n配偶者＋子\nの場合、\n原則として、\n配偶者　1/2\n子全体　1/2\nとなる。\n子が2人なら、\n配偶者　1/2\n子A　　1/4\n子B　　1/4\nとなる。\n⸻","blanks":["法律が定めた相続割合","を法定相続分という。"],"options":[["法律が定めた相続割合","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["を法定相続分という。","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"20":{"text":"子がいない場合、\n配偶者＋直系尊属\nという組み合わせになる。\n原則として、\n配偶者　2/3\n直系尊属全体　1/3\nとなる。\n⸻","blanks":["配偶者＋直系尊属","配偶者　2/3"],"options":[["配偶者＋直系尊属","どのような意思で","変更・管理・保存","保険金が発生した"],["配偶者　2/3","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"21":{"text":"子も直系尊属もいない場合、\n配偶者＋兄弟姉妹\nとなる。\n原則として、\n配偶者　3/4\n兄弟姉妹全体　1/4\nとなる。\n⸻","blanks":["配偶者＋兄弟姉妹","配偶者　3/4"],"options":[["配偶者＋兄弟姉妹","どのような意思で","変更・管理・保存","保険金が発生した"],["配偶者　3/4","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"22":{"text":"法定相続分は、\n「最終的に必ずこの割合で財産を分けなければならない」\nという意味ではない。\nまず、\n法律が定めた基本的な割合\nである。\nその後、\n遺産分割協議\nなどによって具体的な財産の取得方法を決める。\n⸻","blanks":["法定相続分は、","という意味ではない。"],"options":[["法定相続分は、","結婚・離婚する","必ず絶対に従う","というケース。"],["という意味ではない。","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"23":{"text":"被相続人は、\n遺言によって相続分を指定する\nことができる。\nしたがって、\n法定相続分\n↓\n法律が定めた割合\n指定相続分\n↓\n被相続人が遺言で指定\nという違いがある。\n⸻","blanks":["被相続人は、","遺言によって相続分を指定する"],"options":[["被相続人は、","お金を借りる","従業員を雇う","典型的には、"],["遺言によって相続分を指定する","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"]],"mode":"civil"},"24":{"text":"共同相続人の中に、\n生前贈与などによって特別な利益を受けた者\nがいる場合、\nその者だけが先に多くの財産を受け取っている\nという不公平が生じることがある。\nそこで、\n特別受益\nを相続分の計算に反映させる制度がある。\n⸻","blanks":["共同相続人の中に、","という不公平が生じることがある。"],"options":[["共同相続人の中に、","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["という不公平が生じることがある。","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"]],"mode":"civil"},"25":{"text":"逆に、\n被相続人の財産の維持・増加に特別な貢献をした相続人\nがいる場合には、\n寄与分\nが問題になる。\n例えば、\n•\t被相続人の事業を無償で長期間手伝った\n•\t被相続人の財産維持に特別な貢献をした\nなど。\n⸻","blanks":[],"options":[],"mode":"civil"},"26":{"text":"相続人ではない親族が、\n被相続人の療養看護などについて特別な貢献\nをした場合には、\n特別寄与\nが問題になることがある。\nこれは、\n「相続人ではない親族の貢献」\nを一定の範囲で考慮する制度。\n⸻","blanks":["相続人ではない親族の貢献","相続人ではない親族が、"],"options":[["相続人ではない親族の貢献","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["相続人ではない親族が、","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"27":{"text":"相続では、\n法定相続分だけを見るのでは不十分。\n実際には、\n法定相続人\n↓\n法定相続分\n↓\n指定相続分\n↓\n特別受益\n↓\n寄与分\n↓\n具体的相続分\nという流れで考える。\n⸻","blanks":["相続では、","実際には、"],"options":[["相続では、","権利の主体","土地を買う","次の「物権"],["実際には、","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"28":{"text":"相続人が複数いる場合、\n相続開始時には共同相続人が相続財産を共有する状態\nになる。\nそこで、\n誰がどの財産を取得するのか\nを決める。\nこれが遺産分割。\n⸻","blanks":["遺産分割","そこで、"],"options":[["遺産分割","権利能力","買います","意思能力"],["そこで、","権利能力","買います","意思能力"]],"mode":"civil"},"29":{"text":"相続人全員で、\n「この財産は誰が取得するか」\nを話し合う。\nこれが遺産分割協議。\n例えば、\n土地 → 長男\n預金 → 次男\n株式 → 長女\nなどと決める。\n⸻","blanks":["この財産は誰が取得するか","遺産分割協議"],"options":[["この財産は誰が取得するか","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["遺産分割協議","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"30":{"text":"遺産分割では、\n現物分割\n財産そのものを分ける。\n代償分割\n一人が財産を取得し、他の相続人に金銭などを支払う。\n換価分割\n財産を売却し、代金を分ける。\nなどの方法がある。\n⸻","blanks":["遺産分割では、","現物分割"],"options":[["遺産分割では、","結婚・離婚する","必ず絶対に従う","というケース。"],["現物分割","権利能力","買います","意思能力"]],"mode":"civil"},"31":{"text":"相続開始時には、\n相続財産について共同相続人による共有関係\nが生じる。\nその後、\n遺産分割\nによって具体的な帰属を決める。\n⸻","blanks":["相続開始時には、","が生じる。"],"options":[["相続開始時には、","どのような意思で","変更・管理・保存","保険金が発生した"],["が生じる。","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"32":{"text":"現在の相続法では、\n相続開始から長期間経過した場合の遺産分割\nについて重要なルールがある。\n原則として、\n相続開始から10年を経過した後の遺産分割では、具体的相続分を考慮せず、法定相続分または指定相続分による分割が基本となる。\nこれは、\n長期間遺産分割をしないことによって、法律関係がいつまでも不安定になること\nを防ぐための制度である。\n⸻","blanks":["現在の相続法では、","について重要なルールがある。"],"options":[["現在の相続法では、","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["について重要なルールがある。","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"]],"mode":"civil"},"33":{"text":"相続人は、\n相続をそのまま受けるか\n限定承認するか\n放棄するか\nを選択できる。\n⸻","blanks":["相続人は、","相続をそのまま受けるか"],"options":[["相続人は、","権利の主体","土地を買う","次の「物権"],["相続をそのまま受けるか","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"34":{"text":"単純承認とは、\n被相続人の権利義務をそのまま承継する\nこと。\nプラスの財産だけでなく、\nマイナスの財産も承継する。\n⸻","blanks":["単純承認","プラスの財産だけでなく、"],"options":[["単純承認","権利能力","買います","意思能力"],["プラスの財産だけでなく、","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"]],"mode":"civil"},"35":{"text":"限定承認とは、\n相続によって得た財産の限度で、被相続人の債務などを弁済する\n制度。\nイメージは、\n相続財産\n↓\n1000万円\n相続債務\n↓\n1500万円\n限定承認\n↓\n原則として相続財産1000万円の範囲\nである。\n⸻","blanks":["限定承認","イメージは、"],"options":[["限定承認","権利能力","買います","意思能力"],["イメージは、","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"36":{"text":"相続放棄とは、\n相続人としての地位を放棄すること\nである。\n例えば、\n被相続人に多額の借金がある場合、\n相続放棄\nを検討することになる。\n⸻","blanks":["相続放棄","相続人としての地位を放棄すること"],"options":[["相続放棄","権利能力","買います","意思能力"],["相続人としての地位を放棄すること","Aの土地をBに売ったことにしよう","どのような法律効果を発生させるか","条件\t将来発生するか不確実な事実"]],"mode":"civil"},"37":{"text":"相続放棄は、\n「財産はいらない」\nという単純な意思表示ではない。\n家庭裁判所への申述など、\n法律上の手続\nが必要。\nまた、相続放棄には期間制限がある。\n⸻","blanks":["財産はいらない","相続放棄は、"],"options":[["財産はいらない","結婚・離婚する","必ず絶対に従う","というケース。"],["相続放棄は、","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"38":{"text":"相続人は、\n自己のために相続の開始があったことを知った時から3か月以内\nに、原則として、\n•\t単純承認\n•\t限定承認\n•\t相続放棄\nについて判断する。\nこの期間を、\n熟慮期間\nという。\n⸻","blanks":["単純承認","限定承認","相続放棄"],"options":[["単純承認","権利能力","買います","意思能力"],["限定承認","権利能力","買います","意思能力"],["相続放棄","権利能力","買います","意思能力"]],"mode":"civil"},"39":{"text":"3か月という期間内に、\n「相続するか放棄するか」\nを判断するには、\n•\t預金\n•\t不動産\n•\t借金\n•\t保証債務\n•\t税金\n•\tその他の債務\nなどを調査する必要がある。\nそのため、\n相続開始を知ったら、早期に財産・債務を調査する\nことが重要。\n⸻","blanks":["相続するか放棄するか","預金","不動産","借金"],"options":[["相続するか放棄するか","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["預金","民法","総則","胎児"],["不動産","取消し","不確実","所有権"],["借金","民法","総則","胎児"]],"mode":"civil"},"40":{"text":"遺言とは、\n被相続人が死亡後の財産関係などについて、一定の方式に従って意思を表示するもの\nである。\n遺言によって、\n•\t財産の承継\n•\t遺贈\n•\t遺言執行者の指定\n•\t子の認知\nなど、法律上一定の効果を発生させることができる。\n⸻","blanks":["遺言","財産の承継","遺贈","遺言執行者の指定"],"options":[["遺言","民法","総則","胎児"],["財産の承継","権利の主体","土地を買う","次の「物権"],["遺贈","民法","総則","胎児"],["遺言執行者の指定","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"41":{"text":"代表的な普通方式として、\n自筆証書遺言\n本人が自書する方式。\n公正証書遺言\n公証人が関与して作成する方式。\n秘密証書遺言\n内容を秘密にしたまま、一定の方式で作成する方式。\nがある。\n⸻","blanks":["代表的な普通方式として、","自筆証書遺言"],"options":[["代表的な普通方式として、","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["自筆証書遺言","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"42":{"text":"自筆証書遺言では、\n民法が定める方式\nを守る必要がある。\n方式を欠くと、\n遺言としての効力が問題となる。\nまた、自筆証書遺言書の保管制度も存在する。\n⸻","blanks":["自筆証書遺言では、","民法が定める方式"],"options":[["自筆証書遺言では、","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["民法が定める方式","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"43":{"text":"公正証書遺言は、\n公証人が関与して作成する。\nそのため、\n•\t方式上の安全性\n•\t原本の保管\n•\t紛失リスクの低減\nなどのメリットがある。\n⸻","blanks":["方式上の安全性","原本の保管","紛失リスクの低減"],"options":[["方式上の安全性","結婚・離婚する","必ず絶対に従う","というケース。"],["原本の保管","権利の主体","土地を買う","次の「物権"],["紛失リスクの低減","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"44":{"text":"遺言は、\n原則として遺言者の死亡によって効力が生じる。\nただし、\n遺言の内容\n遺言の方式\n遺言能力\n遺言の解釈\nなどが問題になることがある。\n⸻","blanks":["遺言は、","ただし、"],"options":[["遺言は、","権利能力","買います","意思能力"],["ただし、","権利能力","買います","意思能力"]],"mode":"civil"},"45":{"text":"遺贈とは、\n遺言によって財産を他人に与えること。\n例えば、\nA死亡\n↓\n遺言\n「土地をBに遺贈する」\n↓\nB\nのような場合。\n相続人ではない者に財産を承継させることもできる。\n⸻","blanks":["遺贈","土地をBに遺贈する"],"options":[["遺贈","民法","総則","胎児"],["土地をBに遺贈する","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"46":{"text":"相続\n法律上の相続人が財産を承継。\n遺贈\n遺言によって財産を与える。\nつまり、\n相続\n↓\n相続人\n遺贈\n↓\n遺言によって指定された受遺者\nという違い。\n⸻","blanks":["法律上の相続人が財産を承継。","遺言によって財産を与える。"],"options":[["法律上の相続人が財産を承継。","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"],["遺言によって財産を与える。","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"]],"mode":"civil"},"47":{"text":"遺言の内容を実現するため、\n遺言執行者\nが置かれる場合がある。\n遺言執行者は、\n遺言の内容を実現するために必要な行為\nを行う。\n⸻","blanks":["遺言の内容を実現するため、","遺言執行者"],"options":[["遺言の内容を実現するため、","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["遺言執行者","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"48":{"text":"遺言者は、\n一定の方式に従って遺言を撤回することができる。\nまた、後の遺言と前の遺言が抵触する場合には、\n後の遺言によって前の遺言が撤回されたものとして扱われる部分\nが問題となる。\n⸻","blanks":["遺言者は、"],"options":[["遺言者は、","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"49":{"text":"遺言によって、\n「財産を全部第三者にあげる」\nとされると、\n一定の近親者がまったく財産を受け取れなくなる場合がある。\nそこで、\n一定の相続人に最低限保障される財産的利益\nを遺留分という。\n⸻","blanks":["財産を全部第三者にあげる","遺言によって、"],"options":[["財産を全部第三者にあげる","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["遺言によって、","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"50":{"text":"遺留分を持つのは、\n一定の相続人。\n代表的には、\n•\t配偶者\n•\t子\n•\t直系尊属\nなど。\nただし、\n兄弟姉妹には遺留分がない。\n⸻","blanks":["配偶者","直系尊属"],"options":[["配偶者","取消し","不確実","所有権"],["直系尊属","権利能力","買います","意思能力"]],"mode":"civil"},"51":{"text":"遺留分は、\n「遺言を無効にする制度」\nではない。\n例えば、\nAの遺言\n「全財産をBに与える」\nという遺言自体が当然に無効になるわけではない。\n一定の遺留分権利者は、\n遺留分侵害額に相当する金銭の支払い\nを請求できる。\n⸻","blanks":["遺言を無効にする制度","全財産をBに与える"],"options":[["遺言を無効にする制度","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"],["全財産をBに与える","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"52":{"text":"現在の制度では、\n遺留分を侵害された者が、一定の要件のもとで金銭の支払いを請求する\nという仕組みが基本。\nしたがって、\n遺言\n↓\nBが多く取得\n↓\nAの遺留分が侵害\n↓\nA\n↓\n遺留分侵害額請求\n↓\n金銭請求\nという流れで理解する。\n⸻","blanks":["現在の制度では、","という仕組みが基本。"],"options":[["現在の制度では、","どのような意思で","変更・管理・保存","保険金が発生した"],["という仕組みが基本。","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"53":{"text":"この2つは絶対に混同しない。\n法定相続分\n法律が定める基本的な相続割合。\n遺留分\n一定の相続人に保障される最低限の財産的利益。\nつまり、\n法定相続分＝通常の相続割合\n遺留分＝遺言などによって侵害された場合の最低保障\nと理解する。\n⸻","blanks":["法定相続分","遺留分","通常の相続割合"],"options":[["法定相続分","権利の主体","土地を買う","次の「物権"],["遺留分","取消し","不確実","所有権"],["通常の相続割合","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"54":{"text":"相続人でない者が、\n相続人であるかのように相続財産を占有・処分している\n場合などに、\n真の相続人が相続権を回復するための制度\nが問題となる。\n⸻","blanks":["相続人でない者が、"],"options":[["相続人でない者が、","完全に法律上無関係","その契約を認めます","Bには代理権がある"]],"mode":"civil"},"55":{"text":"相続によって財産を取得した場合でも、\n第三者との関係\nでは、\n•\t登記\n•\t対抗要件\n•\t遺産分割\n•\t法定相続分\nなどが問題となる。\n特に不動産では、\n相続したから放置してよい\nとはならない。\n⸻","blanks":["登記","対抗要件","遺産分割","法定相続分"],"options":[["登記","民法","総則","胎児"],["対抗要件","権利能力","買います","意思能力"],["遺産分割","権利能力","買います","意思能力"],["法定相続分","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"56":{"text":"現在、\n相続登記は義務化されている。\n2024年4月1日から、\n不動産を相続したことを知った日から原則3年以内\nに相続登記を申請する必要がある。正当な理由なく義務に違反すると、10万円以下の過料の対象となる場合がある。(法務省)\n⸻","blanks":["相続登記は義務化されている。","2024年4月1日から、"],"options":[["相続登記は義務化されている。","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"],["2024年4月1日から、","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"]],"mode":"civil"},"57":{"text":"遺産分割協議がまとまらず、\n誰が不動産を取得するのか決まらない\n場合には、\n相続人申告登記\nという制度がある。\nこれは、\n自分が相続人であることを申告することで、相続登記の申請義務を簡易に履行するための制度。\nただし、\n実際の所有権取得を公示する相続登記とは異なる。\nしたがって、\n相続人申告登記\n≠\n最終的な相続登記\nである。(法務局)\n⸻","blanks":["遺産分割協議がまとまらず、","相続人申告登記"],"options":[["遺産分割協議がまとまらず、","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["相続人申告登記","結婚・離婚する","必ず絶対に従う","というケース。"]],"mode":"civil"},"58":{"text":"不動産を相続した場合、\n死亡\n↓\n相続人確認\n↓\n戸籍等収集\n↓\n相続財産調査\n↓\n遺言確認\n↓\n遺産分割\n↓\n登記\nという流れになる。\n実務では、\n「誰が相続人か」\nを確定するために戸籍の収集が重要。\n⸻","blanks":["誰が相続人か","相続人確認"],"options":[["誰が相続人か","お金を借りる","従業員を雇う","典型的には、"],["相続人確認","権利の主体","土地を買う","次の「物権"]],"mode":"civil"},"59":{"text":"相続した土地について、\n管理負担などを理由に手放したい\nという場合には、\n相続土地国庫帰属制度\nが問題となる。\nただし、\nどんな土地でも無条件で国が引き取る制度\nではない。\n一定の要件を満たし、承認を受ける必要がある。\n⸻","blanks":["相続した土地について、","相続土地国庫帰属制度"],"options":[["相続した土地について、","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"],["相続土地国庫帰属制度","この車、1円で売るよ","時効の利益を受けます","いつ所有権が移るのか"]],"mode":"civil"},"60":{"text":"相続法は、\n民法だけで完結しない。\n相続した財産については、\n相続税法\nなども関係する。\nしたがって実務では、\n民法\n↓\n誰が相続人か\n↓\n何を相続するか\n↓\nどの割合か\n＋\n税法\n↓\n相続税はいくらか\nと分けて考える。\n⸻","blanks":["相続法は、","民法だけで完結しない。"],"options":[["相続法は、","権利の主体","土地を買う","次の「物権"],["民法だけで完結しない。","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"61":{"text":"相続事件を見たら、\n① 相続開始\n誰が死亡したのか。\n↓\n② 相続人\n誰が法定相続人なのか。\n↓\n③ 相続資格\n欠格・廃除・代襲などはないか。\n↓\n④ 相続財産\n何が相続されるのか。\n↓\n⑤ 債務\n借金などは存在するか。\n↓\n⑥ 遺言\n遺言はあるか。\n↓\n⑦ 相続分\n法定相続分・指定相続分はどうなるか。\n↓\n⑧ 特別受益・寄与分\n相続人間の調整が必要か。\n↓\n⑨ 遺産分割\n誰がどの財産を取得するか。\n↓\n⑩ 遺留分\n遺留分侵害はないか。\n↓\n⑪ 承認・放棄\n相続を受けるのか、放棄するのか。\n↓\n⑫ 登記・名義変更\n必要な手続をする。\n⸻","blanks":["相続事件を見たら、","① 相続開始"],"options":[["相続事件を見たら、","完全に法律上無関係","その契約を認めます","Bには代理権がある"],["① 相続開始","お金を借りる","従業員を雇う","典型的には、"]],"mode":"civil"},"62":{"text":"Aが死亡。\n相続人は、\n•\t妻B\n•\t子C\n•\t子D\nだった。\n財産は、\n•\t土地\n•\t預金\n•\t株式\nだった。\nこの場合、\nA死亡\n↓\nB・C・Dが相続人\n↓\n法定相続分を確認\n↓\n遺言の有無を確認\n↓\n相続財産を調査\n↓\n遺産分割協議\n↓\n土地・預金・株式を分配\n↓\n必要に応じて名義変更・相続登記\nとなる。\n⸻","blanks":["妻B","子C","子D","土地"],"options":[["妻B","民法","総則","胎児"],["子C","民法","総則","胎児"],["子D","民法","総則","胎児"],["土地","民法","総則","胎児"]],"mode":"civil"},"63":{"text":"Aが死亡。\n財産：\n1,000万円\n借金：\n3,000万円\n相続人：\nB・C\nこの場合、\n「財産が1,000万円あるから相続しよう」\nと簡単に判断してはいけない。\nまず、\n相続債務を調査。\nそのうえで、\n•\t単純承認\n•\t限定承認\n•\t相続放棄\nを検討する。\n⸻","blanks":["単純承認","限定承認","相続放棄"],"options":[["単純承認","権利能力","買います","意思能力"],["限定承認","権利能力","買います","意思能力"],["相続放棄","権利能力","買います","意思能力"]],"mode":"civil"},"64":{"text":"Aが死亡。\n相続人：\n•\t妻B\n•\t子C\nAの遺言：\n「全財産をBに相続させる。」\nこの場合、\nまず、\n遺言の効力\nを確認。\nそのうえで、\nCの遺留分\nを検討する。\nつまり、\n遺言\n↓\nBが全財産を取得\n↓\nCの遺留分を確認\n↓\n遺留分侵害があれば\n↓\n遺留分侵害額請求\nという流れ。\n⸻","blanks":["妻B","子C","全財産をBに相続させる"],"options":[["妻B","民法","総則","胎児"],["子C","民法","総則","胎児"],["全財産をBに相続させる","民法に書いてあるルール","第三者に主張できること","取引行為による占有取得"]],"mode":"civil"},"65":{"text":"Aには、\n•\t子B\n•\t子C\nがいる。\nAは生前、\nBに多額の贈与\nをしていた。\nA死亡。\nこの場合、\nBとCを単純に1/2ずつにすると公平か\nという問題が生じる。\nそこで、\n特別受益\nを検討する。\n⸻","blanks":["子B","子C"],"options":[["子B","民法","総則","胎児"],["子C","民法","総則","胎児"]],"mode":"civil"},"66":{"text":"Aには、\n•\t子B\n•\t子C\nがいる。\nBは長期間Aの事業を手伝い、\nAの財産形成・維持に特別な貢献\nをした。\nこの場合、\n寄与分\nを検討する。\n⸻","blanks":["子B","子C"],"options":[["子B","民法","総則","胎児"],["子C","民法","総則","胎児"]],"mode":"civil"},"67":{"text":"制度\t意味\n法定相続人\t法律によって相続人となる者\n法定相続分\t法律が定めた基本的な相続割合\n指定相続分\t遺言によって指定された相続割合\n代襲相続\t本来の相続人に代わってその子などが相続\n特別受益\t生前贈与等を相続分の計算で考慮\n寄与分\t相続財産への特別な貢献を考慮\n遺産分割\t具体的な財産の帰属を決める\n単純承認\t相続をそのまま承継\n限定承認\t相続財産の限度で債務等を弁済\n相続放棄\t相続人としての地位を放棄\n遺言\t死後の財産関係等についての意思表示\n遺贈\t遺言によって財産を与える\n遺留分\t一定の相続人に保障される最低限の財産的利益\n遺留分侵害額請求\t遺留分侵害について金銭の支払いを求める\n相続登記\t相続による不動産の権利関係を登記\n相続人申告登記\t相続登記義務を簡易に履行する制度\n⸻","blanks":["制度\t意味","単純承認\t相続をそのまま承継"],"options":[["制度\t意味","権利の主体","土地を買う","次の「物権"],["単純承認\t相続をそのまま承継","この車を100万円で売ります","誰のために法律行為をしたのか","代理権があるように見える事情"]],"mode":"civil"},"68":{"text":"相続\n│\n被相続人死亡\n│\n┌──────┴──────┐\n│             │\n相続人        相続財産\n│             │\n┌───────┼──────┐      ├──積極財産\n│       │      │      └──消極財産\n配偶者   子   直系尊属\n│\n兄弟姉妹\n│\n代襲相続\n│\n┌─────┴─────┐\n│           │\n法定相続分    遺言\n│           │\n│        遺贈・指定\n│           │\n└─────┬─────┘\n│\n特別受益・寄与分\n│\n遺産分割\n│\n┌────────────┼────────────┐\n│            │            │\n現物分割      代償分割      換価分割\n│\n↓\n各相続人が取得\n│\n┌─────┼──────┐\n│     │      │\n登記  名義変更  税務\n＋\n遺留分\n│\n遺留分侵害額請求\n＋\n承認・放棄\n│\n┌─────┼─────┐\n│     │     │\n単純承認 限定承認 相続放棄\n⸻","blanks":["被相続人死亡","┌──────┴──────┐"],"options":[["被相続人死亡","お金を借りる","従業員を雇う","典型的には、"],["┌──────┴──────┐","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"]],"mode":"civil"},"69":{"text":"第6編で学んだ親族法と相続法は直接つながっている。\n例えば、\n婚姻\n↓\n配偶者\n↓\n相続人\nまた、\n親子\n↓\n子\n↓\n相続人\nさらに、\n養子\n↓\n法律上の親子関係\n↓\n相続関係\nとなる。\nしたがって、\n親族法を理解しなければ相続法を完全には理解できない。\n⸻","blanks":["さらに、","法律上の親子関係"],"options":[["さらに、","権利能力","買います","意思能力"],["法律上の親子関係","どのような意思で","変更・管理・保存","保険金が発生した"]],"mode":"civil"},"70":{"text":"これまで学んだ第1編〜第7編は、バラバラではない。\n第1編 総則\n↓\n法律行為・意思表示・代理・時効\n↓\n第2編 物権\n↓\n所有権・共有・担保物権\n↓\n第3編 債権総論\n↓\n債権・債務・履行・損害賠償\n↓\n第4編 契約\n↓\n売買・賃貸借・請負等\n↓\n第5編 事務管理・不当利得・不法行為\n↓\n契約以外から生じる債権\n↓\n第6編 親族\n↓\n婚姻・親子・養子・親権\n↓\n第7編 相続\n↓\n死亡後の財産承継\nこれで民法の基本体系が一周する。\n⸻","blanks":["第1編 総則","法律行為・意思表示・代理・時効"],"options":[["第1編 総則","お金を借りる","従業員を雇う","典型的には、"],["法律行為・意思表示・代理・時効","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"]],"mode":"civil"},"71":{"text":"相続法で最も重要なのは、\n「誰が、何を、どのような根拠で、どれだけ承継するのか」\nを順番に考えることである。\nつまり、\n誰が？\n↓\n相続人\n何を？\n↓\n相続財産\nどれだけ？\n↓\n法定相続分・指定相続分\n調整は？\n↓\n特別受益・寄与分\n具体的に誰が取得？\n↓\n遺産分割\n遺言によって侵害された最低保障は？\n↓\n遺留分\n借金が多い場合は？\n↓\n承認・放棄\n不動産なら？\n↓\n相続登記\nという構造。\n⸻","blanks":["相続法で最も重要なのは、","つまり、"],"options":[["相続法で最も重要なのは、","この車を100万円で売る","どのような法律行為をして","所有権を何％持っているか"],["つまり、","権利能力","買います","意思能力"]],"mode":"civil"},"72":{"text":"相続の基本\n1.\t相続とは何か。\n2.\t相続はいつ開始するか。\n3.\t誰が法定相続人になるか。\n4.\t配偶者の相続上の地位はどうなっているか。\n5.\t代襲相続とは何か。\n6.\t相続欠格と廃除の違いは何か。\n相続財産\n7.\t何が相続財産になるか。\n8.\t相続されない権利義務とは何か。\n9.\t債務も相続されるのはなぜか。\n相続分\n10.\t法定相続分とは何か。\n11.\t指定相続分とは何か。\n12.\t法定相続分と遺留分の違いは何か。\n13.\t特別受益とは何か。\n14.\t寄与分とは何か。\n15.\t特別寄与とは何か。\n遺産分割\n16.\t遺産分割とは何か。\n17.\t遺産分割協議とは何か。\n18.\t現物分割とは何か。\n19.\t代償分割とは何か。\n20.\t換価分割とは何か。\n21.\t相続開始から長期間経過した場合の遺産分割にどのようなルールがあるか。\n承認・放棄\n22.\t単純承認とは何か。\n23.\t限定承認とは何か。\n24.\t相続放棄とは何か。\n25.\t熟慮期間とは何か。\n26.\tなぜ相続財産の調査が重要なのか。\n遺言\n27.\t遺言とは何か。\n28.\t自筆証書遺言とは何か。\n29.\t公正証書遺言とは何か。\n30.\t遺贈とは何か。\n31.\t遺言執行者とは何か。\n32.\t遺言は撤回できるか。\n遺留分\n33.\t遺留分とは何か。\n34.\t誰に遺留分があるか。\n35.\t兄弟姉妹に遺留分がないのはなぜか。\n36.\t遺留分侵害額請求とは何か。\n37.\t遺留分は遺言を無効にする制度なのか。\n実務\n38.\t相続登記とは何か。\n39.\t相続登記はいつまでにする必要があるか。\n40.\t相続人申告登記とは何か。\n41.\t相続法と相続税法はどう違うか。\n42.\t相続事件を分析するとき、最初に何を確認するべきか。\n⸻","blanks":["相続の基本","相続財産"],"options":[["相続の基本","権利の主体","土地を買う","次の「物権"],["相続財産","権利能力","買います","意思能力"]],"mode":"civil"},"73":{"text":"相続法は、\n「死亡した人の財産関係を、誰にどのように承継させるか」\nを規律する。\n基本構造は、\n死亡\n↓\n相続開始\n↓\n相続人の確定\n↓\n相続財産の確定\n↓\n法定相続分・指定相続分\n↓\n特別受益・寄与分\n↓\n遺産分割\n↓\n財産の具体的取得\n↓\n登記・名義変更等\nそして、これとは別に、\n遺言\n↓\n指定・遺贈\n↓\n遺留分\nというルートがある。\nさらに、\n相続債務\n↓\n承認・放棄\n↓\n単純承認\n限定承認\n相続放棄\nというルートがある。\n⸻\n民法 基礎体系 完成\nこれで、\n第1編　民法総則\n第2編　物権\n第3編　債権総論\n第4編　契約・債権各論\n第5編　事務管理・不当利得・不法行為\n第6編　親族\n第7編　相続\nが一通り完成する。\nつまり、\n民法の「基本体系を理解するための基礎本」\nとして一周した状態になる。\nただし、ここで終わりではない。\n次の段階では、\n基礎本\n↓\n総合教科書\n↓\n判例\n↓\n理論・学説\n↓\n論点\n↓\n事例問題\n↓\n実務\n↓\n発展・研究\nと進む。\n特に総合教科書では、\n•\t法律構成\n•\t学説対立\n•\t判例の射程\n•\t条文解釈\n•\t要件事実\n•\t具体的事案への適用\nを深く学ぶ。\nしたがって、この第7編までの基礎本は、\n「答えを全部暗記するための本」ではなく、「民法の問題を見たとき、どの制度を使って考えるのか分かるようにする本」\nとして使う。\n民法全体の最終的な思考順序は、\n条文 → 法律関係 → 要件 → 効果 → 事実への適用 → 結論\nである。\nこれができるようになれば、次の「総合教科書」の学習に進む土台が完成する。","blanks":["基本体系を理解するための基礎本","総合教科書","答えを全部暗記するための本","できるようになれば、次の「総合教科書"],"options":[["基本体系を理解するための基礎本","自分の土地だから何をしてもいい","事実上支配している状態そのもの","前の占有者から次の占有者へ承継"],["総合教科書","権利の主体","土地を買う","次の「物権"],["答えを全部暗記するための本","誰が実際に意思表示をしたか","Aの代理人として契約します","本当にこの人が所有者なのか"],["できるようになれば、次の「総合教科書","私の代理人としてCから車を買ってきて","この問題は物権のどの部分の問題なのか","売買で債務不履行が起きたらどうなる？"]],"mode":"civil"}}}};

会党は自民党の半分程度の勢力の野党第一党にとどまった。この状態を指して「1と2分の1政党制」といわれた。\n\n────────────\n\n【解説2】\n日本初の本格的政党内閣は、第一次憲政擁護運動後に成立した原敬内閣（1918～1921年）。なお、日本初の政党内閣は、板垣退助が内務大臣として入閣したため「隈板内閣」と呼ばれた第一次大隈重信内閣（1898年）である。\n\n────────────\n\n【解説3】\n2009年には民主党を中心とする鳩山由紀夫内閣が成立した。また、2009年の自民党から民主党への政権交代は、「構造改革」路線への批判というよりも、政治不信によるものだった。なお、鳩山内閣の退陣後に菅直人が民主党の党首を引き継ぎ、菅内閣が成立した。\n\n────────────\n\n【解説4】\n1955年に左右に分裂していた社会党の統一に続き、保守合同で自民党が結成された。保守合同とは、自民党の前身である自由党と日本民主党の合流のことをいう。社会党は革新政党であるのに対し、自民党は保守政党と見なされている。\n\n────────────\n\n【解説5】\n「村山内閣」の部分が誤りで、正しくは「細川内閣」。非自民8党派の一つである日本新党の党首だった細川護熙を首班とする内閣が成立した。だが、非自民政権は社会党と新党さきがけの政権離脱によって1年足らずで崩壊し、社会党の党首だった村山富市を首班とする、社会党・自民党・新党さきがけによる連立政権が成立した。","blanks":["55年体制","社会党","1と2分の1政党制","原敬内閣","1918～1921年","隈板内閣","2009年","鳩山由紀夫内閣","菅直人","1955年","保守合同","自由党と日本民主党","細川内閣","細川護熙","村山富市"],"options":[["55年体制","45年体制","65年体制","戦前体制"],["社会党","民主党","日本新党","自由党"],["1と2分の1政党制","二大政党制","一党独裁制","比例代表制"],["原敬内閣","鳩山内閣","細川内閣","村山内閣"],["1918～1921年","1898～1901年","1945～1948年","1955～1958年"],["隈板内閣","第一次原内閣","鳩山内閣","細川内閣"],["2009年","1993年","2001年","2012年"],["鳩山由紀夫内閣","菅直人内閣","細川護熙内閣","村山富市内閣"],["菅直人","原敬","細川護熙","村山富市"],["1955年","1945年","1960年","1972年"],["保守合同","政権交代","社会党統一","政党分裂"],["自由党と日本民主党","社会党と自民党","民主党と自由党","日本新党と社会党"],["細川内閣","村山内閣","鳩山内閣","原敬内閣"],["細川護熙","村山富市","鳩山由紀夫","菅直人"],["村山富市","細川護熙","原敬","板垣退助"]],"explanations":["【解説1】\n妥当である。55年体制では、自民党は一貫して与党の座にある一方で、国会内で社会党は自民党の半分程度の勢力の野党第一党にとどまった。この状態を指して「1と2分の1政党制」といわれた。","【解説1】\n妥当である。55年体制では、自民党は一貫して与党の座にある一方で、国会内で社会党は自民党の半分程度の勢力の野党第一党にとどまった。この状態を指して「1と2分の1政党制」といわれた。","【解説1】\n妥当である。55年体制では、自民党は一貫して与党の座にある一方で、国会内で社会党は自民党の半分程度の勢力の野党第一党にとどまった。この状態を指して「1と2分の1政党制」といわれた。","【解説2】\n日本初の本格的政党内閣は、第一次憲政擁護運動後に成立した原敬内閣（1918～1921年）。なお、日本初の政党内閣は、板垣退助が内務大臣として入閣したため「隈板内閣」と呼ばれた第一次大隈重信内閣（1898年）である。","【解説2】\n日本初の本格的政党内閣は、第一次憲政擁護運動後に成立した原敬内閣（1918～1921年）。なお、日本初の政党内閣は、板垣退助が内務大臣として入閣したため「隈板内閣」と呼ばれた第一次大隈重信内閣（1898年）である。","【解説2】\n日本初の本格的政党内閣は、第一次憲政擁護運動後に成立した原敬内閣（1918～1921年）。なお、日本初の政党内閣は、板垣退助が内務大臣として入閣したため「隈板内閣」と呼ばれた第一次大隈重信内閣（1898年）である。","【解説3】\n2009年には民主党を中心とする
